<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>steal-the-egg</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Alle poppetjes in één lijst. Bij elk poppetje staat welke teken-functie
    // erbij hoort, zodat we ze met één lus kunnen neerzetten en tekenen.
    const poppetjes = [
      { naam: 'Nine',    teken: tekenNine,    x: 0, y: 0 },
      { naam: 'Stan',    teken: tekenStan,    x: 0, y: 0 },
      { naam: 'Loek',    teken: tekenLoek,    x: 0, y: 0 },
      { naam: 'Elise',   teken: tekenElise,   x: 0, y: 0 },
      { naam: 'Fenne',   teken: tekenFenne,   x: 0, y: 0 },
      { naam: 'Jankees', teken: tekenJankees, x: 0, y: 0 },
    ];

    // Wie je zelf bent. Je kiest dat in het vak bovenaan.
    let gekozen = poppetjes[0];

    // De vakjes om op te klikken, worden bij het tekenen bijgewerkt.
    const knoppen = [];

    // De hoogte waarop iedereen staat.
    let grondY = 0;

    // In welk deel van het spel je bent: 'klas', 'reis' of 'prehistorie'.
    let scene = 'klas';

    // Hoe lang de reis door de tijd al duurt. Na reisDuur seconden ben je er.
    let reisTijd = 0;
    const reisDuur = 10;

    // Welke toetsen op dit moment ingedrukt zijn.
    const toetsen = {};
    // Welke toetsen net dit moment zijn ingedrukt. Handig voor dingen die je
    // één keer per druk wilt doen, zoals een pot oppakken.
    const netGedrukt = {};
    window.addEventListener('keydown', (e) => {
      if (!toetsen[e.key]) netGedrukt[e.key] = true;
      toetsen[e.key] = true;
      if (e.key === ' ') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    // Graven in de prehistorie: hoe diep jij staat en waar het gat zit.
    let diepte = 0;
    let gatX = 0;
    let gatDiepte = 0;
    const maxDiepte = 130;

    // Wat je verzameld en gemaakt hebt.
    let aarde = 0;
    let verzamelTijd = 0;

    // De potten die op de grond staan, elk met zijn eigen plek.
    const potLijst = [];
    // Draag je op dit moment een pot in je handen?
    let potInHand = false;

    // Een pot maken duurt potDuur seconden en kost potKosten aarde.
    let potBezig = false;
    let potTijd = 0;
    const potDuur = 3;
    const potKosten = 3;

    // De sterren die tijdens de reis langs je heen schieten.
    const sterren = [];
    for (let i = 0; i < 160; i++) {
      sterren.push({
        hoek: Math.random() * Math.PI * 2,
        afstand: Math.random() * 500,
        snelheid: 80 + Math.random() * 260,
      });
    }

    // Hoe lang de game al loopt, voor dingen die knipperen of bewegen.
    let tijd = 0;

    // Hoe lang Jankees al aan het gooien is. Eén worp duurt gooiDuur seconden.
    let gooiTijd = 0;
    const gooiDuur = 1.2;

    // Eén bloemetje op haar t-shirt.
    function tekenBloem(x, y, kleur) {
      ctx.fillStyle = kleur;
      for (let i = 0; i < 5; i++) {
        const hoek = (i / 5) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(x + Math.cos(hoek) * 3, y + Math.sin(hoek) * 3, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#f7d774';
      ctx.beginPath();
      ctx.arc(x, y, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Een New Balance schoen met een witte zool en een witte N erop.
    function tekenSchoen(x, y, kleur) {
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.roundRect(x, y, 22, 12, 5);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(x, y + 9, 22, 4, 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('N', x + 8, y + 8);
    }

    // Een witte Asics: witte schoen met schuine strepen op de zijkant.
    function tekenAsics(x, y) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(x, y, 22, 12, 5);
      ctx.fill();
      ctx.strokeStyle = '#cfd3d8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(x + 0.5, y + 0.5, 21, 11, 5);
      ctx.stroke();
      ctx.strokeStyle = '#2f6fd0';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x + 7 + i * 4, y + 9);
        ctx.lineTo(x + 12 + i * 4, y + 2);
        ctx.stroke();
      }
    }

    // Een bruine cowboylaars: hoge schacht met een hak eronder.
    function tekenCowboylaars(x, y) {
      ctx.fillStyle = '#8b5a2b';
      // schacht tot boven de enkel
      ctx.beginPath();
      ctx.roundRect(x + 3, y - 20, 15, 24, 3);
      ctx.fill();
      // voet
      ctx.beginPath();
      ctx.roundRect(x, y - 2, 22, 10, 4);
      ctx.fill();
      // donkere hak
      ctx.fillStyle = '#5c3a1c';
      ctx.fillRect(x + 13, y + 6, 8, 6);
      // stiksel op de schacht
      ctx.strokeStyle = '#e4b97a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 4, y - 14);
      ctx.lineTo(x + 17, y - 14);
      ctx.stroke();
    }

    // De armen van een poppetje. Ben jij dit poppetje, dan gaan de handen omhoog.
    // mouwKleur is de kleur van het shirt, mouwLengte hoe ver de mouw over de arm valt.
    function tekenArmen(x, voetY, omhoog, mouwKleur, mouwLengte = 14) {
      if (omhoog) {
        ctx.lineCap = 'round';
        // de arm loopt schuin omhoog van de schouder naar de hand
        ctx.strokeStyle = '#e8b892';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(x - 19, voetY - 78);
        ctx.lineTo(x - 34, voetY - 116);
        ctx.moveTo(x + 19, voetY - 78);
        ctx.lineTo(x + 34, voetY - 116);
        ctx.stroke();
        // mouw over het bovenste stuk van de arm
        ctx.strokeStyle = mouwKleur;
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.moveTo(x - 19, voetY - 79);
        ctx.lineTo(x - 23, voetY - 79 - mouwLengte);
        ctx.moveTo(x + 19, voetY - 79);
        ctx.lineTo(x + 23, voetY - 79 - mouwLengte);
        ctx.stroke();
        // handen
        ctx.fillStyle = '#e8b892';
        ctx.beginPath();
        ctx.arc(x - 35, voetY - 119, 6, 0, Math.PI * 2);
        ctx.arc(x + 35, voetY - 119, 6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // armen hangen gewoon langs het lijf
        ctx.fillStyle = '#e8b892';
        ctx.fillRect(x - 27, voetY - 78, 8, 30);
        ctx.fillRect(x + 19, voetY - 78, 8, 30);
        ctx.fillStyle = mouwKleur;
        ctx.fillRect(x - 28, voetY - 80, 8, mouwLengte);
        ctx.fillRect(x + 20, voetY - 80, 8, mouwLengte);
      }
    }

    // Nine tekenen: x is haar midden, voetY is de grond onder haar schoenen.
    function tekenNine(x, voetY, omhoog) {
      // schoenen
      tekenSchoen(x - 20, voetY - 12, '#c9ccd2');
      tekenSchoen(x - 2, voetY - 12, '#c9ccd2');

      // benen
      ctx.fillStyle = '#3f5d8a';
      ctx.fillRect(x - 15, voetY - 42, 12, 30);
      ctx.fillRect(x + 3, voetY - 42, 12, 30);

      // grijs t-shirt
      ctx.fillStyle = '#9aa0a8';
      ctx.beginPath();
      ctx.roundRect(x - 22, voetY - 82, 44, 42, 6);
      ctx.fill();

      // armen
      tekenArmen(x, voetY, omhoog, '#9aa0a8');

      // bloemen op het shirt
      tekenBloem(x - 11, voetY - 70, '#e86a8f');
      tekenBloem(x + 8, voetY - 63, '#f2f2f2');
      tekenBloem(x - 4, voetY - 50, '#7fc7e8');

      // nek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 5, voetY - 90, 10, 10);

      // hoofd
      ctx.fillStyle = '#e8b892';
      ctx.beginPath();
      ctx.arc(x, voetY - 102, 18, 0, Math.PI * 2);
      ctx.fill();

      // bruin haar: een kapje over haar hoofd en twee lokken langs haar gezicht
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.arc(x, voetY - 104, 19, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x - 21, voetY - 108, 9, 30, 4);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x + 12, voetY - 108, 9, 30, 4);
      ctx.fill();

      // bruine ogen
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 102, 4, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 102, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 102, 2.2, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 102, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // mond
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, voetY - 95, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // Stan tekenen: PSV-shirt, zwart PSV-broekje en zwarte New Balance schoenen.
    function tekenStan(x, voetY, omhoog) {
      // schoenen
      tekenSchoen(x - 20, voetY - 12, '#1c1c1c');
      tekenSchoen(x - 2, voetY - 12, '#1c1c1c');

      // blote benen onder het korte broekje
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 15, voetY - 30, 12, 18);
      ctx.fillRect(x + 3, voetY - 30, 12, 18);

      // zwart PSV-broekje
      ctx.fillStyle = '#1c1c1c';
      ctx.beginPath();
      ctx.roundRect(x - 20, voetY - 46, 40, 18, 4);
      ctx.fill();

      // PSV-shirt: rood met witte strepen
      ctx.fillStyle = '#e2231a';
      ctx.beginPath();
      ctx.roundRect(x - 22, voetY - 82, 44, 40, 6);
      ctx.fill();
      ctx.save();
      ctx.clip();
      ctx.fillStyle = '#ffffff';
      for (let i = -1; i <= 1; i++) {
        ctx.fillRect(x + i * 15 - 3, voetY - 82, 6, 40);
      }
      ctx.restore();

      // armen
      tekenArmen(x, voetY, omhoog, '#e2231a');

      // nek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 5, voetY - 90, 10, 10);

      // hoofd
      ctx.beginPath();
      ctx.arc(x, voetY - 102, 18, 0, Math.PI * 2);
      ctx.fill();

      // kort bruin haar
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.arc(x, voetY - 104, 19, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(x - 19, voetY - 106, 38, 7);

      // bruine ogen
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 100, 4, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 100, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 100, 2.2, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 100, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // mond
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, voetY - 93, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // Loek tekenen: oranje shirt van het Nederlands elftal, blauw vestje erover,
    // korte broek, kort blond haar en witte Asics.
    function tekenLoek(x, voetY, omhoog) {
      // schoenen
      tekenAsics(x - 20, voetY - 12);
      tekenAsics(x - 2, voetY - 12);

      // blote benen onder de korte broek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 15, voetY - 30, 12, 18);
      ctx.fillRect(x + 3, voetY - 30, 12, 18);

      // witte korte broek
      ctx.fillStyle = '#f2f2f2';
      ctx.beginPath();
      ctx.roundRect(x - 20, voetY - 46, 40, 18, 4);
      ctx.fill();

      // oranje shirt van het Nederlands elftal
      ctx.fillStyle = '#ff7a00';
      ctx.beginPath();
      ctx.roundRect(x - 22, voetY - 82, 44, 40, 6);
      ctx.fill();

      // blauw vestje er open overheen: twee panden langs de zijkanten
      ctx.fillStyle = '#1b4aa8';
      ctx.beginPath();
      ctx.roundRect(x - 23, voetY - 82, 15, 42, 5);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x + 8, voetY - 82, 15, 42, 5);
      ctx.fill();

      // armen
      tekenArmen(x, voetY, omhoog, '#1b4aa8', 20);

      // nek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 5, voetY - 90, 10, 10);

      // hoofd
      ctx.beginPath();
      ctx.arc(x, voetY - 102, 18, 0, Math.PI * 2);
      ctx.fill();

      // kort blond haar
      ctx.fillStyle = '#e8c56a';
      ctx.beginPath();
      ctx.arc(x, voetY - 104, 19, Math.PI, 0);
      ctx.fill();
      ctx.fillRect(x - 19, voetY - 106, 38, 7);

      // ogen
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 100, 4, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 100, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 100, 2.2, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 100, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // mond
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, voetY - 93, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // Elise tekenen: lang bruin haar, paars shirt, zwarte korte broek en bruine cowboylaarzen.
    function tekenElise(x, voetY, omhoog) {
      // cowboylaarzen
      tekenCowboylaars(x - 20, voetY - 12);
      tekenCowboylaars(x - 2, voetY - 12);

      // blote benen boven de laarzen
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 15, voetY - 34, 12, 12);
      ctx.fillRect(x + 3, voetY - 34, 12, 12);

      // zwarte korte broek
      ctx.fillStyle = '#1c1c1c';
      ctx.beginPath();
      ctx.roundRect(x - 20, voetY - 48, 40, 18, 4);
      ctx.fill();

      // paars shirt
      ctx.fillStyle = '#8b46c8';
      ctx.beginPath();
      ctx.roundRect(x - 22, voetY - 82, 44, 40, 6);
      ctx.fill();

      // armen
      tekenArmen(x, voetY, omhoog, '#8b46c8');

      // nek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 5, voetY - 90, 10, 10);

      // hoofd
      ctx.beginPath();
      ctx.arc(x, voetY - 102, 18, 0, Math.PI * 2);
      ctx.fill();

      // lang bruin haar: een kapje plus twee lange lokken tot op haar shirt
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.arc(x, voetY - 104, 19, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x - 22, voetY - 110, 10, 52, 5);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x + 12, voetY - 110, 10, 52, 5);
      ctx.fill();

      // bruine ogen
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 102, 4, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 102, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 102, 2.2, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 102, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // mond
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, voetY - 95, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // Fenne tekenen: lang bruin krullend haar, lichtblauw shirt,
    // donkerblauwe korte broek en zwarte New Balance schoenen.
    function tekenFenne(x, voetY, omhoog) {
      // schoenen
      tekenSchoen(x - 20, voetY - 12, '#1c1c1c');
      tekenSchoen(x - 2, voetY - 12, '#1c1c1c');

      // blote benen onder de korte broek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 15, voetY - 34, 12, 22);
      ctx.fillRect(x + 3, voetY - 34, 12, 22);

      // donkerblauwe korte broek
      ctx.fillStyle = '#1b3a6b';
      ctx.beginPath();
      ctx.roundRect(x - 20, voetY - 48, 40, 18, 4);
      ctx.fill();

      // lichtblauw shirt
      ctx.fillStyle = '#7fc7e8';
      ctx.beginPath();
      ctx.roundRect(x - 22, voetY - 82, 44, 40, 6);
      ctx.fill();

      // armen
      tekenArmen(x, voetY, omhoog, '#7fc7e8');

      // nek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 5, voetY - 90, 10, 10);

      // hoofd
      ctx.beginPath();
      ctx.arc(x, voetY - 102, 18, 0, Math.PI * 2);
      ctx.fill();

      // lang krullend haar: rijen bolletjes langs allebei de kanten naar beneden
      ctx.fillStyle = '#6b4226';
      for (let i = 0; i < 8; i++) {
        const y = voetY - 108 + i * 8;
        ctx.beginPath();
        ctx.arc(x - 17 + Math.sin(i) * 3, y, 8, 0, Math.PI * 2);
        ctx.arc(x + 17 - Math.sin(i) * 3, y, 8, 0, Math.PI * 2);
        ctx.fill();
      }
      // krullenbos boven op haar hoofd
      for (let i = 0; i < 7; i++) {
        const hoek = Math.PI + (i / 6) * Math.PI;
        ctx.beginPath();
        ctx.arc(x + Math.cos(hoek) * 16, voetY - 104 + Math.sin(hoek) * 14, 8, 0, Math.PI * 2);
        ctx.fill();
      }

      // bruine ogen
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 102, 4, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 102, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(x - 6, voetY - 102, 2.2, 0, Math.PI * 2);
      ctx.arc(x + 6, voetY - 102, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // mond
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, voetY - 95, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // De baby die Jankees in zijn arm houdt.
    function tekenBaby(x, y) {
      // dekentje
      ctx.fillStyle = '#f5d76e';
      ctx.beginPath();
      ctx.roundRect(x - 13, y - 4, 26, 16, 7);
      ctx.fill();
      // hoofdje
      ctx.fillStyle = '#f0c9a8';
      ctx.beginPath();
      ctx.arc(x - 8, y - 4, 8, 0, Math.PI * 2);
      ctx.fill();
      // plukje haar
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.arc(x - 8, y - 9, 5, Math.PI, 0);
      ctx.fill();
      // dichte oogjes en een mondje
      ctx.strokeStyle = '#5a3a1a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 4);
      ctx.lineTo(x - 9, y - 4);
      ctx.moveTo(x - 6, y - 4);
      ctx.lineTo(x - 3, y - 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x - 7, y, 2, 0, Math.PI);
      ctx.stroke();
    }

    // Jankees tekenen: krullen, bril, horloge, lange spijkerbroek en een baby in zijn arm.
    // Hij is een volwassene, dus alles wordt 1.3 keer zo groot getekend.
    function tekenJankees(x, voetY, omhoog) {
      ctx.save();
      ctx.translate(x, voetY);
      ctx.scale(1.3, 1.3);

      // schoenen
      tekenSchoen(-20, -12, '#3a3a3a');
      tekenSchoen(-2, -12, '#3a3a3a');

      // lange spijkerbroek
      ctx.fillStyle = '#4a6fa5';
      ctx.fillRect(-16, -48, 13, 36);
      ctx.fillRect(3, -48, 13, 36);

      // Gooit hij? Dan gaan allebei zijn armen omhoog en vliegt de baby los.
      // deelVanDeWorp loopt van 0 (net losgelaten) naar 1 (weer opgevangen).
      const deelVanDeWorp = (gooiTijd % gooiDuur) / gooiDuur;
      // Een boogje: op de helft van de worp is de baby op zijn hoogst.
      const babyHoogte = omhoog ? 4 * 70 * deelVanDeWorp * (1 - deelVanDeWorp) : 0;

      // armen
      ctx.fillStyle = '#e8b892';
      if (omhoog) {
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#e8b892';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(-19, -78);
        ctx.lineTo(-34, -116);
        ctx.moveTo(19, -78);
        ctx.lineTo(34, -116);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-35, -119, 6, 0, Math.PI * 2);
        ctx.arc(35, -119, 6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-27, -78, 8, 30);
        // rechterarm steekt vooruit om de baby vast te houden
        ctx.fillRect(19, -72, 26, 9);
      }

      // trui
      ctx.fillStyle = '#3f7d6b';
      ctx.beginPath();
      ctx.roundRect(-22, -84, 44, 40, 6);
      ctx.fill();

      // mouwen
      if (omhoog) {
        ctx.strokeStyle = '#3f7d6b';
        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.moveTo(-19, -79);
        ctx.lineTo(-24, -95);
        ctx.moveTo(19, -79);
        ctx.lineTo(24, -95);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#3f7d6b';
        ctx.fillRect(-28, -82, 8, 16);
        ctx.fillRect(20, -78, 8, 16);
      }

      // horloge om zijn pols
      ctx.fillStyle = '#2b2b2b';
      if (omhoog) {
        ctx.fillRect(28, -104, 11, 6);
        ctx.fillStyle = '#d8dee6';
        ctx.fillRect(30, -103, 6, 4);
      } else {
        ctx.fillRect(36, -73, 6, 11);
        ctx.fillStyle = '#d8dee6';
        ctx.fillRect(37, -71, 4, 6);
      }

      // de baby: vliegend door de lucht, of gewoon op zijn arm
      if (omhoog) {
        ctx.save();
        ctx.translate(8, -120 - babyHoogte);
        // tijdens de vlucht draait de baby één keer helemaal rond
        ctx.rotate(deelVanDeWorp * Math.PI * 2);
        tekenBaby(8, 0);
        ctx.restore();
      } else {
        tekenBaby(46, -76);
      }

      // nek
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(-5, -92, 10, 10);

      // hoofd
      ctx.beginPath();
      ctx.arc(0, -104, 18, 0, Math.PI * 2);
      ctx.fill();

      // krullen boven op zijn hoofd
      ctx.fillStyle = '#4a3423';
      for (let i = 0; i < 8; i++) {
        const hoek = Math.PI + (i / 7) * Math.PI;
        ctx.beginPath();
        ctx.arc(Math.cos(hoek) * 17, -105 + Math.sin(hoek) * 15, 8, 0, Math.PI * 2);
        ctx.fill();
      }

      // ogen
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-6, -104, 4, 0, Math.PI * 2);
      ctx.arc(6, -104, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(-6, -104, 2.2, 0, Math.PI * 2);
      ctx.arc(6, -104, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // bril: twee glazen met een brug ertussen en pootjes naar de zijkant
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-13, -110, 12, 12, 3);
      ctx.roundRect(1, -110, 12, 12, 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-1, -104);
      ctx.lineTo(1, -104);
      ctx.moveTo(-13, -106);
      ctx.lineTo(-18, -107);
      ctx.moveTo(13, -106);
      ctx.lineTo(18, -107);
      ctx.stroke();

      // mond
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -96, 5, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();

      ctx.restore();
    }

    // De juf voor de klas: haar in een knot, bril, blouse en een lange rok.
    function tekenJuf(x, vloerY) {
      // schoenen
      ctx.fillStyle = '#5c3a1c';
      ctx.beginPath();
      ctx.roundRect(x - 18, vloerY - 10, 16, 10, 4);
      ctx.roundRect(x + 2, vloerY - 10, 16, 10, 4);
      ctx.fill();

      // lange rok
      ctx.fillStyle = '#7a4a7a';
      ctx.beginPath();
      ctx.moveTo(x - 14, vloerY - 54);
      ctx.lineTo(x + 14, vloerY - 54);
      ctx.lineTo(x + 22, vloerY - 10);
      ctx.lineTo(x - 22, vloerY - 10);
      ctx.closePath();
      ctx.fill();

      // armen, de rechter wijst naar het bord
      ctx.strokeStyle = '#e8b892';
      ctx.lineCap = 'round';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(x - 18, vloerY - 78);
      ctx.lineTo(x - 24, vloerY - 50);
      ctx.moveTo(x + 18, vloerY - 78);
      ctx.lineTo(x + 40, vloerY - 92);
      ctx.stroke();

      // aanwijsstok
      ctx.strokeStyle = '#8b5a2b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 38, vloerY - 90);
      ctx.lineTo(x + 78, vloerY - 130);
      ctx.stroke();

      // blouse
      ctx.fillStyle = '#e9e2d0';
      ctx.beginPath();
      ctx.roundRect(x - 20, vloerY - 84, 40, 34, 6);
      ctx.fill();

      // nek en hoofd
      ctx.fillStyle = '#e8b892';
      ctx.fillRect(x - 5, vloerY - 92, 10, 10);
      ctx.beginPath();
      ctx.arc(x, vloerY - 104, 17, 0, Math.PI * 2);
      ctx.fill();

      // haar met een knot achterop
      ctx.fillStyle = '#4a3423';
      ctx.beginPath();
      ctx.arc(x, vloerY - 106, 18, Math.PI, 0);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x - 20, vloerY - 116, 9, 0, Math.PI * 2);
      ctx.fill();

      // bril en gezicht
      ctx.fillStyle = '#5a3a1a';
      ctx.beginPath();
      ctx.arc(x - 6, vloerY - 104, 2, 0, Math.PI * 2);
      ctx.arc(x + 6, vloerY - 104, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x - 12, vloerY - 110, 11, 11, 3);
      ctx.roundRect(x + 1, vloerY - 110, 11, 11, 3);
      ctx.stroke();
      ctx.strokeStyle = '#a8543f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, vloerY - 98, 4, 0.2 * Math.PI, 0.8 * Math.PI);
      ctx.stroke();
    }

    // Waar de tijdmachine staat. Update en draw gebruiken allebei deze plek.
    function tijdmachineX() {
      return Math.min(canvas.width - 110, canvas.width / 2 + 330);
    }

    // Sta je dicht genoeg bij de tijdmachine om in te stappen?
    function bijTijdmachine() {
      return Math.abs(gekozen.x - tijdmachineX()) < 75;
    }

    // De tijdmachine achter in het lokaal: een cabine met een glazen koepel,
    // knipperende lampjes en een grote hendel.
    function tekenTijdmachine(x, vloerY) {
      // voetstuk
      ctx.fillStyle = '#4a4f57';
      ctx.beginPath();
      ctx.roundRect(x - 60, vloerY - 26, 120, 26, 6);
      ctx.fill();

      // cabine
      ctx.fillStyle = '#6f7680';
      ctx.beginPath();
      ctx.roundRect(x - 48, vloerY - 150, 96, 128, 10);
      ctx.fill();
      ctx.strokeStyle = '#3a3f46';
      ctx.lineWidth = 3;
      ctx.stroke();

      // glazen koepel
      ctx.fillStyle = 'rgba(140, 220, 255, 0.55)';
      ctx.beginPath();
      ctx.arc(x, vloerY - 150, 48, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = '#3a3f46';
      ctx.lineWidth = 3;
      ctx.stroke();

      // deur met een rond raampje
      ctx.fillStyle = '#8d949e';
      ctx.beginPath();
      ctx.roundRect(x - 30, vloerY - 120, 60, 96, 8);
      ctx.fill();
      ctx.fillStyle = '#bfe9ff';
      ctx.beginPath();
      ctx.arc(x, vloerY - 96, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#3a3f46';
      ctx.lineWidth = 3;
      ctx.stroke();

      // lampjes die om de beurt aangaan
      for (let i = 0; i < 3; i++) {
        const aan = Math.floor(tijd * 3) % 3 === i;
        ctx.fillStyle = aan ? '#ffd23f' : '#6b5a20';
        ctx.beginPath();
        ctx.arc(x - 20 + i * 20, vloerY - 132, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // hendel aan de zijkant
      ctx.strokeStyle = '#3a3f46';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x + 48, vloerY - 90);
      ctx.lineTo(x + 70, vloerY - 110);
      ctx.stroke();
      ctx.fillStyle = '#e2231a';
      ctx.beginPath();
      ctx.arc(x + 72, vloerY - 112, 7, 0, Math.PI * 2);
      ctx.fill();

      // jaartal op de cabine
      ctx.fillStyle = '#1c1c1c';
      ctx.beginPath();
      ctx.roundRect(x - 34, vloerY - 146, 68, 20, 4);
      ctx.fill();
      ctx.fillStyle = '#3ef08a';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('10000 v.C.', x, vloerY - 131);
      ctx.textAlign = 'left';
    }

    // Het klaslokaal: muur, vloer, schoolbord, raam, klok en een paar tafeltjes.
    function tekenKlaslokaal(vloerY) {
      // muur
      ctx.fillStyle = '#f1e7d6';
      ctx.fillRect(0, 0, canvas.width, vloerY);
      // vloer
      ctx.fillStyle = '#c99a62';
      ctx.fillRect(0, vloerY, canvas.width, canvas.height - vloerY);
      // plint tussen muur en vloer
      ctx.fillStyle = '#9b7444';
      ctx.fillRect(0, vloerY - 10, canvas.width, 10);
      // planken in de vloer
      ctx.strokeStyle = 'rgba(120, 80, 40, 0.35)';
      ctx.lineWidth = 2;
      for (let i = 1; i < 8; i++) {
        ctx.beginPath();
        ctx.moveTo(0, vloerY + i * 22);
        ctx.lineTo(canvas.width, vloerY + i * 22);
        ctx.stroke();
      }

      const midden = canvas.width / 2;

      // schoolbord met een houten lijst
      const bordX = midden - 330;
      const bordY = vloerY - 320;
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.roundRect(bordX - 8, bordY - 8, 316, 156, 6);
      ctx.fill();
      ctx.fillStyle = '#2f4f3f';
      ctx.fillRect(bordX, bordY, 300, 140);
      ctx.fillStyle = '#eaf3ec';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillText('Prehistorie', bordX + 20, bordY + 42);
      ctx.font = '18px sans-serif';
      ctx.fillText('Vandaag: het ei stelen', bordX + 20, bordY + 76);
      // krijtjes op de rand
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bordX + 16, bordY + 142, 18, 5);
      ctx.fillStyle = '#ffd23f';
      ctx.fillRect(bordX + 40, bordY + 142, 18, 5);

      // raam met kruis
      const raamX = midden + 30;
      const raamY = vloerY - 300;
      ctx.fillStyle = '#bfe9ff';
      ctx.fillRect(raamX, raamY, 160, 120);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 6;
      ctx.strokeRect(raamX, raamY, 160, 120);
      ctx.beginPath();
      ctx.moveTo(raamX + 80, raamY);
      ctx.lineTo(raamX + 80, raamY + 120);
      ctx.moveTo(raamX, raamY + 60);
      ctx.lineTo(raamX + 160, raamY + 60);
      ctx.stroke();

      // klok boven het raam
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(midden - 60, vloerY - 330, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1c1c1c';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(midden - 60, vloerY - 330);
      ctx.lineTo(midden - 60, vloerY - 344);
      ctx.moveTo(midden - 60, vloerY - 330);
      ctx.lineTo(midden - 48, vloerY - 330);
      ctx.stroke();
    }

    // Een tafeltje met een stoel, achter in de klas.
    function tekenTafeltje(x, vloerY) {
      ctx.fillStyle = '#d8a86a';
      ctx.fillRect(x - 34, vloerY - 40, 68, 8);
      ctx.fillStyle = '#9b7444';
      ctx.fillRect(x - 30, vloerY - 32, 6, 32);
      ctx.fillRect(x + 24, vloerY - 32, 6, 32);
      // stoel
      ctx.fillStyle = '#b8762f';
      ctx.fillRect(x - 12, vloerY - 22, 26, 6);
      ctx.fillRect(x - 12, vloerY - 44, 6, 22);
      ctx.fillStyle = '#9b7444';
      ctx.fillRect(x - 10, vloerY - 16, 5, 16);
      ctx.fillRect(x + 9, vloerY - 16, 5, 16);
    }

    // De poppetjes op hun startplek in de klas zetten.
    function zetPoppetjesNeer() {
      grondY = canvas.height / 2 + 90;
      const midden = canvas.width / 2;
      const afstand = 105;
      poppetjes.forEach((poppetje, i) => {
        poppetje.x = midden + (i - (poppetjes.length - 1) / 2) * afstand;
        poppetje.y = grondY;
      });
    }

    // Lopen met de pijltjestoetsen. Je blijft altijd binnen het scherm.
    function loopRond(dt) {
      const snelheid = 220;
      if (toetsen['ArrowLeft']) gekozen.x -= snelheid * dt;
      if (toetsen['ArrowRight']) gekozen.x += snelheid * dt;
      gekozen.x = Math.max(60, Math.min(canvas.width - 60, gekozen.x));
      gekozen.y = grondY;
    }

    // Graven met pijltje omlaag, omhoog klimmen met pijltje omhoog.
    function graven(dt) {
      const graafSnelheid = 70;

      if (toetsen['ArrowDown'] && diepte < maxDiepte) {
        // Sta je nog bovenop de grond? Dan begin je hier een nieuw gat.
        if (diepte === 0) {
          gatX = gekozen.x;
          gatDiepte = 0;
        }
        diepte = Math.min(maxDiepte, diepte + graafSnelheid * dt);
        gatDiepte = Math.max(gatDiepte, diepte);
      }

      if (toetsen['ArrowUp'] && diepte > 0) {
        diepte = Math.max(0, diepte - graafSnelheid * dt);
      }

      gekozen.y = grondY + diepte;
    }

    // In het gat verzamel je met de spatiebalk aarde, elke halve seconde een schep.
    function verzamelAarde(dt) {
      if (toetsen[' '] && diepte > 5) {
        verzamelTijd += dt;
        if (verzamelTijd >= 0.5) {
          aarde += 1;
          verzamelTijd = 0;
        }
      } else {
        verzamelTijd = 0;
      }
    }

    // Met de p maak je een pot van je aarde. Dat duurt drie seconden.
    function maakPot(dt) {
      if (toetsen['p'] && !potBezig && aarde >= potKosten) {
        potBezig = true;
        potTijd = 0;
      }
      if (potBezig) {
        potTijd += dt;
        if (potTijd >= potDuur) {
          aarde -= potKosten;
          // de nieuwe pot komt naast je op de grond te staan
          potLijst.push({ x: gekozen.x + 60 });
          potBezig = false;
        }
      }
    }

    // Met de k pak je de pot op die het dichtst bij je staat.
    // Heb je er al een in je handen, dan zet je hem met de k weer neer.
    function pakPotOp() {
      if (!netGedrukt['k']) return;

      if (potInHand) {
        potLijst.push({ x: gekozen.x });
        potInHand = false;
        return;
      }

      // zoek de pot die het dichtst bij staat
      let dichtstbij = -1;
      let kortste = 90;
      potLijst.forEach((pot, i) => {
        const afstand = Math.abs(pot.x - gekozen.x);
        if (afstand < kortste) {
          kortste = afstand;
          dichtstbij = i;
        }
      });
      if (dichtstbij >= 0) {
        potLijst.splice(dichtstbij, 1);
        potInHand = true;
      }
    }

    function update(dt) {
      tijd += dt;

      // Alleen als Jankees gekozen is, is hij aan het gooien.
      if (gekozen.naam === 'Jankees') {
        gooiTijd += dt;
      } else {
        gooiTijd = 0;
      }

      if (scene === 'klas') {
        loopRond(dt);
        // Bij de tijdmachine kun je met de spatiebalk instappen.
        if (bijTijdmachine() && toetsen[' ']) {
          scene = 'reis';
          reisTijd = 0;
        }
      } else if (scene === 'reis') {
        reisTijd += dt;
        // de sterren vliegen naar buiten toe
        for (const ster of sterren) {
          ster.afstand += ster.snelheid * dt;
          if (ster.afstand > canvas.width) ster.afstand = 0;
        }
        if (reisTijd >= reisDuur) {
          scene = 'prehistorie';
          gekozen.x = canvas.width / 2;
        }
      } else {
        // In de prehistorie kun je alleen lopen als je niet in je gat staat.
        if (diepte === 0) loopRond(dt);
        graven(dt);
        verzamelAarde(dt);
        maakPot(dt);
        pakPotOp();
      }

      // De 'net ingedrukt'-toetsen gelden maar één frame.
      for (const toets in netGedrukt) netGedrukt[toets] = false;
    }

    // De naam onder een poppetje.
    function tekenNaam(poppetje) {
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      // wit bordje achter de naam, anders verdwijnt hij in de vloer
      const breedte = ctx.measureText(poppetje.naam).width + 16;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(poppetje.x - breedte / 2, poppetje.y + 10, breedte, 20, 6);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.fillText(poppetje.naam, poppetje.x, poppetje.y + 25);
      ctx.textAlign = 'left';
    }

    // Een lichte vlek achter het poppetje dat jij gekozen hebt.
    function tekenGekozenVlek(poppetje) {
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath();
      ctx.roundRect(poppetje.x - 50, poppetje.y - 165, 100, 200, 12);
      ctx.fill();
      ctx.strokeStyle = '#f0b429';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Het keuzevak bovenaan: voor elk poppetje een knopje met zijn naam.
    function tekenKeuzevak() {
      knoppen.length = 0;
      const knopBreedte = 92;
      const knopHoogte = 34;
      const breedte = poppetjes.length * knopBreedte + 24;
      const hoogte = 84;
      const x = canvas.width / 2 - breedte / 2;
      const y = 24;

      ctx.fillStyle = '#f4f4f6';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, breedte, hoogte, 12);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#111';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Wie wil jij zijn?', canvas.width / 2, y + 24);

      poppetjes.forEach((poppetje, i) => {
        const kx = x + 12 + i * knopBreedte;
        const ky = y + 36;
        const isGekozen = poppetje === gekozen;

        ctx.fillStyle = isGekozen ? '#f0b429' : '#ffffff';
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(kx + 4, ky, knopBreedte - 8, knopHoogte, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#111';
        ctx.font = (isGekozen ? 'bold ' : '') + '14px sans-serif';
        ctx.fillText(poppetje.naam, kx + knopBreedte / 2, ky + 22);

        knoppen.push({ poppetje, x: kx + 4, y: ky, breedte: knopBreedte - 8, hoogte: knopHoogte });
      });
      ctx.textAlign = 'left';
    }

    // Klikken in het keuzevak kiest een ander poppetje.
    canvas.addEventListener('click', (e) => {
      if (scene !== 'klas') return;
      for (const knop of knoppen) {
        if (e.offsetX >= knop.x && e.offsetX <= knop.x + knop.breedte &&
            e.offsetY >= knop.y && e.offsetY <= knop.y + knop.hoogte) {
          gekozen = knop.poppetje;
        }
      }
    });

    // Een tekstballon met een tip erin.
    function tekenTip(tekst, x, y) {
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      const breedte = ctx.measureText(tekst).width + 28;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - breedte / 2, y - 16, breedte, 32, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.fillText(tekst, x, y + 6);
      ctx.textAlign = 'left';
    }

    // Scene 1: het klaslokaal.
    function tekenKlasScene() {
      tekenKlaslokaal(grondY);
      tekenTafeltje(canvas.width / 2 - 250, grondY - 8);
      tekenTafeltje(canvas.width / 2 - 130, grondY - 8);
      tekenTijdmachine(tijdmachineX(), grondY - 8);
      tekenJuf(Math.max(120, canvas.width / 2 - 400), grondY - 8);

      tekenGekozenVlek(gekozen);
      for (const poppetje of poppetjes) {
        poppetje.teken(poppetje.x, poppetje.y, poppetje === gekozen);
        tekenNaam(poppetje);
      }
      tekenKeuzevak();

      if (bijTijdmachine()) {
        tekenTip('Druk op de spatiebalk om in te stappen', tijdmachineX(), grondY - 200);
      } else {
        tekenTip('Loop met de pijltjes naar de tijdmachine', canvas.width / 2, canvas.height - 40);
      }
    }

    // Scene 2: tien seconden door de tijd reizen.
    function tekenReisScene() {
      ctx.fillStyle = '#05060f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const midden = canvas.width / 2;
      const middenY = canvas.height / 2;

      // Elke ster is een streepje dat vanuit het midden naar buiten schiet.
      for (const ster of sterren) {
        const x = midden + Math.cos(ster.hoek) * ster.afstand;
        const y = middenY + Math.sin(ster.hoek) * ster.afstand;
        const staartX = midden + Math.cos(ster.hoek) * (ster.afstand - 28);
        const staartY = middenY + Math.sin(ster.hoek) * (ster.afstand - 28);
        ctx.strokeStyle = 'rgba(255, 255, 255, ' + Math.min(1, ster.afstand / 300) + ')';
        ctx.lineWidth = Math.min(3, ster.afstand / 150);
        ctx.beginPath();
        ctx.moveTo(staartX, staartY);
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      // jij zweeft in het midden mee
      const zweef = Math.sin(tijd * 2) * 12;
      gekozen.teken(midden, middenY + 120 + zweef, true);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Op reis naar de prehistorie...', midden, 90);
      ctx.font = 'bold 24px monospace';
      ctx.fillStyle = '#3ef08a';
      ctx.fillText('nog ' + Math.ceil(reisDuur - reisTijd) + ' seconden', midden, 130);
      ctx.textAlign = 'left';
    }

    // Een varen: een paar bladeren die uit één punt omhoog waaieren.
    function tekenVaren(x, vloerY, grootte) {
      ctx.strokeStyle = '#2f6b3a';
      ctx.lineCap = 'round';
      ctx.lineWidth = 5;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x, vloerY);
        ctx.quadraticCurveTo(x + i * grootte * 0.5, vloerY - grootte,
                             x + i * grootte, vloerY - grootte * 0.4);
        ctx.stroke();
      }
    }

    // Een kleipot.
    function tekenPot(x, y, grootte) {
      ctx.fillStyle = '#b5623a';
      ctx.beginPath();
      ctx.ellipse(x, y - grootte * 0.5, grootte * 0.55, grootte * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(x - grootte * 0.35, y - grootte * 1.15, grootte * 0.7, grootte * 0.45, 3);
      ctx.fill();
      ctx.strokeStyle = '#8d4426';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(x, y - grootte * 1.1, grootte * 0.36, grootte * 0.14, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Het gat dat je gegraven hebt.
    function tekenGat() {
      if (gatDiepte <= 0) return;
      ctx.fillStyle = '#6b4a2a';
      ctx.beginPath();
      ctx.roundRect(gatX - 48, grondY - 4, 96, gatDiepte + 40, 8);
      ctx.fill();
      // donkere bodem, zodat het gat diep lijkt
      ctx.fillStyle = '#4a3423';
      ctx.beginPath();
      ctx.roundRect(gatX - 48, grondY + gatDiepte + 14, 96, 22, 8);
      ctx.fill();
      // hoopje aarde naast het gat
      ctx.fillStyle = '#7a5532';
      ctx.beginPath();
      ctx.arc(gatX + 66, grondY + 6, 18, Math.PI, 0);
      ctx.fill();
    }

    // Het kastje met je aarde en je potten, plus de balk als je aan het pottenbakken bent.
    function tekenSpullen() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(20, 20, 190, 60, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('Aarde: ' + aarde, 36, 46);
      ctx.fillText('Potten: ' + (potLijst.length + (potInHand ? 1 : 0)), 36, 70);
      tekenPot(180, 70, 30);

      if (potBezig) {
        const deel = potTijd / potDuur;
        const x = gekozen.x - 60;
        const y = gekozen.y - 170;
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#111';
        ctx.beginPath();
        ctx.roundRect(x, y, 120, 26, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#b5623a';
        ctx.beginPath();
        ctx.roundRect(x + 3, y + 3, 114 * deel, 20, 6);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('pot maken...', x + 60, y + 18);
        ctx.textAlign = 'left';
      }
    }

    // Scene 3: de prehistorie.
    function tekenPrehistorieScene() {
      // lucht
      const lucht = ctx.createLinearGradient(0, 0, 0, grondY);
      lucht.addColorStop(0, '#f6b26b');
      lucht.addColorStop(1, '#f9e0a8');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, canvas.width, grondY);

      // zon
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.arc(canvas.width - 160, 120, 46, 0, Math.PI * 2);
      ctx.fill();

      // heuvels achter de vulkaan
      ctx.fillStyle = '#9c7b5a';
      ctx.beginPath();
      ctx.moveTo(0, grondY);
      ctx.lineTo(180, grondY - 150);
      ctx.lineTo(360, grondY);
      ctx.closePath();
      ctx.fill();

      // vulkaan met rook
      ctx.fillStyle = '#6e5442';
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 + 60, grondY);
      ctx.lineTo(canvas.width / 2 + 230, grondY - 260);
      ctx.lineTo(canvas.width / 2 + 400, grondY);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e2231a';
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 + 205, grondY - 255);
      ctx.lineTo(canvas.width / 2 + 230, grondY - 190);
      ctx.lineTo(canvas.width / 2 + 255, grondY - 255);
      ctx.closePath();
      ctx.fill();
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = 'rgba(180, 180, 180, 0.5)';
        ctx.beginPath();
        ctx.arc(canvas.width / 2 + 230 + Math.sin(tijd + i) * 18,
                grondY - 290 - i * 40, 18 + i * 6, 0, Math.PI * 2);
        ctx.fill();
      }

      // grond
      ctx.fillStyle = '#5c8f4a';
      ctx.fillRect(0, grondY, canvas.width, canvas.height - grondY);
      ctx.fillStyle = '#4a7a3c';
      ctx.fillRect(0, grondY, canvas.width, 10);

      // varens en stenen
      tekenVaren(90, grondY + 10, 40);
      tekenVaren(canvas.width - 90, grondY + 20, 52);
      tekenVaren(canvas.width / 2 - 320, grondY + 30, 34);
      ctx.fillStyle = '#8d949e';
      ctx.beginPath();
      ctx.arc(240, grondY + 30, 26, Math.PI, 0);
      ctx.arc(canvas.width - 260, grondY + 44, 18, Math.PI, 0);
      ctx.fill();

      // een pterodactyl in de verte
      const vogelX = (tijd * 60) % (canvas.width + 200) - 100;
      ctx.strokeStyle = '#4a3423';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(vogelX - 18, 180);
      ctx.quadraticCurveTo(vogelX, 180 + Math.sin(tijd * 6) * 12, vogelX + 18, 180);
      ctx.stroke();

      // het gat waar je in staat
      tekenGat();

      // de potten die je gemaakt hebt staan op de grond
      for (const pot of potLijst) {
        tekenPot(pot.x, grondY + 30, 30);
      }

      // jij, in je eentje in de prehistorie
      gekozen.teken(gekozen.x, gekozen.y, true);
      tekenNaam(gekozen);

      // draag je een pot? Dan houd je hem boven je hoofd.
      if (potInHand) {
        tekenPot(gekozen.x, gekozen.y - 118, 30);
      }

      ctx.fillStyle = '#1c1c1c';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Welkom in de prehistorie, ' + gekozen.naam + '!', canvas.width / 2, 60);
      ctx.textAlign = 'left';

      tekenSpullen();
      tekenTip('pijltjes: lopen en graven  ·  spatie: aarde  ·  p: pot maken  ·  k: pot oppakken',
               canvas.width / 2, canvas.height - 30);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (scene === 'klas') {
        tekenKlasScene();
      } else if (scene === 'reis') {
        tekenReisScene();
      } else {
        tekenPrehistorieScene();
      }
    }

    // De poppetjes op hun plek zetten, ook als het venster van grootte verandert.
    window.addEventListener('resize', zetPoppetjesNeer);
    zetPoppetjesNeer();

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
