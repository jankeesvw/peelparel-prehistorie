<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>team-de-grottekenaars</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // De oermens: positie en aantal levens
    const mens = {
      x: 200,
      y: 0, // wordt in draw op de bodem gezet
      levens: 3,
    };

    function update(dt) {
      // spel-logica
    }

    function tekenGrot() {
      const b = canvas.width;
      const h = canvas.height;

      // Donkere achtergrond: diep in de grot
      ctx.fillStyle = '#1a1210';
      ctx.fillRect(0, 0, b, h);

      // Zachte gloed in het midden, alsof er licht van buiten naar binnen valt
      const gloed = ctx.createRadialGradient(b / 2, h / 2, 50, b / 2, h / 2, b * 0.6);
      gloed.addColorStop(0, '#5a3d2b');
      gloed.addColorStop(1, '#1a1210');
      ctx.fillStyle = gloed;
      ctx.fillRect(0, 0, b, h);

      // Rotsbodem
      ctx.fillStyle = '#3d2b1f';
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, h * 0.8);
      for (let x = 0; x <= b; x += 80) {
        ctx.lineTo(x + 40, h * 0.8 + 15);
        ctx.lineTo(x + 80, h * 0.8);
      }
      ctx.lineTo(b, h);
      ctx.closePath();
      ctx.fill();

      // Stalactieten aan het plafond
      ctx.fillStyle = '#2b1d15';
      for (let x = 30; x < b; x += 90) {
        const lengte = 60 + (x * 7) % 80;
        ctx.beginPath();
        ctx.moveTo(x - 25, 0);
        ctx.lineTo(x + 25, 0);
        ctx.lineTo(x, lengte);
        ctx.closePath();
        ctx.fill();
      }

      // Stalagmieten op de bodem
      for (let x = 70; x < b; x += 130) {
        const hoogte = 40 + (x * 3) % 50;
        ctx.beginPath();
        ctx.moveTo(x - 20, h * 0.8);
        ctx.lineTo(x + 20, h * 0.8);
        ctx.lineTo(x, h * 0.8 - hoogte);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Grotschilderingen op de achterwand, in oker en roodbruin
    function tekenGrotTekeningen() {
      const b = canvas.width;
      const h = canvas.height;
      const oker = '#c8792a';
      const roodbruin = '#8e3b2a';

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Mammoet: dikke romp, kop met slurf en gebogen slagtanden
      const mx = b * 0.55;
      const my = h * 0.42;
      ctx.fillStyle = roodbruin;
      ctx.beginPath();
      ctx.ellipse(mx, my, 90, 55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(mx + 85, my - 25, 35, 0, Math.PI * 2); // kop
      ctx.fill();
      ctx.strokeStyle = roodbruin;
      ctx.lineWidth = 12;
      for (const px of [mx - 55, mx - 20, mx + 20, mx + 55]) { // poten
        ctx.beginPath();
        ctx.moveTo(px, my + 40);
        ctx.lineTo(px, my + 95);
        ctx.stroke();
      }
      ctx.lineWidth = 10;
      ctx.beginPath(); // slurf
      ctx.moveTo(mx + 115, my - 15);
      ctx.quadraticCurveTo(mx + 150, my + 20, mx + 130, my + 70);
      ctx.stroke();
      ctx.strokeStyle = oker;
      ctx.lineWidth = 6;
      ctx.beginPath(); // slagtand
      ctx.moveTo(mx + 105, my);
      ctx.quadraticCurveTo(mx + 170, my + 10, mx + 150, my - 35);
      ctx.stroke();

      // Hert: klein lijf, dunne poten en een gewei
      const hx = b * 0.25;
      const hy = h * 0.4;
      ctx.fillStyle = oker;
      ctx.beginPath();
      ctx.ellipse(hx, hy, 45, 25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = oker;
      ctx.lineWidth = 5;
      for (const px of [hx - 30, hx - 15, hx + 15, hx + 30]) {
        ctx.beginPath();
        ctx.moveTo(px, hy + 20);
        ctx.lineTo(px, hy + 65);
        ctx.stroke();
      }
      ctx.beginPath(); // nek en kop
      ctx.moveTo(hx + 40, hy - 10);
      ctx.lineTo(hx + 65, hy - 45);
      ctx.lineTo(hx + 85, hy - 40);
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath(); // gewei
      ctx.moveTo(hx + 65, hy - 45);
      ctx.lineTo(hx + 55, hy - 80);
      ctx.moveTo(hx + 60, hy - 65);
      ctx.lineTo(hx + 45, hy - 75);
      ctx.moveTo(hx + 65, hy - 45);
      ctx.lineTo(hx + 80, hy - 80);
      ctx.moveTo(hx + 72, hy - 65);
      ctx.lineTo(hx + 88, hy - 70);
      ctx.stroke();

      // Jagers: stokfiguurtjes met een speer
      ctx.strokeStyle = roodbruin;
      ctx.lineWidth = 4;
      for (let i = 0; i < 3; i++) {
        const jx = b * 0.72 + i * 55;
        const jy = h * 0.55;
        ctx.beginPath();
        ctx.arc(jx, jy - 40, 7, 0, Math.PI * 2); // hoofd
        ctx.moveTo(jx, jy - 33);
        ctx.lineTo(jx, jy); // lijf
        ctx.moveTo(jx, jy);
        ctx.lineTo(jx - 12, jy + 25); // benen
        ctx.moveTo(jx, jy);
        ctx.lineTo(jx + 12, jy + 25);
        ctx.moveTo(jx, jy - 25);
        ctx.lineTo(jx - 18, jy - 5); // armen
        ctx.moveTo(jx, jy - 25);
        ctx.lineTo(jx + 20, jy - 35);
        ctx.moveTo(jx + 5, jy - 10); // speer
        ctx.lineTo(jx + 35, jy - 60);
        ctx.stroke();
      }

      // Handafdrukken: een cirkel met vijf vingers
      ctx.fillStyle = oker;
      for (const [hxp, hyp] of [[b * 0.12, h * 0.6], [b * 0.9, h * 0.35], [b * 0.4, h * 0.62]]) {
        ctx.beginPath();
        ctx.arc(hxp, hyp, 14, 0, Math.PI * 2);
        ctx.fill();
        for (let v = 0; v < 5; v++) {
          const hoek = -Math.PI * 0.9 + v * Math.PI * 0.2;
          ctx.beginPath();
          ctx.ellipse(hxp + Math.cos(hoek) * 20, hyp + Math.sin(hoek) * 20, 5, 12, hoek + Math.PI / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function tekenMens() {
      const x = mens.x;
      const voeten = canvas.height * 0.8; // de mens staat op de rotsbodem

      // Benen
      ctx.strokeStyle = '#c68642';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, voeten - 60);
      ctx.lineTo(x - 15, voeten);
      ctx.moveTo(x, voeten - 60);
      ctx.lineTo(x + 15, voeten);
      ctx.stroke();

      // Lijf met dierenvel
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.moveTo(x - 22, voeten - 60);
      ctx.lineTo(x + 22, voeten - 60);
      ctx.lineTo(x + 16, voeten - 120);
      ctx.lineTo(x - 16, voeten - 120);
      ctx.closePath();
      ctx.fill();

      // Armen
      ctx.beginPath();
      ctx.moveTo(x - 14, voeten - 110);
      ctx.lineTo(x - 35, voeten - 70);
      ctx.moveTo(x + 14, voeten - 110);
      ctx.lineTo(x + 35, voeten - 70);
      ctx.stroke();

      // Knots in de rechterhand
      ctx.strokeStyle = '#5c3a1a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(x + 35, voeten - 70);
      ctx.lineTo(x + 60, voeten - 130);
      ctx.stroke();

      // Hoofd
      ctx.fillStyle = '#c68642';
      ctx.beginPath();
      ctx.arc(x, voeten - 145, 25, 0, Math.PI * 2);
      ctx.fill();

      // Wilde haren
      ctx.fillStyle = '#3b2412';
      ctx.beginPath();
      ctx.arc(x, voeten - 155, 27, Math.PI, Math.PI * 2);
      ctx.fill();

      // Ogen
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(x - 8, voeten - 148, 3, 0, Math.PI * 2);
      ctx.arc(x + 8, voeten - 148, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function tekenHart(x, y, grootte) {
      ctx.beginPath();
      ctx.moveTo(x, y + grootte);
      ctx.bezierCurveTo(x - grootte * 1.5, y - grootte * 0.2, x - grootte * 0.6, y - grootte * 1.2, x, y - grootte * 0.3);
      ctx.bezierCurveTo(x + grootte * 0.6, y - grootte * 1.2, x + grootte * 1.5, y - grootte * 0.2, x, y + grootte);
      ctx.closePath();
      ctx.fill();
    }

    function tekenLevens() {
      for (let i = 0; i < mens.levens; i++) {
        ctx.fillStyle = '#e63946';
        tekenHart(40 + i * 50, 40, 18);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenGrot();
      tekenGrotTekeningen();
      tekenMens();
      tekenLevens();
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
