      draagt: {},    // { hoedjes: 'feesthoedje', ... } of niets
      rij: 0,        // gekozen categorie in de kast
      kolom: 0,      // gekozen spul in die categorie
    };

    function bewaarSpullen() {
      try {
        localStorage.setItem('grottekenaars', JSON.stringify({ munten, bezit: kast.bezit, draagt: kast.draagt }));
      } catch (e) { /* opslaan lukt niet, geen ramp */ }
    }

    function laadSpullen() {
      try {
        const data = JSON.parse(localStorage.getItem('grottekenaars'));
        if (!data) return;
        munten = data.munten || 0;
        kast.bezit = data.bezit || {};
        kast.draagt = data.draagt || {};
      } catch (e) { /* niets bewaard */ }
    }
    laadSpullen();

    // Welk spul draagt de mens in deze categorie? Geeft het id of null.
    function draagt(categorie) {
      return kast.draagt[categorie] || null;
    }

    // Het gekozen spul in de kast
    function gekozenSpul() {
      const cat = kast.categorieen[kast.rij];
      return kast.spullen[cat][kast.kolom];
    }

    // Enter in de kast: kopen als je het nog niet hebt, anders aan- of uittrekken
    function kiesSpul() {
      const cat = kast.categorieen[kast.rij];
      const spul = gekozenSpul();
      if (!kast.bezit[spul.id]) {
        if (munten >= spul.prijs) {
          munten -= spul.prijs;
          kast.bezit[spul.id] = true;
          kast.draagt[cat] = spul.id;
        }
      } else if (kast.draagt[cat] === spul.id) {
        delete kast.draagt[cat];
      } else {
        kast.draagt[cat] = spul.id;
      }
      bewaarSpullen();
    }

    // Toetsen in de kast: pijltjes kiezen, Enter koopt of trekt aan, C of Escape sluit
    function kastToets(key) {
      const cat = kast.categorieen[kast.rij];
      if (key === 'ArrowUp') kast.rij = (kast.rij + kast.categorieen.length - 1) % kast.categorieen.length;
      if (key === 'ArrowDown') kast.rij = (kast.rij + 1) % kast.categorieen.length;
      if (key === 'ArrowLeft') kast.kolom = Math.max(0, kast.kolom - 1);
      if (key === 'ArrowRight') kast.kolom = Math.min(kast.spullen[cat].length - 1, kast.kolom + 1);
      kast.kolom = Math.min(kast.kolom, kast.spullen[kast.categorieen[kast.rij]].length - 1);
      if (key === 'Enter') kiesSpul();
      if (key === 'c' || key === 'Escape') kastOpen = false;
    }

    // Muntjes van een level: eentje boven elk platform en een rij langs de grond
    function maakMunten() {
      const lv = level();
      if (lv.munten) return;
      lv.munten = [];
      for (const pl of lv.platforms) {
        lv.munten.push({ x: pl.x + pl.breedte / 2, y: pl.y - 0.07, gepakt: false });
      }
      const stap = 0.30 / lv.schermen;
      for (let x = 0.15; x < 0.85; x += stap) {
        lv.munten.push({ x, y: 0.70, gepakt: false });
      }
    }

    function pakMunten() {
      const b = levelBreedte();
      const h = canvas.height;
      for (const m of level().munten) {
        if (m.gepakt) continue;
        const mx = m.x * b;
        const my = m.y * h;
        if (Math.abs(mens.x - mx) < 30 && my > mens.y - 170 && my < mens.y + 10) {
          m.gepakt = true;
          munten += 1;
          bewaarSpullen();
        }
      }
    }

        return;

      if (e.key === 'k' && !toetsen['k']) kNetIngedrukt = true;
      toetsen[e.key] = true;

    function level() {
      return levels[huidigLevel];
    }

    function bodemHoogte() {
      return canvas.height * 0.8;
    }

    // Hoe breed is het hele level in pixels?
    function levelBreedte() {
      return canvas.width * level().schermen;
    }

    // De camera kijkt naar de mens, maar niet voorbij de randen van het level
    function cameraX() {
      const x = mens.x - canvas.width / 2;
      return Math.max(0, Math.min(levelBreedte() - canvas.width, x));
    }

    function startOpnieuw() {
      mens.x = 60;
      mens.y = bodemHoogte();
      mens.vy = 0;
    }

    // Alle beesten in het level weer tot leven wekken
    function beestenTerug() {
      for (const ob of level().obstakels) ob.dood = false;
      for (const lv of levels) lv.munten = null; // muntjes komen terug bij een nieuw level of herstart
    }

    // Staat de mens boven een gat?
    function bovenGat() {
      const b = levelBreedte();
      return level().gaten.some((g) => mens.x > g.x * b && mens.x < (g.x + g.breedte) * b);
    }

    // Het laatste platform van het level, daar staat de vlag
    function vlagPlatform() {
      const pls = level().platforms;
      return pls[pls.length - 1];
    }

    function update(dt) {
      maakMunten();
      pakMunten();
      mens.loopt = false;
      if (toetsen['ArrowLeft'] || toetsen['a']) {
        mens.x -= mens.snelheid * snelheidFactor() * dt;
        mens.richting = -1;
        mens.loopt = true;
      }
      if (toetsen['ArrowRight'] || toetsen['d']) {
        mens.x += mens.snelheid * snelheidFactor() * dt;
        mens.richting = 1;
        mens.loopt = true;
      }
      if (mens.loopt) mens.stap += dt * 12;

      // Niet buiten het level lopen
      mens.x = Math.max(40, Math.min(levelBreedte() - 40, mens.x));

      // Gewoon springen: spatie indrukken terwijl je op de grond staat
      if (spatieNetIngedrukt && mens.opDeGrond) {
        mens.vy = -springKracht;
        mens.opDeGrond = false;
      }
      spatieNetIngedrukt = false;

      // Slaan met de knots op K. Een beest dat je raakt gaat dood en geeft een leven erbij.
      if (kNetIngedrukt && mens.slaat <= 0) {
        mens.slaat = slagDuur;
      }
      kNetIngedrukt = false;
      if (mens.slaat > 0) {
        mens.slaat -= dt;
        for (const ob of level().obstakels) {
          if (ob.soort !== 'beest' || ob.dood) continue;
          const pos = obstakelPositie(ob);
          const voor = (pos.x - mens.x) * mens.richting; // afstand vóór de mens
          if (voor > -10 && voor < 100 && Math.abs(pos.y - mens.y) < 80) {
            ob.dood = true;
            mens.levens = Math.min(maxLevens, mens.levens + 1);
          }
        }
      }

      // Power-jump: spatie ingedrukt houden terwijl je op de grond staat laadt de meter op.
      // Laat je los als de meter vol is, dan spring je extra hoog.
      if (mens.opDeGrond) {
        if (toetsen[' ']) {
          mens.lading = Math.min(1, mens.lading + dt / laadTijd);
        } else {
          if (mens.lading >= 1) {
            mens.vy = -powerJumpKracht;
            mens.opDeGrond = false;
          }
          mens.lading = 0;
        }
      } else {
        mens.lading = 0;
      }

      // Zwaartekracht
      const vorigeY = mens.y;
      mens.vy += zwaartekracht * dt;
      mens.y += mens.vy * dt;
      mens.opDeGrond = false;

      // Landen op de bodem (behalve boven een gat)
      if (mens.y >= bodemHoogte() && !bovenGat()) {
        mens.y = bodemHoogte();
        mens.vy = 0;
        mens.opDeGrond = true;
      }

      // Landen op een platform: alleen als je naar beneden beweegt
      // en je voeten in deze stap door de bovenkant van het platform gaan
      let staatOp = null;
      for (const pl of level().platforms) {
        const px = pl.x * levelBreedte();
        const pBreedte = pl.breedte * levelBreedte();
        const py = pl.y * canvas.height;
        const erboven = mens.x > px && mens.x < px + pBreedte;
        if (mens.vy >= 0 && erboven && vorigeY <= py && mens.y >= py) {
          mens.y = py;
          mens.vy = 0;
          mens.opDeGrond = true;
          staatOp = pl;
        }
      }

      // Bij de vlag: volgend level
      if (staatOp === vlagPlatform()) {
        huidigLevel += 1;
        if (huidigLevel >= levels.length) {
          huidigLevel = levels.length - 1;
          gewonnen = true;
        }
        beestenTerug();
        startOpnieuw();
      }

      // In een gat gevallen, of de lava aangeraakt: een leven kwijt
      const inLava = level().lava && bovenGat() && mens.y > bodemHoogte() + 10;
      if (mens.y > canvas.height + 50 || inLava) {
        verliesLeven();
      }

      // Tegen een obstakel aan gelopen
      if (raaktObstakel()) {
        verliesLeven();
      }
    }

    // Op een skateboard ga je 25% sneller
    function snelheidFactor() {
      return draagt('skateboards') ? 1.25 : 1;
    }

    function verliesLeven() {
      mens.levens -= 1;
      if (mens.levens <= 0) {
        gameOver = true;
      } else {
        startOpnieuw();
      }
    }

    // Waar is een obstakel op dit moment? Geeft x, y (onderkant) en de helft van de breedte/hoogte.
    function obstakelPositie(ob) {
      const b = levelBreedte();
      const h = canvas.height;
      const tijd = performance.now() / 1000;
      if (ob.soort === 'stekels') {
        return { x: (ob.x + ob.breedte / 2) * b, y: bodemHoogte(), halfBreed: ob.breedte * b / 2, hoog: 30 };
      }
      if (ob.soort === 'beest') {
        // Heen en weer lopen over het bereik
        const deel = 0.5 + 0.5 * Math.sin(tijd * ob.snelheid);
        const richting = Math.cos(tijd * ob.snelheid) >= 0 ? 1 : -1;
        return { x: (ob.x + ob.bereik * deel) * b, y: bodemHoogte(), halfBreed: 30, hoog: 55, richting };
      }
      // Vallend: steeds opnieuw van het plafond naar de bodem
      const deel = (tijd / ob.periode) % 1;
      const y = deel * deel * h; // steeds sneller, net als echt vallen
      return { x: ob.x * b, y, halfBreed: 18, hoog: 40 };
    }

    function raaktObstakel() {
      for (const ob of level().obstakels) {
        if (ob.dood) continue;
        const pos = obstakelPositie(ob);
        // De mens is ongeveer 40 breed en 170 hoog, gemeten vanaf de voeten
        const overlapX = Math.abs(mens.x - pos.x) < pos.halfBreed + 15;
        const overlapY = mens.y > pos.y - pos.hoog && mens.y - 170 < pos.y;
        if (overlapX && overlapY) return true;
      }
      return false;
    }

    // Lucht en bodem in de kleuren van het level
    function tekenLucht() {
      const lv = level();
      const lucht = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.8);
      if (lv.decoratie === 'superdisco') {
        // Regenbooglucht die van kleur verandert
        const t = performance.now() / 1000;
        lucht.addColorStop(0, `hsl(${(t * 60) % 360}, 80%, 25%)`);
        lucht.addColorStop(1, `hsl(${(t * 60 + 120) % 360}, 80%, 45%)`);
      } else {
        lucht.addColorStop(0, lv.lucht[0]);
        lucht.addColorStop(1, lv.lucht[1]);
      }
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function tekenAchtergrond() {
      const b = levelBreedte();
      const h = canvas.height;
      const lv = level();

      tekenDecoratie();

      // Hobbelige bodem
      ctx.fillStyle = lv.bodem;
      ctx.beginPath();
      ctx.moveTo(0, h);
      ctx.lineTo(0, h * 0.8);
      for (let x = 0; x <= b; x += 80) {
        ctx.lineTo(x + 40, h * 0.8 + 15);
        ctx.lineTo(x + 80, h * 0.8);
      }
      ctx.lineTo(b, h);
      ctx.closePath();
      ctx.fill();
    }

    // Per thema een paar simpele vormen op de achtergrond
    function tekenDecoratie() {
      const b = levelBreedte();
      const h = canvas.height;
      const soort = level().decoratie;

      if (soort === 'grot') {
        ctx.fillStyle = '#2b1d15';
        for (let x = 30; x < b; x += 90) { // stalactieten
          const lengte = 60 + (x * 7) % 80;
          ctx.beginPath();
          ctx.moveTo(x - 25, 0); ctx.lineTo(x + 25, 0); ctx.lineTo(x, lengte);
          ctx.closePath(); ctx.fill();
        }
        tekenGrotTekeningen();
      }

      if (soort === 'ijs') {
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 60; i++) { // sneeuwvlokken
          const x = (i * 137) % b;
          const y = (i * 91) % (h * 0.8);
          ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#9fc9e8';
        for (const x of [0.05, 0.75]) { // ijsbergen
          ctx.beginPath();
          ctx.moveTo(x * b, h * 0.8); ctx.lineTo((x + 0.08) * b, h * 0.45); ctx.lineTo((x + 0.18) * b, h * 0.8);
          ctx.closePath(); ctx.fill();
        }
      }

      if (soort === 'steppe') {
        ctx.fillStyle = '#ffd54a'; // zon
        ctx.beginPath(); ctx.arc(b * 0.85, h * 0.15, 50, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#6b7a2a'; ctx.lineWidth = 3; // graspollen
        for (let x = 10; x < b; x += 45) {
          ctx.beginPath();
          ctx.moveTo(x, h * 0.8); ctx.lineTo(x - 6, h * 0.8 - 22);
          ctx.moveTo(x, h * 0.8); ctx.lineTo(x + 7, h * 0.8 - 25);
          ctx.stroke();
        }
      }

      if (soort === 'vulkaan') {
        ctx.fillStyle = '#3a1a1a'; // vulkaan
        ctx.beginPath();
        ctx.moveTo(b * 0.3, h * 0.8); ctx.lineTo(b * 0.5, h * 0.2); ctx.lineTo(b * 0.7, h * 0.8);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff6a00'; // lava uit de top
        ctx.beginPath();
        ctx.moveTo(b * 0.47, h * 0.22); ctx.lineTo(b * 0.53, h * 0.22); ctx.lineTo(b * 0.55, h * 0.4); ctx.lineTo(b * 0.45, h * 0.4);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffb347'; // rondvliegende vonken
        for (let i = 0; i < 25; i++) {
          ctx.beginPath(); ctx.arc((i * 173) % b, (i * 67) % (h * 0.5), 3, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (soort === 'moeras') {
        ctx.strokeStyle = '#2f5a2a'; ctx.lineWidth = 4; // riet
        for (let x = 20; x < b; x += 60) {
          ctx.beginPath(); ctx.moveTo(x, h * 0.8); ctx.lineTo(x + 5, h * 0.62); ctx.stroke();
          ctx.fillStyle = '#5a3a1a';
          ctx.fillRect(x + 1, h * 0.62, 8, 20);
        }
        ctx.fillStyle = '#2f6b3a'; // een dino in de verte
        ctx.beginPath(); ctx.ellipse(b * 0.5, h * 0.35, 70, 30, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(b * 0.55, h * 0.33); ctx.lineTo(b * 0.62, h * 0.18); ctx.lineTo(b * 0.66, h * 0.2); ctx.lineTo(b * 0.58, h * 0.36); ctx.fill();
        ctx.beginPath(); ctx.moveTo(b * 0.44, h * 0.35); ctx.lineTo(b * 0.32, h * 0.3); ctx.lineTo(b * 0.45, h * 0.39); ctx.fill();
      }

      if (soort === 'oerwoud') {
        for (let i = 0; i < 8; i++) { // bomen
          const x = b * (0.06 + i * 0.125);
          ctx.fillStyle = '#4a2f1a';
          ctx.fillRect(x - 12, h * 0.35, 24, h * 0.45);
          ctx.fillStyle = '#2f8a3a';
          ctx.beginPath(); ctx.arc(x, h * 0.33, 70, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (soort === 'woestijn') {
        ctx.fillStyle = '#ff8c00'; // grote zon
        ctx.beginPath(); ctx.arc(b * 0.5, h * 0.25, 80, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#d4a85a'; // duinen
        for (const x of [0.0, 0.35, 0.7]) {
          ctx.beginPath(); ctx.ellipse((x + 0.2) * b, h * 0.8, b * 0.25, h * 0.15, 0, Math.PI, 0); ctx.fill();
        }
        ctx.fillStyle = '#f5f0e0'; // botten
        ctx.fillRect(b * 0.6, h * 0.76, 60, 8);
        ctx.beginPath(); ctx.arc(b * 0.6, h * 0.76, 7, 0, Math.PI * 2); ctx.arc(b * 0.6 + 60, h * 0.76, 7, 0, Math.PI * 2); ctx.fill();
      }

      if (soort === 'kampvuur') {
        ctx.fillStyle = '#ffffff'; // sterren
        for (let i = 0; i < 80; i++) {
          ctx.beginPath(); ctx.arc((i * 211) % b, (i * 53) % (h * 0.6), 2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#6b5a3a'; // hutten
        for (const x of [0.15, 0.6, 0.85]) {
          ctx.beginPath(); ctx.moveTo(x * b, h * 0.8); ctx.lineTo((x + 0.06) * b, h * 0.6); ctx.lineTo((x + 0.12) * b, h * 0.8); ctx.closePath(); ctx.fill();
        }
        const flikker = 20 + Math.sin(performance.now() / 100) * 6; // kampvuur
        ctx.fillStyle = '#ff9a00';
        ctx.beginPath(); ctx.moveTo(b * 0.4 - 25, h * 0.8); ctx.lineTo(b * 0.4, h * 0.8 - flikker * 3); ctx.lineTo(b * 0.4 + 25, h * 0.8); ctx.fill();
        ctx.fillStyle = '#ffe066';
        ctx.beginPath(); ctx.moveTo(b * 0.4 - 12, h * 0.8); ctx.lineTo(b * 0.4, h * 0.8 - flikker * 1.5); ctx.lineTo(b * 0.4 + 12, h * 0.8); ctx.fill();
      }

      if (soort === 'bergen') {
        for (const [x, top] of [[0.1, 0.25], [0.4, 0.15], [0.7, 0.3], [0.95, 0.2]]) {
          ctx.fillStyle = '#5a6a7a';
          ctx.beginPath(); ctx.moveTo((x - 0.25) * b, h * 0.8); ctx.lineTo(x * b, h * top); ctx.lineTo((x + 0.25) * b, h * 0.8); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#ffffff'; // sneeuwtop
          ctx.beginPath(); ctx.moveTo((x - 0.06) * b, h * (top + 0.12)); ctx.lineTo(x * b, h * top); ctx.lineTo((x + 0.06) * b, h * (top + 0.12)); ctx.closePath(); ctx.fill();
        }
      }

      if (soort === 'disco') {
        tekenDisco(b, h);
      }

      if (soort === 'kerkhof') {
        ctx.fillStyle = '#e8e0d0';
        for (let i = 0; i < 14; i++) { // ribbenkasten en slagtanden
          const x = b * (0.05 + i * 0.07);
          ctx.fillRect(x, h * 0.55, 10, h * 0.25);
          for (let r = 0; r < 4; r++) ctx.fillRect(x - 25, h * 0.58 + r * 30, 60, 6);
          ctx.strokeStyle = '#e8e0d0'; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(x + 40, h * 0.8); ctx.quadraticCurveTo(x + 70, h * 0.6, x + 100, h * 0.7); ctx.stroke();
        }
      }

      if (soort === 'rivier') {
        const tijd = performance.now() / 1000;
        ctx.fillStyle = '#2a6ab5'; // de rivier achter het parcours
        ctx.fillRect(0, h * 0.62, b, h * 0.18);
        ctx.strokeStyle = '#8ac8f0'; ctx.lineWidth = 3;
        for (let x = 0; x < b; x += 90) { // golfjes
          ctx.beginPath();
          ctx.moveTo(x, h * 0.68 + Math.sin(tijd * 2 + x / 40) * 4);
          ctx.quadraticCurveTo(x + 22, h * 0.66, x + 45, h * 0.68 + Math.sin(tijd * 2 + x / 40) * 4);
          ctx.stroke();
        }
        ctx.fillStyle = '#ff9a3a'; // springende vissen
        for (let i = 0; i < 6; i++) {
          const x = b * (0.1 + i * 0.16);
          const sprong = Math.abs(Math.sin(tijd * 1.5 + i)) * 60;
          ctx.beginPath(); ctx.ellipse(x, h * 0.66 - sprong, 14, 6, -0.4, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (soort === 'storm') {
        const tijd = performance.now() / 1000;
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 300; i++) { // sneeuw die schuin voorbij jaagt
          const x = ((i * 131) + tijd * 400) % b;
          const y = ((i * 71) + tijd * 120) % (h * 0.8);
          ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#c8d4e0'; // besneeuwde heuvels
        for (let i = 0; i < 6; i++) {
          ctx.beginPath(); ctx.ellipse(b * (0.1 + i * 0.17), h * 0.8, b * 0.12, h * 0.2, 0, Math.PI, 0); ctx.fill();
        }
      }

      if (soort === 'mijn') {
        const tijd = performance.now() / 1000;
        ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 14; // houten stutbalken
        for (let x = 60; x < b; x += 200) {
          ctx.beginPath();
          ctx.moveTo(x, h * 0.8); ctx.lineTo(x, h * 0.15); ctx.lineTo(x + 120, h * 0.15); ctx.lineTo(x + 120, h * 0.8);
          ctx.stroke();
        }
        for (let i = 0; i < 40; i++) { // glinsterende vuursteen in de wand
          const aan = Math.floor(tijd * 3 + i) % 4 === 0;
          ctx.fillStyle = aan ? '#ffffff' : '#7a7a8a';
          ctx.beginPath(); ctx.arc((i * 173) % b, (i * 97) % (h * 0.6) + h * 0.1, aan ? 5 : 3, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (soort === 'strand') {
        const tijd = performance.now() / 1000;
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath(); ctx.arc(b * 0.3, h * 0.18, 60, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2a8ab5'; // de zee met golven
        ctx.beginPath();
        ctx.moveTo(0, h * 0.8);
        for (let x = 0; x <= b; x += 20) ctx.lineTo(x, h * 0.6 + Math.sin(x / 60 + tijd * 2) * 10);
        ctx.lineTo(b, h * 0.8); ctx.closePath(); ctx.fill();
        for (let i = 0; i < 8; i++) { // palmbomen
          const x = b * (0.08 + i * 0.13);
          ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 10;
          ctx.beginPath(); ctx.moveTo(x, h * 0.8); ctx.quadraticCurveTo(x + 20, h * 0.5, x + 10, h * 0.3); ctx.stroke();
          ctx.strokeStyle = '#2a8a3a'; ctx.lineWidth = 8;
          for (const hoek of [-2.5, -1.8, -1.2, -0.5, 0.2]) {
            ctx.beginPath(); ctx.moveTo(x + 10, h * 0.3); ctx.lineTo(x + 10 + Math.cos(hoek) * 60, h * 0.3 + Math.sin(hoek) * 40 + 20); ctx.stroke();
          }
        }
      }

      if (soort === 'nachtgrot') {
        const tijd = performance.now() / 1000;
        for (let i = 0; i < 8; i++) { // fakkels aan de wand
          const x = b * (0.06 + i * 0.13);
          const flikker = Math.sin(tijd * 12 + i) * 4;
          const gloed = ctx.createRadialGradient(x, h * 0.4, 10, x, h * 0.4, 220);
          gloed.addColorStop(0, 'rgba(255, 160, 60, 0.5)'); gloed.addColorStop(1, 'rgba(255, 160, 60, 0)');
          ctx.fillStyle = gloed; ctx.fillRect(x - 220, h * 0.4 - 220, 440, 440);
          ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x - 4, h * 0.4, 8, 60);
          ctx.fillStyle = '#ff9a00';
          ctx.beginPath(); ctx.moveTo(x - 12, h * 0.4); ctx.lineTo(x, h * 0.4 - 30 - flikker); ctx.lineTo(x + 12, h * 0.4); ctx.fill();
        }
        ctx.fillStyle = '#1a0f0a';
        for (let x = 30; x < b; x += 90) {
          ctx.beginPath(); ctx.moveTo(x - 25, 0); ctx.lineTo(x + 25, 0); ctx.lineTo(x, 60 + (x * 7) % 80); ctx.closePath(); ctx.fill();
        }
      }

      if (soort === 'reuzenwoud') {
        for (let i = 0; i < 10; i++) { // reuzenvarens
          const x = b * (0.05 + i * 0.1);
          ctx.strokeStyle = '#2a8a2a'; ctx.lineWidth = 6;
          for (const hoek of [-2.6, -2.2, -1.8, -1.4, -1.0, -0.6]) {
            ctx.beginPath(); ctx.moveTo(x, h * 0.8);
            ctx.quadraticCurveTo(x + Math.cos(hoek) * 150, h * 0.8 + Math.sin(hoek) * 250, x + Math.cos(hoek) * 260, h * 0.8 + Math.sin(hoek) * 300);
            ctx.stroke();
          }
        }
        ctx.fillStyle = '#4a2f1a'; // dikke stammen
        for (let i = 0; i < 5; i++) ctx.fillRect(b * (0.12 + i * 0.2), 0, 50, h * 0.8);
      }

      if (soort === 'meteoren') {
        const tijd = performance.now() / 1000;
        for (let i = 0; i < 20; i++) { // vallende sterren met een staart
          const x = ((i * 191) + tijd * 300) % (b + 200) - 100;
          const y = ((i * 83) + tijd * 200) % (h * 0.7);
          ctx.strokeStyle = 'rgba(255, 200, 100, 0.6)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 60, y - 40); ctx.stroke();
          ctx.fillStyle = '#ffd23f';
          ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#3a2a2a'; // kraters in de grond
        for (let i = 0; i < 12; i++) {
          ctx.beginPath(); ctx.ellipse(b * (0.04 + i * 0.085), h * 0.8, 40, 12, 0, 0, Math.PI * 2); ctx.fill();
        }
      }

      if (soort === 'dinovallei') {
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath(); ctx.arc(b * 0.6, h * 0.15, 50, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6a9a4a'; // heuvels
        for (let i = 0; i < 7; i++) {
          ctx.beginPath(); ctx.ellipse(b * (0.05 + i * 0.16), h * 0.8, b * 0.12, h * 0.3, 0, Math.PI, 0); ctx.fill();
        }
        ctx.fillStyle = '#4a7a3a'; // langnekken in de verte
        for (let i = 0; i < 4; i++) {
          const x = b * (0.15 + i * 0.25);
          ctx.beginPath(); ctx.ellipse(x, h * 0.55, 70, 30, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = '#4a7a3a'; ctx.lineWidth = 16;
          ctx.beginPath(); ctx.moveTo(x + 50, h * 0.5); ctx.quadraticCurveTo(x + 110, h * 0.35, x + 130, h * 0.22); ctx.stroke();
          ctx.beginPath(); ctx.arc(x + 132, h * 0.21, 14, 0, Math.PI * 2); ctx.fill();
          ctx.beginPath(); ctx.moveTo(x - 60, h * 0.55); ctx.quadraticCurveTo(x - 120, h * 0.5, x - 160, h * 0.7); ctx.stroke();
        }
      }

      if (soort === 'ijsgrot') {
        const tijd = performance.now() / 1000;
        ctx.fillStyle = '#7ab0e0';
        for (let x = 30; x < b; x += 80) { // ijspegels aan het plafond
          ctx.beginPath(); ctx.moveTo(x - 20, 0); ctx.lineTo(x + 20, 0); ctx.lineTo(x, 50 + (x * 7) % 100); ctx.closePath(); ctx.fill();
        }
        for (let i = 0; i < 16; i++) { // glinsterende ijskristallen
          const x = b * (0.03 + i * 0.06);
          const glans = 0.5 + 0.5 * Math.sin(tijd * 3 + i);
          ctx.fillStyle = `rgba(200, 240, 255, ${0.4 + glans * 0.5})`;
          ctx.beginPath(); ctx.moveTo(x, h * 0.8); ctx.lineTo(x + 25, h * 0.55); ctx.lineTo(x + 50, h * 0.8); ctx.closePath(); ctx.fill();
        }
      }

      if (soort === 'superdisco') {
        tekenDisco(b, h);
        const tijd = performance.now() / 1000;
        // Vuurwerk: knallen die groter worden en vervagen
        for (let i = 0; i < 10; i++) {
          const fase = (tijd * 0.7 + i * 0.13) % 1;
          const x = b * ((i * 0.37) % 1);
          const y = h * (0.1 + (i * 0.23) % 0.4);
          const kleur = ['#ff2d95', '#2dff8a', '#2d9bff', '#ffe22d', '#ff7a2d'][i % 5];
          ctx.strokeStyle = kleur; ctx.lineWidth = 3;
          ctx.globalAlpha = 1 - fase;
          for (let r = 0; r < 12; r++) {
            const hoek = r * Math.PI / 6;
            ctx.beginPath();
            ctx.moveTo(x + Math.cos(hoek) * fase * 40, y + Math.sin(hoek) * fase * 40);
            ctx.lineTo(x + Math.cos(hoek) * fase * 110, y + Math.sin(hoek) * fase * 110);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        // Grote knipperende tekst
        ctx.fillStyle = Math.floor(tijd * 4) % 2 === 0 ? '#ffe22d' : '#ff2d95';
        ctx.font = 'bold 80px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ALL-TIME DISCO!', b / 2, h * 0.35);
      }

      if (soort === 'tijgerhol') {
        ctx.fillStyle = '#1a0a1a';
        for (let x = 30; x < b; x += 70) { // stalactieten
          ctx.beginPath(); ctx.moveTo(x - 20, 0); ctx.lineTo(x + 20, 0); ctx.lineTo(x, 50 + (x * 5) % 90); ctx.closePath(); ctx.fill();
        }
        ctx.fillStyle = '#e8e0d0'; // botten op de grond
        for (const x of [0.3, 0.5, 0.8]) {
          ctx.fillRect(x * b, h * 0.77, 50, 6);
        }
        // gloeiende ogen in het donker
        const knipper = Math.floor(performance.now() / 700) % 5 === 0;
        if (!knipper) {
          ctx.fillStyle = '#ffd700';
          for (const [x, y] of [[0.2, 0.3], [0.65, 0.25], [0.9, 0.55]]) {
            ctx.beginPath(); ctx.arc(x * b - 10, y * h, 5, 0, Math.PI * 2); ctx.arc(x * b + 10, y * h, 5, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
    }

    // Lichtbundels, discoballen, confetti en een dansvloer
    function tekenDisco(b, h) {
      {
        const tijd = performance.now() / 1000;
        const kleuren = ['#ff2d95', '#2dff8a', '#2d9bff', '#ffe22d', '#ff7a2d'];

        // Lichtbundels die heen en weer zwaaien vanaf het plafond
        for (let i = 0; i < 12; i++) {
          const x = b * (i + 0.5) / 12;
          const zwaai = Math.sin(tijd * 2 + i) * 150;
          ctx.fillStyle = kleuren[i % kleuren.length] + '55'; // doorzichtig
          ctx.beginPath();
          ctx.moveTo(x, 0); ctx.lineTo(x + zwaai - 60, h * 0.8); ctx.lineTo(x + zwaai + 60, h * 0.8);
          ctx.closePath(); ctx.fill();
        }

        // Discoballen
        for (let i = 0; i < 4; i++) {
          const x = b * (0.15 + i * 0.23);
          ctx.strokeStyle = '#aaa'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h * 0.12); ctx.stroke();
          ctx.fillStyle = '#ddd';
          ctx.beginPath(); ctx.arc(x, h * 0.12 + 40, 40, 0, Math.PI * 2); ctx.fill();
          for (let r = 0; r < 8; r++) { // glinsterende vakjes
            const hoek = tijd * 2 + r * Math.PI / 4;
            ctx.fillStyle = (Math.floor(tijd * 6 + r) % 2 === 0) ? '#fff' : '#888';
            ctx.beginPath(); ctx.arc(x + Math.cos(hoek) * 25, h * 0.12 + 40 + Math.sin(hoek) * 25, 6, 0, Math.PI * 2); ctx.fill();
          }
        }

        // Confetti dat naar beneden dwarrelt
        for (let i = 0; i < 150; i++) {
          const x = (i * 97) % b + Math.sin(tijd * 3 + i) * 20;
          const y = ((i * 61) + tijd * (60 + (i % 5) * 20)) % (h * 0.8);
          ctx.fillStyle = kleuren[i % kleuren.length];
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(tijd * 4 + i);
          ctx.fillRect(-5, -3, 10, 6);
          ctx.restore();
        }

        // Knipperende dansvloer-tegels net boven de bodem
        for (let x = 0; x < b; x += 60) {
          ctx.fillStyle = kleuren[(Math.floor(x / 60) + Math.floor(tijd * 4)) % kleuren.length];
          ctx.fillRect(x, h * 0.8 - 8, 58, 8);
        }
      }
    }

    // Grotschilderingen op de achterwand, in oker en roodbruin
    function tekenGrotTekeningen() {
      const b = levelBreedte();
      const h = canvas.height;
      const oker = '#c8792a';
      const roodbruin = '#8e3b2a';

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Mammoet: dikke romp, kop met slurf en gebogen slagtanden
      const mx = b * 0.55;
      const my = h * 0.42;
      ctx.fillStyle = roodbruin;
      ctx.beginPath();
      ctx.ellipse(mx, my, 90, 55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(mx + 85, my - 25, 35, 0, Math.PI * 2); // kop
      ctx.fill();
      ctx.strokeStyle = roodbruin;
      ctx.lineWidth = 12;
      for (const px of [mx - 55, mx - 20, mx + 20, mx + 55]) { // poten
        ctx.beginPath();
        ctx.moveTo(px, my + 40);
        ctx.lineTo(px, my + 95);
        ctx.stroke();
      }
      ctx.lineWidth = 10;
      ctx.beginPath(); // slurf
      ctx.moveTo(mx + 115, my - 15);
      ctx.quadraticCurveTo(mx + 150, my + 20, mx + 130, my + 70);
      ctx.stroke();
      ctx.strokeStyle = oker;
      ctx.lineWidth = 6;
      ctx.beginPath(); // slagtand
      ctx.moveTo(mx + 105, my);
      ctx.quadraticCurveTo(mx + 170, my + 10, mx + 150, my - 35);
      ctx.stroke();

      // Hert: klein lijf, dunne poten en een gewei
      const hx = b * 0.25;
      const hy = h * 0.4;
      ctx.fillStyle = oker;
      ctx.beginPath();
      ctx.ellipse(hx, hy, 45, 25, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = oker;
      ctx.lineWidth = 5;
      for (const px of [hx - 30, hx - 15, hx + 15, hx + 30]) {
        ctx.beginPath();
        ctx.moveTo(px, hy + 20);
        ctx.lineTo(px, hy + 65);
        ctx.stroke();
      }
      ctx.beginPath(); // nek en kop
      ctx.moveTo(hx + 40, hy - 10);
      ctx.lineTo(hx + 65, hy - 45);
      ctx.lineTo(hx + 85, hy - 40);
      ctx.stroke();
      ctx.lineWidth = 3;
      ctx.beginPath(); // gewei
      ctx.moveTo(hx + 65, hy - 45);
      ctx.lineTo(hx + 55, hy - 80);
      ctx.moveTo(hx + 60, hy - 65);
      ctx.lineTo(hx + 45, hy - 75);
      ctx.moveTo(hx + 65, hy - 45);
      ctx.lineTo(hx + 80, hy - 80);
      ctx.moveTo(hx + 72, hy - 65);
      ctx.lineTo(hx + 88, hy - 70);
      ctx.stroke();

      // Jagers: stokfiguurtjes met een speer
      ctx.strokeStyle = roodbruin;
      ctx.lineWidth = 4;
      for (let i = 0; i < 3; i++) {
        const jx = b * 0.72 + i * 55;
        const jy = h * 0.55;
        ctx.beginPath();
        ctx.arc(jx, jy - 40, 7, 0, Math.PI * 2); // hoofd
        ctx.moveTo(jx, jy - 33);
        ctx.lineTo(jx, jy); // lijf
        ctx.moveTo(jx, jy);
        ctx.lineTo(jx - 12, jy + 25); // benen
        ctx.moveTo(jx, jy);
        ctx.lineTo(jx + 12, jy + 25);
        ctx.moveTo(jx, jy - 25);
        ctx.lineTo(jx - 18, jy - 5); // armen
        ctx.moveTo(jx, jy - 25);
        ctx.lineTo(jx + 20, jy - 35);
        ctx.moveTo(jx + 5, jy - 10); // speer
        ctx.lineTo(jx + 35, jy - 60);
        ctx.stroke();
      }

      // Handafdrukken: een cirkel met vijf vingers
      ctx.fillStyle = oker;
      for (const [hxp, hyp] of [[b * 0.12, h * 0.6], [b * 0.9, h * 0.35], [b * 0.4, h * 0.62]]) {
        ctx.beginPath();
        ctx.arc(hxp, hyp, 14, 0, Math.PI * 2);
        ctx.fill();
        for (let v = 0; v < 5; v++) {
          const hoek = -Math.PI * 0.9 + v * Math.PI * 0.2;
          ctx.beginPath();
          ctx.ellipse(hxp + Math.cos(hoek) * 20, hyp + Math.sin(hoek) * 20, 5, 12, hoek + Math.PI / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Borrelende lava in een gat, van x tot x + breedte
    function tekenLava(x, breedte) {
      const h = canvas.height;
      const tijd = performance.now() / 1000;
      const boven = h * 0.8 + 10;

      // Donkerrode diepte
      ctx.fillStyle = '#7a1a00';
      ctx.fillRect(x, boven, breedte, h - boven);

      // Golvend oranje oppervlak
      ctx.fillStyle = '#ff6a00';
      ctx.beginPath();
      ctx.moveTo(x, h);
      for (let px = x; px <= x + breedte; px += 8) {
        ctx.lineTo(px, boven + Math.sin(px / 25 + tijd * 4) * 5);
      }
      ctx.lineTo(x + breedte, h);
      ctx.closePath();
      ctx.fill();

      // Gele gloed bovenop
      ctx.fillStyle = '#ffd23f';
      for (let px = x + 10; px < x + breedte - 10; px += 30) {
        ctx.beginPath();
        ctx.arc(px, boven + Math.sin(px / 25 + tijd * 4) * 5 + 8, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bellen die omhoog komen en knappen
      ctx.fillStyle = '#ffb347';
      for (let i = 0; i < 5; i++) {
        const fase = (tijd * 0.8 + i * 0.37) % 1;
        const bx = x + 15 + ((i * 53) % Math.max(1, breedte - 30));
        const by = boven + 40 - fase * 40;
        ctx.beginPath();
        ctx.arc(bx, by, 4 + fase * 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenObstakels() {
      const tijd = performance.now() / 1000;
      for (const ob of level().obstakels) {
        const pos = obstakelPositie(ob);
        if (ob.soort === 'stekels') tekenStekels(ob, pos, tijd);
        if (ob.soort === 'beest' && ob.dood) tekenDoodBeest(ob);
        if (ob.soort === 'beest' && !ob.dood) tekenBeest(ob, pos, tijd);
        if (ob.soort === 'vallend') tekenVallend(ob, pos);
      }
    }

    function tekenStekels(ob, pos, tijd) {
      const kleuren = { botten: '#f0e8d8', ijspegel: '#bfe4ff', vuur: '#ff7a00', doorns: '#2f5a1a' };
      ctx.fillStyle = kleuren[ob.naam];
      const links = pos.x - pos.halfBreed;
      for (let x = links; x < pos.x + pos.halfBreed; x += 18) {
        const hoog = ob.naam === 'vuur' ? 25 + Math.sin(tijd * 10 + x) * 8 : 30;
        ctx.beginPath();
        ctx.moveTo(x, pos.y);
        ctx.lineTo(x + 9, pos.y - hoog);
        ctx.lineTo(x + 18, pos.y);
        ctx.closePath();
        ctx.fill();
      }
    }

    function tekenBeest(ob, pos, tijd) {
      const kleuren = {
        vleermuis: '#3a2a4a', sneeuwbal: '#ffffff', mammoet: '#6b4a2a', dino: '#3f8a3a',
        slang: '#4a8a2a', schorpioen: '#3a2a1a', wolf: '#7a7a7a', sabeltandtijger: '#e08a2a',
        discodier: '#ff2d95', krab: '#e04a2a', trex: '#6a8a2a',
      };
      const kleur = kleuren[ob.naam];
      const y = pos.y;
      ctx.save();
      ctx.translate(pos.x, 0);
      ctx.scale(pos.richting, 1);
      const pootZwaai = Math.sin(tijd * 10) * 8;
      if (ob.naam === 'discodier') ctx.translate(0, -Math.abs(Math.sin(tijd * 6)) * 15); // huppen op de maat

      if (ob.naam === 'sneeuwbal') {
        ctx.fillStyle = kleur;
        ctx.beginPath(); ctx.arc(0, y - 28, 28, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#cfe4f5'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, y - 28, 18, tijd * 5, tijd * 5 + 2); ctx.stroke();
      } else if (ob.naam === 'vleermuis') {
        const vleugel = Math.sin(tijd * 15) * 15;
        ctx.fillStyle = kleur;
        ctx.beginPath(); ctx.ellipse(0, y - 40, 12, 16, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(0, y - 40); ctx.lineTo(-35, y - 50 - vleugel); ctx.lineTo(-30, y - 30);
        ctx.moveTo(0, y - 40); ctx.lineTo(35, y - 50 - vleugel); ctx.lineTo(30, y - 30);
        ctx.fill();
      } else if (ob.naam === 'slang') {
        ctx.strokeStyle = kleur; ctx.lineWidth = 12; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = -30; i <= 30; i += 5) ctx.lineTo(i, y - 8 + Math.sin(i / 8 + tijd * 8) * 6);
        ctx.stroke();
        ctx.fillStyle = '#ff3030';
        ctx.beginPath(); ctx.moveTo(30, y - 8); ctx.lineTo(42, y - 12); ctx.lineTo(42, y - 4); ctx.fill();
      } else if (ob.naam === 'krab') {
        ctx.fillStyle = kleur;
        ctx.beginPath(); ctx.ellipse(0, y - 15, 28, 15, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = kleur; ctx.lineWidth = 5; ctx.lineCap = 'round';
        for (const kant of [-1, 1]) { // pootjes en scharen
          for (const px of [8, 16, 24]) { ctx.beginPath(); ctx.moveTo(kant * px, y - 10); ctx.lineTo(kant * (px + 10), y + pootZwaai / 4); ctx.stroke(); }
          ctx.beginPath(); ctx.moveTo(kant * 25, y - 22); ctx.lineTo(kant * 42, y - 38); ctx.stroke();
          ctx.beginPath(); ctx.arc(kant * 44, y - 40, 8, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(-8, y - 28, 3, 0, Math.PI * 2); ctx.arc(8, y - 28, 3, 0, Math.PI * 2); ctx.fill();
      } else if (ob.naam === 'trex') {
        ctx.fillStyle = kleur;
        ctx.beginPath(); ctx.ellipse(-5, y - 45, 38, 24, 0.2, 0, Math.PI * 2); ctx.fill(); // lijf
        ctx.beginPath(); ctx.moveTo(-35, y - 50); ctx.lineTo(-85, y - 35); ctx.lineTo(-35, y - 30); ctx.fill(); // staart
        ctx.beginPath(); ctx.ellipse(38, y - 70, 24, 16, 0, 0, Math.PI * 2); ctx.fill(); // kop
        ctx.strokeStyle = kleur; ctx.lineWidth = 10; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-10, y - 30); ctx.lineTo(-10 + pootZwaai, y);
        ctx.moveTo(12, y - 30); ctx.lineTo(12 - pootZwaai, y);
        ctx.stroke();
        ctx.lineWidth = 4; // kleine armpjes
        ctx.beginPath(); ctx.moveTo(25, y - 55); ctx.lineTo(38, y - 48); ctx.stroke();
        ctx.fillStyle = '#fff'; // tanden
        for (const tx of [44, 52, 60]) { ctx.beginPath(); ctx.moveTo(tx, y - 62); ctx.lineTo(tx + 3, y - 52); ctx.lineTo(tx + 6, y - 62); ctx.fill(); }
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(45, y - 75, 3, 0, Math.PI * 2); ctx.fill();
      } else if (ob.naam === 'schorpioen') {
        ctx.fillStyle = kleur;
        ctx.beginPath(); ctx.ellipse(0, y - 12, 25, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = kleur; ctx.lineWidth = 6; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-20, y - 15); ctx.quadraticCurveTo(-45, y - 60, -20, y - 55); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(20, y - 15); ctx.lineTo(40, y - 25); ctx.stroke();
      } else {
        // Viervoeter: lijf, kop, poten, en per soort iets extra's
        ctx.fillStyle = kleur;
        ctx.beginPath(); ctx.ellipse(0, y - 35, 32, 20, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(32, y - 45, 14, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = kleur; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-18, y - 25); ctx.lineTo(-18 + pootZwaai, y);
        ctx.moveTo(-6, y - 25); ctx.lineTo(-6 - pootZwaai, y);
        ctx.moveTo(8, y - 25); ctx.lineTo(8 + pootZwaai, y);
        ctx.moveTo(20, y - 25); ctx.lineTo(20 - pootZwaai, y);
        ctx.stroke();
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(37, y - 48, 2.5, 0, Math.PI * 2); ctx.fill();
        if (ob.naam === 'mammoet') {
          ctx.strokeStyle = kleur; ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(44, y - 40); ctx.quadraticCurveTo(58, y - 20, 50, y - 5); ctx.stroke();
          ctx.strokeStyle = '#f5f0e0'; ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(40, y - 36); ctx.quadraticCurveTo(62, y - 30, 58, y - 50); ctx.stroke();
        }
        if (ob.naam === 'sabeltandtijger') {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.moveTo(38, y - 36); ctx.lineTo(42, y - 20); ctx.lineTo(46, y - 36); ctx.fill();
          ctx.strokeStyle = '#7a4a10'; ctx.lineWidth = 3;
          for (const sx of [-15, -5, 5]) { ctx.beginPath(); ctx.moveTo(sx, y - 52); ctx.lineTo(sx + 3, y - 35); ctx.stroke(); }
        }
        if (ob.naam === 'dino') {
          ctx.fillStyle = kleur;
          ctx.beginPath(); ctx.moveTo(-30, y - 40); ctx.lineTo(-60, y - 30); ctx.lineTo(-30, y - 25); ctx.fill();
          for (const sx of [-15, 0, 15]) { ctx.beginPath(); ctx.moveTo(sx - 6, y - 52); ctx.lineTo(sx, y - 66); ctx.lineTo(sx + 6, y - 52); ctx.fill(); }
        }
        if (ob.naam === 'discodier') {
          // Springt op de maat en draagt een zonnebril
          const dans = Math.abs(Math.sin(tijd * 6)) * 15;
          ctx.fillStyle = '#111';
          ctx.fillRect(24, y - 52 - dans, 10, 7);
          ctx.fillRect(37, y - 52 - dans, 10, 7);
          ctx.fillRect(34, y - 50 - dans, 3, 2);
          ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(24, y - 49 - dans); ctx.lineTo(18, y - 52 - dans); ctx.stroke();
          ctx.fillStyle = '#2dff8a'; // feesthoedje
          ctx.beginPath(); ctx.moveTo(24, y - 58); ctx.lineTo(32, y - 85); ctx.lineTo(40, y - 58); ctx.fill();
        }
        if (ob.naam === 'wolf') {
          ctx.fillStyle = kleur;
          ctx.beginPath(); ctx.moveTo(26, y - 55); ctx.lineTo(30, y - 68); ctx.lineTo(36, y - 55); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-30, y - 40); ctx.lineTo(-50, y - 55); ctx.lineTo(-28, y - 30); ctx.fill();
        }
      }
      ctx.restore();
    }

    // Waar een beest doodging staat een grafsteen met R.I.P. erop, midden in zijn bereik
    function tekenDoodBeest(ob) {
      const x = (ob.x + ob.bereik / 2) * levelBreedte();
      const y = bodemHoogte();

      // Grafheuveltje
      ctx.fillStyle = '#4a3a2a';
      ctx.beginPath(); ctx.ellipse(x, y, 45, 10, 0, Math.PI, 0); ctx.fill();

      // De steen: rechthoek met een ronde bovenkant
      ctx.fillStyle = '#8a8a8a';
      ctx.beginPath();
      ctx.moveTo(x - 25, y);
      ctx.lineTo(x - 25, y - 45);
      ctx.arc(x, y - 45, 25, Math.PI, 0);
      ctx.lineTo(x + 25, y);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 3;
      ctx.stroke();

      // R.I.P.
      ctx.fillStyle = '#222';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('R.I.P.', x, y - 35);

      // Een klein kruisje eronder
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y - 28); ctx.lineTo(x, y - 8);
      ctx.moveTo(x - 7, y - 22); ctx.lineTo(x + 7, y - 22);
      ctx.stroke();
    }

    function tekenVallend(ob, pos) {
      if (ob.naam === 'stalactiet') {
        ctx.fillStyle = '#5a4a3a';
        ctx.beginPath();
        ctx.moveTo(pos.x - 15, pos.y - 45); ctx.lineTo(pos.x + 15, pos.y - 45); ctx.lineTo(pos.x, pos.y);
        ctx.closePath(); ctx.fill();
      } else {
        const kleuren = { lavabrok: '#ff6a00', rots: '#6a6a6a', kokosnoot: '#6b4a2a', meteoriet: '#ff3a00', ijsblok: '#bfe4ff' };
        if (ob.naam === 'meteoriet') { // vurige staart omhoog
          ctx.fillStyle = 'rgba(255, 180, 60, 0.6)';
          ctx.beginPath(); ctx.moveTo(pos.x - 14, pos.y - 25); ctx.lineTo(pos.x, pos.y - 110); ctx.lineTo(pos.x + 14, pos.y - 25); ctx.fill();
        }
        ctx.fillStyle = kleuren[ob.naam];
        ctx.beginPath(); ctx.arc(pos.x, pos.y - 18, 18, 0, Math.PI * 2); ctx.fill();
        if (ob.naam === 'lavabrok') {
          ctx.fillStyle = '#ffd23f';
          ctx.beginPath(); ctx.arc(pos.x - 5, pos.y - 22, 6, 0, Math.PI * 2); ctx.fill();
        }
      }
    }

    function tekenParcours() {
      const b = levelBreedte();
      const h = canvas.height;
      const lv = level();

      // Gaten in de bodem: lava, water of gewoon diepte
      for (const g of lv.gaten) {
        if (lv.lava) {
          tekenLava(g.x * b, g.breedte * b);
        } else {
          ctx.fillStyle = lv.gatKleur;
          ctx.fillRect(g.x * b, h * 0.8 - 20, g.breedte * b, h * 0.2 + 20);
        }
      }

      // Platforms
      for (const pl of lv.platforms) {
        const x = pl.x * b;
        const y = pl.y * h;
        const br = pl.breedte * b;
        ctx.fillStyle = lv.platform;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + br, y);
        ctx.lineTo(x + br - 10, y + 22);
        ctx.lineTo(x + 10, y + 22);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = lv.rand; // lichte bovenrand
        ctx.fillRect(x, y, br, 6);
      }

      // Finishvlag op het laatste platform
      const laatste = vlagPlatform();
      const vx = (laatste.x + laatste.breedte / 2) * b;
      const vy = laatste.y * h;
      ctx.strokeStyle = '#5c3a1a';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(vx, vy);
      ctx.lineTo(vx, vy - 70);
      ctx.stroke();
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.moveTo(vx, vy - 70);
      ctx.lineTo(vx + 40, vy - 58);
      ctx.lineTo(vx, vy - 46);
      ctx.closePath();
      ctx.fill();
    }

    function tekenMens() {
      const voeten = mens.y; // de hoogte van de voeten

      // Alles tekenen we rond x = 0 en spiegelen we als de mens naar links kijkt
      ctx.save();
      ctx.translate(mens.x, 0);
      ctx.scale(mens.richting, 1);
      const x = 0;

      // Benen: zwaaien heen en weer tijdens het lopen
      const zwaai = mens.loopt ? Math.sin(mens.stap) * 15 : 0;
      ctx.strokeStyle = '#c68642';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, voeten - 60);
      ctx.lineTo(x - 15 + zwaai, voeten);
      ctx.moveTo(x, voeten - 60);
      ctx.lineTo(x + 15 - zwaai, voeten);
      ctx.stroke();

      // Skateboard onder de voeten
      tekenSkateboard(x, voeten);

      // Lijf met dierenvel (of wat je in de kast hebt gekocht)
      ctx.fillStyle = kledingKleur();
      ctx.beginPath();
      ctx.moveTo(x - 22, voeten - 60);
      ctx.lineTo(x + 22, voeten - 60);
      ctx.lineTo(x + 16, voeten - 120);
      ctx.lineTo(x - 16, voeten - 120);
      ctx.closePath();
      ctx.fill();
      if (draagt('kleren') === 'luipaardvel') { // vlekken
        ctx.fillStyle = '#3a2a1a';
        for (const [vx, vy] of [[-10, -75], [6, -90], [-4, -105], [12, -70]]) {
          ctx.beginPath(); ctx.arc(x + vx, voeten + vy, 4, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (draagt('kleren') === 'mammoetjas') { // harige rand
        ctx.strokeStyle = '#8a6a4a'; ctx.lineWidth = 3;
        for (let hx = -20; hx <= 20; hx += 6) {
          ctx.beginPath(); ctx.moveTo(x + hx, voeten - 60); ctx.lineTo(x + hx - 2, voeten - 50); ctx.stroke();
        }
      }
      tekenShirt(x, voeten);

      // Armen
      ctx.beginPath();
      ctx.moveTo(x - 14, voeten - 110);
      ctx.lineTo(x - 35, voeten - 70);
      ctx.moveTo(x + 14, voeten - 110);
      ctx.lineTo(x + 35, voeten - 70);
      ctx.stroke();

      // Knots in de rechterhand: zwaait naar voren tijdens een slag
      const zwaaiHoek = mens.slaat > 0 ? (1 - mens.slaat / slagDuur) * Math.PI * 0.8 : 0;
      ctx.save();
      ctx.translate(x + 35, voeten - 70);
      ctx.rotate(zwaaiHoek);
      ctx.strokeStyle = '#5c3a1a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(25, -60);
      ctx.stroke();
      ctx.fillStyle = '#5c3a1a'; // dikke kop van de knots
      ctx.beginPath(); ctx.arc(25, -60, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // Hoofd
      ctx.fillStyle = '#c68642';
      ctx.beginPath();
      ctx.arc(x, voeten - 145, 25, 0, Math.PI * 2);
      ctx.fill();

      // Wilde haren
      ctx.fillStyle = '#3b2412';
      ctx.beginPath();
      ctx.arc(x, voeten - 155, 27, Math.PI, Math.PI * 2);
      ctx.fill();

      // Ogen
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(x - 8, voeten - 148, 3, 0, Math.PI * 2);
      ctx.arc(x + 8, voeten - 148, 3, 0, Math.PI * 2);
      ctx.fill();

      tekenZonnebril(x, voeten);
      tekenHoedje(x, voeten);

      ctx.restore();
    }

    function kledingKleur() {
      const k = draagt('kleren');
      if (k === 'luipaardvel') return '#d9a441';
      if (k === 'mammoetjas') return '#5a3a1a';
      if (k === 'discopak') return `hsl(${(performance.now() / 5) % 360}, 90%, 55%)`;
      return '#8b5a2b';
    }

    function tekenShirt(x, voeten) {
      const sh = draagt('shirtjes');
      if (!sh) return;
      const kleuren = { stershirt: '#2d9bff', hartshirt: '#ff5a8a', dinoshirt: '#3fbf5a', bliksemshirt: '#222' };
      ctx.fillStyle = kleuren[sh];
      ctx.beginPath(); // bovenste helft van het lijf
      ctx.moveTo(x - 19, voeten - 90); ctx.lineTo(x + 19, voeten - 90);
      ctx.lineTo(x + 16, voeten - 120); ctx.lineTo(x - 16, voeten - 120);
      ctx.closePath(); ctx.fill();
      const cx = x, cy = voeten - 105;
      if (sh === 'stershirt') {
        ctx.fillStyle = '#ffe22d';
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? 9 : 4;
          const hoek = -Math.PI / 2 + i * Math.PI / 5;
          ctx.lineTo(cx + Math.cos(hoek) * r, cy + Math.sin(hoek) * r);
        }
        ctx.closePath(); ctx.fill();
      }
      if (sh === 'hartshirt') { ctx.fillStyle = '#fff'; tekenHart(cx, cy - 2, 6); }
      if (sh === 'dinoshirt') {
        ctx.fillStyle = '#1a6a2a';
        ctx.beginPath(); ctx.ellipse(cx, cy, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 8, cy - 4, 4, 0, Math.PI * 2); ctx.fill();
      }
      if (sh === 'bliksemshirt') {
        ctx.fillStyle = '#ffe22d';
        ctx.beginPath();
        ctx.moveTo(cx + 3, cy - 12); ctx.lineTo(cx - 6, cy + 1); ctx.lineTo(cx, cy + 1);
        ctx.lineTo(cx - 3, cy + 12); ctx.lineTo(cx + 6, cy - 1); ctx.lineTo(cx, cy - 1);
        ctx.closePath(); ctx.fill();
      }
    }

    function tekenZonnebril(x, voeten) {
      const br = draagt('zonnebrillen');
      if (!br) return;
      const y = voeten - 148;
      if (br === 'hartjesbril') {
        ctx.fillStyle = '#ff5a8a';
        tekenHart(x - 9, y - 1, 7); tekenHart(x + 9, y - 1, 7);
        ctx.strokeStyle = '#ff5a8a'; ctx.lineWidth = 2;
      } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(x - 17, y - 5, 14, 9);
        ctx.fillRect(x + 3, y - 5, 14, 9);
        ctx.strokeStyle = br === 'goudenbril' ? '#ffd700' : '#111';
        ctx.lineWidth = 2;
        if (br === 'goudenbril') { ctx.strokeRect(x - 17, y - 5, 14, 9); ctx.strokeRect(x + 3, y - 5, 14, 9); }
      }
      ctx.beginPath(); // brug en pootjes
      ctx.moveTo(x - 3, y); ctx.lineTo(x + 3, y);
      ctx.moveTo(x - 17, y - 2); ctx.lineTo(x - 25, y - 5);
      ctx.moveTo(x + 17, y - 2); ctx.lineTo(x + 25, y - 5);
      ctx.stroke();
    }

    function tekenHoedje(x, voeten) {
      const h = draagt('hoedjes');
      if (!h) return;
      const top = voeten - 170; // bovenkant van het hoofd
      if (h === 'feesthoedje') {
        ctx.fillStyle = '#2dff8a';
        ctx.beginPath(); ctx.moveTo(x - 16, top + 6); ctx.lineTo(x, top - 36); ctx.lineTo(x + 16, top + 6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff2d95';
        ctx.beginPath(); ctx.arc(x, top - 36, 5, 0, Math.PI * 2); ctx.fill();
      }
      if (h === 'bloemenkrans') {
        const kleuren = ['#ff5a8a', '#ffe22d', '#2d9bff', '#ff7a2d', '#ffffff'];
        for (let i = 0; i < 7; i++) {
          const hoek = Math.PI + i * Math.PI / 6;
          ctx.fillStyle = kleuren[i % kleuren.length];
          ctx.beginPath(); ctx.arc(x + Math.cos(hoek) * 27, voeten - 155 + Math.sin(hoek) * 27, 5, 0, Math.PI * 2); ctx.fill();
        }
      }
      if (h === 'bothelm') {
        ctx.fillStyle = '#f0e8d8';
        ctx.beginPath(); ctx.arc(x, voeten - 155, 29, Math.PI, 0); ctx.fill();
        ctx.fillRect(x - 25, top + 12, 50, 6);
        ctx.fillRect(x - 40, top - 8, 80, 6); // bot dwars erop
        ctx.beginPath(); ctx.arc(x - 40, top - 5, 6, 0, Math.PI * 2); ctx.arc(x + 40, top - 5, 6, 0, Math.PI * 2); ctx.fill();
      }
      if (h === 'kroon') {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.moveTo(x - 22, top + 8); ctx.lineTo(x - 22, top - 18); ctx.lineTo(x - 11, top - 6);
        ctx.lineTo(x, top - 24); ctx.lineTo(x + 11, top - 6); ctx.lineTo(x + 22, top - 18); ctx.lineTo(x + 22, top + 8);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#e63946';
        ctx.beginPath(); ctx.arc(x, top - 2, 4, 0, Math.PI * 2); ctx.fill();
      }
    }

    function tekenSkateboard(x, voeten) {
      const sb = draagt('skateboards');
      if (!sb) return;
      if (sb === 'vuurbord' && mens.loopt) { // vlammen erachter
        ctx.fillStyle = '#ff7a00';
        for (let i = 0; i < 3; i++) {
          const l = 15 + Math.sin(performance.now() / 50 + i) * 8;
          ctx.beginPath(); ctx.moveTo(x - 30, voeten - 2 - i * 3); ctx.lineTo(x - 30 - l, voeten - 6 - i * 4); ctx.lineTo(x - 30, voeten + 2 - i * 3); ctx.fill();
        }
      }
      const kleuren = { steenbord: '#7a7a7a', vuurbord: '#c0392b', discobord: `hsl(${(performance.now() / 4) % 360}, 90%, 55%)` };
      ctx.fillStyle = kleuren[sb];
      ctx.beginPath();
      ctx.moveTo(x - 34, voeten + 2); ctx.lineTo(x + 34, voeten + 2); ctx.lineTo(x + 30, voeten + 8); ctx.lineTo(x - 30, voeten + 8);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#222'; // wieltjes
      ctx.beginPath(); ctx.arc(x - 20, voeten + 11, 5, 0, Math.PI * 2); ctx.arc(x + 20, voeten + 11, 5, 0, Math.PI * 2); ctx.fill();
    }

    function tekenMunten() {
      const b = levelBreedte();
      const h = canvas.height;
      const tijd = performance.now() / 1000;
      for (const m of level().munten || []) {
        if (m.gepakt) continue;
        const breed = Math.abs(Math.cos(tijd * 4 + m.x * 20)) * 12 + 2; // draaiend muntje
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.ellipse(m.x * b, m.y * h, breed, 12, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
      }
    }

    function tekenMuntenTeller() {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(canvas.width - 100, 40, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(munten, canvas.width - 78, 50);
    }

    function tekenUitleg() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('pijltjes = lopen   spatie = springen (inhouden = power-jump)   K = knots   C = kledingkast', 20, canvas.height - 16);
    }

    // De kledingkast: een paneel over het spel heen
    function tekenKast() {
      const b = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
      ctx.fillRect(0, 0, b, h);
      const px = Math.max(20, b / 2 - 420);
      const py = Math.max(20, h / 2 - 260);
      const pb = Math.min(840, b - 40);
      ctx.fillStyle = '#5a3a1a';
      ctx.fillRect(px, py, pb, 520);
      ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 6; ctx.strokeRect(px, py, pb, 520);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Kledingkast', px + 24, py + 44);
      ctx.textAlign = 'right';
      ctx.fillText(munten + ' muntjes', px + pb - 24, py + 44);

      const rijHoogte = 80;
      kast.categorieen.forEach((cat, r) => {
        const y = py + 80 + r * rijHoogte;
        ctx.textAlign = 'left';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = r === kast.rij ? '#ffe22d' : '#ddd';
        ctx.fillText(cat, px + 24, y + 20);
        kast.spullen[cat].forEach((spul, k) => {
          const x = px + 170 + k * 160;
          const gekozen = r === kast.rij && k === kast.kolom;
          const aan = kast.draagt[cat] === spul.id;
          ctx.fillStyle = gekozen ? '#8b5a2b' : '#3a2a1a';
          ctx.fillRect(x, y - 6, 148, 60);
          if (gekozen) { ctx.strokeStyle = '#ffe22d'; ctx.lineWidth = 3; ctx.strokeRect(x, y - 6, 148, 60); }
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 15px sans-serif';
          ctx.fillText(spul.naam, x + 10, y + 16);
          ctx.font = '14px sans-serif';
          ctx.fillStyle = aan ? '#2dff8a' : kast.bezit[spul.id] ? '#aaa' : munten >= spul.prijs ? '#ffd700' : '#ff7a7a';
          ctx.fillText(aan ? 'aan' : kast.bezit[spul.id] ? 'gekocht' : spul.prijs + ' muntjes', x + 10, y + 40);
        });
      });

      ctx.fillStyle = '#ddd';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('pijltjes = kiezen   Enter = kopen / aantrekken / uittrekken   C = sluiten', px + pb / 2, py + 500);
    }

    function tekenHart(x, y, grootte) {
      ctx.beginPath();
      ctx.moveTo(x, y + grootte);
      ctx.bezierCurveTo(x - grootte * 1.5, y - grootte * 0.2, x - grootte * 0.6, y - grootte * 1.2, x, y - grootte * 0.3);
      ctx.bezierCurveTo(x + grootte * 0.6, y - grootte * 1.2, x + grootte * 1.5, y - grootte * 0.2, x, y + grootte);
      ctx.closePath();
      ctx.fill();
    }

    function tekenLevens() {
      for (let i = 0; i < maxLevens; i++) {
        // Volle hartjes voor de levens die je hebt, donkere voor de lege plekken
        ctx.fillStyle = i < mens.levens ? '#e63946' : 'rgba(0, 0, 0, 0.35)';
        tekenHart(40 + i * 50, 40, 18);
      }
    }

    function tekenGameOver() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#e63946';
      ctx.font = 'bold 120px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('RIP', canvas.width / 2, canvas.height / 2);
      ctx.fillStyle = '#fff';
      ctx.font = '32px sans-serif';
      ctx.fillText('Druk op R om opnieuw te beginnen', canvas.width / 2, canvas.height / 2 + 70);
    }

    // De jump-meter boven het hoofd, alleen zichtbaar tijdens het opladen
    function tekenJumpMeter() {
      if (mens.lading <= 0) return;
      const breed = 70;
      const x = mens.x - breed / 2;
      const y = mens.y - 200;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(x - 2, y - 2, breed + 4, 14);
      ctx.fillStyle = mens.lading >= 1 ? '#2ecc71' : '#f39c12';
      ctx.fillRect(x, y, breed * mens.lading, 10);
      if (mens.lading >= 1) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('POWER!', mens.x, y - 6);
      }
    }

    function tekenLevelNaam() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(canvas.width / 2 - 220, 14, 440, 44);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(level().naam, canvas.width / 2, 45);
    }

    function tekenGewonnen() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 100px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GEWONNEN!', canvas.width / 2, canvas.height / 2);
      ctx.fillStyle = '#fff';
      ctx.font = '32px sans-serif';
      ctx.fillText('Je hebt alle ' + levels.length + ' levels gehaald. Druk op R om opnieuw te beginnen', canvas.width / 2, canvas.height / 2 + 70);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenLucht();

      // Alles in de wereld schuift mee met de camera
      ctx.save();
      ctx.translate(-cameraX(), 0);
      tekenAchtergrond();
      tekenParcours();
      tekenObstakels();
      tekenMunten();
      tekenMens();
      tekenJumpMeter();
      ctx.restore();

      // De hartjes en de levelnaam blijven op hun plek op het scherm
      tekenLevens();
      tekenMuntenTeller();
      tekenUitleg();
      tekenLevelNaam();
      if (kastOpen) tekenKast();
      if (gameOver) tekenGameOver();
      if (gewonnen) tekenGewonnen();
    }

    startOpnieuw();
    let vorige = performance.now();
    function loop(nu) {
      if ((gameOver || gewonnen) && toetsen['r']) {
        gameOver = false;
        gewonnen = false;
        huidigLevel = 0;
        mens.levens = maxLevens;
        beestenTerug();
        startOpnieuw();
      }
      if (!gameOver && !gewonnen && !kastOpen) update(Math.min((nu - vorige) / 1000, 0.05));
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
