<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nine-en-soof</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; color: #111; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    let grondY = 0;
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      grondY = canvas.height - 90;
    }
    pasGrootteAan();
    window.addEventListener('resize', () => {
      pasGrootteAan();
      if (inKeukenScherm) herschikKeuken();
    });

    let tijd = 0;

    // ---------- tekenen in cartoon-stijl ----------
    // Alles krijgt een dikke donkere lijn eromheen en randen die een beetje scheef
    // zijn, zodat het lijkt alsof het met de hand getekend is.

    const INKT = '#3b2d23';

    // Altijd dezelfde "toevallige" waarde voor hetzelfde nummer, zodat het beeld niet trilt.
    function ruis(n) {
      return (Math.sin(n * 127.1) * 43758.5453) % 1;
    }

    function inktLijn(dikte) {
      ctx.strokeStyle = INKT;
      ctx.lineWidth = dikte;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
    }

    // Vult het pad dat je net getekend hebt en zet er een inktlijn omheen.
    function vulEnOmlijn(kleur, dikte) {
      ctx.fillStyle = kleur;
      ctx.fill();
      inktLijn(dikte);
      ctx.stroke();
    }

    // Een ovaal met een wiebelige rand, alsof hij met de hand getekend is.
    function schetsOvaal(x, y, rx, ry, zaad) {
      const stappen = 26;
      ctx.beginPath();
      for (let i = 0; i <= stappen; i++) {
        const hoek = (i / stappen) * Math.PI * 2;
        const wiebel = 1 + ruis(zaad + i) * 0.04;
        const px = x + Math.cos(hoek) * rx * wiebel;
        const py = y + Math.sin(hoek) * ry * wiebel;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // Een blok met ronde hoeken en scheve randen.
    function schetsBlok(x, y, breedte, hoogte, zaad) {
      const r = 14;
      const w = (n) => ruis(zaad + n) * 4;
      ctx.beginPath();
      ctx.moveTo(x + r, y + w(1));
      ctx.lineTo(x + breedte - r, y + w(2));
      ctx.quadraticCurveTo(x + breedte, y, x + breedte + w(3), y + r);
      ctx.lineTo(x + breedte + w(4), y + hoogte - r);
      ctx.quadraticCurveTo(x + breedte, y + hoogte, x + breedte - r, y + hoogte);
      ctx.lineTo(x + r, y + hoogte);
      ctx.quadraticCurveTo(x, y + hoogte, x + w(5), y + hoogte - r);
      ctx.lineTo(x + w(6), y + r);
      ctx.quadraticCurveTo(x, y, x + r, y + w(1));
      ctx.closePath();
    }

    // ---------- de outfits en de muntjes ----------

    // Elke outfit geeft de kat een andere vachtkleur en een andere hoed.
    // De eerste heb je al, de rest koop je met muntjes in de winkel.
    const OUTFITS = [
      { naam: 'Kok',        prijs: 0,  vacht: '#f49cb9', donker: '#dd7fa0', buik: '#fdeef3', roze: '#d9657f', hoed: 'kok' },
      { naam: 'Ninja',      prijs: 5,  vacht: '#5c6670', donker: '#49525b', buik: '#cfd6dc', roze: '#9aa5ae', hoed: 'band' },
      { naam: 'Prinses',    prijs: 8,  vacht: '#f7d6e8', donker: '#e3bcd6', buik: '#fffafd', roze: '#d9657f', hoed: 'kroon' },
      { naam: 'Piraat',     prijs: 12, vacht: '#c08a5a', donker: '#a97548', buik: '#f3e2cd', roze: '#b05a46', hoed: 'piraat' },
      { naam: 'Feestbeest', prijs: 16, vacht: '#b48ad8', donker: '#9a72bf', buik: '#f1e6fa', roze: '#d9657f', hoed: 'feest' },
      { naam: 'Sportkat',   prijs: 20, vacht: '#8fd17a', donker: '#75b862', buik: '#eaf7e4', roze: '#d9657f', hoed: 'pet' },
    ];

    let munten = 0;          // je spaarpot
    let gekocht = [0];       // welke outfits je al hebt
    let outfitAan = 0;       // welke je nu draagt
    let laatsteBeloning = 0; // wat je net verdiend hebt, voor op het eindbord

    // De outfit die de kat nu aanheeft.
    function outfit() {
      return OUTFITS[outfitAan] || OUTFITS[0];
    }

    // Munten en outfits bewaren we in de browser, zodat je ze na het herladen
    // van de pagina nog hebt. Lukt dat niet, dan begin je gewoon opnieuw.
    const BEWAARSLEUTEL = 'nine-en-soof';

    function laadBewaard() {
      try {
        const bewaard = JSON.parse(localStorage.getItem(BEWAARSLEUTEL));
        if (!bewaard) return;
        munten = bewaard.munten || 0;
        gekocht = Array.isArray(bewaard.gekocht) ? bewaard.gekocht : [0];
        outfitAan = bewaard.aan || 0;
        if (!gekocht.includes(0)) gekocht.push(0);
        if (!gekocht.includes(outfitAan)) outfitAan = 0;
      } catch (e) {
        // geen opslag beschikbaar, niets aan de hand
      }
    }

    function bewaar() {
      try {
        localStorage.setItem(BEWAARSLEUTEL, JSON.stringify({ munten, gekocht, aan: outfitAan }));
      } catch (e) {
        // geen opslag beschikbaar, niets aan de hand
      }
    }

    // Je verdient alleen munten als de bestelling precies klopt. Fout is
    // fout, dan moet je het nog een keer doen.
    function beloning() {
      return bestellingKlopt() ? 3 : 0;
    }

    // Tekent een hoed. De onderkant van de hoed ligt op y = 0 en hij staat
    // midden boven x = 0, zodat hij zowel op de kat van voren als van opzij
    // past: je zet de tekenpen eerst op de bovenkant van zijn kop.
    function tekenHoed(soort) {
      if (soort === 'kok') {
        // koksmuts: eerst de bollen, dan de band eroverheen
        ctx.beginPath();
        ctx.arc(-20, -50, 17, Math.PI * 0.75, Math.PI * 1.85);
        ctx.arc(1, -61, 21, Math.PI * 1.15, Math.PI * 1.9);
        ctx.arc(22, -50, 17, Math.PI * 1.1, Math.PI * 0.35);
        ctx.closePath();
        vulEnOmlijn('#fffdf7', 5);
        schetsBlok(-29, -22, 58, 22, 601);
        vulEnOmlijn('#ffffff', 5);
        inktLijn(3);
        ctx.beginPath();
        ctx.moveTo(-10, -19); ctx.lineTo(-10, -4);
        ctx.moveTo(10, -19); ctx.lineTo(10, -4);
        ctx.stroke();
      } else if (soort === 'kroon') {
        // een gouden kroon met puntjes en juweeltjes
        ctx.beginPath();
        ctx.moveTo(-30, 0);
        ctx.lineTo(-30, -28);
        ctx.lineTo(-15, -12);
        ctx.lineTo(0, -36);
        ctx.lineTo(15, -12);
        ctx.lineTo(30, -28);
        ctx.lineTo(30, 0);
        ctx.closePath();
        vulEnOmlijn('#ffd43b', 5);
        ctx.fillStyle = '#e4572e';
        for (const jx of [-16, 0, 16]) {
          ctx.beginPath();
          ctx.arc(jx, -7, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (soort === 'piraat') {
        // een brede piratenhoed met een doodshoofdje
        ctx.beginPath();
        ctx.moveTo(-42, -2);
        ctx.quadraticCurveTo(-32, -44, 0, -44);
        ctx.quadraticCurveTo(32, -44, 42, -2);
        ctx.quadraticCurveTo(0, -16, -42, -2);
        ctx.closePath();
        vulEnOmlijn('#3b2d23', 5);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -26, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = INKT;
        ctx.beginPath();
        ctx.arc(-3, -27, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(3, -27, 1.8, 0, Math.PI * 2);
        ctx.fill();
      } else if (soort === 'feest') {
        // een puntmuts met strepen en een pluim
        ctx.beginPath();
        ctx.moveTo(-25, 0);
        ctx.lineTo(0, -64);
        ctx.lineTo(25, 0);
        ctx.closePath();
        vulEnOmlijn('#f0a6ae', 5);
        inktLijn(4);
        ctx.strokeStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(-18, -17); ctx.lineTo(18, -17);
        ctx.moveTo(-11, -34); ctx.lineTo(11, -34);
        ctx.stroke();
        schetsOvaal(0, -68, 9, 9, 602);
        vulEnOmlijn('#ffd43b', 4);
      } else if (soort === 'band') {
        // een hoofdband met twee linten die wapperen
        const wap = Math.sin(tijd * 4) * 7;
        inktLijn(6);
        ctx.strokeStyle = '#c0392b';
        ctx.beginPath();
        ctx.moveTo(26, -14);
        ctx.quadraticCurveTo(48, -8 + wap, 64, -20 + wap);
        ctx.moveTo(26, -7);
        ctx.quadraticCurveTo(46, 4 + wap, 60, 0 + wap);
        ctx.stroke();
        schetsBlok(-31, -21, 62, 20, 603);
        vulEnOmlijn('#c0392b', 5);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, -11, 6, 0, Math.PI * 2);
        ctx.fill();
      } else if (soort === 'pet') {
        // een pet met een klep
        ctx.beginPath();
        ctx.moveTo(8, -8);
        ctx.quadraticCurveTo(50, -12, 46, 2);
        ctx.quadraticCurveTo(28, 7, 8, 3);
        ctx.closePath();
        vulEnOmlijn('#2f6a99', 5);
        ctx.beginPath();
        ctx.arc(0, -2, 30, Math.PI, 0);
        ctx.closePath();
        vulEnOmlijn('#3f8fc4', 5);
        ctx.fillStyle = '#2f6a99';
        ctx.beginPath();
        ctx.arc(0, -31, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---------- de kat ----------

    // De kat. x en y zijn het midden van zijn voeten.
    const kat = {
      x: 120,
      y: 0,
      snelheidX: 0,
      snelheidY: 0,
      breedte: 70,
      hoogte: 130,
      opGrond: true,
      aanHetSpringen: false, // staat aan zolang het vasthouden van de spatie nog meetelt
      vasthoudTijd: 0,       // hoe lang je de spatie al vasthoudt tijdens deze sprong
      powerjump: false,      // lang genoeg vastgehouden voor de grote sprong
      kijkt: 1,              // 1 is naar rechts, -1 is naar links
      stap: 0,               // waar hij in zijn looppasje zit
    };

    // Tekent een kat met zijn voeten op (x, y). Met schaal maak je hem groter of kleiner.
    function tekenKat(x, y, schaal, welke) {
      const o = welke || outfit();
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      const vacht = o.vacht;
      const buik = o.buik;
      const roze = o.roze;

      // staart, zwaait heen en weer
      const zwaai = Math.sin(tijd * 2) * 0.35;
      ctx.beginPath();
      ctx.moveTo(38, -18);
      ctx.quadraticCurveTo(80, -30 + zwaai * 40, 72, -80 + zwaai * 30);
      inktLijn(22);
      ctx.stroke();
      ctx.strokeStyle = vacht;
      ctx.lineWidth = 14;
      ctx.stroke();

      // lijf
      schetsOvaal(0, -38, 42, 44, 10);
      vulEnOmlijn(vacht, 5);

      // lichte buik
      schetsOvaal(0, -30, 24, 30, 20);
      ctx.fillStyle = buik;
      ctx.fill();

      // voorpootjes
      schetsOvaal(-18, -8, 13, 9, 30);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(18, -8, 13, 9, 40);
      vulEnOmlijn(vacht, 5);

      // oren
      ctx.beginPath();
      ctx.moveTo(-34, -96);
      ctx.quadraticCurveTo(-32, -126, -24, -130);
      ctx.quadraticCurveTo(-14, -120, -6, -104);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);
      ctx.beginPath();
      ctx.moveTo(34, -96);
      ctx.quadraticCurveTo(32, -126, 24, -130);
      ctx.quadraticCurveTo(14, -120, 6, -104);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);

      // binnenkant van de oren
      ctx.beginPath();
      ctx.moveTo(-29, -101);
      ctx.lineTo(-24, -121);
      ctx.lineTo(-14, -105);
      ctx.closePath();
      ctx.fillStyle = roze;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(29, -101);
      ctx.lineTo(24, -121);
      ctx.lineTo(14, -105);
      ctx.closePath();
      ctx.fill();

      // kop
      schetsOvaal(0, -92, 40, 34, 50);
      vulEnOmlijn(vacht, 5);

      // de hoed van de outfit, bovenop zijn kop
      ctx.save();
      ctx.translate(0, -116);
      tekenHoed(o.hoed);
      ctx.restore();

      // wangen
      schetsOvaal(-13, -80, 14, 11, 60);
      ctx.fillStyle = buik;
      ctx.fill();
      schetsOvaal(13, -80, 14, 11, 70);
      ctx.fill();

      // ogen, die af en toe knipperen
      const knippert = Math.sin(tijd * 1.3) > 0.97;
      if (knippert) {
        inktLijn(4);
        ctx.beginPath();
        ctx.moveTo(-22, -99);
        ctx.quadraticCurveTo(-15, -95, -8, -99);
        ctx.moveTo(8, -99);
        ctx.quadraticCurveTo(15, -95, 22, -99);
        ctx.stroke();
      } else {
        ctx.fillStyle = INKT;
        schetsOvaal(-15, -99, 7, 9, 80);
        ctx.fill();
        schetsOvaal(15, -99, 7, 9, 90);
        ctx.fill();
        // lichtpuntjes in de ogen
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-13, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(17, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // neusje
      ctx.beginPath();
      ctx.moveTo(-6, -83);
      ctx.lineTo(6, -83);
      ctx.lineTo(0, -76);
      ctx.closePath();
      vulEnOmlijn(roze, 3);

      // mondje
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(0, -76);
      ctx.lineTo(0, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(-5, -67, -11, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(5, -67, 11, -72);
      ctx.stroke();

      // snorharen
      inktLijn(2.5);
      ctx.beginPath();
      ctx.moveTo(-15, -81); ctx.quadraticCurveTo(-30, -86, -46, -88);
      ctx.moveTo(-15, -77); ctx.quadraticCurveTo(-31, -77, -47, -74);
      ctx.moveTo(15, -81); ctx.quadraticCurveTo(30, -86, 46, -88);
      ctx.moveTo(15, -77); ctx.quadraticCurveTo(31, -77, 47, -74);
      ctx.stroke();

      ctx.restore();
    }

    // De kat van opzij, zoals je hem ziet zodra hij loopt of springt.
    // richting is 1 naar rechts en -1 naar links, stap is waar hij in zijn
    // looppasje zit, en springt zet zijn pootjes in een sprongstand.
    function tekenKatZij(x, y, schaal, richting, stap, springt) {
      const o = outfit();
      const vacht = o.vacht;
      const donker = o.donker;    // de pootjes aan de overkant
      const buik = o.buik;
      const roze = o.roze;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal * richting, schaal);

      // Eén pootje. f bepaalt waar het in de pas zit: naar voren zwaaien,
      // neerzetten, en weer naar achteren.
      function tekenPoot(basis, kleur, f) {
        const voetX = basis + Math.sin(f) * 16;
        const voetY = -Math.max(0, Math.cos(f)) * 14;
        ctx.beginPath();
        ctx.moveTo(basis, -44);
        ctx.quadraticCurveTo(basis + Math.sin(f) * 9, -24, voetX, voetY - 6);
        inktLijn(17);
        ctx.stroke();
        ctx.strokeStyle = kleur;
        ctx.lineWidth = 11;
        ctx.stroke();
        schetsOvaal(voetX, voetY - 6, 11, 7, basis + 300);
        vulEnOmlijn(kleur, 4);
      }

      // in de lucht staan de pootjes stil, uit elkaar
      const achter = springt ? -0.95 : stap;
      const voor = springt ? 0.95 : stap + Math.PI;

      // de twee pootjes aan de overkant eerst, want die zitten achter het lijf
      tekenPoot(-26, donker, achter + Math.PI);
      tekenPoot(26, donker, voor + Math.PI);

      // staart
      const zwaai = Math.sin(tijd * 2.6) * 0.4;
      ctx.beginPath();
      ctx.moveTo(-42, -58);
      ctx.quadraticCurveTo(-80, -58 + zwaai * 32, -72, -108 + zwaai * 26);
      inktLijn(20);
      ctx.stroke();
      ctx.strokeStyle = vacht;
      ctx.lineWidth = 13;
      ctx.stroke();

      // lijf
      schetsOvaal(-2, -56, 46, 33, 110);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(-6, -45, 34, 17, 111);
      ctx.fillStyle = buik;
      ctx.fill();

      // en dan de twee pootjes aan deze kant
      tekenPoot(-20, vacht, achter);
      tekenPoot(30, vacht, voor);

      // kop met snuitje
      schetsOvaal(36, -94, 32, 29, 112);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(58, -84, 17, 13, 113);
      ctx.fillStyle = buik;
      ctx.fill();

      // het oor dat je ziet
      ctx.beginPath();
      ctx.moveTo(22, -114);
      ctx.quadraticCurveTo(20, -143, 31, -146);
      ctx.quadraticCurveTo(43, -134, 49, -116);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);
      ctx.beginPath();
      ctx.moveTo(28, -118);
      ctx.lineTo(32, -138);
      ctx.lineTo(43, -120);
      ctx.closePath();
      ctx.fillStyle = roze;
      ctx.fill();

      // oog, dat af en toe knippert
      const knippert = Math.sin(tijd * 1.3) > 0.97;
      if (knippert) {
        inktLijn(4);
        ctx.beginPath();
        ctx.moveTo(42, -100);
        ctx.quadraticCurveTo(49, -96, 56, -100);
        ctx.stroke();
      } else {
        ctx.fillStyle = INKT;
        schetsOvaal(49, -100, 7, 9, 114);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(51, -103, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // neusje en mondje
      ctx.beginPath();
      ctx.moveTo(66, -90);
      ctx.lineTo(74, -86);
      ctx.lineTo(66, -82);
      ctx.closePath();
      vulEnOmlijn(roze, 3);
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(69, -82);
      ctx.quadraticCurveTo(66, -74, 58, -76);
      ctx.stroke();

      // snorharen naar voren
      inktLijn(2.5);
      ctx.beginPath();
      ctx.moveTo(62, -88); ctx.quadraticCurveTo(78, -94, 92, -96);
      ctx.moveTo(62, -84); ctx.quadraticCurveTo(79, -82, 94, -78);
      ctx.stroke();

      // de hoed, een beetje achterover
      ctx.save();
      ctx.translate(32, -120);
      ctx.rotate(-0.14);
      tekenHoed(o.hoed);
      ctx.restore();

      ctx.restore();
    }

    // ---------- het eten ----------

    // Alle etenswaren die in het spel voorkomen. Elk level gebruikt er een
    // paar van. laagstijl zegt hoe het eruitziet als het als laag op het matje
    // ligt, kleur is de hoofdkleur en lijn de kleur van de streepjes erin.
    const ETEN = {
      rijst:     { naam: 'rijst',     lid: 'de',  kleur: '#fdfbf1', lijn: '#d8d0b6', laagstijl: 'korrels' },
      nori:      { naam: 'zeewier',   lid: 'het', kleur: '#31472f', lijn: '#7fa871', laagstijl: 'vel' },
      zalm:      { naam: 'zalm',      lid: 'de',  kleur: '#f08b5a', lijn: '#fbdcc8', laagstijl: 'strepen' },
      komkommer: { naam: 'komkommer', lid: 'de',  kleur: '#6fb33f', lijn: '#d8eeb4', laagstijl: 'reepjes' },
      avocado:   { naam: 'avocado',   lid: 'de',  kleur: '#9ec96a', lijn: '#4f7f39', laagstijl: 'plakjes' },
      garnaal:   { naam: 'garnaal',   lid: 'de',  kleur: '#ff9d7a', lijn: '#ffd9c9', laagstijl: 'strepen' },
      ei:        { naam: 'omelet',    lid: 'de',  kleur: '#ffcf45', lijn: '#fff0b8', laagstijl: 'reepjes' },
      krab:      { naam: 'krab',      lid: 'de',  kleur: '#fff3ea', lijn: '#e4572e', laagstijl: 'reepjes' },
      tonijn:    { naam: 'tonijn',    lid: 'de',  kleur: '#c1452f', lijn: '#f3a08c', laagstijl: 'strepen' },
      mango:     { naam: 'mango',     lid: 'de',  kleur: '#ffa52b', lijn: '#ffe0a3', laagstijl: 'plakjes' },
      wasabi:    { naam: 'wasabi',    lid: 'de',  kleur: '#8fc93a', lijn: '#dff0a8', laagstijl: 'bolletjes' },
    };

    // ---------- de levels ----------

    // Elk level heeft zijn eigen eilandjes, zijn eigen eten en zijn eigen
    // kleuren. finishX is waar de vlag staat; de keuken en de breedte van het
    // level rekenen we daaruit uit.
    //
    // Over de eilandjes: hoogte is hoe hoog de bovenkant boven de grond zit.
    // Zonder dikte is het een rotsblok dat op de grond staat, met dikte is het
    // een zwevend eilandje. Een eilandje hangt minstens 135 hoog boven de
    // grond min zijn dikte, zodat de kat eronderdoor kan lopen.
    //
    // Belangrijk: onder een eilandje kan hij wel lopen maar niet springen,
    // want dan stoot hij zijn kop. Laat daarom minstens 100 pixels tussen een
    // rotsblok en een eilandje. De kat is 70 breed, dus dan houdt hij altijd
    // een plekje over waar hij vrij staat en over de rots kan springen. Staat
    // een rots er vlak naast, dan komt hij er nooit overheen en zit hij klem.
    const LEVELS = [
      {
        naam: 'de groene heuvels',
        finishX: 3600,
        gast: { naam: 'Mimi', dier: 'muis', kleur: '#d9c2b2' },

                eiland: '#a98c6b', struik: '#5f9d46' },
        obstakels: [
          { x: 300,  breedte: 90,  hoogte: 70 },
          { x: 560,  breedte: 120, hoogte: 175, dikte: 26 },
          { x: 740,  breedte: 110, hoogte: 250, dikte: 26 },
          { x: 1050, breedte: 80,  hoogte: 80 },
          { x: 1280, breedte: 120, hoogte: 190, dikte: 26 },
          { x: 1450, breedte: 100, hoogte: 265, dikte: 26 },
          { x: 1620, breedte: 90,  hoogte: 335, dikte: 26 },
          { x: 1790, breedte: 110, hoogte: 265, dikte: 26 },
          { x: 1980, breedte: 100, hoogte: 185, dikte: 26 },
          { x: 2180, breedte: 90,  hoogte: 185, dikte: 26 },
          { x: 2360, breedte: 90,  hoogte: 250, dikte: 26 },
          { x: 2520, breedte: 100, hoogte: 320, dikte: 26 },
          { x: 2680, breedte: 100, hoogte: 390, dikte: 26 },
          { x: 2850, breedte: 110, hoogte: 300, dikte: 26 },
          { x: 3050, breedte: 100, hoogte: 200, dikte: 26 },
          { x: 3250, breedte: 120, hoogte: 165, dikte: 26 },
        ],
        eten: [
          { soort: 'rijst',     x: 470,  hoogte: 150 },
          { soort: 'nori',      x: 700,  hoogte: 300 },
          { soort: 'zalm',      x: 1570, hoogte: 390 },
          { soort: 'komkommer', x: 2130, hoogte: 240 },
          { soort: 'avocado',   x: 2730, hoogte: 460 },
        ],
      },
      {
        naam: 'de avondzon',
        finishX: 3900,
        gast: { naam: 'Boris', dier: 'beer', kleur: '#b98a5e' },
        tema: { lucht1: '#ff9e5e', lucht2: '#ffe2b8', berg: '#9c7a9e', heuvel: '#7f9a55',
                gras: '#6b9c43', spriet: '#3f6b2c', aarde: '#a8754a', rots: '#9a8f93',
                eiland: '#8f7252', struik: '#4e8438' },
        obstakels: [
          { x: 320,  breedte: 90,  hoogte: 75 },
          { x: 540,  breedte: 110, hoogte: 180, dikte: 26 },
          { x: 720,  breedte: 100, hoogte: 255, dikte: 26 },
          { x: 900,  breedte: 110, hoogte: 190, dikte: 26 },
          { x: 1100, breedte: 100, hoogte: 230, dikte: 26 },
          { x: 1250, breedte: 90,  hoogte: 300, dikte: 26 },
          { x: 1500, breedte: 80,  hoogte: 90 },
          { x: 1730, breedte: 100, hoogte: 175, dikte: 26 },
          { x: 1900, breedte: 90,  hoogte: 250, dikte: 26 },
          { x: 2060, breedte: 90,  hoogte: 330, dikte: 26 },
          { x: 2230, breedte: 100, hoogte: 255, dikte: 26 },
          { x: 2400, breedte: 90,  hoogte: 180, dikte: 26 },
          { x: 2650, breedte: 90,  hoogte: 70 },
          { x: 2890, breedte: 110, hoogte: 200, dikte: 26 },
          { x: 3080, breedte: 100, hoogte: 280, dikte: 26 },
          { x: 3260, breedte: 90,  hoogte: 360, dikte: 26 },
          { x: 3440, breedte: 110, hoogte: 260, dikte: 26 },
          { x: 3620, breedte: 100, hoogte: 180, dikte: 26 },
        ],
        eten: [
          { soort: 'rijst',   x: 450,  hoogte: 150 },
          { soort: 'nori',    x: 680,  hoogte: 310 },
          { soort: 'garnaal', x: 1200, hoogte: 350 },
          { soort: 'ei',      x: 2150, hoogte: 400 },
          { soort: 'krab',    x: 3350, hoogte: 420 },
        ],
      },
      {
        naam: 'de sneeuwtoppen',
        finishX: 3850,
        gast: { naam: 'Pippa', dier: 'vogel', kleur: '#7fc4e8' },
        tema: { lucht1: '#bcdff2', lucht2: '#f4fbff', berg: '#ffffff', heuvel: '#dfeef5',
                gras: '#eef7fb', spriet: '#b9cfdb', aarde: '#b9c3c9', rots: '#c7d2d8',
                eiland: '#9aa7ad', struik: '#8fb8a0' },
        obstakels: [
          { x: 280,  breedte: 80,  hoogte: 65 },
          { x: 480,  breedte: 100, hoogte: 200, dikte: 26 },
          { x: 650,  breedte: 90,  hoogte: 280, dikte: 26 },
          { x: 820,  breedte: 90,  hoogte: 360, dikte: 26 },
          { x: 990,  breedte: 100, hoogte: 290, dikte: 26 },
          { x: 1180, breedte: 90,  hoogte: 200, dikte: 26 },
          { x: 1360, breedte: 80,  hoogte: 300, dikte: 26 },
          { x: 1520, breedte: 80,  hoogte: 380, dikte: 26 },
          { x: 1690, breedte: 90,  hoogte: 300, dikte: 26 },
          { x: 1950, breedte: 90,  hoogte: 100 },
          { x: 2190, breedte: 90,  hoogte: 190, dikte: 26 },
          { x: 2350, breedte: 80,  hoogte: 290, dikte: 26 },
          { x: 2510, breedte: 80,  hoogte: 390, dikte: 26 },
          { x: 2670, breedte: 80,  hoogte: 300, dikte: 26 },
          { x: 2840, breedte: 90,  hoogte: 210, dikte: 26 },
          { x: 3020, breedte: 80,  hoogte: 320, dikte: 26 },
          { x: 3190, breedte: 80,  hoogte: 420, dikte: 26 },
          { x: 3370, breedte: 90,  hoogte: 300, dikte: 26 },
          { x: 3560, breedte: 100, hoogte: 190, dikte: 26 },
        ],
        eten: [
          { soort: 'rijst',  x: 420,  hoogte: 160 },
          { soort: 'nori',   x: 600,  hoogte: 340 },
          { soort: 'tonijn', x: 900,  hoogte: 430 },
          { soort: 'mango',  x: 2450, hoogte: 450 },
          { soort: 'wasabi', x: 3280, hoogte: 490 },
        ],
      },
    ];

    // Het level is veel breder dan het scherm. De camera schuift mee met de kat.
    let camera = 0;
    let levelNummer = 0;
    let obstakels = [];
    let ingredienten = [];
    let tema = LEVELS[0].tema;
    let finish = { x: 0, hoogte: 260 };
    let LEVELBREEDTE = 0;

    // Zet een level klaar: de eilandjes, het eten, de keuken en de kleuren.
    function laadLevel(n) {
      levelNummer = klem(n, 0, LEVELS.length - 1);
      const L = LEVELS[levelNummer];
      obstakels = L.obstakels;
      tema = L.tema;
      finish = { x: L.finishX, hoogte: 260 };
      keuken = { x: L.finishX + 160, breedte: 330 };
      KOOKPLEK = keuken.x + 70;
      PLANK_X = keuken.x + 225;
      LEVELBREEDTE = keuken.x + 490;
      ingredienten = L.eten.map((e) => ({
        soort: e.soort,
        naam: ETEN[e.soort].naam,
        x: e.x,
        hoogte: e.hoogte,
        gepakt: false,
        plop: 0,
      }));
    }

    // Een level van voren af aan beginnen.
    function startLevel(n) {
      laadLevel(n);
      opnieuw();
    }

    // Mislukt? Dan hoef je het level niet opnieuw: je staat nog in de keuken
    // en mag het nog een keer proberen. De gast houdt dezelfde bestelling, je
    // voorraad ligt er nog, en je begint met een leeg matje.
    function nogEensKoken() {
      gehaald = false;
      rolTijd = -1;
      stapel = [];
      sleept = null;
      foutTijd = 0;
      inKeukenScherm = true;
    }

    // Na de sushi ga je door naar het volgende level, en na het laatste level
    // begin je weer bij het eerste.
    function volgendLevel() {
      startLevel(levelNummer + 1 < LEVELS.length ? levelNummer + 1 : 0);
    }

    // ---------- de keuken ----------

    // Voorbij de finishvlag staat het aanrecht. Druk je daar op T, dan gaat het
    // spel naar het keukenscherm: een close-up waar je zelf de ingrediënten op
    // het matje sleept en daarna de sushi rolt.
    // Deze krijgen hun waarde van laadLevel(), want elk level heeft zijn
    // keuken op een andere plek.
    let keuken = { x: 0, breedte: 330 };
    let KOOKPLEK = 0;                 // hier gaat de kat staan zodra hij begint
    let PLANK_X = 0;                  // het midden van de snijplank
    const AANRECHT_H = 86;

    let inDeKeuken = false;      // staat de kat in het level bij het aanrecht?
    let inKeukenScherm = false;  // is het keukenscherm open?
    let rolTijd = -1;            // -1 tot je op de knop drukt, daarna de animatie
    const ROLDUUR = 1.9;

    // Wat je onderweg gevonden hebt ligt als voorraad op het aanrecht. Die
    // voorraad raakt nooit op: elke keer dat je er iets vanaf sleept maak je
    // een nieuw stuk, zodat je zelf kunt bepalen hoe je sushi eruitziet.
    let voorraad = [];
    let stapel = [];                            // de lagen op het matje, van onder naar boven
    let sleept = null;                          // het stuk dat je nu vasthoudt
    const LAAGRUIMTE = 11;                      // zo dun mag een laag op zijn dunst worden
    const muis = { x: -100, y: -100 };          // waar de muis of je vinger is

    // Een sushi bouw je van onder naar boven op: eerst het zeewier, dan de
    // rijst, en daarna mag de rest in elke volgorde.
    const BOUWVOLGORDE = ['nori', 'rijst'];

    let foutTijd = 0;    // telt af na een verkeerde volgorde
    let foutTekst = '';

    // Wat de gast besteld heeft: een rijtje soorten van onder naar boven.
    let bestelling = [];

    // De gast bestelt alleen dingen die jij ook echt gevonden hebt, anders zou
    // je zijn bestelling nooit kunnen maken. Elke keer dat je de keuken
    // binnenkomt bedenkt hij iets nieuws.
    function maakBestelling() {
      const heb = voorraad.map((v) => v.soort);
      const lijst = [];
      if (heb.includes('nori')) lijst.push('nori');
      if (heb.includes('rijst')) lijst.push('rijst');
      const vullingen = heb.filter((sx) => sx !== 'nori' && sx !== 'rijst');
      if (vullingen.length === 0) return lijst;
      const aantal = 2 + Math.floor(Math.random() * 3);   // twee, drie of vier lagen vulling
      for (let n = 0; n < aantal; n++) {
        lijst.push(vullingen[Math.floor(Math.random() * vullingen.length)]);
      }
      return lijst;
    }

    // Heb je precies gemaakt wat er besteld is, in dezelfde volgorde?
    function bestellingKlopt() {
      return stapel.length === bestelling.length &&
             stapel.every((i, n) => i.soort === bestelling[n]);
    }

    // Of in elk geval hetzelfde eten, maar in een andere volgorde?
    function bestellingBijna() {
      if (bestellingKlopt() || stapel.length !== bestelling.length) return false;
      const mijn = stapel.map((i) => i.soort).sort().join(',');
      return mijn === bestelling.slice().sort().join(',');
    }

    // De gast van dit level.
    function gast() {
      return LEVELS[levelNummer].gast;
    }

    // De kleuren van de vulling in dit level, voor de rolletjes die je snijdt.
    function vullingKleuren() {
      const kleuren = ingredienten
        .filter((i) => i.soort !== 'nori' && i.soort !== 'rijst')
        .map((i) => ETEN[i.soort].kleur);
      return kleuren.length ? kleuren : ['#f08b5a'];
    }

    // Hoeveel rolletjes het worden: met alles erbij drie, met bijna niets één.
    function aantalRollen() {
      return klem(Math.round(aantalGepakt() * 0.6), 1, 3);
    }

    let gehaald = false;   // is de sushi klaar?
    let speeltijd = 0;     // hoe lang je al onderweg bent

    // ---------- de sushi-ingrediënten ----------

    // Het eten dat in dit level te vinden is, met erbij of je het al gepakt
    // hebt. plop telt af na het oprapen, zodat er nog even sterretjes blijven
    // staan. laadLevel() vult deze lijst.

    function aantalGepakt() {
      let n = 0;
      for (const i of ingredienten) if (i.gepakt) n++;
      return n;
    }

    function allesGepakt() {
      return aantalGepakt() === ingredienten.length;
    }

    function opnieuw() {
      kat.x = 120;
      kat.y = grondY;
      kat.snelheidX = 0;
      kat.snelheidY = 0;
      kat.opGrond = true;
      kat.aanHetSpringen = false;
      kat.powerjump = false;
      kat.kijkt = 1;
      kat.stap = 0;
      sprongToetsVorige = true;   // een al ingedrukte spatie telt niet als sprong
      gehaald = false;
      speeltijd = 0;
      inDeKeuken = false;
      inKeukenScherm = false;
      rolTijd = -1;
      voorraad = [];
      stapel = [];
      bestelling = [];
      sleept = null;
      foutTijd = 0;
      for (const i of ingredienten) {
        i.gepakt = false;
        i.plop = 0;
      }
    }

    const toetsen = {};
    window.addEventListener('keydown', (e) => {
      toetsen[e.key] = true;
      // met S ga je naar de kledingwinkel en weer terug
      if ((e.key === 's' || e.key === 'S') && magWinkel()) winkelOpen = !winkelOpen;
      if (e.key === 'Escape') winkelOpen = false;
      if (!winkelOpen) {
        if (e.key === 'r' || e.key === 'R') opnieuw();
        if (gehaald && bestellingKlopt()) {
          // goed gemaakt: de spatie brengt je naar het volgende level
          if (e.key === ' ' || e.key === 'Enter') volgendLevel();
        } else if (gehaald && (e.key === 't' || e.key === 'T')) {
          // fout gemaakt: met T probeer je het nog een keer
          nogEensKoken();
        }
      }
      if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    // Geeft de rechthoek van een obstakel terug: links, rechts, boven, onder.
    function vak(o) {
      const boven = grondY - o.hoogte;
      // een zwevend eilandje houdt onderaan op, een rotsblok loopt door tot de grond
      const onder = o.dikte ? boven + o.dikte : grondY;
      return { links: o.x, rechts: o.x + o.breedte, boven, onder };
    }

    // Botst de kat (op positie x, y) tegen dit obstakel?
    function botst(x, y, o) {
      const v = vak(o);
      const links = x - kat.breedte / 2;
      const rechts = x + kat.breedte / 2;
      const boven = y - kat.hoogte;
      return rechts > v.links && links < v.rechts && y > v.boven && boven < v.onder;
    }

    // Loopt de kat tegen dit ingrediënt aan? Het vak van de kat mag een stukje
    // ruimer zijn dan hij echt is, zodat oprapen makkelijk voelt.
    function raaktKat(i) {
      const y = grondY - i.hoogte;
      return i.x > kat.x - kat.breedte / 2 - 22 &&
             i.x < kat.x + kat.breedte / 2 + 22 &&
             y > kat.y - kat.hoogte - 22 &&
             y < kat.y + 22;
    }

    const LOOPSNELHEID = 260;
    const SPRONGKRACHT = 470;        // de duw omhoog als je de spatie maar heel even tikt
    const EXTRA_SPRONGKRACHT = 1500; // extra duw per seconde zolang je de spatie vasthoudt
    const MAX_VASTHOUD = 0.28;       // langer vasthouden dan dit helpt niet meer
    const POWERJUMP_VANAF = 0.2;     // vanaf hier is het een powerjump, met vonken
    const ZWAARTEKRACHT = 1600;

    // Was de sprongtoets vorige frame al ingedrukt? Zo begin je niet per ongeluk
    // meteen een nieuwe sprong als je de spatie ingedrukt houdt na de landing.
    let sprongToetsVorige = false;

    // Zorgt dat een getal tussen een minimum en een maximum blijft.
    function klem(waarde, min, max) {
      return Math.max(min, Math.min(max, waarde));
    }

    function update(dt) {
      tijd += dt;
      if (foutTijd > 0) foutTijd = Math.max(0, foutTijd - dt);

      // met de winkel open staat het spel stil
      if (winkelOpen) return;

      // Als de sushi klaar is stopt alles en blijft alleen het bord nog staan.
      if (gehaald) {
        volgCamera();
        return;
      }

      // In het keukenscherm staat het level stil: daar doe je alles met de muis.
      if (inKeukenScherm) {
        if (rolTijd >= 0) {
          rolTijd += dt;
          if (rolTijd >= ROLDUUR && !gehaald) {
            gehaald = true;
            laatsteBeloning = beloning();
            if (laatsteBeloning > 0) {
              munten += laatsteBeloning;
              bewaar();
            }
          }
        } else if (klaarOmTeRollen() && (toetsen['Enter'] || toetsen[' '])) {
          rolTijd = 0;   // met enter of de spatie kan het ook
        }
        return;
      }

      speeltijd += dt;

      // links en rechts lopen
      kat.snelheidX = 0;
      if (toetsen['ArrowLeft']) kat.snelheidX = -LOOPSNELHEID;
      if (toetsen['ArrowRight']) kat.snelheidX = LOOPSNELHEID;

      // zolang hij loopt kijkt hij die kant op en gaan zijn pootjes door
      if (kat.snelheidX !== 0) {
        kat.kijkt = kat.snelheidX > 0 ? 1 : -1;
        if (kat.opGrond) kat.stap += Math.abs(kat.snelheidX) * dt * 0.03;
      }

      // springen: een tikje is een klein sprongetje, vasthouden laadt een powerjump op
      const sprongToets = !!(toetsen[' '] || toetsen['ArrowUp']);

      if (sprongToets && !sprongToetsVorige && kat.opGrond) {
        kat.snelheidY = -SPRONGKRACHT;
        kat.opGrond = false;
        kat.aanHetSpringen = true;
        kat.vasthoudTijd = 0;
        kat.powerjump = false;
      }

      if (kat.aanHetSpringen) {
        // zolang je vasthoudt en nog omhoog gaat, krijg je er een beetje vaart bij
        if (sprongToets && kat.vasthoudTijd < MAX_VASTHOUD && kat.snelheidY < 0) {
          kat.vasthoudTijd += dt;
          kat.snelheidY -= EXTRA_SPRONGKRACHT * dt;
          if (kat.vasthoudTijd >= POWERJUMP_VANAF) kat.powerjump = true;
        } else {
          // losgelaten of lang genoeg geduwd: vanaf nu doet de zwaartekracht de rest
          kat.aanHetSpringen = false;
        }
      }

      sprongToetsVorige = sprongToets;

      // eerst opzij bewegen, en terugzetten als je tegen een blok botst
      let nieuweX = kat.x + kat.snelheidX * dt;
      for (const o of obstakels) {
        if (botst(nieuweX, kat.y, o)) nieuweX = kat.x;
      }
      kat.x = klem(nieuweX, kat.breedte / 2, LEVELBREEDTE - kat.breedte / 2);

      // daarna vallen of stijgen
      kat.snelheidY += ZWAARTEKRACHT * dt;
      let nieuweY = kat.y + kat.snelheidY * dt;
      kat.opGrond = false;

      for (const o of obstakels) {
        if (botst(kat.x, nieuweY, o)) {
          const v = vak(o);
          if (kat.snelheidY > 0) {
            // je valt en landt bovenop het blok
            nieuweY = v.boven;
            kat.opGrond = true;
            kat.aanHetSpringen = false;
            kat.powerjump = false;
          } else {
            // je springt en stoot je kop
            nieuweY = v.onder + kat.hoogte;
          }
          kat.snelheidY = 0;
        }
      }

      // de grond
      if (nieuweY > grondY) {
        nieuweY = grondY;
        kat.snelheidY = 0;
        kat.opGrond = true;
        kat.aanHetSpringen = false;
        kat.powerjump = false;
      }
      kat.y = nieuweY;

      // onderweg ingrediënten oprapen
      for (const i of ingredienten) {
        if (!i.gepakt && raaktKat(i)) {
          i.gepakt = true;
          i.plop = 0.7;
        }
        if (i.plop > 0) i.plop = Math.max(0, i.plop - dt);
      }

      // sta je bij het aanrecht? dan kun je met T aan de sushi beginnen
      inDeKeuken = kat.opGrond &&
                   kat.x > keuken.x - 20 &&
                   kat.x < keuken.x + keuken.breedte + 20;

      if (inDeKeuken && (toetsen['t'] || toetsen['T'])) {
        kat.x = KOOKPLEK;   // hij stapt achter het aanrecht
        kat.y = grondY;
        kat.snelheidX = 0;
        kat.snelheidY = 0;
        openKeukenScherm();
      }

      volgCamera();
    }

    // De camera houdt de kat in het midden, maar kijkt nooit buiten het level.
    function volgCamera() {
      const doel = kat.x - canvas.width / 2;
      camera = klem(doel, 0, Math.max(0, LEVELBREEDTE - canvas.width));
    }

    // De zon is een groot sushi-rolletje dat langzaam ronddraait. De vulling
    // heeft de kleur van het eten dat in dit level te vinden is.
    function tekenZon() {
      const x = canvas.width - 110;
      const y = 100;

      // de stralen eromheen, die zachtjes groter en kleiner worden
      ctx.strokeStyle = '#ffd968';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const hoek = (i / 10) * Math.PI * 2 + 0.2;
        const uit = 52 + Math.sin(tijd * 2 + i) * 5;
        ctx.moveTo(x + Math.cos(hoek) * uit, y + Math.sin(hoek) * uit);
        ctx.lineTo(x + Math.cos(hoek) * (uit + 17), y + Math.sin(hoek) * (uit + 17));
      }
      ctx.stroke();

      // en het rolletje zelf
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tijd * 0.15);
      tekenSushi(0, 0, 1.5, vullingKleuren()[0]);
      ctx.restore();
    }

    // Een cartoon-wolk: drie bollen met een platte onderkant.
    function tekenWolk(x, y, s) {
      ctx.beginPath();
      ctx.arc(x - 34 * s, y, 30 * s, Math.PI * 0.85, Math.PI * 1.95);
      ctx.arc(x + 2 * s, y - 18 * s, 34 * s, Math.PI * 1.15, Math.PI * 1.9);
      ctx.arc(x + 42 * s, y, 28 * s, Math.PI * 1.1, Math.PI * 0.2);
      ctx.closePath();
      vulEnOmlijn('#ffffff', 5);
    }

    // Verre bergen met sneeuw erop. Ze schuiven het langzaamst mee, dus ze
    // lijken het verst weg te staan.
    function tekenBergen(vanaf, tot) {
      const AFSTAND = 520;
      const eerste = Math.floor((vanaf - 540) / AFSTAND);
      const laatste = Math.ceil((tot + 540) / AFSTAND);
      for (let i = eerste; i <= laatste; i++) {
        const x = i * AFSTAND;
        const h = 210 + (((i % 3) + 3) % 3) * 70;
        const top = grondY + 20 - h;
        ctx.beginPath();
        ctx.moveTo(x - 270, grondY + 20);
        ctx.lineTo(x, top);
        ctx.lineTo(x + 270, grondY + 20);
        ctx.closePath();
        vulEnOmlijn(tema.berg, 5);

        // de sneeuwkap
        ctx.beginPath();
        ctx.moveTo(x - 62, top + 62);
        ctx.lineTo(x, top);
        ctx.lineTo(x + 62, top + 62);
        ctx.quadraticCurveTo(x + 24, top + 44, x, top + 56);
        ctx.quadraticCurveTo(x - 24, top + 44, x - 62, top + 62);
        ctx.closePath();
        vulEnOmlijn('#ffffff', 4);
      }
    }

    // Struikjes en bloemetjes op de grond. Ze staan altijd op dezelfde plek,
    // want ruis() geeft bij hetzelfde nummer steeds hetzelfde antwoord.
    function tekenBegroeiing(vanaf, tot) {
      const AFSTAND = 165;
      const eerste = Math.floor(vanaf / AFSTAND) - 1;
      const laatste = Math.ceil(tot / AFSTAND) + 1;
      for (let i = eerste; i <= laatste; i++) {
        const x = i * AFSTAND + ruis(i) * 70;
        const soort = ((i % 3) + 3) % 3;
        if (soort === 0) {
          // een struikje van twee bollen
          ctx.beginPath();
          ctx.arc(x - 15, grondY - 6, 17, Math.PI, 0);
          ctx.arc(x + 8, grondY - 10, 21, Math.PI, 0);
          ctx.closePath();
          vulEnOmlijn(tema.struik, 4);
        } else {
          // een bloem met vijf blaadjes
          inktLijn(3);
          ctx.strokeStyle = '#4f7f39';
          ctx.beginPath();
          ctx.moveTo(x, grondY);
          ctx.quadraticCurveTo(x + 5, grondY - 16, x, grondY - 30);
          ctx.stroke();
          ctx.fillStyle = soort === 1 ? '#f0a6ae' : '#ffd968';
          for (let k = 0; k < 5; k++) {
            const hoek = (k / 5) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(x + Math.cos(hoek) * 8, grondY - 30 + Math.sin(hoek) * 8, 6, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#fff3c4';
          ctx.beginPath();
          ctx.arc(x, grondY - 30, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Vogeltjes die langzaam door de lucht trekken.
    function tekenVogels() {
      inktLijn(3);
      ctx.strokeStyle = 'rgba(59, 45, 35, 0.5)';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const x = rondOm(i * 360 + 140 - tijd * 24 - camera * 0.15, canvas.width + 320) - 160;
        const y = 120 + (i % 3) * 48 + Math.sin(tijd * 1.4 + i) * 9;
        const v = 9 + (i % 2) * 4;
        ctx.moveTo(x - v, y);
        ctx.quadraticCurveTo(x - v / 2, y - v * 0.8, x, y);
        ctx.quadraticCurveTo(x + v / 2, y - v * 0.8, x + v, y);
      }
      ctx.stroke();
    }

    // Tekent heuvels van x = vanaf tot x = tot, zodat er altijd genoeg in beeld staan.
    function tekenHeuvels(vanaf, tot) {
      const AFSTAND = 340;
      ctx.fillStyle = tema.heuvel;
      const eerste = Math.floor((vanaf - 360) / AFSTAND);
      const laatste = Math.ceil((tot + 360) / AFSTAND);
      for (let i = eerste; i <= laatste; i++) {
        const x = 150 + i * AFSTAND;
        const r = 160 + (((i % 2) + 2) % 2) * 50;
        ctx.beginPath();
        ctx.ellipse(x, grondY + 20, r, r * 0.55, 0, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        inktLijn(5);
        ctx.stroke();
      }
    }

    // Tekent de grond van x = vanaf tot x = tot, het stuk dat de camera laat zien.
    function tekenGrond(vanaf, tot) {
      const links = Math.floor(vanaf / 30) * 30 - 30;
      const rechts = Math.ceil(tot / 30) * 30 + 30;

      // aarde
      ctx.beginPath();
      ctx.moveTo(links, grondY);
      for (let x = links; x <= rechts; x += 30) {
        ctx.lineTo(x, grondY + Math.sin(x * 0.03) * 3);
      }
      ctx.lineTo(rechts, canvas.height + 10);
      ctx.lineTo(links, canvas.height + 10);
      ctx.closePath();
      ctx.fillStyle = tema.aarde;
      ctx.fill();

      // graslaag bovenop
      ctx.beginPath();
      ctx.moveTo(links, grondY);
      for (let x = links; x <= rechts; x += 30) {
        ctx.lineTo(x, grondY + Math.sin(x * 0.03) * 3);
      }
      ctx.lineTo(rechts, grondY + 18);
      ctx.lineTo(links, grondY + 18);
      ctx.closePath();
      vulEnOmlijn(tema.gras, 5);

      // grassprietjes
      inktLijn(3);
      ctx.strokeStyle = tema.spriet;
      ctx.beginPath();
      for (let x = Math.floor(vanaf / 70) * 70; x < rechts; x += 70) {
        const h = 10 + ruis(x) * 6;
        ctx.moveTo(x, grondY + 2);
        ctx.quadraticCurveTo(x + 4, grondY - h, x + 9, grondY - h - 2);
      }
      ctx.stroke();
    }

    // De finishvlag: een paal met een geruite vlag die in de wind wappert.
    function tekenFinish() {
      const x = finish.x;
      const top = grondY - finish.hoogte;

      // paal
      schetsBlok(x - 8, top, 16, finish.hoogte, 11);
      vulEnOmlijn('#e8ddc8', 5);

      // vlag, opgebouwd uit zwart-witte vakjes die mee golven
      const kolommen = 4;
      const rijen = 3;
      const vlagB = 132;
      const vlagH = 84;
      const vakB = vlagB / kolommen;
      const vakH = vlagH / rijen;
      const golf = (c) => Math.sin(tijd * 4 + c * 0.9) * 8;

      for (let c = 0; c < kolommen; c++) {
        for (let r = 0; r < rijen; r++) {
          const xl = x + 4 + c * vakB;
          const xr = x + 4 + (c + 1) * vakB;
          const gl = golf(c);
          const gr = golf(c + 1);
          ctx.beginPath();
          ctx.moveTo(xl, top + 6 + r * vakH + gl);
          ctx.lineTo(xr, top + 6 + r * vakH + gr);
          ctx.lineTo(xr, top + 6 + (r + 1) * vakH + gr);
          ctx.lineTo(xl, top + 6 + (r + 1) * vakH + gl);
          ctx.closePath();
          ctx.fillStyle = (c + r) % 2 === 0 ? '#3b2d23' : '#fff';
          ctx.fill();
        }
      }

      // inktrand om de hele vlag
      inktLijn(5);
      ctx.beginPath();
      ctx.moveTo(x + 4, top + 6 + golf(0));
      for (let c = 1; c <= kolommen; c++) ctx.lineTo(x + 4 + c * vakB, top + 6 + golf(c));
      for (let c = kolommen; c >= 0; c--) ctx.lineTo(x + 4 + c * vakB, top + 6 + vlagH + golf(c));
      ctx.closePath();
      ctx.stroke();

      // bordje onderaan de paal dat naar de keuken wijst
      schetsBlok(x - 82, grondY - 70, 164, 46, 13);
      vulEnOmlijn('#ffd968', 5);
      ctx.fillStyle = INKT;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('KEUKEN →', x, grondY - 46);
    }

    // ---------- de ingrediënten tekenen ----------

      } else if (soort === 'ei') {

    // Sterretjes op de plek waar net een ingrediënt lag. sterkte loopt van 0.7 naar 0.
    function tekenPlop(x, y, sterkte) {
      const uit = (0.7 - sterkte) * 60;
      ctx.save();
      ctx.globalAlpha = Math.max(0, sterkte / 0.7);
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let k = 0; k < 6; k++) {
        const hoek = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(hoek) * (14 + uit), y + Math.sin(hoek) * (14 + uit));
        ctx.lineTo(x + Math.cos(hoek) * (24 + uit), y + Math.sin(hoek) * (24 + uit));
        ctx.stroke();
      }
      ctx.restore();
    }

    // De ingrediënten in het level zweven een beetje op en neer, zodat ze opvallen.
    function tekenIngredienten() {
      for (const i of ingredienten) {
        const y = grondY - i.hoogte;
        if (!i.gepakt) {
          tekenIngredient(i.soort, i.x, y + Math.sin(tijd * 3 + i.x) * 6, 1);
        } else if (i.plop > 0) {
          tekenPlop(i.x, y, i.plop);
        }
      }
    }

    // Een doorgesneden rolletje van jouw eigen stapel. Wat onderop het matje
    // lag zit aan de buitenkant van de rol, en de laatste laag zit in het
    // midden. Zo zie je in het stukje precies de volgorde terug die jij hebt
    // gemaakt. lagen is een rijtje soorten van onder naar boven.
    function tekenSushiStapel(x, y, schaal, lagen) {
      const rij = lagen && lagen.length ? lagen : ['nori', 'rijst'];
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      const buiten = 30;
      const binnen = 7;
      const stap = (buiten - binnen) / rij.length;

      rij.forEach((soort, n) => {
        const e = ETEN[soort] || ETEN.nori;
        const r = buiten - n * stap;
        schetsOvaal(0, 0, r, r, 311 + n);
        if (n === 0) {
          // de buitenste laag krijgt de dikke inktlijn
          vulEnOmlijn(e.kleur, 5);
        } else {
          ctx.fillStyle = e.kleur;
          ctx.fill();
          inktLijn(2.5);
          ctx.stroke();
        }
      });

      ctx.restore();
    }

    // Een maki-rolletje van bovenaf: zeewier eromheen, dan rijst, en vulling in het midden.
    function tekenSushi(x, y, schaal, vulling) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      schetsOvaal(0, 0, 30, 30, 301);
      vulEnOmlijn('#31472f', 5);
      schetsOvaal(0, 0, 23, 23, 302);
      vulEnOmlijn('#fdfbf1', 3);
      schetsOvaal(0, 0, 10, 10, 303);
      vulEnOmlijn(vulling, 3);
      ctx.restore();
    }

    // ---------- de keuken tekenen ----------

    // Het uithangbord op twee palen. Dit staat achter de kat.
    function tekenKeukenAchter() {

      for (const px of [keuken.x + 18, keuken.x + keuken.breedte - 18]) {

    // Het aanrecht met de snijplank. Dit tekenen we na de kat, zodat hij er
    // echt achter lijkt te staan.
    function tekenKeukenVoor() {
      const top = grondY - AANRECHT_H;

      // het blad
      schetsBlok(keuken.x - 8, top, keuken.breedte + 16, 20, 53);

    // Een keukenmes, met het punt naar links.
    function tekenMes(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(-44, 2);
