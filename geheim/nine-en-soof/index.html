<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nine-en-soof</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; color: #111; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    let grondY = 0;
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      grondY = canvas.height - 90;
    }
    pasGrootteAan();
    window.addEventListener('resize', () => {
      pasGrootteAan();
      if (inKeukenScherm) herschikKeuken();
    });

    let tijd = 0;

    // ---------- tekenen in cartoon-stijl ----------
    // Alles krijgt een dikke donkere lijn eromheen en randen die een beetje scheef
    // zijn, zodat het lijkt alsof het met de hand getekend is.

    const INKT = '#3b2d23';

    // Altijd dezelfde "toevallige" waarde voor hetzelfde nummer, zodat het beeld niet trilt.
    function ruis(n) {
      return (Math.sin(n * 127.1) * 43758.5453) % 1;
    }

    function inktLijn(dikte) {
      ctx.strokeStyle = INKT;
      ctx.lineWidth = dikte;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
    }

    // Vult het pad dat je net getekend hebt en zet er een inktlijn omheen.
    function vulEnOmlijn(kleur, dikte) {
      ctx.fillStyle = kleur;
      ctx.fill();
      inktLijn(dikte);
      ctx.stroke();
    }

    // Een ovaal met een wiebelige rand, alsof hij met de hand getekend is.
    function schetsOvaal(x, y, rx, ry, zaad) {
      const stappen = 26;
      ctx.beginPath();
      for (let i = 0; i <= stappen; i++) {
        const hoek = (i / stappen) * Math.PI * 2;
        const wiebel = 1 + ruis(zaad + i) * 0.04;
        const px = x + Math.cos(hoek) * rx * wiebel;
        const py = y + Math.sin(hoek) * ry * wiebel;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // Een blok met ronde hoeken en scheve randen.
    function schetsBlok(x, y, breedte, hoogte, zaad) {
      const r = 14;
      const w = (n) => ruis(zaad + n) * 4;
      ctx.beginPath();
      ctx.moveTo(x + r, y + w(1));
      ctx.lineTo(x + breedte - r, y + w(2));
      ctx.quadraticCurveTo(x + breedte, y, x + breedte + w(3), y + r);
      ctx.lineTo(x + breedte + w(4), y + hoogte - r);
      ctx.quadraticCurveTo(x + breedte, y + hoogte, x + breedte - r, y + hoogte);
      ctx.lineTo(x + r, y + hoogte);
      ctx.quadraticCurveTo(x, y + hoogte, x + w(5), y + hoogte - r);
      ctx.lineTo(x + w(6), y + r);
      ctx.quadraticCurveTo(x, y, x + r, y + w(1));
      ctx.closePath();
    }

    // ---------- de kat ----------

    // De kat. x en y zijn het midden van zijn voeten.
    const kat = {
      x: 120,
      y: 0,
      snelheidX: 0,
      snelheidY: 0,
      breedte: 70,
      hoogte: 130,
      opGrond: true,
      aanHetSpringen: false, // staat aan zolang het vasthouden van de spatie nog meetelt
      vasthoudTijd: 0,       // hoe lang je de spatie al vasthoudt tijdens deze sprong
      powerjump: false,      // lang genoeg vastgehouden voor de grote sprong
      kijkt: 1,              // 1 is naar rechts, -1 is naar links
      stap: 0,               // waar hij in zijn looppasje zit
    };

    // Tekent een kat met zijn voeten op (x, y). Met schaal maak je hem groter of kleiner.
    function tekenKat(x, y, schaal) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      const vacht = '#f49cb9';
      const buik = '#fdeef3';
      const roze = '#d9657f';

      // staart, zwaait heen en weer
      const zwaai = Math.sin(tijd * 2) * 0.35;
      ctx.beginPath();
      ctx.moveTo(38, -18);
      ctx.quadraticCurveTo(80, -30 + zwaai * 40, 72, -80 + zwaai * 30);
      inktLijn(22);
      ctx.stroke();
      ctx.strokeStyle = vacht;
      ctx.lineWidth = 14;
      ctx.stroke();

      // lijf
      schetsOvaal(0, -38, 42, 44, 10);
      vulEnOmlijn(vacht, 5);

      // lichte buik
      schetsOvaal(0, -30, 24, 30, 20);
      ctx.fillStyle = buik;
      ctx.fill();

      // voorpootjes
      schetsOvaal(-18, -8, 13, 9, 30);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(18, -8, 13, 9, 40);
      vulEnOmlijn(vacht, 5);

      // oren
      ctx.beginPath();
      ctx.moveTo(-34, -96);
      ctx.quadraticCurveTo(-32, -126, -24, -130);
      ctx.quadraticCurveTo(-14, -120, -6, -104);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);
      ctx.beginPath();
      ctx.moveTo(34, -96);
      ctx.quadraticCurveTo(32, -126, 24, -130);
      ctx.quadraticCurveTo(14, -120, 6, -104);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);

      // binnenkant van de oren
      ctx.beginPath();
      ctx.moveTo(-29, -101);
      ctx.lineTo(-24, -121);
      ctx.lineTo(-14, -105);
      ctx.closePath();
      ctx.fillStyle = roze;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(29, -101);
      ctx.lineTo(24, -121);
      ctx.lineTo(14, -105);
      ctx.closePath();
      ctx.fill();

      // kop
      schetsOvaal(0, -92, 40, 34, 50);
      vulEnOmlijn(vacht, 5);

      // koksmuts: eerst de bollen bovenop, daarna de band eroverheen
      ctx.beginPath();
      ctx.arc(-23, -146, 19, Math.PI * 0.75, Math.PI * 1.85);
      ctx.arc(0, -156, 23, Math.PI * 1.15, Math.PI * 1.9);
      ctx.arc(23, -146, 19, Math.PI * 1.1, Math.PI * 0.35);
      ctx.closePath();
      vulEnOmlijn('#fffdf7', 5);

      schetsBlok(-32, -136, 64, 22, 12);
      vulEnOmlijn('#ffffff', 5);

      // twee plooitjes in de band
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(-11, -133);
      ctx.lineTo(-11, -117);
      ctx.moveTo(11, -133);
      ctx.lineTo(11, -117);
      ctx.stroke();

      // wangen
      schetsOvaal(-13, -80, 14, 11, 60);
      ctx.fillStyle = buik;
      ctx.fill();
      schetsOvaal(13, -80, 14, 11, 70);
      ctx.fill();

      // ogen, die af en toe knipperen
      const knippert = Math.sin(tijd * 1.3) > 0.97;
      if (knippert) {
        inktLijn(4);
        ctx.beginPath();
        ctx.moveTo(-22, -99);
        ctx.quadraticCurveTo(-15, -95, -8, -99);
        ctx.moveTo(8, -99);
        ctx.quadraticCurveTo(15, -95, 22, -99);
        ctx.stroke();
      } else {
        ctx.fillStyle = INKT;
        schetsOvaal(-15, -99, 7, 9, 80);
        ctx.fill();
        schetsOvaal(15, -99, 7, 9, 90);
        ctx.fill();
        // lichtpuntjes in de ogen
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-13, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(17, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // neusje
      ctx.beginPath();
      ctx.moveTo(-6, -83);
      ctx.lineTo(6, -83);
      ctx.lineTo(0, -76);
      ctx.closePath();
      vulEnOmlijn(roze, 3);

      // mondje
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(0, -76);
      ctx.lineTo(0, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(-5, -67, -11, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(5, -67, 11, -72);
      ctx.stroke();

      // snorharen
      inktLijn(2.5);
      ctx.beginPath();
      ctx.moveTo(-15, -81); ctx.quadraticCurveTo(-30, -86, -46, -88);
      ctx.moveTo(-15, -77); ctx.quadraticCurveTo(-31, -77, -47, -74);
      ctx.moveTo(15, -81); ctx.quadraticCurveTo(30, -86, 46, -88);
      ctx.moveTo(15, -77); ctx.quadraticCurveTo(31, -77, 47, -74);
      ctx.stroke();

      ctx.restore();
    }

    // De kat van opzij, zoals je hem ziet zodra hij loopt of springt.
    // richting is 1 naar rechts en -1 naar links, stap is waar hij in zijn
    // looppasje zit, en springt zet zijn pootjes in een sprongstand.
    function tekenKatZij(x, y, schaal, richting, stap, springt) {
      const vacht = '#f49cb9';
      const donker = '#dd7fa0';   // de pootjes aan de overkant
      const buik = '#fdeef3';
      const roze = '#d9657f';

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal * richting, schaal);

      // Eén pootje. f bepaalt waar het in de pas zit: naar voren zwaaien,
      // neerzetten, en weer naar achteren.
      function tekenPoot(basis, kleur, f) {
        const voetX = basis + Math.sin(f) * 16;
        const voetY = -Math.max(0, Math.cos(f)) * 14;
        ctx.beginPath();
        ctx.moveTo(basis, -44);
        ctx.quadraticCurveTo(basis + Math.sin(f) * 9, -24, voetX, voetY - 6);
        inktLijn(17);
        ctx.stroke();
        ctx.strokeStyle = kleur;
        ctx.lineWidth = 11;
        ctx.stroke();
        schetsOvaal(voetX, voetY - 6, 11, 7, basis + 300);
        vulEnOmlijn(kleur, 4);
      }

      // in de lucht staan de pootjes stil, uit elkaar
      const achter = springt ? -0.95 : stap;
      const voor = springt ? 0.95 : stap + Math.PI;

      // de twee pootjes aan de overkant eerst, want die zitten achter het lijf
      tekenPoot(-26, donker, achter + Math.PI);
      tekenPoot(26, donker, voor + Math.PI);

      // staart
      const zwaai = Math.sin(tijd * 2.6) * 0.4;
      ctx.beginPath();
      ctx.moveTo(-42, -58);
      ctx.quadraticCurveTo(-80, -58 + zwaai * 32, -72, -108 + zwaai * 26);
      inktLijn(20);
      ctx.stroke();
      ctx.strokeStyle = vacht;
      ctx.lineWidth = 13;
      ctx.stroke();

      // lijf
      schetsOvaal(-2, -56, 46, 33, 110);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(-6, -45, 34, 17, 111);
      ctx.fillStyle = buik;
      ctx.fill();

      // en dan de twee pootjes aan deze kant
      tekenPoot(-20, vacht, achter);
      tekenPoot(30, vacht, voor);

      // kop met snuitje
      schetsOvaal(36, -94, 32, 29, 112);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(58, -84, 17, 13, 113);
      ctx.fillStyle = buik;
      ctx.fill();

      // het oor dat je ziet
      ctx.beginPath();
      ctx.moveTo(22, -114);
      ctx.quadraticCurveTo(20, -143, 31, -146);
      ctx.quadraticCurveTo(43, -134, 49, -116);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);
      ctx.beginPath();
      ctx.moveTo(28, -118);
      ctx.lineTo(32, -138);
      ctx.lineTo(43, -120);
      ctx.closePath();
      ctx.fillStyle = roze;
      ctx.fill();

      // oog, dat af en toe knippert
      const knippert = Math.sin(tijd * 1.3) > 0.97;
      if (knippert) {
        inktLijn(4);
        ctx.beginPath();
        ctx.moveTo(42, -100);
        ctx.quadraticCurveTo(49, -96, 56, -100);
        ctx.stroke();
      } else {
        ctx.fillStyle = INKT;
        schetsOvaal(49, -100, 7, 9, 114);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(51, -103, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // neusje en mondje
      ctx.beginPath();
      ctx.moveTo(66, -90);
      ctx.lineTo(74, -86);
      ctx.lineTo(66, -82);
      ctx.closePath();
      vulEnOmlijn(roze, 3);
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(69, -82);
      ctx.quadraticCurveTo(66, -74, 58, -76);
      ctx.stroke();

      // snorharen naar voren
      inktLijn(2.5);
      ctx.beginPath();
      ctx.moveTo(62, -88); ctx.quadraticCurveTo(78, -94, 92, -96);
      ctx.moveTo(62, -84); ctx.quadraticCurveTo(79, -82, 94, -78);
      ctx.stroke();

      // de koksmuts, een beetje achterover
      ctx.save();
      ctx.translate(32, -120);
      ctx.rotate(-0.14);
      ctx.beginPath();
      ctx.arc(-18, -29, 16, Math.PI * 0.75, Math.PI * 1.85);
      ctx.arc(2, -39, 20, Math.PI * 1.15, Math.PI * 1.9);
      ctx.arc(21, -29, 16, Math.PI * 1.1, Math.PI * 0.35);
      ctx.closePath();
      vulEnOmlijn('#fffdf7', 5);
      schetsBlok(-27, -21, 55, 20, 115);
      vulEnOmlijn('#ffffff', 5);
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(-9, -18); ctx.lineTo(-9, -4);
      ctx.moveTo(9, -18); ctx.lineTo(9, -4);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // ---------- het level ----------

    // Het level is veel breder dan het scherm. De camera schuift mee met de kat.
    const LEVELBREEDTE = 4250;
    let camera = 0;

    // Waar je op kunt staan. hoogte is hoe hoog de bovenkant boven de grond zit.
    // Zonder dikte is het een rotsblok dat op de grond staat; met dikte is het
    // een zwevend eilandje, en dan is dikte hoe dik dat eilandje is. Onder een
    // zwevend eilandje kun je door lopen, want ze hangen hoger dan de kat.
    const obstakels = [
      // Let op: onder een zwevend eilandje kan de kat wel lopen, maar niet
      // springen, want dan stoot hij zijn kop. Een rotsblok op de grond zet je
      // daarom nooit vlak naast een eilandje, anders komt hij er niet overheen.
      { x: 300,  breedte: 90,  hoogte: 70 },

      // de eerste twee eilandjes, met de rijst en het zeewier erbij
      { x: 560,  breedte: 120, hoogte: 175, dikte: 26 },
      { x: 740,  breedte: 110, hoogte: 250, dikte: 26 },

      // weer omlaag, over een rots heen, en dan de klim omhoog
      { x: 1050, breedte: 80,  hoogte: 80 },
      { x: 1280, breedte: 120, hoogte: 190, dikte: 26 },
      { x: 1450, breedte: 100, hoogte: 265, dikte: 26 },
      { x: 1620, breedte: 90,  hoogte: 335, dikte: 26 },
      { x: 1790, breedte: 110, hoogte: 265, dikte: 26 },

      // een stuk met grotere gaten ertussen
      { x: 1980, breedte: 100, hoogte: 185, dikte: 26 },
      { x: 2180, breedte: 90,  hoogte: 185, dikte: 26 },
      { x: 2360, breedte: 90,  hoogte: 250, dikte: 26 },

      // de toren, met de avocado bovenop
      { x: 2520, breedte: 100, hoogte: 320, dikte: 26 },
      { x: 2680, breedte: 100, hoogte: 390, dikte: 26 },
      { x: 2850, breedte: 110, hoogte: 300, dikte: 26 },

      // en zo naar beneden richting de vlag
      { x: 3050, breedte: 100, hoogte: 200, dikte: 26 },
      { x: 3250, breedte: 120, hoogte: 165, dikte: 26 },
    ];

    // De finishvlag aan het eind van het level.
    const finish = { x: 3600, hoogte: 260 };

    // ---------- de keuken ----------

    // Voorbij de finishvlag staat het aanrecht. Druk je daar op T, dan gaat het
    // spel naar het keukenscherm: een close-up waar je zelf de ingrediënten op
    // het matje sleept en daarna de sushi rolt.
    const keuken = { x: 3760, breedte: 330 };
    const KOOKPLEK = keuken.x + 70;   // hier gaat de kat staan zodra hij begint
    const PLANK_X = keuken.x + 225;   // het midden van de snijplank
    const AANRECHT_H = 86;

    let inDeKeuken = false;      // staat de kat in het level bij het aanrecht?
    let inKeukenScherm = false;  // is het keukenscherm open?
    let rolTijd = -1;            // -1 tot je op de knop drukt, daarna de animatie
    const ROLDUUR = 1.9;

    // De ingrediënten die je op het aanrecht heen en weer kunt slepen.
    let sleepItems = [];
    let stapel = [];                            // wat op het matje ligt, van onder naar boven
    let sleept = null;                          // wat je nu vasthoudt
    const muis = { x: -100, y: -100 };          // waar de muis of je vinger is
    const LAAGHOOGTE = 28;                      // hoeveel hoger elke laag komt te liggen

    // Een sushi bouw je van onder naar boven op: eerst het zeewier, dan de
    // rijst, en daarna mag de rest in elke volgorde.
    const BOUWVOLGORDE = ['nori', 'rijst'];

    let foutTijd = 0;    // telt af na een verkeerde volgorde
    let foutTekst = '';

    // Hoeveel rolletjes het worden: met alles erbij drie, met bijna niets één.
    function aantalRollen() {
      return klem(Math.round(aantalGepakt() * 0.6), 1, 3);
    }

    let gehaald = false;   // is de sushi klaar?
    let speeltijd = 0;     // hoe lang je al onderweg bent

    // ---------- de sushi-ingrediënten ----------

    // Aan het eind maakt de kat sushi, maar dan moet hij onderweg wel alles
    // oprapen. hoogte is hoe hoog het ingrediënt boven de grond zweeft, dus 0
    // ligt op de grond. De hoge liggen op een rotsblok of haal je met een
    // powerjump.
    const INGREDIENTEN = [
      { soort: 'rijst',     naam: 'rijst',     lid: 'de',  x: 470,  hoogte: 150 },
      { soort: 'nori',      naam: 'zeewier',   lid: 'het', x: 700,  hoogte: 300 },
      { soort: 'zalm',      naam: 'zalm',      lid: 'de',  x: 1570, hoogte: 390 },
      { soort: 'komkommer', naam: 'komkommer', lid: 'de',  x: 2130, hoogte: 240 },
      { soort: 'avocado',   naam: 'avocado',   lid: 'de',  x: 2730, hoogte: 460 },
    ];

    // De ingrediënten in het spel zelf, met erbij of je ze al gepakt hebt.
    // plop telt af na het oprapen, zodat er nog even sterretjes blijven staan.
    const ingredienten = INGREDIENTEN.map((i) => ({ ...i, gepakt: false, plop: 0 }));

    function aantalGepakt() {
      let n = 0;
      for (const i of ingredienten) if (i.gepakt) n++;
      return n;
    }

    function allesGepakt() {
      return aantalGepakt() === ingredienten.length;
    }

    function opnieuw() {
      kat.x = 120;
      kat.y = grondY;
      kat.snelheidX = 0;
      kat.snelheidY = 0;
      kat.opGrond = true;
      kat.aanHetSpringen = false;
      kat.powerjump = false;
      kat.kijkt = 1;
      kat.stap = 0;
      gehaald = false;
      speeltijd = 0;
      inDeKeuken = false;
      inKeukenScherm = false;
      rolTijd = -1;
      sleepItems = [];
      stapel = [];
      sleept = null;
      foutTijd = 0;
      for (const i of ingredienten) {
        i.gepakt = false;
        i.plop = 0;
      }
    }

    const toetsen = {};
    window.addEventListener('keydown', (e) => {
      toetsen[e.key] = true;
      if (e.key === 'r' || e.key === 'R') opnieuw();
      if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    // Geeft de rechthoek van een obstakel terug: links, rechts, boven, onder.
    function vak(o) {
      const boven = grondY - o.hoogte;
      // een zwevend eilandje houdt onderaan op, een rotsblok loopt door tot de grond
      const onder = o.dikte ? boven + o.dikte : grondY;
      return { links: o.x, rechts: o.x + o.breedte, boven, onder };
    }

    // Botst de kat (op positie x, y) tegen dit obstakel?
    function botst(x, y, o) {
      const v = vak(o);
      const links = x - kat.breedte / 2;
      const rechts = x + kat.breedte / 2;
      const boven = y - kat.hoogte;
      return rechts > v.links && links < v.rechts && y > v.boven && boven < v.onder;
    }

    // Loopt de kat tegen dit ingrediënt aan? Het vak van de kat mag een stukje
    // ruimer zijn dan hij echt is, zodat oprapen makkelijk voelt.
    function raaktKat(i) {
      const y = grondY - i.hoogte;
      return i.x > kat.x - kat.breedte / 2 - 22 &&
             i.x < kat.x + kat.breedte / 2 + 22 &&
             y > kat.y - kat.hoogte - 22 &&
             y < kat.y + 22;
    }

    const LOOPSNELHEID = 260;
    const SPRONGKRACHT = 470;        // de duw omhoog als je de spatie maar heel even tikt
    const EXTRA_SPRONGKRACHT = 1500; // extra duw per seconde zolang je de spatie vasthoudt
    const MAX_VASTHOUD = 0.28;       // langer vasthouden dan dit helpt niet meer
    const POWERJUMP_VANAF = 0.2;     // vanaf hier is het een powerjump, met vonken
    const ZWAARTEKRACHT = 1600;

    // Was de sprongtoets vorige frame al ingedrukt? Zo begin je niet per ongeluk
    // meteen een nieuwe sprong als je de spatie ingedrukt houdt na de landing.
    let sprongToetsVorige = false;

    // Zorgt dat een getal tussen een minimum en een maximum blijft.
    function klem(waarde, min, max) {
      return Math.max(min, Math.min(max, waarde));
    }

    function update(dt) {
      tijd += dt;

      // Als de sushi klaar is stopt alles en blijft alleen het bord nog staan.
      if (gehaald) {
        volgCamera();
        return;
      }

      // In het keukenscherm staat het level stil: daar doe je alles met de muis.
      if (inKeukenScherm) {
        if (foutTijd > 0) foutTijd = Math.max(0, foutTijd - dt);
        if (rolTijd >= 0) {
          rolTijd += dt;
          if (rolTijd >= ROLDUUR) gehaald = true;
        } else if (klaarOmTeRollen() && (toetsen['Enter'] || toetsen[' '])) {
          rolTijd = 0;   // met enter of de spatie kan het ook
        }
        return;
      }

      speeltijd += dt;

      // links en rechts lopen
      kat.snelheidX = 0;
      if (toetsen['ArrowLeft']) kat.snelheidX = -LOOPSNELHEID;
      if (toetsen['ArrowRight']) kat.snelheidX = LOOPSNELHEID;

      // zolang hij loopt kijkt hij die kant op en gaan zijn pootjes door
      if (kat.snelheidX !== 0) {
        kat.kijkt = kat.snelheidX > 0 ? 1 : -1;
        if (kat.opGrond) kat.stap += Math.abs(kat.snelheidX) * dt * 0.03;
      }

      // springen: een tikje is een klein sprongetje, vasthouden laadt een powerjump op
      const sprongToets = !!(toetsen[' '] || toetsen['ArrowUp']);

      if (sprongToets && !sprongToetsVorige && kat.opGrond) {
        kat.snelheidY = -SPRONGKRACHT;
        kat.opGrond = false;
        kat.aanHetSpringen = true;
        kat.vasthoudTijd = 0;
        kat.powerjump = false;
      }

      if (kat.aanHetSpringen) {
        // zolang je vasthoudt en nog omhoog gaat, krijg je er een beetje vaart bij
        if (sprongToets && kat.vasthoudTijd < MAX_VASTHOUD && kat.snelheidY < 0) {
          kat.vasthoudTijd += dt;
          kat.snelheidY -= EXTRA_SPRONGKRACHT * dt;
          if (kat.vasthoudTijd >= POWERJUMP_VANAF) kat.powerjump = true;
        } else {
          // losgelaten of lang genoeg geduwd: vanaf nu doet de zwaartekracht de rest
          kat.aanHetSpringen = false;
        }
      }

      sprongToetsVorige = sprongToets;

      // eerst opzij bewegen, en terugzetten als je tegen een blok botst
      let nieuweX = kat.x + kat.snelheidX * dt;
      for (const o of obstakels) {
        if (botst(nieuweX, kat.y, o)) nieuweX = kat.x;
      }
      kat.x = klem(nieuweX, kat.breedte / 2, LEVELBREEDTE - kat.breedte / 2);

      // daarna vallen of stijgen
      kat.snelheidY += ZWAARTEKRACHT * dt;
      let nieuweY = kat.y + kat.snelheidY * dt;
      kat.opGrond = false;

      for (const o of obstakels) {
        if (botst(kat.x, nieuweY, o)) {
          const v = vak(o);
          if (kat.snelheidY > 0) {
            // je valt en landt bovenop het blok
            nieuweY = v.boven;
            kat.opGrond = true;
            kat.aanHetSpringen = false;
            kat.powerjump = false;
          } else {
            // je springt en stoot je kop
            nieuweY = v.onder + kat.hoogte;
          }
          kat.snelheidY = 0;
        }
      }

      // de grond
      if (nieuweY > grondY) {
        nieuweY = grondY;
        kat.snelheidY = 0;
        kat.opGrond = true;
        kat.aanHetSpringen = false;
        kat.powerjump = false;
      }
      kat.y = nieuweY;

      // onderweg ingrediënten oprapen
      for (const i of ingredienten) {
        if (!i.gepakt && raaktKat(i)) {
          i.gepakt = true;
          i.plop = 0.7;
        }
        if (i.plop > 0) i.plop = Math.max(0, i.plop - dt);
      }

      // sta je bij het aanrecht? dan kun je met T aan de sushi beginnen
      inDeKeuken = kat.opGrond &&
                   kat.x > keuken.x - 20 &&
                   kat.x < keuken.x + keuken.breedte + 20;

      if (inDeKeuken && (toetsen['t'] || toetsen['T'])) {
        kat.x = KOOKPLEK;   // hij stapt achter het aanrecht
        kat.y = grondY;
        kat.snelheidX = 0;
        kat.snelheidY = 0;
        openKeukenScherm();
      }

      volgCamera();
    }

    // De camera houdt de kat in het midden, maar kijkt nooit buiten het level.
    function volgCamera() {
      const doel = kat.x - canvas.width / 2;
      camera = klem(doel, 0, Math.max(0, LEVELBREEDTE - canvas.width));
    }

    function tekenZon() {
      const x = canvas.width - 110;
      const y = 100;
      schetsOvaal(x, y, 42, 42, 100);
      vulEnOmlijn('#ffd968', 5);
      // stralen
      inktLijn(4);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const hoek = (i / 8) * Math.PI * 2 + 0.2;
        ctx.moveTo(x + Math.cos(hoek) * 52, y + Math.sin(hoek) * 52);
        ctx.lineTo(x + Math.cos(hoek) * 68, y + Math.sin(hoek) * 68);
      }
      ctx.stroke();
    }

    // Een cartoon-wolk: drie bollen met een platte onderkant.
    function tekenWolk(x, y, s) {
      ctx.beginPath();
      ctx.arc(x - 34 * s, y, 30 * s, Math.PI * 0.85, Math.PI * 1.95);
      ctx.arc(x + 2 * s, y - 18 * s, 34 * s, Math.PI * 1.15, Math.PI * 1.9);
      ctx.arc(x + 42 * s, y, 28 * s, Math.PI * 1.1, Math.PI * 0.2);
      ctx.closePath();
      vulEnOmlijn('#ffffff', 5);
    }

    // Verre bergen met sneeuw erop. Ze schuiven het langzaamst mee, dus ze
    // lijken het verst weg te staan.
    function tekenBergen(vanaf, tot) {
      const AFSTAND = 520;
      const eerste = Math.floor((vanaf - 540) / AFSTAND);
      const laatste = Math.ceil((tot + 540) / AFSTAND);
      for (let i = eerste; i <= laatste; i++) {
        const x = i * AFSTAND;
        const h = 210 + (((i % 3) + 3) % 3) * 70;
        const top = grondY + 20 - h;
        ctx.beginPath();
        ctx.moveTo(x - 270, grondY + 20);
        ctx.lineTo(x, top);
        ctx.lineTo(x + 270, grondY + 20);
        ctx.closePath();
        vulEnOmlijn('#b6c6d8', 5);

        // de sneeuwkap
        ctx.beginPath();
        ctx.moveTo(x - 62, top + 62);
        ctx.lineTo(x, top);
        ctx.lineTo(x + 62, top + 62);
        ctx.quadraticCurveTo(x + 24, top + 44, x, top + 56);
        ctx.quadraticCurveTo(x - 24, top + 44, x - 62, top + 62);
        ctx.closePath();
        vulEnOmlijn('#ffffff', 4);
      }
    }

    // Struikjes en bloemetjes op de grond. Ze staan altijd op dezelfde plek,
    // want ruis() geeft bij hetzelfde nummer steeds hetzelfde antwoord.
    function tekenBegroeiing(vanaf, tot) {
      const AFSTAND = 165;
      const eerste = Math.floor(vanaf / AFSTAND) - 1;
      const laatste = Math.ceil(tot / AFSTAND) + 1;
      for (let i = eerste; i <= laatste; i++) {
        const x = i * AFSTAND + ruis(i) * 70;
        const soort = ((i % 3) + 3) % 3;
        if (soort === 0) {
          // een struikje van twee bollen
          ctx.beginPath();
          ctx.arc(x - 15, grondY - 6, 17, Math.PI, 0);
          ctx.arc(x + 8, grondY - 10, 21, Math.PI, 0);
          ctx.closePath();
          vulEnOmlijn('#5f9d46', 4);
        } else {
          // een bloem met vijf blaadjes
          inktLijn(3);
          ctx.strokeStyle = '#4f7f39';
          ctx.beginPath();
          ctx.moveTo(x, grondY);
          ctx.quadraticCurveTo(x + 5, grondY - 16, x, grondY - 30);
          ctx.stroke();
          ctx.fillStyle = soort === 1 ? '#f0a6ae' : '#ffd968';
          for (let k = 0; k < 5; k++) {
            const hoek = (k / 5) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(x + Math.cos(hoek) * 8, grondY - 30 + Math.sin(hoek) * 8, 6, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#fff3c4';
          ctx.beginPath();
          ctx.arc(x, grondY - 30, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Vogeltjes die langzaam door de lucht trekken.
    function tekenVogels() {
      inktLijn(3);
      ctx.strokeStyle = 'rgba(59, 45, 35, 0.5)';
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const x = rondOm(i * 360 + 140 - tijd * 24 - camera * 0.15, canvas.width + 320) - 160;
        const y = 120 + (i % 3) * 48 + Math.sin(tijd * 1.4 + i) * 9;
        const v = 9 + (i % 2) * 4;
        ctx.moveTo(x - v, y);
        ctx.quadraticCurveTo(x - v / 2, y - v * 0.8, x, y);
        ctx.quadraticCurveTo(x + v / 2, y - v * 0.8, x + v, y);
      }
      ctx.stroke();
    }

    // Tekent heuvels van x = vanaf tot x = tot, zodat er altijd genoeg in beeld staan.
    function tekenHeuvels(vanaf, tot) {
      const AFSTAND = 340;
      ctx.fillStyle = '#9ec97a';
      const eerste = Math.floor((vanaf - 360) / AFSTAND);
      const laatste = Math.ceil((tot + 360) / AFSTAND);
      for (let i = eerste; i <= laatste; i++) {
        const x = 150 + i * AFSTAND;
        const r = 160 + (((i % 2) + 2) % 2) * 50;
        ctx.beginPath();
        ctx.ellipse(x, grondY + 20, r, r * 0.55, 0, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        inktLijn(5);
        ctx.stroke();
      }
    }

    // Tekent de grond van x = vanaf tot x = tot, het stuk dat de camera laat zien.
    function tekenGrond(vanaf, tot) {
      const links = Math.floor(vanaf / 30) * 30 - 30;
      const rechts = Math.ceil(tot / 30) * 30 + 30;

      // aarde
      ctx.beginPath();
      ctx.moveTo(links, grondY);
      for (let x = links; x <= rechts; x += 30) {
        ctx.lineTo(x, grondY + Math.sin(x * 0.03) * 3);
      }
      ctx.lineTo(rechts, canvas.height + 10);
      ctx.lineTo(links, canvas.height + 10);
      ctx.closePath();
      ctx.fillStyle = '#c99a62';
      ctx.fill();

      // graslaag bovenop
      ctx.beginPath();
      ctx.moveTo(links, grondY);
      for (let x = links; x <= rechts; x += 30) {
        ctx.lineTo(x, grondY + Math.sin(x * 0.03) * 3);
      }
      ctx.lineTo(rechts, grondY + 18);
      ctx.lineTo(links, grondY + 18);
      ctx.closePath();
      vulEnOmlijn('#79b457', 5);

      // grassprietjes
      inktLijn(3);
      ctx.strokeStyle = '#4f7f39';
      ctx.beginPath();
      for (let x = Math.floor(vanaf / 70) * 70; x < rechts; x += 70) {
        const h = 10 + ruis(x) * 6;
        ctx.moveTo(x, grondY + 2);
        ctx.quadraticCurveTo(x + 4, grondY - h, x + 9, grondY - h - 2);
      }
      ctx.stroke();
    }

    // De finishvlag: een paal met een geruite vlag die in de wind wappert.
    function tekenFinish() {
      const x = finish.x;
      const top = grondY - finish.hoogte;

      // paal
      schetsBlok(x - 8, top, 16, finish.hoogte, 11);
      vulEnOmlijn('#e8ddc8', 5);

      // vlag, opgebouwd uit zwart-witte vakjes die mee golven
      const kolommen = 4;
      const rijen = 3;
      const vlagB = 132;
      const vlagH = 84;
      const vakB = vlagB / kolommen;
      const vakH = vlagH / rijen;
      const golf = (c) => Math.sin(tijd * 4 + c * 0.9) * 8;

      for (let c = 0; c < kolommen; c++) {
        for (let r = 0; r < rijen; r++) {
          const xl = x + 4 + c * vakB;
          const xr = x + 4 + (c + 1) * vakB;
          const gl = golf(c);
          const gr = golf(c + 1);
          ctx.beginPath();
          ctx.moveTo(xl, top + 6 + r * vakH + gl);
          ctx.lineTo(xr, top + 6 + r * vakH + gr);
          ctx.lineTo(xr, top + 6 + (r + 1) * vakH + gr);
          ctx.lineTo(xl, top + 6 + (r + 1) * vakH + gl);
          ctx.closePath();
          ctx.fillStyle = (c + r) % 2 === 0 ? '#3b2d23' : '#fff';
          ctx.fill();
        }
      }

      // inktrand om de hele vlag
      inktLijn(5);
      ctx.beginPath();
      ctx.moveTo(x + 4, top + 6 + golf(0));
      for (let c = 1; c <= kolommen; c++) ctx.lineTo(x + 4 + c * vakB, top + 6 + golf(c));
      for (let c = kolommen; c >= 0; c--) ctx.lineTo(x + 4 + c * vakB, top + 6 + vlagH + golf(c));
      ctx.closePath();
      ctx.stroke();

      // bordje onderaan de paal dat naar de keuken wijst
      schetsBlok(x - 82, grondY - 70, 164, 46, 13);
      vulEnOmlijn('#ffd968', 5);
      ctx.fillStyle = INKT;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('KEUKEN →', x, grondY - 46);
    }

    // ---------- de ingrediënten tekenen ----------

    // Alle ingrediënten in dezelfde cartoon-stijl, met (x, y) als hun midden.
    // Met schaal maak je ze groter of kleiner, zodat ze ook in de balk bovenin passen.
    function tekenIngredient(soort, x, y, schaal) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      if (soort === 'rijst') {
        // een bolletje rijst met korreltjes erop
        schetsOvaal(0, 2, 27, 21, 201);
        vulEnOmlijn('#fdfbf1', 5);
        inktLijn(2.5);
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const kx = -16 + k * 8;
          const ky = -6 + (k % 2) * 11;
          ctx.moveTo(kx, ky);
          ctx.lineTo(kx + 6, ky + 4);
        }
        ctx.stroke();
      } else if (soort === 'nori') {
        // een blad zeewier: bijna zwart, met een glans erop
        schetsBlok(-24, -24, 48, 48, 211);
        vulEnOmlijn('#31472f', 5);
        inktLijn(3);
        ctx.strokeStyle = '#7fa871';
        ctx.beginPath();
        ctx.moveTo(-14, 8);
        ctx.quadraticCurveTo(-2, -6, 14, -12);
        ctx.stroke();
      } else if (soort === 'zalm') {
        // een visje met een staart en lichte strepen
        ctx.beginPath();
        ctx.moveTo(-26, 0);
        ctx.quadraticCurveTo(-4, -20, 20, -2);
        ctx.quadraticCurveTo(-4, 18, -26, 0);
        ctx.closePath();
        vulEnOmlijn('#f08b5a', 5);
        ctx.beginPath();
        ctx.moveTo(20, -2);
        ctx.lineTo(34, -12);
        ctx.lineTo(32, 8);
        ctx.closePath();
        vulEnOmlijn('#f08b5a', 5);
        inktLijn(3);
        ctx.strokeStyle = '#fbdcc8';
        ctx.beginPath();
        ctx.moveTo(-14, -4); ctx.quadraticCurveTo(-6, 2, 2, -6);
        ctx.moveTo(-18, 4); ctx.quadraticCurveTo(-10, 9, 0, 3);
        ctx.stroke();
        ctx.fillStyle = INKT;
        ctx.beginPath();
        ctx.arc(-16, -3, 2.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (soort === 'komkommer') {
        // een schijfje komkommer met zaadjes
        schetsOvaal(0, 0, 24, 24, 221);
        vulEnOmlijn('#6fb33f', 5);
        schetsOvaal(0, 0, 16, 16, 222);
        vulEnOmlijn('#d8eeb4', 3);
        ctx.fillStyle = '#9ac46a';
        for (let k = 0; k < 4; k++) {
          const hoek = (k / 4) * Math.PI * 2 + 0.4;
          ctx.beginPath();
          ctx.ellipse(Math.cos(hoek) * 8, Math.sin(hoek) * 8, 3.4, 2.4, hoek, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (soort === 'avocado') {
        // een halve avocado met een grote pit
        schetsOvaal(0, 0, 21, 28, 231);
        vulEnOmlijn('#4f7f39', 5);
        schetsOvaal(0, 1, 14, 21, 232);
        vulEnOmlijn('#cfe08a', 3);
        schetsOvaal(0, 3, 8, 10, 233);
        vulEnOmlijn('#a9713f', 3);
      }

      ctx.restore();
    }

    // Sterretjes op de plek waar net een ingrediënt lag. sterkte loopt van 0.7 naar 0.
    function tekenPlop(x, y, sterkte) {
      const uit = (0.7 - sterkte) * 60;
      ctx.save();
      ctx.globalAlpha = Math.max(0, sterkte / 0.7);
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let k = 0; k < 6; k++) {
        const hoek = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(hoek) * (14 + uit), y + Math.sin(hoek) * (14 + uit));
        ctx.lineTo(x + Math.cos(hoek) * (24 + uit), y + Math.sin(hoek) * (24 + uit));
        ctx.stroke();
      }
      ctx.restore();
    }

    // De ingrediënten in het level zweven een beetje op en neer, zodat ze opvallen.
    function tekenIngredienten() {
      for (const i of ingredienten) {
        const y = grondY - i.hoogte;
        if (!i.gepakt) {
          tekenIngredient(i.soort, i.x, y + Math.sin(tijd * 3 + i.x) * 6, 1);
        } else if (i.plop > 0) {
          tekenPlop(i.x, y, i.plop);
        }
      }
    }

    // Een maki-rolletje van bovenaf: zeewier eromheen, dan rijst, en vulling in het midden.
    function tekenSushi(x, y, schaal, vulling) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      schetsOvaal(0, 0, 30, 30, 301);
      vulEnOmlijn('#31472f', 5);
      schetsOvaal(0, 0, 23, 23, 302);
      vulEnOmlijn('#fdfbf1', 3);
      schetsOvaal(0, 0, 10, 10, 303);
      vulEnOmlijn(vulling, 3);
      ctx.restore();
    }

    // ---------- de keuken tekenen ----------

    // Het uithangbord op twee palen. Dit staat achter de kat.
    function tekenKeukenAchter() {
      const paalTop = grondY - 300;

      for (const px of [keuken.x + 18, keuken.x + keuken.breedte - 18]) {
        schetsBlok(px - 7, paalTop, 14, 300, 51);
        vulEnOmlijn('#b07f4e', 5);
      }

      schetsBlok(keuken.x + 36, paalTop - 14, keuken.breedte - 72, 76, 52);
      vulEnOmlijn('#e4572e', 5);
      tekenTekst('SUSHI', keuken.x + keuken.breedte / 2, paalTop + 24, 44);
    }

    // Het aanrecht met de snijplank. Dit tekenen we na de kat, zodat hij er
    // echt achter lijkt te staan.
    function tekenKeukenVoor() {
      const top = grondY - AANRECHT_H;

      // het blad
      schetsBlok(keuken.x - 8, top, keuken.breedte + 16, 20, 53);
      vulEnOmlijn('#e8ddc8', 5);

      // de kast eronder, met twee deurtjes
      schetsBlok(keuken.x, top + 18, keuken.breedte, AANRECHT_H - 18, 54);
      vulEnOmlijn('#c98f55', 5);
      inktLijn(4);
      ctx.beginPath();
      ctx.moveTo(keuken.x + keuken.breedte / 2, top + 26);
      ctx.lineTo(keuken.x + keuken.breedte / 2, grondY - 8);
      ctx.stroke();
      ctx.fillStyle = INKT;
      for (const hx of [keuken.x + keuken.breedte / 2 - 18, keuken.x + keuken.breedte / 2 + 18]) {
        ctx.beginPath();
        ctx.arc(hx, top + 44, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // de snijplank bovenop
      schetsBlok(PLANK_X - 82, top - 13, 164, 15, 55);
      vulEnOmlijn('#dbb380', 4);
    }

    // Een keukenmes, met het punt naar links.
    function tekenMes(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(-44, 2);
      ctx.lineTo(24, 2);
      ctx.lineTo(24, -18);
      ctx.lineTo(-40, -11);
      ctx.closePath();
      vulEnOmlijn('#d8dee3', 4);
      schetsBlok(24, -20, 36, 18, 61);
      vulEnOmlijn('#8a5a33', 4);
      ctx.restore();
    }

    // ---------- het keukenscherm ----------

    // Alle plekken op het keukenscherm, uitgerekend uit de grootte van het
    // venster. Zo klopt het ook als je het venster groter of kleiner maakt.
    function keukenMaten() {
      const b = canvas.width;
      const h = canvas.height;
      const bladY = Math.round(h * 0.42);   // de achterrand van het aanrecht
      const mat = {
        x: b / 2,
        y: bladY + (h - bladY) * 0.40,
        breedte: Math.min(430, b * 0.5),
        hoogte: 124,
      };
      const knop = { x: b / 2, y: h - 52, breedte: Math.min(340, b - 60), hoogte: 62 };
      return { b, h, bladY, mat, knop };
    }

    // Ligt dit punt op de knop?
    function opKnop(p) {
      const k = keukenMaten().knop;
      return Math.abs(p.x - k.x) < k.breedte / 2 && Math.abs(p.y - k.y) < k.hoogte / 2;
    }

    // Je mag pas rollen als alles wat je gevonden hebt op het matje ligt.
    function klaarOmTeRollen() {
      return sleepItems.every((i) => i.opMat);
    }

    // Legt de stapel op het matje op elkaar: wat je het eerst neerlegt ligt
    // onderop, elke volgende laag komt er zichtbaar bovenop.
    function schikStapel() {
      const m = keukenMaten();
      stapel.forEach((i, n) => {
        i.x = m.mat.x;
        i.y = m.mat.y + 18 - n * LAAGHOOGTE;
      });
    }

    // Hoe heet dit ingrediënt? Dat staat in de lijst van het level.
    function naamVan(soort) {
      const i = INGREDIENTEN.find((x) => x.soort === soort);
      return i ? i.naam : soort;
    }

    // Met lidwoord erbij, dus "het zeewier" en "de rijst".
    function volledigeNaam(soort) {
      const i = INGREDIENTEN.find((x) => x.soort === soort);
      return i ? i.lid + ' ' + i.naam : soort;
    }

    // Welk ingrediënt moet er nu op het matje? Eerst het zeewier, dan de rijst,
    // daarna maakt de volgorde niet meer uit. Wat je niet gevonden hebt slaan
    // we over, anders kom je nooit verder.
    function nuAanDeBeurt() {
      for (const soort of BOUWVOLGORDE) {
        const heb = sleepItems.some((i) => i.soort === soort);
        const ligt = stapel.some((i) => i.soort === soort);
        if (heb && !ligt) return soort;
      }
      return null;
    }

    // Zet het keukenscherm klaar: alles wat je onderweg gevonden hebt ligt los
    // op het aanrecht, om en om links en rechts van het matje.
    function openKeukenScherm() {
      const m = keukenMaten();
      const rijH = Math.min(96, (m.h - m.bladY - 150) / 2.6);
      sleepItems = ingredienten.filter((i) => i.gepakt).map((i, n) => ({
        soort: i.soort,
        naam: i.naam,
        x: n % 2 === 0 ? m.b * 0.13 : m.b * 0.87,
        y: m.bladY + 64 + Math.floor(n / 2) * rijH,
        startX: n % 2 === 0 ? m.b * 0.13 : m.b * 0.87,
        startY: m.bladY + 64 + Math.floor(n / 2) * rijH,
        opMat: false,
      }));
      stapel = [];
      sleept = null;
      foutTijd = 0;
      rolTijd = -1;
      inKeukenScherm = true;
    }

    // Na het veranderen van de venstergrootte liggen de ingrediënten misschien
    // buiten beeld. Dit zet ze weer netjes op het aanrecht.
    function herschikKeuken() {
      const m = keukenMaten();
      for (const i of sleepItems) {
        i.x = klem(i.x, 50, m.b - 50);
        i.y = klem(i.y, m.bladY + 40, m.h - 110);
      }
      schikStapel();
    }

    // ---------- slepen met de muis of met je vinger ----------

    function muisPlek(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const p = muisPlek(e);
      muis.x = p.x;
      muis.y = p.y;
      if (!inKeukenScherm || rolTijd >= 0 || gehaald) return;
      canvas.setPointerCapture(e.pointerId);

      // op de knop gedrukt? dan gaan we rollen
      if (klaarOmTeRollen() && opKnop(p)) {
        rolTijd = 0;
        return;
      }

      // klik je op de stapel, dan pak je er de bovenste laag weer af
      if (raaktStapel(p)) {
        const boven = stapel.pop();
        boven.opMat = false;
        pakOp(boven);
        return;
      }

      // anders pak je iets wat los op het aanrecht ligt
      for (let n = sleepItems.length - 1; n >= 0; n--) {
        const i = sleepItems[n];
        if (!i.opMat && raaktItem(i, p)) {
          pakOp(i);
          break;
        }
      }
    });

    // Ligt dit punt op dit ingrediënt?
    function raaktItem(i, p) {
      return Math.abs(p.x - i.x) < 46 && Math.abs(p.y - i.y) < 40;
    }

    // Ligt dit punt ergens op de stapel? Dan bedoel je de bovenste laag.
    function raaktStapel(p) {
      if (stapel.length === 0) return false;
      const onder = stapel[0];
      const boven = stapel[stapel.length - 1];
      return Math.abs(p.x - onder.x) < 50 && p.y > boven.y - 40 && p.y < onder.y + 40;
    }

    function pakOp(i) {
      sleepItems.splice(sleepItems.indexOf(i), 1);
      sleepItems.push(i);
      sleept = i;
    }

    canvas.addEventListener('pointermove', (e) => {
      const p = muisPlek(e);
      muis.x = p.x;
      muis.y = p.y;
      if (sleept) {
        sleept.x = p.x;
        sleept.y = p.y;
      }
    });

    // Loslaten. Boven het matje telt alleen als het ook aan de beurt is,
    // anders glijdt het ingrediënt terug naar zijn plek op het aanrecht.
    function laatLos() {
      if (!sleept) return;
      const m = keukenMaten();
      const i = sleept;
      sleept = null;

      const bovenHetMatje = Math.abs(i.x - m.mat.x) < m.mat.breedte / 2 + 20 &&
                            i.y > m.mat.y - m.mat.hoogte / 2 - 30 - stapel.length * LAAGHOOGTE &&
                            i.y < m.mat.y + m.mat.hoogte / 2 + 30;

      if (bovenHetMatje) {
        const moet = nuAanDeBeurt();
        if (moet && i.soort !== moet) {
          // verkeerde volgorde: terug naar het aanrecht met een melding
          foutTijd = 1.4;
          foutTekst = 'eerst ' + volledigeNaam(moet) + '!';
          i.x = i.startX;
          i.y = i.startY;
        } else {
          i.opMat = true;
          stapel.push(i);
          foutTijd = 0;   // het ging goed, dus de melding mag weg
        }
      } else {
        i.x = klem(i.x, 50, m.b - 50);
        i.y = klem(i.y, m.bladY + 40, m.h - 110);
      }

      schikStapel();
    }

    canvas.addEventListener('pointerup', laatLos);
    canvas.addEventListener('pointercancel', laatLos);

    // ---------- het keukenscherm tekenen ----------

    // Het bamboe matje waar de sushi op gerold wordt.
    function tekenMatje(mat) {
      const x = mat.x - mat.breedte / 2;
      const y = mat.y - mat.hoogte / 2;
      schetsBlok(x, y, mat.breedte, mat.hoogte, 73);
      vulEnOmlijn('#e4c87e', 5);
      inktLijn(3);
      ctx.strokeStyle = '#b89a52';
      ctx.beginPath();
      for (let sx = x + 14; sx < x + mat.breedte - 8; sx += 15) {
        ctx.moveTo(sx, y + 9);
        ctx.lineTo(sx, y + mat.hoogte - 9);
      }
      ctx.stroke();
    }

    // De dichtgerolde sushi, nog voordat hij in stukjes gesneden is.
    function tekenRol(x, y, halveB, halveH) {
      const hb = Math.max(18, halveB);
      schetsBlok(x - hb, y - halveH, hb * 2, halveH * 2, 76);
      vulEnOmlijn('#31472f', 5);
      schetsOvaal(x + hb, y, 13, halveH - 4, 77);
      vulEnOmlijn('#fdfbf1', 4);
    }

    // Een ingrediënt op het aanrecht, met een schaduwtje en zijn naam erbij.
    // Wat je vasthoudt tekenen we iets groter, zodat je ziet dat je het hebt.
    function tekenSleepItem(i, vast, beurt) {
      const schaal = vast ? 1.15 : 1;

      // een knipperende ring om wat nu aan de beurt is
      if (beurt) {
        ctx.save();
        inktLijn(5);
        ctx.strokeStyle = '#ffd43b';
        ctx.globalAlpha = 0.45 + Math.sin(tijd * 6) * 0.3;
        ctx.beginPath();
        ctx.arc(i.x, i.y, 46, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = INKT;
      ctx.beginPath();
      ctx.ellipse(i.x, i.y + 34, 30 * schaal, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      tekenIngredient(i.soort, i.x, i.y - (vast ? 8 : 0), schaal);
      if (!i.opMat) tekenTekst(i.naam, i.x, i.y + 54, 17);
    }

    // De uitleg bovenaan het aanrecht, en de knop zodra alles klaarligt.
    function tekenKeukenTekst(m, beurt) {
      const nog = sleepItems.filter((i) => !i.opMat).length;
      if (sleepItems.length === 0) {
        tekenTekst('je hebt onderweg niets gevonden...', m.b / 2, m.bladY + 38, 24);
      } else if (beurt) {
        tekenTekst('sleep nu ' + volledigeNaam(beurt) + ' op het matje', m.b / 2, m.bladY + 38, 26);
        tekenTekst('eerst zeewier, dan rijst, dan de rest', m.b / 2, m.bladY + 70, 19);
      } else if (nog > 0) {
        tekenTekst('en nu de rest erbovenop', m.b / 2, m.bladY + 38, 26);
        tekenTekst('nog ' + nog + ' te gaan', m.b / 2, m.bladY + 70, 20);
      } else {
        tekenTekst('alles ligt op elkaar!', m.b / 2, m.bladY + 38, 26);
      }

      // de melding als je iets in de verkeerde volgorde probeerde
      if (foutTijd > 0) {
        const wiebel = Math.sin(foutTijd * 30) * 6;
        tekenTekst(foutTekst, m.mat.x + wiebel, m.mat.y - m.mat.hoogte / 2 - 40, 30, '#c0392b');
      }

      if (klaarOmTeRollen()) {
        const k = m.knop;
        schetsBlok(k.x - k.breedte / 2, k.y - k.hoogte / 2, k.breedte, k.hoogte, 74);
        vulEnOmlijn(opKnop(muis) ? '#ffe9a3' : '#ffd968', 5);
        tekenTekst('MAAK DE SUSHI', k.x, k.y, 28);
      }
    }

    // Het rollen en snijden, nadat je op de knop hebt gedrukt.
    function tekenRolAnimatie(m) {
      const t = rolTijd;

      if (t < 0.8) {
        // het matje rolt dicht en alles schuift naar het midden
        const deel = t / 0.8;
        tekenMatje({
          x: m.mat.x,
          y: m.mat.y,
          breedte: m.mat.breedte * (1 - deel * 0.5),
          hoogte: m.mat.hoogte,
        });
        // de hele stapel zakt naar het midden in elkaar
        for (const i of stapel) {
          tekenIngredient(
            i.soort,
            i.x + (m.mat.x - i.x) * deel,
            i.y + (m.mat.y - i.y) * deel,
            1 - deel * 0.55
          );
        }
        if (deel > 0.45) tekenRol(m.mat.x, m.mat.y, m.mat.breedte * 0.3 * (deel - 0.45) / 0.55, 52);
        tekenTekst('rollen!', m.b / 2, m.bladY + 38, 28);
        return;
      }

      // en daarna hakt het mes er stukjes van
      const rollen = aantalRollen();
      const stuk = (ROLDUUR - 0.8) / rollen;
      const t2 = t - 0.8;
      const klaar = Math.min(rollen, Math.floor(t2 / stuk));
      const binnen = (t2 % stuk) / stuk;
      const over = 1 - klaar / rollen;

      if (over > 0.01) tekenRol(m.mat.x, m.mat.y, m.mat.breedte * 0.3 * over, 52);
      if (klaar < rollen) tekenMes(m.mat.x, m.mat.y - 70 - Math.sin(binnen * Math.PI) * 90);

      const bordY = Math.min(m.mat.y + 125, m.h - 70);
      schetsOvaal(m.mat.x, bordY, 160, 38, 75);
      vulEnOmlijn('#f2f2ef', 5);
      const vullingen = ['#f08b5a', '#cfe08a', '#6fb33f'];
      for (let n = 0; n < klaar; n++) {
        tekenSushi(m.mat.x - (rollen - 1) * 27 + n * 54, bordY - 10, 0.8, vullingen[n % 3]);
      }
      tekenTekst('hak!', m.b / 2, m.bladY + 38, 28);
    }

    // De close-up van de keuken: je ziet alleen de bovenkant van de kat achter
    // het aanrecht, en daarvoor ligt het matje waar jij de sushi op maakt.
    function tekenKeukenScherm() {
      const m = keukenMaten();

      // de tegelmuur
      ctx.fillStyle = '#f7e6cd';
      ctx.fillRect(0, 0, m.b, m.bladY);
      ctx.strokeStyle = 'rgba(59, 45, 35, 0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= m.b; x += 72) { ctx.moveTo(x, 0); ctx.lineTo(x, m.bladY); }
      for (let y = 0; y <= m.bladY; y += 72) { ctx.moveTo(0, y); ctx.lineTo(m.b, y); }
      ctx.stroke();

      // het bord aan de muur
      schetsBlok(m.b / 2 - 150, 18, 300, 72, 71);
      vulEnOmlijn('#e4572e', 5);
      tekenTekst('SUSHI', m.b / 2, 56, 44);

      // de kat erachter. We tekenen hem zo groot en zo laag dat alleen zijn
      // bovenkant boven het aanrecht uitkomt.
      const schaal = klem((m.bladY - 100) / 144, 1, 2.3);
      tekenKat(m.b / 2, m.bladY + 40 * schaal, schaal);

      // het aanrecht eroverheen, met wat nerven in het hout
      ctx.fillStyle = '#d7a86a';
      ctx.fillRect(0, m.bladY, m.b, m.h - m.bladY);
      inktLijn(3);
      ctx.strokeStyle = 'rgba(59, 45, 35, 0.16)';
      ctx.beginPath();
      for (let y = m.bladY + 64; y < m.h; y += 64) { ctx.moveTo(0, y); ctx.lineTo(m.b, y); }
      ctx.stroke();
      schetsBlok(-12, m.bladY - 16, m.b + 24, 30, 72);
      vulEnOmlijn('#e8ddc8', 5);

      if (rolTijd >= 0) {
        tekenRolAnimatie(m);
      } else {
        tekenMatje(m.mat);
        const beurt = nuAanDeBeurt();
        // de stapel van onder naar boven, zodat je elke laag erbovenop ziet komen
        for (const i of stapel) tekenSleepItem(i, false, false);
        // dan wat er nog los op het aanrecht ligt
        for (const i of sleepItems) {
          if (!i.opMat && i !== sleept) tekenSleepItem(i, false, i.soort === beurt);
        }
        // en bovenop alles wat je nu vasthoudt
        if (sleept) tekenSleepItem(sleept, true, false);
        tekenKeukenTekst(m, beurt);
      }
    }

    // Het wolkje boven de kat als hij bij het aanrecht staat.
    function tekenKookTip() {
      const x = kat.x;
      const y = kat.y - kat.hoogte - 76;
      tekenWolk(x, y, 1.3);
      tekenTekst('druk op T', x, y - 32, 20);
      tekenTekst('voor sushi', x, y - 10, 20);
    }

    // Een zwevend eilandje: een brok rots met een punt eronder, gras erop en
    // twee ranken die in de wind hangen te zwaaien.
    function tekenZwevendPlatform(o, v) {
      // de punt onderaan
      ctx.beginPath();
      ctx.moveTo(v.links + 8, v.onder - 6);
      ctx.lineTo(v.links + o.breedte * 0.45, v.onder + 38);
      ctx.lineTo(v.rechts - 8, v.onder - 6);
      ctx.closePath();
      vulEnOmlijn('#8a7259', 5);

      // ranken die eronder hangen
      inktLijn(4);
      ctx.strokeStyle = '#5f9d46';
      ctx.beginPath();
      for (const rx of [v.links + 18, v.rechts - 22]) {
        const zwaai = Math.sin(tijd * 1.6 + rx * 0.05) * 7;
        ctx.moveTo(rx, v.onder - 2);
        ctx.quadraticCurveTo(rx + zwaai, v.onder + 20, rx - zwaai, v.onder + 42);
      }
      ctx.stroke();

      // het blok zelf
      schetsBlok(v.links, v.boven, o.breedte, o.dikte, o.x);
      vulEnOmlijn('#a98c6b', 5);

      // de graslaag bovenop
      schetsBlok(v.links - 3, v.boven - 7, o.breedte + 6, 15, o.x + 1);
      vulEnOmlijn('#79b457', 5);

      // een paar sprietjes
      inktLijn(3);
      ctx.strokeStyle = '#4f7f39';
      ctx.beginPath();
      for (let sx = v.links + 14; sx < v.rechts - 10; sx += 34) {
        ctx.moveTo(sx, v.boven - 4);
        ctx.quadraticCurveTo(sx + 3, v.boven - 16, sx + 8, v.boven - 18);
      }
      ctx.stroke();
    }

    function tekenObstakels() {
      for (const o of obstakels) {
        const v = vak(o);
        if (o.dikte) {
          tekenZwevendPlatform(o, v);
          continue;
        }
        schetsBlok(v.links, v.boven, o.breedte, o.hoogte, o.x);
        vulEnOmlijn('#aab2b8', 5);
        // lichte bovenkant en een barstje, zodat het op een rots lijkt
        inktLijn(3);
        ctx.beginPath();
        ctx.moveTo(v.links + 12, v.boven + 14);
        ctx.quadraticCurveTo(v.links + o.breedte / 2, v.boven + 8, v.rechts - 12, v.boven + 15);
        ctx.moveTo(v.links + o.breedte * 0.6, v.boven + 24);
        ctx.lineTo(v.links + o.breedte * 0.45, v.boven + o.hoogte * 0.55);
        ctx.stroke();
      }
    }

    // Een getal dat netjes binnen 0 en breedte blijft, ook als het negatief is.
    function rondOm(waarde, breedte) {
      return ((waarde % breedte) + breedte) % breedte;
    }

    function tekenLucht() {
      const lucht = ctx.createLinearGradient(0, 0, 0, grondY);
      lucht.addColorStop(0, '#9fd8f2');
      lucht.addColorStop(1, '#e6f6fc');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Wolken drijven naar links en schuiven maar een beetje mee met de camera,
    // waardoor ze ver weg lijken te staan.
    function tekenWolken() {
      const ruimte = canvas.width + 400;
      for (let i = 0; i < 4; i++) {
        const x = rondOm(i * 420 + 200 - tijd * 12 - camera * 0.2, ruimte) - 200;
        tekenWolk(x, 90 + (i % 3) * 55, 1 - (i % 3) * 0.15);
      }
    }

    // Tekst met een witte rand eromheen, zodat je hem overal kunt lezen.
    function tekenTekst(tekst, x, y, grootte, kleur) {
      ctx.font = 'bold ' + grootte + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 7;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#fff';
      ctx.strokeText(tekst, x, y);
      ctx.fillStyle = kleur || INKT;
      ctx.fillText(tekst, x, y);
    }

    // De balk bovenin: hoe lang je onderweg bent en hoe ver je al bent.
    function tekenHud() {
      const deel = klem(kat.x / KOOKPLEK, 0, 1);
      const balkB = Math.min(360, canvas.width - 80);
      const balkX = canvas.width / 2 - balkB / 2;
      const balkY = 28;

      schetsBlok(balkX, balkY, balkB, 22, 21);
      vulEnOmlijn('#ffffff', 4);
      ctx.save();
      ctx.beginPath();
      ctx.rect(balkX, balkY, balkB * deel, 22);
      ctx.clip();
      schetsBlok(balkX, balkY, balkB, 22, 21);
      ctx.fillStyle = '#79b457';
      ctx.fill();
      ctx.restore();

      tekenTekst(speeltijd.toFixed(1) + ' sec', canvas.width / 2, balkY + 56, 24);

      tekenIngredientenBalk();
    }

    // Het rijtje linksboven: wat je al gepakt hebt staat er in kleur in,
    // de rest is nog vaag. Zo zie je wat je voor je sushi nog mist.
    function tekenIngredientenBalk() {
      const vakje = 56;
      const b = 20 + ingredienten.length * vakje;
      const x = 26;
      const y = 26;

      schetsBlok(x, y, b, 76, 41);
      vulEnOmlijn('rgba(255, 255, 255, 0.8)', 4);

      ingredienten.forEach((i, n) => {
        const cx = x + 10 + vakje / 2 + n * vakje;
        const cy = y + 40;
        ctx.save();
        if (!i.gepakt) ctx.globalAlpha = 0.25;
        tekenIngredient(i.soort, cx, cy, 0.62);
        ctx.restore();
      });
    }

    // Het bord dat in beeld komt als je de vlag hebt aangeraakt.
    function tekenGehaaldBord() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const b = Math.min(520, canvas.width - 60);
      const h = 290;
      const x = canvas.width / 2 - b / 2;
      const y = canvas.height / 2 - h / 2;
      schetsBlok(x, y, b, h, 31);
      vulEnOmlijn('#ffd968', 6);

      const midden = canvas.width / 2;
      tekenTekst(allesGepakt() ? 'Sushi!' : 'Gehaald!', midden, y + 56, 54);

      if (allesGepakt()) {
        // alles bij elkaar: de kat rolt er drie rolletjes van
        tekenSushi(midden - 78, y + 150, 0.9, '#f08b5a');
        tekenSushi(midden, y + 150, 0.9, '#cfe08a');
        tekenSushi(midden + 78, y + 150, 0.9, '#6fb33f');
        tekenTekst('je had alle ingrediënten', midden, y + 212, 24);
      } else {
        const mist = ingredienten.length - aantalGepakt();
        tekenTekst('maar je mist nog ' + mist, midden, y + 108, 26);
        tekenTekst(mist === 1 ? 'ingrediënt voor de sushi' : 'ingrediënten voor de sushi', midden, y + 142, 26);
        for (let n = 0; n < ingredienten.length; n++) {
          const i = ingredienten[n];
          const cx = midden - (ingredienten.length - 1) * 28 + n * 56;
          ctx.save();
          if (!i.gepakt) ctx.globalAlpha = 0.25;
          tekenIngredient(i.soort, cx, y + 196, 0.62);
          ctx.restore();
        }
      }

      tekenTekst('in ' + speeltijd.toFixed(1) + ' seconden', midden, y + 244, 24);
      tekenTekst('druk op R om opnieuw te spelen', midden, y + 274, 20);
    }

    // Gele vonken onder de voeten, zodat je ziet dat dit een powerjump is.
    function tekenVonken(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const hoek = (i / 6) * Math.PI * 2 + tijd * 6;
        const afstand = 26 + Math.sin(tijd * 18 + i) * 8;
        ctx.beginPath();
        ctx.moveTo(Math.cos(hoek) * afstand, Math.sin(hoek) * afstand * 0.5);
        ctx.lineTo(Math.cos(hoek) * (afstand + 16), Math.sin(hoek) * (afstand + 16) * 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // in de keuken zie je het level niet meer, alleen de close-up
      if (inKeukenScherm) {
        tekenKeukenScherm();
        if (gehaald) tekenGehaaldBord();
        return;
      }

      // de lucht en de zon blijven staan waar ze staan
      tekenLucht();
      tekenZon();
      tekenWolken();

      tekenVogels();

      // de bergen schuiven het minst mee, de heuvels half zo snel als de rest
      ctx.save();
      ctx.translate(-camera * 0.25, 0);
      tekenBergen(camera * 0.25, camera * 0.25 + canvas.width);
      ctx.restore();

      ctx.save();
      ctx.translate(-camera * 0.5, 0);
      tekenHeuvels(camera * 0.5, camera * 0.5 + canvas.width);
      ctx.restore();

      // en hier komt het level zelf, dat helemaal met de camera meeschuift
      ctx.save();
      ctx.translate(-camera, 0);
      tekenGrond(camera, camera + canvas.width);
      tekenBegroeiing(camera, camera + canvas.width);
      tekenObstakels();
      tekenFinish();
      tekenKeukenAchter();
      tekenIngredienten();
      if (kat.powerjump) tekenVonken(kat.x, kat.y);
      if (kat.snelheidX !== 0 || !kat.opGrond) {
        tekenKatZij(kat.x, kat.y, 1, kat.kijkt, kat.stap, !kat.opGrond);
      } else {
        tekenKat(kat.x, kat.y, 1);
      }
      tekenKeukenVoor();
      if (inDeKeuken) tekenKookTip();
      ctx.restore();

      tekenHud();
      if (gehaald) tekenGehaaldBord();
    }

    opnieuw();

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../../livereload.js"></script>
</body>
</html>
