    // ---------- het keukenscherm ----------

    // Alle plekken op het keukenscherm, uitgerekend uit de grootte van het
    // venster. Zo klopt het ook als je het venster groter of kleiner maakt.
    function keukenMaten() {
      const b = canvas.width;
      const h = canvas.height;
      const bladY = Math.round(h * 0.42);   // de achterrand van het aanrecht
      const mat = {
        x: b / 2,
        y: bladY + (h - bladY) * 0.44,
        breedte: Math.min(430, b * 0.5),
        hoogte: 124,
      };
      const knop = { x: b / 2, y: h - 52, breedte: Math.min(340, b - 60), hoogte: 62 };
      return { b, h, bladY, mat, knop };
    }

    // Ligt dit punt op de knop?
    function opKnop(p) {
      const k = keukenMaten().knop;
      return Math.abs(p.x - k.x) < k.breedte / 2 && Math.abs(p.y - k.y) < k.hoogte / 2;
    }

    // Rollen mag zodra de basis op het matje ligt. Hoeveel lagen je er daarna
    // nog bovenop stapelt mag je helemaal zelf weten.
    function klaarOmTeRollen() {
      if (voorraad.length === 0) return true;   // niets gevonden, dan maar een lege rol
      if (nuAanDeBeurt() !== null) return false;
      return stapel.length > 0;
    }

    // Hoe groot een ingrediënt wordt zodra het op het matje ligt. Het is dan
    // geen los stukje meer maar een hele laag over de breedte van het matje.
    // Het zeewier ligt onderop en is het breedst, daarna wordt elke laag wat
    // smaller, net als bij echte sushi.
    function laagMaat(soort, matB) {
      if (soort === 'nori') return { breedte: matB - 20, hoogte: 26 };
      if (soort === 'rijst') return { breedte: matB - 48, hoogte: 34 };
      return { breedte: matB - 86, hoogte: 26 };
    }

    // Hoe hoog de hele stapel nu is, met de maten waarmee hij getekend wordt.
    function stapelHoogte() {
      let h = 0;
      for (const i of stapel) h += i.hoogte || 0;
      return h;
    }

    // Hoeveel ruimte er boven het matje is voor de stapel.
    function stapelRuimte(m) {
      return (m.mat.y + 50) - (m.bladY + 96);
    }

    // Hoeveel lagen er in die ruimte passen. Op een klein scherm zijn dat er
    // minder, zodat de sushi nooit over de tekst heen groeit.
    function maxLagen() {
      return klem(Math.floor(stapelRuimte(keukenMaten()) / LAAGRUIMTE), 4, 12);
    }

    // Als je veel lagen stapelt, tekenen we ze platter zodat de hele sushi in
    // beeld blijft. Dit zegt hoeveel platter.
    function stapelKrimp(m) {
      const ruimte = stapelRuimte(m);
      let totaal = 0;
      for (const i of stapel) totaal += laagMaat(i.soort, m.mat.breedte).hoogte;
      return totaal > ruimte ? Math.max(0.4, ruimte / totaal) : 1;
    }

    // Legt de lagen op het matje precies op elkaar: wat je het eerst neerlegt
    // ligt onderop, elke volgende laag komt daar bovenop te liggen. Elke laag
    // onthoudt hoe breed en hoe hoog hij getekend wordt.
    function schikStapel() {
      const m = keukenMaten();
      const krimp = stapelKrimp(m);
      let onderkant = m.mat.y + 50;
      for (const i of stapel) {
        const maat = laagMaat(i.soort, m.mat.breedte);
        i.breedte = maat.breedte;
        i.hoogte = maat.hoogte * krimp;
        i.x = m.mat.x;
        i.y = onderkant - i.hoogte / 2;
        onderkant -= i.hoogte;
      }
    }

    // Hoe heet dit eten? Dat staat in de catalogus bovenaan.
    function naamVan(soort) {
      return ETEN[soort] ? ETEN[soort].naam : soort;
    }

    // Met lidwoord erbij, dus "het zeewier" en "de rijst".
    function volledigeNaam(soort) {
      const e = ETEN[soort];
      return e ? e.lid + ' ' + e.naam : soort;
    }

    // Welk ingrediënt moet er nu op het matje? Eerst het zeewier, dan de rijst,
    // daarna maakt de volgorde niet meer uit. Wat je niet gevonden hebt slaan
    // we over, anders kom je nooit verder.
    function nuAanDeBeurt() {
      for (const soort of BOUWVOLGORDE) {
        const heb = voorraad.some((i) => i.soort === soort);
        const ligt = stapel.some((i) => i.soort === soort);
        if (heb && !ligt) return soort;
      }
      return null;
    }

    // Legt de voorraad om en om links en rechts van het matje neer.
    function legVoorraadNeer() {
      const m = keukenMaten();
      const rijH = Math.min(96, (m.h - m.bladY - 150) / 2.6);
      voorraad.forEach((v, n) => {
        v.x = n % 2 === 0 ? m.b * 0.13 : m.b * 0.87;
        v.y = m.bladY + 64 + Math.floor(n / 2) * rijH;
      });
    }

    // Zet het keukenscherm klaar met alles wat je onderweg gevonden hebt.
    function openKeukenScherm() {
      voorraad = ingredienten
        .filter((i) => i.gepakt)
        .map((i) => ({ soort: i.soort, naam: i.naam, x: 0, y: 0 }));
      legVoorraadNeer();
      bestelling = maakBestelling();
      stapel = [];
      sleept = null;
      foutTijd = 0;
      rolTijd = -1;
      inKeukenScherm = true;
    }

    // Na het veranderen van de venstergrootte liggen de ingrediënten misschien
    // buiten beeld. Dit zet ze weer netjes op het aanrecht.
    function herschikKeuken() {
      legVoorraadNeer();
      schikStapel();
    }

    // ---------- slepen met de muis of met je vinger ----------

    function muisPlek(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const p = muisPlek(e);
      muis.x = p.x;
      muis.y = p.y;

      // in de winkel klik je op een outfit of op het kruisje
      if (winkelOpen) {
        const w = winkelMaten();
        if (Math.hypot(p.x - w.sluit.x, p.y - w.sluit.y) < w.sluit.r + 10) {
          winkelOpen = false;
          return;
        }
        for (const v of w.vakken) {
          if (Math.abs(p.x - v.x) < v.breedte / 2 && Math.abs(p.y - v.y) < v.hoogte / 2) {
            koop(v.n);
            return;
          }
        }
        return;
      }

      // rechtsboven op de winkelknop geklikt?
      if (magWinkel() && opWinkelKnop(p)) {
        winkelOpen = true;
        return;
      }

      if (!inKeukenScherm || rolTijd >= 0 || gehaald) return;
      canvas.setPointerCapture(e.pointerId);

      // op de knop gedrukt? dan gaan we rollen
      if (klaarOmTeRollen() && opKnop(p)) {
        rolTijd = 0;
        return;
      }

      // klik je op de stapel, dan pak je de bovenste laag er weer af
      if (raaktStapel(p)) {
        sleept = stapel.pop();
        sleept.x = p.x;
        sleept.y = p.y;
        schikStapel();
        return;
      }

      // uit de voorraad pak je een nieuw stuk. De voorraad zelf blijft liggen,
      // dus je kunt van hetzelfde ingrediënt zoveel lagen maken als je wilt.
      for (let n = voorraad.length - 1; n >= 0; n--) {
        const v = voorraad[n];
        if (raaktItem(v, p)) {
          sleept = { soort: v.soort, naam: v.naam, x: p.x, y: p.y, breedte: 0, hoogte: 0 };
          break;
        }
      }
    });

    // Ligt dit punt op dit ingrediënt?
    function raaktItem(i, p) {
      return Math.abs(p.x - i.x) < 46 && Math.abs(p.y - i.y) < 40;
    }

    // Ligt dit punt ergens op de stapel? Dan bedoel je de bovenste laag.
    function raaktStapel(p) {
      if (stapel.length === 0) return false;
      const m = keukenMaten();
      const onder = stapel[0];
      const boven = stapel[stapel.length - 1];
      return Math.abs(p.x - onder.x) < onder.breedte / 2 &&
             p.y > boven.y - boven.hoogte / 2 - 16 &&
             p.y < onder.y + onder.hoogte / 2 + 16;
    }

    canvas.addEventListener('pointermove', (e) => {
      const p = muisPlek(e);
      muis.x = p.x;
      muis.y = p.y;
      if (sleept) {
        sleept.x = p.x;
        sleept.y = p.y;
      }
    });

    // Loslaten. Boven het matje wordt het een nieuwe laag, als het tenminste
    // aan de beurt is. Laat je het ergens anders los, dan gooi je het stuk weg;
    // dat geeft niet, want de voorraad raakt toch nooit op.
    function laatLos() {
      if (!sleept) return;
      const m = keukenMaten();
      const i = sleept;
      sleept = null;

      const bovenHetMatje = Math.abs(i.x - m.mat.x) < m.mat.breedte / 2 + 20 &&
                            i.y > m.mat.y - m.mat.hoogte / 2 - 30 - stapelHoogte() &&
                            i.y < m.mat.y + m.mat.hoogte / 2 + 40;

      if (bovenHetMatje) {
        const moet = nuAanDeBeurt();
        if (moet && i.soort !== moet) {
          foutTijd = 1.4;
          foutTekst = 'eerst ' + volledigeNaam(moet) + '!';
        } else if (stapel.length >= maxLagen()) {
          foutTijd = 1.4;
          foutTekst = 'je sushi is hoog genoeg!';
        } else {
          stapel.push(i);
          foutTijd = 0;   // het ging goed, dus de melding mag weg
        }
      }

      schikStapel();
    }

    canvas.addEventListener('pointerup', laatLos);
    canvas.addEventListener('pointercancel', laatLos);

    // ---------- het keukenscherm tekenen ----------

    // Het bamboe matje waar de sushi op gerold wordt.
    function tekenMatje(mat) {
      const x = mat.x - mat.breedte / 2;
      const y = mat.y - mat.hoogte / 2;
      schetsBlok(x, y, mat.breedte, mat.hoogte, 73);
      vulEnOmlijn('#e4c87e', 5);
      inktLijn(3);
      ctx.strokeStyle = '#b89a52';
      ctx.beginPath();
      for (let sx = x + 14; sx < x + mat.breedte - 8; sx += 15) {
        ctx.moveTo(sx, y + 9);
        ctx.lineTo(sx, y + mat.hoogte - 9);
      }
      ctx.stroke();
    }

    // De dichtgerolde sushi, nog voordat hij in stukjes gesneden is.
    function tekenRol(x, y, halveB, halveH) {
      const hb = Math.max(18, halveB);
      schetsBlok(x - hb, y - halveH, hb * 2, halveH * 2, 76);
      vulEnOmlijn('#31472f', 5);
      schetsOvaal(x + hb, y, 13, halveH - 4, 77);
      vulEnOmlijn('#fdfbf1', 4);
    }

    // Een ingrediënt zoals het op het matje ligt: geen los stukje meer, maar
    // een hele laag over de breedte van het matje.
    function tekenLaag(soort, x, y, b, h) {
      const e = ETEN[soort];
      if (!e) return;
      const links = x - b / 2;
      const rechts = x + b / 2;

      schetsBlok(links, y - h / 2, b, h, 401);
      vulEnOmlijn(e.kleur, 5);
      inktLijn(3);
      ctx.strokeStyle = e.lijn;

      if (e.laagstijl === 'vel') {
        // een glans over het hele vel
        ctx.beginPath();
        ctx.moveTo(links + 18, y + h * 0.18);
        ctx.quadraticCurveTo(x, y - h * 0.3, rechts - 18, y - h * 0.06);
        ctx.stroke();
      } else if (e.laagstijl === 'korrels') {
        // kleine korreltjes door elkaar
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        let n = 0;
        for (let kx = links + 14; kx < rechts - 12; kx += 17) {
          const ky = y - h * 0.26 + (n % 2) * h * 0.34;
          ctx.moveTo(kx, ky);
          ctx.lineTo(kx + 8, ky + 4);
          n++;
        }
        ctx.stroke();
      } else if (e.laagstijl === 'strepen') {
        // golvende strepen, zoals in vis
        ctx.beginPath();
        for (let kx = links + 16; kx < rechts - 20; kx += 28) {
          ctx.moveTo(kx, y - h * 0.2);
          ctx.quadraticCurveTo(kx + 9, y + h * 0.1, kx + 18, y - h * 0.16);
        }
        ctx.stroke();
      } else if (e.laagstijl === 'reepjes') {
        // twee lange lijnen, alsof het reepjes naast elkaar zijn
        ctx.beginPath();
        ctx.moveTo(links + 10, y - h * 0.16);
        ctx.lineTo(rechts - 10, y - h * 0.16);
        ctx.moveTo(links + 10, y + h * 0.2);
        ctx.lineTo(rechts - 10, y + h * 0.2);
        ctx.stroke();
      } else if (e.laagstijl === 'plakjes') {
        // schuine plakjes naast elkaar
        ctx.beginPath();
        for (let kx = links + 20; kx < rechts - 6; kx += 22) {
          ctx.moveTo(kx, y - h / 2 + 5);
          ctx.lineTo(kx - 11, y + h / 2 - 5);
        }
        ctx.stroke();
      } else if (e.laagstijl === 'bolletjes') {
        // kleine bolletjes op een rij
        ctx.fillStyle = e.lijn;
        for (let kx = links + 16; kx < rechts - 10; kx += 20) {
          ctx.beginPath();
          ctx.arc(kx, y, Math.min(5, h / 4), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // Een ingrediënt op het aanrecht, met een schaduwtje en zijn naam erbij.
    // Wat je vasthoudt tekenen we iets groter, zodat je ziet dat je het hebt.
    function tekenSleepItem(i, vast) {
      const schaal = vast ? 1.15 : 1;
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = INKT;
      ctx.beginPath();
      ctx.ellipse(i.x, i.y + 34, 30 * schaal, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      tekenIngredient(i.soort, i.x, i.y - (vast ? 8 : 0), schaal);
    }

    // Een plekje uit de voorraad. We tekenen er twee vage kopieën achter,
    // zodat je ziet dat er altijd nog meer van is.
    function tekenVoorraadItem(v, beurt) {
      // de knipperende ring om wat nu aan de beurt is
      if (beurt) {
        ctx.save();
        inktLijn(5);
        ctx.strokeStyle = '#ffd43b';
        ctx.globalAlpha = 0.45 + Math.sin(tijd * 6) * 0.3;
        ctx.beginPath();
        ctx.arc(v.x, v.y, 48, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      ctx.save();
      ctx.globalAlpha = 0.3;
      tekenIngredient(v.soort, v.x + 13, v.y - 11, 1);
      ctx.globalAlpha = 0.55;
      tekenIngredient(v.soort, v.x + 7, v.y - 6, 1);
      ctx.restore();

      tekenSleepItem(v, false);
      tekenTekst(v.naam, v.x, v.y + 54, 17);
    }

    // De uitleg bovenaan het aanrecht, en de knop zodra alles klaarligt.
    function tekenKeukenTekst(m, beurt) {
      if (voorraad.length === 0) {
        tekenTekst('je hebt onderweg niets gevonden...', m.b / 2, m.bladY + 38, 24);
      } else if (beurt) {
        tekenTekst('sleep nu ' + volledigeNaam(beurt) + ' op het matje', m.b / 2, m.bladY + 38, 26);
        tekenTekst('eerst zeewier, dan rijst, dan de rest', m.b / 2, m.bladY + 70, 19);
      } else if (bestellingKlopt()) {
        tekenTekst('precies de bestelling van ' + gast().naam + '!', m.b / 2, m.bladY + 38, 25);
        tekenTekst('druk op de knop om te rollen', m.b / 2, m.bladY + 70, 19);
      } else {
        tekenTekst('ontwerp je eigen sushi!', m.b / 2, m.bladY + 38, 26);
        tekenTekst(
          stapel.length + (stapel.length === 1 ? ' laag' : ' lagen') + ' - je voorraad raakt nooit op',
          m.b / 2, m.bladY + 70, 19
        );
      }

      // de melding als je iets in de verkeerde volgorde probeerde
      if (foutTijd > 0) {
        const wiebel = Math.sin(foutTijd * 30) * 6;
        tekenTekst(foutTekst, m.mat.x + wiebel, m.mat.y - m.mat.hoogte / 2 - 40, 30, '#c0392b');
      }

      if (klaarOmTeRollen()) {
        const k = m.knop;
        schetsBlok(k.x - k.breedte / 2, k.y - k.hoogte / 2, k.breedte, k.hoogte, 74);
        vulEnOmlijn(opKnop(muis) ? '#ffe9a3' : '#ffd968', 5);
        tekenTekst('MAAK DE SUSHI', k.x, k.y, 28);
      }
    }

    // Het rollen en snijden, nadat je op de knop hebt gedrukt.
    function tekenRolAnimatie(m) {
      const t = rolTijd;

      if (t < 0.8) {
        // het matje rolt dicht en alles schuift naar het midden
        const deel = t / 0.8;
        tekenMatje({
          x: m.mat.x,
          y: m.mat.y,
          breedte: m.mat.breedte * (1 - deel * 0.5),
          hoogte: m.mat.hoogte,
        });
        // de lagen worden smaller en zakken naar het midden in elkaar
        for (const i of stapel) {
          tekenLaag(i.soort, m.mat.x, i.y + (m.mat.y - i.y) * deel, i.breedte * (1 - deel * 0.72), i.hoogte);
        }
        if (deel > 0.45) tekenRol(m.mat.x, m.mat.y, m.mat.breedte * 0.3 * (deel - 0.45) / 0.55, 52);
        tekenTekst('rollen!', m.b / 2, m.bladY + 38, 28);
        return;
      }

      // en daarna hakt het mes er stukjes van
      const rollen = aantalRollen();
      const stuk = (ROLDUUR - 0.8) / rollen;
      const t2 = t - 0.8;
      const klaar = Math.min(rollen, Math.floor(t2 / stuk));
      const binnen = (t2 % stuk) / stuk;
      const over = 1 - klaar / rollen;

      if (over > 0.01) tekenRol(m.mat.x, m.mat.y, m.mat.breedte * 0.3 * over, 52);
      if (klaar < rollen) tekenMes(m.mat.x, m.mat.y - 70 - Math.sin(binnen * Math.PI) * 90);

      const bordY = Math.min(m.mat.y + 125, m.h - 70);
      schetsOvaal(m.mat.x, bordY, 160, 38, 75);
      vulEnOmlijn('#f2f2ef', 5);
      // elk stukje is een doorsnede van jouw eigen rol, dus ze zien er alle
      // drie hetzelfde uit: jouw volgorde
      const mijnLagen = stapel.map((i) => i.soort);
      for (let n = 0; n < klaar; n++) {
        tekenSushiStapel(m.mat.x - (rollen - 1) * 27 + n * 54, bordY - 10, 0.8, mijnLagen);
      }
      tekenTekst('hak!', m.b / 2, m.bladY + 38, 28);
    }

    // Een gast in cartoon-stijl: een rond kopje met oren of een snavel.
    function tekenGast(x, y, schaal, g, blij) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      if (g.dier === 'muis') {
        // twee grote ronde oren
        for (const ox of [-30, 30]) {
          schetsOvaal(ox, -26, 19, 19, 501 + ox);
          vulEnOmlijn(g.kleur, 5);
          schetsOvaal(ox, -26, 11, 11, 511 + ox);
          ctx.fillStyle = '#f0a6ae';
          ctx.fill();
        }
      } else if (g.dier === 'beer') {
        // twee kleine ronde oortjes
        for (const ox of [-28, 28]) {
          schetsOvaal(ox, -27, 14, 14, 521 + ox);
          vulEnOmlijn(g.kleur, 5);
        }
      }

      // het kopje
      schetsOvaal(0, 0, 34, 31, 531);
      vulEnOmlijn(g.kleur, 5);

      if (g.dier === 'vogel') {
        // een kuifje en een snavel
        inktLijn(5);
        ctx.strokeStyle = g.kleur;
        ctx.beginPath();
        ctx.moveTo(-6, -30); ctx.lineTo(-13, -47);
        ctx.moveTo(4, -31); ctx.lineTo(7, -49);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-10, 6);
        ctx.lineTo(10, 6);
        ctx.lineTo(0, blij ? 22 : 18);
        ctx.closePath();
        vulEnOmlijn('#ffb43d', 4);
      } else {
        // een snuitje met een neusje
        schetsOvaal(0, 10, 15, 11, 541);
        vulEnOmlijn('#fdeef3', 4);
        ctx.fillStyle = INKT;
        ctx.beginPath();
        ctx.arc(0, 5, 4, 0, Math.PI * 2);
        ctx.fill();
        // mondje: blij of een rechte streep
        inktLijn(3);
        ctx.beginPath();
        if (blij) {
          ctx.moveTo(-9, 14);
          ctx.quadraticCurveTo(0, 21, 9, 14);
        } else {
          ctx.moveTo(-7, 17);
          ctx.lineTo(7, 17);
        }
        ctx.stroke();
      }

      // ogen met een lichtpuntje
      ctx.fillStyle = INKT;
      for (const ox of [-13, 13]) {
        ctx.beginPath();
        ctx.arc(ox, -9, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#fff';
      for (const ox of [-14.5, 11.5]) {
        ctx.beginPath();
        ctx.arc(ox, -11, 1.7, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // Het bestelbriefje aan de muur, met de gast erboven. De lagen die je al
    // goed hebt staan vol in kleur met een vinkje, de rest is nog vaag.
    function tekenBestelling(m) {
      const g = gast();
      const b = Math.min(210, m.b * 0.26);
      const x = 24;
      const y = 58;
      const h = Math.min(m.bladY - 78, 92 + bestelling.length * 22);

      schetsBlok(x, y, b, h, 561);
      vulEnOmlijn('#fffdf2', 5);
      tekenGast(x + b / 2, y - 4, 0.7, g, bestellingKlopt());
      tekenTekst(g.naam + ' wil:', x + b / 2, y + 44, 20);

      if (bestelling.length === 0) {
        tekenTekst('maakt niet uit!', x + b / 2, y + 76, 18);
        return;
      }

      const stap = Math.min(22, (h - 64) / bestelling.length);
      const laagH = stap - 2;
      let ly = y + h - 14 - laagH / 2;
      bestelling.forEach((soort, n) => {
        const goed = n < stapel.length && stapel[n].soort === soort;
        ctx.save();
        if (!goed) ctx.globalAlpha = 0.4;
        tekenLaag(soort, x + b / 2, ly, b - 44, laagH);
        ctx.restore();
        if (goed) {
          inktLijn(4);
          ctx.strokeStyle = '#4f9d3a';
          ctx.beginPath();
          ctx.moveTo(x + b - 24, ly - 1);
          ctx.lineTo(x + b - 18, ly + 5);
          ctx.lineTo(x + b - 7, ly - 8);
          ctx.stroke();
        }
        ly -= stap;
      });
    }

    // De close-up van de keuken: je ziet alleen de bovenkant van de kat achter
    // het aanrecht, en daarvoor ligt het matje waar jij de sushi op maakt.
    function tekenKeukenScherm() {
      const m = keukenMaten();

      // de tegelmuur
      ctx.fillStyle = '#f7e6cd';
      ctx.fillRect(0, 0, m.b, m.bladY);
      ctx.strokeStyle = 'rgba(59, 45, 35, 0.15)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= m.b; x += 72) { ctx.moveTo(x, 0); ctx.lineTo(x, m.bladY); }
      for (let y = 0; y <= m.bladY; y += 72) { ctx.moveTo(0, y); ctx.lineTo(m.b, y); }
      ctx.stroke();

      // het bord aan de muur
      schetsBlok(m.b / 2 - 150, 18, 300, 72, 71);
      vulEnOmlijn('#e4572e', 5);
      tekenTekst('SUSHI', m.b / 2, 56, 44);

      // het bestelbriefje van de gast
      tekenBestelling(m);

      // de kat erachter. We tekenen hem zo groot en zo laag dat alleen zijn
      // bovenkant boven het aanrecht uitkomt.
      const schaal = klem((m.bladY - 100) / 144, 1, 2.3);
      tekenKat(m.b / 2, m.bladY + 40 * schaal, schaal);

      // het aanrecht eroverheen, met wat nerven in het hout
      ctx.fillStyle = '#d7a86a';
      ctx.fillRect(0, m.bladY, m.b, m.h - m.bladY);
      inktLijn(3);
      ctx.strokeStyle = 'rgba(59, 45, 35, 0.16)';
      ctx.beginPath();
      for (let y = m.bladY + 64; y < m.h; y += 64) { ctx.moveTo(0, y); ctx.lineTo(m.b, y); }
      ctx.stroke();
      schetsBlok(-12, m.bladY - 16, m.b + 24, 30, 72);
      vulEnOmlijn('#e8ddc8', 5);

      if (rolTijd >= 0) {
        tekenRolAnimatie(m);
      } else {
        tekenMatje(m.mat);
        const beurt = nuAanDeBeurt();
        // de stapel van onder naar boven, elke laag over de breedte van het matje
        for (const i of stapel) tekenLaag(i.soort, i.x, i.y, i.breedte, i.hoogte);
        // de voorraad aan weerszijden van het matje
        for (const v of voorraad) tekenVoorraadItem(v, v.soort === beurt);
        // en bovenop alles wat je nu vasthoudt
        if (sleept) tekenSleepItem(sleept, true);
        tekenKeukenTekst(m, beurt);
      }
    }

    // Het wolkje boven de kat als hij bij het aanrecht staat.
    function tekenKookTip() {
      const x = kat.x;
      const y = kat.y - kat.hoogte - 76;
      tekenWolk(x, y, 1.3);
      tekenTekst('druk op T', x, y - 32, 20);
      tekenTekst('voor sushi', x, y - 10, 20);
    }

    // Een zwevend eilandje: een brok rots met een punt eronder, gras erop en
    // twee ranken die in de wind hangen te zwaaien.
    function tekenZwevendPlatform(o, v) {
      // de punt onderaan
      ctx.beginPath();
      ctx.moveTo(v.links + 8, v.onder - 6);
      ctx.lineTo(v.links + o.breedte * 0.45, v.onder + 38);
      ctx.lineTo(v.rechts - 8, v.onder - 6);
      ctx.closePath();
      vulEnOmlijn('#8a7259', 5);

      // ranken die eronder hangen
      inktLijn(4);
      ctx.strokeStyle = tema.struik;
      ctx.beginPath();
      for (const rx of [v.links + 18, v.rechts - 22]) {
        const zwaai = Math.sin(tijd * 1.6 + rx * 0.05) * 7;
        ctx.moveTo(rx, v.onder - 2);
        ctx.quadraticCurveTo(rx + zwaai, v.onder + 20, rx - zwaai, v.onder + 42);
      }
      ctx.stroke();

      // het blok zelf
      schetsBlok(v.links, v.boven, o.breedte, o.dikte, o.x);
      vulEnOmlijn(tema.eiland, 5);

      // de graslaag bovenop
      schetsBlok(v.links - 3, v.boven - 7, o.breedte + 6, 15, o.x + 1);
      vulEnOmlijn(tema.gras, 5);

      // een paar sprietjes
      inktLijn(3);
      ctx.strokeStyle = tema.spriet;
      ctx.beginPath();
      for (let sx = v.links + 14; sx < v.rechts - 10; sx += 34) {
        ctx.moveTo(sx, v.boven - 4);
        ctx.quadraticCurveTo(sx + 3, v.boven - 16, sx + 8, v.boven - 18);
      }
      ctx.stroke();
    }

    function tekenObstakels() {
      for (const o of obstakels) {
        const v = vak(o);
        if (o.dikte) {
          tekenZwevendPlatform(o, v);
          continue;
        }
        schetsBlok(v.links, v.boven, o.breedte, o.hoogte, o.x);
        vulEnOmlijn(tema.rots, 5);
        // lichte bovenkant en een barstje, zodat het op een rots lijkt
        inktLijn(3);
        ctx.beginPath();
        ctx.moveTo(v.links + 12, v.boven + 14);
        ctx.quadraticCurveTo(v.links + o.breedte / 2, v.boven + 8, v.rechts - 12, v.boven + 15);
        ctx.moveTo(v.links + o.breedte * 0.6, v.boven + 24);
        ctx.lineTo(v.links + o.breedte * 0.45, v.boven + o.hoogte * 0.55);
        ctx.stroke();
      }
    }

    // Een getal dat netjes binnen 0 en breedte blijft, ook als het negatief is.
    function rondOm(waarde, breedte) {
      return ((waarde % breedte) + breedte) % breedte;
    }

    function tekenLucht() {
      const lucht = ctx.createLinearGradient(0, 0, 0, grondY);
      lucht.addColorStop(0, tema.lucht1);
      lucht.addColorStop(1, tema.lucht2);
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Wolken drijven naar links en schuiven maar een beetje mee met de camera,
    // waardoor ze ver weg lijken te staan.
    function tekenWolken() {
      const ruimte = canvas.width + 400;
      for (let i = 0; i < 4; i++) {
        const x = rondOm(i * 420 + 200 - tijd * 12 - camera * 0.2, ruimte) - 200;
        tekenWolk(x, 90 + (i % 3) * 55, 1 - (i % 3) * 0.15);
      }
    }

    // Tekst met een witte rand eromheen, zodat je hem overal kunt lezen.
    function tekenTekst(tekst, x, y, grootte, kleur) {
      ctx.font = 'bold ' + grootte + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 7;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#fff';
      ctx.strokeText(tekst, x, y);
      ctx.fillStyle = kleur || INKT;
      ctx.fillText(tekst, x, y);
    }

    // De balk bovenin: hoe lang je onderweg bent en hoe ver je al bent.
    function tekenHud() {
      const deel = klem(kat.x / KOOKPLEK, 0, 1);
      const balkB = Math.min(360, canvas.width - 80);
      const balkX = canvas.width / 2 - balkB / 2;
      const balkY = 28;

      schetsBlok(balkX, balkY, balkB, 22, 21);
      vulEnOmlijn('#ffffff', 4);
      ctx.save();
      ctx.beginPath();
      ctx.rect(balkX, balkY, balkB * deel, 22);
      ctx.clip();
      schetsBlok(balkX, balkY, balkB, 22, 21);
      ctx.fillStyle = '#79b457';
      ctx.fill();
      ctx.restore();

      tekenTekst(speeltijd.toFixed(1) + ' sec', canvas.width / 2, balkY + 56, 24);
      tekenTekst(
        'level ' + (levelNummer + 1) + ' van ' + LEVELS.length + ': ' + LEVELS[levelNummer].naam,
        canvas.width / 2, balkY + 86, 19
      );

      tekenIngredientenBalk();
    }

    // Het rijtje linksboven: wat je al gepakt hebt staat er in kleur in,
    // de rest is nog vaag. Zo zie je wat je voor je sushi nog mist.
    function tekenIngredientenBalk() {
      const vakje = 56;
      const b = 20 + ingredienten.length * vakje;
      const x = 26;
      const y = 26;

      schetsBlok(x, y, b, 76, 41);
      vulEnOmlijn('rgba(255, 255, 255, 0.8)', 4);

      ingredienten.forEach((i, n) => {
        const cx = x + 10 + vakje / 2 + n * vakje;
        const cy = y + 40;
        ctx.save();
        if (!i.gepakt) ctx.globalAlpha = 0.25;
        tekenIngredient(i.soort, cx, cy, 0.62);
        ctx.restore();
      });
    }

    // Het bord dat in beeld komt als je sushi klaar is, met de reactie van
    // de gast erbij.
    function tekenGehaaldBord() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const b = Math.min(540, canvas.width - 60);
      const h = 382;
      const x = canvas.width / 2 - b / 2;
      const y = canvas.height / 2 - h / 2;
      schetsBlok(x, y, b, h, 31);
      vulEnOmlijn('#ffd968', 6);

      const midden = canvas.width / 2;
      const klopt = bestellingKlopt();
      const bijna = bestellingBijna();
      tekenTekst(klopt ? 'Precies goed!' : 'Helaas!', midden, y + 54, 50);

      // drie stukjes van jouw rol, dus met jouw eigen volgorde erin
      const mijnLagen = stapel.map((i) => i.soort);
      tekenSushiStapel(midden - 78, y + 134, 0.9, mijnLagen);
      tekenSushiStapel(midden, y + 134, 0.9, mijnLagen);
      tekenSushiStapel(midden + 78, y + 134, 0.9, mijnLagen);

      // de gast zegt er wat van
      const g = gast();
      tekenGast(midden - 168, y + 214, 0.8, g, klopt);
      const regel1 = klopt ? 'precies wat ik wilde!'
                  : bijna ? 'alles zat erin, maar de'
                          : 'dit had ik niet besteld...';
      const regel2 = klopt ? '- ' + g.naam
                  : bijna ? 'volgorde was verkeerd  - ' + g.naam
                          : '- ' + g.naam;
      tekenTekst(regel1, midden + 32, y + 198, 22);
      tekenTekst(regel2, midden + 32, y + 228, 22);

      if (klopt) {
        tekenMuntje(midden - 54, y + 266, 0.85);
        tekenTekst('+' + laatsteBeloning + ' munten', midden + 24, y + 266, 24);
      } else {
        tekenTekst('geen muntjes, het moet precies goed', midden, y + 266, 21, '#c0392b');
      }
      tekenTekst('in ' + speeltijd.toFixed(1) + ' seconden', midden, y + 296, 20);

      const laatste = levelNummer + 1 >= LEVELS.length;
      if (klopt) {
        tekenTekst(
          laatste ? 'je hebt alle levels gehaald!' : 'spatie: door naar ' + LEVELS[levelNummer + 1].naam,
          midden, y + 328, 21
        );
        tekenTekst('R: nog eens  -  of klik rechtsboven op winkel', midden, y + 354, 18);
      } else {
        tekenTekst('T: nog een keer koken', midden, y + 328, 23);
        tekenTekst('R: dit level opnieuw  -  of klik rechtsboven op winkel', midden, y + 354, 18);
      }
    }

    // Gele vonken onder de voeten, zodat je ziet dat dit een powerjump is.
    function tekenVonken(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const hoek = (i / 6) * Math.PI * 2 + tijd * 6;
        const afstand = 26 + Math.sin(tijd * 18 + i) * 8;
        ctx.beginPath();
        ctx.moveTo(Math.cos(hoek) * afstand, Math.sin(hoek) * afstand * 0.5);
        ctx.lineTo(Math.cos(hoek) * (afstand + 16), Math.sin(hoek) * (afstand + 16) * 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ---------- de winkel ----------

    let winkelOpen = false;

    // Waar alle vakjes van de winkel staan, uitgerekend uit de schermgrootte.
    function winkelMaten() {
      const kolommen = canvas.width < 660 ? 2 : 3;
      const b = Math.min(760, canvas.width - 40);
      const vakB = (b - 40) / kolommen;
      const vakH = Math.min(158, (canvas.height - 180) / Math.ceil(OUTFITS.length / kolommen));
      const rijen = Math.ceil(OUTFITS.length / kolommen);
      const h = 112 + rijen * vakH;
      const x = canvas.width / 2 - b / 2;
      const y = Math.max(16, canvas.height / 2 - h / 2);
      const vakken = OUTFITS.map((o, n) => ({
        o,
        n,
        x: x + 20 + (n % kolommen) * vakB + vakB / 2,
        y: y + 92 + Math.floor(n / kolommen) * vakH + vakH / 2,
        breedte: vakB - 14,
        hoogte: vakH - 14,
      }));
      return { x, y, b, h, vakken, sluit: { x: x + b - 36, y: y + 36, r: 20 } };
    }

    // Een outfit kopen, of als je hem al hebt gewoon aantrekken.
    function koop(n) {
      const o = OUTFITS[n];
      if (gekocht.includes(n)) {
        outfitAan = n;
        bewaar();
        return;
      }
      if (munten >= o.prijs) {
        munten -= o.prijs;
        gekocht.push(n);
        outfitAan = n;
        bewaar();
      } else {
        foutTijd = 1.6;
        foutTekst = 'je hebt nog ' + (o.prijs - munten) + ' munten nodig';
      }
    }

    // Een muntje, voor in de balk en in de winkel.
    function tekenMuntje(x, y, schaal) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      schetsOvaal(0, 0, 16, 16, 611);
      vulEnOmlijn('#ffd43b', 4);
      schetsOvaal(0, 0, 10, 10, 612);
      vulEnOmlijn('#ffe9a3', 3);
      ctx.fillStyle = INKT;
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', 0, 1);
      ctx.restore();
    }

    // De knop rechtsboven: daar staat hoeveel munten je hebt en daar klik je
    // op om naar de winkel te gaan. Op een smal scherm staat het onder elkaar.
    function winkelKnop() {
      const smal = canvas.width < 620;
      const breedte = smal ? 108 : 168;
      const hoogte = smal ? 64 : 48;
      return {
        x: canvas.width - 22 - breedte / 2,
        y: 22 + hoogte / 2,
        breedte,
        hoogte,
        smal,
      };
    }

    // De winkel mag altijd open, behalve terwijl de sushi gerold en gesneden
    // wordt. Als de sushi klaar is (gehaald) mag het weer, ook al staat rolTijd
    // dan nog op zijn eindwaarde.
    function magWinkel() {
      return rolTijd < 0 || gehaald;
    }

    // Klik je op de winkelknop?
    function opWinkelKnop(p) {
      const k = winkelKnop();
      return Math.abs(p.x - k.x) < k.breedte / 2 && Math.abs(p.y - k.y) < k.hoogte / 2;
    }

    function tekenWinkelKnop() {
      const k = winkelKnop();
      const eronder = opWinkelKnop(muis);
      schetsBlok(k.x - k.breedte / 2, k.y - k.hoogte / 2, k.breedte, k.hoogte, 641);
      vulEnOmlijn(eronder ? '#ffe9a3' : '#ffd968', 5);

      if (k.smal) {
        tekenTekst('winkel', k.x, k.y - 14, 20);
        tekenMuntje(k.x - 18, k.y + 14, 0.8);
        tekenTekst(String(munten), k.x + 14, k.y + 14, 21);
      } else {
        tekenMuntje(k.x - 62, k.y, 0.8);
        tekenTekst(String(munten), k.x - 34, k.y, 22);
        tekenTekst('winkel', k.x + 32, k.y, 22);
      }
    }

    // Het winkelscherm met alle outfits.
    function tekenWinkel() {
      const w = winkelMaten();

      ctx.fillStyle = 'rgba(59, 45, 35, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      schetsBlok(w.x, w.y, w.b, w.h, 621);
      vulEnOmlijn('#fff7e8', 6);

      tekenTekst('de kledingwinkel', w.x + w.b / 2, w.y + 40, 32);
      tekenMuntje(w.x + 40, w.y + 38, 1);
      tekenTekst(String(munten), w.x + 76, w.y + 38, 24);

      // het kruisje om te sluiten
      schetsOvaal(w.sluit.x, w.sluit.y, w.sluit.r, w.sluit.r, 622);
      vulEnOmlijn('#f0a6ae', 4);
      inktLijn(4);
      ctx.beginPath();
      ctx.moveTo(w.sluit.x - 7, w.sluit.y - 7);
      ctx.lineTo(w.sluit.x + 7, w.sluit.y + 7);
      ctx.moveTo(w.sluit.x + 7, w.sluit.y - 7);
      ctx.lineTo(w.sluit.x - 7, w.sluit.y + 7);
      ctx.stroke();

      for (const v of w.vakken) {
        const heb = gekocht.includes(v.n);
        const aan = v.n === outfitAan;
        schetsBlok(v.x - v.breedte / 2, v.y - v.hoogte / 2, v.breedte, v.hoogte, 630 + v.n);
        vulEnOmlijn(aan ? '#ffe9a3' : heb ? '#ffffff' : '#efe6d6', 5);

        // de kat met die outfit aan
        const schaal = Math.min(0.46, (v.hoogte - 56) / 190);
        ctx.save();
        if (!heb && munten < v.o.prijs) ctx.globalAlpha = 0.5;
        tekenKat(v.x, v.y + v.hoogte / 2 - 30, schaal, v.o);
        ctx.restore();

        tekenTekst(v.o.naam, v.x, v.y - v.hoogte / 2 + 20, 20);
        if (aan) {
          tekenTekst('aan', v.x, v.y + v.hoogte / 2 - 12, 18, '#4f9d3a');
        } else if (heb) {
          tekenTekst('klik om aan te doen', v.x, v.y + v.hoogte / 2 - 12, 15);
        } else {
          tekenMuntje(v.x - 20, v.y + v.hoogte / 2 - 14, 0.62);
          tekenTekst(String(v.o.prijs), v.x + 10, v.y + v.hoogte / 2 - 14, 20,
                     munten >= v.o.prijs ? '#4f9d3a' : '#c0392b');
        }
      }

      if (foutTijd > 0) tekenTekst(foutTekst, w.x + w.b / 2, w.y + w.h - 18, 20, '#c0392b');
      tekenTekst('klik op het kruisje om te sluiten', w.x + w.b / 2, w.y + 68, 17);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // in de keuken zie je het level niet meer, alleen de close-up
      if (inKeukenScherm) {
        tekenKeukenScherm();
        if (gehaald) tekenGehaaldBord();
        tekenWinkelKnop();
        if (winkelOpen) tekenWinkel();
        return;
      }

      // de lucht en de zon blijven staan waar ze staan
      tekenLucht();
      tekenZon();
      tekenWolken();

      tekenVogels();

      // de bergen schuiven het minst mee, de heuvels half zo snel als de rest
      ctx.save();
      ctx.translate(-camera * 0.25, 0);
      tekenBergen(camera * 0.25, camera * 0.25 + canvas.width);
      ctx.restore();

      ctx.save();
      ctx.translate(-camera * 0.5, 0);
      tekenHeuvels(camera * 0.5, camera * 0.5 + canvas.width);
      ctx.restore();

      // en hier komt het level zelf, dat helemaal met de camera meeschuift
      ctx.save();
      ctx.translate(-camera, 0);
      tekenGrond(camera, camera + canvas.width);
      tekenBegroeiing(camera, camera + canvas.width);
      tekenObstakels();
      tekenFinish();
      tekenKeukenAchter();
      tekenIngredienten();
      if (kat.powerjump) tekenVonken(kat.x, kat.y);
      if (kat.snelheidX !== 0 || !kat.opGrond) {
        tekenKatZij(kat.x, kat.y, 1, kat.kijkt, kat.stap, !kat.opGrond);
      } else {
        tekenKat(kat.x, kat.y, 1);
      }
      tekenKeukenVoor();
      if (inDeKeuken) tekenKookTip();
      ctx.restore();

      tekenHud();
      if (gehaald) tekenGehaaldBord();
      tekenWinkelKnop();
      if (winkelOpen) tekenWinkel();
    }

    laadBewaard();
    startLevel(0);

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
