<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dinoland</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #1d3b22; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function herbouw() {
      pasGrootteAan();
      maakJungle();
    }
    window.addEventListener('resize', herbouw);


    // ---- Jungle ----
    // Alles van de jungle wordt één keer uitgerekend en daarna elke frame getekend,
    // zodat de bomen en plantjes niet elke frame op een andere plek staan.
    let grondhoogte = 0;
    let bomenVer = [];
    let bomen = [];
    let lianen = [];
    let varens = [];
    let bladeren = [];
    let obstakels = [];
    let munten = [];
    let aantalMunten = 0;

    // Eigen toevalsgenerator met een vast begin, zodat de jungle er elke keer
    // hetzelfde uitziet zolang het venster niet van grootte verandert.
    function maakToeval(zaad) {
      let s = zaad;
      return function () {
        s = (s * 1103515245 + 12345) % 2147483648;
        return s / 2147483648;
      };
    }

    function maakJungle() {
      const t = maakToeval(20261007);
      const b = canvas.width;
      const h = canvas.height;
      grondhoogte = h * 0.78;

      // Verre, vage boomtoppen achter de horizon
      bomenVer = [];
      for (let x = -40; x < b + 60; x += 50 + t() * 40) {
        bomenVer.push({ x: x, breedte: 60 + t() * 70, hoogte: 70 + t() * 120 });
      }

      // Boomstammen op de achtergrond
      bomen = [];
      for (let i = 0; i < Math.max(4, Math.round(b / 170)); i++) {
        bomen.push({
          x: (i + 0.3 + t() * 0.4) * (b / Math.max(4, Math.round(b / 170))),
          breedte: 18 + t() * 26,
          kleur: t() < 0.5 ? '#3a2a1c' : '#4a3524',
        });
      }

      // Slingerplanten die van de bovenkant naar beneden hangen
      lianen = [];
      for (let i = 0; i < Math.max(6, Math.round(b / 120)); i++) {
        lianen.push({
          x: t() * b,
          lengte: 80 + t() * 320,
          bocht: (t() - 0.5) * 70,
          snelheid: 0.3 + t() * 0.5,
          fase: t() * 6.28,
        });
      }

      // Bladeren die vanaf de bovenrand naar binnen hangen
      bladeren = [];
      for (let x = -20; x < b + 40; x += 40 + t() * 40) {
        bladeren.push({ x: x, lengte: 50 + t() * 90, hoek: -1.2 + t() * 2.4, fase: t() * 6.28 });
      }

      // Stenen, omgevallen boomstammen en boomstronken op de bosgrond.
      // rx en ry zijn hoe breed en hoe diep je er omheen moet lopen.
      obstakels = [];
      const soorten = ['steen', 'steen', 'boomstam', 'stronk'];
      for (let i = 0; i < Math.max(5, Math.round(b / 190)); i++) {
        const soort = soorten[Math.floor(t() * soorten.length)];
        const ox = 60 + t() * (b - 120);
        const oy = grondhoogte + 15 + t() * (h - grondhoogte - 25);
        // Niet bovenop de startplek van de dino neerzetten
        if (Math.abs(ox - b / 2) < 90 && Math.abs(oy - (grondhoogte + 40)) < 45) continue;
        obstakels.push({
          x: ox,
          y: oy,
          soort: soort,
          maat: 0.8 + t() * 0.5,
          rx: soort === 'boomstam' ? 58 : soort === 'stronk' ? 26 : 30,
          ry: soort === 'boomstam' ? 13 : 14,
          // hoe hoog hij opgerekt wordt: de stronk torent boven de dino uit
          hoog: soort === 'boomstam' ? 2.0 : soort === 'stronk' ? 2.9 : 2.3,
        });
      }

      // Bij elk obstakel liggen een of twee munten, net buiten de steen of stam.
      munten = [];
      aantalMunten = 0;
      for (const o of obstakels) {
        const hoeveel = 1 + Math.round(t());
        for (let n = 0; n < hoeveel; n++) {
          const hoek = t() * Math.PI * 2;
          const afstandX = o.rx * o.maat + 38;
          const afstandY = o.ry * o.maat + 24;
          const mx = o.x + Math.cos(hoek) * afstandX;
          const my = o.y + Math.sin(hoek) * afstandY;
          // Alleen als de munt binnen de bosgrond ligt en niet in een ander obstakel
          if (mx < 25 || mx > b - 25) continue;
          if (my < grondhoogte + 12 || my > h - 8) continue;
          if (botst(mx, my)) continue;
          munten.push({ x: mx, y: my, fase: t() * 6.28, gepakt: false });
        }
      }

      // Varens links en rechts op de voorgrond, het midden blijft vrij voor de dino
      varens = [];
      for (let i = 0; i < Math.max(5, Math.round(b / 160)); i++) {
        const links = i % 2 === 0;
        varens.push({
          x: links ? t() * b * 0.3 : b - t() * b * 0.3,
          y: grondhoogte + 20 + t() * (h - grondhoogte - 20),
          grootte: 0.7 + t() * 0.9,
          fase: t() * 6.28,
        });
      }
    }

    // Eén blad: een spitse ovaal met een nerf erin.
    function tekenBlad(lengte, kleur) {
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(lengte * 0.4, lengte * 0.32, lengte, 0);
      ctx.quadraticCurveTo(lengte * 0.4, -lengte * 0.32, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = Math.max(1, lengte * 0.03);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(lengte, 0);
      ctx.stroke();
    }

    function tekenJungle(tijd) {
      const b = canvas.width;
      const h = canvas.height;

      // Lucht: licht zonlicht dat door het bladerdek valt
      const lucht = ctx.createLinearGradient(0, 0, 0, grondhoogte);
      lucht.addColorStop(0, '#1b3d22');
      lucht.addColorStop(0.45, '#4e8a4a');
      lucht.addColorStop(1, '#a9cf7a');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, grondhoogte);

      // Zonnestralen die schuin door de bomen schijnen
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#fff6c8';
      for (let i = 0; i < 4; i++) {
        const x = b * (0.15 + i * 0.22);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 70, 0);
        ctx.lineTo(x + 230, grondhoogte);
        ctx.lineTo(x + 110, grondhoogte);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Verre boomtoppen
      ctx.fillStyle = '#2f6336';
      for (const bt of bomenVer) {
        ctx.beginPath();
        ctx.ellipse(bt.x, grondhoogte - bt.hoogte * 0.5, bt.breedte / 2, bt.hoogte / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Boomstammen met wat groene aanslag
      for (const boom of bomen) {
        ctx.fillStyle = boom.kleur;
        ctx.fillRect(boom.x - boom.breedte / 2, 0, boom.breedte, grondhoogte + 10);
        ctx.fillStyle = 'rgba(90,150,70,0.25)';
        ctx.fillRect(boom.x - boom.breedte / 2, 0, boom.breedte * 0.3, grondhoogte + 10);
      }

      // Slingerplanten, ze wiegen zachtjes heen en weer
      ctx.strokeStyle = '#2b5c2e';
      for (const liaan of lianen) {
        const zwaai = Math.sin(tijd * liaan.snelheid + liaan.fase) * 12;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(liaan.x, -10);
        ctx.quadraticCurveTo(liaan.x + liaan.bocht + zwaai, liaan.lengte * 0.6, liaan.x + zwaai * 1.5, liaan.lengte);
        ctx.stroke();
        // Blaadje aan het uiteinde
        ctx.save();
        ctx.translate(liaan.x + zwaai * 1.5, liaan.lengte);
        ctx.rotate(1.2 + Math.sin(tijd * liaan.snelheid + liaan.fase) * 0.2);
        tekenBlad(16, '#36713a');
        ctx.restore();
      }

      // Grote bladeren langs de bovenrand
      for (const blad of bladeren) {
        ctx.save();
        ctx.translate(blad.x, -6);
        ctx.rotate(1.57 + blad.hoek * 0.4 + Math.sin(tijd * 0.6 + blad.fase) * 0.05);
        tekenBlad(blad.lengte, '#2a6130');
        ctx.restore();
      }

      // Bosgrond
      const grond = ctx.createLinearGradient(0, grondhoogte, 0, h);
      grond.addColorStop(0, '#5f7a3a');
      grond.addColorStop(1, '#3b4f26');
      ctx.fillStyle = grond;
      ctx.fillRect(0, grondhoogte, b, h - grondhoogte);

      // Graspluimpjes op de grens van de grond
      ctx.strokeStyle = '#7fa848';
      ctx.lineWidth = 2;
      for (let x = 0; x < b; x += 11) {
        const hoogte = 6 + ((x * 7) % 9);
        ctx.beginPath();
        ctx.moveTo(x, grondhoogte + 2);
        ctx.lineTo(x + 3, grondhoogte - hoogte);
        ctx.stroke();
      }
    }

    // Tekent één obstakel met (0, 0) op de grond, in zijn eigen kleine maten.
    function tekenObstakel(o) {
      if (o.soort === 'steen') {
        // Schaduw op de grond
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 26, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.scale(1, o.hoog);
        // Keien
        ctx.fillStyle = '#7d7f78';
        ctx.beginPath();
        ctx.ellipse(0, -14, 24, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#95978f';
        ctx.beginPath();
        ctx.ellipse(-5, -19, 15, 11, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#6a6c66';
        ctx.beginPath();
        ctx.ellipse(13, -8, 9, 7, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // Mosje erop
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(-9, -27, 7, 3, -0.3, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.soort === 'boomstam') {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 54, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.scale(1, o.hoog);
        // Liggende stam
        ctx.fillStyle = '#5a3f28';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-50, -20, 100, 20, 9) : ctx.rect(-50, -20, 100, 20);
        ctx.fill();
        // Lichte bovenkant
        ctx.fillStyle = '#6d4e32';
        ctx.fillRect(-48, -19, 96, 6);
        // Jaarringen aan de kop
        ctx.fillStyle = '#8a6440';
        ctx.beginPath();
        ctx.ellipse(-50, -10, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6d4e32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(-50, -10, 3, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Mos op de stam
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(10, -21, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.scale(1, o.hoog);
        // Wortels
        ctx.fillStyle = '#4a3524';
        for (const wx of [-18, -9, 9, 18]) {
          ctx.beginPath();
          ctx.moveTo(wx, 2);
          ctx.lineTo(wx * 0.4, -14);
          ctx.lineTo(wx * 0.9, -14);
          ctx.closePath();
          ctx.fill();
        }
        // Stronk
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(-13, -34, 26, 34);
        // Zaagvlak bovenop
        ctx.fillStyle = '#8a6440';
        ctx.beginPath();
        ctx.ellipse(0, -34, 13, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6d4e32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, -34, 7, 2.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Plantje erop
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(6, -37, 7, 3, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Een wapen, met (0, 0) bij de hand en de punt naar rechts.
    function tekenWapen(w) {
      if (w.soort === 'speer') {
        // Houten steel
        ctx.fillStyle = '#8a6440';
        ctx.fillRect(-12, -1.1, 34, 2.2);
        // Touwtje waarmee de punt vastzit
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(19, -1.6, 3, 3.2);
        // Stenen punt
        ctx.fillStyle = '#d8d3c4';
        ctx.beginPath();
        ctx.moveTo(22, -3.4);
        ctx.lineTo(31, 0);
        ctx.lineTo(22, 3.4);
        ctx.closePath();
        ctx.fill();
      } else if (w.soort === 'bijl') {
        // Steel
        ctx.fillStyle = '#8a6440';
        ctx.fillRect(-10, -1.2, 24, 2.4);
        // Touwtje
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(9, -2, 3, 4);
        // Stenen blad
        ctx.fillStyle = '#9a9c94';
        ctx.beginPath();
        ctx.moveTo(11, -7);
        ctx.lineTo(19, -4.5);
        ctx.lineTo(19, 4.5);
        ctx.lineTo(11, 7);
        ctx.closePath();
        ctx.fill();
        // Geslepen snede
        ctx.fillStyle = '#d8d3c4';
        ctx.beginPath();
        ctx.moveTo(17, -4.8);
        ctx.lineTo(20, -3.5);
        ctx.lineTo(20, 3.5);
        ctx.lineTo(17, 4.8);
        ctx.closePath();
        ctx.fill();
      } else {
        // Boog: een gebogen tak met een pees
        ctx.strokeStyle = '#8a6440';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(2, 0, 11, -1.9, 1.9);
        ctx.stroke();
        ctx.strokeStyle = '#e4ddc8';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(-1.5, -10.4);
        ctx.lineTo(-1.5, 10.4);
        ctx.stroke();
        // Pijl op de pees
        tekenPijl();
      }
    }

    // Een pijl, punt naar rechts, met (0, 0) halverwege de schacht.
    function tekenPijl() {
      ctx.fillStyle = '#8a6440';
      ctx.fillRect(-11, -0.7, 24, 1.4);
      ctx.fillStyle = '#d8d3c4';
      ctx.beginPath();
      ctx.moveTo(13, -2.4);
      ctx.lineTo(18, 0);
      ctx.lineTo(13, 2.4);
      ctx.closePath();
      ctx.fill();
      // Veertjes achteraan
      ctx.fillStyle = '#e8e0cf';
      ctx.beginPath();
      ctx.moveTo(-11, -0.7);
      ctx.lineTo(-7, -3.2);
      ctx.lineTo(-5, -0.7);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-11, 0.7);
      ctx.lineTo(-7, 3.2);
      ctx.lineTo(-5, 0.7);
      ctx.closePath();
      ctx.fill();
    }

    // Iets dat door de lucht vliegt.
    function tekenSchot(schot) {
      ctx.save();
      ctx.translate(schot.x, schot.y - schot.hoogte);
      ctx.scale(schot.richting * schot.maat, schot.maat);
      if (schot.soort === 'bijl') {
        // Een gegooide bijl tolt rond
        ctx.rotate(schot.draai);
        tekenWapen({ soort: 'bijl' });
      } else if (schot.soort === 'speer') {
        tekenWapen({ soort: 'speer' });
      } else {
        tekenPijl();
      }
      ctx.restore();
    }

    // Stofwolkje waar een speer, bijl of pijl inslaat.
    function tekenPluim(pluim) {
      const f = pluim.leeftijd / 0.4;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - f);
      ctx.fillStyle = '#d9cdb0';
      for (let i = 0; i < 5; i++) {
        const hoek = (i / 5) * Math.PI * 2;
        const r = 4 + f * 16;
        ctx.beginPath();
        ctx.arc(pluim.x + Math.cos(hoek) * r, pluim.y - 20 + Math.sin(hoek) * r * 0.5, 5 - f * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Een munt: een gouden rondje    // Een munt: een gouden rondje dat om zijn as draait en boven de grond zweeft.
    function tekenMunt(munt, tijd) {
      const zweef = Math.sin(tijd * 3 + munt.fase) * 5;
      const draai = Math.cos(tijd * 2.5 + munt.fase);   // van -1 (zijkant) tot 1 (voorkant)
      const breedte = Math.max(2, Math.abs(draai) * 13);

      ctx.save();
      ctx.translate(munt.x, munt.y);

      // Schaduwtje op de grond
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(0, -22 + zweef);

      // Rand van de munt
      ctx.fillStyle = '#c08a16';
      ctx.beginPath();
      ctx.ellipse(0, 0, breedte, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      // Goud
      ctx.fillStyle = '#f6c62e';
      ctx.beginPath();
      ctx.ellipse(0, 0, breedte * 0.78, 10.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Glimlichtje, alleen als je de munt van voren ziet
      if (breedte > 7) {
        ctx.fillStyle = '#fff2a8';
        ctx.beginPath();
        ctx.ellipse(-breedte * 0.25, -4, breedte * 0.2, 3.5, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Waar de winkelknop en de vakjes in de winkel staan. Zowel het tekenen als
    // het klikken gebruikt deze maten, zo zitten ze altijd op dezelfde plek.
    function winkelIndeling() {
      const knop = { x: canvas.width - 160, y: 20, b: 140, h: 44 };
      const breedte = 440;
      const rijHoogte = 78;
      const x = (canvas.width - breedte) / 2;
      const y = Math.max(20, canvas.height / 2 - (90 + wapens.length * rijHoogte) / 2);
      const rijen = wapens.map(function (g, i) {
        return { g: g, x: x + 16, y: y + 70 + i * rijHoogte, b: breedte - 32, h: rijHoogte - 10 };
      });
      return {
        knop: knop,
        paneel: { x: x, y: y, b: breedte, h: 90 + wapens.length * rijHoogte },
        rijen: rijen,
        sluit: { x: x + breedte - 52, y: y + 14, b: 36, h: 32 },
      };
    }

    function tekenWinkelknop() {
      const k = winkelIndeling().knop;
      ctx.save();
      ctx.fillStyle = 'rgba(20,40,20,0.8)';
      ctx.strokeStyle = '#f6c62e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(k.x, k.y, k.b, k.h, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Winkel (S)', k.x + k.b / 2, k.y + k.h / 2 + 1);
      ctx.restore();
    }

    function tekenWinkel() {
      const w = winkelIndeling();
      ctx.save();

      // Donker vlak over het spel heen
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Paneel
      ctx.fillStyle = '#20331f';
      ctx.strokeStyle = '#f6c62e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(w.paneel.x, w.paneel.y, w.paneel.b, w.paneel.h, 16);
      ctx.fill();
      ctx.stroke();

      // Titel en je munten
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('Wapenwinkel', w.paneel.x + 20, w.paneel.y + 32);
      ctx.fillStyle = '#f6c62e';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(aantalMunten + ' munten', w.paneel.x + 200, w.paneel.y + 33);

      // Kruisje om te sluiten
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w.sluit.x + 10, w.sluit.y + 9);
      ctx.lineTo(w.sluit.x + 26, w.sluit.y + 23);
      ctx.moveTo(w.sluit.x + 26, w.sluit.y + 9);
      ctx.lineTo(w.sluit.x + 10, w.sluit.y + 23);
      ctx.stroke();

      // Eén rij per wapen
      for (const rij of w.rijen) {
        const g = rij.g;
        const inHanden = gekozenWapen === g;
        ctx.fillStyle = inHanden ? '#2f5a2b' : '#2a4227';
        ctx.strokeStyle = inHanden ? '#8ee06a' : 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(rij.x, rij.y, rij.b, rij.h, 10);
        ctx.fill();
        ctx.stroke();

        // Plaatje van het wapen
        ctx.save();
        ctx.translate(rij.x + 46, rij.y + rij.h / 2);
        ctx.scale(1.7, 1.7);
        tekenWapen(g);
        ctx.restore();

        // Naam
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(g.naam, rij.x + 110, rij.y + rij.h / 2 - 9);

        // Prijs of wat je ermee kunt
        ctx.font = '17px sans-serif';
        if (inHanden) {
          ctx.fillStyle = '#8ee06a';
          ctx.fillText('in je handen, gooi met de spatiebalk', rij.x + 110, rij.y + rij.h / 2 + 13);
        } else if (g.gekocht) {
          ctx.fillStyle = '#cfe6bf';
          ctx.fillText('gekocht, klik om vast te pakken', rij.x + 110, rij.y + rij.h / 2 + 13);
        } else {
          ctx.fillStyle = aantalMunten >= g.prijs ? '#f6c62e' : '#b08a8a';
          ctx.fillText(g.prijs + ' munten', rij.x + 110, rij.y + rij.h / 2 + 13);
        }
      }

      // Uitleg onderaan het paneel
      if (!melding || meldingTijd <= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Pijltjes om te lopen, spatiebalk om te gooien', w.paneel.x + w.paneel.b / 2, w.paneel.y + w.paneel.h - 16);
      }

      // Kort berichtje onderaan
      if (melding && meldingTijd > 0) {
        ctx.fillStyle = '#ffd9a0';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(melding, w.paneel.x + w.paneel.b / 2, w.paneel.y + w.paneel.h - 16);
      }
      ctx.restore();
    }

    // Zit dit punt in dit vakje?
    function inVak(px, py, vak) {
      return px >= vak.x && px <= vak.x + vak.b && py >= vak.y && py <= vak.y + vak.h;
    }

    canvas.addEventListener('mousedown', function (e) {
      const px = e.clientX;
      const py = e.clientY;
      const w = winkelIndeling();

      if (!winkelOpen) {
        if (inVak(px, py, w.knop)) winkelOpen = true;
        return;
      }

      if (inVak(px, py, w.sluit)) { winkelOpen = false; return; }

      for (const rij of w.rijen) {
        if (!inVak(px, py, rij)) continue;
        const g = rij.g;
        if (gekozenWapen === g) {
          gekozenWapen = null;            // weer wegleggen
        } else if (g.gekocht) {
          gekozenWapen = g;               // al gekocht, dus gewoon vastpakken
        } else if (aantalMunten >= g.prijs) {
          aantalMunten -= g.prijs;
          g.gekocht = true;
          gekozenWapen = g;
          melding = g.naam + ' gekocht!';
          meldingTijd = 2;
        } else {
          melding = 'Te weinig munten, zoek er nog ' + (g.prijs - aantalMunten) + '!';
          meldingTijd = 2;
        }
        return;
      }

      // Buiten het paneel geklikt: winkel weer dicht
      if (!inVak(px, py, w.paneel)) winkelOpen = false;
    });

    // Het aantal gepakte munten linksboven in beeld.
    function tekenTeller() {
      ctx.save();
      ctx.translate(26, 34);
      ctx.fillStyle = '#c08a16';
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f6c62e';
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(aantalMunten), 22, 1);
      ctx.restore();
    }

    // Loopt de dino op deze plek tegen een obstakel aan?
    function botst(x, y) {
      for (const o of obstakels) {
        const dx = (x - o.x) / (o.rx * o.maat + 12);
        const dy = (y - o.y) / (o.ry * o.maat + 7);
        if (dx * dx + dy * dy < 1) return true;
      }
      return false;
    }

    // De varens staan vóór de dino, dus die worden ná hem getekend.
    function tekenVoorgrond(tijd) {
      for (const varen of varens) {
        ctx.save();
        ctx.translate(varen.x, varen.y);
        ctx.scale(varen.grootte, varen.grootte);
        const wieg = Math.sin(tijd * 0.8 + varen.fase) * 0.06;
        for (let i = -3; i <= 3; i++) {
          ctx.save();
          ctx.rotate(-1.57 + i * 0.38 + wieg);
          tekenBlad(46 + Math.abs(3 - Math.abs(i)) * 8, i % 2 === 0 ? '#20491f' : '#2a5c27');
          ctx.restore();
        }
        ctx.restore();
      }
    }

    // De baby dino staat midden op het scherm en wipt zachtjes op en neer.
    const dino = {
      x: 0,              // plek van links naar rechts
      y: 0,              // plek op de bosgrond: lager op het scherm is dichterbij
      tijd: 0,           // loopt door, voor het wippen en knipperen
      stap: 0,           // tikt op bij elke stap, daarmee bewegen de beentjes
      kijktRechts: true,
      loopt: false,
    };

    // ---- Wapenwinkel ----
    // Drie wapens uit de prehistorie. Je koopt ze met je munten en gooit of
    // schiet ze weg met de spatiebalk.
    const wapens = [
      { naam: 'Speer',        soort: 'speer', prijs: 3,  snelheid: 520, wachttijd: 0.55, gekocht: false },
      { naam: 'Bijl',         soort: 'bijl',  prijs: 6,  snelheid: 430, wachttijd: 0.45, gekocht: false },
      { naam: 'Pijl-en-boog', soort: 'boog',  prijs: 10, snelheid: 720, wachttijd: 0.22, gekocht: false },
    ];
    let schoten = [];      // alles wat er door de lucht vliegt
    let pluimen = [];      // stofwolkjes waar iets inslaat
    let wachtNogOp = 0;    // hoe lang het nog duurt voor je weer mag gooien

    let winkelOpen = false;
    let gekozenWapen = null;   // het wapen dat de dino in zijn handen heeft
    let melding = '';           // kort tekstje in de winkel, bijv. te weinig munten
    let meldingTijd = 0;

    const SNELHEID = 190;   // hoe snel hij loopt, in beeldpunten per seconde

    // Welke pijltjes op dit moment ingedrukt zijn.
    const toetsen = {};
    window.addEventListener('keydown', function (e) {
      if (e.key.startsWith('Arrow')) {
        toetsen[e.key] = true;
        e.preventDefault();   // anders scrollt de pagina mee
      }
      if (e.key === ' ') {
        toetsen[' '] = true;
        e.preventDefault();
      }
      if (e.key === 's' || e.key === 'S') winkelOpen = !winkelOpen;
      if (e.key === 'Escape') winkelOpen = false;
    });
    window.addEventListener('keyup', function (e) {
      toetsen[e.key] = false;
    });

    // Verder weg op de bosgrond is hij kleiner, dichterbij groter.
    function dinoGrootte() {
      const diepte = (dino.y - grondhoogte) / Math.max(1, canvas.height - grondhoogte);
      return 2.4 + diepte * 2.2;
    }

    function update(dt) {
      dino.tijd += dt;
      if (meldingTijd > 0) meldingTijd -= dt;

      // Met de winkel open loopt de dino niet, dan sta je rustig te kiezen.
      if (winkelOpen) {
        dino.loopt = false;
        return;
      }

      // Richting bepalen uit de ingedrukte pijltjes
      let dx = 0;
      let dy = 0;
      if (toetsen['ArrowLeft']) dx -= 1;
      if (toetsen['ArrowRight']) dx += 1;
      if (toetsen['ArrowUp']) dy -= 1;
      if (toetsen['ArrowDown']) dy += 1;

      dino.loopt = dx !== 0 || dy !== 0;
      if (dx < 0) dino.kijktRechts = false;
      if (dx > 0) dino.kijktRechts = true;

      if (dino.loopt) {
        // Schuin lopen gaat niet sneller dan rechtdoor
        const lengte = Math.hypot(dx, dy);
        const stapX = (dx / lengte) * SNELHEID * dt;
        const stapY = (dy / lengte) * SNELHEID * dt;
        // Allebei de richtingen los proberen: zo kun je langs een steen schuiven
        // in plaats van er helemaal tegen vast te zitten.
        if (!botst(dino.x + stapX, dino.y)) dino.x += stapX;
        if (!botst(dino.x, dino.y + stapY)) dino.y += stapY;
        dino.stap += dt * 9;
      }

      // Met de spatiebalk gooi je je wapen, zolang je niet net gegooid hebt
      if (wachtNogOp > 0) wachtNogOp -= dt;
      if (toetsen[' '] && gekozenWapen && wachtNogOp <= 0) {
        const richting = dino.kijktRechts ? 1 : -1;
        const maat = dinoGrootte() * 0.75;
        schoten.push({
          soort: gekozenWapen.soort === 'boog' ? 'pijl' : gekozenWapen.soort,
          x: dino.x + richting * 24 * maat,
          y: dino.y,
          hoogte: 17 * dinoGrootte(),      // hoe hoog boven de grond het vliegt
          richting: richting,
          snelheid: gekozenWapen.snelheid,
          maat: maat,
          draai: 0,
          afstand: 0,
        });
        wachtNogOp = gekozenWapen.wachttijd;
      }

      // Alles wat vliegt een stukje verder zetten
      for (const schot of schoten) {
        schot.x += schot.richting * schot.snelheid * dt;
        schot.afstand += schot.snelheid * dt;
        schot.draai += dt * 16;
        // Raakt het een steen, stam of stronk? Dan slaat het in.
        if (botst(schot.x, schot.y)) {
          pluimen.push({ x: schot.x, y: schot.y, leeftijd: 0 });
          schot.weg = true;
        }
        // Buiten het beeld of te ver gevlogen: opruimen
        if (schot.x < -60 || schot.x > canvas.width + 60 || schot.afstand > 900) schot.weg = true;
      }
      schoten = schoten.filter(function (schot) { return !schot.weg; });

      for (const pluim of pluimen) pluim.leeftijd += dt;
      pluimen = pluimen.filter(function (pluim) { return pluim.leeftijd < 0.4; });

      // Munten oppakken waar hij langs loopt
      for (const munt of munten) {
        if (munt.gepakt) continue;
        if (Math.abs(dino.x - munt.x) < 26 && Math.abs(dino.y - munt.y) < 16) {
          munt.gepakt = true;
          aantalMunten += 1;
        }
      }

      // Hij blijft op de bosgrond en loopt niet het beeld uit
      const rand = 30 * dinoGrootte();
      dino.x = Math.min(canvas.width - rand, Math.max(rand, dino.x));
      dino.y = Math.min(canvas.height - 10, Math.max(grondhoogte + 6, dino.y));
    }

    // Tekent de baby dino met (0, 0) bij zijn voeten, in zijn eigen kleine maten.
    function tekenDino() {
      // Staart
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.moveTo(-8, -14);
      ctx.quadraticCurveTo(-26, -10, -22, -2);
      ctx.quadraticCurveTo(-14, -6, -6, -8);
      ctx.closePath();
      ctx.fill();

      // Benen en voeten: tijdens het lopen gaan ze om en om naar voren
      const zwaai = dino.loopt ? Math.sin(dino.stap) * 4 : 0;
      const til = dino.loopt ? Math.max(0, Math.sin(dino.stap)) * 2 : 0;
      const zwaai2 = dino.loopt ? Math.sin(dino.stap + Math.PI) * 4 : 0;
      const til2 = dino.loopt ? Math.max(0, Math.sin(dino.stap + Math.PI)) * 2 : 0;

      ctx.fillStyle = '#4aa83c';
      ctx.fillRect(-7 + zwaai, -8, 5, 8 - til);
      ctx.fillRect(2 + zwaai2, -8, 5, 8 - til2);

      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(-9 + zwaai, -2 - til, 8, 2);
      ctx.fillRect(1 + zwaai2, -2 - til2, 8, 2);

      // Lijf
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(0, -16, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Buikje
      ctx.fillStyle = '#c8ef9a';
      ctx.beginPath();
      ctx.ellipse(1, -13, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hoofd
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(4, -30, 10, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Snuitje
      ctx.beginPath();
      ctx.ellipse(12, -28, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Neusgaatje
      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(14, -30, 1, 1);

      // Oog: elke paar seconden een korte knipper
      const knippert = (dino.tijd % 3) > 2.85;
      ctx.fillStyle = '#222';
      if (knippert) {
        ctx.fillRect(4, -31, 4, 1);
      } else {
        ctx.beginPath();
        ctx.arc(6, -31, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6.7, -31.7, 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Kuifje op zijn kop
      ctx.fillStyle = '#f5d24a';
      ctx.beginPath();
      ctx.moveTo(0, -37);
      ctx.lineTo(3, -42);
      ctx.lineTo(5, -37);
      ctx.closePath();
      ctx.fill();

      // Rugplaatjes
      ctx.fillStyle = '#f5d24a';
      for (const [x, y, h] of [[-4, -24, 4], [-9, -21, 3], [-13, -18, 2]]) {
        ctx.beginPath();
        ctx.moveTo(x - 2, y);
        ctx.lineTo(x, y - h);
        ctx.lineTo(x + 2, y);
        ctx.closePath();
        ctx.fill();
      }

      // Armpje
      ctx.fillStyle = '#4aa83c';
      ctx.beginPath();
      ctx.ellipse(8, -18, 4, 2.5, -0.4, 0, Math.PI * 2);
      ctx.fill();

      // Het gekochte wapen houdt hij voor zich
      if (gekozenWapen) {
        ctx.save();
        ctx.translate(7, -17);
        ctx.rotate(-0.12);
        ctx.scale(0.8, 0.8);
        tekenWapen(gekozenWapen);
        ctx.restore();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenJungle(dino.tijd);

      // Stilstaand ademt hij zachtjes, lopend wipt hij op het ritme van zijn stappen.
      const wip = dino.loopt
        ? Math.abs(Math.sin(dino.stap)) * -4
        : Math.sin(dino.tijd * 2) * 3;

      const grootte = dinoGrootte();

      // Wat verder naar voren staat, tekenen we later, zodat het ervoor lijkt te staan.
      const laag = obstakels.map(function (o) {
        return { y: o.y, teken: function () {
          const maat = o.maat * (1.3 + (o.y - grondhoogte) / Math.max(1, canvas.height - grondhoogte));
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.scale(maat, maat);
          tekenObstakel(o);
          ctx.restore();
        } };
      });
      for (const munt of munten) {
        if (munt.gepakt) continue;
        laag.push({ y: munt.y, teken: function () { tekenMunt(munt, dino.tijd); } });
      }
      for (const schot of schoten) {
        laag.push({ y: schot.y + 1, teken: function () { tekenSchot(schot); } });
      }
      laag.push({ y: dino.y, teken: function () {
        ctx.save();
        ctx.translate(dino.x, dino.y + wip);
        ctx.scale(dino.kijktRechts ? grootte : -grootte, grootte);
        tekenDino();
        ctx.restore();
      } });
      laag.sort(function (a, b) { return a.y - b.y; });
      for (const item of laag) item.teken();

      for (const pluim of pluimen) tekenPluim(pluim);

      tekenVoorgrond(dino.tijd);
      tekenTeller();
      tekenWinkelknop();
      if (winkelOpen) tekenWinkel();
    }

    herbouw();
    dino.x = canvas.width / 2;
    dino.y = grondhoogte + 40;

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>

</body>
