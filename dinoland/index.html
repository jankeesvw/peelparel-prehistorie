<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dinoland</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // De baby dino staat midden op het scherm en wipt zachtjes op en neer.
    const dino = {
      grootte: 4,   // hoeveel groter de dino getekend wordt
      tijd: 0,      // loopt door, voor het wippen en knipperen
    };

    function update(dt) {
      dino.tijd += dt;
    }

    // Tekent de baby dino met (0, 0) bij zijn voeten, in zijn eigen kleine maten.
    function tekenDino() {
      // Staart
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.moveTo(-8, -14);
      ctx.quadraticCurveTo(-26, -10, -22, -2);
      ctx.quadraticCurveTo(-14, -6, -6, -8);
      ctx.closePath();
      ctx.fill();

      // Benen
      ctx.fillStyle = '#4aa83c';
      ctx.fillRect(-7, -8, 5, 8);
      ctx.fillRect(2, -8, 5, 8);

      // Voeten
      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(-9, -2, 8, 2);
      ctx.fillRect(1, -2, 8, 2);

      // Lijf
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(0, -16, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Buikje
      ctx.fillStyle = '#c8ef9a';
      ctx.beginPath();
      ctx.ellipse(1, -13, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hoofd
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(4, -30, 10, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Snuitje
      ctx.beginPath();
      ctx.ellipse(12, -28, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Neusgaatje
      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(14, -30, 1, 1);

      // Oog: elke paar seconden een korte knipper
      const knippert = (dino.tijd % 3) > 2.85;
      ctx.fillStyle = '#222';
      if (knippert) {
        ctx.fillRect(4, -31, 4, 1);
      } else {
        ctx.beginPath();
        ctx.arc(6, -31, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6.7, -31.7, 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Kuifje op zijn kop
      ctx.fillStyle = '#f5d24a';
      ctx.beginPath();
      ctx.moveTo(0, -37);
      ctx.lineTo(3, -42);
      ctx.lineTo(5, -37);
      ctx.closePath();
      ctx.fill();

      // Rugplaatjes
      ctx.fillStyle = '#f5d24a';
      for (const [x, y, h] of [[-4, -24, 4], [-9, -21, 3], [-13, -18, 2]]) {
        ctx.beginPath();
        ctx.moveTo(x - 2, y);
        ctx.lineTo(x, y - h);
        ctx.lineTo(x + 2, y);
        ctx.closePath();
        ctx.fill();
      }

      // Armpje
      ctx.fillStyle = '#4aa83c';
      ctx.beginPath();
      ctx.ellipse(8, -18, 4, 2.5, -0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Zacht op en neer wippen, alsof hij ademt.
      const wip = Math.sin(dino.tijd * 2) * 3;

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2 + 60 + wip);
      ctx.scale(dino.grootte, dino.grootte);
      tekenDino();
      ctx.restore();
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
