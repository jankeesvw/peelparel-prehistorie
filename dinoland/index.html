<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dinoland</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #1d3b22; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function herbouw() {
      pasGrootteAan();
      maakJungle();
    }
    window.addEventListener('resize', herbouw);


    // ---- Jungle ----
    // Alles van de jungle wordt één keer uitgerekend en daarna elke frame getekend,
    // zodat de bomen en plantjes niet elke frame op een andere plek staan.
    let grondhoogte = 0;
    let bomenVer = [];
    let bomen = [];
    let lianen = [];
    let varens = [];
    let bladeren = [];
    let obstakels = [];

    // Eigen toevalsgenerator met een vast begin, zodat de jungle er elke keer
    // hetzelfde uitziet zolang het venster niet van grootte verandert.
    function maakToeval(zaad) {
      let s = zaad;
      return function () {
        s = (s * 1103515245 + 12345) % 2147483648;
        return s / 2147483648;
      };
    }

    function maakJungle() {
      const t = maakToeval(20261007);
      const b = canvas.width;
      const h = canvas.height;
      grondhoogte = h * 0.78;

      // Verre, vage boomtoppen achter de horizon
      bomenVer = [];
      for (let x = -40; x < b + 60; x += 50 + t() * 40) {
        bomenVer.push({ x: x, breedte: 60 + t() * 70, hoogte: 70 + t() * 120 });
      }

      // Boomstammen op de achtergrond
      bomen = [];
      for (let i = 0; i < Math.max(4, Math.round(b / 170)); i++) {
        bomen.push({
          x: (i + 0.3 + t() * 0.4) * (b / Math.max(4, Math.round(b / 170))),
          breedte: 18 + t() * 26,
          kleur: t() < 0.5 ? '#3a2a1c' : '#4a3524',
        });
      }

      // Slingerplanten die van de bovenkant naar beneden hangen
      lianen = [];
      for (let i = 0; i < Math.max(6, Math.round(b / 120)); i++) {
        lianen.push({
          x: t() * b,
          lengte: 80 + t() * 320,
          bocht: (t() - 0.5) * 70,
          snelheid: 0.3 + t() * 0.5,
          fase: t() * 6.28,
        });
      }

      // Bladeren die vanaf de bovenrand naar binnen hangen
      bladeren = [];
      for (let x = -20; x < b + 40; x += 40 + t() * 40) {
        bladeren.push({ x: x, lengte: 50 + t() * 90, hoek: -1.2 + t() * 2.4, fase: t() * 6.28 });
      }

      // Stenen, omgevallen boomstammen en boomstronken op de bosgrond.
      // rx en ry zijn hoe breed en hoe diep je er omheen moet lopen.
      obstakels = [];
      const soorten = ['steen', 'steen', 'boomstam', 'stronk'];
      for (let i = 0; i < Math.max(5, Math.round(b / 190)); i++) {
        const soort = soorten[Math.floor(t() * soorten.length)];
        const ox = 60 + t() * (b - 120);
        const oy = grondhoogte + 15 + t() * (h - grondhoogte - 25);
        // Niet bovenop de startplek van de dino neerzetten
        if (Math.abs(ox - b / 2) < 90 && Math.abs(oy - (grondhoogte + 40)) < 45) continue;
        obstakels.push({
          x: ox,
          y: oy,
          soort: soort,
          maat: 0.8 + t() * 0.5,
          rx: soort === 'boomstam' ? 58 : soort === 'stronk' ? 26 : 30,
          ry: soort === 'boomstam' ? 13 : 14,
        });
      }

      // Varens links en rechts op de voorgrond, het midden blijft vrij voor de dino
      varens = [];
      for (let i = 0; i < Math.max(5, Math.round(b / 160)); i++) {
        const links = i % 2 === 0;
        varens.push({
          x: links ? t() * b * 0.3 : b - t() * b * 0.3,
          y: grondhoogte + 20 + t() * (h - grondhoogte - 20),
          grootte: 0.7 + t() * 0.9,
          fase: t() * 6.28,
        });
      }
    }

    // Eén blad: een spitse ovaal met een nerf erin.
    function tekenBlad(lengte, kleur) {
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(lengte * 0.4, lengte * 0.32, lengte, 0);
      ctx.quadraticCurveTo(lengte * 0.4, -lengte * 0.32, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = Math.max(1, lengte * 0.03);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(lengte, 0);
      ctx.stroke();
    }

    function tekenJungle(tijd) {
      const b = canvas.width;
      const h = canvas.height;

      // Lucht: licht zonlicht dat door het bladerdek valt
      const lucht = ctx.createLinearGradient(0, 0, 0, grondhoogte);
      lucht.addColorStop(0, '#1b3d22');
      lucht.addColorStop(0.45, '#4e8a4a');
      lucht.addColorStop(1, '#a9cf7a');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, grondhoogte);

      // Zonnestralen die schuin door de bomen schijnen
      ctx.save();
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#fff6c8';
      for (let i = 0; i < 4; i++) {
        const x = b * (0.15 + i * 0.22);
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 70, 0);
        ctx.lineTo(x + 230, grondhoogte);
        ctx.lineTo(x + 110, grondhoogte);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Verre boomtoppen
      ctx.fillStyle = '#2f6336';
      for (const bt of bomenVer) {
        ctx.beginPath();
        ctx.ellipse(bt.x, grondhoogte - bt.hoogte * 0.5, bt.breedte / 2, bt.hoogte / 2, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Boomstammen met wat groene aanslag
      for (const boom of bomen) {
        ctx.fillStyle = boom.kleur;
        ctx.fillRect(boom.x - boom.breedte / 2, 0, boom.breedte, grondhoogte + 10);
        ctx.fillStyle = 'rgba(90,150,70,0.25)';
        ctx.fillRect(boom.x - boom.breedte / 2, 0, boom.breedte * 0.3, grondhoogte + 10);
      }

      // Slingerplanten, ze wiegen zachtjes heen en weer
      ctx.strokeStyle = '#2b5c2e';
      for (const liaan of lianen) {
        const zwaai = Math.sin(tijd * liaan.snelheid + liaan.fase) * 12;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(liaan.x, -10);
        ctx.quadraticCurveTo(liaan.x + liaan.bocht + zwaai, liaan.lengte * 0.6, liaan.x + zwaai * 1.5, liaan.lengte);
        ctx.stroke();
        // Blaadje aan het uiteinde
        ctx.save();
        ctx.translate(liaan.x + zwaai * 1.5, liaan.lengte);
        ctx.rotate(1.2 + Math.sin(tijd * liaan.snelheid + liaan.fase) * 0.2);
        tekenBlad(16, '#36713a');
        ctx.restore();
      }

      // Grote bladeren langs de bovenrand
      for (const blad of bladeren) {
        ctx.save();
        ctx.translate(blad.x, -6);
        ctx.rotate(1.57 + blad.hoek * 0.4 + Math.sin(tijd * 0.6 + blad.fase) * 0.05);
        tekenBlad(blad.lengte, '#2a6130');
        ctx.restore();
      }

      // Bosgrond
      const grond = ctx.createLinearGradient(0, grondhoogte, 0, h);
      grond.addColorStop(0, '#5f7a3a');
      grond.addColorStop(1, '#3b4f26');
      ctx.fillStyle = grond;
      ctx.fillRect(0, grondhoogte, b, h - grondhoogte);

      // Graspluimpjes op de grens van de grond
      ctx.strokeStyle = '#7fa848';
      ctx.lineWidth = 2;
      for (let x = 0; x < b; x += 11) {
        const hoogte = 6 + ((x * 7) % 9);
        ctx.beginPath();
        ctx.moveTo(x, grondhoogte + 2);
        ctx.lineTo(x + 3, grondhoogte - hoogte);
        ctx.stroke();
      }
    }

    // Tekent één obstakel met (0, 0) op de grond, in zijn eigen kleine maten.
    function tekenObstakel(o) {
      if (o.soort === 'steen') {
        // Schaduw op de grond
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 26, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        // Keien
        ctx.fillStyle = '#7d7f78';
        ctx.beginPath();
        ctx.ellipse(0, -14, 24, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#95978f';
        ctx.beginPath();
        ctx.ellipse(-5, -19, 15, 11, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#6a6c66';
        ctx.beginPath();
        ctx.ellipse(13, -8, 9, 7, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // Mosje erop
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(-9, -27, 7, 3, -0.3, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.soort === 'boomstam') {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 54, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // Liggende stam
        ctx.fillStyle = '#5a3f28';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-50, -20, 100, 20, 9) : ctx.rect(-50, -20, 100, 20);
        ctx.fill();
        // Lichte bovenkant
        ctx.fillStyle = '#6d4e32';
        ctx.fillRect(-48, -19, 96, 6);
        // Jaarringen aan de kop
        ctx.fillStyle = '#8a6440';
        ctx.beginPath();
        ctx.ellipse(-50, -10, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6d4e32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(-50, -10, 3, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Mos op de stam
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(10, -21, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        // Wortels
        ctx.fillStyle = '#4a3524';
        for (const wx of [-18, -9, 9, 18]) {
          ctx.beginPath();
          ctx.moveTo(wx, 2);
          ctx.lineTo(wx * 0.4, -14);
          ctx.lineTo(wx * 0.9, -14);
          ctx.closePath();
          ctx.fill();
        }
        // Stronk
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(-13, -34, 26, 34);
        // Zaagvlak bovenop
        ctx.fillStyle = '#8a6440';
        ctx.beginPath();
        ctx.ellipse(0, -34, 13, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6d4e32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, -34, 7, 2.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Plantje erop
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(6, -37, 7, 3, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Loopt de dino op deze plek tegen een obstakel aan?
    function botst(x, y) {
      for (const o of obstakels) {
        const dx = (x - o.x) / (o.rx * o.maat + 12);
        const dy = (y - o.y) / (o.ry * o.maat + 7);
        if (dx * dx + dy * dy < 1) return true;
      }
      return false;
    }

    // De varens staan vóór de dino, dus die worden ná hem getekend.
    function tekenVoorgrond(tijd) {
      for (const varen of varens) {
        ctx.save();
        ctx.translate(varen.x, varen.y);
        ctx.scale(varen.grootte, varen.grootte);
        const wieg = Math.sin(tijd * 0.8 + varen.fase) * 0.06;
        for (let i = -3; i <= 3; i++) {
          ctx.save();
          ctx.rotate(-1.57 + i * 0.38 + wieg);
          tekenBlad(46 + Math.abs(3 - Math.abs(i)) * 8, i % 2 === 0 ? '#20491f' : '#2a5c27');
          ctx.restore();
        }
        ctx.restore();
      }
    }

    // De baby dino staat midden op het scherm en wipt zachtjes op en neer.
    const dino = {
      x: 0,              // plek van links naar rechts
      y: 0,              // plek op de bosgrond: lager op het scherm is dichterbij
      tijd: 0,           // loopt door, voor het wippen en knipperen
      stap: 0,           // tikt op bij elke stap, daarmee bewegen de beentjes
      kijktRechts: true,
      loopt: false,
    };

    const SNELHEID = 190;   // hoe snel hij loopt, in beeldpunten per seconde

    // Welke pijltjes op dit moment ingedrukt zijn.
    const toetsen = {};
    window.addEventListener('keydown', function (e) {
      if (e.key.startsWith('Arrow')) {
        toetsen[e.key] = true;
        e.preventDefault();   // anders scrollt de pagina mee
      }
    });
    window.addEventListener('keyup', function (e) {
      toetsen[e.key] = false;
    });

    // Verder weg op de bosgrond is hij kleiner, dichterbij groter.
    function dinoGrootte() {
      const diepte = (dino.y - grondhoogte) / Math.max(1, canvas.height - grondhoogte);
      return 2.4 + diepte * 2.2;
    }

    function update(dt) {
      dino.tijd += dt;

      // Richting bepalen uit de ingedrukte pijltjes
      let dx = 0;
      let dy = 0;
      if (toetsen['ArrowLeft']) dx -= 1;
      if (toetsen['ArrowRight']) dx += 1;
      if (toetsen['ArrowUp']) dy -= 1;
      if (toetsen['ArrowDown']) dy += 1;

      dino.loopt = dx !== 0 || dy !== 0;
      if (dx < 0) dino.kijktRechts = false;
      if (dx > 0) dino.kijktRechts = true;

      if (dino.loopt) {
        // Schuin lopen gaat niet sneller dan rechtdoor
        const lengte = Math.hypot(dx, dy);
        const stapX = (dx / lengte) * SNELHEID * dt;
        const stapY = (dy / lengte) * SNELHEID * dt;
        // Allebei de richtingen los proberen: zo kun je langs een steen schuiven
        // in plaats van er helemaal tegen vast te zitten.
        if (!botst(dino.x + stapX, dino.y)) dino.x += stapX;
        if (!botst(dino.x, dino.y + stapY)) dino.y += stapY;
        dino.stap += dt * 9;
      }

      // Hij blijft op de bosgrond en loopt niet het beeld uit
      const rand = 30 * dinoGrootte();
      dino.x = Math.min(canvas.width - rand, Math.max(rand, dino.x));
      dino.y = Math.min(canvas.height - 10, Math.max(grondhoogte + 6, dino.y));
    }

    // Tekent de baby dino met (0, 0) bij zijn voeten, in zijn eigen kleine maten.
    function tekenDino() {
      // Staart
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.moveTo(-8, -14);
      ctx.quadraticCurveTo(-26, -10, -22, -2);
      ctx.quadraticCurveTo(-14, -6, -6, -8);
      ctx.closePath();
      ctx.fill();

      // Benen en voeten: tijdens het lopen gaan ze om en om naar voren
      const zwaai = dino.loopt ? Math.sin(dino.stap) * 4 : 0;
      const til = dino.loopt ? Math.max(0, Math.sin(dino.stap)) * 2 : 0;
      const zwaai2 = dino.loopt ? Math.sin(dino.stap + Math.PI) * 4 : 0;
      const til2 = dino.loopt ? Math.max(0, Math.sin(dino.stap + Math.PI)) * 2 : 0;

      ctx.fillStyle = '#4aa83c';
      ctx.fillRect(-7 + zwaai, -8, 5, 8 - til);
      ctx.fillRect(2 + zwaai2, -8, 5, 8 - til2);

      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(-9 + zwaai, -2 - til, 8, 2);
      ctx.fillRect(1 + zwaai2, -2 - til2, 8, 2);

      // Lijf
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(0, -16, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Buikje
      ctx.fillStyle = '#c8ef9a';
      ctx.beginPath();
      ctx.ellipse(1, -13, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hoofd
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(4, -30, 10, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Snuitje
      ctx.beginPath();
      ctx.ellipse(12, -28, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Neusgaatje
      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(14, -30, 1, 1);

      // Oog: elke paar seconden een korte knipper
      const knippert = (dino.tijd % 3) > 2.85;
      ctx.fillStyle = '#222';
      if (knippert) {
        ctx.fillRect(4, -31, 4, 1);
      } else {
        ctx.beginPath();
        ctx.arc(6, -31, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6.7, -31.7, 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Kuifje op zijn kop
      ctx.fillStyle = '#f5d24a';
      ctx.beginPath();
      ctx.moveTo(0, -37);
      ctx.lineTo(3, -42);
      ctx.lineTo(5, -37);
      ctx.closePath();
      ctx.fill();

      // Rugplaatjes
      ctx.fillStyle = '#f5d24a';
      for (const [x, y, h] of [[-4, -24, 4], [-9, -21, 3], [-13, -18, 2]]) {
        ctx.beginPath();
        ctx.moveTo(x - 2, y);
        ctx.lineTo(x, y - h);
        ctx.lineTo(x + 2, y);
        ctx.closePath();
        ctx.fill();
      }

      // Armpje
      ctx.fillStyle = '#4aa83c';
      ctx.beginPath();
      ctx.ellipse(8, -18, 4, 2.5, -0.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenJungle(dino.tijd);

      // Stilstaand ademt hij zachtjes, lopend wipt hij op het ritme van zijn stappen.
      const wip = dino.loopt
        ? Math.abs(Math.sin(dino.stap)) * -4
        : Math.sin(dino.tijd * 2) * 3;

      const grootte = dinoGrootte();

      // Wat verder naar voren staat, tekenen we later, zodat het ervoor lijkt te staan.
      const laag = obstakels.map(function (o) {
        return { y: o.y, teken: function () {
          const maat = o.maat * (1.3 + (o.y - grondhoogte) / Math.max(1, canvas.height - grondhoogte));
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.scale(maat, maat);
          tekenObstakel(o);
          ctx.restore();
        } };
      });
      laag.push({ y: dino.y, teken: function () {
        ctx.save();
        ctx.translate(dino.x, dino.y + wip);
        ctx.scale(dino.kijktRechts ? grootte : -grootte, grootte);
        tekenDino();
        ctx.restore();
      } });
      laag.sort(function (a, b) { return a.y - b.y; });
      for (const item of laag) item.teken();

      tekenVoorgrond(dino.tijd);
    }

    herbouw();
    dino.x = canvas.width / 2;
    dino.y = grondhoogte + 40;

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
