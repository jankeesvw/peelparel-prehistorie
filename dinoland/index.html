      } else {
        dino.opGrond = false;
      }

      // Gevangen? Dan kom je niet voorbij de rolsteen. Gooien kan nog wel,
      // dat is juist hoe je loskomt.
      if (gevangen) {
        dino.y = Math.min(hunebed.y + HB.voor - HB.dik - 6, dino.y);
      }

      // Bovenaan de balken de grot in: door naar het volgende level
      if (!gevangen && !gewonnen && grot && Math.abs(dino.x - grot.x) < 60
          && Math.abs(dino.y - grot.y) < 55 && dino.hoogte > grot.z - 45) {
        if (level >= AANTAL_LEVELS) {
          // Dit was het laatste level: feest op de dansvloer
          gewonnen = true;
          levelTekst = 'Alle 30 levels gehaald!';
          levelTekstTijd = 6;
          dino.x = wereld.breedte / 2;
          dino.y = grondhoogte + 80;
          dino.hoogte = 0;
          dino.vz = 0;
          camera.x = Math.max(0, Math.min(wereld.breedte - canvas.width, dino.x - canvas.width / 2));
          return;
        }
        level += 1;
        levelTekst = level >= AANTAL_LEVELS ? 'DISCOLEVEL!' : 'Level ' + level + '!';
        levelTekstTijd = 2.5;
        schoten = [];
        pluimen = [];
        gevangen = false;
        herbouw();
        dino.x = wereld.breedte / 2;
        dino.y = grondhoogte + 60;
        dino.hoogte = 0;
        dino.vz = 0;
        dino.opGrond = true;
        camera.x = Math.max(0, Math.min(wereld.breedte - canvas.width, dino.x - canvas.width / 2));
        return;
      }

      // Met de spatiebalk gooi je je wapen, zolang je niet net gegooid hebt
      if (wachtNogOp > 0) wachtNogOp -= dt;
      if (toetsen[' '] && gekozenWapen && wachtNogOp <= 0) {
        const richting = dino.kijktRechts ? 1 : -1;
        const maat = dinoGrootte() * 0.75;
        schoten.push({
          soort: gekozenWapen.soort === 'boog' ? 'pijl' : gekozenWapen.soort,
          x: dino.x + richting * 24 * maat,
          y: dino.y,
          hoogte: 17 * dinoGrootte() + dino.hoogte,   // hoe hoog boven de grond het vliegt
          richting: richting,
          snelheid: gekozenWapen.snelheid,
          maat: maat,
          draai: 0,
          afstand: 0,
        });
        wachtNogOp = gekozenWapen.wachttijd;
      }

      // Alles wat vliegt een stukje verder zetten
      for (const schot of schoten) {
        schot.x += schot.richting * schot.snelheid * dt;
        schot.afstand += schot.snelheid * dt;
        schot.draai += dt * 16;
        // Raakt het een bewaker? Twee treffers en hij gaat om.
        for (const bewaker of bewakers) {
          if (bewaker.verslagen || bewaker.schrik > 0) continue;
          if (Math.abs(schot.x - bewaker.x) < 30 && Math.abs(schot.y - bewaker.y) < 50) {
            bewaker.leven -= 1;
            bewaker.schrik = 0.35;
            bewaker.x += schot.richting * 10;          // hij deinst achteruit
            pluimen.push({ x: schot.x, y: schot.y, leeftijd: 0 });
            schot.weg = true;
            if (bewaker.leven <= 0) {
              bewaker.verslagen = true;
              bewaker.valTijd = 1.1;
            }
          }
        }

        // Raakt het een jager of een hond? Die schrikt zich een hoedje en loopt weg.
        for (const jager of jagers) {
          if (jager.bangTijd <= 0 && Math.abs(schot.x - jager.x) < 28 && Math.abs(schot.y - jager.y) < 26) {
            jager.bangTijd = 5;
            jager.hondBangTijd = 5;
            pluimen.push({ x: schot.x, y: schot.y, leeftijd: 0 });
            schot.weg = true;
          }
          if (jager.hondBangTijd <= 0 && Math.abs(schot.x - jager.hondX) < 24 && Math.abs(schot.y - jager.hondY) < 22) {
            jager.hondBangTijd = 5;
            pluimen.push({ x: schot.x, y: schot.y, leeftijd: 0 });
            schot.weg = true;
          }
        }

        // Raakt het een steen, stam of stronk? Dan slaat het in.
        if (botstObstakel(schot.x, schot.y)) {
          pluimen.push({ x: schot.x, y: schot.y, leeftijd: 0 });
          schot.weg = true;
        }
        // Buiten het beeld of te ver gevlogen: opruimen
        if (schot.x < -60 || schot.x > wereld.breedte + 60 || schot.afstand > 900) schot.weg = true;
      }
      schoten = schoten.filter(function (schot) { return !schot.weg; });

      // Dwarrelende blaadjes zakken naar beneden en beginnen bovenaan opnieuw
      for (const bl of vallend) {
        bl.y += bl.val * dt;
        if (bl.y > canvas.height + 20) {
          bl.y = -20;
          bl.x = camera.x + Math.random() * canvas.width;
        }
      }

      for (const pluim of pluimen) pluim.leeftijd += dt;
      pluimen = pluimen.filter(function (pluim) { return pluim.leeftijd < 0.4; });

      // Munten oppakken waar hij langs loopt
      for (const munt of munten) {
        if (munt.gepakt) continue;
        if (Math.abs(dino.x - munt.x) < 26 && Math.abs(dino.y - munt.y) < 20
            && Math.abs(dino.hoogte - (munt.hoogte || 0)) < 45) {
          munt.gepakt = true;
          aantalMunten += 1;
        }
      }

      // Hij blijft op de bosgrond en binnen de wereld
      const rand = 30 * dinoGrootte();
      dino.x = Math.min(wereld.breedte - rand, Math.max(rand, dino.x));
      dino.y = Math.min(canvas.height - 10, Math.max(grondhoogte + 6, dino.y));

      // De camera houdt de dino in het midden, maar stopt bij de rand van de wereld
      const doel = dino.x - canvas.width / 2;
      camera.x = Math.max(0, Math.min(wereld.breedte - canvas.width, doel));
    }

    // Tekent de baby dino met (0, 0) bij zijn voeten, in zijn eigen kleine maten.
    function tekenDino() {
      // Staart
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.moveTo(-8, -14);
      ctx.quadraticCurveTo(-26, -10, -22, -2);
      ctx.quadraticCurveTo(-14, -6, -6, -8);
      ctx.closePath();
      ctx.fill();

      // Benen en voeten: tijdens het lopen gaan ze om en om naar voren
      const zwaai = dino.loopt ? Math.sin(dino.stap) * 4 : 0;
      const til = dino.loopt ? Math.max(0, Math.sin(dino.stap)) * 2 : 0;
      const zwaai2 = dino.loopt ? Math.sin(dino.stap + Math.PI) * 4 : 0;
      const til2 = dino.loopt ? Math.max(0, Math.sin(dino.stap + Math.PI)) * 2 : 0;

      ctx.fillStyle = '#4aa83c';
      ctx.fillRect(-7 + zwaai, -8, 5, 8 - til);
      ctx.fillRect(2 + zwaai2, -8, 5, 8 - til2);

      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(-9 + zwaai, -2 - til, 8, 2);
      ctx.fillRect(1 + zwaai2, -2 - til2, 8, 2);

      // Lijf
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(0, -16, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Buikje
      ctx.fillStyle = '#c8ef9a';
      ctx.beginPath();
      ctx.ellipse(1, -13, 7, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hoofd
      ctx.fillStyle = '#5bbf4a';
      ctx.beginPath();
      ctx.ellipse(4, -30, 10, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Snuitje
      ctx.beginPath();
      ctx.ellipse(12, -28, 5, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Neusgaatje
      ctx.fillStyle = '#3d8f31';
      ctx.fillRect(14, -30, 1, 1);

      // Oog: elke paar seconden een korte knipper
      const knippert = (dino.tijd % 3) > 2.85;
      ctx.fillStyle = '#222';
      if (knippert) {
        ctx.fillRect(4, -31, 4, 1);
      } else {
        ctx.beginPath();
        ctx.arc(6, -31, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(6.7, -31.7, 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Kuifje op zijn kop
      ctx.fillStyle = '#f5d24a';
      ctx.beginPath();
      ctx.moveTo(0, -37);
      ctx.lineTo(3, -42);
      ctx.lineTo(5, -37);
      ctx.closePath();
      ctx.fill();

      // Rugplaatjes
      ctx.fillStyle = '#f5d24a';
      for (const [x, y, h] of [[-4, -24, 4], [-9, -21, 3], [-13, -18, 2]]) {
        ctx.beginPath();
        ctx.moveTo(x - 2, y);
        ctx.lineTo(x, y - h);
        ctx.lineTo(x + 2, y);
        ctx.closePath();
        ctx.fill();
      }

      // Armpje
      ctx.fillStyle = '#4aa83c';
      ctx.beginPath();
      ctx.ellipse(8, -18, 4, 2.5, -0.4, 0, Math.PI * 2);
      ctx.fill();

      // Het gekochte wapen houdt hij voor zich
      if (gekozenWapen) {
        ctx.save();
        ctx.translate(7, -17);
        ctx.rotate(-0.12);
        ctx.scale(0.8, 0.8);
        tekenWapen(gekozenWapen);
        ctx.restore();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenJungle(dino.tijd);

      // Stilstaand ademt hij zachtjes, lopend wipt hij op het ritme van zijn stappen.
      const wip = dino.loopt
        ? Math.abs(Math.sin(dino.stap)) * -4
        : (disco ? -Math.abs(Math.sin(tel(dino.tijd) * Math.PI)) * 9 : Math.sin(dino.tijd * 2) * 3);

      const grootte = dinoGrootte();

      // Alles in de wereld schuift mee met de camera.
      ctx.save();
      ctx.translate(-camera.x, 0);

      // Is dit stukje wereld nu in beeld? Anders hoeven we het niet te tekenen.
      function inBeeld(x) {
        return x > camera.x - 160 && x < camera.x + canvas.width + 160;
      }

      // Wat verder naar voren staat, tekenen we later, zodat het ervoor lijkt te staan.
      const laag = [];
      for (const o of obstakels) {
        if (!inBeeld(o.x)) continue;
        laag.push({ y: o.y, teken: function () {
          const maat = o.maat * (1.3 + (o.y - grondhoogte) / Math.max(1, canvas.height - grondhoogte));
          ctx.save();
          ctx.translate(o.x, o.y);
          ctx.scale(maat, maat);
          tekenObstakel(o);
          ctx.restore();
        } });
      }
      // Het hunebed: de achterste stenen eerst, de voorste stenen later, zodat
      // je er echt tussen staat als je gevangen bent.
      if (hunebed && inBeeld(hunebed.x)) {
        laag.push({ y: hunebed.y + HB.achter - 10, teken: function () {
          ctx.save();
          ctx.translate(hunebed.x, hunebed.y);
          tekenHunebed(false);
          ctx.restore();
        } });
        laag.push({ y: hunebed.y + HB.voor, teken: function () {
          ctx.save();
          ctx.translate(hunebed.x, hunebed.y);
          tekenHunebed(true);
          ctx.restore();
        } });
      }

      // De twee bewakers bij de ingang
      for (const bewaker of bewakers) {
        if (!inBeeld(bewaker.x)) continue;
        laag.push({ y: bewaker.y, teken: function () {
          const maat = grootteOpDiepte(bewaker.y) * 1.05;
          ctx.save();
          ctx.translate(bewaker.x, bewaker.y + dansWip);
          ctx.scale(bewaker.kijktRechts ? maat : -maat, maat);
          tekenBewaker(bewaker, dino.tijd);
          ctx.restore();
        } });
      }

      // In de disco wipt iedereen op de maat mee
      const dansWip = disco ? -Math.abs(Math.sin(tel(dino.tijd) * Math.PI)) * 10 : 0;

      // Mensen met honden
      for (const jager of jagers) {
        if (inBeeld(jager.x)) {
          laag.push({ y: jager.y, teken: function () {
            const maat = grootteOpDiepte(jager.y) * 0.95;
            ctx.save();
            ctx.translate(jager.x, jager.y + dansWip);
            ctx.scale(jager.kijktRechts ? maat : -maat, maat);
            tekenJager(jager);
            ctx.restore();
          } });
        }
        if (inBeeld(jager.hondX)) {
          laag.push({ y: jager.hondY, teken: function () {
            const maat = grootteOpDiepte(jager.hondY) * 0.95;
            ctx.save();
            ctx.translate(jager.hondX, jager.hondY + dansWip * 0.6);
            ctx.scale(jager.hondKijktRechts ? maat : -maat, maat);
            tekenHond(jager);
            ctx.restore();
          } });
        }
      }

      // De grot staat ver naar achter, dus die komt vroeg in de rij
      if (grot && inBeeld(grot.x)) {
        laag.push({ y: grot.y - 1, teken: function () { tekenGrot(dino.tijd); } });
      }
      if (lift && inBeeld(lift.x)) {
        laag.push({ y: lift.y, teken: function () {
          ctx.save();
          ctx.translate(lift.x, lift.y);
          tekenLift(dino.tijd);
          ctx.restore();
        } });
      }
      if (bordje && inBeeld(bordje.x)) {
        laag.push({ y: bordje.y, teken: function () {
          const maat = grootteOpDiepte(bordje.y) * 0.5;
          ctx.save();
          ctx.translate(bordje.x, bordje.y);
          ctx.scale(maat, maat);
          tekenBordje();
          ctx.restore();
        } });
      }
      for (const balk of balken) {
        if (!inBeeld(balk.x)) continue;
        laag.push({ y: balk.y, teken: function () {
          ctx.save();
          ctx.translate(balk.x, balk.y);
          tekenBalk(balk);
          ctx.restore();
        } });
      }
      for (const munt of munten) {
        if (munt.gepakt || !inBeeld(munt.x)) continue;
        laag.push({ y: munt.y, teken: function () { tekenMunt(munt, dino.tijd); } });
      }
      for (const schot of schoten) {
        laag.push({ y: schot.y + 1, teken: function () { tekenSchot(schot); } });
      }
      // Sta je op een balk, dan hoor je er net vóór getekend te worden.
      laag.push({ y: dino.y + (dino.hoogte > 0 ? 25 : 0), teken: function () {
        // Schaduw op de bosgrond, kleiner als hij hoger zit
        if (dino.hoogte > 2) {
          ctx.save();
          ctx.globalAlpha = Math.max(0.1, 0.32 - dino.hoogte / 1400);
          ctx.fillStyle = '#000';
          ctx.beginPath();
          ctx.ellipse(dino.x, dino.y, 11 * grootte, 3.5 * grootte, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.translate(dino.x, dino.y + wip - dino.hoogte);
        ctx.scale(dino.kijktRechts ? grootte : -grootte, grootte);
        tekenDino();
        ctx.restore();
      } });
      laag.sort(function (a, b) { return a.y - b.y; });
      for (const item of laag) item.teken();

      for (const pluim of pluimen) tekenPluim(pluim);

      tekenNevel();
      tekenVoorgrond(dino.tijd);
      tekenVlinders(dino.tijd);
      tekenVallend(dino.tijd);
      ctx.restore();

      tekenRand();

      tekenTeller();
      tekenKaartje();
      tekenUitleg();
      if (gevangen) tekenGevangenTekst();
      if (levelTekstTijd > 0) tekenLevelTekst();
      if (gewonnen) tekenGewonnen(dino.tijd);
      tekenWinkelknop();
      if (winkelOpen) tekenWinkel();
    }

    herbouw();
    dino.x = wereld.breedte / 2;
    dino.y = grondhoogte + 60;
    camera.x = Math.max(0, Math.min(wereld.breedte - canvas.width, dino.x - canvas.width / 2));

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
