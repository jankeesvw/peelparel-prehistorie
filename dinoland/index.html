<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dinoland</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #1d3b22; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function herbouw() {
      pasGrootteAan();
      maakJungle();
    }
    window.addEventListener('resize', herbouw);


    // ---- Jungle ----
    // Alles van de jungle wordt één keer uitgerekend en daarna elke frame getekend,
    // zodat de bomen en plantjes niet elke frame op een andere plek staan.
    let grondhoogte = 0;
    // De jungle is veel breder dan het scherm. De camera schuift mee met de dino.
    const wereld = { breedte: 0, patroon: 0 };
    const camera = { x: 0 };
    const AANTAL_LEVELS = 30;   // zoveel levels zijn er, en 30 is het discolevel
    let level = 1;
    let disco = false;          // staat het discolevel aan?
    let gewonnen = false;
    let balken = [];            // houten balken waar je op kunt springen
    let grot = null;            // de grot bovenaan de balken: de uitgang naar het volgende level
    let lift = null;            // houten lift naast de trap, voor wie niet wil springen
    let bordje = null;          // het bordje dat naar de lift wijst
    let levelTekst = '';        // grote tekst als je een level haalt
    let levelTekstTijd = 0;
    let jagers = [];            // mensen met honden die je willen vangen
    let hunebed = null;         // de stenen gevangenis waar ze je in zetten
    let gevangen = false;
    let bewakers = [];          // de twee bewakers bij de ingang van het hunebed

    // De maten van het hunebed. Je loopt aan de voorkant tussen de stenen naar binnen.
    const HB = {
      halfBreed: 170,    // van het midden tot de buitenste steen
      achter: -20,       // de achterwand
      voor: 90,          // de voorkant met de ingang
      poort: 60,         // de helft van de opening waar je door naar binnen loopt
      dik: 22,           // hoe dik de stenen muren zijn
    };
    let bomenVer = [];
    let bomen = [];
    let lianen = [];
    let varens = [];
    let bladeren = [];
    let bomenVerst = [];        // de verste, vaagste bomen aan de horizon
    let struiken = [];          // struiken langs de horizon en op de bosgrond
    let bosvloer = [];          // blaadjes, takjes, steentjes en zonnevlekken
    let vlinders = [];
    let vallend = [];           // blaadjes die naar beneden dwarrelen
    let obstakels = [];
    let munten = [];
    let aantalMunten = 0;

    // Eigen toevalsgenerator met een vast begin, zodat de jungle er elke keer
    // hetzelfde uitziet zolang het venster niet van grootte verandert.
    function maakToeval(zaad) {
      let s = zaad;
      return function () {
        s = (s * 1103515245 + 12345) % 2147483648;
        return s / 2147483648;
      };
    }

    function maakJungle() {
      const t = maakToeval(20261007 + level * 7919);
      disco = level >= AANTAL_LEVELS;
      const b = canvas.width;
      const h = canvas.height;
      grondhoogte = h * 0.6;                      // horizon: de bosgrond is lekker diep
      wereld.breedte = Math.max(b * 4, 4800);     // zoveel kun je naar links en rechts lopen
      wereld.patroon = b + 320;                   // de achtergrond herhaalt zich hierna

      // De verste bomen: nauwelijks nog kleur, dat maakt de jungle diep
      bomenVerst = [];
      for (let x = -60; x < wereld.patroon + 80; x += 70 + t() * 60) {
        bomenVerst.push({ x: x, breedte: 90 + t() * 120, hoogte: 110 + t() * 170 });
      }

      // Verre, vage boomtoppen achter de horizon (herhalen zich tijdens het lopen)
      bomenVer = [];
      for (let x = -40; x < wereld.patroon + 60; x += 50 + t() * 40) {
        bomenVer.push({ x: x, breedte: 60 + t() * 70, hoogte: 70 + t() * 120 });
      }

      // Boomstammen op de achtergrond
      bomen = [];
      const aantalBomen = Math.max(5, Math.round(wereld.patroon / 170));
      for (let i = 0; i < aantalBomen; i++) {
        bomen.push({
          x: (i + 0.3 + t() * 0.4) * (wereld.patroon / aantalBomen),
          breedte: 18 + t() * 26,
          kleur: t() < 0.5 ? '#3a2a1c' : '#4a3524',
        });
      }

      // Slingerplanten die van de bovenkant naar beneden hangen
      lianen = [];
      for (let i = 0; i < Math.max(7, Math.round(wereld.patroon / 120)); i++) {
        lianen.push({
          x: t() * wereld.patroon,
          lengte: 80 + t() * 320,
          bocht: (t() - 0.5) * 70,
          snelheid: 0.3 + t() * 0.5,
          fase: t() * 6.28,
        });
      }

      // Bladeren die vanaf de bovenrand naar binnen hangen
      bladeren = [];
      for (let x = -20; x < wereld.patroon + 40; x += 40 + t() * 40) {
        bladeren.push({ x: x, lengte: 50 + t() * 90, hoek: -1.2 + t() * 2.4, fase: t() * 6.28 });
      }

      // Struiken: een rij langs de horizon zodat de overgang niet zo hard is,
      // en losse struiken verder naar voren op de bosgrond.
      struiken = [];
      for (let i = 0; i < Math.round(wereld.breedte / 55); i++) {
        const achteraan = t() < 0.62;
        struiken.push({
          x: t() * wereld.breedte,
          y: achteraan ? grondhoogte + 2 + t() * 26 : grondhoogte + 30 + t() * (h - grondhoogte - 40),
          maat: achteraan ? 0.5 + t() * 0.4 : 0.7 + t() * 0.8,
          donker: t() < 0.5,
          bloemen: t() < 0.25,
          fase: t() * 6.28,
        });
      }

      // De bosvloer: afgevallen blad, takjes, steentjes, plekken aarde en
      // zonnevlekken die door het bladerdek vallen.
      bosvloer = [];
      const soortenVloer = ['blad', 'blad', 'blad', 'takje', 'steentje', 'plek', 'licht', 'licht'];
      for (let i = 0; i < Math.round(wereld.breedte / 6); i++) {
        bosvloer.push({
          x: t() * wereld.breedte,
          y: grondhoogte + 4 + t() * (h - grondhoogte - 4),
          soort: soortenVloer[Math.floor(t() * soortenVloer.length)],
          maat: 0.6 + t() * 1.1,
          hoek: t() * 6.28,
          tint: Math.floor(t() * 4),
          fase: t() * 6.28,
        });
      }

      // Vlinders die boven de bosgrond fladderen
      vlinders = [];
      for (let i = 0; i < Math.round(wereld.breedte / 500); i++) {
        vlinders.push({
          x: t() * wereld.breedte,
          y: grondhoogte + 20 + t() * (h - grondhoogte - 40),
          hoogte: 30 + t() * 70,
          fase: t() * 6.28,
          snelheid: 0.6 + t() * 0.8,
          kleur: ['#f2e06a', '#e78fc0', '#9fd8ff', '#ffb45e'][Math.floor(t() * 4)],
        });
      }

      // Blaadjes die naar beneden dwarrelen
      vallend = [];
      for (let i = 0; i < 26; i++) {
        vallend.push({
          x: t() * wereld.breedte,
          y: t() * h,
          val: 22 + t() * 30,
          zwaai: 20 + t() * 40,
          fase: t() * 6.28,
          maat: 0.7 + t() * 0.7,
          kleur: ['#6f9a3e', '#3f7a35', '#8a7a2e', '#b06a2e'][Math.floor(t() * 4)],
        });
      }

      // Stenen, omgevallen boomstammen en boomstronken, verspreid over de hele wereld.
      // rx en ry zijn hoe breed en hoe diep je er omheen moet lopen.
      obstakels = [];
      const soorten = ['steen', 'steen', 'boomstam', 'stronk'];
      for (let i = 0; i < Math.round(wereld.breedte / 150); i++) {
        const soort = soorten[Math.floor(t() * soorten.length)];
        const ox = 60 + t() * (wereld.breedte - 120);
        const oy = grondhoogte + 15 + t() * (h - grondhoogte - 25);
        // Niet bovenop de startplek van de dino neerzetten
        if (Math.abs(ox - wereld.breedte / 2) < 110 && Math.abs(oy - (grondhoogte + 60)) < 60) continue;
        obstakels.push({
          x: ox,
          y: oy,
          soort: soort,
          maat: 0.8 + t() * 0.5,
          rx: soort === 'boomstam' ? 58 : soort === 'stronk' ? 26 : 30,
          ry: soort === 'boomstam' ? 13 : 14,
          // hoe hoog hij opgerekt wordt: de stronk torent boven de dino uit
          hoog: soort === 'boomstam' ? 2.0 : soort === 'stronk' ? 2.9 : 2.3,
        });
      }

      // Bij elk obstakel liggen een of twee munten, net buiten de steen of stam.
      munten = [];
      for (const o of obstakels) {
        const hoeveel = 1 + Math.round(t());
        for (let n = 0; n < hoeveel; n++) {
          const hoek = t() * Math.PI * 2;
          const afstandX = o.rx * o.maat + 38;
          const afstandY = o.ry * o.maat + 24;
          const mx = o.x + Math.cos(hoek) * afstandX;
          const my = o.y + Math.sin(hoek) * afstandY;
          // Alleen als de munt binnen de bosgrond ligt en niet in een ander obstakel
          if (mx < 25 || mx > wereld.breedte - 25) continue;
          if (my < grondhoogte + 12 || my > h - 8) continue;
          if (botstObstakel(mx, my)) continue;
          munten.push({ x: mx, y: my, hoogte: 0, fase: t() * 6.28, gepakt: false });
        }
      }

      // Een trap van houten balken die omhoog en naar achter loopt, met
      // bovenaan een grot in de rotswand: daar ga je naar het volgende level.
      balken = [];
      // De bovenste balk moet nog wel op het scherm passen, met de grot erboven.
      // De balken zijn lekker breed en de treden zijn laag, zodat klimmen makkelijk is.
      const ruimte = Math.max(90, grondhoogte - 240);
      const aantalBalken = Math.max(3, Math.min(7, 4 + Math.floor(level / 2), Math.floor(ruimte / 55) + 1));
      const stap = Math.max(36, Math.min(55, ruimte / (aantalBalken - 1)));
      const grotX = 500 + t() * (wereld.breedte - 1000);
      for (let i = 0; i < aantalBalken; i++) {
        balken.push({
          x: grotX - (aantalBalken - i) * 80,
          y: grondhoogte + 140 - i * (30 / (aantalBalken - 1)),
          z: 55 + i * stap,                // hoe hoog de balk boven de grond hangt
          breedte: 130,
          diepte: 76,
        });
      }
      const bovenste = balken[balken.length - 1];
      grot = { x: bovenste.x + 30, y: bovenste.y - 38, z: bovenste.z };

      // Een houten lift naast de trap: hij gaat rustig op en neer, dus je kunt
      // ook naar boven zonder van balk naar balk te springen.
      lift = {
        x: bovenste.x + 100,     // net naast de bovenste balk, zodat je er zo op stapt
        y: bovenste.y + 10,
        z: 2,
        laag: 2,                 // zo laag dat je er gewoon op kunt lopen
        hoog: bovenste.z,
        breedte: 96,
        diepte: 58,
      };

      // Het bordje dat naar de lift wijst
      bordje = { x: lift.x + 80, y: lift.y + 96 };

      // Op elke balk ligt een munt, dus klimmen levert iets op
      for (const balk of balken) {
        munten.push({ x: balk.x, y: balk.y, hoogte: balk.z + 10, fase: balk.z, gepakt: false });
      }

      // Het hunebed: een rij dikke stenen met een deksteen erop. Hier zetten
      // de jagers je in als ze je pakken.
      hunebed = {
        x: 400 + t() * (wereld.breedte - 800),
        y: Math.min(h - 240, grondhoogte + 110 + t() * 60),
      };
      if (Math.abs(hunebed.x - wereld.breedte / 2) < 450) {
        // Te dicht bij de startplek: een stuk opzij, maar wel binnen de wereld
        hunebed.x += hunebed.x < wereld.breedte / 2 ? -800 : 800;
      }

      // Twee bewakers, links en rechts van de ingang. Ze blijven bij het hunebed
      // staan en pakken je als je ze aanraakt. Versla ze allebei en je bent vrij.
      bewakers = [];
      for (const kant of [-1, 1]) {
        bewakers.push({
          x: hunebed.x + kant * 95,
          y: hunebed.y + 104,
          kijktRechts: kant < 0,
          leven: 2,
          schrik: 0,          // kort rood als hij geraakt is
          verslagen: false,
          valTijd: 0,         // omvallen duurt even
          wieg: kant * 2,
        });
      }

      // Mensen met honden. Ze lopen rond tot ze je zien, dan gaan ze jagen.
      jagers = [];
      const aantalJagers = Math.min(5, 2 + Math.floor(level / 2));
      for (let i = 0; i < aantalJagers; i++) {
        const jx = 400 + t() * (wereld.breedte - 800);
        if (Math.abs(jx - wereld.breedte / 2) < 450) continue;   // niet pal naast de start
        jagers.push({
          x: jx,
          thuis: jx,
          y: grondhoogte + 40 + t() * (h - grondhoogte - 60),
          hondX: jx + 40,
          hondY: grondhoogte + 40 + t() * (h - grondhoogte - 60),
          kijktRechts: t() < 0.5,
          hondKijktRechts: true,
          stap: t() * 6.28,
          hondStap: t() * 6.28,
          toestand: 'patrouille',
          bangTijd: 0,
          hondBangTijd: 0,
        });
      }

      // Varens op de voorgrond, ook over de hele wereld verspreid
      varens = [];
      for (let i = 0; i < Math.round(wereld.breedte / 160); i++) {
        varens.push({
          x: t() * wereld.breedte,
          y: grondhoogte + 30 + t() * (h - grondhoogte - 30),
          grootte: 0.7 + t() * 0.9,
          fase: t() * 6.28,
        });
      }
    }

    // Eén blad: een spitse ovaal met een nerf erin.
    function tekenBlad(lengte, kleur) {
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(lengte * 0.4, lengte * 0.32, lengte, 0);
      ctx.quadraticCurveTo(lengte * 0.4, -lengte * 0.32, 0, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = Math.max(1, lengte * 0.03);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(lengte, 0);
      ctx.stroke();
    }

    // Een achtergrondlaag twee keer naast elkaar tekenen, zodat hij netjes
    // doorloopt terwijl je naar links of rechts loopt. Een kleine factor is
    // ver weg (schuift langzaam), een grote factor is dichtbij.
    function metParallax(factor, tekenLaag) {
      const P = wereld.patroon;
      const schuif = -((((camera.x * factor) % P) + P) % P);
      for (const extra of [0, P]) {
        ctx.save();
        ctx.translate(schuif + extra, 0);
        tekenLaag();
        ctx.restore();
      }
    }

    function tekenJungle(tijd) {
      const b = canvas.width;
      const h = canvas.height;

      if (disco) {
        tekenDiscoLucht(tijd);
      } else {
      // Lucht onder het bladerdek: donker bovenin, lichte nevel bij de horizon
      const lucht = ctx.createLinearGradient(0, 0, 0, grondhoogte);
      lucht.addColorStop(0, '#132a1a');
      lucht.addColorStop(0.3, '#2c5730');
      lucht.addColorStop(0.72, '#6f9c5e');
      lucht.addColorStop(1, '#bfd5a4');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, grondhoogte);

      }

      // De verste bomen, bijna opgelost in de nevel
      metParallax(0.1, function () {
        ctx.fillStyle = 'rgba(120,160,120,0.55)';
        for (const bt of bomenVerst) {
          ctx.beginPath();
          ctx.ellipse(bt.x, grondhoogte - bt.hoogte * 0.45, bt.breedte / 2, bt.hoogte / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Verre boomtoppen, die schuiven het langzaamst mee
      metParallax(0.2, function () {
        ctx.fillStyle = '#2f6336';
        for (const bt of bomenVer) {
          ctx.beginPath();
          ctx.ellipse(bt.x, grondhoogte - bt.hoogte * 0.5, bt.breedte / 2, bt.hoogte / 2, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Zonnestralen die schuin door de bomen vallen, met zachte randen
      ctx.save();
      for (let i = 0; i < 5; i++) {
        const x = ((i * 0.23 + 0.08) * b) - ((camera.x * 0.3) % b) + (i % 2 ? 0 : b * 0.05);
        const straal = ctx.createLinearGradient(x, 0, x + 180, grondhoogte);
        straal.addColorStop(0, 'rgba(255,248,205,0.22)');
        straal.addColorStop(1, 'rgba(255,248,205,0)');
        ctx.fillStyle = straal;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 60, 0);
        ctx.lineTo(x + 250, grondhoogte);
        ctx.lineTo(x + 120, grondhoogte);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Boomstammen met wat groene aanslag
      metParallax(0.5, function () {
        for (const boom of bomen) {
          ctx.fillStyle = boom.kleur;
          ctx.fillRect(boom.x - boom.breedte / 2, 0, boom.breedte, grondhoogte + 10);
          ctx.fillStyle = 'rgba(90,150,70,0.25)';
          ctx.fillRect(boom.x - boom.breedte / 2, 0, boom.breedte * 0.3, grondhoogte + 10);
        }
      });

      // Slingerplanten, ze wiegen zachtjes heen en weer
      metParallax(0.7, function () {
      ctx.strokeStyle = '#2b5c2e';
      for (const liaan of lianen) {
        const zwaai = Math.sin(tijd * liaan.snelheid + liaan.fase) * 12;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(liaan.x, -10);
        ctx.quadraticCurveTo(liaan.x + liaan.bocht + zwaai, liaan.lengte * 0.6, liaan.x + zwaai * 1.5, liaan.lengte);
        ctx.stroke();
        // Blaadje aan het uiteinde
        ctx.save();
        ctx.translate(liaan.x + zwaai * 1.5, liaan.lengte);
        ctx.rotate(1.2 + Math.sin(tijd * liaan.snelheid + liaan.fase) * 0.2);
        tekenBlad(16, '#36713a');
        ctx.restore();
      }
      });

      // Grote bladeren langs de bovenrand
      metParallax(0.85, function () {
        for (const blad of bladeren) {
          ctx.save();
          ctx.translate(blad.x, -6);
          ctx.rotate(1.57 + blad.hoek * 0.4 + Math.sin(tijd * 0.6 + blad.fase) * 0.05);
          tekenBlad(blad.lengte, '#2a6130');
          ctx.restore();
        }
      });

      if (disco) {
        // De bomen worden donkere silhouetten, zoals in een echte zaal
        ctx.fillStyle = 'rgba(12,6,30,0.5)';
        ctx.fillRect(0, 0, b, grondhoogte);
        tekenDansvloer(tijd);
        tekenStruiken(tijd, true);
        tekenDiscobal(tijd);
        return;
      }

      // Bosgrond: vochtige aarde die naar voren toe donkerder wordt
      const grond = ctx.createLinearGradient(0, grondhoogte, 0, h);
      grond.addColorStop(0, '#7d8f52');
      grond.addColorStop(0.25, '#5e6f39');
      grond.addColorStop(1, '#39421f');
      ctx.fillStyle = grond;
      ctx.fillRect(0, grondhoogte, b, h - grondhoogte);

      tekenStruiken(tijd, true);    // de rij struiken langs de horizon
      tekenBosvloer(tijd);
      tekenGras(tijd);
      tekenStruiken(tijd, false);   // losse struiken verder naar voren
    }

    // ---- Het discolevel ----
    // De maat van de muziek: elke tel springt dit getal een hele op.
    function tel(tijd) {
      return tijd * 2;
    }

    // Donkere zaal met zoeklichten die heen en weer zwaaien.
    function tekenDiscoLucht(tijd) {
      const b = canvas.width;
      const klop = Math.abs(Math.sin(tel(tijd) * Math.PI));

      const lucht = ctx.createLinearGradient(0, 0, 0, grondhoogte);
      lucht.addColorStop(0, '#120a22');
      lucht.addColorStop(0.55, '#24104a');
      lucht.addColorStop(1, 'hsl(' + Math.floor(tijd * 60 % 360) + ' 60% ' + (26 + klop * 10) + '%)');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, grondhoogte);

      // Zoeklichten vanaf het plafond
      ctx.save();
      for (let i = 0; i < 5; i++) {
        const hoek = Math.sin(tijd * (0.5 + i * 0.17) + i) * 0.7;
        const top = b * (0.12 + i * 0.19);
        const onder = top + Math.tan(hoek) * grondhoogte;
        const kleur = 'hsl(' + Math.floor((tijd * 90 + i * 72) % 360) + ' 95% 60%)';
        const straal = ctx.createLinearGradient(top, 0, onder, grondhoogte);
        straal.addColorStop(0, kleur);
        straal.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.3 + klop * 0.2;
        ctx.fillStyle = straal;
        ctx.beginPath();
        ctx.moveTo(top - 18, 0);
        ctx.lineTo(top + 18, 0);
        ctx.lineTo(onder + 150, grondhoogte);
        ctx.lineTo(onder - 150, grondhoogte);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // De bosgrond is een dansvloer van gekleurde vakken die op de maat wisselen.
    function tekenDansvloer(tijd) {
      const b = canvas.width;
      const h = canvas.height;
      const beat = Math.floor(tel(tijd));
      const kleuren = ['#ff3d7f', '#ffd23d', '#3dffb0', '#3d9bff', '#c43dff', '#ff8a3d'];

      ctx.save();
      const vakB = 78;
      const vakH = 44;
      const eerste = Math.floor(camera.x / vakB) * vakB;
      for (let wx = eerste; wx < camera.x + b + vakB; wx += vakB) {
        for (let y = grondhoogte; y < h; y += vakH) {
          const kol = Math.floor(wx / vakB);
          const rij = Math.floor((y - grondhoogte) / vakH);
          const kleur = kleuren[(kol + rij * 2 + beat) % kleuren.length];
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = kleur;
          ctx.fillRect(wx - camera.x, y, vakB - 2, vakH - 2);
          // Glans op het vak
          ctx.globalAlpha = 0.18;
          ctx.fillStyle = '#fff';
          ctx.fillRect(wx - camera.x, y, vakB - 2, (vakH - 2) / 3);
        }
      }
      ctx.restore();
    }

    // De discobal hangt midden boven de dansvloer en draait rond.
    function tekenDiscobal(tijd) {
      const x = canvas.width / 2;
      const y = 86;
      const r = 40;
      const draai = tijd * 1.2;

      // Ketting naar het plafond
      ctx.strokeStyle = '#8a8c84';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, y - r);
      ctx.stroke();

      // Lichtstralen die met de bal meedraaien
      ctx.save();
      ctx.globalAlpha = 0.22;
      for (let i = 0; i < 12; i++) {
        const hoek = draai + (i / 12) * Math.PI * 2;
        ctx.fillStyle = 'hsl(' + Math.floor((i * 30 + tijd * 60) % 360) + ' 95% 65%)';
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + Math.cos(hoek) * 1400, y + Math.abs(Math.sin(hoek)) * 900);
        ctx.lineTo(x + Math.cos(hoek + 0.08) * 1400, y + Math.abs(Math.sin(hoek + 0.08)) * 900);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // De bal zelf
      ctx.fillStyle = '#9aa3b0';
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      // Spiegeltjes
      for (let rij = -3; rij <= 3; rij++) {
        for (let kol = -4; kol <= 4; kol++) {
          const hoek = draai + kol * 0.38;
          const px = x + Math.sin(hoek) * r * 0.86 * Math.cos(rij * 0.38);
          const py = y + Math.sin(rij * 0.38) * r * 0.86;
          if (Math.cos(hoek) < 0) continue;
          const licht = 40 + Math.cos(hoek) * 45;
          ctx.fillStyle = 'hsl(' + Math.floor((kol * 24 + rij * 12 + tijd * 90) % 360) + ' 70% ' + licht + '%)';
          ctx.fillRect(px - 4, py - 3.5, 8, 7);
        }
      }
      // Glanslichtje
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.beginPath();
      ctx.ellipse(x - 12, y - 16, 8, 5, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Blaadjes, takjes, steentjes, plekken aarde en zonnevlekken op de grond.
    function tekenBosvloer(tijd) {
      const bladkleuren = ['#5e7a34', '#7d6b2c', '#8a5a2e', '#3f5a28'];
      ctx.save();
      for (const d of bosvloer) {
        const x = d.x - camera.x;
        if (x < -40 || x > canvas.width + 40) continue;
        // Verder weg is kleiner
        const diep = 0.45 + ((d.y - grondhoogte) / Math.max(1, canvas.height - grondhoogte)) * 0.9;
        const m = d.maat * diep;

        if (d.soort === 'licht') {
          // Zonnevlek die zachtjes beweegt als de bladeren wiegen
          ctx.globalAlpha = 0.13 + Math.sin(tijd * 0.7 + d.fase) * 0.05;
          ctx.fillStyle = '#fff6c8';
          ctx.beginPath();
          ctx.ellipse(x + Math.sin(tijd * 0.4 + d.fase) * 6, d.y, 34 * m, 13 * m, d.hoek, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.soort === 'plek') {
          // Donkere plek vochtige aarde
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = '#2f3a1c';
          ctx.beginPath();
          ctx.ellipse(x, d.y, 30 * m, 11 * m, d.hoek, 0, Math.PI * 2);
          ctx.fill();
        } else if (d.soort === 'takje') {
          ctx.globalAlpha = 0.85;
          ctx.strokeStyle = '#4a3a24';
          ctx.lineWidth = 1.6 * m;
          ctx.beginPath();
          ctx.moveTo(x - 9 * m, d.y);
          ctx.quadraticCurveTo(x, d.y - 3 * m, x + 10 * m, d.y + 1 * m);
          ctx.stroke();
        } else if (d.soort === 'steentje') {
          ctx.globalAlpha = 0.8;
          ctx.fillStyle = '#8a8c84';
          ctx.beginPath();
          ctx.ellipse(x, d.y, 3.2 * m, 2.2 * m, d.hoek, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Afgevallen blad
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = bladkleuren[d.tint];
          ctx.save();
          ctx.translate(x, d.y);
          ctx.rotate(d.hoek);
          ctx.beginPath();
          ctx.ellipse(0, 0, 6 * m, 2.6 * m, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // Graspollen in meerdere rijen: verder weg kleiner en blauwer.
    function tekenGras(tijd) {
      ctx.save();
      for (const rij of [0, 1, 2, 3]) {
        const y = grondhoogte + 4 + rij * rij * 34;
        if (y > canvas.height) break;
        const m = 0.6 + rij * 0.38;
        ctx.strokeStyle = ['#8aa857', '#7fa348', '#6d913c', '#5d7d33'][rij];
        ctx.lineWidth = 1.6 * m;
        const stap = 9 + rij * 3;
        const eerste = Math.floor(camera.x / stap) * stap;
        for (let wx = eerste; wx < camera.x + canvas.width + stap; wx += stap) {
          const x = wx - camera.x;
          const hoog = (7 + ((Math.abs(wx) * 7) % 9)) * m;
          const wieg = Math.sin(tijd * 0.9 + wx * 0.05) * 1.6 * m;
          ctx.beginPath();
          ctx.moveTo(x, y + 2);
          ctx.quadraticCurveTo(x + wieg, y - hoog * 0.6, x + 2.5 * m + wieg * 1.6, y - hoog);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    // Een struik: een bosje overlappende bladmassa's, soms met bloemetjes.
    function tekenStruiken(tijd, achteraan) {
      for (const st of struiken) {
        if (st.y < grondhoogte + 28 !== achteraan) continue;
        const x = st.x - camera.x;
        if (x < -90 || x > canvas.width + 90) continue;
        const wieg = Math.sin(tijd * 0.8 + st.fase) * 2;
        ctx.save();
        ctx.translate(x + wieg, st.y);
        ctx.scale(st.maat, st.maat);

        // Schaduw onder de struik
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath();
        ctx.ellipse(0, 2, 42, 8, 0, 0, Math.PI * 2);
        ctx.fill();

        // Bladmassa
        const donker = st.donker ? '#24501f' : '#2e5d26';
        const licht = st.donker ? '#3a6b2c' : '#477d33';
        for (const [bx, by, br] of [[-26, -14, 20], [0, -24, 26], [24, -15, 19], [-12, -8, 16], [13, -7, 15]]) {
          ctx.fillStyle = donker;
          ctx.beginPath();
          ctx.ellipse(bx, by, br, br * 0.78, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Licht van bovenaf
        ctx.fillStyle = licht;
        for (const [bx, by, br] of [[-4, -32, 15], [18, -22, 11], [-22, -22, 10]]) {
          ctx.beginPath();
          ctx.ellipse(bx, by, br, br * 0.6, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        // Bloemetjes
        if (st.bloemen) {
          ctx.fillStyle = '#f0e2a8';
          for (const [bx, by] of [[-16, -26], [6, -36], [20, -24], [-2, -18]]) {
            ctx.beginPath();
            ctx.arc(bx, by, 2.6, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    // Tekent één obstakel met (0, 0) op de grond, in zijn eigen kleine maten.
    function tekenObstakel(o) {
      if (o.soort === 'steen') {
        // Schaduw op de grond
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 26, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.scale(1, o.hoog);
        // Keien
        ctx.fillStyle = '#7d7f78';
        ctx.beginPath();
        ctx.ellipse(0, -14, 24, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#95978f';
        ctx.beginPath();
        ctx.ellipse(-5, -19, 15, 11, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#6a6c66';
        ctx.beginPath();
        ctx.ellipse(13, -8, 9, 7, 0.3, 0, Math.PI * 2);
        ctx.fill();
        // Mosje erop
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(-9, -27, 7, 3, -0.3, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.soort === 'boomstam') {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 54, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.scale(1, o.hoog);
        // Liggende stam
        ctx.fillStyle = '#5a3f28';
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(-50, -20, 100, 20, 9) : ctx.rect(-50, -20, 100, 20);
        ctx.fill();
        // Lichte bovenkant
        ctx.fillStyle = '#6d4e32';
        ctx.fillRect(-48, -19, 96, 6);
        // Jaarringen aan de kop
        ctx.fillStyle = '#8a6440';
        ctx.beginPath();
        ctx.ellipse(-50, -10, 6, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6d4e32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(-50, -10, 3, 5, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Mos op de stam
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(10, -21, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 24, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.scale(1, o.hoog);
        // Wortels
        ctx.fillStyle = '#4a3524';
        for (const wx of [-18, -9, 9, 18]) {
          ctx.beginPath();
          ctx.moveTo(wx, 2);
          ctx.lineTo(wx * 0.4, -14);
          ctx.lineTo(wx * 0.9, -14);
          ctx.closePath();
          ctx.fill();
        }
        // Stronk
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(-13, -34, 26, 34);
        // Zaagvlak bovenop
        ctx.fillStyle = '#8a6440';
        ctx.beginPath();
        ctx.ellipse(0, -34, 13, 5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#6d4e32';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, -34, 7, 2.5, 0, 0, Math.PI * 2);
        ctx.stroke();
        // Plantje erop
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(6, -37, 7, 3, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Een houten balk die in de lucht hangt, met (0, 0) op de grond eronder.
    function tekenBalk(balk) {
      const b = balk.breedte;
      const d = balk.diepte;

      // Schaduw op de bosgrond, vager als de balk hoger hangt
      ctx.save();
      ctx.globalAlpha = Math.max(0.08, 0.3 - balk.z / 900);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, 0, b / 2, d / 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(0, -balk.z);

      // Twee palen die de balk omhoog houden
      ctx.fillStyle = '#4a3524';
      ctx.fillRect(-b / 2 + 10, 0, 9, balk.z);
      ctx.fillRect(b / 2 - 19, 0, 9, balk.z);

      // Zijkant van de balk
      ctx.fillStyle = '#6d4e32';
      ctx.fillRect(-b / 2, -4, b, 14);
      // Bovenkant waar je op staat
      ctx.fillStyle = '#8a6440';
      ctx.beginPath();
      ctx.ellipse(0, -4, b / 2, d / 3, 0, 0, Math.PI * 2);
      ctx.fill();
      // Plankjes op de bovenkant
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * (b / 6), -4 - d / 3.4);
        ctx.lineTo(i * (b / 6), -4 + d / 3.4);
        ctx.stroke();
      }
      // Mosje op de rand
      ctx.fillStyle = '#4e7f3c';
      ctx.beginPath();
      ctx.ellipse(-b / 4, 8, 12, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // De houten lift: een platform aan twee touwen, met (0, 0) op de grond eronder.
    function tekenLift(tijd) {
      const b = lift.breedte;
      const d = lift.diepte;

      // Schaduw van het platform op de grond
      ctx.save();
      ctx.globalAlpha = Math.max(0.08, 0.3 - lift.z / 900);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(0, 0, b / 2, d / 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Twee staande palen met bovenop een katrol
      ctx.fillStyle = '#4a3524';
      ctx.fillRect(-b / 2 - 6, -lift.hoog - 40, 8, lift.hoog + 40);
      ctx.fillRect(b / 2 - 2, -lift.hoog - 40, 8, lift.hoog + 40);
      // Dwarsbalk bovenaan
      ctx.fillStyle = '#5a3f28';
      ctx.fillRect(-b / 2 - 10, -lift.hoog - 48, b + 20, 10);
      // Katrollen
      ctx.fillStyle = '#8a6440';
      for (const px of [-b / 2 + 4, b / 2 - 4]) {
        ctx.beginPath();
        ctx.arc(px, -lift.hoog - 38, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5a3f28';
        ctx.beginPath();
        ctx.arc(px, -lift.hoog - 38, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#8a6440';
      }

      // Touwen van de katrollen naar het platform
      ctx.strokeStyle = '#d6c89a';
      ctx.lineWidth = 2;
      for (const px of [-b / 2 + 4, b / 2 - 4]) {
        ctx.beginPath();
        ctx.moveTo(px, -lift.hoog - 38);
        ctx.lineTo(px, -lift.z - 6);
        ctx.stroke();
      }

      // Het platform zelf
      ctx.save();
      ctx.translate(0, -lift.z);
      ctx.fillStyle = '#6d4e32';
      ctx.fillRect(-b / 2, -5, b, 13);
      ctx.fillStyle = '#8a6440';
      ctx.beginPath();
      ctx.ellipse(0, -5, b / 2, d / 3, 0, 0, Math.PI * 2);
      ctx.fill();
      // Planken
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 2;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * (b / 6), -5 - d / 3.4);
        ctx.lineTo(i * (b / 6), -5 + d / 3.4);
        ctx.stroke();
      }
      // Touw om de rand, net als bij een echte vlonder
      ctx.strokeStyle = '#d6c89a';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(0, -5, b / 2 - 2, d / 3 - 1, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Het bordje dat naar de lift wijst.
    function tekenBordje() {
      // Schaduw
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 20, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Twee stokken
      ctx.fillStyle = '#5a3f28';
      ctx.fillRect(-13, -26, 4, 26);
      ctx.fillRect(9, -26, 4, 26);

      // De plank
      ctx.fillStyle = '#8a6440';
      ctx.beginPath();
      ctx.moveTo(-24, -48);
      ctx.lineTo(24, -46);
      ctx.lineTo(24, -24);
      ctx.lineTo(-24, -26);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#5a3f28';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // De tekst, er met een steen in gekrast
      ctx.fillStyle = '#4a3524';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('NOOBS', 0, -40);
      // Pijl naar de lift
      ctx.fillText('\u2191', 0, -30);

      // Spijkertjes
      ctx.fillStyle = '#6a6c66';
      for (const [nx, ny] of [[-19, -42], [19, -40], [-19, -29], [19, -27]]) {
        ctx.beginPath();
        ctx.arc(nx, ny, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // De grot in de rotswand bovenaan de balken.
    function tekenGrot(tijd) {
      ctx.save();
      ctx.translate(grot.x, grot.y - grot.z);

      // Rotswand
      ctx.fillStyle = '#6a6c66';
      ctx.beginPath();
      ctx.moveTo(-90, 30);
      ctx.lineTo(-70, -80);
      ctx.lineTo(-20, -120);
      ctx.lineTo(50, -110);
      ctx.lineTo(85, -40);
      ctx.lineTo(80, 30);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#7d7f78';
      ctx.beginPath();
      ctx.moveTo(-70, -80);
      ctx.lineTo(-20, -120);
      ctx.lineTo(20, -95);
      ctx.lineTo(-45, -55);
      ctx.closePath();
      ctx.fill();

      // De donkere opening
      ctx.fillStyle = '#17120f';
      ctx.beginPath();
      ctx.moveTo(-34, 26);
      ctx.quadraticCurveTo(-34, -46, 0, -46);
      ctx.quadraticCurveTo(34, -46, 34, 26);
      ctx.closePath();
      ctx.fill();

      // Zacht licht in de opening, het klopt een beetje
      ctx.save();
      ctx.globalAlpha = 0.18 + Math.sin(tijd * 2) * 0.07;
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath();
      ctx.ellipse(0, 4, 20, 26, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Druipstenen boven de ingang
      ctx.fillStyle = '#5d5f59';
      for (const dx of [-22, -8, 8, 22]) {
        ctx.beginPath();
        ctx.moveTo(dx - 4, -40);
        ctx.lineTo(dx, -26);
        ctx.lineTo(dx + 4, -40);
        ctx.closePath();
        ctx.fill();
      }

      // Bordje met het volgende level
      ctx.fillStyle = '#f6c62e';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('level ' + (level + 1), 0, -62);
      ctx.restore();
    }

    // Een jager: een mens in een vacht met een net in zijn hand.
    // (0, 0) staat bij zijn voeten, hij kijkt naar rechts.
    function tekenJager(jager) {
      const rent = jager.toestand !== 'patrouille';
      const zwaai = Math.sin(jager.stap) * (rent ? 6 : 3);
      const zwaai2 = -zwaai;

      // Benen
      ctx.fillStyle = '#9b6b43';
      ctx.fillRect(-5 + zwaai, -14, 4.5, 14);
      ctx.fillRect(1 + zwaai2, -14, 4.5, 14);
      // Voeten
      ctx.fillStyle = '#4a3524';
      ctx.fillRect(-6 + zwaai, -2, 7, 2.5);
      ctx.fillRect(0 + zwaai2, -2, 7, 2.5);

      // Vacht als kleding
      ctx.fillStyle = '#8a5a34';
      ctx.beginPath();
      ctx.moveTo(-7, -14);
      ctx.lineTo(-6, -31);
      ctx.lineTo(7, -31);
      ctx.lineTo(8, -14);
      ctx.closePath();
      ctx.fill();
      // Lichtere vlek op de vacht
      ctx.fillStyle = '#a9743f';
      ctx.beginPath();
      ctx.ellipse(1, -22, 4, 5, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Arm met het net
      ctx.strokeStyle = '#9b6b43';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(5, -28);
      ctx.lineTo(13, -24 + Math.sin(jager.stap) * 2);
      ctx.stroke();

      // Net: een rondje met kruisjes erin
      ctx.strokeStyle = '#e4ddc8';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(17, -24, 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(12, -24); ctx.lineTo(22, -24);
      ctx.moveTo(17, -29); ctx.lineTo(17, -19);
      ctx.stroke();

      // Hoofd
      ctx.fillStyle = '#d9a071';
      ctx.beginPath();
      ctx.arc(1, -36, 6, 0, Math.PI * 2);
      ctx.fill();
      // Haar
      ctx.fillStyle = '#3a2a1c';
      ctx.beginPath();
      ctx.arc(1, -38, 6.2, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillRect(-5.5, -38, 3, 4);
      // Oog
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(4, -36, 1.1, 0, Math.PI * 2);
      ctx.fill();

      // Uitroepteken als hij je in de gaten heeft
      if (jager.toestand === 'jacht') {
        ctx.fillStyle = '#ff5a3c';
        ctx.fillRect(0, -54, 3, 8);
        ctx.fillRect(0, -44, 3, 3);
      } else if (jager.toestand === 'bang') {
        ctx.fillStyle = '#9fd8ff';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('!?', 1, -46);
      }
    }

    // Een hond, (0, 0) bij zijn pootjes, kijkt naar rechts.
    function tekenHond(jager) {
      const zwaai = Math.sin(jager.hondStap) * 3;

      // Pootjes
      ctx.fillStyle = '#6b4a2c';
      ctx.fillRect(-7 + zwaai, -7, 3, 7);
      ctx.fillRect(-2 - zwaai, -7, 3, 7);
      ctx.fillRect(3 + zwaai, -7, 3, 7);
      ctx.fillRect(7 - zwaai, -7, 3, 7);

      // Staart
      ctx.strokeStyle = '#7d5634';
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(-8, -12);
      ctx.quadraticCurveTo(-14, -16, -11, -20);
      ctx.stroke();

      // Lijf
      ctx.fillStyle = '#7d5634';
      ctx.beginPath();
      ctx.ellipse(0, -11, 10, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Kop
      ctx.beginPath();
      ctx.ellipse(10, -15, 5.5, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Snuit
      ctx.fillStyle = '#6b4a2c';
      ctx.beginPath();
      ctx.ellipse(15, -14, 3, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();
      // Oor
      ctx.fillStyle = '#5c3f26';
      ctx.beginPath();
      ctx.moveTo(7, -19);
      ctx.lineTo(10, -24);
      ctx.lineTo(12, -18);
      ctx.closePath();
      ctx.fill();
      // Oog
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(11.5, -16, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Het hunebed: een grote kamer van staande stenen met platte dekstenen erop.
    // Aan de voorkant zit een opening waar je naar binnen kunt lopen.
    // Eén staande steen, met (0, 0) onderaan in het midden.
    function tekenStaandeSteen(breed, hoog, licht) {
      ctx.fillStyle = licht ? '#8b8d85' : '#6a6c66';
      ctx.beginPath();
      ctx.moveTo(-breed / 2, 8);
      ctx.lineTo(-breed / 2 - 3, -hoog + 6);
      ctx.lineTo(breed / 2 - 2, -hoog);
      ctx.lineTo(breed / 2 + 2, 8);
      ctx.closePath();
      ctx.fill();
      // Lichte kant
      ctx.fillStyle = licht ? '#9a9c94' : '#7d7f78';
      ctx.beginPath();
      ctx.moveTo(-breed / 2, 8);
      ctx.lineTo(-breed / 2 - 3, -hoog + 6);
      ctx.lineTo(-breed / 6, -hoog + 3);
      ctx.lineTo(-breed / 6, 8);
      ctx.closePath();
      ctx.fill();
    }

    function tekenHunebed(voorkant) {
      const B = HB.halfBreed;

      if (!voorkant) {
        // Schaduw van het hele bouwwerk op de bosgrond
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.ellipse(0, HB.voor / 2, B + 14, (HB.voor - HB.achter) / 2 + 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // De donkere vloer binnen het hunebed
        ctx.fillStyle = '#2a2721';
        ctx.beginPath();
        ctx.ellipse(0, (HB.achter + HB.voor) / 2, B - 20, (HB.voor - HB.achter) / 2, 0, 0, Math.PI * 2);
        ctx.fill();

        // Achterwand: een rij dikke stenen
        ctx.save();
        ctx.translate(0, HB.achter);
        for (const dx of [-130, -65, 0, 65, 130]) {
          ctx.save();
          ctx.translate(dx, 0);
          tekenStaandeSteen(62, 150 + (dx % 3 === 0 ? 10 : 0), dx === -65 || dx === 65);
          ctx.restore();
        }
        ctx.restore();

        // Dekstenen op de achterwand
        ctx.save();
        ctx.translate(0, HB.achter - 150);
        ctx.fillStyle = '#9a9c94';
        ctx.beginPath();
        ctx.moveTo(-B - 6, 16);
        ctx.lineTo(-B + 10, -22);
        ctx.lineTo(B - 6, -20);
        ctx.lineTo(B + 8, 18);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#aeb0a8';
        ctx.beginPath();
        ctx.moveTo(-B + 10, -22);
        ctx.lineTo(B - 6, -20);
        ctx.lineTo(B - 24, -4);
        ctx.lineTo(-B + 26, -6);
        ctx.closePath();
        ctx.fill();
        // Mos op de deksteen
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(-40, -12, 34, 6, 0.02, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Zijwanden: stenen langs de linker- en rechterkant
        for (const kant of [-1, 1]) {
          for (const dy of [10, 55]) {
            ctx.save();
            ctx.translate(kant * (B - 18), HB.achter + dy);
            tekenStaandeSteen(50, 128, dy === 55);
            ctx.restore();
          }
        }
      } else {
        // De voorkant: twee brede stenen met de ingang ertussen
        for (const kant of [-1, 1]) {
          ctx.save();
          ctx.translate(kant * (HB.poort + 52), HB.voor);
          tekenStaandeSteen(104, 132, kant > 0);
          ctx.restore();
        }
        // Mosje onderaan
        ctx.fillStyle = '#4e7f3c';
        ctx.beginPath();
        ctx.ellipse(-HB.poort - 52, HB.voor + 4, 40, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Zit je erin? Dan rollen ze een grote steen voor de opening.
        if (gevangen) {
          ctx.save();
          ctx.translate(0, HB.voor - 4);
          ctx.fillStyle = 'rgba(0,0,0,0.3)';
          ctx.beginPath();
          ctx.ellipse(0, 10, 56, 12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#7d7f78';
          ctx.beginPath();
          ctx.arc(0, -40, 52, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#95978f';
          ctx.beginPath();
          ctx.arc(-16, -52, 26, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#4e7f3c';
          ctx.beginPath();
          ctx.ellipse(22, -62, 16, 6, -0.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // Een bewaker: groter dan een gewone jager, met een speer in zijn hand.
    function tekenBewaker(bewaker, tijd) {
      ctx.save();
      // Omgevallen bewaker kantelt en verdwijnt langzaam
      if (bewaker.verslagen) {
        const f = 1 - bewaker.valTijd;
        ctx.globalAlpha = Math.max(0, bewaker.valTijd);
        ctx.translate(0, -2);
        ctx.rotate(f * 1.5);
      } else {
        ctx.rotate(Math.sin(tijd * 1.6 + bewaker.wieg) * 0.03);
      }

      const geraakt = bewaker.schrik > 0;

      // Benen
      ctx.fillStyle = geraakt ? '#d98a7a' : '#9b6b43';
      ctx.fillRect(-6, -16, 5, 16);
      ctx.fillRect(2, -16, 5, 16);
      ctx.fillStyle = '#4a3524';
      ctx.fillRect(-7, -2.5, 8, 2.8);
      ctx.fillRect(1, -2.5, 8, 2.8);

      // Vacht met een bontrand
      ctx.fillStyle = geraakt ? '#e09a86' : '#6f4a2a';
      ctx.beginPath();
      ctx.moveTo(-9, -16);
      ctx.lineTo(-8, -36);
      ctx.lineTo(9, -36);
      ctx.lineTo(10, -16);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#c8b89a';
      ctx.fillRect(-9, -36, 19, 4);

      // Hoofd met helm van bot
      ctx.fillStyle = '#d9a071';
      ctx.beginPath();
      ctx.arc(1, -42, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e8e0cf';
      ctx.beginPath();
      ctx.arc(1, -44, 7, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(4.5, -42, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Speer rechtop in zijn hand
      ctx.save();
      ctx.translate(11, -30);
      ctx.rotate(-1.35);
      tekenWapen({ soort: 'speer' });
      ctx.restore();

      // Hoeveel klappen hij nog kan hebben
      if (!bewaker.verslagen) {
        for (let i = 0; i < bewaker.leven; i++) {
          ctx.fillStyle = '#ff5a3c';
          ctx.beginPath();
          ctx.arc(-4 + i * 8, -56, 2.6, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Een wapen, met (0, 0) bij de hand en de punt naar rechts.
    function tekenWapen(w) {
      if (w.soort === 'speer') {
        // Houten steel
        ctx.fillStyle = '#8a6440';
        ctx.fillRect(-12, -1.1, 34, 2.2);
        // Touwtje waarmee de punt vastzit
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(19, -1.6, 3, 3.2);
        // Stenen punt
        ctx.fillStyle = '#d8d3c4';
        ctx.beginPath();
        ctx.moveTo(22, -3.4);
        ctx.lineTo(31, 0);
        ctx.lineTo(22, 3.4);
        ctx.closePath();
        ctx.fill();
      } else if (w.soort === 'bijl') {
        // Steel
        ctx.fillStyle = '#8a6440';
        ctx.fillRect(-10, -1.2, 24, 2.4);
        // Touwtje
        ctx.fillStyle = '#5a3f28';
        ctx.fillRect(9, -2, 3, 4);
        // Stenen blad
        ctx.fillStyle = '#9a9c94';
        ctx.beginPath();
        ctx.moveTo(11, -7);
        ctx.lineTo(19, -4.5);
        ctx.lineTo(19, 4.5);
        ctx.lineTo(11, 7);
        ctx.closePath();
        ctx.fill();
        // Geslepen snede
        ctx.fillStyle = '#d8d3c4';
        ctx.beginPath();
        ctx.moveTo(17, -4.8);
        ctx.lineTo(20, -3.5);
        ctx.lineTo(20, 3.5);
        ctx.lineTo(17, 4.8);
        ctx.closePath();
        ctx.fill();
      } else {
        // Boog: een gebogen tak met een pees
        ctx.strokeStyle = '#8a6440';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.arc(2, 0, 11, -1.9, 1.9);
        ctx.stroke();
        ctx.strokeStyle = '#e4ddc8';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(-1.5, -10.4);
        ctx.lineTo(-1.5, 10.4);
        ctx.stroke();
        // Pijl op de pees
        tekenPijl();
      }
    }

    // Een pijl, punt naar rechts, met (0, 0) halverwege de schacht.
    function tekenPijl() {
      ctx.fillStyle = '#8a6440';
      ctx.fillRect(-11, -0.7, 24, 1.4);
      ctx.fillStyle = '#d8d3c4';
      ctx.beginPath();
      ctx.moveTo(13, -2.4);
      ctx.lineTo(18, 0);
      ctx.lineTo(13, 2.4);
      ctx.closePath();
      ctx.fill();
      // Veertjes achteraan
      ctx.fillStyle = '#e8e0cf';
      ctx.beginPath();
      ctx.moveTo(-11, -0.7);
      ctx.lineTo(-7, -3.2);
      ctx.lineTo(-5, -0.7);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-11, 0.7);
      ctx.lineTo(-7, 3.2);
      ctx.lineTo(-5, 0.7);
      ctx.closePath();
      ctx.fill();
    }

    // Iets dat door de lucht vliegt.
    function tekenSchot(schot) {
      ctx.save();
      ctx.translate(schot.x, schot.y - schot.hoogte);
      ctx.scale(schot.richting * schot.maat, schot.maat);
      if (schot.soort === 'bijl') {
        // Een gegooide bijl tolt rond
        ctx.rotate(schot.draai);
        tekenWapen({ soort: 'bijl' });
      } else if (schot.soort === 'speer') {
        tekenWapen({ soort: 'speer' });
      } else {
        tekenPijl();
      }
      ctx.restore();
    }

    // Stofwolkje waar een speer, bijl of pijl inslaat.
    function tekenPluim(pluim) {
      const f = pluim.leeftijd / 0.4;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - f);
      ctx.fillStyle = '#d9cdb0';
      for (let i = 0; i < 5; i++) {
        const hoek = (i / 5) * Math.PI * 2;
        const r = 4 + f * 16;
        ctx.beginPath();
        ctx.arc(pluim.x + Math.cos(hoek) * r, pluim.y - 20 + Math.sin(hoek) * r * 0.5, 5 - f * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Een munt: een gouden rondje    // Een munt: een gouden rondje dat om zijn as draait en boven de grond zweeft.
    function tekenMunt(munt, tijd) {
      const zweef = Math.sin(tijd * 3 + munt.fase) * 5;
      const draai = Math.cos(tijd * 2.5 + munt.fase);   // van -1 (zijkant) tot 1 (voorkant)
      const breedte = Math.max(2, Math.abs(draai) * 13);

      ctx.save();
      ctx.translate(munt.x, munt.y - (munt.hoogte || 0));

      // Schaduwtje op de grond
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 0, 9, 3, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(0, -22 + zweef);

      // Rand van de munt
      ctx.fillStyle = '#c08a16';
      ctx.beginPath();
      ctx.ellipse(0, 0, breedte, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      // Goud
      ctx.fillStyle = '#f6c62e';
      ctx.beginPath();
      ctx.ellipse(0, 0, breedte * 0.78, 10.5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Glimlichtje, alleen als je de munt van voren ziet
      if (breedte > 7) {
        ctx.fillStyle = '#fff2a8';
        ctx.beginPath();
        ctx.ellipse(-breedte * 0.25, -4, breedte * 0.2, 3.5, -0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Waar de winkelknop en de vakjes in de winkel staan. Zowel het tekenen als
    // het klikken gebruikt deze maten, zo zitten ze altijd op dezelfde plek.
    function winkelIndeling() {
      const knop = { x: canvas.width - 160, y: 20, b: 140, h: 44 };
      const breedte = 440;
      const rijHoogte = 78;
      const x = (canvas.width - breedte) / 2;
      const y = Math.max(20, canvas.height / 2 - (90 + wapens.length * rijHoogte) / 2);
      const rijen = wapens.map(function (g, i) {
        return { g: g, x: x + 16, y: y + 70 + i * rijHoogte, b: breedte - 32, h: rijHoogte - 10 };
      });
      return {
        knop: knop,
        paneel: { x: x, y: y, b: breedte, h: 90 + wapens.length * rijHoogte },
        rijen: rijen,
        sluit: { x: x + breedte - 52, y: y + 14, b: 36, h: 32 },
      };
    }

    function tekenWinkelknop() {
      const k = winkelIndeling().knop;
      ctx.save();
      ctx.fillStyle = 'rgba(20,40,20,0.8)';
      ctx.strokeStyle = '#f6c62e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(k.x, k.y, k.b, k.h, 10);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Winkel (S)', k.x + k.b / 2, k.y + k.h / 2 + 1);
      ctx.restore();
    }

    function tekenWinkel() {
      const w = winkelIndeling();
      ctx.save();

      // Donker vlak over het spel heen
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Paneel
      ctx.fillStyle = '#20331f';
      ctx.strokeStyle = '#f6c62e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(w.paneel.x, w.paneel.y, w.paneel.b, w.paneel.h, 16);
      ctx.fill();
      ctx.stroke();

      // Titel en je munten
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText('Wapenwinkel', w.paneel.x + 20, w.paneel.y + 32);
      ctx.fillStyle = '#f6c62e';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(aantalMunten + ' munten', w.paneel.x + 200, w.paneel.y + 33);

      // Kruisje om te sluiten
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w.sluit.x + 10, w.sluit.y + 9);
      ctx.lineTo(w.sluit.x + 26, w.sluit.y + 23);
      ctx.moveTo(w.sluit.x + 26, w.sluit.y + 9);
      ctx.lineTo(w.sluit.x + 10, w.sluit.y + 23);
      ctx.stroke();

      // Eén rij per wapen
      for (const rij of w.rijen) {
        const g = rij.g;
        const inHanden = gekozenWapen === g;
        ctx.fillStyle = inHanden ? '#2f5a2b' : '#2a4227';
        ctx.strokeStyle = inHanden ? '#8ee06a' : 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(rij.x, rij.y, rij.b, rij.h, 10);
        ctx.fill();
        ctx.stroke();

        // Plaatje van het wapen
        ctx.save();
        ctx.translate(rij.x + 46, rij.y + rij.h / 2);
        ctx.scale(1.7, 1.7);
        tekenWapen(g);
        ctx.restore();

        // Naam
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(g.naam, rij.x + 110, rij.y + rij.h / 2 - 9);

        // Prijs of wat je ermee kunt
        ctx.font = '17px sans-serif';
        if (inHanden) {
          ctx.fillStyle = '#8ee06a';
          ctx.fillText('in je handen, gooi met de spatiebalk', rij.x + 110, rij.y + rij.h / 2 + 13);
        } else if (g.gekocht) {
          ctx.fillStyle = '#cfe6bf';
          ctx.fillText('gekocht, klik om vast te pakken', rij.x + 110, rij.y + rij.h / 2 + 13);
        } else {
          ctx.fillStyle = aantalMunten >= g.prijs ? '#f6c62e' : '#b08a8a';
          ctx.fillText(g.prijs + ' munten', rij.x + 110, rij.y + rij.h / 2 + 13);
        }
      }

      // Uitleg onderaan het paneel
      if (!melding || meldingTijd <= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Pijltjes om te lopen, spatiebalk om te gooien', w.paneel.x + w.paneel.b / 2, w.paneel.y + w.paneel.h - 16);
      }

      // Kort berichtje onderaan
      if (melding && meldingTijd > 0) {
        ctx.fillStyle = '#ffd9a0';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(melding, w.paneel.x + w.paneel.b / 2, w.paneel.y + w.paneel.h - 16);
      }
      ctx.restore();
    }

    // Zit dit punt in dit vakje?
    function inVak(px, py, vak) {
      return px >= vak.x && px <= vak.x + vak.b && py >= vak.y && py <= vak.y + vak.h;
    }

    canvas.addEventListener('mousedown', function (e) {
      const px = e.clientX;
      const py = e.clientY;
      const w = winkelIndeling();

      if (!winkelOpen) {
        if (inVak(px, py, w.knop)) winkelOpen = true;
        return;
      }

      if (inVak(px, py, w.sluit)) { winkelOpen = false; return; }

      for (const rij of w.rijen) {
        if (!inVak(px, py, rij)) continue;
        const g = rij.g;
        if (gekozenWapen === g) {
          gekozenWapen = null;            // weer wegleggen
        } else if (g.gekocht) {
          gekozenWapen = g;               // al gekocht, dus gewoon vastpakken
        } else if (aantalMunten >= g.prijs) {
          aantalMunten -= g.prijs;
          g.gekocht = true;
          gekozenWapen = g;
          melding = g.naam + ' gekocht!';
          meldingTijd = 2;
        } else {
          melding = 'Te weinig munten, zoek er nog ' + (g.prijs - aantalMunten) + '!';
          meldingTijd = 2;
        }
        return;
      }

      // Buiten het paneel geklikt: winkel weer dicht
      if (!inVak(px, py, w.paneel)) winkelOpen = false;
    });

    // Het aantal gepakte munten linksboven in beeld.
    function tekenTeller() {
      ctx.save();
      ctx.translate(26, 34);
      ctx.fillStyle = '#c08a16';
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f6c62e';
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 26px sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(aantalMunten + ' / ' + munten.length, 22, 1);
      ctx.restore();
    }

    // Klein kaartje rechtsonder: de hele jungle in één streep, met de munten
    // die er nog liggen en een stip voor jezelf.
    function tekenKaartje() {
      const b = 240;
      const h = 30;
      const x = canvas.width - b - 20;
      const y = canvas.height - h - 20;
      ctx.save();
      ctx.fillStyle = 'rgba(20,40,20,0.72)';
      ctx.strokeStyle = 'rgba(246,198,46,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y, b, h, 8);
      ctx.fill();
      ctx.stroke();

      // Het stuk jungle dat je nu ziet
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(x + (camera.x / wereld.breedte) * b, y + 3, (canvas.width / wereld.breedte) * b, h - 6);

      // Munten die er nog liggen
      ctx.fillStyle = '#f6c62e';
      for (const munt of munten) {
        if (munt.gepakt) continue;
        ctx.beginPath();
        ctx.arc(x + (munt.x / wereld.breedte) * b, y + h / 2, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      // De jagers
      ctx.fillStyle = '#ff5a3c';
      for (const jager of jagers) {
        ctx.beginPath();
        ctx.arc(x + (jager.x / wereld.breedte) * b, y + h / 2, 2.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Het hunebed
      if (hunebed) {
        ctx.fillStyle = '#b9bbb4';
        ctx.fillRect(x + (hunebed.x / wereld.breedte) * b - 3, y + h / 2 - 3, 6, 6);
      }

      // De grot naar het volgende level
      if (grot) {
        ctx.fillStyle = '#fff2a8';
        ctx.beginPath();
        ctx.arc(x + (grot.x / wereld.breedte) * b, y + 7, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Jijzelf
      ctx.fillStyle = '#8ee06a';
      ctx.beginPath();
      ctx.arc(x + (dino.x / wereld.breedte) * b, y + h / 2, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // De hoogste balk waar je op deze plek op kunt staan, of 0 voor de bosgrond.
    // Sta je op dit moment op het platform van de lift?
    function opLift(x, y, hoogte) {
      if (!lift) return false;
      return Math.abs(x - lift.x) < lift.breedte / 2
        && Math.abs(y - lift.y) < lift.diepte / 2
        && Math.abs(hoogte - lift.z) < 6;
    }

    function vloerOnder(x, y, vanaf) {
      let vloer = 0;
      if (lift && Math.abs(x - lift.x) < lift.breedte / 2
          && Math.abs(y - lift.y) < lift.diepte / 2
          && lift.z <= vanaf + 3) {
        vloer = lift.z;
      }
      for (const balk of balken) {
        if (Math.abs(x - balk.x) > balk.breedte / 2) continue;
        if (Math.abs(y - balk.y) > balk.diepte / 2) continue;
        if (balk.z <= vanaf + 3 && balk.z > vloer) vloer = balk.z;
      }
      return vloer;
    }

    // Zit je in het hunebed? Dan vertellen we wat je moet doen.
    function tekenGevangenTekst() {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.font = 'bold 32px sans-serif';
      ctx.strokeText('Ze hebben je in het hunebed gezet!', canvas.width / 2, 70);
      ctx.fillStyle = '#fff';
      ctx.fillText('Ze hebben je in het hunebed gezet!', canvas.width / 2, 70);

      const over = bewakers.filter(function (b) { return !b.verslagen; }).length;
      ctx.font = 'bold 22px sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeText('Versla de bewakers met de spatiebalk · nog ' + over + ' te gaan',
        canvas.width / 2, 106);
      ctx.fillStyle = '#f6c62e';
      ctx.fillText('Versla de bewakers met de spatiebalk · nog ' + over + ' te gaan',
        canvas.width / 2, 106);
      ctx.restore();
    }

    // Je hebt alle levels gehaald: feesttekst in beeld.
    function tekenGewonnen(tijd) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const hoek = Math.sin(tijd * 3) * 0.03;
      ctx.translate(canvas.width / 2, canvas.height * 0.17);
      ctx.rotate(hoek);
      ctx.font = 'bold 54px sans-serif';
      ctx.lineWidth = 9;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText('GEHAALD!', 0, 0);
      ctx.fillStyle = 'hsl(' + Math.floor(tijd * 180 % 360) + ' 95% 62%)';
      ctx.fillText('GEHAALD!', 0, 0);
      ctx.rotate(-hoek);
      ctx.font = 'bold 22px sans-serif';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.strokeText('alle 30 levels uit · dans lekker door · R om opnieuw te beginnen', 0, 44);
      ctx.fillStyle = '#fff';
      ctx.fillText('alle 30 levels uit · dans lekker door · R om opnieuw te beginnen', 0, 44);
      ctx.restore();
    }

    // Welk level je speelt en welke toetsen er zijn, linksonder in beeld.
    function tekenUitleg() {
      ctx.save();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';

      const boven = 'Level ' + level + ' / ' + AANTAL_LEVELS + (disco ? '  ·  DISCO!' : '');
      ctx.font = 'bold 19px sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeText(boven, 20, canvas.height - 44);
      ctx.fillStyle = '#fff';
      ctx.fillText(boven, 20, canvas.height - 44);

      const onder = 'pijltjes lopen · Z springen · spatie gooien · S winkel · op de balken pakken ze je niet';
      ctx.font = '15px sans-serif';
      ctx.lineWidth = 3.5;
      ctx.strokeText(onder, 20, canvas.height - 22);
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.fillText(onder, 20, canvas.height - 22);
      ctx.restore();
    }

    // Grote tekst als je een level gehaald hebt.
    function tekenLevelTekst() {
      ctx.save();
      ctx.globalAlpha = Math.min(1, levelTekstTijd);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 64px sans-serif';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.strokeText(levelTekst, canvas.width / 2, canvas.height * 0.3);
      ctx.fillStyle = '#f6c62e';
      ctx.fillText(levelTekst, canvas.width / 2, canvas.height * 0.3);
      ctx.restore();
    }

    // Loopt de dino op deze plek tegen een obstakel aan?
    // Staat er een muur van het hunebed op deze plek? De opening in de voorkant
    // is vrij, daar loop je naar binnen. Zit je gevangen, dan zit er een steen voor.
    function inHunebed(x, y) {
      if (!hunebed) return false;
      const dx = x - hunebed.x;
      const dy = y - hunebed.y;
      if (Math.abs(dx) > HB.halfBreed + 10 || dy < HB.achter - 30 || dy > HB.voor + 24) return false;
      // Achterwand
      if (dy < HB.achter + HB.dik) return true;
      // Zijwanden
      if (Math.abs(dx) > HB.halfBreed - HB.dik) return true;
      // Voorkant, behalve de opening in het midden
      if (dy > HB.voor - HB.dik) {
        if (Math.abs(dx) > HB.poort) return true;
        if (gevangen) return true;      // de grote rolsteen voor de opening
      }
      return false;
    }

    // Alleen de stenen, stammen en stronken. Speren en pijlen botsen hierop.
    function botstObstakel(x, y) {
      for (const o of obstakels) {
        const dx = (x - o.x) / (o.rx * o.maat + 12);
        const dy = (y - o.y) / (o.ry * o.maat + 7);
        if (dx * dx + dy * dy < 1) return true;
      }
      return false;
    }

    // Alles waar de dino tegenaan loopt.
    function botst(x, y) {
      return inHunebed(x, y) || botstObstakel(x, y);
    }

    // Nevel over de verte: alles bij de horizon verdwijnt een beetje in de damp.
    function tekenNevel() {
      if (disco) return;   // in de zaal hangt geen bosnevel
      const nevel = ctx.createLinearGradient(0, grondhoogte - 24, 0, grondhoogte + 150);
      nevel.addColorStop(0, 'rgba(206,222,196,0.5)');
      nevel.addColorStop(0.45, 'rgba(206,222,196,0.22)');
      nevel.addColorStop(1, 'rgba(206,222,196,0)');
      ctx.fillStyle = nevel;
      ctx.fillRect(camera.x, grondhoogte - 24, canvas.width, 174);
    }

    // Vlinders die rondjes fladderen boven de bosgrond.
    function tekenVlinders(tijd) {
      for (const v of vlinders) {
        const x = v.x - camera.x + Math.sin(tijd * v.snelheid + v.fase) * 70;
        if (x < -30 || x > canvas.width + 30) continue;
        const y = v.y - v.hoogte + Math.cos(tijd * v.snelheid * 1.7 + v.fase) * 18;
        const klap = Math.abs(Math.sin(tijd * 11 + v.fase));
        ctx.save();
        ctx.translate(v.x + Math.sin(tijd * v.snelheid + v.fase) * 70, y);
        ctx.fillStyle = v.kleur;
        ctx.beginPath();
        ctx.ellipse(-2.5, 0, 3.4, 1 + klap * 3.4, 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(2.5, 0, 3.4, 1 + klap * 3.4, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#4a3a24';
        ctx.fillRect(-0.6, -2, 1.2, 4);
        ctx.restore();
      }
    }

    // Blaadjes die van boven naar beneden dwarrelen.
    function tekenVallend(tijd) {
      for (const bl of vallend) {
        const x = bl.x + Math.sin(tijd * 0.8 + bl.fase) * bl.zwaai;
        if (x - camera.x < -30 || x - camera.x > canvas.width + 30) continue;
        ctx.save();
        ctx.translate(x, bl.y);
        ctx.rotate(tijd * 1.6 + bl.fase);
        ctx.fillStyle = disco
          ? 'hsl(' + Math.floor((bl.fase * 57 + tijd * 120) % 360) + ' 95% 62%)'
          : bl.kleur;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(0, 0, 7 * bl.maat, 3 * bl.maat, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    // De randen van het beeld iets donkerder, dat maakt het rustiger om naar te kijken.
    function tekenRand() {
      const r = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.42,
        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.78);
      r.addColorStop(0, 'rgba(0,0,0,0)');
      r.addColorStop(1, 'rgba(10,20,10,0.42)');
      ctx.fillStyle = r;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // De varens staan vóór de dino, dus die worden ná hem getekend.
    function tekenVoorgrond(tijd) {
      for (const varen of varens) {
        if (varen.x < camera.x - 120 || varen.x > camera.x + canvas.width + 120) continue;
        ctx.save();
        ctx.translate(varen.x, varen.y);
        ctx.scale(varen.grootte, varen.grootte);
        const wieg = Math.sin(tijd * 0.8 + varen.fase) * 0.06;
        for (let i = -3; i <= 3; i++) {
          ctx.save();
          ctx.rotate(-1.57 + i * 0.38 + wieg);
          tekenBlad(46 + Math.abs(3 - Math.abs(i)) * 8, i % 2 === 0 ? '#20491f' : '#2a5c27');
          ctx.restore();
        }
        ctx.restore();
      }
    }

    // De baby dino staat midden op het scherm en wipt zachtjes op en neer.
    const dino = {
      x: 0,              // plek van links naar rechts
      y: 0,              // plek op de bosgrond: lager op het scherm is dichterbij
      tijd: 0,           // loopt door, voor het wippen en knipperen
      stap: 0,           // tikt op bij elke stap, daarmee bewegen de beentjes
      hoogte: 0,         // hoe hoog hij boven de bosgrond zit
      vz: 0,             // hoe snel hij omhoog of omlaag gaat
      opGrond: true,
      netNogGrond: 0,    // kort na het van de balk stappen mag je nog springen
      kijktRechts: true,
      loopt: false,
    };

    // ---- Wapenwinkel ----
    // Drie wapens uit de prehistorie. Je koopt ze met je munten en gooit of
    // schiet ze weg met de spatiebalk.
    const wapens = [
      { naam: 'Speer',        soort: 'speer', prijs: 3,  snelheid: 520, wachttijd: 0.55, gekocht: false },
      { naam: 'Bijl',         soort: 'bijl',  prijs: 6,  snelheid: 430, wachttijd: 0.45, gekocht: false },
      { naam: 'Pijl-en-boog', soort: 'boog',  prijs: 10, snelheid: 720, wachttijd: 0.22, gekocht: false },
    ];
    let schoten = [];      // alles wat er door de lucht vliegt
    let pluimen = [];      // stofwolkjes waar iets inslaat
    let wachtNogOp = 0;    // hoe lang het nog duurt voor je weer mag gooien

    let winkelOpen = false;
    let gekozenWapen = null;   // het wapen dat de dino in zijn handen heeft
    let melding = '';           // kort tekstje in de winkel, bijv. te weinig munten
    let meldingTijd = 0;

    const SNELHEID = 190;      // hoe snel hij loopt, in beeldpunten per seconde
    const SPRONGKRACHT = 660;  // hoe hard hij zich afzet
    const ZWAARTEKRACHT = 1500;

    // Welke pijltjes op dit moment ingedrukt zijn.
    const toetsen = {};
    window.addEventListener('keydown', function (e) {
      if (e.key.startsWith('Arrow')) {
        toetsen[e.key] = true;
        e.preventDefault();   // anders scrollt de pagina mee
      }
      if (e.key === ' ') {
        toetsen[' '] = true;
        e.preventDefault();
      }
      if (e.key.toLowerCase() === 'z') {
        toetsen['z'] = true;
        e.preventDefault();
      }
      if (e.key.toLowerCase() === 'r' && gewonnen) {
        // Opnieuw beginnen, je munten en wapens houd je
        level = 1;
        gewonnen = false;
        gevangen = false;
        schoten = [];
        pluimen = [];
        herbouw();
        dino.x = wereld.breedte / 2;
        dino.y = grondhoogte + 60;
        dino.hoogte = 0;
        dino.vz = 0;
        levelTekst = 'Level 1';
        levelTekstTijd = 2;
      }
      if (e.key === 's' || e.key === 'S') winkelOpen = !winkelOpen;
      if (e.key === 'Escape') winkelOpen = false;
    });
    window.addEventListener('keyup', function (e) {
      toetsen[e.key] = false;
      if (e.key.toLowerCase() === 'z') toetsen['z'] = false;
    });

    // Verder weg op de bosgrond is hij kleiner, dichterbij groter.
    function grootteOpDiepte(y) {
      const diepte = (y - grondhoogte) / Math.max(1, canvas.height - grondhoogte);
      return 2.4 + diepte * 2.2;
    }

    function dinoGrootte() {
      return grootteOpDiepte(dino.y);
    }

    // De jagers zetten je in het hunebed.
    function vangMij() {
      gevangen = true;
      dino.x = hunebed.x;
      dino.y = hunebed.y + 40;
      dino.hoogte = 0;
      dino.vz = 0;
      dino.loopt = false;
      camera.x = Math.max(0, Math.min(wereld.breedte - canvas.width, dino.x - canvas.width / 2));
      // Zonder wapen kun je niets: er ligt een speer van de bewakers in het hunebed.
      if (!gekozenWapen) gekozenWapen = wapens[0];
    }

    // Beide bewakers verslagen: de steen rolt weg en je krijgt een speer.
    function maakVrij() {
      const kreegSpeer = !wapens[0].gekocht;
      wapens[0].gekocht = true;
      if (!gekozenWapen) gekozenWapen = wapens[0];
      if (gevangen) {
        gevangen = false;
        dino.y = Math.min(canvas.height - 10, hunebed.y + HB.voor + 60);
      }
      // De andere jagers schrikken en blijven even weg
      for (const jager of jagers) {
        jager.bangTijd = 4;
        jager.hondBangTijd = 4;
      }
      levelTekst = kreegSpeer ? 'Vrij! Je krijgt een speer!' : 'Vrij!';
      levelTekstTijd = 2.2;
    }

    // De twee bewakers bij de ingang: ze staan te wachten tot je ze aanraakt.
    function werkBewakersBij(dt) {
      for (const bewaker of bewakers) {
        if (bewaker.schrik > 0) bewaker.schrik -= dt;
        if (bewaker.verslagen) {
          bewaker.valTijd -= dt;
          continue;
        }
        // Raak je hem aan, dan pakt hij je
        if (!gevangen && !disco && dino.hoogte < 30
            && Math.abs(dino.x - bewaker.x) < 30 && Math.abs(dino.y - bewaker.y) < 24) {
          vangMij();
          return;
        }
      }

      // Omgevallen bewakers die helemaal weggezakt zijn, halen we weg
      const voor = bewakers.length;
      bewakers = bewakers.filter(function (bewaker) {
        return !bewaker.verslagen || bewaker.valTijd > 0;
      });
      if (bewakers.length === 0 && voor > 0) maakVrij();
    }

    // De mensen en hun honden: rondlopen, jagen of bang weglopen.
    function werkJagersBij(dt) {
      const pakbaar = !disco && !gevangen && dino.hoogte < 30;

      for (const jager of jagers) {
        const dx = dino.x - jager.x;
        const dy = dino.y - jager.y;
        const afstand = Math.hypot(dx, dy * 1.6);

        if (disco) {
          jager.toestand = 'patrouille';   // ze staan te dansen, niet te jagen
        } else if (jager.bangTijd > 0) {
          jager.bangTijd -= dt;
          jager.toestand = 'bang';
        } else if (pakbaar && afstand < 340) {
          jager.toestand = 'jacht';
        } else {
          jager.toestand = 'patrouille';
        }

        // De jager zelf
        let snelheid = 0;
        let richtingX = 0;
        let richtingY = 0;
        if (jager.toestand === 'jacht') {
          snelheid = 120;
          richtingX = dx;
          richtingY = dy;
        } else if (jager.toestand === 'bang') {
          snelheid = 175;
          richtingX = -dx;
          richtingY = -dy;
        } else {
          // Heen en weer bij zijn eigen plekje
          snelheid = 55;
          richtingX = jager.kijktRechts ? 1 : -1;
          richtingY = 0;
          if (Math.abs(jager.x - jager.thuis) > 170) jager.kijktRechts = jager.x < jager.thuis;
        }
        const lengte = Math.hypot(richtingX, richtingY) || 1;
        jager.x += (richtingX / lengte) * snelheid * dt;
        jager.y += (richtingY / lengte) * snelheid * dt;
        if (jager.toestand !== 'patrouille') jager.kijktRechts = richtingX > 0;
        jager.stap += dt * (jager.toestand === 'patrouille' ? 4 : 9);

        // De hond loopt voorop als er gejaagd wordt, anders dicht bij zijn baasje
        let doelX = jager.x - (jager.kijktRechts ? 45 : -45);
        let doelY = jager.y + 14;
        let hondSnelheid = 110;
        if (jager.hondBangTijd > 0) {
          jager.hondBangTijd -= dt;
          doelX = jager.hondX - dx;
          doelY = jager.hondY - dy;
          hondSnelheid = 210;
        } else if (jager.toestand === 'jacht') {
          doelX = dino.x;
          doelY = dino.y;
          hondSnelheid = 185;
        }
        const hdx = doelX - jager.hondX;
        const hdy = doelY - jager.hondY;
        const hl = Math.hypot(hdx, hdy);
        if (hl > 6) {
          jager.hondX += (hdx / hl) * hondSnelheid * dt;
          jager.hondY += (hdy / hl) * hondSnelheid * dt;
          jager.hondKijktRechts = hdx > 0;
          jager.hondStap += dt * 13;
        }

        // Alles blijft netjes op de bosgrond
        jager.y = Math.min(canvas.height - 12, Math.max(grondhoogte + 10, jager.y));
        jager.hondY = Math.min(canvas.height - 8, Math.max(grondhoogte + 8, jager.hondY));

        // Heeft hij je te pakken?
        const raaktJou = pakbaar && jager.bangTijd <= 0
          && Math.abs(dino.x - jager.x) < 30 && Math.abs(dino.y - jager.y) < 24;
        const raaktHond = pakbaar && jager.hondBangTijd <= 0
          && Math.abs(dino.x - jager.hondX) < 26 && Math.abs(dino.y - jager.hondY) < 20;
        if (raaktJou || raaktHond) {
          if (bewakers.length === 0) {
            // Zonder bewakers kan niemand je nog opsluiten, dus ze schrikken alleen
            jager.bangTijd = 2.5;
            jager.hondBangTijd = 2.5;
          } else {
            vangMij();
            return;
          }
        }
      }
    }

    function update(dt) {
      dino.tijd += dt;
      if (meldingTijd > 0) meldingTijd -= dt;
      if (levelTekstTijd > 0) levelTekstTijd -= dt;

      // Met de winkel open loopt de dino niet, dan sta je rustig te kiezen.
      if (winkelOpen) {
        dino.loopt = false;
        return;
      }

      werkBewakersBij(dt);
      if (!gevangen) {
        werkJagersBij(dt);
        if (gevangen) return;
      }

      // Richting bepalen uit de ingedrukte pijltjes
      let dx = 0;
      let dy = 0;
      if (toetsen['ArrowLeft']) dx -= 1;
      if (toetsen['ArrowRight']) dx += 1;
      if (toetsen['ArrowUp']) dy -= 1;
      if (toetsen['ArrowDown']) dy += 1;

      dino.loopt = dx !== 0 || dy !== 0;
      if (dx < 0) dino.kijktRechts = false;
      if (dx > 0) dino.kijktRechts = true;

      if (dino.loopt) {
        // Schuin lopen gaat niet sneller dan rechtdoor
        const lengte = Math.hypot(dx, dy);
        const stapX = (dx / lengte) * SNELHEID * dt;
        const stapY = (dy / lengte) * SNELHEID * dt;
        // Allebei de richtingen los proberen: zo kun je langs een steen schuiven
        // in plaats van er helemaal tegen vast te zitten.
        // Spring je hoog genoeg, dan vlieg je er gewoon over
        const laag = dino.hoogte < 25;
        if (!laag || !botst(dino.x + stapX, dino.y)) dino.x += stapX;
        if (!laag || !botst(dino.x, dino.y + stapY)) dino.y += stapY;
        dino.stap += dt * 9;
      }

      // De lift gaat rustig op en neer. Sta je erop, dan ga je mee naar boven.
      if (lift) {
        const meeOmhoog = opLift(dino.x, dino.y, dino.hoogte) && dino.vz <= 0;
        const golf = 0.5 - 0.5 * Math.cos(dino.tijd * 0.8);
        lift.z = lift.laag + (lift.hoog - lift.laag) * golf;
        if (meeOmhoog) {
          dino.hoogte = lift.z;
          dino.vz = 0;
          dino.opGrond = true;
        }
      }

      // Springen met de Z, en daarna trekt de zwaartekracht hem weer naar beneden.
      // Stap je net van een balk af, dan mag je nog een klein momentje springen.
      if (dino.opGrond) dino.netNogGrond = 0.14;
      else if (dino.netNogGrond > 0) dino.netNogGrond -= dt;
      if (toetsen['z'] && dino.netNogGrond > 0) {
        dino.vz = SPRONGKRACHT;
        dino.opGrond = false;
        dino.netNogGrond = 0;
      }
      const vorigeHoogte = dino.hoogte;
      dino.vz -= ZWAARTEKRACHT * dt;
      dino.hoogte += dino.vz * dt;

      // Landt hij op een balk of op de bosgrond?
      const vloer = vloerOnder(dino.x, dino.y, vorigeHoogte);
      if (dino.hoogte <= vloer) {
        dino.hoogte = vloer;
        dino.vz = 0;
        dino.opGrond = true;
