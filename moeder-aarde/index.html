<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moeder-aarde</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1440; color: #fff; font-family: 'Fredoka', sans-serif; }
    canvas { display: block; background: #1b1440; }
    #info {
      position: fixed; top: 16px; right: 16px; width: min(320px, calc(100vw - 32px)); box-sizing: border-box;
      background: #fff7fb; color: #2a1b4a; border: 4px solid #2a1b4a; border-radius: 24px;
      box-shadow: 0 7px 0 #2a1b4a; padding: 16px 18px 14px; font-family: 'Fredoka', sans-serif;
      animation: plop 0.35s cubic-bezier(.3,1.6,.5,1);
    }
    #info[hidden] { display: none; }
    @keyframes plop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #info h2 { margin: 0 0 4px; font-size: 30px; display: flex; align-items: center; gap: 10px; }
    #info .bol { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2a1b4a; flex: none; }
    #info .melding { margin: 0 0 10px; color: #c2357a; font-size: 17px; }
    #info .melding:empty { display: none; }
    #info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 17px; }
    #info dt { font-weight: 700; }
    #info dd { margin: 0; }
    #info .weetje { margin: 12px 0 0; padding: 10px 12px; background: #fff0a8; border: 3px solid #2a1b4a; border-radius: 16px; font-size: 16px; }
    #uitdagingen {
      position: fixed; top: 16px; left: 16px; width: min(290px, calc(100vw - 32px)); box-sizing: border-box;
      background: #f2fff0; color: #2a1b4a; border: 4px solid #2a1b4a; border-radius: 24px;
      box-shadow: 0 7px 0 #2a1b4a; padding: 14px 16px; font-family: 'Fredoka', sans-serif;
      animation: plop 0.35s cubic-bezier(.3,1.6,.5,1);
    }
    #uitdagingen[hidden] { display: none; }
    #uitdagingen h3 { margin: 0 0 8px; font-size: 22px; }
    #uitdagingen ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    #uitdagingen li { display: flex; gap: 8px; align-items: flex-start; font-size: 17px; line-height: 1.25; }
    #uitdagingen li .vinkje { flex: none; width: 24px; height: 24px; border: 3px solid #2a1b4a; border-radius: 8px; background: #fff; display: grid; place-items: center; font-size: 15px; }
    #uitdagingen li.klaar { color: #3a8a3a; }
    #uitdagingen li.klaar .tekst { text-decoration: line-through; }
    #uitdagingen li.klaar .vinkje { background: #7ddc6a; }
    #uitdagingen .teller { color: #c2357a; font-weight: 700; }
    #uitdagingen .toetsen { margin: 10px 0 0; font-size: 14px; color: #6a5a8a; }
    #uitdagingen .feest { margin: 10px 0 0; padding: 8px 10px; background: #fff0a8; border: 3px solid #2a1b4a; border-radius: 14px; font-size: 16px; font-weight: 700; }
    #uitdagingen .feest:empty { display: none; }
    #sluit {
      position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2a1b4a; background: #ffb3d9; color: #2a1b4a; font: 700 18px 'Fredoka', sans-serif; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="uitdagingen" hidden>
    <h3></h3>
    <ul></ul>
    <p class="feest"></p>
    <p class="toetsen"></p>
  </div>
  <div id="info" hidden>
    <button id="sluit" aria-label="Sluiten">✕</button>
    <h2><span class="bol"></span><span class="naam"></span></h2>
    <p class="melding"></p>
    <dl></dl>
    <p class="weetje"></p>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const schermCtx = canvas.getContext('2d');
    let ctx = schermCtx;   // tijdelijk een ander canvas als we de reis laten in- en uitvagen
    const laag = document.createElement('canvas');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Cartoon-stijl: één donkere lijnkleur voor alle randen
    const LIJN = '#2a1b4a';
    const FONT = "'Fredoka', sans-serif";

    let tijd = 0;
    let gestart = false;   // wordt true na een klik op START
    let muis = { x: -1, y: -1 };

    // Sterren op willekeurige plekken (0 tot 1, zodat ze meeschalen met het venster)
    const sterren = [];
    for (let i = 0; i < 160; i++) {
      sterren.push({
        x: Math.random(), y: Math.random(),
        grootte: Math.random() * 5 + 2,
        fase: Math.random() * Math.PI * 2,
        kleur: ['#fff6a8', '#ffffff', '#ffc8ec', '#b8f0ff'][Math.floor(Math.random() * 4)],
        vorm: Math.random() < 0.35 ? 'ster' : 'stip',
      });
    }

    // Nevels: zachte pastelwolken
    const nevels = [
      { x: 0.15, y: 0.8,  r: 0.35, kleur: '200,120,255' },
      { x: 0.85, y: 0.3,  r: 0.3,  kleur: '110,180,255' },
      { x: 0.7,  y: 0.9,  r: 0.25, kleur: '255,130,200' },
    ];

    // De zon staat in het midden. Afstand en grootte zijn in 'eenheden' (zie eenheid()),
    // niet op echte schaal, anders zou je de kleine planeten niet eens zien.
    const ZON = {
      naam: 'Zon', kleur: '#ffe066', grootte: 0.9, isZon: true,
      info: {
        'Temperatuur': 'ongeveer 5.500 °C aan de buitenkant',
        'Grootte': '1.392.000 km doorsnede',
        'Draait om zich heen in': 'ongeveer 27 dagen',
        'Soort': 'een ster, geen planeet',
      },
      weetje: 'In de zon passen wel 1 miljoen aardes!',
    };

    const planeten = [
      { naam: 'Mercurius', afstand: 1.7, grootte: 0.22, kleur: '#c9bfb5', uiterlijk: 'kraters', hoek: 0.5,
        info: { 'Temperatuur': '-180 °C in de nacht, 430 °C overdag', 'Grootte': '4.879 km doorsnede', 'Afstand tot de zon': '58 miljoen km', 'Een dag duurt': '176 aardse dagen', 'Een jaar duurt': '88 dagen', 'Manen': '0' },
        weetje: 'Mercurius is de kleinste planeet en staat het dichtst bij de zon.' },
      { naam: 'Venus', afstand: 2.35, grootte: 0.36, kleur: '#ffd59a', uiterlijk: 'wolken', hoek: 2.2,
        info: { 'Temperatuur': '465 °C, de heetste planeet!', 'Grootte': '12.104 km doorsnede', 'Afstand tot de zon': '108 miljoen km', 'Een dag duurt': '243 aardse dagen', 'Een jaar duurt': '225 dagen', 'Manen': '0' },
        weetje: 'Op Venus duurt een dag langer dan een jaar. En de zon komt op in het westen!' },
      { naam: 'Aarde', afstand: 3.05, grootte: 0.4, kleur: '#5ec8ff', uiterlijk: 'aarde', hoek: 4.4,
        info: { 'Temperatuur': 'gemiddeld 15 °C', 'Grootte': '12.742 km doorsnede', 'Afstand tot de zon': '150 miljoen km', 'Een dag duurt': '24 uur', 'Een jaar duurt': '365 dagen', 'Manen': '1' },
        weetje: 'De aarde is de enige planeet waarvan we weten dat er leven is. Hier woon jij!' },
      { naam: 'Mars', afstand: 3.75, grootte: 0.29, kleur: '#ff8a65', uiterlijk: 'kraters', hoek: 1.2,
        info: { 'Temperatuur': 'gemiddeld -65 °C', 'Grootte': '6.779 km doorsnede', 'Afstand tot de zon': '228 miljoen km', 'Een dag duurt': '24 uur en 37 minuten', 'Een jaar duurt': '687 dagen', 'Manen': '2' },
        weetje: 'Mars is rood door roest. Er staat de hoogste vulkaan van het zonnestelsel.' },
      { naam: 'Jupiter', afstand: 4.85, grootte: 0.72, kleur: '#ffcf8a', uiterlijk: 'strepen', hoek: 3.4,
        info: { 'Temperatuur': 'ongeveer -110 °C', 'Grootte': '139.820 km doorsnede', 'Afstand tot de zon': '778 miljoen km', 'Een dag duurt': '10 uur', 'Een jaar duurt': '12 jaar', 'Manen': '95' },
        weetje: 'Jupiter is de grootste planeet. De rode vlek is een storm die groter is dan de aarde!' },
      { naam: 'Saturnus', afstand: 5.95, grootte: 0.6, kleur: '#fff0a0', uiterlijk: 'ring', hoek: 5.5,
        info: { 'Temperatuur': 'ongeveer -140 °C', 'Grootte': '116.460 km doorsnede', 'Afstand tot de zon': '1,4 miljard km', 'Een dag duurt': '10,5 uur', 'Een jaar duurt': '29 jaar', 'Manen': '274' },
        weetje: 'Saturnus is zo licht dat hij zou blijven drijven in een heel groot bad water.' },
      { naam: 'Uranus', afstand: 6.95, grootte: 0.46, kleur: '#a6f0ee', uiterlijk: 'schuineRing', hoek: 0.2,
        info: { 'Temperatuur': 'ongeveer -195 °C', 'Grootte': '50.724 km doorsnede', 'Afstand tot de zon': '2,9 miljard km', 'Een dag duurt': '17 uur', 'Een jaar duurt': '84 jaar', 'Manen': '29' },
        weetje: 'Uranus ligt op zijn kant en rolt zo om de zon heen.' },
      { naam: 'Neptunus', afstand: 7.8, grootte: 0.45, kleur: '#6f8cff', uiterlijk: 'wolken', hoek: 2.8,
        info: { 'Temperatuur': 'ongeveer -200 °C', 'Grootte': '49.244 km doorsnede', 'Afstand tot de zon': '4,5 miljard km', 'Een dag duurt': '16 uur', 'Een jaar duurt': '165 jaar', 'Manen': '16' },
        weetje: 'Op Neptunus waait de hardste wind van het zonnestelsel: wel 2.000 km per uur!' },
    ];
    // Hoe verder weg, hoe langzamer een planeet om de zon draait (net als in het echt)
    for (const p of planeten) p.snelheid = 0.25 / Math.pow(p.afstand / 1.7, 1.5);

    const AARDE = planeten[2];
    const MAAN = {
      naam: 'Maan', kleur: '#e8e4f2', grootte: 0.13, uiterlijk: 'kraters', hoek: 0, snelheid: 1, isMaan: true,
      info: { 'Temperatuur': '-170 °C in de nacht, 120 °C overdag', 'Grootte': '3.474 km doorsnede', 'Afstand tot de aarde': '384.000 km', 'Een dag duurt': '29,5 aardse dagen', 'Rondje om de aarde': '27 dagen' },
      weetje: 'In 1969 liepen er voor het eerst mensen op de maan.',
    };
    const lichamen = [ZON, ...planeten, MAAN];

    // Vallende sterren
    const vallendeSterren = [];

    // Het poppetje staat op 'waar' (een planeet of de maan). Tijdens een reis vliegt het van 'van' naar 'naar'.
    const poppetje = { sprong: 0, sprongSnelheid: 0, waar: AARDE, reis: null };
    const REISTIJD = 3.5;   // seconden
    // Sterren die langs je heen suizen als je door de ruimte vliegt (gezien door je eigen ogen)
    const suisSterren = [];
    for (let i = 0; i < 220; i++) {
      suisSterren.push({ hoek: Math.random() * Math.PI * 2, afstand: Math.random(), snelheid: 0.4 + Math.random() * 0.8,
        kleur: ['#fff6a8', '#ffffff', '#ffc8ec', '#b8f0ff'][Math.floor(Math.random() * 4)] });
    }
    const glitters = [];    // sterretjes die het poppetje achterlaat tijdens het vliegen
    let gekozen = null;     // het hemellichaam waarvan je het kaartje ziet
    let kijkModus = 'overzicht';   // 'overzicht' = zonnestelsel van boven, 'landschap' = door je ogen op een planeet

    function update(dt) {
      tijd += dt;
      for (const p of planeten) p.hoek += p.snelheid * dt;
      MAAN.hoek += MAAN.snelheid * dt;

      // Af en toe een nieuwe vallende ster
      if (Math.random() < dt * 0.4) {
        vallendeSterren.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.5, leven: 1 });
      }
      for (const v of vallendeSterren) {
        v.x += 500 * dt;
        v.y += 250 * dt;
        v.leven -= dt;
      }
      for (let i = vallendeSterren.length - 1; i >= 0; i--) {
        if (vallendeSterren[i].leven <= 0) vallendeSterren.splice(i, 1);
      }

      // Reis naar een andere planeet
      if (poppetje.reis) {
        poppetje.reis.t += dt / REISTIJD;
        // Hoe dichter bij, hoe sneller de sterren langs suizen
        for (const st of suisSterren) {
          st.afstand += st.snelheid * dt * (0.6 + poppetje.reis.t * 1.5) * (0.2 + st.afstand);
          if (st.afstand > 1.3) { st.afstand = 0.02; st.hoek = Math.random() * Math.PI * 2; }
        }
        const plek = reisPositie();
        if (Math.random() < 0.8) {
          glitters.push({ x: plek.x + (Math.random() - 0.5) * 10, y: plek.y - Math.random() * 20, leven: 1,
            kleur: ['#fff6a8', '#ff9ad5', '#9ae6ff'][Math.floor(Math.random() * 3)] });
        }
        if (poppetje.reis.t >= 1) {
          poppetje.waar = poppetje.reis.naar;
          poppetje.reis = null;
          // Je blijft op de planeet en kijkt rond
          const l = poppetje.waar;
          gaNaarLandschap(l);
          toonInfo(l, LANDSCHAPPEN[l.naam].gas
            ? l.naam + ' heeft geen vaste grond. Je zweeft boven de wolken!'
            : 'Je bent geland op ' + l.naam + '!');
        }
      }
      for (const g of glitters) { g.leven -= dt * 1.5; g.y += 15 * dt; }
      for (let i = glitters.length - 1; i >= 0; i--) if (glitters[i].leven <= 0) glitters.splice(i, 1);

      updateSpeler(dt);

      // Sprong van het poppetje
      if (poppetje.sprong > 0 || poppetje.sprongSnelheid > 0) {
        poppetje.sprong += poppetje.sprongSnelheid * dt;
        poppetje.sprongSnelheid -= 9 * dt;
        if (poppetje.sprong <= 0) { poppetje.sprong = 0; poppetje.sprongSnelheid = 0; }
      }
    }

    // ---------- hulpjes ----------

    function cirkel(x, y, r, vul, rand) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      if (vul) { ctx.fillStyle = vul; ctx.fill(); }
      if (rand) { ctx.lineWidth = rand; ctx.strokeStyle = LIJN; ctx.stroke(); }
    }

    function sterVorm(x, y, r, punten, binnen) {
      ctx.beginPath();
      for (let i = 0; i < punten * 2; i++) {
        const hoek = -Math.PI / 2 + i * Math.PI / punten;
        const afstand = i % 2 === 0 ? r : r * binnen;
        ctx.lineTo(x + Math.cos(hoek) * afstand, y + Math.sin(hoek) * afstand);
      }
      ctx.closePath();
    }

    // Een schattig gezichtje: ogen met glimmetje, blosjes en een glimlach
    function gezichtje(x, y, r, opties = {}) {
      const knipper = (Math.sin(tijd * 1.3 + (opties.fase || 0)) > 0.985);
      const oogX = r * 0.35, oogY = -r * 0.05, oogR = r * 0.14;
      ctx.lineCap = 'round';

      if (opties.slaperig || knipper) {
        // Dichte oogjes als boogjes
        ctx.strokeStyle = LIJN;
        ctx.lineWidth = Math.max(2, r * 0.07);
        for (const kant of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(x + kant * oogX, y + oogY, oogR * 0.8, Math.PI * 0.15, Math.PI * 0.85);
          ctx.stroke();
        }
      } else if (opties.blij) {
        // ^^ oogjes
        ctx.strokeStyle = LIJN;
        ctx.lineWidth = Math.max(2, r * 0.07);
        for (const kant of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(x + kant * oogX, y + oogY + oogR * 0.5, oogR * 0.8, Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        }
      } else {
        for (const kant of [-1, 1]) {
          cirkel(x + kant * oogX, y + oogY, oogR, LIJN);
          cirkel(x + kant * oogX - oogR * 0.3, y + oogY - oogR * 0.35, oogR * 0.4, '#fff');
        }
      }

      // Blosjes
      ctx.fillStyle = 'rgba(255,110,150,0.55)';
      for (const kant of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(x + kant * r * 0.55, y + r * 0.2, r * 0.14, r * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mondje
      ctx.strokeStyle = LIJN;
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath();
      ctx.arc(x, y + r * 0.15, r * 0.12, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }

    // ---------- ruimte ----------

    function tekenRuimte() {
      const b = canvas.width, h = canvas.height;
      const lucht = ctx.createLinearGradient(0, 0, 0, h);
      lucht.addColorStop(0, '#1b1440');
      lucht.addColorStop(1, '#3a2470');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      // Nevels
      for (const n of nevels) {
        const r = n.r * Math.max(b, h);
        const g = ctx.createRadialGradient(n.x * b, n.y * h, 0, n.x * b, n.y * h, r);
        g.addColorStop(0, 'rgba(' + n.kleur + ',0.3)');
        g.addColorStop(1, 'rgba(' + n.kleur + ',0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, b, h);
      }

      // Twinkelende sterren: stipjes en schattige vijfpuntsterren
      for (const s of sterren) {
        const fel = 0.6 + 0.4 * Math.sin(tijd * 2 + s.fase);
        ctx.globalAlpha = fel;
        ctx.fillStyle = s.kleur;
        if (s.vorm === 'ster') {
          sterVorm(s.x * b, s.y * h, s.grootte * (0.8 + 0.3 * fel), 5, 0.5);
          ctx.fill();
        } else {
          cirkel(s.x * b, s.y * h, s.grootte * 0.35, s.kleur);
        }
      }
      ctx.globalAlpha = 1;

      // Spiraalstelsel als snoepje, draait langzaam
      const gx = b * 0.15, gy = h * 0.2, gr = Math.min(b, h) * 0.1;
      ctx.lineCap = 'round';
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const t = i / 60;
          const hoek = arm * Math.PI + t * Math.PI * 2.5 + tijd * 0.3;
          ctx.lineTo(gx + Math.cos(hoek) * t * gr, gy + Math.sin(hoek) * t * gr * 0.6);
        }
        ctx.strokeStyle = arm === 0 ? 'rgba(255,170,230,0.8)' : 'rgba(180,170,255,0.8)';
        ctx.lineWidth = gr * 0.12;
        ctx.stroke();
      }
      cirkel(gx, gy, gr * 0.15, '#fff3c4');

      // Vallende sterren met een regenboogstaartje
      for (const v of vallendeSterren) {
        ctx.globalAlpha = v.leven;
        ctx.lineCap = 'round';
        const kleuren = ['#ff9ad5', '#ffe17a', '#9ae6ff'];
        kleuren.forEach((k, i) => {
          ctx.strokeStyle = k;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(v.x, v.y + (i - 1) * 4);
          ctx.lineTo(v.x - 70, v.y - 35 + (i - 1) * 4);
          ctx.stroke();
        });
        ctx.fillStyle = '#fff6a8';
        sterVorm(v.x, v.y, 9, 5, 0.5);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

    }

    // De zon met draaiende stralen en een blij gezicht
    function tekenZon(x, y, r) {
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 2.6);
      gloed.addColorStop(0, 'rgba(255,220,100,0.45)');
      gloed.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = gloed;
      cirkel(x, y, r * 2.6, gloed);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tijd * 0.3);
      ctx.fillStyle = '#ffb347';
      ctx.strokeStyle = LIJN;
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      sterVorm(0, 0, r * 1.45, 12, 0.72);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      cirkel(x, y, r, '#ffe066', 3);
      gezichtje(x, y + r * 0.05, r, { blij: true });
    }

    // ---------- zonnestelsel ----------

    // Banen zijn platte ellipsen, alsof je er schuin op kijkt
    const PLAT = 0.42;

    // Eén eenheid in pixels, zo gekozen dat Neptunus nog net op het scherm past
    function eenheid() {
      return Math.min(canvas.width * 0.46, canvas.height * 0.44 / PLAT) / 7.8;
    }

    // Waar staat een hemellichaam nu op het scherm, en hoe groot is het?
    function plekVan(lichaam) {
      const mx = canvas.width / 2, my = canvas.height / 2, e = eenheid();
      if (lichaam.isZon) return { x: mx, y: my, r: ZON.grootte * e };
      if (lichaam.isMaan) {
        const a = plekVan(AARDE);
        return {
          x: a.x + Math.cos(MAAN.hoek) * a.r * 2.1,
          y: a.y + Math.sin(MAAN.hoek) * a.r * 0.9,
          r: MAAN.grootte * e,
        };
      }
      return {
        x: mx + Math.cos(lichaam.hoek) * lichaam.afstand * e,
        y: my + Math.sin(lichaam.hoek) * lichaam.afstand * e * PLAT,
        r: lichaam.grootte * e,
      };
    }

    // Plek van de voetjes tijdens de reis: een boog van het ene naar het andere hemellichaam
    function reisPositie() {
      const t = Math.min(poppetje.reis.t, 1);
      const zacht = t * t * (3 - 2 * t);
      const a = plekVan(poppetje.reis.van), b = plekVan(poppetje.reis.naar);
      const ax = a.x, ay = a.y - a.r, bx = b.x, by = b.y - b.r;
      return {
        x: ax + (bx - ax) * zacht,
        y: ay + (by - ay) * zacht - Math.sin(Math.PI * t) * eenheid() * 1.3,
      };
    }

    function tekenBanen() {
      const mx = canvas.width / 2, my = canvas.height / 2, e = eenheid();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 10]);
      for (const p of planeten) {
        ctx.beginPath();
        ctx.ellipse(mx, my, p.afstand * e, p.afstand * e * PLAT, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function tekenRing(x, y, pr, voorkant, kanteling, breedte, hoogte) {
      const van = voorkant ? 0 : Math.PI, tot = voorkant ? Math.PI : Math.PI * 2;
      ctx.lineCap = 'round';
      ctx.lineWidth = pr * 0.22;
      ctx.strokeStyle = LIJN;
      ctx.beginPath();
      ctx.ellipse(x, y, pr * breedte, pr * hoogte, kanteling, van, tot);
      ctx.stroke();
      ctx.lineWidth = pr * 0.14;
      ctx.strokeStyle = kanteling > 1 ? '#d6fffd' : '#ffb3d9';
      ctx.beginPath();
      ctx.ellipse(x, y, pr * breedte, pr * hoogte, kanteling, van, tot);
      ctx.stroke();
    }

    // Landen als ronde vlekjes op de aarde
    const landen = [
      { x: -0.4,  y: -0.45, r: 0.3 },
      { x: -0.15, y: -0.65, r: 0.22 },
      { x: -0.7,  y: 0.1,   r: 0.22 },
      { x: 0.55,  y: -0.35, r: 0.25 },
      { x: 0.7,   y: 0.15,  r: 0.2 },
      { x: 0.35,  y: 0.7,   r: 0.2 },
      { x: -0.4,  y: 0.65,  r: 0.18 },
    ];

    // 'plek' kan je zelf meegeven, bijvoorbeeld om een planeet groot in beeld te tekenen tijdens de reis
    function tekenLichaam(l, plek = plekVan(l), ooglens = false) {
      const { x, y, r } = plek;
      const bezoek = poppetje.waar === l && !poppetje.reis;

      // Gekozen hemellichaam krijgt een kloppend stippelrondje
      if (l === gekozen && !ooglens) {
        ctx.strokeStyle = '#fff6a8';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 7]);
        ctx.lineDashOffset = -tijd * 20;
        cirkel(x, y, r * (l.isZon ? 1.7 : 1.35) + 6 + Math.sin(tijd * 5) * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (l.isZon) { tekenZon(x, y, r); return; }

      if (l.uiterlijk === 'ring') tekenRing(x, y, r, false, -0.3, 1.9, 0.5);
      if (l.uiterlijk === 'schuineRing') tekenRing(x, y, r, false, 1.4, 1.6, 0.35);

      ctx.save();
      cirkel(x, y, r, l.kleur);
      ctx.clip();
      if (l.uiterlijk === 'aarde') {
        for (const land of landen) {
          cirkel(x + land.x * r, y + land.y * r, land.r * r, '#7ddc6a');
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#4fae4a';
          ctx.stroke();
        }
      }
      if (l.uiterlijk === 'kraters') {
        const krater = l.naam === 'Mars' ? '#e0684a' : 'rgba(0,0,0,0.12)';
        cirkel(x - r * 0.45, y - r * 0.5, r * 0.2, krater);
        cirkel(x + r * 0.5, y + r * 0.45, r * 0.16, krater);
        cirkel(x - r * 0.55, y + r * 0.55, r * 0.12, krater);
      }
      if (l.uiterlijk === 'strepen') {
        ctx.fillStyle = '#f2a65a';
        for (let i = -2; i <= 2; i += 2) ctx.fillRect(x - r, y + i * r * 0.4 - r * 0.1, r * 2, r * 0.2);
        ctx.fillStyle = '#e0563a';
        ctx.beginPath(); ctx.ellipse(x + r * 0.45, y + r * 0.55, r * 0.2, r * 0.11, 0, 0, Math.PI * 2); ctx.fill();
      }
      if (l.uiterlijk === 'wolken') {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = r * 0.12;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.arc(x + i * r * 0.3, y + i * r * 0.55, r * 0.5, Math.PI * 1.1, Math.PI * 1.6);
          ctx.stroke();
        }
      }
      // Glimmetje
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.4, y - r * 0.5, r * 0.28, r * 0.13, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      cirkel(x, y, r, null, 3);

      gezichtje(x, y + r * 0.1, r * 0.8, {
        slaperig: l.isMaan && !bezoek,
        blij: bezoek,
        fase: l.afstand || 7,
      });

      if (l.uiterlijk === 'ring') tekenRing(x, y, r, true, -0.3, 1.9, 0.5);
      if (l.uiterlijk === 'schuineRing') tekenRing(x, y, r, true, 1.4, 1.6, 0.35);

      if (bezoek) tekenPoppetje(x, y - r);
      if (l.voltooid && !ooglens) {
        ctx.fillStyle = '#ffd84a';
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = LIJN;
        sterVorm(x + r * 0.9, y - r * 0.9, Math.max(8, r * 0.35), 5, 0.5);
        ctx.fill();
        ctx.stroke();
      }
    }

    // Een klein mensje dat bovenop de aarde staat en zwaait
    // 'schaal' en 'richting' (1 = rechts, -1 = links) kun je meegeven voor het landschap
    // Pakjes per planeet. Op aarde gewone kleren; elders een ruimtepak met helm.
    // 'rugzak' = zuurstoftank, 'jetpack' = om te zweven op gasplaneten, 'dik' = extra warm opgevuld pak.
    const PAKJES = {
      Mercurius: { pak: '#e4e8f2', accent: '#ffb347', glas: 'rgba(255,214,90,0.45)', rugzak: true, embleem: 'zon' },
      Venus:     { pak: '#ff9a3a', accent: '#ffe14a', glas: 'rgba(255,240,170,0.45)', rugzak: true, embleem: 'vuur' },
      Maan:      { pak: '#ffffff', accent: '#e3262f', glas: 'rgba(170,230,255,0.4)', rugzak: true, embleem: 'brabant' },
      Mars:      { pak: '#ffffff', accent: '#ff6f3a', glas: 'rgba(170,230,255,0.4)', rugzak: true, embleem: 'ster' },
      Jupiter:   { pak: '#ff7a7a', accent: '#ffd84a', glas: 'rgba(170,230,255,0.4)', jetpack: true, embleem: 'bliksem' },
      Saturnus:  { pak: '#b58cff', accent: '#fff0a0', glas: 'rgba(255,220,240,0.45)', jetpack: true, embleem: 'ring' },
      Uranus:    { pak: '#7fe0dc', accent: '#ffffff', glas: 'rgba(214,255,253,0.5)', jetpack: true, dik: true, embleem: 'sneeuw' },
      Neptunus:  { pak: '#3a55d6', accent: '#9ae6ff', glas: 'rgba(170,230,255,0.4)', jetpack: true, dik: true, embleem: 'wind' },
    };

    function huidigPakje() {
      const plek = poppetje.waar || (poppetje.reis && poppetje.reis.naar);
      return plek ? PAKJES[plek.naam] : null;
    }

    function tekenEmbleem(soort, x, y) {
      ctx.lineWidth = 2;
      ctx.strokeStyle = LIJN;
      if (soort === 'brabant') {
        for (let r = 0; r < 2; r++) for (let k = 0; k < 3; k++) {
          ctx.fillStyle = (r + k) % 2 === 0 ? '#e3262f' : '#ffffff';
          ctx.fillRect(x - 7.5 + k * 5, y - 5 + r * 5, 5, 5);
        }
        ctx.strokeRect(x - 7.5, y - 5, 15, 10);
      } else if (soort === 'zon') {
        cirkel(x, y, 5, '#ffd84a', 2);
      } else if (soort === 'vuur') {
        ctx.fillStyle = '#ff4f2a';
        ctx.beginPath(); ctx.moveTo(x, y - 7); ctx.quadraticCurveTo(x + 7, y, x, y + 6); ctx.quadraticCurveTo(x - 7, y, x, y - 7); ctx.fill(); ctx.stroke();
      } else if (soort === 'bliksem') {
        ctx.fillStyle = '#ffe14a';
        ctx.beginPath(); ctx.moveTo(x + 2, y - 7); ctx.lineTo(x - 4, y + 1); ctx.lineTo(x, y + 1); ctx.lineTo(x - 2, y + 7); ctx.lineTo(x + 4, y - 1); ctx.lineTo(x, y - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (soort === 'ring') {
        cirkel(x, y, 4, '#fff0a0', 2);
        ctx.beginPath(); ctx.ellipse(x, y, 8, 3, -0.3, 0, Math.PI * 2); ctx.stroke();
      } else if (soort === 'sneeuw') {
        for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * 6, y - Math.sin(a) * 6); ctx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6); ctx.stroke(); }
      } else if (soort === 'wind') {
        ctx.beginPath(); ctx.moveTo(x - 7, y - 3); ctx.quadraticCurveTo(x + 4, y - 7, x + 6, y - 3); ctx.moveTo(x - 7, y + 3); ctx.quadraticCurveTo(x + 2, y, x + 5, y + 4); ctx.stroke();
      } else {
        ctx.fillStyle = '#ff8ac4';
        sterVorm(x, y, 6, 5, 0.5); ctx.fill(); ctx.stroke();
      }
    }

    // 'schaal' en 'richting' (1 = rechts, -1 = links) kun je meegeven voor het landschap
    function tekenPoppetje(x, voetY, schaal, richting = 1) {
      const e = eenheid();
      const s = schaal || e * 0.0045;          // schaal: poppetje groeit mee met het zonnestelsel
      const wiebel = schaal ? 0 : Math.sin(tijd * 3) * 2 * s;
      const y = voetY - (schaal ? 0 : poppetje.sprong * e * 0.5) + wiebel;
      const pakje = huidigPakje();
      ctx.save();
      ctx.translate(x, y);
      if (richting < 0) ctx.scale(-1, 1);
      ctx.scale(s, s);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = LIJN;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // Op de rug: zuurstoftank of jetpack met vlammetjes
      if (pakje && (pakje.rugzak || pakje.jetpack)) {
        if (pakje.jetpack) {
          for (const dx of [-20, -12]) {
            const vlam = 12 + Math.sin(tijd * 30 + dx) * 5;
            ctx.fillStyle = '#ffb347';
            ctx.beginPath(); ctx.moveTo(dx - 4, -22); ctx.lineTo(dx + 4, -22); ctx.lineTo(dx, -22 + vlam); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#fff6a8';
            ctx.beginPath(); ctx.moveTo(dx - 2, -22); ctx.lineTo(dx + 2, -22); ctx.lineTo(dx, -22 + vlam * 0.6); ctx.closePath(); ctx.fill();
          }
          ctx.fillStyle = '#9aa3b8';
          ctx.beginPath(); ctx.roundRect(-25, -48, 9, 26, 4); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.roundRect(-17, -48, 9, 26, 4); ctx.fill(); ctx.stroke();
        } else {
          ctx.fillStyle = '#cfd6e6';
          ctx.beginPath(); ctx.roundRect(-24, -50, 14, 30, 6); ctx.fill(); ctx.stroke();
          ctx.fillStyle = pakje.accent;
          ctx.fillRect(-22, -42, 10, 4);
        }
      }

      // Schoenen, of dikke ruimtelaarzen
      ctx.fillStyle = pakje ? pakje.accent : '#ff6f6f';
      const voetB = pakje ? 10 : 8, voetH = pakje ? 6 : 5;
      ctx.beginPath(); ctx.ellipse(-8, -3, voetB, voetH, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(8, -3, voetB, voetH, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // Broek of de pijpen van het pak
      const dikte = pakje && pakje.dik ? 3 : 0;
      ctx.fillStyle = pakje ? pakje.pak : '#4a7bd8';
      ctx.beginPath(); ctx.roundRect(-12 - dikte, -24, 10 + dikte, 20, 4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(2, -24, 10 + dikte, 20, 4); ctx.fill(); ctx.stroke();

      // Armpje links omlaag, rechts zwaait. In een pak: dikke mouwen en handschoenen.
      const zwaai = Math.sin(tijd * 8) * 0.4;
      const hx = 14 + Math.cos(-1.1 + zwaai) * 16, hy = -38 + Math.sin(-1.1 + zwaai) * 16;
      for (const [ax, ay, bx, by] of [[-14, -38, -24, -24], [14, -38, hx, hy]]) {
        ctx.lineWidth = pakje ? 12 + dikte : 9; ctx.strokeStyle = LIJN;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.lineWidth = pakje ? 8.5 + dikte : 5.5; ctx.strokeStyle = pakje ? pakje.pak : '#ffd1a8';
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        if (pakje) cirkel(bx, by, 5, pakje.accent, 2.5);
      }
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = LIJN;

      if (pakje) {
        // Ruimtepak met een gekleurde riem en een embleem
        ctx.fillStyle = pakje.pak;
        ctx.beginPath(); ctx.roundRect(-16 - dikte, -47, 32 + dikte * 2, 28, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = pakje.accent;
        ctx.beginPath(); ctx.roundRect(-16 - dikte, -25, 32 + dikte * 2, 5, 2); ctx.fill(); ctx.stroke();
        if (pakje.dik) {
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-16, -37); ctx.lineTo(16, -37); ctx.stroke();
          ctx.lineWidth = 3.5;
        }
        tekenEmbleem(pakje.embleem, 5, -36);
      } else {
        // T-shirt met een sterretje
        ctx.fillStyle = '#ffd84a';
        ctx.beginPath(); ctx.roundRect(-16, -46, 32, 26, 9); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ff8ac4';
        sterVorm(0, -33, 6, 5, 0.5);
        ctx.lineWidth = 2;
        ctx.fill(); ctx.stroke();
        ctx.lineWidth = 3.5;
      }

      // Hoofd met oortjes
      cirkel(-21, -62, 5, '#ffd1a8', 3);
      cirkel(21, -62, 5, '#ffd1a8', 3);
      cirkel(0, -64, 22, '#ffd1a8', 3.5);

      // Kort bruin haar met een kuifje
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.arc(0, -64, 22, Math.PI * 1.08, Math.PI * 1.92);
      ctx.quadraticCurveTo(10, -76, 0, -73);
      ctx.quadraticCurveTo(-10, -74, -20, -70);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-2, -86);
      ctx.quadraticCurveTo(4, -96, 10, -92);
      ctx.quadraticCurveTo(4, -90, 3, -85);
      ctx.fill();
      ctx.stroke();

      gezichtje(0, -60, 20, { blij: poppetje.sprong > 0, fase: 1 });

      // Ronde glazen helm met een glimmetje
      if (pakje) {
        ctx.fillStyle = pakje.glas;
        cirkel(0, -63, 31, pakje.glas, 3.5);
        ctx.strokeStyle = 'rgba(255,255,255,0.8)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, -63, 24, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke();
        ctx.fillStyle = pakje.accent;
        ctx.strokeStyle = LIJN;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(-18, -37, 36, 7, 3); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    // ---------- startscherm ----------

    function startKnop() {
      const b = Math.min(canvas.width * 0.5, 260), h = b * 0.32;
      return { x: canvas.width / 2 - b / 2, y: canvas.height * 0.82 - h / 2, b, h };
    }

    function opKnop(x, y) {
      const k = startKnop();
      return x >= k.x && x <= k.x + k.b && y >= k.y && y <= k.y + k.h;
    }

    function tekenStartscherm() {
      // Titel
      const tg = Math.min(canvas.width * 0.09, 64);
      const ty = canvas.height * 0.1 + Math.sin(tijd * 2) * 4;
      ctx.font = '700 ' + tg + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = tg * 0.18;
      ctx.strokeStyle = LIJN;
      ctx.strokeText('Moeder Aarde', canvas.width / 2, ty);
      const tk = ctx.createLinearGradient(0, ty - tg / 2, 0, ty + tg / 2);
      tk.addColorStop(0, '#fff6a8');
      tk.addColorStop(1, '#ff9ad5');
      ctx.fillStyle = tk;
      ctx.fillText('Moeder Aarde', canvas.width / 2, ty);

      // Knop die zachtjes klopt, en groter wordt als de muis erop staat
      const k = startKnop();
      const erop = opKnop(muis.x, muis.y);
      const puls = 1 + Math.sin(tijd * 4) * 0.03 + (erop ? 0.08 : 0);
      const cx = k.x + k.b / 2, cy = k.y + k.h / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(puls, puls);
      // Schaduwrandje onder
      ctx.fillStyle = '#c2357a';
      ctx.beginPath(); ctx.roundRect(-k.b / 2, -k.h / 2 + 7, k.b, k.h, k.h / 2); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = LIJN; ctx.stroke();
      // Knop zelf
      const kg = ctx.createLinearGradient(0, -k.h / 2, 0, k.h / 2);
      kg.addColorStop(0, '#ffb3d9');
      kg.addColorStop(1, '#ff6fae');
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.roundRect(-k.b / 2, -k.h / 2, k.b, k.h, k.h / 2); ctx.fill(); ctx.stroke();
      // Glimmetje
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.roundRect(-k.b / 2 + k.h * 0.4, -k.h / 2 + 6, k.b * 0.35, k.h * 0.18, 6); ctx.fill();
      // Tekst
      const fg = k.h * 0.55;
      ctx.font = '700 ' + fg + 'px ' + FONT;
      ctx.lineWidth = fg * 0.18;
      ctx.strokeStyle = LIJN;
      ctx.strokeText('START', 0, 3);
      ctx.fillStyle = '#fff';
      ctx.fillText('START', 0, 3);
      // Sterretjes naast de tekst
      ctx.fillStyle = '#fff6a8';
      ctx.lineWidth = 2.5;
      for (const kant of [-1, 1]) {
        sterVorm(kant * k.b * 0.36, 0, k.h * 0.18, 5, 0.5);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    // Op de planeet gaan staan: uitdagingen klaarzetten en de lijst links laten zien
    function gaNaarLandschap(l) {
      kijkModus = 'landschap';
      maakUitdagingen(l);
      zetSpelerNeer(l);
      werkLijstBij(l);
      lijstKaart.hidden = true;
      void lijstKaart.offsetWidth;
      lijstKaart.hidden = false;
    }

    // Op welk hemellichaam wordt geklikt? Wat vooraan (lager op het scherm) staat telt eerst.
    function lichaamOp(x, y) {
      const opVolgorde = [...lichamen].sort((a, b) => plekVan(b).y - plekVan(a).y);
      for (const l of opVolgorde) {
        const pl = plekVan(l);
        if (Math.hypot(x - pl.x, y - pl.y) <= Math.max(pl.r * 1.2, 18)) return l;
      }
      return null;
    }

    // Het kaartje met de eigenschappen invullen en laten zien
    const info = document.getElementById('info');
    function toonInfo(l, melding) {
      info.querySelector('.naam').textContent = l.naam;
      info.querySelector('.bol').style.background = l.kleur;
      info.querySelector('.melding').textContent = melding || '';
      const lijst = info.querySelector('dl');
      lijst.innerHTML = '';
      for (const [vraag, antwoord] of Object.entries(l.info)) {
        const dt = document.createElement('dt');
        dt.textContent = vraag;
        const dd = document.createElement('dd');
        dd.textContent = antwoord;
        lijst.append(dt, dd);
      }
      info.querySelector('.weetje').textContent = '⭐ ' + l.weetje;
      // Opnieuw laten 'ploppen'
      info.hidden = true;
      void info.offsetWidth;
      info.hidden = false;
    }
    document.getElementById('sluit').addEventListener('click', () => {
      info.hidden = true;
      gekozen = null;
    });

    canvas.addEventListener('mousemove', (e) => {
      muis = { x: e.clientX, y: e.clientY };
      let klikbaar;
      if (!gestart) klikbaar = opKnop(e.clientX, e.clientY);
      else if (poppetje.reis) klikbaar = false;
      else if (kijkModus === 'landschap') klikbaar = opTerugKnop(e.clientX, e.clientY);
      else klikbaar = lichaamOp(e.clientX, e.clientY);
      canvas.style.cursor = klikbaar ? 'pointer' : 'default';
    });

    canvas.addEventListener('click', (e) => {
      if (!gestart) {
        if (opKnop(e.clientX, e.clientY)) {
          gestart = true;
          canvas.style.cursor = 'default';
          poppetje.sprong = 0.01;
          poppetje.sprongSnelheid = 3;
        }
        return;
      }
      if (poppetje.reis) return;
      if (kijkModus === 'landschap') {
        if (opTerugKnop(e.clientX, e.clientY)) {
          kijkModus = 'overzicht';
          lijstKaart.hidden = true;
        }
        return;
      }
      const doel = lichaamOp(e.clientX, e.clientY);
      if (!doel) return;
      gekozen = doel;
      if (doel.isZon) {
        toonInfo(doel, 'Au, veel te heet! Hier kun je niet landen.');
      } else if (doel === poppetje.waar) {
        // Terug naar beneden, rondkijken op je eigen planeet
        gaNaarLandschap(doel);
        toonInfo(doel, 'Hier sta je nu!');
      } else {
        // Het poppetje vliegt erheen
        toonInfo(doel, 'Op weg naar ' + doel.naam + '!');
        poppetje.sprong = 0;
        poppetje.sprongSnelheid = 0;
        poppetje.reis = { van: poppetje.waar, naar: doel, t: 0 };
        // Alvast klaarzetten, want aan het eind van de reis zie je het landschap al verschijnen
        maakUitdagingen(doel);
        zetSpelerNeer(doel);
        poppetje.waar = null;
      }
    });

    function tekenReis() {
      for (const g of glitters) {
        ctx.globalAlpha = Math.max(g.leven, 0);
        ctx.fillStyle = g.kleur;
        sterVorm(g.x, g.y, 5 * g.leven + 2, 5, 0.5);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (poppetje.reis) {
        const plek = reisPositie();
        tekenPoppetje(plek.x, plek.y);
      }
    }

    // Cartoontekst met een dikke rand
    function tekenTekst(tekst, x, y, fg, kleur = '#fff6a8') {
      ctx.font = '700 ' + fg + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = fg * 0.2;
      ctx.strokeStyle = LIJN;
      ctx.strokeText(tekst, x, y);
      ctx.fillStyle = kleur;
      ctx.fillText(tekst, x, y);
    }

    // De rand van je ruimtehelm, zodat je ziet dat je door je eigen ogen kijkt
    function tekenHelm() {
      const b = canvas.width, h = canvas.height, maat = Math.min(b, h);
      const rand = maat * 0.06;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, b, h);
      ctx.roundRect(rand, rand, b - rand * 2, h - rand * 2, maat * 0.18);
      ctx.fillStyle = '#e9e4ff';
      ctx.fill('evenodd');
      ctx.lineWidth = 6;
      ctx.strokeStyle = LIJN;
      ctx.beginPath();
      ctx.roundRect(rand, rand, b - rand * 2, h - rand * 2, maat * 0.18);
      ctx.stroke();
      // Glimmetje op het glas
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = maat * 0.02;
      ctx.beginPath();
      ctx.arc(rand + maat * 0.2, rand + maat * 0.2, maat * 0.12, Math.PI * 1.05, Math.PI * 1.45);
      ctx.stroke();
      ctx.restore();
    }

    // ---------- landschappen: zo ziet het eruit als je op een planeet staat ----------

    // Hoe elke planeet eruitziet van dichtbij. 'gas' = geen vaste grond, alleen wolkenlagen.
    // 'zon' = hoe groot de zon aan de hemel is (hoe verder weg, hoe kleiner).
    const LANDSCHAPPEN = {
      Mercurius: { lucht: ['#0b0820', '#2a2050'], grond: '#c9bfb5', donker: '#9a9088', zon: 0.17, sterren: true, kraters: true },
      Venus:     { lucht: ['#d9822f', '#ffd59a'], grond: '#d98a4a', donker: '#a8582a', zon: 0, vulkanen: true, dikkeWolken: true },
      Aarde:     { lucht: ['#5ab8ff', '#d4f1ff'], grond: '#7ddc6a', donker: '#4fae4a', zon: 0.07, bomen: true, wolkjes: true },
      Maan:      { lucht: ['#05030f', '#151030'], grond: '#dcd8e6', donker: '#aaa5ba', zon: 0.07, sterren: true, kraters: true, aardeInLucht: true, vlag: true },
      Mars:      { lucht: ['#d99a6c', '#f7d9b5'], grond: '#e0704a', donker: '#b5502f', zon: 0.045, vulkaan: true, stenen: true, marsmaantjes: true },
      Jupiter:   { lucht: ['#b8763f', '#f5d7a8'], gas: ['#ffcf8a', '#f2a65a', '#fff0d6', '#e8b070'], zon: 0.025, rodeVlek: true },
      Saturnus:  { lucht: ['#cdb15e', '#fff3c4'], gas: ['#fff0a0', '#f3dc8a', '#fffbe0'], zon: 0.02, ringInLucht: true },
      Uranus:    { lucht: ['#4fb8c0', '#c9fbf8'], gas: ['#a6f0ee', '#8adcd9', '#d6fffd'], zon: 0.012 },
      Neptunus:  { lucht: ['#14206a', '#5b7cff'], gas: ['#6f8cff', '#4d68e0', '#9fb2ff'], zon: 0.008, wind: true },
    };

    // Vaste 'willekeurige' getallen, zodat bomen en stenen niet elke keer verspringen
    function vast(i) {
      const x = Math.sin(i * 12.9898) * 43758.5453;
      return x - Math.floor(x);
    }

    // Hoogte van een heuvelrand op plek x
    function heuvelY(x, basis, hoogte, fase) {
      const f = 0.006;
      return basis + Math.sin(x * f + fase) * hoogte + Math.sin(x * f * 2.3 + fase * 1.7) * hoogte * 0.4;
    }

    function tekenHeuvel(basis, hoogte, fase, kleur) {
      const b = canvas.width, h = canvas.height;
      ctx.beginPath();
      ctx.moveTo(-10, h + 10);
      for (let x = -10; x <= b + 10; x += 8) ctx.lineTo(x, heuvelY(x, basis, hoogte, fase));
      ctx.lineTo(b + 10, h + 10);
      ctx.closePath();
      ctx.fillStyle = kleur;
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = LIJN;
      ctx.stroke();
    }

    // Golvende wolkenlaag voor gasplaneten, schuift langzaam opzij
    function tekenWolkenlaag(basis, hoogte, fase, snelheid, kleur) {
      const b = canvas.width, h = canvas.height;
      const schuif = tijd * snelheid;
      ctx.beginPath();
      ctx.moveTo(-10, h + 10);
      for (let x = -10; x <= b + 10; x += 8) {
        ctx.lineTo(x, basis + Math.sin((x + schuif) * 0.012 + fase) * hoogte + Math.sin((x + schuif) * 0.031 + fase) * hoogte * 0.35);
      }
      ctx.lineTo(b + 10, h + 10);
      ctx.closePath();
      ctx.fillStyle = kleur;
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(42,27,74,0.45)';
      ctx.stroke();
    }

    function tekenLandschap(l) {
      const b = canvas.width, h = canvas.height, maat = Math.min(b, h);
      const c = LANDSCHAPPEN[l.naam];
      const horizon = h * 0.6;

      // Lucht
      const lucht = ctx.createLinearGradient(0, 0, 0, horizon);
      lucht.addColorStop(0, c.lucht[0]);
      lucht.addColorStop(1, c.lucht[1]);
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      // Sterren (alleen waar geen lucht is om ze te verbergen)
      if (c.sterren) {
        for (const st of sterren) {
          if (st.y * h > horizon) continue;
          ctx.globalAlpha = 0.6 + 0.4 * Math.sin(tijd * 2 + st.fase);
          cirkel(st.x * b, st.y * h, st.grootte * 0.35, st.kleur);
        }
        ctx.globalAlpha = 1;
      }

      // Neptunus: wind die hard langs suist
      if (c.wind) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineCap = 'round';
        ctx.lineWidth = 4;
        for (let i = 0; i < 14; i++) {
          const y = vast(i + 3) * horizon * 0.9;
          const x = ((vast(i) * b + tijd * (500 + vast(i + 9) * 400)) % (b + 300)) - 150;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + 60, y - 12, x + 140, y);
          ctx.stroke();
        }
      }

      // De zon: dichtbij groot met gezichtje, ver weg een klein fel lichtje
      if (c.zon > 0) {
        const zr = maat * c.zon, zx = b * 0.74, zy = h * 0.25;
        if (zr > 20) {
          tekenZon(zx, zy, zr);
        } else {
          const gloed = ctx.createRadialGradient(zx, zy, 0, zx, zy, zr * 6 + 10);
          gloed.addColorStop(0, 'rgba(255,240,180,0.9)');
          gloed.addColorStop(1, 'rgba(255,240,180,0)');
          cirkel(zx, zy, zr * 6 + 10, gloed);
          cirkel(zx, zy, Math.max(zr, 3), '#fffbe0');
        }
      }

      // Saturnus: de ringen staan als een enorme regenboogboog aan de hemel
      if (c.ringInLucht) {
        const kleuren = ['#ffe9b0', '#f3c98a', '#ffd9ec', '#e8d3a0'];
        kleuren.forEach((k, i) => {
          ctx.strokeStyle = k;
          ctx.lineWidth = maat * 0.035;
          ctx.globalAlpha = 0.85;
          ctx.beginPath();
          ctx.ellipse(b * 0.5, horizon + h * 0.05, b * 0.75 - i * maat * 0.04, h * 0.42 - i * maat * 0.04, -0.12, Math.PI, Math.PI * 2);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
      }

      // Op de maan zie je de aarde hangen, met haar gezichtje
      if (c.aardeInLucht) tekenLichaam(AARDE, { x: b * 0.27, y: h * 0.27, r: maat * 0.09 }, true);

      // Mars heeft twee piepkleine aardappelmaantjes
      if (c.marsmaantjes) {
        cirkel(b * 0.25, h * 0.18, maat * 0.018, '#c9bfb5', 2.5);
        cirkel(b * 0.42, h * 0.1, maat * 0.011, '#c9bfb5', 2);
      }

      // Wolkjes aan de hemel (aarde)
      if (c.wolkjes) {
        for (let i = 0; i < 4; i++) {
          const wx = ((vast(i) * b + tijd * 18 * (1 + i * 0.3)) % (b + 200)) - 100;
          const wy = h * (0.12 + vast(i + 5) * 0.25), wr = maat * 0.035;
          for (const [dx, dy, dr] of [[0, 0, 1], [1.1, -0.4, 1.3], [2.2, 0, 1]]) {
            cirkel(wx + dx * wr, wy + dy * wr, dr * wr, '#ffffff', 3);
          }
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(wx, wy - wr * 0.2, wr * 2.2, wr);
        }
      }

      if (c.gas) {
        // Gasplaneet: geen grond, alleen lagen wolken onder je
        c.gas.forEach((kleur, i) => {
          tekenWolkenlaag(horizon + i * h * 0.1, h * 0.025 + i * 4, i * 1.7, 25 + i * 30, kleur);
        });
        if (c.rodeVlek) {
          const vx = b * 0.7, vy = h * 0.8;
          ctx.save();
          ctx.translate(vx, vy);
          ctx.scale(1, 0.45);
          cirkel(0, 0, maat * 0.12, '#e0563a', 4);
          ctx.strokeStyle = '#ff9a7a';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(0, 0, maat * 0.07, tijd, tijd + Math.PI * 1.3);
          ctx.stroke();
          ctx.restore();
        }
      } else {
        // Vaste grond: heuvels achter, dan een vulkaan, dan de grond waar je op staat
        if (c.vulkanen || c.vulkaan) {
          const aantal = c.vulkaan ? 1 : 3;
          for (let i = 0; i < aantal; i++) {
            const vx = c.vulkaan ? b * 0.68 : b * (0.2 + i * 0.32);
            const vb = c.vulkaan ? maat * 0.55 : maat * 0.22;
            const vh = c.vulkaan ? maat * 0.28 : maat * 0.17;
            const top = horizon - vh;
            ctx.beginPath();
            ctx.moveTo(vx - vb / 2, horizon + 20);
            ctx.lineTo(vx - vb * 0.09, top);
            ctx.lineTo(vx + vb * 0.09, top);
            ctx.lineTo(vx + vb / 2, horizon + 20);
            ctx.closePath();
            ctx.fillStyle = c.donker;
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = LIJN;
            ctx.stroke();
            if (c.vulkanen) {
              // Venus: gloeiende lava en een rookpluim
              ctx.fillStyle = '#ffdd55';
              ctx.beginPath(); ctx.ellipse(vx, top, vb * 0.09, 5, 0, 0, Math.PI * 2); ctx.fill();
              for (let k = 0; k < 3; k++) {
                const op = (tijd * 0.4 + k / 3) % 1;
                ctx.globalAlpha = 1 - op;
                cirkel(vx + Math.sin(op * 6 + i) * 10, top - op * maat * 0.15, 8 + op * 18, '#b07a5a');
              }
              ctx.globalAlpha = 1;
            }
          }
        }
        tekenHeuvel(horizon, h * 0.03, 1, c.donker);
        tekenHeuvel(horizon + h * 0.12, h * 0.025, 4, c.grond);

        // Kraters op de grond
        if (c.kraters) {
          for (let i = 0; i < 6; i++) {
            const kx = vast(i + 20) * b, ky = horizon + h * 0.2 + vast(i + 30) * h * 0.18;
            const kr = maat * (0.03 + vast(i + 40) * 0.05);
            ctx.beginPath();
            ctx.ellipse(kx, ky, kr, kr * 0.35, 0, 0, Math.PI * 2);
            ctx.fillStyle = c.donker;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = LIJN;
            ctx.stroke();
          }
        }

        // Stenen op Mars
        if (c.stenen) {
          for (let i = 0; i < 7; i++) {
            const sx = vast(i + 50) * b, sy = horizon + h * 0.2 + vast(i + 60) * h * 0.2;
            const sr = maat * (0.015 + vast(i + 70) * 0.03);
            ctx.beginPath();
            ctx.ellipse(sx, sy, sr * 1.3, sr, 0, Math.PI, Math.PI * 2);
            ctx.closePath();
            ctx.fillStyle = c.donker;
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = LIJN;
            ctx.stroke();
          }
        }

        // Bomen en bloemetjes op aarde
        if (c.bomen) {
          for (let i = 0; i < 5; i++) {
            const bx = b * (0.08 + i * 0.21 + vast(i) * 0.06);
            const by = heuvelY(bx, horizon + h * 0.12, h * 0.025, 4) + 6;
            const bg = maat * (0.05 + vast(i + 3) * 0.03);
            ctx.fillStyle = '#9b6a3f';
            ctx.lineWidth = 3;
            ctx.strokeStyle = LIJN;
            ctx.beginPath(); ctx.roundRect(bx - bg * 0.15, by - bg * 1.6, bg * 0.3, bg * 1.6, 4); ctx.fill(); ctx.stroke();
            cirkel(bx, by - bg * 1.9, bg * 0.85, '#5ccf5a', 3.5);
            cirkel(bx - bg * 0.3, by - bg * 2.1, bg * 0.15, '#ff7a9a');
            cirkel(bx + bg * 0.35, by - bg * 1.75, bg * 0.15, '#ff7a9a');
          }
          for (let i = 0; i < 14; i++) {
            const fx = vast(i + 80) * b, fy = horizon + h * 0.22 + vast(i + 90) * h * 0.18;
            for (let k = 0; k < 5; k++) {
              const a = k / 5 * Math.PI * 2;
              cirkel(fx + Math.cos(a) * 6, fy + Math.sin(a) * 6, 5, ['#ffb3d9', '#fff6a8', '#ffffff'][i % 3]);
            }
            cirkel(fx, fy, 4, '#ffcf3a');
          }
        }

        // Vlag op de maan
        if (c.vlag) {
          const vx = b * 0.68, vy = heuvelY(b * 0.68, horizon + h * 0.12, h * 0.025, 4) + 10;
          ctx.lineWidth = 4;
          ctx.strokeStyle = LIJN;
          ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx, vy - maat * 0.2); ctx.stroke();
          // De Brabantse vlag: rood-wit geblokt, 4 rijen van 6 vakjes, wappert een beetje
          const vb = maat * 0.15, vh = maat * 0.1, vtop = vy - maat * 0.2;
          for (let rij = 0; rij < 4; rij++) {
            for (let kol = 0; kol < 6; kol++) {
              const golf = Math.sin(tijd * 3 + kol * 0.8) * maat * 0.004 * kol;
              ctx.fillStyle = (rij + kol) % 2 === 0 ? '#e3262f' : '#ffffff';
              ctx.fillRect(vx + kol * vb / 6, vtop + rij * vh / 4 + golf, vb / 6 + 0.5, vh / 4 + 0.5);
            }
          }
          ctx.strokeStyle = LIJN;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(vx, vtop);
          for (let kol = 0; kol <= 6; kol++) ctx.lineTo(vx + kol * vb / 6, vtop + Math.sin(tijd * 3 + Math.min(kol, 5) * 0.8) * maat * 0.004 * Math.min(kol, 5));
          for (let kol = 6; kol >= 0; kol--) ctx.lineTo(vx + kol * vb / 6, vtop + vh + Math.sin(tijd * 3 + Math.min(kol, 5) * 0.8) * maat * 0.004 * Math.min(kol, 5));
          ctx.closePath();
          ctx.stroke();
        }
      }

      tekenSpel(l);

      // Venus: dikke gele wolken die de lucht dichtzitten
      if (c.dikkeWolken) {
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = 'rgba(255,220,150,0.45)';
          ctx.beginPath();
          const y = h * (0.08 + i * 0.12), schuif = tijd * (15 + i * 10);
          ctx.moveTo(-10, y - 40);
          for (let x = -10; x <= b + 10; x += 10) ctx.lineTo(x, y + Math.sin((x + schuif) * 0.015 + i) * 18);
          ctx.lineTo(b + 10, y - 60);
          ctx.closePath();
          ctx.fill();
        }
      }

      tekenTekst((c.gas ? 'Je zweeft boven ' : 'Je staat op ') + l.naam, b / 2, h * 0.14, Math.min(b * 0.06, 40));
      tekenFeest();
      tekenHelm();
      tekenTerugKnop();
    }

    // ---------- uitdagingen op de planeten ----------

    // Per planeet drie opdrachten. 'verzamel' = dingen oppakken, 'spring' = zo vaak springen,
    // 'bezoek' = naar een plek lopen of vliegen (x en y als deel van het scherm), 'hoog' = helemaal naar boven vliegen.
    const UITDAGINGEN = {
      Mercurius: [
        { type: 'verzamel', ding: 'ijs', aantal: 4, tekst: 'Zoek 4 stukjes ijs' },
        { type: 'spring', aantal: 3, tekst: 'Spring 3 keer' },
        { type: 'bezoek', doel: 'krater', x: 0.8, tekst: 'Loop naar de grote krater' },
      ],
      Venus: [
        { type: 'verzamel', ding: 'lava', aantal: 3, tekst: 'Verzamel 3 lavastenen' },
        { type: 'bezoek', doel: 'vulkaan', x: 0.52, tekst: 'Loop naar de middelste vulkaan' },
        { type: 'bezoek', doel: 'sonde', x: 0.9, tekst: 'Vind de oude ruimtesonde' },
      ],
      Aarde: [
        { type: 'verzamel', ding: 'bloem', aantal: 5, tekst: 'Pluk 5 bloemen' },
        { type: 'spring', aantal: 3, tekst: 'Spring 3 keer' },
        { type: 'bezoek', doel: 'boom', x: 0.08 + 2 * 0.21 + vast(2) * 0.06, tekst: 'Geef de middelste boom een knuffel' },
      ],
      Maan: [
        { type: 'spring', aantal: 3, tekst: 'Spring 3 keer (kijk hoe hoog!)' },
        { type: 'bezoek', doel: 'vlag', x: 0.68, tekst: 'Loop naar de vlag' },
        { type: 'verzamel', ding: 'maansteen', aantal: 4, tekst: 'Verzamel 4 maanstenen' },
      ],
      Mars: [
        { type: 'bezoek', doel: 'rover', x: 0.3, tekst: 'Vind de marsrover' },
        { type: 'verzamel', ding: 'marssteen', aantal: 4, tekst: 'Verzamel 4 rode stenen' },
        { type: 'bezoek', doel: 'vulkaan', x: 0.68, tekst: 'Loop naar de grote vulkaan' },
      ],
      Jupiter: [
        { type: 'verzamel', ding: 'bliksem', aantal: 5, tekst: 'Vang 5 bliksemflitsen' },
        { type: 'bezoek', doel: 'rodeVlek', x: 0.7, y: 0.8, tekst: 'Vlieg naar de rode vlek' },
        { type: 'hoog', tekst: 'Vlieg helemaal naar boven' },
      ],
      Saturnus: [
        { type: 'verzamel', ding: 'ijs', aantal: 5, tekst: 'Vang 5 ijsbrokjes uit de ringen' },
        { type: 'bezoek', doel: 'zeshoek', x: 0.3, y: 0.45, tekst: 'Vlieg naar de zeshoek-wolk' },
        { type: 'hoog', tekst: 'Vlieg omhoog naar de ringen' },
      ],
      Uranus: [
        { type: 'verzamel', ding: 'diamant', aantal: 5, tekst: 'Vang 5 diamanten' },
        { type: 'bezoek', doel: 'ijswolk', x: 0.65, y: 0.4, tekst: 'Vlieg naar de ijskoude wolk' },
        { type: 'hoog', tekst: 'Vlieg helemaal naar boven' },
      ],
      Neptunus: [
        { type: 'verzamel', ding: 'ijs', aantal: 5, tekst: 'Vang 5 ijskristallen' },
        { type: 'bezoek', doel: 'donkereVlek', x: 0.35, y: 0.78, tekst: 'Vlieg naar de donkere storm' },
        { type: 'hoog', tekst: 'Vlieg tegen de wind in naar boven' },
      ],
    };

    // Zwaartekracht vergeleken met de aarde: op de maan spring je veel hoger!
    const ZWAARTEKRACHT = { Mercurius: 0.38, Venus: 0.9, Aarde: 1, Maan: 0.17, Mars: 0.38 };

    // Het mensje in het landschap
    const speler = { x: 0, y: 0, vy: 0, opGrond: true, richting: 1, loopt: false };
    const toetsen = {};
    let feest = null;   // confetti als alle uitdagingen van een planeet klaar zijn

    // Opdrachten en spulletjes voor een planeet klaarzetten (alleen de eerste keer, daarna onthoudt hij je voortgang)
    // Gevaarlijke wezens per planeet. 'loper' loopt heen en weer, 'springer' hupt, 'vlieger' en 'kwal' zweven.
    const WEZENS = {
      Mercurius: { naam: 'vuurslakken',   kleur: '#ff7a3a', soort: 'loper',    snelheid: 0.09, aantal: 3 },
      Venus:     { naam: 'zuurslakken',   kleur: '#b6e04a', soort: 'loper',    snelheid: 0.11, aantal: 3 },
      Aarde:     { naam: 'boze wespen',   kleur: '#ffd84a', soort: 'vlieger',  snelheid: 0.13, aantal: 3 },
      Maan:      { naam: 'maanspinnen',   kleur: '#b9a8ff', soort: 'springer', snelheid: 0.07, aantal: 3 },
      Mars:      { naam: 'marsmannetjes', kleur: '#7ddc6a', soort: 'loper',    snelheid: 0.13, aantal: 3 },
      Jupiter:   { naam: 'onweerwolken',  kleur: '#8a7ab8', soort: 'vlieger',  snelheid: 0.12, aantal: 3 },
      Saturnus:  { naam: 'ijsmonsters',   kleur: '#bff4ff', soort: 'vlieger',  snelheid: 0.11, aantal: 3 },
      Uranus:    { naam: 'ijskwallen',    kleur: '#c9a8ff', soort: 'kwal',     snelheid: 0.09, aantal: 4 },
      Neptunus:  { naam: 'stormkwallen',  kleur: '#4d68e0', soort: 'kwal',     snelheid: 0.16, aantal: 4 },
    };
    const MAX_LEVENS = 3;
    let levens = MAX_LEVENS;
    let onkwetsbaar = 0;   // even knipperen na een tik, dan kun je niet meteen weer geraakt worden
    let duw = 0;           // je wordt een stukje weggeduwd als een wezen je raakt
    let auTekst = 0;       // hoe lang 'Au!' nog in beeld staat

    function maakWezens(l) {
      if (l.wezens) return;
      const w = WEZENS[l.naam];
      l.wezens = [];
      for (let i = 0; i < w.aantal; i++) {
        // Ze patrouilleren elk in hun eigen stukje, nooit bij de startplek links
        const midden = 0.42 + i * (0.44 / Math.max(1, w.aantal - 1));
        l.wezens.push({
          x: midden, midden, bereik: 0.08 + vast(i + 100) * 0.04,
          y: 0.22 + i * (0.5 / w.aantal) + vast(i + 7) * 0.05,
          richting: i % 2 ? 1 : -1, fase: vast(i + 200) * 6, plat: 0,
        });
      }
    }

    function maakUitdagingen(l) {
      maakWezens(l);
      if (l.uitdagingen) return;
      const gas = !!LANDSCHAPPEN[l.naam].gas;
      l.uitdagingen = UITDAGINGEN[l.naam].map(u => ({ ...u, gedaan: 0, klaar: false }));
      l.spulletjes = [];
      for (const u of l.uitdagingen) {
        if (u.type !== 'verzamel') continue;
        for (let i = 0; i < u.aantal; i++) {
          l.spulletjes.push({
            ding: u.ding,
            x: 0.12 + (i + 0.2 + vast(i + l.naam.length) * 0.6) * 0.76 / u.aantal,
            y: gas ? 0.25 + vast(i * 3 + l.naam.length) * 0.5 : null,
            hoog: !gas && i % 2 === 1,   // sommige dingen zweven een beetje: daarvoor moet je springen
            gepakt: false,
          });
        }
      }
    }

    function horizonY() { return canvas.height * 0.6; }
    function grondY(x) { return heuvelY(x, horizonY() + canvas.height * 0.12, canvas.height * 0.025, 4) + 6; }
    function spelerMaat() { return Math.min(canvas.width, canvas.height); }

    // Neerzetten op de planeet, links in beeld
    function zetSpelerNeer(l) {
      levens = MAX_LEVENS;
      onkwetsbaar = 0;
      duw = 0;
      speler.x = canvas.width * 0.18;
      speler.vy = 0;
      speler.richting = 1;
      speler.y = LANDSCHAPPEN[l.naam].gas ? horizonY() - canvas.height * 0.05 : grondY(speler.x);
      speler.opGrond = true;
    }

    function plekVanDing(l, d) {
      const b = canvas.width, h = canvas.height, m = spelerMaat();
      const x = d.x * b;
      if (d.y !== null) return { x, y: d.y * h };
      return { x, y: grondY(x) - m * (d.hoog ? 0.2 : 0.05) };
    }

    function plekVanDoel(u) {
      const b = canvas.width, h = canvas.height;
      const x = u.x * b;
      return { x, y: u.y !== undefined ? u.y * h : grondY(x) };
    }

    function updateSpeler(dt) {
      const l = poppetje.waar;
      if (!l || kijkModus !== 'landschap' || poppetje.reis) return;
      const b = canvas.width, h = canvas.height, m = spelerMaat();
      const gas = !!LANDSCHAPPEN[l.naam].gas;
      const links = toetsen.ArrowLeft || toetsen.a, rechts = toetsen.ArrowRight || toetsen.d;
      const omhoog = toetsen.ArrowUp || toetsen.w || toetsen[' '], omlaag = toetsen.ArrowDown || toetsen.s;
      const snelheid = m * 0.55;

      speler.loopt = !!(links || rechts);
      if (links) { speler.x -= snelheid * dt; speler.richting = -1; }
      if (rechts) { speler.x += snelheid * dt; speler.richting = 1; }
      speler.x = Math.max(m * 0.08, Math.min(b - m * 0.08, speler.x));

      if (gas) {
        // Zweven: alle kanten op
        if (omhoog) speler.y -= snelheid * dt;
        if (omlaag) speler.y += snelheid * dt;
        speler.y = Math.max(h * 0.12, Math.min(horizonY() + h * 0.3, speler.y));
      } else {
        // Lopen en springen; hoe zwakker de zwaartekracht, hoe hoger je springt
        const g = m * 5 * ZWAARTEKRACHT[l.naam];
        if (omhoog && speler.opGrond) {
          speler.vy = -m * 1.6;
          speler.opGrond = false;
          telOp(l, 'spring');
        }
        speler.vy += g * dt;
        speler.y += speler.vy * dt;
        const grond = grondY(speler.x);
        if (speler.y >= grond) { speler.y = grond; speler.vy = 0; speler.opGrond = true; }
      }

      // Weggeduwd worden na een tik
      if (duw) {
        speler.x = Math.max(m * 0.08, Math.min(b - m * 0.08, speler.x + duw * dt));
        duw *= Math.pow(0.02, dt);
        if (Math.abs(duw) < 5) duw = 0;
      }
      if (onkwetsbaar > 0) onkwetsbaar -= dt;
      if (auTekst > 0) auTekst -= dt;

      // Wezens bewegen en kijken of ze je raken
      const soort = WEZENS[l.naam].soort;
      for (const w of l.wezens) {
        if (w.plat > 0) { w.plat -= dt; continue; }
        w.x += w.richting * WEZENS[l.naam].snelheid * dt;
        if (w.x > w.midden + w.bereik) w.richting = -1;
        if (w.x < w.midden - w.bereik) w.richting = 1;
        const p = plekVanWezen(l, w);
        const raak = Math.hypot(p.x - speler.x, p.y - (speler.y - m * 0.08));
        if (raak > m * 0.085) continue;
        // Bovenop springen maakt een wezen plat (alleen als je loopt, niet bij het zweven)
        if (!gas && speler.vy > 0 && speler.y < p.y) {
          w.plat = 4;
          speler.vy = -m * 1.1;
          vonkjes(p.x, p.y);
          continue;
        }
        if (onkwetsbaar > 0) continue;
        levens--;
        onkwetsbaar = 1.5;
        auTekst = 1;
        duw = (speler.x < p.x ? -1 : 1) * m * 1.5;
        if (!gas) { speler.vy = -m * 0.7; speler.opGrond = false; }
        if (levens <= 0) {
          // Alle levens op: terug naar het begin van de planeet
          zetSpelerNeer(l);
          auTekst = 2;
          onkwetsbaar = 2;
        }
      }

      // Spulletjes oppakken
      const midden = speler.y - m * 0.08;
      for (const d of l.spulletjes) {
        if (d.gepakt) continue;
        const p = plekVanDing(l, d);
        if (Math.hypot(p.x - speler.x, p.y - midden) < m * 0.08) {
          d.gepakt = true;
          telOp(l, 'verzamel', d.ding);
          vonkjes(p.x, p.y);
        }
      }

      // Plekken bezoeken en naar boven vliegen
      for (const u of l.uitdagingen) {
        if (u.klaar) continue;
        if (u.type === 'bezoek') {
          const p = plekVanDoel(u);
          const dichtbij = gas ? Math.hypot(p.x - speler.x, p.y - midden) < m * 0.1 : Math.abs(p.x - speler.x) < m * 0.07;
          if (dichtbij) { u.klaar = true; vonkjes(p.x, p.y - m * 0.1); werkLijstBij(l); }
        }
        if (u.type === 'hoog' && speler.y < h * 0.2) { u.klaar = true; werkLijstBij(l); }
      }

      // Feest bijwerken
      if (feest) {
        feest.tijd -= dt;
        for (const c of feest.snippers) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 300 * dt; c.draai += dt * 5; }
        if (feest.tijd <= 0) feest = null;
      }
    }

    function telOp(l, type, ding) {
      for (const u of l.uitdagingen) {
        if (u.klaar || u.type !== type || (ding && u.ding !== ding)) continue;
        u.gedaan++;
        if (u.gedaan >= u.aantal) u.klaar = true;
        werkLijstBij(l);
        return;
      }
    }

    // Glinsterende sterretjes als je iets haalt
    function vonkjes(x, y) {
      for (let i = 0; i < 12; i++) {
        glitters.push({ x: x + (Math.random() - 0.5) * 40, y: y + (Math.random() - 0.5) * 40, leven: 1,
          kleur: ['#fff6a8', '#ff9ad5', '#9ae6ff'][i % 3] });
      }
    }

    // De lijst links op het scherm invullen
    const lijstKaart = document.getElementById('uitdagingen');
    function werkLijstBij(l) {
      lijstKaart.querySelector('h3').textContent = 'Uitdagingen op ' + l.naam;
      const ul = lijstKaart.querySelector('ul');
      ul.innerHTML = '';
      for (const u of l.uitdagingen) {
        const li = document.createElement('li');
        if (u.klaar) li.className = 'klaar';
        const vinkje = document.createElement('span');
        vinkje.className = 'vinkje';
        vinkje.textContent = u.klaar ? '✓' : '';
        const tekst = document.createElement('span');
        tekst.className = 'tekst';
        tekst.textContent = u.tekst + ' ';
        li.append(vinkje, tekst);
        if (u.aantal && u.type !== 'bezoek') {
          const teller = document.createElement('span');
          teller.className = 'teller';
          teller.textContent = Math.min(u.gedaan, u.aantal) + '/' + u.aantal;
          li.append(teller);
        }
        ul.append(li);
      }
      const allesKlaar = l.uitdagingen.every(u => u.klaar);
      lijstKaart.querySelector('.feest').textContent = allesKlaar ? '🎉 Alles gehaald op ' + l.naam + '!' : '';
      lijstKaart.querySelector('.toetsen').textContent = LANDSCHAPPEN[l.naam].gas
        ? 'Zweven: pijltjestoetsen. Pas op voor de ' + WEZENS[l.naam].naam + '!'
        : 'Lopen: ← →   Springen: spatie of ↑. Pas op voor de ' + WEZENS[l.naam].naam + '! Spring erbovenop om ze plat te maken.';
      if (allesKlaar && !l.voltooid) {
        l.voltooid = true;
        startFeest();
      }
    }

    function startFeest() {
      const snippers = [];
      for (let i = 0; i < 120; i++) {
        snippers.push({ x: canvas.width / 2, y: canvas.height * 0.4, vx: (Math.random() - 0.5) * 900, vy: -Math.random() * 700 - 100,
          draai: Math.random() * 6, kleur: ['#ff9ad5', '#fff6a8', '#9ae6ff', '#7ddc6a', '#ffb347'][i % 5] });
      }
      feest = { tijd: 4, snippers };
    }

    function tekenFeest() {
      if (!feest) return;
      for (const c of feest.snippers) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.draai);
        ctx.fillStyle = c.kleur;
        ctx.fillRect(-6, -3, 12, 6);
        ctx.restore();
      }
      tekenTekst('Planeet voltooid!', canvas.width / 2, canvas.height * 0.32, Math.min(canvas.width * 0.08, 60), '#ff9ad5');
    }

    // Kleine plaatjes van de spulletjes die je moet verzamelen
    function tekenDing(ding, x, y, r) {
      ctx.lineWidth = 3;
      ctx.strokeStyle = LIJN;
      ctx.lineJoin = 'round';
      if (ding === 'ijs' || ding === 'diamant') {
        ctx.fillStyle = ding === 'ijs' ? '#bff4ff' : '#ffffff';
        ctx.beginPath();
        ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.7, y - r * 0.2); ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.7, y - r * 0.2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - r * 0.7, y - r * 0.2); ctx.lineTo(x + r * 0.7, y - r * 0.2); ctx.stroke();
      } else if (ding === 'bliksem') {
        ctx.fillStyle = '#ffe14a';
        ctx.beginPath();
        ctx.moveTo(x + r * 0.2, y - r); ctx.lineTo(x - r * 0.5, y + r * 0.1); ctx.lineTo(x, y + r * 0.1);
        ctx.lineTo(x - r * 0.2, y + r); ctx.lineTo(x + r * 0.5, y - r * 0.15); ctx.lineTo(x, y - r * 0.15);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      } else if (ding === 'bloem') {
        for (let k = 0; k < 5; k++) {
          const a = k / 5 * Math.PI * 2 + tijd;
          cirkel(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.55, r * 0.45, '#ff8ac4', 2.5);
        }
        cirkel(x, y, r * 0.4, '#ffe14a', 2.5);
      } else {
        // Stenen: lava, maansteen of marssteen
        const kleur = { lava: '#ff7a3a', maansteen: '#e8e4f2', marssteen: '#d8553a' }[ding];
        ctx.fillStyle = kleur;
        ctx.beginPath();
        ctx.moveTo(x - r, y + r * 0.4); ctx.lineTo(x - r * 0.6, y - r * 0.6); ctx.lineTo(x + r * 0.3, y - r * 0.8);
        ctx.lineTo(x + r, y); ctx.lineTo(x + r * 0.6, y + r * 0.6); ctx.closePath();
        ctx.fill(); ctx.stroke();
        if (ding === 'lava') { ctx.strokeStyle = '#ffe14a'; ctx.beginPath(); ctx.moveTo(x - r * 0.4, y); ctx.lineTo(x + r * 0.4, y - r * 0.3); ctx.stroke(); }
      }
    }

    // Plekken die je moet bezoeken (vulkaan, vlag en boom staan al in het landschap)
    function tekenDoel(u, x, y, m) {
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = LIJN;
      if (u.doel === 'krater') {
        ctx.fillStyle = '#9a9088';
        ctx.beginPath(); ctx.ellipse(x, y + 4, m * 0.12, m * 0.035, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#7a7068';
        ctx.beginPath(); ctx.ellipse(x, y + 6, m * 0.08, m * 0.02, 0, 0, Math.PI * 2); ctx.fill();
      } else if (u.doel === 'sonde') {
        ctx.fillStyle = '#cfd6e6';
        ctx.beginPath(); ctx.roundRect(x - m * 0.04, y - m * 0.07, m * 0.08, m * 0.07, 6); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x - m * 0.04, y); ctx.lineTo(x - m * 0.06, y + 4); ctx.moveTo(x + m * 0.04, y); ctx.lineTo(x + m * 0.06, y + 4); ctx.stroke();
        cirkel(x, y - m * 0.1, m * 0.025, '#ffd84a', 3);
        ctx.beginPath(); ctx.moveTo(x, y - m * 0.07); ctx.lineTo(x, y - m * 0.075); ctx.stroke();
      } else if (u.doel === 'rover') {
        ctx.fillStyle = '#f2f2f2';
        ctx.beginPath(); ctx.roundRect(x - m * 0.06, y - m * 0.07, m * 0.12, m * 0.04, 6); ctx.fill(); ctx.stroke();
        for (const dx of [-0.045, 0, 0.045]) cirkel(x + dx * m, y - m * 0.018, m * 0.017, '#555', 3);
        ctx.beginPath(); ctx.moveTo(x + m * 0.03, y - m * 0.07); ctx.lineTo(x + m * 0.03, y - m * 0.12); ctx.stroke();
        cirkel(x + m * 0.03, y - m * 0.125, m * 0.015, '#9ae6ff', 3);
        cirkel(x + m * 0.035, y - m * 0.128, m * 0.005, LIJN);
      } else if (u.doel === 'rodeVlek' || u.doel === 'donkereVlek') {
        if (u.doel === 'donkereVlek') {
          ctx.save(); ctx.translate(x, y); ctx.scale(1, 0.5);
          cirkel(0, 0, m * 0.1, '#1d2a7a', 4);
          ctx.strokeStyle = '#5b7cff'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.arc(0, 0, m * 0.06, -tijd * 2, -tijd * 2 + Math.PI * 1.3); ctx.stroke();
          ctx.restore();
        }
      } else if (u.doel === 'zeshoek') {
        ctx.fillStyle = '#ffe9b0';
        ctx.beginPath();
        for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + tijd * 0.3; ctx.lineTo(x + Math.cos(a) * m * 0.08, y + Math.sin(a) * m * 0.08); }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        gezichtje(x, y + m * 0.01, m * 0.05, { fase: 2 });
      } else if (u.doel === 'ijswolk') {
        for (const [dx, dy, dr] of [[-0.05, 0, 0.04], [0, -0.02, 0.055], [0.05, 0, 0.04]]) cirkel(x + dx * m, y + dy * m, dr * m, '#e6fbff', 3.5);
        ctx.fillStyle = '#e6fbff';
        ctx.fillRect(x - m * 0.05, y - m * 0.01, m * 0.1, m * 0.035);
        gezichtje(x, y - m * 0.005, m * 0.04, { slaperig: true });
      }
      // Een pijltje erboven zolang je er nog niet bent geweest
      if (!u.klaar) {
        const py = y - m * 0.2 + Math.sin(tijd * 4) * 6;
        ctx.fillStyle = '#ff6fae';
        ctx.beginPath(); ctx.moveTo(x - 12, py - 14); ctx.lineTo(x + 12, py - 14); ctx.lineTo(x, py + 4); ctx.closePath();
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillStyle = '#fff6a8';
        sterVorm(x, y - m * 0.2, 14, 5, 0.5);
        ctx.fill(); ctx.stroke();
      }
    }

    // Waar is een wezen nu? (het midden van zijn lijf)
    function plekVanWezen(l, w) {
      const b = canvas.width, h = canvas.height, m = spelerMaat();
      const x = w.x * b;
      const soort = WEZENS[l.naam].soort;
      if (LANDSCHAPPEN[l.naam].gas) return { x, y: w.y * h + Math.sin(tijd * 2 + w.fase) * h * 0.05 };
      const grond = grondY(x);
      if (soort === 'springer') return { x, y: grond - m * 0.04 - Math.abs(Math.sin(tijd * 1.6 + w.fase)) * m * 0.3 };
      if (soort === 'vlieger') return { x, y: grond - m * (0.12 + 0.08 * Math.sin(tijd * 2.2 + w.fase)) };
      return { x, y: grond - m * 0.04 };
    }

    // Schattig maar gevaarlijk: boze wenkbrauwen en scherpe tandjes
    function tekenWezen(soortInfo, w, x, y, r) {
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = LIJN;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      const soort = soortInfo.soort;

      if (w.plat > 0) {
        // Plat getrapt: een pannenkoekje met kruisjes als oogjes
        ctx.fillStyle = soortInfo.kleur;
        ctx.beginPath(); ctx.ellipse(x, y + r * 0.7, r * 1.3, r * 0.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        for (const kant of [-1, 1]) {
          const ox = x + kant * r * 0.4, oy = y + r * 0.65;
          ctx.beginPath(); ctx.moveTo(ox - 4, oy - 3); ctx.lineTo(ox + 4, oy + 3); ctx.moveTo(ox + 4, oy - 3); ctx.lineTo(ox - 4, oy + 3); ctx.stroke();
        }
        ctx.restore();
        return;
      }

      // Pootjes, vleugels of slierten
      if (soort === 'loper') {
        const stap = Math.sin(tijd * 10 + w.fase) * r * 0.25;
        ctx.fillStyle = soortInfo.kleur;
        for (const kant of [-1, 1]) {
          ctx.beginPath(); ctx.ellipse(x + kant * r * 0.5 + kant * stap, y + r * 0.9, r * 0.3, r * 0.18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
      }
      if (soort === 'springer') {
        ctx.lineWidth = 3;
        for (const kant of [-1, 1]) {
          for (let k = 0; k < 3; k++) {
            ctx.beginPath();
            ctx.moveTo(x + kant * r * 0.5, y + r * 0.2);
            ctx.quadraticCurveTo(x + kant * r * (1.2 + k * 0.2), y - r * 0.3 + k * r * 0.2, x + kant * r * (1.3 + k * 0.25), y + r);
            ctx.stroke();
          }
        }
      }
      if (soort === 'vlieger') {
        const klap = Math.sin(tijd * 25 + w.fase) * 0.5;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (const kant of [-1, 1]) {
          ctx.save();
          ctx.translate(x + kant * r * 0.5, y - r * 0.6);
          ctx.rotate(kant * (0.6 + klap));
          ctx.beginPath(); ctx.ellipse(0, -r * 0.4, r * 0.35, r * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
      }
      if (soort === 'kwal') {
        ctx.strokeStyle = soortInfo.kleur;
        ctx.lineWidth = 5;
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.moveTo(x + k * r * 0.35, y + r * 0.3);
          for (let j = 1; j <= 4; j++) ctx.lineTo(x + k * r * 0.35 + Math.sin(tijd * 5 + j + k) * r * 0.15, y + r * 0.3 + j * r * 0.3);
          ctx.stroke();
        }
        ctx.strokeStyle = LIJN;
        ctx.lineWidth = 3;
      }

      // Lijf
      ctx.fillStyle = soortInfo.kleur;
      ctx.beginPath();
      if (soort === 'kwal') {
        ctx.arc(x, y + r * 0.3, r, Math.PI, 0);
        ctx.closePath();
      } else {
        ctx.ellipse(x, y, r * 1.05, r * 0.9, 0, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.stroke();
      // Wespenstreepjes
      if (soortInfo.naam === 'boze wespen') {
        ctx.save();
        ctx.beginPath(); ctx.ellipse(x, y, r * 1.05, r * 0.9, 0, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = LIJN;
        ctx.fillRect(x - r * 0.75, y - r, r * 0.25, r * 2);
        ctx.fillRect(x + r * 0.5, y - r, r * 0.25, r * 2);
        ctx.restore();
      }
      // Voelsprietjes voor marsmannetjes
      if (soortInfo.naam === 'marsmannetjes') {
        for (const kant of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(x + kant * r * 0.3, y - r * 0.8); ctx.lineTo(x + kant * r * 0.6, y - r * 1.5); ctx.stroke();
          cirkel(x + kant * r * 0.6, y - r * 1.55, r * 0.15, '#ff6fae', 2.5);
        }
      }

      // Boze oogjes die naar het mensje kijken
      const kijk = speler.x < x ? -1 : 1;
      const oy = soort === 'kwal' ? y - r * 0.15 : y - r * 0.2;
      for (const kant of [-1, 1]) {
        cirkel(x + kant * r * 0.38, oy, r * 0.26, '#fff', 2.5);
        cirkel(x + kant * r * 0.38 + kijk * r * 0.08, oy + r * 0.04, r * 0.12, LIJN);
        // Boze wenkbrauw
        ctx.beginPath();
        ctx.moveTo(x + kant * r * 0.65, oy - r * 0.42);
        ctx.lineTo(x + kant * r * 0.12, oy - r * 0.25);
        ctx.stroke();
      }
      // Mondje met tandjes
      const my = soort === 'kwal' ? y + r * 0.15 : y + r * 0.35;
      ctx.fillStyle = LIJN;
      ctx.beginPath(); ctx.ellipse(x, my, r * 0.35, r * 0.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      for (const dx of [-0.18, 0.18]) {
        ctx.beginPath();
        ctx.moveTo(x + dx * r - r * 0.08, my - r * 0.12);
        ctx.lineTo(x + dx * r + r * 0.08, my - r * 0.12);
        ctx.lineTo(x + dx * r, my + r * 0.04);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Hartjes bovenin: zoveel levens heb je nog
    function tekenHartje(x, y, r, vol) {
      ctx.beginPath();
      ctx.moveTo(x, y + r * 0.9);
      ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.8, y - r * 1.3, x, y - r * 0.45);
      ctx.bezierCurveTo(x + r * 0.8, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9);
      ctx.fillStyle = vol ? '#ff4f6d' : 'rgba(255,255,255,0.35)';
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = LIJN;
      ctx.stroke();
    }

    function tekenLevens() {
      const m = spelerMaat(), r = m * 0.022;
      for (let i = 0; i < MAX_LEVENS; i++) {
        tekenHartje(canvas.width / 2 + (i - 1) * r * 2.8, canvas.height * 0.22, r, i < levens);
      }
    }

    function tekenSpel(l) {
      maakUitdagingen(l);
      const m = spelerMaat();
      for (const u of l.uitdagingen) {
        if (u.type !== 'bezoek') continue;
        const p = plekVanDoel(u);
        tekenDoel(u, p.x, p.y, m);
      }
      for (const d of l.spulletjes) {
        if (d.gepakt) continue;
        const p = plekVanDing(l, d);
        tekenDing(d.ding, p.x, p.y + Math.sin(tijd * 3 + d.x * 10) * 4, m * 0.03);
      }
      for (const g of glitters) {
        ctx.globalAlpha = Math.max(g.leven, 0);
        ctx.fillStyle = g.kleur;
        sterVorm(g.x, g.y, 6 * g.leven + 2, 5, 0.5);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      for (const w of l.wezens) {
        const p = plekVanWezen(l, w);
        tekenWezen(WEZENS[l.naam], w, p.x, p.y, m * 0.045);
      }
      // Het mensje zelf; als het loopt wiebelt het een beetje, na een tik knippert het
      const huppel = speler.loopt && speler.opGrond ? Math.abs(Math.sin(tijd * 12)) * m * 0.01 : 0;
      if (onkwetsbaar <= 0 || Math.floor(tijd * 12) % 2 === 0) {
        tekenPoppetje(speler.x, speler.y - huppel, m * 0.0017, speler.richting);
      }
      if (auTekst > 0) {
        tekenTekst(levens === MAX_LEVENS ? 'Au! Opnieuw beginnen...' : 'Au!', speler.x, speler.y - m * 0.24, m * 0.05, '#ff6f6f');
      }
      tekenLevens();
    }

    window.addEventListener('keydown', (e) => {
      toetsen[e.key] = true;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
    });
