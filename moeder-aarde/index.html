    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    // Knop om weer de ruimte in te gaan
    function terugKnop() {
      const kb = Math.min(canvas.width * 0.6, 300), kh = Math.min(kb * 0.22, 60);
      return { x: canvas.width / 2 - kb / 2, y: canvas.height - Math.min(canvas.width, canvas.height) * 0.06 - kh - 24, b: kb, h: kh };
    }
    function opTerugKnop(x, y) {
      const k = terugKnop();
      return x >= k.x && x <= k.x + k.b && y >= k.y && y <= k.y + k.h;
    }
    function tekenTerugKnop() {
      const k = terugKnop();
      const erop = opTerugKnop(muis.x, muis.y);
      ctx.save();
      ctx.translate(k.x + k.b / 2, k.y + k.h / 2);
      const schaal = erop ? 1.07 : 1;
      ctx.scale(schaal, schaal);
      ctx.lineWidth = 4;
      ctx.strokeStyle = LIJN;
      ctx.fillStyle = '#4a57c2';
      ctx.beginPath(); ctx.roundRect(-k.b / 2, -k.h / 2 + 6, k.b, k.h, k.h / 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#8fa2ff';
      ctx.beginPath(); ctx.roundRect(-k.b / 2, -k.h / 2, k.b, k.h, k.h / 2); ctx.fill(); ctx.stroke();
      ctx.restore();
      tekenTekst('Terug de ruimte in', k.x + k.b / 2, k.y + k.h / 2 + 2, k.h * 0.45, '#ffffff');
    }

    // Door de ogen van het mensje: je kijkt door je ruimtehelm en de planeet komt steeds dichterbij
    function tekenDoorJeOgen() {
      const b = canvas.width, h = canvas.height;
      const mx = b / 2, my = h / 2;
      const t = Math.min(poppetje.reis.t, 1);
      const maat = Math.min(b, h);
      const schud = Math.sin(tijd * 30) * 1.5 * t;

      tekenRuimte();
      ctx.fillStyle = 'rgba(27,20,64,0.55)';
      ctx.fillRect(0, 0, b, h);

      // Suizende sterren: streepjes vanuit het midden naar buiten
      ctx.lineCap = 'round';
      const lang = Math.hypot(b, h) / 2;
      for (const st of suisSterren) {
        const a = st.afstand * lang, staart = a * (0.08 + t * 0.25);
        ctx.strokeStyle = st.kleur;
        ctx.globalAlpha = Math.min(1, st.afstand * 3);
        ctx.lineWidth = 1 + st.afstand * 4;
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(st.hoek) * (a - staart), my + Math.sin(st.hoek) * (a - staart));
        ctx.lineTo(mx + Math.cos(st.hoek) * a, my + Math.sin(st.hoek) * a);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // Het doel groeit van een stipje tot een reus die het hele raam vult
      const groei = 0.02 + 0.5 * t * t * t;
      tekenLichaam(poppetje.reis.naar, { x: mx + schud, y: my + schud, r: maat * groei }, true);

      tekenTekst('Op weg naar ' + poppetje.reis.naar.naam + '!', mx, h * 0.14, Math.min(b * 0.06, 40));

      tekenHelm();
    }

    function draw() {
      // Tijdens een reis zie je alles door je eigen ogen; aan het begin en eind vervaagt het naar het overzicht
      if (poppetje.reis) {
        const t = poppetje.reis.t;
        const zicht = Math.max(0, Math.min(1, t / 0.12, (1 - t) / 0.12));
        if (zicht >= 1) { tekenDoorJeOgen(); return; }
        if (t < 0.5) tekenOverzicht();
        else tekenLandschap(poppetje.reis.naar);
        // Het oog-beeld eerst op een los canvas tekenen, en dat doorzichtig over het overzicht leggen
        laag.width = canvas.width;
        laag.height = canvas.height;
        ctx = laag.getContext('2d');
        tekenDoorJeOgen();
        ctx = schermCtx;
        ctx.globalAlpha = zicht;
        ctx.drawImage(laag, 0, 0);
        ctx.globalAlpha = 1;
        return;
      }
      if (kijkModus === 'landschap') tekenLandschap(poppetje.waar);
      else tekenOverzicht();
    }

    function tekenOverzicht() {
      tekenRuimte();
      tekenBanen();
      // Van achter (hoog op het scherm) naar voor tekenen, zodat planeten netjes achter de zon langs gaan
      const opVolgorde = [...lichamen].sort((a, b) => plekVan(a).y - plekVan(b).y);
      for (const l of opVolgorde) tekenLichaam(l);
      tekenReis();
      if (!gestart) tekenStartscherm();
    }

    let vorige = performance.now();
    function loop(nu) {
      update(Math.min((nu - vorige) / 1000, 0.05));
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
