<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moeder-aarde</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1440; color: #fff; font-family: 'Fredoka', sans-serif; }
    canvas { display: block; background: #1b1440; }
    #info {
      position: fixed; top: 16px; right: 16px; width: min(320px, calc(100vw - 32px)); box-sizing: border-box;
      background: #fff7fb; color: #2a1b4a; border: 4px solid #2a1b4a; border-radius: 24px;
      box-shadow: 0 7px 0 #2a1b4a; padding: 16px 18px 14px; font-family: 'Fredoka', sans-serif;
      animation: plop 0.35s cubic-bezier(.3,1.6,.5,1);
    }
    #info[hidden] { display: none; }
    @keyframes plop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #info h2 { margin: 0 0 4px; font-size: 30px; display: flex; align-items: center; gap: 10px; }
    #info .bol { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #2a1b4a; flex: none; }
    #info .melding { margin: 0 0 10px; color: #c2357a; font-size: 17px; }
    #info .melding:empty { display: none; }
    #info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 17px; }
    #info dt { font-weight: 700; }
    #info dd { margin: 0; }
    #info .weetje { margin: 12px 0 0; padding: 10px 12px; background: #fff0a8; border: 3px solid #2a1b4a; border-radius: 16px; font-size: 16px; }
    #sluit {
      position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #2a1b4a; background: #ffb3d9; color: #2a1b4a; font: 700 18px 'Fredoka', sans-serif; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="info" hidden>
    <button id="sluit" aria-label="Sluiten">✕</button>
    <h2><span class="bol"></span><span class="naam"></span></h2>
    <p class="melding"></p>
    <dl></dl>
    <p class="weetje"></p>
  </div>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Cartoon-stijl: één donkere lijnkleur voor alle randen
    const LIJN = '#2a1b4a';
    const FONT = "'Fredoka', sans-serif";

    let tijd = 0;
    let gestart = false;   // wordt true na een klik op START
    let muis = { x: -1, y: -1 };

    // Sterren op willekeurige plekken (0 tot 1, zodat ze meeschalen met het venster)
    const sterren = [];
    for (let i = 0; i < 160; i++) {
      sterren.push({
        x: Math.random(), y: Math.random(),
        grootte: Math.random() * 5 + 2,
        fase: Math.random() * Math.PI * 2,
        kleur: ['#fff6a8', '#ffffff', '#ffc8ec', '#b8f0ff'][Math.floor(Math.random() * 4)],
        vorm: Math.random() < 0.35 ? 'ster' : 'stip',
      });
    }

    // Nevels: zachte pastelwolken
    const nevels = [
      { x: 0.15, y: 0.8,  r: 0.35, kleur: '200,120,255' },
      { x: 0.85, y: 0.3,  r: 0.3,  kleur: '110,180,255' },
      { x: 0.7,  y: 0.9,  r: 0.25, kleur: '255,130,200' },
    ];

    // De zon staat in het midden. Afstand en grootte zijn in 'eenheden' (zie eenheid()),
    // niet op echte schaal, anders zou je de kleine planeten niet eens zien.
    const ZON = {
      naam: 'Zon', kleur: '#ffe066', grootte: 0.9, isZon: true,
      info: {
        'Temperatuur': 'ongeveer 5.500 °C aan de buitenkant',
        'Grootte': '1.392.000 km doorsnede',
        'Draait om zich heen in': 'ongeveer 27 dagen',
        'Soort': 'een ster, geen planeet',
      },
      weetje: 'In de zon passen wel 1 miljoen aardes!',
    };

    const planeten = [
      { naam: 'Mercurius', afstand: 1.7, grootte: 0.22, kleur: '#c9bfb5', uiterlijk: 'kraters', hoek: 0.5,
        info: { 'Temperatuur': '-180 °C in de nacht, 430 °C overdag', 'Grootte': '4.879 km doorsnede', 'Afstand tot de zon': '58 miljoen km', 'Een dag duurt': '176 aardse dagen', 'Een jaar duurt': '88 dagen', 'Manen': '0' },
        weetje: 'Mercurius is de kleinste planeet en staat het dichtst bij de zon.' },
      { naam: 'Venus', afstand: 2.35, grootte: 0.36, kleur: '#ffd59a', uiterlijk: 'wolken', hoek: 2.2,
        info: { 'Temperatuur': '465 °C, de heetste planeet!', 'Grootte': '12.104 km doorsnede', 'Afstand tot de zon': '108 miljoen km', 'Een dag duurt': '243 aardse dagen', 'Een jaar duurt': '225 dagen', 'Manen': '0' },
        weetje: 'Op Venus duurt een dag langer dan een jaar. En de zon komt op in het westen!' },
      { naam: 'Aarde', afstand: 3.05, grootte: 0.4, kleur: '#5ec8ff', uiterlijk: 'aarde', hoek: 4.4,
        info: { 'Temperatuur': 'gemiddeld 15 °C', 'Grootte': '12.742 km doorsnede', 'Afstand tot de zon': '150 miljoen km', 'Een dag duurt': '24 uur', 'Een jaar duurt': '365 dagen', 'Manen': '1' },
        weetje: 'De aarde is de enige planeet waarvan we weten dat er leven is. Hier woon jij!' },
      { naam: 'Mars', afstand: 3.75, grootte: 0.29, kleur: '#ff8a65', uiterlijk: 'kraters', hoek: 1.2,
        info: { 'Temperatuur': 'gemiddeld -65 °C', 'Grootte': '6.779 km doorsnede', 'Afstand tot de zon': '228 miljoen km', 'Een dag duurt': '24 uur en 37 minuten', 'Een jaar duurt': '687 dagen', 'Manen': '2' },
        weetje: 'Mars is rood door roest. Er staat de hoogste vulkaan van het zonnestelsel.' },
      { naam: 'Jupiter', afstand: 4.85, grootte: 0.72, kleur: '#ffcf8a', uiterlijk: 'strepen', hoek: 3.4,
        info: { 'Temperatuur': 'ongeveer -110 °C', 'Grootte': '139.820 km doorsnede', 'Afstand tot de zon': '778 miljoen km', 'Een dag duurt': '10 uur', 'Een jaar duurt': '12 jaar', 'Manen': '95' },
        weetje: 'Jupiter is de grootste planeet. De rode vlek is een storm die groter is dan de aarde!' },
      { naam: 'Saturnus', afstand: 5.95, grootte: 0.6, kleur: '#fff0a0', uiterlijk: 'ring', hoek: 5.5,
        info: { 'Temperatuur': 'ongeveer -140 °C', 'Grootte': '116.460 km doorsnede', 'Afstand tot de zon': '1,4 miljard km', 'Een dag duurt': '10,5 uur', 'Een jaar duurt': '29 jaar', 'Manen': '274' },
        weetje: 'Saturnus is zo licht dat hij zou blijven drijven in een heel groot bad water.' },
      { naam: 'Uranus', afstand: 6.95, grootte: 0.46, kleur: '#a6f0ee', uiterlijk: 'schuineRing', hoek: 0.2,
        info: { 'Temperatuur': 'ongeveer -195 °C', 'Grootte': '50.724 km doorsnede', 'Afstand tot de zon': '2,9 miljard km', 'Een dag duurt': '17 uur', 'Een jaar duurt': '84 jaar', 'Manen': '29' },
        weetje: 'Uranus ligt op zijn kant en rolt zo om de zon heen.' },
      { naam: 'Neptunus', afstand: 7.8, grootte: 0.45, kleur: '#6f8cff', uiterlijk: 'wolken', hoek: 2.8,
        info: { 'Temperatuur': 'ongeveer -200 °C', 'Grootte': '49.244 km doorsnede', 'Afstand tot de zon': '4,5 miljard km', 'Een dag duurt': '16 uur', 'Een jaar duurt': '165 jaar', 'Manen': '16' },
        weetje: 'Op Neptunus waait de hardste wind van het zonnestelsel: wel 2.000 km per uur!' },
    ];
    // Hoe verder weg, hoe langzamer een planeet om de zon draait (net als in het echt)
    for (const p of planeten) p.snelheid = 0.25 / Math.pow(p.afstand / 1.7, 1.5);

    const AARDE = planeten[2];
    const MAAN = {
      naam: 'Maan', kleur: '#e8e4f2', grootte: 0.13, uiterlijk: 'kraters', hoek: 0, snelheid: 1, isMaan: true,
      info: { 'Temperatuur': '-170 °C in de nacht, 120 °C overdag', 'Grootte': '3.474 km doorsnede', 'Afstand tot de aarde': '384.000 km', 'Een dag duurt': '29,5 aardse dagen', 'Rondje om de aarde': '27 dagen' },
      weetje: 'In 1969 liepen er voor het eerst mensen op de maan.',
    };
    const lichamen = [ZON, ...planeten, MAAN];

    // Vallende sterren
    const vallendeSterren = [];

    // Het poppetje staat op 'waar' (een planeet of de maan). Tijdens een reis vliegt het van 'van' naar 'naar'.
    const poppetje = { sprong: 0, sprongSnelheid: 0, waar: AARDE, reis: null };
    const REISTIJD = 1.6;   // seconden
    const glitters = [];    // sterretjes die het poppetje achterlaat tijdens het vliegen
    let gekozen = null;     // het hemellichaam waarvan je het kaartje ziet

    function update(dt) {
      tijd += dt;
      for (const p of planeten) p.hoek += p.snelheid * dt;
      MAAN.hoek += MAAN.snelheid * dt;

      // Af en toe een nieuwe vallende ster
      if (Math.random() < dt * 0.4) {
        vallendeSterren.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height * 0.5, leven: 1 });
      }
      for (const v of vallendeSterren) {
        v.x += 500 * dt;
        v.y += 250 * dt;
        v.leven -= dt;
      }
      for (let i = vallendeSterren.length - 1; i >= 0; i--) {
        if (vallendeSterren[i].leven <= 0) vallendeSterren.splice(i, 1);
      }

      // Reis naar een andere planeet
      if (poppetje.reis) {
        poppetje.reis.t += dt / REISTIJD;
        const plek = reisPositie();
        if (Math.random() < 0.8) {
          glitters.push({ x: plek.x + (Math.random() - 0.5) * 10, y: plek.y - Math.random() * 20, leven: 1,
            kleur: ['#fff6a8', '#ff9ad5', '#9ae6ff'][Math.floor(Math.random() * 3)] });
        }
        if (poppetje.reis.t >= 1) {
          poppetje.waar = poppetje.reis.naar;
          poppetje.reis = null;
          // Blij hupje bij aankomst
          poppetje.sprong = 0.01;
          poppetje.sprongSnelheid = 2;
        }
      }
      for (const g of glitters) { g.leven -= dt * 1.5; g.y += 15 * dt; }
      for (let i = glitters.length - 1; i >= 0; i--) if (glitters[i].leven <= 0) glitters.splice(i, 1);

      // Sprong van het poppetje
      if (poppetje.sprong > 0 || poppetje.sprongSnelheid > 0) {
        poppetje.sprong += poppetje.sprongSnelheid * dt;
        poppetje.sprongSnelheid -= 9 * dt;
        if (poppetje.sprong <= 0) { poppetje.sprong = 0; poppetje.sprongSnelheid = 0; }
      }
    }

    // ---------- hulpjes ----------

    function cirkel(x, y, r, vul, rand) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      if (vul) { ctx.fillStyle = vul; ctx.fill(); }
      if (rand) { ctx.lineWidth = rand; ctx.strokeStyle = LIJN; ctx.stroke(); }
    }

    function sterVorm(x, y, r, punten, binnen) {
      ctx.beginPath();
      for (let i = 0; i < punten * 2; i++) {
        const hoek = -Math.PI / 2 + i * Math.PI / punten;
        const afstand = i % 2 === 0 ? r : r * binnen;
        ctx.lineTo(x + Math.cos(hoek) * afstand, y + Math.sin(hoek) * afstand);
      }
      ctx.closePath();
    }

    // Een schattig gezichtje: ogen met glimmetje, blosjes en een glimlach
    function gezichtje(x, y, r, opties = {}) {
      const knipper = (Math.sin(tijd * 1.3 + (opties.fase || 0)) > 0.985);
      const oogX = r * 0.35, oogY = -r * 0.05, oogR = r * 0.14;
      ctx.lineCap = 'round';

      if (opties.slaperig || knipper) {
        // Dichte oogjes als boogjes
        ctx.strokeStyle = LIJN;
        ctx.lineWidth = Math.max(2, r * 0.07);
        for (const kant of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(x + kant * oogX, y + oogY, oogR * 0.8, Math.PI * 0.15, Math.PI * 0.85);
          ctx.stroke();
        }
      } else if (opties.blij) {
        // ^^ oogjes
        ctx.strokeStyle = LIJN;
        ctx.lineWidth = Math.max(2, r * 0.07);
        for (const kant of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(x + kant * oogX, y + oogY + oogR * 0.5, oogR * 0.8, Math.PI * 1.15, Math.PI * 1.85);
          ctx.stroke();
        }
      } else {
        for (const kant of [-1, 1]) {
          cirkel(x + kant * oogX, y + oogY, oogR, LIJN);
          cirkel(x + kant * oogX - oogR * 0.3, y + oogY - oogR * 0.35, oogR * 0.4, '#fff');
        }
      }

      // Blosjes
      ctx.fillStyle = 'rgba(255,110,150,0.55)';
      for (const kant of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(x + kant * r * 0.55, y + r * 0.2, r * 0.14, r * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Mondje
      ctx.strokeStyle = LIJN;
      ctx.lineWidth = Math.max(2, r * 0.06);
      ctx.beginPath();
      ctx.arc(x, y + r * 0.15, r * 0.12, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }

    // ---------- ruimte ----------

    function tekenRuimte() {
      const b = canvas.width, h = canvas.height;
      const lucht = ctx.createLinearGradient(0, 0, 0, h);
      lucht.addColorStop(0, '#1b1440');
      lucht.addColorStop(1, '#3a2470');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      // Nevels
      for (const n of nevels) {
        const r = n.r * Math.max(b, h);
        const g = ctx.createRadialGradient(n.x * b, n.y * h, 0, n.x * b, n.y * h, r);
        g.addColorStop(0, 'rgba(' + n.kleur + ',0.3)');
        g.addColorStop(1, 'rgba(' + n.kleur + ',0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, b, h);
      }

      // Twinkelende sterren: stipjes en schattige vijfpuntsterren
      for (const s of sterren) {
        const fel = 0.6 + 0.4 * Math.sin(tijd * 2 + s.fase);
        ctx.globalAlpha = fel;
        ctx.fillStyle = s.kleur;
        if (s.vorm === 'ster') {
          sterVorm(s.x * b, s.y * h, s.grootte * (0.8 + 0.3 * fel), 5, 0.5);
          ctx.fill();
        } else {
          cirkel(s.x * b, s.y * h, s.grootte * 0.35, s.kleur);
        }
      }
      ctx.globalAlpha = 1;

      // Spiraalstelsel als snoepje, draait langzaam
      const gx = b * 0.15, gy = h * 0.2, gr = Math.min(b, h) * 0.1;
      ctx.lineCap = 'round';
      for (let arm = 0; arm < 2; arm++) {
        ctx.beginPath();
        for (let i = 0; i <= 60; i++) {
          const t = i / 60;
          const hoek = arm * Math.PI + t * Math.PI * 2.5 + tijd * 0.3;
          ctx.lineTo(gx + Math.cos(hoek) * t * gr, gy + Math.sin(hoek) * t * gr * 0.6);
        }
        ctx.strokeStyle = arm === 0 ? 'rgba(255,170,230,0.8)' : 'rgba(180,170,255,0.8)';
        ctx.lineWidth = gr * 0.12;
        ctx.stroke();
      }
      cirkel(gx, gy, gr * 0.15, '#fff3c4');

      // Vallende sterren met een regenboogstaartje
      for (const v of vallendeSterren) {
        ctx.globalAlpha = v.leven;
        ctx.lineCap = 'round';
        const kleuren = ['#ff9ad5', '#ffe17a', '#9ae6ff'];
        kleuren.forEach((k, i) => {
          ctx.strokeStyle = k;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(v.x, v.y + (i - 1) * 4);
          ctx.lineTo(v.x - 70, v.y - 35 + (i - 1) * 4);
          ctx.stroke();
        });
        ctx.fillStyle = '#fff6a8';
        sterVorm(v.x, v.y, 9, 5, 0.5);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

    }

    // De zon met draaiende stralen en een blij gezicht
    function tekenZon(x, y, r) {
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 2.6);
      gloed.addColorStop(0, 'rgba(255,220,100,0.45)');
      gloed.addColorStop(1, 'rgba(255,180,60,0)');
      ctx.fillStyle = gloed;
      cirkel(x, y, r * 2.6, gloed);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(tijd * 0.3);
      ctx.fillStyle = '#ffb347';
      ctx.strokeStyle = LIJN;
      ctx.lineWidth = 3;
      ctx.lineJoin = 'round';
      sterVorm(0, 0, r * 1.45, 12, 0.72);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      cirkel(x, y, r, '#ffe066', 3);
      gezichtje(x, y + r * 0.05, r, { blij: true });
    }

    // ---------- zonnestelsel ----------

    // Banen zijn platte ellipsen, alsof je er schuin op kijkt
    const PLAT = 0.42;

    // Eén eenheid in pixels, zo gekozen dat Neptunus nog net op het scherm past
    function eenheid() {
      return Math.min(canvas.width * 0.46, canvas.height * 0.44 / PLAT) / 7.8;
    }

    // Waar staat een hemellichaam nu op het scherm, en hoe groot is het?
    function plekVan(lichaam) {
      const mx = canvas.width / 2, my = canvas.height / 2, e = eenheid();
      if (lichaam.isZon) return { x: mx, y: my, r: ZON.grootte * e };
      if (lichaam.isMaan) {
        const a = plekVan(AARDE);
        return {
          x: a.x + Math.cos(MAAN.hoek) * a.r * 2.1,
          y: a.y + Math.sin(MAAN.hoek) * a.r * 0.9,
          r: MAAN.grootte * e,
        };
      }
      return {
        x: mx + Math.cos(lichaam.hoek) * lichaam.afstand * e,
        y: my + Math.sin(lichaam.hoek) * lichaam.afstand * e * PLAT,
        r: lichaam.grootte * e,
      };
    }

    // Plek van de voetjes tijdens de reis: een boog van het ene naar het andere hemellichaam
    function reisPositie() {
      const t = Math.min(poppetje.reis.t, 1);
      const zacht = t * t * (3 - 2 * t);
      const a = plekVan(poppetje.reis.van), b = plekVan(poppetje.reis.naar);
      const ax = a.x, ay = a.y - a.r, bx = b.x, by = b.y - b.r;
      return {
        x: ax + (bx - ax) * zacht,
        y: ay + (by - ay) * zacht - Math.sin(Math.PI * t) * eenheid() * 1.3,
      };
    }

    function tekenBanen() {
      const mx = canvas.width / 2, my = canvas.height / 2, e = eenheid();
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 10]);
      for (const p of planeten) {
        ctx.beginPath();
        ctx.ellipse(mx, my, p.afstand * e, p.afstand * e * PLAT, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }

    function tekenRing(x, y, pr, voorkant, kanteling, breedte, hoogte) {
      const van = voorkant ? 0 : Math.PI, tot = voorkant ? Math.PI : Math.PI * 2;
      ctx.lineCap = 'round';
      ctx.lineWidth = pr * 0.22;
      ctx.strokeStyle = LIJN;
      ctx.beginPath();
      ctx.ellipse(x, y, pr * breedte, pr * hoogte, kanteling, van, tot);
      ctx.stroke();
      ctx.lineWidth = pr * 0.14;
      ctx.strokeStyle = kanteling > 1 ? '#d6fffd' : '#ffb3d9';
      ctx.beginPath();
      ctx.ellipse(x, y, pr * breedte, pr * hoogte, kanteling, van, tot);
      ctx.stroke();
    }

    // Landen als ronde vlekjes op de aarde
    const landen = [
      { x: -0.4,  y: -0.45, r: 0.3 },
      { x: -0.15, y: -0.65, r: 0.22 },
      { x: -0.7,  y: 0.1,   r: 0.22 },
      { x: 0.55,  y: -0.35, r: 0.25 },
      { x: 0.7,   y: 0.15,  r: 0.2 },
      { x: 0.35,  y: 0.7,   r: 0.2 },
      { x: -0.4,  y: 0.65,  r: 0.18 },
    ];

    function tekenLichaam(l) {
      const { x, y, r } = plekVan(l);
      const bezoek = poppetje.waar === l && !poppetje.reis;

      // Gekozen hemellichaam krijgt een kloppend stippelrondje
      if (l === gekozen) {
        ctx.strokeStyle = '#fff6a8';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 7]);
        ctx.lineDashOffset = -tijd * 20;
        cirkel(x, y, r * (l.isZon ? 1.7 : 1.35) + 6 + Math.sin(tijd * 5) * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (l.isZon) { tekenZon(x, y, r); return; }

      if (l.uiterlijk === 'ring') tekenRing(x, y, r, false, -0.3, 1.9, 0.5);
      if (l.uiterlijk === 'schuineRing') tekenRing(x, y, r, false, 1.4, 1.6, 0.35);

      ctx.save();
      cirkel(x, y, r, l.kleur);
      ctx.clip();
      if (l.uiterlijk === 'aarde') {
        for (const land of landen) {
          cirkel(x + land.x * r, y + land.y * r, land.r * r, '#7ddc6a');
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#4fae4a';
          ctx.stroke();
        }
      }
      if (l.uiterlijk === 'kraters') {
        const krater = l.naam === 'Mars' ? '#e0684a' : 'rgba(0,0,0,0.12)';
        cirkel(x - r * 0.45, y - r * 0.5, r * 0.2, krater);
        cirkel(x + r * 0.5, y + r * 0.45, r * 0.16, krater);
        cirkel(x - r * 0.55, y + r * 0.55, r * 0.12, krater);
      }
      if (l.uiterlijk === 'strepen') {
        ctx.fillStyle = '#f2a65a';
        for (let i = -2; i <= 2; i += 2) ctx.fillRect(x - r, y + i * r * 0.4 - r * 0.1, r * 2, r * 0.2);
        ctx.fillStyle = '#e0563a';
        ctx.beginPath(); ctx.ellipse(x + r * 0.45, y + r * 0.55, r * 0.2, r * 0.11, 0, 0, Math.PI * 2); ctx.fill();
      }
      if (l.uiterlijk === 'wolken') {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = r * 0.12;
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath();
          ctx.arc(x + i * r * 0.3, y + i * r * 0.55, r * 0.5, Math.PI * 1.1, Math.PI * 1.6);
          ctx.stroke();
        }
      }
      // Glimmetje
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.ellipse(x - r * 0.4, y - r * 0.5, r * 0.28, r * 0.13, -0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      cirkel(x, y, r, null, 3);

      gezichtje(x, y + r * 0.1, r * 0.8, {
        slaperig: l.isMaan && !bezoek,
        blij: bezoek,
        fase: l.afstand || 7,
      });

      if (l.uiterlijk === 'ring') tekenRing(x, y, r, true, -0.3, 1.9, 0.5);
      if (l.uiterlijk === 'schuineRing') tekenRing(x, y, r, true, 1.4, 1.6, 0.35);

      if (bezoek) tekenPoppetje(x, y - r);
    }

    // Een klein mensje dat bovenop de aarde staat en zwaait
    function tekenPoppetje(x, voetY) {
      const e = eenheid();
      const s = e * 0.0045;                    // schaal: poppetje groeit mee met het zonnestelsel
      const wiebel = Math.sin(tijd * 3) * 2 * s;
      const y = voetY - poppetje.sprong * e * 0.5 + wiebel;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(s, s);
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = LIJN;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';

      // Schoentjes
      ctx.fillStyle = '#ff6f6f';
      ctx.beginPath(); ctx.ellipse(-8, -3, 8, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(8, -3, 8, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      // Spijkerbroek
      ctx.fillStyle = '#4a7bd8';
      ctx.beginPath(); ctx.roundRect(-12, -24, 10, 20, 4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(2, -24, 10, 20, 4); ctx.fill(); ctx.stroke();

      // Armpje links omlaag, rechts zwaait (in een geel shirt-mouwtje)
      const zwaai = Math.sin(tijd * 8) * 0.4;
      const hx = 14 + Math.cos(-1.1 + zwaai) * 16, hy = -38 + Math.sin(-1.1 + zwaai) * 16;
      for (const [ax, ay, bx, by] of [[-14, -38, -24, -24], [14, -38, hx, hy]]) {
        ctx.lineWidth = 9; ctx.strokeStyle = LIJN;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
        ctx.lineWidth = 5.5; ctx.strokeStyle = '#ffd1a8';
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      }
      ctx.lineWidth = 3.5;
      ctx.strokeStyle = LIJN;

      // T-shirt met een sterretje
      ctx.fillStyle = '#ffd84a';
      ctx.beginPath(); ctx.roundRect(-16, -46, 32, 26, 9); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ff8ac4';
      sterVorm(0, -33, 6, 5, 0.5);
      ctx.lineWidth = 2;
      ctx.fill(); ctx.stroke();
      ctx.lineWidth = 3.5;

      // Hoofd met oortjes
      cirkel(-21, -62, 5, '#ffd1a8', 3);
      cirkel(21, -62, 5, '#ffd1a8', 3);
      cirkel(0, -64, 22, '#ffd1a8', 3.5);

      // Kort bruin haar met een kuifje
      ctx.fillStyle = '#6b4226';
      ctx.beginPath();
      ctx.arc(0, -64, 22, Math.PI * 1.08, Math.PI * 1.92);
      ctx.quadraticCurveTo(10, -76, 0, -73);
      ctx.quadraticCurveTo(-10, -74, -20, -70);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-2, -86);
      ctx.quadraticCurveTo(4, -96, 10, -92);
      ctx.quadraticCurveTo(4, -90, 3, -85);
      ctx.fill();
      ctx.stroke();

      gezichtje(0, -60, 20, { blij: poppetje.sprong > 0, fase: 1 });
      ctx.restore();
    }

    // ---------- startscherm ----------

    function startKnop() {
      const b = Math.min(canvas.width * 0.5, 260), h = b * 0.32;
      return { x: canvas.width / 2 - b / 2, y: canvas.height * 0.82 - h / 2, b, h };
    }

    function opKnop(x, y) {
      const k = startKnop();
      return x >= k.x && x <= k.x + k.b && y >= k.y && y <= k.y + k.h;
    }

    function tekenStartscherm() {
      // Titel
      const tg = Math.min(canvas.width * 0.09, 64);
      const ty = canvas.height * 0.1 + Math.sin(tijd * 2) * 4;
      ctx.font = '700 ' + tg + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = tg * 0.18;
      ctx.strokeStyle = LIJN;
      ctx.strokeText('Moeder Aarde', canvas.width / 2, ty);
      const tk = ctx.createLinearGradient(0, ty - tg / 2, 0, ty + tg / 2);
      tk.addColorStop(0, '#fff6a8');
      tk.addColorStop(1, '#ff9ad5');
      ctx.fillStyle = tk;
      ctx.fillText('Moeder Aarde', canvas.width / 2, ty);

      // Knop die zachtjes klopt, en groter wordt als de muis erop staat
      const k = startKnop();
      const erop = opKnop(muis.x, muis.y);
      const puls = 1 + Math.sin(tijd * 4) * 0.03 + (erop ? 0.08 : 0);
      const cx = k.x + k.b / 2, cy = k.y + k.h / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(puls, puls);
      // Schaduwrandje onder
      ctx.fillStyle = '#c2357a';
      ctx.beginPath(); ctx.roundRect(-k.b / 2, -k.h / 2 + 7, k.b, k.h, k.h / 2); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = LIJN; ctx.stroke();
      // Knop zelf
      const kg = ctx.createLinearGradient(0, -k.h / 2, 0, k.h / 2);
      kg.addColorStop(0, '#ffb3d9');
      kg.addColorStop(1, '#ff6fae');
      ctx.fillStyle = kg;
      ctx.beginPath(); ctx.roundRect(-k.b / 2, -k.h / 2, k.b, k.h, k.h / 2); ctx.fill(); ctx.stroke();
      // Glimmetje
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.roundRect(-k.b / 2 + k.h * 0.4, -k.h / 2 + 6, k.b * 0.35, k.h * 0.18, 6); ctx.fill();
      // Tekst
      const fg = k.h * 0.55;
      ctx.font = '700 ' + fg + 'px ' + FONT;
      ctx.lineWidth = fg * 0.18;
      ctx.strokeStyle = LIJN;
      ctx.strokeText('START', 0, 3);
      ctx.fillStyle = '#fff';
      ctx.fillText('START', 0, 3);
      // Sterretjes naast de tekst
      ctx.fillStyle = '#fff6a8';
      ctx.lineWidth = 2.5;
      for (const kant of [-1, 1]) {
        sterVorm(kant * k.b * 0.36, 0, k.h * 0.18, 5, 0.5);
        ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    // Op welk hemellichaam wordt geklikt? Wat vooraan (lager op het scherm) staat telt eerst.
    function lichaamOp(x, y) {
      const opVolgorde = [...lichamen].sort((a, b) => plekVan(b).y - plekVan(a).y);
      for (const l of opVolgorde) {
        const pl = plekVan(l);
        if (Math.hypot(x - pl.x, y - pl.y) <= Math.max(pl.r * 1.2, 18)) return l;
      }
      return null;
    }

    // Het kaartje met de eigenschappen invullen en laten zien
    const info = document.getElementById('info');
    function toonInfo(l, melding) {
      info.querySelector('.naam').textContent = l.naam;
      info.querySelector('.bol').style.background = l.kleur;
      info.querySelector('.melding').textContent = melding || '';
      const lijst = info.querySelector('dl');
      lijst.innerHTML = '';
      for (const [vraag, antwoord] of Object.entries(l.info)) {
        const dt = document.createElement('dt');
        dt.textContent = vraag;
        const dd = document.createElement('dd');
        dd.textContent = antwoord;
        lijst.append(dt, dd);
      }
      info.querySelector('.weetje').textContent = '⭐ ' + l.weetje;
      // Opnieuw laten 'ploppen'
      info.hidden = true;
      void info.offsetWidth;
      info.hidden = false;
    }
    document.getElementById('sluit').addEventListener('click', () => {
      info.hidden = true;
      gekozen = null;
    });

    canvas.addEventListener('mousemove', (e) => {
      muis = { x: e.clientX, y: e.clientY };
      const klikbaar = gestart ? lichaamOp(e.clientX, e.clientY) : opKnop(e.clientX, e.clientY);
      canvas.style.cursor = klikbaar ? 'pointer' : 'default';
    });

    canvas.addEventListener('click', (e) => {
      if (!gestart) {
        if (opKnop(e.clientX, e.clientY)) {
          gestart = true;
          canvas.style.cursor = 'default';
          poppetje.sprong = 0.01;
          poppetje.sprongSnelheid = 3;
        }
        return;
      }
      const doel = lichaamOp(e.clientX, e.clientY);
      if (!doel) return;
      gekozen = doel;
      if (doel.isZon) {
        toonInfo(doel, 'Au, veel te heet! Hier kun je niet landen.');
      } else if (doel === poppetje.waar) {
        toonInfo(doel, 'Hier sta je nu!');
      } else if (poppetje.reis) {
        toonInfo(doel, 'Even wachten, je bent nog onderweg.');
      } else {
        // Het poppetje vliegt erheen
        toonInfo(doel, 'Op weg naar ' + doel.naam + '!');
        poppetje.sprong = 0;
        poppetje.sprongSnelheid = 0;
        poppetje.reis = { van: poppetje.waar, naar: doel, t: 0 };
        poppetje.waar = null;
      }
    });

    function tekenReis() {
      for (const g of glitters) {
        ctx.globalAlpha = Math.max(g.leven, 0);
        ctx.fillStyle = g.kleur;
        sterVorm(g.x, g.y, 5 * g.leven + 2, 5, 0.5);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (poppetje.reis) {
        const plek = reisPositie();
        tekenPoppetje(plek.x, plek.y);
      }
    }

    function draw() {
      tekenRuimte();
      tekenBanen();
      // Van achter (hoog op het scherm) naar voor tekenen, zodat planeten netjes achter de zon langs gaan
      const opVolgorde = [...lichamen].sort((a, b) => plekVan(a).y - plekVan(b).y);
      for (const l of opVolgorde) tekenLichaam(l);
      tekenReis();
      if (!gestart) tekenStartscherm();
    }

    let vorige = performance.now();
    function loop(nu) {
      update(Math.min((nu - vorige) / 1000, 0.05));
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
