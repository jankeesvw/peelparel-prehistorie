<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>de-mammoet-jacht</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', () => {
      pasGrootteAan();
      maakLandschap();
    });

    let tijd = 0;   // seconden sinds de start, handig voor animaties
    let punten = 0; // je krijgt 5 punten als je de mammoet raakt tot hij neergaat
    let level = 1;
    let levelGehaald = false; // true als je op Enter mag drukken voor het volgende level
    let levelStart = 0;       // op welk moment het level begon

    // De mammoet staat in het midden van het scherm.
    const mammoet = {
      x: 0,
      y: 0,
      grootte: 200,
      leven: 100,
      kantel: 0,          // 0 = staat overeind, 1 = helemaal omgevallen
      kleur: '#8b5e3c',   // kleur van het lijf
      donker: '#6b4a2f',  // kleur van de benen, het oor en de staart
      zwerf: 0,           // hoe ver hij van het midden vandaan is gelopen
    };

    // De baby-mammoet loopt naast zijn moeder. Zelfde vorm, maar kleiner.
    const baby = {
      x: 0,
      y: 0,
      grootte: 90,
      leven: 100,
      kantel: 0,
      kleur: '#8b5e3c',
      donker: '#6b4a2f',
      stemming: 'blij',   // blij, huilt of boos
      rouwTijd: 0,        // seconden sinds mama neerging
    };

    // De oermens komt van links aanlopen met een speer.
    const oermens = {
      x: 80,
      y: 0,
      grootte: 120,
      snelheid: 300,  // pixels per seconde
      loopt: false,
      vlucht: false,  // true als de boze baby hem wegjaagt
      omver: false,   // true als de sabeltandtijger hem gepakt heeft
      hoogte: 0,      // hoe ver hij naar boven (min) of naar beneden (plus) staat
      worp: 0,        // 0 = speer naast zich, 1 = arm helemaal vooruit
      worpTijd: 0,    // loopt af tijdens een worp
      klaarOmTeGooien: false,
    };

    // De wolf jaagt mee met de oermens en blijft dicht bij hem in de buurt.
    const wolf = {
      x: 0,
      y: 0,
      grootte: 70,
      loopt: false,
      vlucht: false,
    };

    // Vanaf level 4 komt er een sabeltandtijger van rechts aansluipen.
    const tijger = {
      x: 0,
      y: 0,
      grootte: 175,
      actief: false,
      leven: 2,        // twee speren raken is genoeg
      vlucht: false,   // true als hij geraakt is en wegrent
      loopt: false,
      fase: 'sluipt',  // sluipt, springt of herstelt
      sprong: 0,       // 0 tot 1 tijdens de sprong
      sprongStartX: 0,
      doelX: 0,        // waar hij naartoe springt
      doelY: 0,        // op welke hoogte de jager stond bij de afzet
    };

    let gameOver = false;

    // Vanaf level 7 komt er een ruiter op een grote wolf, die speren naar je gooit.
    const rijwolf = { x: 0, y: 0, grootte: 150, loopt: false, kijktLinks: true };
    const ruiter = {
      x: 0,
      y: 0,
      actief: false,
      leven: 3,      // drie speren en hij geeft op
      vlucht: false,
      gooiTimer: 0,  // seconden tot zijn volgende worp
    };

    const vijandSperen = []; // de speren die hij naar jou gooit
    let levens = 3;            // raakt de tijger je, dan gaat er een leven af
    let speerVoorraad = 6;     // zoveel speren heb je nog om te gooien
    let stokken = 0;           // materiaal dat je onderweg oppakt
    let stenen = 0;
    let maakTimer = 0;         // korte pauze tussen twee wapens maken
    let melding = '';          // korte tekst die even in beeld blijft
    let meldingTijd = 0;

    function meld(tekst) {
      melding = tekst;
      meldingTijd = 1.8;
    }
    let uitbarsting = false;   // vanaf level 6 barst de vulkaan uit
    let steenTimer = 0;        // seconden tot de volgende vuursteen
    const vuurstenen = [];     // de brokken die door de lucht vliegen

    // De vulkaan staat altijd op dezelfde plek in het landschap.
    const vulkaanX = () => canvas.width * 0.22;
    const vulkaanHoogte = 230;

    // Stokken en stenen die op de grond liggen. Loop erover om ze op te pakken.
    const spullen = [];

    function nieuwePlek(spul) {
      const grondHoogte = canvas.height - horizonY();
      spul.x = 100 + Math.random() * Math.max(100, canvas.width - 200);
      spul.y = horizonY() + 30 + Math.random() * Math.max(60, grondHoogte - 70);
      spul.zichtbaar = true;
      spul.wachtTijd = 0;
      return spul;
    }

    function zetSpullenNeer() {
      spullen.length = 0;
      for (let i = 0; i < 6; i++) {
        // om en om een stok en een steen
        spullen.push(nieuwePlek({ soort: i % 2 === 0 ? 'stok' : 'steen' }));
      }
    }

    // Een broccoli die op de grond groeit. Pak hem op voor een extra leven.
    const broccoli = {
      x: 0,
      y: 0,
      zichtbaar: false,
      wachtTijd: 0, // seconden tot er een nieuwe opkomt
    };

    // De broccoli komt op een willekeurige plek op de grond te staan.
    function zetBroccoliNeer() {
      broccoli.x = 150 + Math.random() * Math.max(100, canvas.width - 300);
      broccoli.y = horizonY() + 50 + Math.random() * Math.max(60, canvas.height - horizonY() - 110);
      broccoli.zichtbaar = true;
    }

    const worpDuur = 0.3;      // seconden dat de worp-beweging duurt
    const zwaartekracht = 320; // hoe snel een speer naar beneden valt

    // Alle speren die gegooid zijn staan in deze lijst.
    const speren = [];

    function tekenWolf(w) {
      const s = w.grootte / 70;
      // Tijdens het lopen bewegen zijn poten heen en weer.
      const zwaai = w.loopt ? Math.sin(tijd * 12) * 7 : 0;

      ctx.save();
      ctx.translate(w.x, w.y);
      if (w.kijktLinks) ctx.scale(-1, 1); // hij kijkt de andere kant op
      ctx.scale(s, s);

      // poten
      ctx.strokeStyle = '#5d5a54';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-18, 8);
      ctx.lineTo(-18 - zwaai, 26);
      ctx.moveTo(-8, 8);
      ctx.lineTo(-8 + zwaai, 26);
      ctx.moveTo(14, 8);
      ctx.lineTo(14 + zwaai, 26);
      ctx.moveTo(24, 8);
      ctx.lineTo(24 - zwaai, 26);
      ctx.stroke();

      // staart
      ctx.strokeStyle = '#5d5a54';
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(-28, -2);
      ctx.quadraticCurveTo(-44, -6, -46, -20);
      ctx.stroke();

      // lijf
      ctx.fillStyle = '#7e7b74';
      ctx.beginPath();
      ctx.ellipse(0, 0, 30, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      // oren
      ctx.fillStyle = '#5d5a54';
      for (const oorX of [26, 36]) {
        ctx.beginPath();
        ctx.moveTo(oorX, -18);
        ctx.lineTo(oorX + 9, -22);
        ctx.lineTo(oorX + 4, -6);
        ctx.closePath();
        ctx.fill();
      }

      // kop
      ctx.fillStyle = '#7e7b74';
      ctx.beginPath();
      ctx.arc(32, -10, 13, 0, Math.PI * 2);
      ctx.fill();

      // snuit
      ctx.beginPath();
      ctx.moveTo(38, -14);
      ctx.lineTo(56, -6);
      ctx.lineTo(38, -2);
      ctx.closePath();
      ctx.fill();

      // neus en oog
      ctx.fillStyle = '#2b2925';
      ctx.beginPath();
      ctx.arc(55, -6, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(36, -13, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Een gloeiende brok die uit de vulkaan is geschoten.
    function tekenVuursteen(st) {
      ctx.fillStyle = 'rgba(240, 120, 40, 0.35)';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r * 1.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d2431c';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffd35e';
      ctx.beginPath();
      ctx.arc(st.x - st.r * 0.2, st.y - st.r * 0.2, st.r * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }

    function tekenSpul(spul) {
      if (spul.soort === 'stok') {
        ctx.strokeStyle = '#7a5230';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(spul.x - 18, spul.y + 4);
        ctx.lineTo(spul.x + 18, spul.y - 4);
        ctx.stroke();

        // een klein zijtakje
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(spul.x + 4, spul.y - 1);
        ctx.lineTo(spul.x + 12, spul.y - 12);
        ctx.stroke();
      } else {
        // een steen met een scherpe kant, goed voor een speerpunt
        ctx.fillStyle = '#8d8a83';
        ctx.beginPath();
        ctx.moveTo(spul.x - 12, spul.y + 6);
        ctx.lineTo(spul.x - 4, spul.y - 10);
        ctx.lineTo(spul.x + 12, spul.y - 2);
        ctx.lineTo(spul.x + 6, spul.y + 8);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#b3afa6';
        ctx.beginPath();
        ctx.moveTo(spul.x - 4, spul.y - 10);
        ctx.lineTo(spul.x + 12, spul.y - 2);
        ctx.lineTo(spul.x + 2, spul.y - 1);
        ctx.closePath();
        ctx.fill();
      }
    }

    function tekenBroccoli(b) {
      // steel
      ctx.fillStyle = '#8fbf5a';
      ctx.fillRect(b.x - 5, b.y - 14, 10, 18);

      // kroon: een paar bollen tegen elkaar
      ctx.fillStyle = '#2e7d3a';
      for (const bol of [{ x: -11, y: -20, r: 11 }, { x: 11, y: -20, r: 11 }, { x: 0, y: -30, r: 13 }]) {
        ctx.beginPath();
        ctx.arc(b.x + bol.x, b.y + bol.y, bol.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // lichte plekjes, dan lijkt hij op een echte broccoli
      ctx.fillStyle = '#4da555';
      for (const stip of [{ x: -12, y: -24 }, { x: 8, y: -25 }, { x: -2, y: -34 }]) {
        ctx.beginPath();
        ctx.arc(b.x + stip.x, b.y + stip.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // De ruiter zit op de rug van de grote wolf, met zijn speer naar voren.
    function tekenRuiter(r) {
      ctx.save();
      ctx.translate(r.x, r.y);
      if (r.vlucht) ctx.scale(-1, 1); // vluchten doet hij de andere kant op
      ctx.translate(-22, 0); // hij zit voorop, richting de nek van de wolf

      // zadel met franje
      ctx.fillStyle = '#8b5e3c';
      ctx.fillRect(-30, -44, 60, 18);
      ctx.fillStyle = '#5a4630';
      for (let i = -26; i <= 26; i += 9) {
        ctx.fillRect(i, -28, 5, 9);
      }

      // benen langs het zadel
      ctx.strokeStyle = '#3b2b1a';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-6, -50);
      ctx.lineTo(-26, -20);
      ctx.stroke();

      // lijf
      ctx.fillStyle = '#c98c5a';
      ctx.beginPath();
      ctx.ellipse(0, -62, 14, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      // berenvel
      ctx.fillStyle = '#5a4630';
      ctx.fillRect(-15, -54, 30, 14);

      // hoofd met haar
      ctx.fillStyle = '#c98c5a';
      ctx.beginPath();
      ctx.arc(-2, -96, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#2b2018';
      ctx.beginPath();
      ctx.arc(-2, -100, 14, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-10, -96, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // arm naar voren met een speer erin
      ctx.strokeStyle = '#c98c5a';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-4, -70);
      ctx.lineTo(-24, -76);
      ctx.stroke();

      ctx.strokeStyle = '#7a5230';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(10, -66);
      ctx.lineTo(-56, -84);
      ctx.stroke();

      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath();
      ctx.moveTo(-56, -84);
      ctx.lineTo(-44, -90);
      ctx.lineTo(-45, -77);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function tekenTijger(t) {
      const s = t.grootte / 110;
      // Tijdens de sprong staan zijn poten gestrekt, tijdens het sluipen zwaaien ze.
      let zwaai = 0;
      if (t.fase === 'springt') zwaai = 18;
      else if (t.loopt) zwaai = Math.sin(tijd * 10) * 8;

      ctx.save();
      ctx.translate(t.x, t.y);
      if (!t.vlucht) ctx.scale(-1, 1); // aansluipen doet hij naar links
      ctx.scale(s, s);

      // poten
      ctx.strokeStyle = '#b5762f';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-22, 10);
      ctx.lineTo(-22 - zwaai, 32);
      ctx.moveTo(-10, 10);
      ctx.lineTo(-10 + zwaai, 32);
      ctx.moveTo(16, 10);
      ctx.lineTo(16 + zwaai, 32);
      ctx.moveTo(28, 10);
      ctx.lineTo(28 - zwaai, 32);
      ctx.stroke();

      // staart
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(-34, -2);
      ctx.quadraticCurveTo(-56, -8, -54, -28);
      ctx.stroke();

      // lijf
      ctx.fillStyle = '#d99a3f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 36, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      // strepen op het lijf
      ctx.strokeStyle = '#6b4520';
      ctx.lineWidth = 4;
      for (const streepX of [-18, -6, 6, 18]) {
        ctx.beginPath();
        ctx.moveTo(streepX, -17);
        ctx.lineTo(streepX + 5, -4);
        ctx.stroke();
      }

      // oren
      ctx.fillStyle = '#b5762f';
      for (const oorX of [30, 42]) {
        ctx.beginPath();
        ctx.moveTo(oorX, -22);
        ctx.lineTo(oorX + 9, -30);
        ctx.lineTo(oorX + 6, -12);
        ctx.closePath();
        ctx.fill();
      }

      // kop
      ctx.fillStyle = '#d99a3f';
      ctx.beginPath();
      ctx.arc(38, -12, 17, 0, Math.PI * 2);
      ctx.fill();

      // snuit
      ctx.beginPath();
      ctx.ellipse(52, -6, 11, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // de twee sabeltanden
      ctx.fillStyle = '#f7f1e0';
      for (const tandX of [48, 56]) {
        ctx.beginPath();
        ctx.moveTo(tandX, 0);
        ctx.lineTo(tandX + 5, 0);
        ctx.lineTo(tandX + 2, 24);
        ctx.closePath();
        ctx.fill();
      }

      // neus en oog
      ctx.fillStyle = '#2b2925';
      ctx.beginPath();
      ctx.arc(60, -8, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(43, -16, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---- Het landschap ----------------------------------------------------

    // De horizon: hier staan de dieren met hun voeten op de grond.
    function horizonY() {
      return canvas.height / 2 + 90;
    }

    const bomen = [];
    const varens = [];
    const keien = [];
    const bramen = [];
    const vijver = { x: 0, y: 0, breedte: 150 };
    const grot = { x: 0, breedte: 150 };
    const kampvuur = { x: 0, y: 0 };

    // Het bos wordt één keer uitgedeeld over de breedte van het scherm.
    function maakLandschap() {
      bomen.length = 0;
      varens.length = 0;
      keien.length = 0;

      for (let x = -60; x < canvas.width + 120; x += 72) {
        bomen.push({
          x: x + Math.random() * 40,
          hoogte: 120 + Math.random() * 110,
          soort: Math.random() < 0.65 ? 'naaldboom' : 'varenboom',
        });
      }
      for (let i = 0; i < 30; i++) {
        varens.push({ x: Math.random() * canvas.width, diepte: Math.random() });
      }
      for (let i = 0; i < 12; i++) {
        keien.push({ x: Math.random() * canvas.width, diepte: Math.random(), breedte: 16 + Math.random() * 28 });
      }

      // De grot zit rechts in de rotsen, met een kampvuur ervoor.
      grot.x = canvas.width * 0.9;
      grot.breedte = Math.min(170, canvas.width * 0.12);
      kampvuur.x = grot.x - grot.breedte * 0.9;
      kampvuur.y = horizonY() + 60;

      // De visvijver ligt rechts op de voorgrond.
      const grondHoogte = canvas.height - horizonY();
      vijver.x = canvas.width * 0.74;
      vijver.y = horizonY() + grondHoogte * 0.62;
      vijver.breedte = Math.min(170, canvas.width * 0.14);
      vijver.vis = true;      // er zwemt een vis die je kunt vangen
      vijver.wachtTijd = 0;

      // Vier bramenstruiken, verdeeld over het veld.
      bramen.length = 0;
      for (const plek of [0.08, 0.3, 0.56, 0.9]) {
        bramen.push({
          x: canvas.width * plek,
          y: horizonY() + 100 + Math.random() * Math.max(40, grondHoogte * 0.45),
          grootte: 0.9 + Math.random() * 0.4,
          rijp: true,      // false als je de bramen net hebt opgegeten
          wachtTijd: 0,    // seconden tot er weer nieuwe bramen zijn
        });
      }
    }

    function tekenGrot(hy) {
      const b = grot.breedte;

      // de rotsheuvel waar de grot in zit
      ctx.fillStyle = '#75706a';
      ctx.beginPath();
      ctx.ellipse(grot.x, hy + 10, b, b * 0.95, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      // een lichtere kant, dan lijkt het of de zon erop schijnt
      ctx.fillStyle = '#8a857e';
      ctx.beginPath();
      ctx.ellipse(grot.x - b * 0.3, hy + 10, b * 0.55, b * 0.8, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      // de donkere opening
      ctx.fillStyle = '#241d1c';
      ctx.beginPath();
      ctx.ellipse(grot.x, hy + 10, b * 0.36, b * 0.62, 0, Math.PI, Math.PI * 2);
      ctx.fill();

      // een paar stenen naast de ingang
      ctx.fillStyle = '#9b9384';
      for (const steen of [{ x: -b * 0.6, r: 16 }, { x: b * 0.55, r: 20 }]) {
        ctx.beginPath();
        ctx.ellipse(grot.x + steen.x, hy + 12, steen.r, steen.r * 0.7, 0, Math.PI, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenKampvuur(v) {
      // gloed op de grond
      ctx.fillStyle = 'rgba(240, 150, 50, 0.25)';
      ctx.beginPath();
      ctx.ellipse(v.x, v.y, 60, 26, 0, 0, Math.PI * 2);
      ctx.fill();

      // kring van stenen
      ctx.fillStyle = '#9b9384';
      for (let i = 0; i < 7; i++) {
        const hoek = (i / 7) * Math.PI * 2;
        ctx.beginPath();
        ctx.ellipse(v.x + Math.cos(hoek) * 42, v.y + Math.sin(hoek) * 18, 10, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // twee houtblokken over elkaar
      ctx.strokeStyle = '#6b4a2f';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(v.x - 26, v.y + 6);
      ctx.lineTo(v.x + 26, v.y - 4);
      ctx.moveTo(v.x - 24, v.y - 4);
      ctx.lineTo(v.x + 24, v.y + 6);
      ctx.stroke();

      // vlammen: drie tongen die met de tijd flakkeren
      const vlammen = [
        { x: -14, kleur: '#e2521f', hoog: 46 },
        { x: 12, kleur: '#f08a1e', hoog: 40 },
        { x: 0, kleur: '#ffd35e', hoog: 60 },
      ];
      for (let i = 0; i < vlammen.length; i++) {
        const vl = vlammen[i];
        const flakker = Math.sin(tijd * 9 + i * 2) * 7;
        ctx.fillStyle = vl.kleur;
        ctx.beginPath();
        ctx.moveTo(v.x + vl.x - 13, v.y);
        ctx.quadraticCurveTo(v.x + vl.x - 6, v.y - vl.hoog * 0.6, v.x + vl.x + flakker, v.y - vl.hoog);
        ctx.quadraticCurveTo(v.x + vl.x + 8, v.y - vl.hoog * 0.6, v.x + vl.x + 13, v.y);
        ctx.closePath();
        ctx.fill();
      }

      // rook boven het vuur
      ctx.fillStyle = 'rgba(200, 200, 195, 0.35)';
      for (let i = 0; i < 3; i++) {
        const stijg = (tijd * 0.5 + i * 0.33) % 1;
        ctx.beginPath();
        ctx.arc(v.x + Math.sin(tijd + i) * 12, v.y - 70 - stijg * 90, 7 + stijg * 13, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenVijver(v) {
      // zanderige rand rond het water
      ctx.fillStyle = '#c2b184';
      ctx.beginPath();
      ctx.ellipse(v.x, v.y, v.breedte + 14, v.breedte * 0.42 + 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // het water, van licht aan de rand naar diepblauw in het midden
      const water = ctx.createRadialGradient(v.x, v.y, 10, v.x, v.y, v.breedte);
      water.addColorStop(0, '#2f7fb5');
      water.addColorStop(1, '#7fc3dd');
      ctx.fillStyle = water;
      ctx.beginPath();
      ctx.ellipse(v.x, v.y, v.breedte, v.breedte * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      // rimpels die steeds naar buiten groeien
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const groei = (tijd * 0.4 + i * 0.33) % 1;
        ctx.beginPath();
        ctx.ellipse(v.x, v.y, v.breedte * groei, v.breedte * 0.42 * groei, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // drie visjes die heen en weer zwemmen
      if (!v.vis) return;
      for (let i = 0; i < 3; i++) {
        const heen = Math.sin(tijd * (0.7 + i * 0.2) + i * 2);
        const visX = v.x + heen * v.breedte * 0.6;
        const visY = v.y - 14 + i * 14;
        const naarRechts = Math.cos(tijd * (0.7 + i * 0.2) + i * 2) > 0;

        ctx.fillStyle = '#e8a33d';
        ctx.beginPath();
        ctx.ellipse(visX, visY, 9, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // staartje aan de achterkant
        const staartX = naarRechts ? visX - 9 : visX + 9;
        const punt = naarRechts ? staartX - 8 : staartX + 8;
        ctx.beginPath();
        ctx.moveTo(staartX, visY);
        ctx.lineTo(punt, visY - 5);
        ctx.lineTo(punt, visY + 5);
        ctx.closePath();
        ctx.fill();
      }
    }

    function tekenBraamstruik(b) {
      const s = b.grootte;

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(s, s);

      // takjes
      ctx.strokeStyle = '#6b4a2f';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      for (const kant of [-1, 0, 1]) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(kant * 16, -30);
        ctx.stroke();
      }

      // bladeren
      ctx.fillStyle = '#356d33';
      for (const blad of [{ x: -20, y: -28 }, { x: 0, y: -40 }, { x: 20, y: -28 }, { x: -9, y: -20 }, { x: 11, y: -20 }]) {
        ctx.beginPath();
        ctx.ellipse(blad.x, blad.y, 15, 12, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // de bramen zelf, alleen als de struik weer vol hangt
      if (b.rijp) {
        for (const braam of [{ x: -16, y: -18 }, { x: -4, y: -30 }, { x: 9, y: -34 }, { x: 16, y: -16 }, { x: 2, y: -12 }]) {
          ctx.fillStyle = '#3b1b45';
          ctx.beginPath();
          ctx.arc(braam.x, braam.y, 5, 0, Math.PI * 2);
          ctx.fill();

          // een lichte glans op elke braam
          ctx.fillStyle = '#6a3273';
          ctx.beginPath();
          ctx.arc(braam.x - 1.5, braam.y - 1.5, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function tekenNaaldboom(x, voetY, hoogte) {
      // stam
      ctx.fillStyle = '#5b4632';
      ctx.fillRect(x - hoogte * 0.035, voetY - hoogte * 0.32, hoogte * 0.07, hoogte * 0.32);

      // drie driehoeken boven elkaar maken de takken
      ctx.fillStyle = '#2f6b3f';
      for (let i = 0; i < 3; i++) {
        const top = voetY - hoogte + i * hoogte * 0.24;
        const breedte = hoogte * (0.30 + i * 0.09);
        ctx.beginPath();
        ctx.moveTo(x, top);
        ctx.lineTo(x - breedte, top + hoogte * 0.44);
        ctx.lineTo(x + breedte, top + hoogte * 0.44);
        ctx.closePath();
        ctx.fill();
      }
    }

    function tekenVarenboom(x, voetY, hoogte) {
      // stam
      ctx.strokeStyle = '#6b5336';
      ctx.lineWidth = hoogte * 0.08;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, voetY);
      ctx.lineTo(x, voetY - hoogte * 0.68);
      ctx.stroke();

      // een kroon van gebogen bladen
      ctx.strokeStyle = '#3d7d4a';
      ctx.lineWidth = hoogte * 0.045;
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(x, voetY - hoogte * 0.68);
        ctx.quadraticCurveTo(
          x + i * hoogte * 0.13, voetY - hoogte,
          x + i * hoogte * 0.27, voetY - hoogte * 0.76
        );
        ctx.stroke();
      }
    }

    function tekenVaren(x, y, grootte) {
      ctx.strokeStyle = '#3f7a3c';
      ctx.lineWidth = 3;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + i * grootte * 0.5, y - grootte, x + i * grootte, y - grootte * 0.2);
        ctx.stroke();
      }
    }

    function tekenBergen(hy) {
      // twee bergen in de verte
      ctx.fillStyle = '#8d9aa8';
      for (const b of [{ x: canvas.width * 0.6, h: 190 }, { x: canvas.width * 0.85, h: 150 }]) {
        ctx.beginPath();
        ctx.moveTo(b.x - b.h, hy);
        ctx.lineTo(b.x, hy - b.h);
        ctx.lineTo(b.x + b.h, hy);
        ctx.closePath();
        ctx.fill();
      }

      // de vulkaan
      const vx = vulkaanX();
      const vh = vulkaanHoogte;
      ctx.fillStyle = '#6f7580';
      ctx.beginPath();
      ctx.moveTo(vx - 170, hy);
      ctx.lineTo(vx, hy - vh);
      ctx.lineTo(vx + 170, hy);
      ctx.closePath();
      ctx.fill();

      // gloeiende krater
      ctx.fillStyle = '#d4552e';
      ctx.beginPath();
      ctx.moveTo(vx - 20, hy - vh + 4);
      ctx.lineTo(vx + 20, hy - vh + 4);
      ctx.lineTo(vx + 9, hy - vh + 30);
      ctx.lineTo(vx - 9, hy - vh + 30);
      ctx.closePath();
      ctx.fill();

      if (uitbarsting) {
        // een fontein van lava boven de krater
        ctx.fillStyle = '#f5a623';
        for (let i = 0; i < 7; i++) {
          const hoog = 40 + Math.abs(Math.sin(tijd * 2 + i)) * 90;
          ctx.beginPath();
          ctx.arc(vx - 24 + i * 8, hy - vh - hoog, 9, 0, Math.PI * 2);
          ctx.fill();
        }

        // twee lavastromen langs de flank naar beneden
        ctx.strokeStyle = '#e2521f';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        for (const kant of [-1, 1]) {
          ctx.beginPath();
          ctx.moveTo(vx + kant * 8, hy - vh + 20);
          ctx.quadraticCurveTo(vx + kant * 80, hy - vh * 0.5, vx + kant * 110, hy);
          ctx.stroke();
        }
      }

      // rookpluim: vijf bollen die steeds omhoog stijgen en opnieuw beginnen
      ctx.fillStyle = uitbarsting ? 'rgba(90, 80, 78, 0.6)' : 'rgba(210, 210, 205, 0.5)';
      for (let i = 0; i < 5; i++) {
        const stijg = (tijd * 0.2 + i * 0.2) % 1;
        const grootte = uitbarsting ? 26 + stijg * 46 : 14 + stijg * 26;
        ctx.beginPath();
        ctx.arc(vx + stijg * 40 + Math.sin(tijd + i) * 10, hy - vh - stijg * 150, grootte, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenVerreBosrand(hy) {
      ctx.fillStyle = '#3f6b4a';
      for (let x = -20; x < canvas.width + 40; x += 26) {
        const hoogte = 40 + Math.sin(x * 0.7) * 14;
        ctx.beginPath();
        ctx.moveTo(x, hy);
        ctx.lineTo(x + 13, hy - hoogte);
        ctx.lineTo(x + 26, hy);
        ctx.closePath();
        ctx.fill();
      }

      // een sluier van nevel maakt de verte waziger
      ctx.fillStyle = 'rgba(240, 240, 230, 0.35)';
      ctx.fillRect(0, hy - 60, canvas.width, 60);
    }

    function tekenAchtergrond() {
      const hy = horizonY();

      // lucht, van blauw bovenaan naar warm geel bij de horizon
      const lucht = ctx.createLinearGradient(0, 0, 0, hy);
      lucht.addColorStop(0, '#7fb8d4');
      lucht.addColorStop(0.7, '#cfe3e8');
      lucht.addColorStop(1, '#f2e2b8');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, canvas.width, hy);

      // zon
      ctx.fillStyle = 'rgba(255, 244, 210, 0.9)';
      ctx.beginPath();
      ctx.arc(canvas.width * 0.75, hy * 0.35, 48, 0, Math.PI * 2);
      ctx.fill();

      // tijdens een uitbarsting kleurt de hele lucht rood
      if (uitbarsting) {
        ctx.fillStyle = 'rgba(190, 60, 25, 0.22)';
        ctx.fillRect(0, 0, canvas.width, hy);
      }

      tekenBergen(hy);
      tekenVerreBosrand(hy);

      // de grond
      const grond = ctx.createLinearGradient(0, hy, 0, canvas.height);
      grond.addColorStop(0, '#7aa354');
      grond.addColorStop(1, '#4d7434');
      ctx.fillStyle = grond;
      ctx.fillRect(0, hy, canvas.width, canvas.height - hy);

      // het bos staat op de horizon, achter de dieren
      for (const b of bomen) {
        if (b.soort === 'naaldboom') tekenNaaldboom(b.x, hy + 6, b.hoogte);
        else tekenVarenboom(b.x, hy + 6, b.hoogte);
      }

      tekenGrot(hy);
      tekenKampvuur(kampvuur);
      tekenVijver(vijver);

      for (const b of bramen) tekenBraamstruik(b);

      // keien op de grond
      for (const k of keien) {
        const y = hy + 20 + k.diepte * (canvas.height - hy - 20);
        ctx.fillStyle = '#9b9384';
        ctx.beginPath();
        ctx.ellipse(k.x, y, k.breedte, k.breedte * 0.6, 0, Math.PI, Math.PI * 2);
        ctx.fill();
      }

      // varens op de grond
      for (const v of varens) {
        const y = hy + 10 + v.diepte * (canvas.height - hy - 10);
        tekenVaren(v.x, y, 18 + v.diepte * 24);
      }
    }

    // Een level starten: alles terug naar het begin, maar je punten blijven staan.
    function startLevel(nummer) {
      level = nummer;
      levelGehaald = false;
      levelStart = tijd;

      mammoet.leven = 100;
      mammoet.kantel = 0;
      mammoet.zwerf = 0;

      baby.stemming = 'blij';
      baby.rouwTijd = 0;
      baby.kleur = '#8b5e3c';
      baby.donker = '#6b4a2f';

      gameOver = false;

      tijger.actief = nummer >= 4;
      tijger.x = canvas.width + 140;
      tijger.leven = 2;
      tijger.vlucht = false;
      tijger.fase = 'sluipt';
      tijger.sprong = 0;
      tijger.raakte = false;

      ruiter.actief = nummer >= 7;
      ruiter.x = canvas.width + 200;
      ruiter.leven = 3;
      ruiter.vlucht = false;
      ruiter.gooiTimer = 2.5;
      vijandSperen.length = 0;

      uitbarsting = nummer >= 6;
      vuurstenen.length = 0;
      steenTimer = 0.8;

      for (const b of bramen) b.rijp = true;
      vijver.vis = true;
      meldingTijd = 0;

      zetBroccoliNeer();
      zetSpullenNeer();
      speerVoorraad = 6;
      maakTimer = 0;

      oermens.x = Math.max(60, canvas.width / 2 - 440);
      oermens.hoogte = 110;
      oermens.omver = false;
      oermens.vlucht = false;
      oermens.klaarOmTeGooien = false;
      oermens.worp = 0;
      oermens.worpTijd = 0;

      wolf.x = oermens.x - 95;
      speren.length = 0;
    }

    // De speler gooit de speer met de spatiebalk.
    function gooiSpeer() {
      if (gameOver) return;                    // de jager ligt op de grond
      if (!oermens.klaarOmTeGooien) return;    // hij staat nog stil te sluipen
      if (oermens.worpTijd > 0) return;        // hij is nog met de vorige worp bezig

      if (speerVoorraad <= 0) {
        meld('Geen speren meer! Zoek een stok en een steen.');
        return;
      }

      speerVoorraad -= 1;
      oermens.worpTijd = worpDuur;

      // De speer begint bij zijn hand en vliegt met een boogje naar rechts.
      speren.push({
        x: oermens.x + 45,
        y: oermens.y - 30,
        vx: 620,
        vy: -170,
        steekt: false, // true als hij in de mammoet of in de grond zit
      });
    }

    // Hierin houden we bij welke toetsen op dit moment ingedrukt zijn.
    const toetsen = {};

    document.addEventListener('keyup', (e) => {
      toetsen[e.code] = false;
    });

    document.addEventListener('keydown', (e) => {
      toetsen[e.code] = true;

      if (e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
          e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
        e.preventDefault(); // anders scrollt de pagina mee
      }
      if (e.code === 'Space') {
        e.preventDefault(); // anders scrollt de pagina
        gooiSpeer();
      }
      if (e.code === 'Enter' && levelGehaald) {
        startLevel(level + 1);
      }
      if (e.code === 'Enter' && gameOver) {
        punten = 0; // helemaal opnieuw beginnen
        levens = 3;
        startLevel(1);
      }
    });

    function tekenMammoet(m) {
      const s = m.grootte / 200; // schaal: bij grootte 200 is s gelijk aan 1

      ctx.save();
      ctx.translate(m.x, m.y + m.kantel * 40);
      ctx.rotate(m.kantel * 1.4); // als hij dood is, valt hij om
      ctx.scale(s, s);

      // benen
      ctx.fillStyle = m.donker;
      ctx.fillRect(-60, 30, 26, 60);
      ctx.fillRect(-20, 30, 26, 60);
      ctx.fillRect(20, 30, 26, 60);
      ctx.fillRect(55, 30, 26, 60);

      // lijf
      ctx.fillStyle = m.kleur;
      ctx.beginPath();
      ctx.ellipse(10, 0, 90, 55, 0, 0, Math.PI * 2);
      ctx.fill();

      // kop
      ctx.beginPath();
      ctx.ellipse(-80, -10, 45, 45, 0, 0, Math.PI * 2);
      ctx.fill();

      // oor
      ctx.fillStyle = m.donker;
      ctx.beginPath();
      ctx.ellipse(-65, -20, 22, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // slurf
      ctx.strokeStyle = m.kleur;
      ctx.lineWidth = 22;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-110, 10);
      ctx.quadraticCurveTo(-150, 40, -135, 75);
      ctx.stroke();

      // slagtanden
      ctx.strokeStyle = '#f2ead3';
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(-105, 25);
      ctx.quadraticCurveTo(-145, 55, -160, 30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-95, 30);
      ctx.quadraticCurveTo(-130, 65, -145, 45);
      ctx.stroke();

      // oog: open als hij leeft, een kruisje als hij dood is
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 4;
      if (m.leven > 0) {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(-95, -25, 5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(-101, -31);
        ctx.lineTo(-89, -19);
        ctx.moveTo(-89, -31);
        ctx.lineTo(-101, -19);
        ctx.stroke();
      }

      // staart
      ctx.strokeStyle = m.donker;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(98, -10);
      ctx.lineTo(120, 15);
      ctx.stroke();

      ctx.restore();
    }

    function tekenOermens(o) {
      const s = o.grootte / 120;
      // Tijdens het lopen zwaaien de benen heen en weer.
      const zwaai = o.loopt ? Math.sin(tijd * 10) * 14 : 0;

      ctx.save();
      ctx.translate(o.x, o.y);
      if (o.omver) {
        ctx.translate(0, 34);
        ctx.rotate(1.4); // hij ligt op de grond
      }
      if (o.vlucht) ctx.scale(-1, 1); // hij kijkt de andere kant op
      ctx.scale(s, s);

      // benen
      ctx.strokeStyle = '#3b2b1a';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 20);
      ctx.lineTo(-zwaai, 60);
      ctx.moveTo(0, 20);
      ctx.lineTo(zwaai, 60);
      ctx.stroke();

      // lijf
      ctx.fillStyle = '#c98c5a';
      ctx.beginPath();
      ctx.ellipse(0, -5, 15, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // berenvel om zijn lijf
      ctx.fillStyle = '#5a4630';
      ctx.fillRect(-16, 2, 32, 16);

      // hoofd
      ctx.fillStyle = '#c98c5a';
      ctx.beginPath();
      ctx.arc(0, -46, 14, 0, Math.PI * 2);
      ctx.fill();

      // haar
      ctx.fillStyle = '#2b2018';
      ctx.beginPath();
      ctx.arc(0, -50, 14, Math.PI, Math.PI * 2);
      ctx.fill();

      // oog
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(7, -46, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // arm die de speer vasthoudt, schiet vooruit bij een worp
      const handX = 14 + o.worp * 26;
      ctx.strokeStyle = '#c98c5a';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(4, -20);
      ctx.lineTo(handX, -26);
      ctx.stroke();

      // speer
      ctx.strokeStyle = '#7a5230';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(handX - 26, -18);
      ctx.lineTo(handX + 48, -32);
      ctx.stroke();

      // stenen punt
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath();
      ctx.moveTo(handX + 48, -32);
      ctx.lineTo(handX + 36, -38);
      ctx.lineTo(handX + 38, -25);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // Tranen vallen uit het oog van de baby, in een lusje van boven naar beneden.
    function tekenTranen(b) {
      const s = b.grootte / 200;
      const oogX = b.x - 95 * s;
      const oogY = b.y - 20 * s;

      ctx.fillStyle = '#4aa3df';
      for (let i = 0; i < 3; i++) {
        // val gaat steeds van 0 (bij het oog) naar 1 (onderaan) en begint dan opnieuw
        const val = (tijd * 1.4 + i * 0.33) % 1;
        ctx.beginPath();
        ctx.ellipse(oogX - 6 - val * 10, oogY + val * 70, 4, 6, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      tekenTekstMetRand('Oeeeh!', b.x, b.y - 70 + Math.sin(tijd * 6) * 3);
      ctx.textAlign = 'left';
    }

    // Een boze baby: dikke wenkbrauw, stoom uit zijn kop en een grauw.
    function tekenBoosheid(b) {
      const s = b.grootte / 200;
      const oogX = b.x - 95 * s;
      const oogY = b.y - 25 * s;

      ctx.strokeStyle = '#111';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(oogX - 14, oogY - 16);
      ctx.lineTo(oogX + 10, oogY - 6);
      ctx.stroke();

      ctx.fillStyle = 'rgba(235, 235, 235, 0.75)';
      for (let i = 0; i < 3; i++) {
        const stijg = (tijd * 1.2 + i * 0.33) % 1;
        ctx.beginPath();
        ctx.arc(b.x - 30 * s + i * 26 * s, b.y - 55 * s - stijg * 55, 6 + stijg * 11, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      tekenTekstMetRand('GRRR!', b.x, b.y - 95 + Math.sin(tijd * 10) * 3);
      ctx.textAlign = 'left';
    }

    // Een gegooide speer: de punt wijst in de richting waarin hij vliegt.
    function tekenSpeer(sp) {
      const hoek = sp.steekt ? sp.hoek : Math.atan2(sp.vy, sp.vx);

      ctx.save();
      ctx.translate(sp.x, sp.y);
      ctx.rotate(hoek);

      ctx.strokeStyle = '#7a5230';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-70, 0);
      ctx.lineTo(0, 0);
      ctx.stroke();

      // stenen punt
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-14, -6);
      ctx.lineTo(-14, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // De puntenteller linksboven.
    function tekenPunten() {
      ctx.font = 'bold 26px sans-serif';
      tekenTekstMetRand('Punten: ' + punten, 24, 44);
      tekenTekstMetRand('Level ' + level, 24, 78);
      tekenTekstMetRand('Levens: ' + levens, 24, 112);
      tekenTekstMetRand('Speren: ' + speerVoorraad, 24, 146);

      ctx.font = 'bold 20px sans-serif';
      tekenTekstMetRand('Stokken: ' + stokken + '   Stenen: ' + stenen, 24, 178);
    }

    // Witte tekst met een donkere rand eromheen, altijd goed leesbaar.
    function tekenTekstMetRand(tekst, x, y) {
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#1e2a16';
      ctx.strokeText(tekst, x, y);
      ctx.fillStyle = '#fff';
      ctx.fillText(tekst, x, y);
    }

    // Korte uitleg onderaan het scherm.
    function tekenUitleg() {
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';

      let tekst = 'Loop met de pijltjes, gooi met de spatiebalk.';
      if (meldingTijd > 0) tekst = melding;
      else if (gameOver) tekst = 'Al je levens zijn op! Druk op Enter om opnieuw te beginnen.';
      else if (levelGehaald) tekst = 'Level ' + level + ' gehaald! Druk op Enter voor level ' + (level + 1) + '.';
      else if (ruiter.actief && !ruiter.vlucht) tekst = 'Een ruiter op een wolf! Raak hem drie keer met je speer.';
      else if (uitbarsting && vuurstenen.length > 0) tekst = 'De vulkaan barst uit! Pas op voor de vuurstenen!';
      else if (tijger.actief && !tijger.vlucht && tijger.fase === 'springt') tekst = 'De sabeltandtijger springt! Duik weg met de pijltjes!';
      else if (tijger.actief && !tijger.vlucht && tijger.fase === 'herstelt' && tijger.raakte) tekst = 'Au! Je bent een leven kwijt.';
      else if (tijger.actief && !tijger.vlucht && tijger.fase === 'herstelt') tekst = 'Gemist! Hij komt terug.';
      else if (tijger.actief && !tijger.vlucht) tekst = 'Pas op, een sabeltandtijger! Gooi je speer naar hem toe!';
      else if (baby.stemming === 'boos') tekst = 'Pas op! De baby is boos en jaagt de jager weg!';
      else if (mammoet.leven <= 0) tekst = 'De mammoet is gevangen! Je krijgt 5 punten.';
      else if (speerVoorraad <= 0) tekst = 'Geen speren meer! Pak een stok en een steen en loop naar de grot.';
      else if (broccoli.zichtbaar) tekst = 'Loop naar de broccoli voor een extra leven!';
      else if (oermens.klaarOmTeGooien) tekst = 'Spatiebalk om te gooien, pijltjes om te lopen.';

      tekenTekstMetRand(tekst, canvas.width / 2, canvas.height - 40);
      ctx.textAlign = 'left'; // weer terugzetten voor de andere tekst
    }

    function tekenLevensbalk(m) {
      const breedte = 200;
      const x = m.x - breedte / 2;
      const y = m.y - 140;

      ctx.fillStyle = '#ddd';
      ctx.fillRect(x, y, breedte, 14);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(x, y, breedte * (m.leven / 100), 14);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, breedte, 14);
    }

    // Zit dit punt in het lijf van de mammoet?
    function raaktMammoet(sp) {
      // Van zijn rug tot onder zijn buik, dus je kunt ook van onderaf raken.
      return Math.abs(sp.x - (mammoet.x + 10)) < 100 &&
             sp.y > mammoet.y - 70 && sp.y < mammoet.y + 100;
    }

    // Zit dit punt op de sabeltandtijger?
    function raaktTijger(sp) {
      if (!tijger.actief || tijger.vlucht) return false;
      // De speer komt van boven aanvliegen, dus we kijken royaal boven hem mee.
      return Math.abs(sp.x - tijger.x) < 75 && sp.y > tijger.y - 110 && sp.y < tijger.y + 50;
    }

    // Zit dit punt op de ruiter of zijn wolf?
    function raaktRuiter(sp) {
      if (!ruiter.actief || ruiter.vlucht) return false;
      return Math.abs(sp.x - ruiter.x) < 60 && sp.y > ruiter.y - 120 && sp.y < ruiter.y + 40;
    }

    function updateSperen(dt) {
      const grondY = mammoet.y + 90;

      for (const sp of speren) {
        if (sp.steekt) continue; // deze speer ligt of zit al stil

        // De speer vliegt vooruit en valt tegelijk een beetje naar beneden.
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vy += zwaartekracht * dt;

        if (raaktRuiter(sp)) {
          sp.steekt = true;
          sp.hoek = Math.atan2(sp.vy, sp.vx);
          ruiter.leven -= 1;

          // Na drie treffers geeft hij op: dat levert 5 punten op.
          if (ruiter.leven <= 0) {
            ruiter.vlucht = true;
            punten += 5;
            meld('De ruiter vlucht! 5 punten erbij.');
          }
        } else if (raaktTijger(sp)) {
          sp.steekt = true;
          sp.hoek = Math.atan2(sp.vy, sp.vx);
          tijger.leven -= 1;

          // Twee treffers en hij vlucht: dat is 3 punten.
          if (tijger.leven <= 0) {
            tijger.vlucht = true;
            punten += 3;
          }
        } else if (mammoet.leven > 0 && raaktMammoet(sp)) {
          sp.steekt = true;
          sp.hoek = Math.atan2(sp.vy, sp.vx);
          mammoet.leven = Math.max(0, mammoet.leven - 20);

          // Was dit de laatste treffer? Dan zijn het 5 punten.
          if (mammoet.leven === 0) punten += 5;
        } else if (sp.y > grondY) {
          // gemist: de speer valt op de grond
          sp.steekt = true;
          sp.hoek = 1.2;
          sp.y = grondY;
        }
      }
    }

    function updateBaby(dt) {
      if (mammoet.leven > 0) {
        // Mama leeft: de baby staat blij naast haar en wipt op en neer.
        baby.stemming = 'blij';
        baby.x = mammoet.x + 165;
        baby.y = mammoet.y + 50 + Math.sin(tijd * 3) * 4;
        return;
      }

      baby.rouwTijd += dt;

      if (baby.rouwTijd < 3) {
        // Eerst huilt hij bij zijn moeder.
        baby.stemming = 'huilt';
        baby.x = mammoet.x + 130;
        baby.y = mammoet.y + 50 + Math.sin(tijd * 14) * 3;
        return;
      }

      // Daarna wordt hij boos en gaat hij de jager achterna.
      baby.stemming = 'boos';
      baby.kleur = '#b5503a';
      baby.donker = '#8e3a28';

      const doelX = oermens.x + 130; // hij stopt net naast de jager
      if (!oermens.vlucht && baby.x > doelX) {
        baby.x -= 230 * dt;
        baby.y = mammoet.y + 50 + Math.sin(tijd * 16) * 6; // stampend rennen
      } else {
        // De baby heeft hem bereikt: de jager maakt dat hij wegkomt.
        oermens.vlucht = true;
        baby.y = mammoet.y + 50 + Math.sin(tijd * 10) * 3;
      }
    }

    function updateWolf(dt) {
      // Hij loopt een stukje achter de oermens, op dezelfde grond.
      const doelX = Math.max(oermens.x - 95, 45);
      const verschil = doelX - wolf.x;

      // Hoe verder hij achterloopt, hoe sneller hij bijkomt.
      wolf.x += verschil * dt * 3;
      wolf.loopt = Math.abs(verschil) > 4;
      wolf.vlucht = oermens.vlucht;
      wolf.kijktLinks = oermens.vlucht; // meevluchten doet hij naar links
      wolf.y = oermens.y + 34 + (wolf.loopt ? Math.sin(tijd * 12) * 2 : 0);
    }

    // Op welke hoogte de tijger staat als de jager op hoogte jagerY is.
    function tijgerStaY(jagerY) {
      return jagerY + 60 - 32 * (tijger.grootte / 110);
    }

    function updateRuiter(dt) {
      if (!ruiter.actief) return;

      // De grote wolf staat met zijn poten op dezelfde grond als de jager.
      const staY = oermens.y + 60 - 26 * (rijwolf.grootte / 70);

      if (ruiter.vlucht) {
        ruiter.x += 320 * dt;
        ruiter.y = staY;
      } else if (gameOver) {
        rijwolf.loopt = false;
      } else {
        ruiter.y = staY;

        // Hij houdt afstand: te ver weg rijdt hij dichterbij, te dichtbij wijkt hij.
        const doelX = oermens.x + 430;
        if (ruiter.x > doelX + 10) {
          ruiter.x -= 230 * dt;
          rijwolf.loopt = true;
        } else if (ruiter.x < doelX - 10) {
          ruiter.x += 230 * dt;
          rijwolf.loopt = true;
        } else {
          rijwolf.loopt = false;
        }

        // En ondertussen gooit hij speren naar jou.
        ruiter.gooiTimer -= dt;
        if (ruiter.gooiTimer <= 0) {
          ruiter.gooiTimer = 2.2;
          vijandSperen.push({
            x: ruiter.x - 50,
            y: ruiter.y - 80,
            vx: -540,
            vy: -150,
            steekt: false,
          });
        }
      }

      // De wolf van de ruiter volgt hem natuurlijk precies.
      rijwolf.x = ruiter.x;
      rijwolf.y = ruiter.y;
      rijwolf.kijktLinks = !ruiter.vlucht;
    }

    // De speren van de ruiter vliegen naar links, naar de jager toe.
    function updateVijandSperen(dt) {
      for (let i = vijandSperen.length - 1; i >= 0; i--) {
        const sp = vijandSperen[i];
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vy += zwaartekracht * dt;

        if (!gameOver && Math.abs(sp.x - oermens.x) < 40 && Math.abs(sp.y - (oermens.y - 20)) < 60) {
          levens -= 1;
          meld('Au! De ruiter raakte je.');
          vijandSperen.splice(i, 1);
          if (levens <= 0) {
            gameOver = true;
            oermens.omver = true;
          }
          continue;
        }

        if (sp.y > canvas.height || sp.x < -80) vijandSperen.splice(i, 1);
      }
    }

    function updateTijger(dt) {
      if (!tijger.actief) return;

      // De hoogte waarop hij met zijn poten naast de jager staat.
      const staY = tijgerStaY(oermens.y);

      if (tijger.vlucht) {
        // Geraakt: hij rent er weer vandoor naar rechts.
        tijger.loopt = true;
        tijger.fase = 'sluipt';
        tijger.y = staY;
        tijger.x += 340 * dt;
        return;
      }

      if (gameOver) {
        tijger.loopt = false;
        return;
      }

      if (tijger.fase === 'springt') {
        // De sprong duurt ongeveer een halve seconde.
        tijger.sprong = Math.min(1, tijger.sprong + dt * 1.8);

        // Hij vliegt van zijn afzetpunt naar de plek waar de jager stond...
        tijger.x = tijger.sprongStartX + (tijger.doelX - tijger.sprongStartX) * tijger.sprong;
        // ...in een boog door de lucht.
        tijger.y = tijgerStaY(tijger.doelY) - Math.sin(tijger.sprong * Math.PI) * 130;

        if (tijger.sprong >= 1) {
          // Staat de jager nog waar de tijger naartoe sprong?
          if (Math.abs(oermens.y - tijger.doelY) < 70) {
            levens -= 1;
            tijger.raakte = true;
            if (levens <= 0) {
              gameOver = true;
              oermens.omver = true;
            } else {
              tijger.fase = 'herstelt'; // hij wordt teruggeslagen en probeert het opnieuw
            }
          } else {
            tijger.raakte = false;
            tijger.fase = 'herstelt'; // gemist, hij moet opnieuw aanlopen
          }
        }
        return;
      }

      if (tijger.fase === 'herstelt') {
        // Na een misser loopt hij eerst een stuk terug naar rechts.
        tijger.loopt = true;
        tijger.y = staY;
        tijger.x += 240 * dt;
        if (tijger.x > oermens.x + 480) tijger.fase = 'sluipt';
        return;
      }

      // Sluipen tot hij dichtbij genoeg is om te springen.
      tijger.y = staY;
      if (tijger.x > oermens.x + 300) {
        tijger.loopt = true;
        tijger.x -= 110 * dt;
      } else {
        tijger.fase = 'springt';
        tijger.sprong = 0;
        tijger.sprongStartX = tijger.x;
        tijger.doelX = oermens.x + 55; // hierheen springt hij
        tijger.doelY = oermens.y;      // en op deze hoogte stond de jager
      }
    }

    function updateVulkaan(dt) {
      if (!uitbarsting || gameOver) return;

      // Elke keer dat de teller afloopt schiet er een nieuwe brok de lucht in.
      steenTimer -= dt;
      if (steenTimer <= 0) {
        steenTimer = 1;
        vuurstenen.push({
          x: vulkaanX(),
          y: horizonY() - vulkaanHoogte,
          vx: 120 + Math.random() * 400,
          vy: -340 - Math.random() * 130,
          r: 8 + Math.random() * 10,
        });
      }

      // Ze vliegen in een boog, net als de speren.
      for (const st of vuurstenen) {
        st.x += st.vx * dt;
        st.y += st.vy * dt;
        st.vy += zwaartekracht * dt;
      }

      // Van achteren naar voren weglopen, dan klopt het verwijderen uit de lijst.
      for (let i = vuurstenen.length - 1; i >= 0; i--) {
        const st = vuurstenen[i];

        // Raakt de brok de jager? Dan kost dat een leven.
        if (Math.abs(st.x - oermens.x) < 42 && Math.abs(st.y - (oermens.y - 10)) < 60) {
          levens -= 1;
          vuurstenen.splice(i, 1);
          if (levens <= 0) {
            gameOver = true;
            oermens.omver = true;
          }
          continue;
        }

        // Op de grond of het scherm uit: weg met de brok.
        if (st.y > canvas.height || st.x > canvas.width + 80) {
          vuurstenen.splice(i, 1);
        }
      }
    }

    // Eten dat je onderweg kunt oppakken: bramen en een vis uit de vijver.
    function updateEten(dt) {
      if (gameOver) return;

      const voetY = oermens.y + 60;

      for (const b of bramen) {
        if (!b.rijp) {
          // De struik hangt na een tijdje weer vol.
          b.wachtTijd -= dt;
          if (b.wachtTijd <= 0) b.rijp = true;
          continue;
        }
        if (Math.abs(oermens.x - b.x) < 55 && Math.abs(voetY - b.y) < 45) {
          b.rijp = false;
          b.wachtTijd = 8;
          levens += 1;
          meld('Bramen gegeten! Een leven erbij.');
        }
      }

      if (!vijver.vis) {
        // Na een tijdje zwemt er weer een nieuwe vis.
        vijver.wachtTijd -= dt;
        if (vijver.wachtTijd <= 0) vijver.vis = true;
        return;
      }

      // Sta je met je voeten in de vijver? Dan vang je de vis.
      if (Math.abs(oermens.x - vijver.x) < vijver.breedte + 10 &&
          Math.abs(voetY - vijver.y) < vijver.breedte * 0.42 + 25) {
        vijver.vis = false;
        vijver.wachtTijd = 10;
        levens += 1;
        meld('Vis gevangen! Een leven erbij.');
      }
    }

    // Spullen oppakken, en bij de grot maak je er een nieuwe speer van.
    function updateSpullen(dt) {
      if (gameOver) return;

      const voetY = oermens.y + 60;

      for (const spul of spullen) {
        if (!spul.zichtbaar) {
          // Na een tijdje ligt er ergens anders weer een nieuwe.
          spul.wachtTijd -= dt;
          if (spul.wachtTijd <= 0) nieuwePlek(spul);
          continue;
        }

        if (Math.abs(oermens.x - spul.x) < 45 && Math.abs(voetY - spul.y) < 40) {
          spul.zichtbaar = false;
          spul.wachtTijd = 5;
          if (spul.soort === 'stok') {
            stokken += 1;
            meld('Een stok opgeraapt.');
          } else {
            stenen += 1;
            meld('Een steen opgeraapt.');
          }
        }
      }

      // Bij de grot kun je van een stok en een steen een speer maken.
      if (maakTimer > 0) maakTimer -= dt;

      const bijDeGrot = Math.abs(oermens.x - grot.x) < 130 && oermens.hoogte < 90;
      if (bijDeGrot && maakTimer <= 0 && stokken > 0 && stenen > 0) {
        stokken -= 1;
        stenen -= 1;
        speerVoorraad += 1;
        maakTimer = 0.8;
        meld('In de grot een nieuwe speer gemaakt!');
      }
    }

    function updateBroccoli(dt) {
      if (gameOver) return;

      if (!broccoli.zichtbaar) {
        // Na een tijdje groeit er ergens anders een nieuwe.
        broccoli.wachtTijd -= dt;
        if (broccoli.wachtTijd <= 0) zetBroccoliNeer();
        return;
      }

      // Staat de jager met zijn voeten bij de broccoli? Dan pakt hij hem op.
      const voetY = oermens.y + 60;
      if (Math.abs(oermens.x - broccoli.x) < 55 && Math.abs(voetY - broccoli.y) < 45) {
        broccoli.zichtbaar = false;
        broccoli.wachtTijd = 6;
        levens += 1;
        meld('Broccoli gegeten! Een leven erbij.');
      }
    }

    function updateOermens(dt) {
      if (gameOver) {
        oermens.loopt = false;
        oermens.klaarOmTeGooien = false;
        return;
      }

      if (oermens.vlucht) {
        // Wegrennen naar links, de boze baby achter zich latend.
        oermens.loopt = true;
        oermens.klaarOmTeGooien = false;
        if (oermens.x > -120) oermens.x -= 260 * dt;
        else oermens.loopt = false; // hij is het scherm uit en blijft daar
        return;
      }

      // Met de pijltjes links en rechts loopt de speler zelf.
      oermens.loopt = false;
      oermens.klaarOmTeGooien = true;

      if (toetsen['ArrowLeft']) {
        oermens.x -= oermens.snelheid * dt;
        oermens.loopt = true;
      }
      if (toetsen['ArrowRight']) {
        oermens.x += oermens.snelheid * dt;
        oermens.loopt = true;
      }

      // Hij loopt over het hele veld, van de linkerrand tot de rechterrand.
      oermens.x = Math.max(30, Math.min(canvas.width - 30, oermens.x));

      if (oermens.worpTijd > 0) {
        oermens.worpTijd = Math.max(0, oermens.worpTijd - dt);
        // De arm schiet vooruit en komt daarna weer terug.
        oermens.worp = Math.sin((1 - oermens.worpTijd / worpDuur) * Math.PI);
      } else {
        oermens.worp = 0;
      }
    }

    function update(dt) {
      tijd += dt;
      if (meldingTijd > 0) meldingTijd -= dt;

      // Vanaf level 2 loopt de mammoet heen en weer, en per level gaat dat sneller.
      if (mammoet.leven > 0 && level >= 2) {
        mammoet.zwerf = Math.sin((tijd - levelStart) * (0.3 + level * 0.15)) * 180;
      }
      mammoet.x = canvas.width / 2 + mammoet.zwerf;
      mammoet.y = canvas.height / 2;
      // Met de pijltjes omhoog en omlaag beweeg je de jager, zo ontwijk je de tijger.
      if (!gameOver) {
        if (toetsen['ArrowUp']) oermens.hoogte -= 300 * dt;
        if (toetsen['ArrowDown']) oermens.hoogte += 300 * dt;
        // Bij hoogte 0 staat hij voor de bomen, en hij mag tot onderaan het scherm.
        const laagste = canvas.height - horizonY() - 55;
        oermens.hoogte = Math.max(0, Math.min(laagste, oermens.hoogte));
      }
      oermens.y = mammoet.y + 30 + oermens.hoogte;

      updateVulkaan(dt);
      updateEten(dt);
      updateSpullen(dt);
      updateBroccoli(dt);
      updateBaby(dt);
      updateOermens(dt);
      updateWolf(dt);
      updateTijger(dt);
      updateRuiter(dt);
      updateVijandSperen(dt);
      updateSperen(dt);

      // Is de mammoet dood, dan valt hij langzaam om.
      if (mammoet.leven <= 0 && mammoet.kantel < 1) {
        mammoet.kantel = Math.min(1, mammoet.kantel + dt);
      }

      // De jager is het scherm uit gejaagd: het level is klaar.
      if (!gameOver && oermens.vlucht && oermens.x <= -120) {
        levelGehaald = true;
      }
    }

    function draw() {
      tekenAchtergrond();
      if (broccoli.zichtbaar) tekenBroccoli(broccoli);
      for (const spul of spullen) {
        if (spul.zichtbaar) tekenSpul(spul);
      }
      tekenMammoet(mammoet);
      tekenMammoet(baby);
      if (baby.stemming === 'huilt') tekenTranen(baby);
      if (baby.stemming === 'boos') tekenBoosheid(baby);
      tekenOermens(oermens);
      tekenWolf(wolf);
      if (tijger.actief) tekenTijger(tijger);
      if (ruiter.actief) {
        tekenWolf(rijwolf);
        tekenRuiter(ruiter);
      }
      for (const sp of vijandSperen) tekenSpeer(sp);
      for (const sp of speren) tekenSpeer(sp);
      tekenLevensbalk(mammoet);
      for (const st of vuurstenen) tekenVuursteen(st);
      tekenUitleg();
      tekenPunten();
    }

    maakLandschap();
    startLevel(1);

    let vorige = performance.now();
    function loop(nu) {
      // dt is de tijd sinds het vorige plaatje, in seconden.
      // Nooit negatief (dat kan bij het allereerste plaatje) en nooit groter dan
      // een twintigste seconde, anders springt alles als je even weg bent geweest.
      const dt = Math.min(0.05, Math.max(0, (nu - vorige) / 1000));
      update(dt);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
