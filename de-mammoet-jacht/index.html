<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>de-mammoet-jacht</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    let tijd = 0; // seconden sinds de start, handig voor animaties

    // De mammoet staat in het midden van het scherm.
    const mammoet = {
      x: 0,
      y: 0,
      grootte: 200,
      leven: 100,
      kantel: 0, // 0 = staat overeind, 1 = helemaal omgevallen
    };

    // De baby-mammoet loopt naast zijn moeder. Zelfde vorm, maar kleiner.
    const baby = {
      x: 0,
      y: 0,
      grootte: 90,
      leven: 100,
      kantel: 0,
    };

    // De oermens komt van links aanlopen met een speer.
    const oermens = {
      x: 80,
      y: 0,
      grootte: 120,
      snelheid: 90,   // pixels per seconde
      loopt: false,
      prik: 0,        // 0 = speer naast zich, 1 = speer helemaal vooruit
      prikTimer: 0,
    };

    function tekenMammoet(m) {
      const s = m.grootte / 200; // schaal: bij grootte 200 is s gelijk aan 1

      ctx.save();
      ctx.translate(m.x, m.y + m.kantel * 40);
      ctx.rotate(m.kantel * 1.4); // als hij dood is, valt hij om
      ctx.scale(s, s);

      // benen
      ctx.fillStyle = '#6b4a2f';
      ctx.fillRect(-60, 30, 26, 60);
      ctx.fillRect(-20, 30, 26, 60);
      ctx.fillRect(20, 30, 26, 60);
      ctx.fillRect(55, 30, 26, 60);

      // lijf
      ctx.fillStyle = '#8b5e3c';
      ctx.beginPath();
      ctx.ellipse(10, 0, 90, 55, 0, 0, Math.PI * 2);
      ctx.fill();

      // kop
      ctx.beginPath();
      ctx.ellipse(-80, -10, 45, 45, 0, 0, Math.PI * 2);
      ctx.fill();

      // oor
      ctx.fillStyle = '#6b4a2f';
      ctx.beginPath();
      ctx.ellipse(-65, -20, 22, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // slurf
      ctx.strokeStyle = '#8b5e3c';
      ctx.lineWidth = 22;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-110, 10);
      ctx.quadraticCurveTo(-150, 40, -135, 75);
      ctx.stroke();

      // slagtanden
      ctx.strokeStyle = '#f2ead3';
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(-105, 25);
      ctx.quadraticCurveTo(-145, 55, -160, 30);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-95, 30);
      ctx.quadraticCurveTo(-130, 65, -145, 45);
      ctx.stroke();

      // oog: open als hij leeft, een kruisje als hij dood is
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 4;
      if (m.leven > 0) {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(-95, -25, 5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(-101, -31);
        ctx.lineTo(-89, -19);
        ctx.moveTo(-89, -31);
        ctx.lineTo(-101, -19);
        ctx.stroke();
      }

      // staart
      ctx.strokeStyle = '#6b4a2f';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(98, -10);
      ctx.lineTo(120, 15);
      ctx.stroke();

      ctx.restore();
    }

    function tekenOermens(o) {
      const s = o.grootte / 120;
      // Tijdens het lopen zwaaien de benen heen en weer.
      const zwaai = o.loopt ? Math.sin(tijd * 10) * 14 : 0;

      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.scale(s, s);

      // benen
      ctx.strokeStyle = '#3b2b1a';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 20);
      ctx.lineTo(-zwaai, 60);
      ctx.moveTo(0, 20);
      ctx.lineTo(zwaai, 60);
      ctx.stroke();

      // lijf
      ctx.fillStyle = '#c98c5a';
      ctx.beginPath();
      ctx.ellipse(0, -5, 15, 28, 0, 0, Math.PI * 2);
      ctx.fill();

      // berenvel om zijn lijf
      ctx.fillStyle = '#5a4630';
      ctx.fillRect(-16, 2, 32, 16);

      // hoofd
      ctx.fillStyle = '#c98c5a';
      ctx.beginPath();
      ctx.arc(0, -46, 14, 0, Math.PI * 2);
      ctx.fill();

      // haar
      ctx.fillStyle = '#2b2018';
      ctx.beginPath();
      ctx.arc(0, -50, 14, Math.PI, Math.PI * 2);
      ctx.fill();

      // oog
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(7, -46, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // arm die de speer vasthoudt, schiet vooruit bij een prik
      const handX = 14 + o.prik * 26;
      ctx.strokeStyle = '#c98c5a';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(4, -20);
      ctx.lineTo(handX, -26);
      ctx.stroke();

      // speer
      ctx.strokeStyle = '#7a5230';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(handX - 26, -18);
      ctx.lineTo(handX + 48, -32);
      ctx.stroke();

      // stenen punt
      ctx.fillStyle = '#9aa0a6';
      ctx.beginPath();
      ctx.moveTo(handX + 48, -32);
      ctx.lineTo(handX + 36, -38);
      ctx.lineTo(handX + 38, -25);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function tekenLevensbalk(m) {
      const breedte = 200;
      const x = m.x - breedte / 2;
      const y = m.y - 140;

      ctx.fillStyle = '#ddd';
      ctx.fillRect(x, y, breedte, 14);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(x, y, breedte * (m.leven / 100), 14);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, breedte, 14);
    }

    function updateOermens(dt) {
      const doelX = mammoet.x - 210; // net buiten het bereik van de slagtanden

      if (mammoet.leven <= 0) {
        // De mammoet is dood: de oermens blijft staan en laat de speer zakken.
        oermens.loopt = false;
        oermens.prik = Math.max(0, oermens.prik - dt * 3);
        return;
      }

      if (oermens.x < doelX) {
        oermens.loopt = true;
        oermens.x += oermens.snelheid * dt;
        return;
      }

      // Bij de mammoet aangekomen: elke seconde een prik met de speer.
      oermens.loopt = false;
      oermens.prikTimer += dt;
      if (oermens.prikTimer > 1) {
        oermens.prikTimer = 0;
        mammoet.leven = Math.max(0, mammoet.leven - 10);
      }
      // De speer schiet vooruit aan het begin van de prik en komt dan terug.
      oermens.prik = Math.max(0, Math.sin(oermens.prikTimer * Math.PI * 4));
    }

    function update(dt) {
      tijd += dt;

      // De mammoet blijft midden op het scherm staan.
      mammoet.x = canvas.width / 2;
      mammoet.y = canvas.height / 2;
      oermens.y = mammoet.y + 30;

      // De baby staat naast zijn moeder en wipt een beetje op en neer.
      baby.x = mammoet.x + 165;
      baby.y = mammoet.y + 50 + Math.sin(tijd * 3) * 4;

      updateOermens(dt);

      // Is de mammoet dood, dan valt hij langzaam om.
      if (mammoet.leven <= 0 && mammoet.kantel < 1) {
        mammoet.kantel = Math.min(1, mammoet.kantel + dt);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenMammoet(mammoet);
      tekenMammoet(baby);
      tekenOermens(oermens);
      tekenLevensbalk(mammoet);
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
