<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test2</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // De dino: waar hij staat, hoe snel hij loopt en welke kant hij op gaat.
    const dino = { x: canvas.width / 2, y: canvas.height / 2, snelheid: 200, richting: 1 };

    function update(dt) {
      dino.x += dino.snelheid * dino.richting * dt;

      // Aan de rand van het scherm draait hij om.
      if (dino.x > canvas.width - 60) dino.richting = -1;
      if (dino.x < 60) dino.richting = 1;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(dino.x, dino.y);
      // De emoji kijkt naar links. Loopt hij naar rechts, dan spiegelen we hem.
      if (dino.richting === 1) ctx.scale(-1, 1);
      ctx.font = '120px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🦖', 0, 0);
      ctx.restore();
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
