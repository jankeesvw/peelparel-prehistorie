<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>99-nachten-in-de-prehistorie</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; color: #eee; font-family: sans-serif; }
    canvas { display: block; background: #0b1030; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Het poppetje: een holbewoner. x en y zijn de plek van zijn voeten.
    // richting is 1 (naar rechts kijken) of -1 (naar links kijken).
    const speler = { x: window.innerWidth * 0.4, y: 0, richting: 1 };

    // Welke toetsen zijn nu ingedrukt?
    const toetsen = {};
    window.addEventListener('keydown', (e) => { toetsen[e.key] = true; });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    const loopSnelheid = 250; // pixels per seconde

    function update(dt) {
      if (toetsen['ArrowLeft']) {
        speler.x -= loopSnelheid * dt;
        speler.richting = -1;
      }
      if (toetsen['ArrowRight']) {
        speler.x += loopSnelheid * dt;
        speler.richting = 1;
      }
      // Niet buiten het scherm lopen.
      speler.x = Math.max(30, Math.min(canvas.width - 30, speler.x));

      updateVissen(dt);
    }

    // Vaste sterren, zodat ze niet elke frame verspringen.
    const sterren = [];
    for (let i = 0; i < 120; i++) {
      sterren.push({ x: Math.random(), y: Math.random() * 0.6, grootte: 1 + Math.random() * 2 });
    }

    function tekenLucht() {
      const b = canvas.width, h = canvas.height;
      const lucht = ctx.createLinearGradient(0, 0, 0, h);
      lucht.addColorStop(0, '#05071a');
      lucht.addColorStop(1, '#2b2a5e');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      ctx.fillStyle = '#fff';
      for (const s of sterren) {
        ctx.fillRect(s.x * b, s.y * h, s.grootte, s.grootte);
      }

      // Maan
      ctx.fillStyle = '#f4f1c1';
      ctx.beginPath();
      ctx.arc(b * 0.8, h * 0.15, 40, 0, Math.PI * 2);
      ctx.fill();
    }

    function tekenHeuvels() {
      const b = canvas.width, h = canvas.height;
      ctx.fillStyle = '#1c2e1c';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.7);
      ctx.quadraticCurveTo(b * 0.25, h * 0.5, b * 0.5, h * 0.68);
      ctx.quadraticCurveTo(b * 0.75, h * 0.45, b, h * 0.65);
      ctx.lineTo(b, h);
      ctx.lineTo(0, h);
      ctx.fill();
    }

    function tekenGrond() {
      const b = canvas.width, h = canvas.height;
      ctx.fillStyle = '#3a5a2a';
      ctx.fillRect(0, h * 0.8, b, h * 0.2);
    }

    // Het meer ligt rechts op de grond. Posities zijn fracties van de schermbreedte/-hoogte.
    const meer = { x: 0.75, y: 0.9, breedte: 0.18, hoogte: 0.06 };

    // Vissen zwemmen heen en weer binnen het meer. x is een fractie (0 = linkerkant, 1 = rechterkant).
    const vissen = [
      { x: 0.2, y: 0.4, snelheid: 0.25, kleur: '#ff8c42' },
      { x: 0.6, y: 0.6, snelheid: -0.18, kleur: '#4ecdc4' },
      { x: 0.8, y: 0.3, snelheid: 0.3, kleur: '#ffd166' },
    ];

    function updateVissen(dt) {
      for (const vis of vissen) {
        vis.x += vis.snelheid * dt;
        // Aan de rand van het meer keert de vis om.
        if (vis.x > 0.9 || vis.x < 0.1) vis.snelheid = -vis.snelheid;
      }
    }

    function tekenMeer() {
      const b = canvas.width, h = canvas.height;
      const mx = meer.x * b, my = meer.y * h;
      const rx = meer.breedte * b, ry = meer.hoogte * h;

      // Water
      ctx.fillStyle = '#1e5a8a';
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Lichte rand aan de bovenkant, als weerspiegeling van de maan
      ctx.strokeStyle = '#7fb3d5';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, Math.PI, Math.PI * 2);
      ctx.stroke();

      for (const vis of vissen) {
        // Vis-positie omrekenen naar het scherm; y blijft binnen de ellips.
        const vx = mx - rx + vis.x * rx * 2;
        const vy = my - ry * 0.6 + vis.y * ry * 1.2;
        tekenVis(vx, vy, vis.snelheid > 0 ? 1 : -1, vis.kleur);
      }
    }

    function tekenVis(x, y, richting, kleur) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting, 1);

      // Lijf
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      // Staart
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.lineTo(-22, -8);
      ctx.lineTo(-22, 8);
      ctx.closePath();
      ctx.fill();
      // Oog
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7, -2, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function tekenGrot() {
      const b = canvas.width, h = canvas.height;
      const x = b * 0.15, y = h * 0.8;
      // Rots
      ctx.fillStyle = '#5a5045';
      ctx.beginPath();
      ctx.arc(x, y, 110, Math.PI, 0);
      ctx.fill();
      // Donkere ingang
      ctx.fillStyle = '#0a0806';
      ctx.beginPath();
      ctx.arc(x, y, 55, Math.PI, 0);
      ctx.fill();
    }


    function tekenPoppetje(x, y, richting) {
      // Spiegel de tekening als het poppetje naar links kijkt.
      ctx.save();
      ctx.translate(x, 0);
      ctx.scale(richting, 1);
      x = 0;

      // Benen
      ctx.strokeStyle = '#e0ac69';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 10, y);
      ctx.lineTo(x - 6, y - 40);
      ctx.moveTo(x + 10, y);
      ctx.lineTo(x + 6, y - 40);
      ctx.stroke();

      // Dierenvel (lijf)
      ctx.fillStyle = '#a0522d';
      ctx.beginPath();
      ctx.moveTo(x - 22, y - 40);
      ctx.lineTo(x + 22, y - 40);
      ctx.lineTo(x + 16, y - 95);
      ctx.lineTo(x - 16, y - 95);
      ctx.closePath();
      ctx.fill();
      // Vlekken op het vel
      ctx.fillStyle = '#5a2d0c';
      ctx.beginPath();
      ctx.arc(x - 6, y - 60, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 78, 4, 0, Math.PI * 2);
      ctx.fill();

      // Armen
      ctx.strokeStyle = '#e0ac69';
      ctx.beginPath();
      ctx.moveTo(x - 14, y - 90);
      ctx.lineTo(x - 30, y - 60);
      ctx.moveTo(x + 14, y - 90);
      ctx.lineTo(x + 34, y - 105);
      ctx.stroke();

      // Knots in de rechterhand
      ctx.strokeStyle = '#6b4423';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x + 34, y - 105);
      ctx.lineTo(x + 50, y - 150);
      ctx.stroke();
      ctx.fillStyle = '#6b4423';
      ctx.beginPath();
      ctx.arc(x + 52, y - 156, 12, 0, Math.PI * 2);
      ctx.fill();

      // Hoofd
      ctx.fillStyle = '#e0ac69';
      ctx.beginPath();
      ctx.arc(x, y - 115, 22, 0, Math.PI * 2);
      ctx.fill();

      // Wild haar
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.arc(x, y - 125, 24, Math.PI, 0);
      ctx.fill();
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 10 - 5, y - 125);
        ctx.lineTo(x + i * 10, y - 152);
        ctx.lineTo(x + i * 10 + 5, y - 125);
        ctx.fill();
      }

      // Ogen
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x - 8, y - 115, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 115, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x - 7, y - 115, 2, 0, Math.PI * 2);
      ctx.arc(x + 9, y - 115, 2, 0, Math.PI * 2);
      ctx.fill();

      // Mond
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y - 105, 8, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenLucht();
      tekenHeuvels();
      tekenGrond();
      tekenMeer();
      tekenGrot();
      // Het poppetje staat altijd op de grond.
      speler.y = canvas.height * 0.85;
      tekenPoppetje(speler.x, speler.y, speler.richting);
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
