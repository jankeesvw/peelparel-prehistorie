<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>99-nachten-in-de-prehistorie</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; color: #eee; font-family: sans-serif; }
    canvas { display: block; background: #0b1030; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Hoeveel seconden het spel al loopt. Handig voor animaties die vanzelf bewegen.
    let tijd = 0;

    // ---------- Dag en nacht ----------

    // dagTijd loopt van 0 tot 1: 0 is middernacht, 0.25 zonsopkomst, 0.5 middag, 0.75 zonsondergang.
    const dagDuur = 60; // seconden voor een hele dag plus nacht
    let dagTijd = 0.05;
    let nacht = 1; // we beginnen in de eerste nacht

    function updateDagNacht(dt) {
      const vorigeDagTijd = dagTijd;
      dagTijd = (dagTijd + dt / dagDuur) % 1;
      // Zodra de zon onder is, begint een nieuwe nacht.
      if (vorigeDagTijd < 0.75 && dagTijd >= 0.75) nacht++;
    }

    // Hoeveel daglicht er is, van 0 (diepe nacht) tot 1 (volle dag).
    function daglicht() {
      const ruw = 0.5 - 0.5 * Math.cos(dagTijd * Math.PI * 2);
      // Scherper maken zodat de overgang rond zonsopkomst en -ondergang zit
      const t = Math.max(0, Math.min(1, (ruw - 0.2) / 0.45));
      return t * t * (3 - 2 * t);
    }

    // Hoe sterk de schemering (oranje gloed) nu is, van 0 tot 1.
    function schemering() {
      const d = daglicht();
      return Math.exp(-(((d - 0.4) / 0.22) ** 2));
    }

    function isNacht() {
      return dagTijd >= 0.75 || dagTijd < 0.25;
    }

    // Twee kleuren mengen. t = 0 geeft kleur a, t = 1 geeft kleur b.
    function mengKleur(a, b, t) {
      const pa = hexNaarRgb(a), pb = hexNaarRgb(b);
      const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
      const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
      const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
      return `rgb(${r},${g},${bl})`;
    }
    function hexNaarRgb(hex) {
      return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    }

    // Het poppetje: een holbewoner. x en y zijn de plek van zijn voeten.
    // richting is 1 (naar rechts kijken) of -1 (naar links kijken).
    // stap loopt op tijdens het lopen en zorgt voor de beenbeweging.
    // slaat telt af tijdens een slag met de knots.
    const speler = { x: window.innerWidth * 0.4, y: 0, richting: 1, stap: 0, loopt: false, slaat: 0 };

    // Welke toetsen zijn nu ingedrukt?
    const toetsen = {};
    window.addEventListener('keydown', (e) => {
      // Als de winkel open is, gaan alle toetsen naar het winkelmenu.
      if (winkelOpen) {
        winkelToets(e.key);
        e.preventDefault();
        return;
      }
      toetsen[e.key] = true;
      // Spatie is de actietoets: slaan met je wapen, of vissen bij het meer.
      if (e.key === ' ' && !e.repeat) actie();
      // E opent de winkel als je bij de handelaar staat.
      if ((e.key === 'e' || e.key === 'E') && bijHandelaar()) openWinkel();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    const loopSnelheid = 250; // pixels per seconde

    function update(dt) {
      tijd += dt;
      updateDagNacht(dt);
      speler.loopt = false;
      if (winkelOpen) { toetsen['ArrowLeft'] = false; toetsen['ArrowRight'] = false; }
      if (toetsen['ArrowLeft']) {
        speler.x -= loopSnelheid * dt;
        speler.richting = -1;
        speler.loopt = true;
      }
      if (toetsen['ArrowRight']) {
        speler.x += loopSnelheid * dt;
        speler.richting = 1;
        speler.loopt = true;
      }
      if (speler.loopt) speler.stap += dt * 10;
      // Niet buiten het scherm lopen.
      speler.x = Math.max(30, Math.min(canvas.width - 30, speler.x));
      if (speler.slaat > 0) speler.slaat -= dt;

      updateVissen(dt);
      updateDieren(dt);
      raapStenenOp();
      updateMeldingen(dt);
      updateRonde(dt);
    }

    // ---------- Missies ----------

    // Elke missie heeft een doel en een voortgang. Als voortgang het doel haalt, is de missie klaar.
    const missies = [
      { naam: 'Jaag op 3 everzwijnen', soort: 'jagen', doel: 3, voortgang: 0 },
      { naam: 'Vang 2 vissen uit het meer', soort: 'vissen', doel: 2, voortgang: 0 },
      { naam: 'Verzamel 5 stenen', soort: 'stenen', doel: 5, voortgang: 0 },
    ];

    // Munten verdien je met missies: 2 per stap en 10 extra als een missie klaar is.
    let munten = 0;
    const muntenPerStap = 2;
    const muntenPerMissie = 10;

    function missieVoortgang(soort, x, y) {
      const missie = missies.find(m => m.soort === soort);
      if (!missie || missie.voortgang >= missie.doel) return;
      missie.voortgang++;
      munten += muntenPerStap;
      toonMelding(`+${muntenPerStap} munten`, x, y, '#ffd166');
      if (missie.voortgang === missie.doel) {
        munten += muntenPerMissie;
        toonMelding(`Missie voltooid! +${muntenPerMissie} munten`, x, y - 40, '#ffd166');
      }
      if (alleMissiesKlaar()) nieuweRondeOver = 5;
    }

    function alleMissiesKlaar() {
      return missies.every(m => m.voortgang >= m.doel);
    }

    // Als alle missies klaar zijn, begint na een paar seconden een nieuwe ronde met grotere doelen.
    let ronde = 1;
    let nieuweRondeOver = 0;
    function updateRonde(dt) {
      if (nieuweRondeOver <= 0) return;
      nieuweRondeOver -= dt;
      if (nieuweRondeOver <= 0) {
        ronde++;
        for (const m of missies) { m.doel += 1; m.voortgang = 0; }
        // Nieuwe stenen op de grond
        while (stenen.length < 12) stenen.push({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 6 });
        toonMelding(`Ronde ${ronde}!`, canvas.width / 2, canvas.height * 0.3, '#ffd166');
      }
    }

    // Korte tekstjes die omhoog zweven en vervagen, zoals "+1".
    const meldingen = [];
    function toonMelding(tekst, x, y, kleur = '#fff') {
      meldingen.push({ tekst, x, y, kleur, tijd: 1.2 });
    }
    function updateMeldingen(dt) {
      for (const m of meldingen) { m.tijd -= dt; m.y -= 40 * dt; }
      for (let i = meldingen.length - 1; i >= 0; i--) if (meldingen[i].tijd <= 0) meldingen.splice(i, 1);
    }
    function tekenMeldingen() {
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px sans-serif';
      for (const m of meldingen) {
        ctx.globalAlpha = Math.min(1, m.tijd);
        ctx.fillStyle = m.kleur;
        ctx.fillText(m.tekst, m.x, m.y);
      }
      ctx.globalAlpha = 1;
    }

    // De actietoets: eerst kijken of er een dier binnen bereik is, anders of we bij het meer staan.
    function actie() {
      speler.slaat = 0.35;
      const bereik = wapens[huidigWapen].bereik;
      for (let i = dieren.length - 1; i >= 0; i--) {
        const d = dieren[i];
        const afstand = d.x - speler.x;
        // Alleen dieren vóór het poppetje en dichtbij genoeg
        if (Math.abs(afstand) < bereik && Math.sign(afstand) === speler.richting) {
          dieren.splice(i, 1);
          missieVoortgang('jagen', d.x, speler.y - 120);
          return;
        }
      }
      const mx = meer.x * canvas.width, rx = meer.breedte * canvas.width;
      if (Math.abs(speler.x - mx) < rx + 40 && vissen.length > 0) {
        const vis = vissen.pop();
        missieVoortgang('vissen', speler.x, speler.y - 170);
        // Na een paar seconden zwemt er een nieuwe vis het meer in.
        setTimeout(() => vissen.push({ x: 0.5, y: Math.random(), snelheid: vis.snelheid, kleur: vis.kleur }), 4000);
      }
    }

    function tekenMissies() {
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(16, 16, 330, 40 + missies.length * 30);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Missies', 30, 44);
      ctx.font = '18px sans-serif';
      let actiefGevonden = false;
      missies.forEach((m, i) => {
        const klaar = m.voortgang >= m.doel;
        const actief = !klaar && !actiefGevonden;
        if (actief) actiefGevonden = true;
        ctx.fillStyle = klaar ? '#8fd18f' : actief ? '#fff' : 'rgba(255,255,255,0.5)';
        const vinkje = klaar ? '\u2713 ' : (actief ? '\u25B6 ' : '\u25CB ');
        ctx.fillText(`${vinkje}${m.naam}  ${m.voortgang}/${m.doel}`, 30, 76 + i * 30);
      });
      // Munten en huidig wapen, onder het missiepaneel
      const py = 16 + 40 + missies.length * 30 + 10;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(16, py, 330, 40);
      tekenMunt(38, py + 20, 11);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(`${munten} munten`, 56, py + 27);
      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'right';
      ctx.fillText(`Wapen: ${wapens[huidigWapen].naam}`, 336, py + 26);
      ctx.textAlign = 'left';

      // Uitleg van de besturing
      ctx.font = '15px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('Pijltjes = lopen, spatie = slaan / vissen, E = handelen', 20, py + 62);

      if (alleMissiesKlaar()) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px sans-serif';
        ctx.fillStyle = '#ffd166';
        ctx.fillText('Alle missies voltooid!', canvas.width / 2, canvas.height * 0.35);
        ctx.font = '22px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Ronde ${ronde + 1} begint zo...`, canvas.width / 2, canvas.height * 0.35 + 36);
      }
    }

    function tekenMunt(x, y, r) {
      ctx.fillStyle = '#d4a017';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5cf4a';
      ctx.beginPath(); ctx.arc(x, y, r * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b8860b';
      ctx.font = `bold ${Math.round(r * 1.2)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('M', x, y + r * 0.42);
      ctx.textAlign = 'left';
    }

    // ---------- Handelaar en winkel ----------

    // De wapens die je kunt kopen. Een groter bereik betekent dat je dieren van verder weg raakt.
    const wapens = [
      { naam: 'Knots', prijs: 0, bereik: 80, gekocht: true, uitleg: 'Je oude vertrouwde knots.' },
      { naam: 'Stenen bijl', prijs: 10, bereik: 110, gekocht: false, uitleg: 'Scherpe steen op een stok.' },
      { naam: 'Speer', prijs: 20, bereik: 170, gekocht: false, uitleg: 'Lang en puntig, raakt van ver.' },
      { naam: 'Boog', prijs: 35, bereik: 380, gekocht: false, uitleg: 'Schiet over het halve veld.' },
    ];
    let huidigWapen = 0;

    // De handelaar staat met zijn kraampje op een vaste plek op de grond.
    const handelaar = { x: 0.55 };
    let winkelOpen = false;
    let winkelKeuze = 0;
    let winkelBericht = '';

    function handelaarX() { return handelaar.x * canvas.width; }
    function bijHandelaar() { return Math.abs(speler.x - handelaarX()) < 110; }

    function openWinkel() {
      winkelOpen = true;
      winkelKeuze = huidigWapen;
      winkelBericht = 'Welkom! Wat wil je kopen?';
    }

    function winkelToets(toets) {
      if (toets === 'ArrowUp') winkelKeuze = (winkelKeuze + wapens.length - 1) % wapens.length;
      if (toets === 'ArrowDown') winkelKeuze = (winkelKeuze + 1) % wapens.length;
      if (toets === 'Enter' || toets === ' ') koopOfKies(wapens[winkelKeuze], winkelKeuze);
      if (toets === 'e' || toets === 'E' || toets === 'Escape') winkelOpen = false;
    }

    function koopOfKies(wapen, index) {
      if (wapen.gekocht) {
        huidigWapen = index;
        winkelBericht = `Je hebt nu de ${wapen.naam.toLowerCase()} in je hand.`;
      } else if (munten >= wapen.prijs) {
        munten -= wapen.prijs;
        wapen.gekocht = true;
        huidigWapen = index;
        winkelBericht = `Gekocht! Veel jachtplezier met je ${wapen.naam.toLowerCase()}.`;
      } else {
        winkelBericht = `Te weinig munten. Je hebt er nog ${wapen.prijs - munten} nodig.`;
      }
    }

    function tekenHandelaar() {
      const x = handelaarX(), y = speler.y;

      // Kraampje: twee palen met een dierenvel als afdak
      ctx.strokeStyle = '#5a3a1c';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 70, y); ctx.lineTo(x - 70, y - 150);
      ctx.moveTo(x + 70, y); ctx.lineTo(x + 70, y - 150);
      ctx.stroke();
      ctx.fillStyle = '#a0522d';
      ctx.beginPath();
      ctx.moveTo(x - 85, y - 150);
      ctx.lineTo(x + 85, y - 150);
      ctx.lineTo(x + 80, y - 125);
      for (let i = 80; i >= -80; i -= 16) ctx.lineTo(x + i - 8, y - (i % 32 === 0 ? 118 : 128));
      ctx.lineTo(x - 80, y - 125);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4a2410';
      ctx.beginPath();
      ctx.arc(x - 30, y - 138, 6, 0, Math.PI * 2);
      ctx.arc(x + 25, y - 135, 5, 0, Math.PI * 2);
      ctx.fill();

      // De handelaar zelf, achter de tafel: grijs haar, kettinkje van tanden
      const hx = x, hy = y - 20;
      const huid = '#c8905a';
      ctx.fillStyle = '#6b8e5a';
      ctx.beginPath();
      ctx.moveTo(hx - 20, hy - 40); ctx.lineTo(hx + 20, hy - 40);
      ctx.lineTo(hx + 26, hy + 10); ctx.lineTo(hx - 26, hy + 10);
      ctx.closePath();
      ctx.fill();
      // Zwaaiende arm
      const zwaai = Math.sin(tijd * 4) * 0.5;
      ctx.strokeStyle = huid;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(hx + 18, hy - 36);
      ctx.lineTo(hx + 34, hy - 60 + zwaai * 15);
      ctx.lineTo(hx + 30 + zwaai * 10, hy - 85);
      ctx.stroke();
      // Hoofd
      ctx.fillStyle = huid;
      ctx.beginPath(); ctx.arc(hx, hy - 60, 20, 0, Math.PI * 2); ctx.fill();
      // Grijze baard en haar
      ctx.fillStyle = '#c9c4b8';
      ctx.beginPath();
      ctx.moveTo(hx - 17, hy - 56);
      ctx.quadraticCurveTo(hx, hy - 10, hx + 17, hy - 56);
      ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy - 66, 21, Math.PI, 0); ctx.fill();
      // Ketting van tanden
      ctx.fillStyle = '#f0e6d0';
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(hx + i * 6 - 2, hy - 40); ctx.lineTo(hx + i * 6, hy - 32); ctx.lineTo(hx + i * 6 + 2, hy - 40);
        ctx.fill();
      }
      // Ogen
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(hx - 7, hy - 62, 2.2, 0, Math.PI * 2);
      ctx.arc(hx + 7, hy - 62, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // Stenen tafel
      ctx.fillStyle = '#6e6257';
      ctx.fillRect(x - 60, y - 60, 120, 14);
      ctx.fillStyle = '#4d453c';
      ctx.fillRect(x - 50, y - 46, 18, 46);
      ctx.fillRect(x + 32, y - 46, 18, 46);

      // Wapens uitgestald op de tafel: een bijl en een speer
      ctx.save();
      ctx.translate(x - 35, y - 62);
      ctx.rotate(-0.3);
      tekenWapenVorm(1, 0, 0, 0.6);
      ctx.restore();
      ctx.save();
      ctx.translate(x + 10, y - 62);
      ctx.rotate(-1.1);
      tekenWapenVorm(2, 0, 0, 0.55);
      ctx.restore();
      // Stapel munten op de tafel
      tekenMunt(x + 40, y - 66, 6);
      tekenMunt(x + 46, y - 64, 6);

      // Hint als de speler dichtbij staat
      if (bijHandelaar() && !winkelOpen) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(x - 110, y - 200, 220, 30);
        ctx.fillStyle = '#ffd166';
        ctx.fillText('Druk op E om te handelen', x, y - 178);
        ctx.textAlign = 'left';
      }
    }

    function tekenWinkel() {
      if (!winkelOpen) return;
      const b = canvas.width, h = canvas.height;
      const pw = 460, ph = 90 + wapens.length * 56 + 70;
      const px = b / 2 - pw / 2, py = h / 2 - ph / 2;

      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, b, h);
      ctx.fillStyle = '#3b2a1a';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#a0522d';
      ctx.lineWidth = 6;
      ctx.strokeRect(px, py, pw, ph);

      ctx.textAlign = 'left';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Handelaar Oeg', px + 24, py + 40);
      ctx.textAlign = 'right';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`${munten} munten`, px + pw - 24, py + 40);
      tekenMunt(px + pw - 24 - ctx.measureText(`${munten} munten`).width - 18, py + 32, 10);

      wapens.forEach((w, i) => {
        const ry = py + 66 + i * 56;
        const gekozen = i === winkelKeuze;
        ctx.fillStyle = gekozen ? 'rgba(255,209,102,0.2)' : 'rgba(255,255,255,0.04)';
        ctx.fillRect(px + 16, ry, pw - 32, 50);
        if (gekozen) {
          ctx.strokeStyle = '#ffd166';
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 16, ry, pw - 32, 50);
        }
        // Plaatje van het wapen
        ctx.save();
        ctx.translate(px + 50, ry + 38);
        ctx.rotate(-0.9);
        tekenWapenVorm(i, 0, 0, 0.5);
        ctx.restore();

        ctx.textAlign = 'left';
        ctx.font = 'bold 19px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(w.naam, px + 90, ry + 22);
        ctx.font = '14px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText(`${w.uitleg}  Bereik ${w.bereik}`, px + 90, ry + 41);

        ctx.textAlign = 'right';
        ctx.font = 'bold 18px sans-serif';
        if (i === huidigWapen) {
          ctx.fillStyle = '#8fd18f';
          ctx.fillText('In de hand', px + pw - 30, ry + 31);
        } else if (w.gekocht) {
          ctx.fillStyle = '#8fd18f';
          ctx.fillText('Gekocht', px + pw - 30, ry + 31);
        } else {
          ctx.fillStyle = munten >= w.prijs ? '#ffd166' : '#d96c6c';
          ctx.fillText(`${w.prijs} munten`, px + pw - 30, ry + 31);
        }
      });

      ctx.textAlign = 'center';
      ctx.font = '17px sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(winkelBericht, b / 2, py + ph - 40);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('Pijltjes omhoog/omlaag = kiezen, Enter = kopen of in de hand nemen, E = sluiten', b / 2, py + ph - 16);
      ctx.textAlign = 'left';
    }

    // Tekent de vorm van een wapen met het handvat op (x, y), rechtop naar boven. Wordt gebruikt
    // in de hand van het poppetje, op de tafel van de handelaar en in het winkelmenu.
    function tekenWapenVorm(index, x, y, schaal = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      ctx.lineCap = 'round';
      if (index === 0) {
        // Knots: knoestig stuk hout met een dikke kop
        ctx.strokeStyle = '#5a3a1c';
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, -50); ctx.stroke();
        const knots = ctx.createRadialGradient(14, -60, 2, 18, -56, 14);
        knots.addColorStop(0, '#8a5a30');
        knots.addColorStop(1, '#4a2e14');
        ctx.fillStyle = knots;
        ctx.beginPath(); ctx.ellipse(18, -56, 13, 16, 0.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2e1a0a';
        ctx.beginPath();
        ctx.arc(24, -62, 2.5, 0, Math.PI * 2);
        ctx.arc(12, -50, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (index === 1) {
        // Stenen bijl: stok met een scherpe steen, vastgebonden met touw
        ctx.strokeStyle = '#6b4a2a';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, -60); ctx.stroke();
        ctx.fillStyle = '#8a8a86';
        ctx.beginPath();
        ctx.moveTo(4, -50); ctx.lineTo(30, -70); ctx.lineTo(26, -44); ctx.lineTo(8, -40);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#c9a66b';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(4, -48); ctx.lineTo(14, -54); ctx.moveTo(6, -44); ctx.lineTo(16, -50); ctx.stroke();
      } else if (index === 2) {
        // Speer: lange stok met een stenen punt en veertjes
        ctx.strokeStyle = '#7a5a30';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -95); ctx.stroke();
        ctx.fillStyle = '#9a9a96';
        ctx.beginPath(); ctx.moveTo(-6, -92); ctx.lineTo(0, -115); ctx.lineTo(6, -92); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#d9534f';
        ctx.beginPath(); ctx.moveTo(-1, -85); ctx.lineTo(-9, -78); ctx.lineTo(-1, -70); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(1, -85); ctx.lineTo(9, -78); ctx.lineTo(1, -70); ctx.closePath(); ctx.fill();
      } else {
        // Boog: gebogen tak met een pees, en een pijl
        ctx.strokeStyle = '#7a5a30';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.quadraticCurveTo(28, -30, 0, -90); ctx.stroke();
        ctx.strokeStyle = '#e8e0c8';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, -90); ctx.stroke();
        ctx.strokeStyle = '#c9a66b';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(40, -30); ctx.stroke();
        ctx.fillStyle = '#9a9a96';
        ctx.beginPath(); ctx.moveTo(38, -36); ctx.lineTo(52, -30); ctx.lineTo(38, -24); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // ---------- Dieren ----------

    // Everzwijnen lopen van de ene kant van het scherm naar de andere.
    const dieren = [];
    let volgendDier = 2; // seconden tot het volgende dier verschijnt

    function updateDieren(dt) {
      volgendDier -= dt;
      const jagenKlaar = missies[0].voortgang >= missies[0].doel;
      if (volgendDier <= 0 && dieren.length < 2 && !jagenKlaar) {
        volgendDier = 3 + Math.random() * 3;
        const vanLinks = Math.random() < 0.5;
        dieren.push({
          x: vanLinks ? -60 : canvas.width + 60,
          snelheid: (vanLinks ? 1 : -1) * (70 + Math.random() * 60),
          stap: 0,
        });
      }
      for (let i = dieren.length - 1; i >= 0; i--) {
        const d = dieren[i];
        d.x += d.snelheid * dt;
        d.stap += dt * 12;
        if (d.x < -100 || d.x > canvas.width + 100) dieren.splice(i, 1);
      }
    }

    function tekenDieren() {
      for (const d of dieren) tekenEverzwijn(d.x, speler.y, Math.sign(d.snelheid), d.stap);
    }

    function tekenEverzwijn(x, y, richting, stap) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting, 1);

      // Schaduw
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 34, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pootjes die bewegen
      const zwaai = Math.sin(stap) * 8;
      ctx.strokeStyle = '#3a2a1e';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-18 + zwaai, 0); ctx.lineTo(-18, -22);
      ctx.moveTo(-8 - zwaai, 0); ctx.lineTo(-10, -22);
      ctx.moveTo(12 + zwaai, 0); ctx.lineTo(12, -22);
      ctx.moveTo(22 - zwaai, 0); ctx.lineTo(20, -22);
      ctx.stroke();

      // Lijf
      const vacht = ctx.createLinearGradient(0, -45, 0, -15);
      vacht.addColorStop(0, '#5a4030');
      vacht.addColorStop(1, '#2e2018');
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(0, -32, 32, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      // Borstelige rug
      ctx.fillStyle = '#241810';
      for (let i = -24; i <= 16; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, -46); ctx.lineTo(i + 3, -56); ctx.lineTo(i + 7, -46);
        ctx.fill();
      }
      // Kop met snuit
      ctx.fillStyle = '#4a3324';
      ctx.beginPath();
      ctx.ellipse(32, -30, 16, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7a5a48';
      ctx.beginPath();
      ctx.ellipse(46, -26, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Slagtanden
      ctx.strokeStyle = '#f0e6d0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(42, -22); ctx.lineTo(48, -32);
      ctx.stroke();
      // Oor en oog
      ctx.fillStyle = '#3a2a1e';
      ctx.beginPath();
      ctx.moveTo(26, -40); ctx.lineTo(30, -52); ctx.lineTo(36, -40);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(36, -33, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // Staartje
      ctx.strokeStyle = '#3a2a1e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-30, -38);
      ctx.quadraticCurveTo(-42, -44 + Math.sin(stap) * 4, -40, -30);
      ctx.stroke();

      ctx.restore();
    }

    // ---------- Stenen oprapen ----------

    function raapStenenOp() {
      const b = canvas.width;
      const stenenKlaar = missies[2].voortgang >= missies[2].doel;
      if (stenenKlaar) return;
      for (let i = stenen.length - 1; i >= 0; i--) {
        if (Math.abs(stenen[i].x * b - speler.x) < 18) {
          stenen.splice(i, 1);
          missieVoortgang('stenen', speler.x, speler.y - 170);
        }
      }
    }

    // ---------- Lucht ----------

    // Vaste sterren, zodat ze niet elke frame verspringen. Elke ster twinkelt in zijn eigen tempo.
    const sterren = [];
    for (let i = 0; i < 200; i++) {
      sterren.push({
        x: Math.random(),
        y: Math.random() * 0.65,
        grootte: 0.5 + Math.random() * 1.8,
        tempo: 1 + Math.random() * 3,
        fase: Math.random() * Math.PI * 2,
      });
    }

    function tekenLucht() {
      const b = canvas.width, h = canvas.height;
      const d = daglicht(), sch = schemering();

      // Nachtkleuren mengen met dagkleuren, en daar de oranje schemering overheen.
      let boven = mengKleur('#02030f', '#3b8fd9', d);
      let midden = mengKleur('#0d1440', '#8ec5ea', d);
      let horizon = mengKleur('#3a2f5c', '#d7ecf7', d);
      midden = mengKleur(rgbNaarHex(midden), '#e07a3a', sch * 0.5);
      horizon = mengKleur(rgbNaarHex(horizon), '#ffb347', sch * 0.85);

      const lucht = ctx.createLinearGradient(0, 0, 0, h * 0.75);
      lucht.addColorStop(0, boven);
      lucht.addColorStop(0.6, midden);
      lucht.addColorStop(1, horizon);
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      // Melkweg: een vage lichte band schuin over de hemel.
      ctx.save();
      ctx.translate(b * 0.5, h * 0.3);
      ctx.rotate(-0.4);
      const melkweg = ctx.createLinearGradient(0, -h * 0.12, 0, h * 0.12);
      melkweg.addColorStop(0, 'rgba(180,190,255,0)');
      melkweg.addColorStop(0.5, 'rgba(180,190,255,0.10)');
      melkweg.addColorStop(1, 'rgba(180,190,255,0)');
      ctx.fillStyle = melkweg;
      ctx.fillRect(-b, -h * 0.12, b * 2, h * 0.24);
      ctx.restore();

      // Sterren vervagen zodra het licht wordt.
      const sterLicht = 1 - d;
      if (sterLicht > 0.02) {
        for (const s of sterren) {
          const helderheid = 0.5 + 0.5 * Math.sin(tijd * s.tempo + s.fase);
          ctx.fillStyle = `rgba(255,255,255,${(0.3 + 0.7 * helderheid) * sterLicht})`;
          ctx.beginPath();
          ctx.arc(s.x * b, s.y * h, s.grootte, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // De zon staat overdag aan de hemel, de maan 's nachts. Beide volgen een boog van links naar rechts.
      const zon = hemelPositie(dagTijd);
      const maan = hemelPositie((dagTijd + 0.5) % 1);
      if (maan) tekenMaan(maan.x, maan.y, 42);
      if (zon) tekenZon(zon.x, zon.y, 46);
    }

    // Plek van een hemellichaam dat opkomt bij t = 0.25 en ondergaat bij t = 0.75. Buiten die tijd: null.
    function hemelPositie(t) {
      if (t < 0.22 || t > 0.78) return null;
      const b = canvas.width, h = canvas.height;
      const voortgang = (t - 0.25) / 0.5; // 0 bij opkomst, 1 bij ondergang
      return {
        x: b * (0.08 + 0.84 * voortgang),
        y: h * 0.72 - Math.sin(voortgang * Math.PI) * h * 0.6,
      };
    }

    function rgbNaarHex(rgb) {
      const n = rgb.match(/\d+/g).map(Number);
      return '#' + n.map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function tekenZon(x, y, r) {
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 5);
      gloed.addColorStop(0, 'rgba(255,230,150,0.45)');
      gloed.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = gloed;
      ctx.beginPath();
      ctx.arc(x, y, r * 5, 0, Math.PI * 2);
      ctx.fill();

      const kern = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
      kern.addColorStop(0, '#fffbe0');
      kern.addColorStop(1, '#ffcc33');
      ctx.fillStyle = kern;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function tekenMaan(x, y, r) {
      // Zachte gloed rond de maan
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 4);
      gloed.addColorStop(0, 'rgba(255,245,200,0.25)');
      gloed.addColorStop(1, 'rgba(255,245,200,0)');
      ctx.fillStyle = gloed;
      ctx.beginPath();
      ctx.arc(x, y, r * 4, 0, Math.PI * 2);
      ctx.fill();

      // De maan zelf, iets donkerder aan de onderkant
      const maan = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
      maan.addColorStop(0, '#fffbe6');
      maan.addColorStop(1, '#d9d3a0');
      ctx.fillStyle = maan;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Kraters
      ctx.fillStyle = 'rgba(150,140,100,0.45)';
      for (const k of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.13], [0.0, 0.45, 0.1], [-0.45, 0.35, 0.08]]) {
        ctx.beginPath();
        ctx.arc(x + k[0] * r, y + k[1] * r, k[2] * r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---------- Landschap ----------

    // Een golvende heuvellijn tekenen. De vorm hangt af van een "zaad" zodat elke laag anders is.
    function heuvelPad(basisY, hoogte, zaad) {
      const b = canvas.width, h = canvas.height;
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= b; x += 10) {
        const t = x / b;
        const y = basisY
          + Math.sin(t * 5 + zaad) * hoogte
          + Math.sin(t * 13 + zaad * 2) * hoogte * 0.3;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(b, h);
      ctx.closePath();
    }

    function tekenHeuvels() {
      const h = canvas.height;
      // Verre bergen in blauwgrijs (mist), daarna steeds dichterbij en donkerder.
      ctx.fillStyle = '#2a2f55';
      heuvelPad(h * 0.55, h * 0.08, 1.0);
      ctx.fill();
      ctx.fillStyle = '#1b2a3a';
      heuvelPad(h * 0.64, h * 0.05, 2.7);
      ctx.fill();
      tekenBomen(h * 0.66, 2.7, 0.55);
      ctx.fillStyle = '#12261a';
      heuvelPad(h * 0.74, h * 0.035, 4.1);
      ctx.fill();
      tekenBomen(h * 0.77, 4.1, 0.9);
    }

    // Prehistorische bomen: kale stammen met een bosje palmbladeren erop.
    function tekenBomen(basisY, zaad, schaal) {
      const b = canvas.width;
      for (let i = 0; i < 9; i++) {
        const t = (i / 9 + zaad * 0.1) % 1;
        const x = t * b;
        const hoogte = (60 + ((i * 37 + zaad * 100) % 40)) * schaal;
        tekenPalm(x, basisY, hoogte, schaal);
      }
    }

    function tekenPalm(x, y, hoogte, schaal) {
      ctx.strokeStyle = '#0d1a10';
      ctx.lineWidth = 5 * schaal;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 10 * schaal, y - hoogte * 0.6, x, y - hoogte);
      ctx.stroke();
      // Bladeren die zachtjes wiegen in de wind
      const wind = Math.sin(tijd * 1.5 + x) * 0.08;
      ctx.fillStyle = '#0d1a10';
      for (let i = 0; i < 6; i++) {
        const hoek = (i / 6) * Math.PI * 2 + wind;
        ctx.beginPath();
        ctx.ellipse(x + Math.cos(hoek) * 14 * schaal, y - hoogte + Math.sin(hoek) * 8 * schaal,
          22 * schaal, 6 * schaal, hoek, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Vaste plekken voor grassprietjes en stenen, zodat ze niet flikkeren.
    const sprietjes = [];
    for (let i = 0; i < 160; i++) sprietjes.push({ x: Math.random(), y: Math.random(), l: 6 + Math.random() * 10 });
    const stenen = [];
    for (let i = 0; i < 12; i++) stenen.push({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 6 });

    function tekenGrond() {
      const b = canvas.width, h = canvas.height;
      const top = h * 0.8;
      const grond = ctx.createLinearGradient(0, top, 0, h);
      grond.addColorStop(0, '#3f6b2a');
      grond.addColorStop(0.3, '#2f5220');
      grond.addColorStop(1, '#1d3314');
      ctx.fillStyle = grond;
      ctx.fillRect(0, top, b, h - top);

      // Zachte lichte rand bovenaan de grond, waar het maanlicht op valt
      ctx.fillStyle = 'rgba(160,200,120,0.25)';
      ctx.fillRect(0, top, b, 3);

      // Stenen
      ctx.fillStyle = '#4a4a44';
      for (const st of stenen) {
        ctx.beginPath();
        ctx.ellipse(st.x * b, top + 10 + st.y * (h - top - 20), st.r * 1.4, st.r, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Grassprietjes die wiegen in de wind
      ctx.strokeStyle = '#5e9a3a';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const sp of sprietjes) {
        const x = sp.x * b, y = top + sp.y * (h - top);
        const buig = Math.sin(tijd * 2 + x * 0.05) * 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + buig, y - sp.l * 0.6, x + buig * 2, y - sp.l);
        ctx.stroke();
      }
    }

    // ---------- Meer en vissen ----------

    // Het meer ligt rechts op de grond. Posities zijn fracties van de schermbreedte/-hoogte.
    const meer = { x: 0.75, y: 0.9, breedte: 0.18, hoogte: 0.06 };

    // Vissen zwemmen heen en weer binnen het meer. x is een fractie (0 = linkerkant, 1 = rechterkant).
    const vissen = [
      { x: 0.2, y: 0.4, snelheid: 0.25, kleur: '#ff8c42' },
      { x: 0.6, y: 0.6, snelheid: -0.18, kleur: '#4ecdc4' },
      { x: 0.8, y: 0.3, snelheid: 0.3, kleur: '#ffd166' },
    ];

    function updateVissen(dt) {
      for (const vis of vissen) {
        vis.x += vis.snelheid * dt;
        // Aan de rand van het meer keert de vis om.
        if (vis.x > 0.9 || vis.x < 0.1) vis.snelheid = -vis.snelheid;
      }
    }

    function tekenMeer() {
      const b = canvas.width, h = canvas.height;
      const mx = meer.x * b, my = meer.y * h;
      const rx = meer.breedte * b, ry = meer.hoogte * h;

      // Modderige oever rond het water
      ctx.fillStyle = '#4a3d2a';
      ctx.beginPath();
      ctx.ellipse(mx, my, rx + 14, ry + 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Water: donker aan de randen, iets lichter in het midden
      const water = ctx.createRadialGradient(mx, my, 0, mx, my, rx);
      water.addColorStop(0, '#2b6f9e');
      water.addColorStop(1, '#123a5c');
      ctx.fillStyle = water;
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Alles hierna blijft binnen het water (ook de vissen).
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      // Weerspiegeling van de maan (of overdag de zon), licht bewegend door de golfjes
      ctx.fillStyle = `rgba(255,245,200,${0.18 + 0.15 * daglicht()})`;
      for (let i = 0; i < 5; i++) {
        const w = 30 + Math.sin(tijd * 1.3 + i) * 12;
        ctx.beginPath();
        ctx.ellipse(mx + rx * 0.15 + Math.sin(tijd + i * 2) * 4, my - ry * 0.5 + i * 9, w, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const vis of vissen) {
        // Vis-positie omrekenen naar het scherm; y blijft binnen de ellips.
        const vx = mx - rx + vis.x * rx * 2;
        const vy = my - ry * 0.6 + vis.y * ry * 1.2;
        tekenVis(vx, vy, vis.snelheid > 0 ? 1 : -1, vis.kleur);
      }

      // Rimpels op het oppervlak, bewegend
      ctx.strokeStyle = 'rgba(200,230,255,0.25)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const y = my - ry + ((tijd * 12 + i * ry * 0.4) % (ry * 2));
        const halveBreedte = Math.sqrt(Math.max(0, 1 - ((y - my) / ry) ** 2)) * rx;
        ctx.beginPath();
        ctx.moveTo(mx - halveBreedte + 6, y);
        for (let x = mx - halveBreedte + 6; x <= mx + halveBreedte - 6; x += 12) {
          ctx.lineTo(x, y + Math.sin(x * 0.15 + tijd * 3) * 1.5);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Riet aan de oever
      ctx.strokeStyle = '#2f4a1e';
      ctx.lineWidth = 3;
      for (let i = 0; i < 7; i++) {
        const x = mx - rx * 0.9 + i * 9;
        const buig = Math.sin(tijd * 1.8 + i) * 4;
        ctx.beginPath();
        ctx.moveTo(x, my);
        ctx.quadraticCurveTo(x + buig, my - 25, x + buig * 2, my - 45 - (i % 3) * 8);
        ctx.stroke();
        ctx.fillStyle = '#6b4a2a';
        ctx.beginPath();
        ctx.ellipse(x + buig * 2, my - 48 - (i % 3) * 8, 2.5, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenVis(x, y, richting, kleur) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting, 1);

      // Staart zwaait heen en weer tijdens het zwemmen
      const zwaai = Math.sin(tijd * 10 + x) * 4;

      // Lijf met glans
      const lijf = ctx.createLinearGradient(0, -7, 0, 7);
      lijf.addColorStop(0, kleur);
      lijf.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = lijf;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      // Staart
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.lineTo(-22, -8 + zwaai);
      ctx.lineTo(-22, 8 + zwaai);
      ctx.closePath();
      ctx.fill();
      // Rugvin en buikvin
      ctx.beginPath();
      ctx.moveTo(-4, -6);
      ctx.lineTo(2, -12);
      ctx.lineTo(6, -6);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(2, 6);
      ctx.lineTo(-2, 11);
      ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fill();
      // Oog
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(7, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7.5, -2, 1.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---------- Grot ----------

    function tekenGrot() {
      const b = canvas.width, h = canvas.height;
      const x = b * 0.15, y = h * 0.8;

      // Rots met wat diepte: lichter bovenaan waar de maan op schijnt
      const rots = ctx.createRadialGradient(x - 30, y - 90, 10, x, y, 120);
      rots.addColorStop(0, '#7a6d5e');
      rots.addColorStop(1, '#3d342c');
      ctx.fillStyle = rots;
      ctx.beginPath();
      ctx.moveTo(x - 120, y);
      ctx.bezierCurveTo(x - 130, y - 70, x - 70, y - 130, x - 10, y - 120);
      ctx.bezierCurveTo(x + 50, y - 125, x + 125, y - 70, x + 115, y);
      ctx.closePath();
      ctx.fill();

      // Barsten in de rots
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 70, y - 60); ctx.lineTo(x - 55, y - 80); ctx.lineTo(x - 60, y - 95);
      ctx.moveTo(x + 60, y - 30); ctx.lineTo(x + 75, y - 55); ctx.lineTo(x + 70, y - 70);
      ctx.stroke();

      // Mos op de rots
      ctx.fillStyle = 'rgba(70,110,50,0.6)';
      ctx.beginPath();
      ctx.ellipse(x - 50, y - 100, 22, 7, -0.4, 0, Math.PI * 2);
      ctx.ellipse(x + 30, y - 112, 18, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Donkere ingang, met een zwak vuurschijnsel vanuit de diepte
      const ingang = ctx.createRadialGradient(x, y - 10, 5, x, y, 60);
      ingang.addColorStop(0, '#3a1d08');
      ingang.addColorStop(0.5, '#120906');
      ingang.addColorStop(1, '#050302');
      ctx.fillStyle = ingang;
      ctx.beginPath();
      ctx.moveTo(x - 55, y);
      ctx.bezierCurveTo(x - 60, y - 60, x - 20, y - 80, x, y - 78);
      ctx.bezierCurveTo(x + 20, y - 80, x + 60, y - 60, x + 55, y);
      ctx.closePath();
      ctx.fill();
    }

    // ---------- Poppetje ----------

    function tekenPoppetje(x, y, richting) {
      // Schaduw op de grond
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, 26, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Spiegel de tekening als het poppetje naar links kijkt.
      ctx.save();
      ctx.translate(x, 0);
      ctx.scale(richting, 1);
      x = 0;

      // Beenbeweging: tijdens het lopen zwaaien de benen tegengesteld.
      const zwaai = speler.loopt ? Math.sin(speler.stap) * 12 : 0;
      const huid = '#d9a066', huidDonker = '#b9804a';

      // Benen met knieën
      ctx.strokeStyle = huid;
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 10 + zwaai, y);
      ctx.lineTo(x - 8 + zwaai * 0.5, y - 22);
      ctx.lineTo(x - 6, y - 42);
      ctx.moveTo(x + 10 - zwaai, y);
      ctx.lineTo(x + 8 - zwaai * 0.5, y - 22);
      ctx.lineTo(x + 6, y - 42);
      ctx.stroke();

      // Voeten
      ctx.fillStyle = huidDonker;
      ctx.beginPath();
      ctx.ellipse(x - 8 + zwaai, y, 9, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 12 - zwaai, y, 9, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dierenvel (lijf) met rafelige onderrand en vacht-schaduw
      const vel = ctx.createLinearGradient(x - 20, 0, x + 20, 0);
      vel.addColorStop(0, '#8b4a22');
      vel.addColorStop(0.5, '#b8683a');
      vel.addColorStop(1, '#7a3d1c');
      ctx.fillStyle = vel;
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 96);
      ctx.lineTo(x + 16, y - 96);
      ctx.lineTo(x + 22, y - 44);
      for (let i = 22; i >= -22; i -= 6) {
        ctx.lineTo(x + i - 3, y - 36 - (i % 12 === 0 ? 0 : 6));
      }
      ctx.lineTo(x - 22, y - 44);
      ctx.closePath();
      ctx.fill();
      // Vlekken op het vel
      ctx.fillStyle = '#4a2410';
      ctx.beginPath();
      ctx.arc(x - 6, y - 60, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 78, 4, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 50, 3, 0, Math.PI * 2);
      ctx.fill();
      // Eén blote schouder: het vel hangt over de linkerschouder
      ctx.fillStyle = huid;
      ctx.beginPath();
      ctx.arc(x + 12, y - 92, 9, 0, Math.PI * 2);
      ctx.fill();

      // Armen (de achterste arm zwaait mee met het lopen)
      ctx.strokeStyle = huid;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(x - 14, y - 90);
      ctx.lineTo(x - 26 - zwaai * 0.5, y - 68);
      ctx.lineTo(x - 30 - zwaai, y - 50);
      ctx.moveTo(x + 14, y - 90);
      ctx.lineTo(x + 30, y - 84);
      ctx.lineTo(x + 34, y - 105);
      ctx.stroke();

      // Het wapen in de hand. Bij een slag draait het om de hand naar voren.
      const slag = speler.slaat > 0 ? Math.sin((0.35 - speler.slaat) / 0.35 * Math.PI) : 0;
      ctx.save();
      ctx.translate(x + 34, y - 100);
      ctx.rotate(slag * 1.8);
      tekenWapenVorm(huidigWapen, 0, 0);
      ctx.restore();

      // Hals
      ctx.fillStyle = huidDonker;
      ctx.fillRect(x - 5, y - 100, 10, 8);

      // Hoofd met een beetje schaduw aan de onderkant
      const hoofd = ctx.createRadialGradient(x - 6, y - 122, 4, x, y - 115, 24);
      hoofd.addColorStop(0, '#e8b57a');
      hoofd.addColorStop(1, huidDonker);
      ctx.fillStyle = hoofd;
      ctx.beginPath();
      ctx.arc(x, y - 115, 22, 0, Math.PI * 2);
      ctx.fill();

      // Baard
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.moveTo(x - 18, y - 112);
      ctx.quadraticCurveTo(x, y - 80, x + 18, y - 112);
      ctx.quadraticCurveTo(x, y - 95, x - 18, y - 112);
      ctx.fill();

      // Wild haar
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.arc(x, y - 122, 24, Math.PI, 0);
      ctx.fill();
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 10 - 6, y - 124);
        ctx.lineTo(x + i * 10 + (i * 2), y - 152 - Math.abs(i) * -4);
        ctx.lineTo(x + i * 10 + 6, y - 124);
        ctx.fill();
      }

      // Wenkbrauwen
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - 13, y - 122); ctx.lineTo(x - 4, y - 120);
      ctx.moveTo(x + 4, y - 120); ctx.lineTo(x + 13, y - 122);
      ctx.stroke();

      // Ogen
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x - 8, y - 115, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 115, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x - 7, y - 115, 2, 0, Math.PI * 2);
      ctx.arc(x + 9, y - 115, 2, 0, Math.PI * 2);
      ctx.fill();

      // Neus
      ctx.fillStyle = huidDonker;
      ctx.beginPath();
      ctx.arc(x + 1, y - 108, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---------- Alles tekenen ----------

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenLucht();
      tekenHeuvels();
      tekenGrond();
      tekenMeer();
      tekenGrot();
      // Het poppetje staat altijd op de grond.
      speler.y = canvas.height * 0.85;
      tekenHandelaar();
      tekenDieren();
      tekenPoppetje(speler.x, speler.y, speler.richting);
      tekenDagNachtLicht();
      tekenMeldingen();
      tekenMissies();
      tekenDagTeller();
      tekenWinkel();
    }

    // Het landschap donkerder maken in de nacht en warmer in de dag.
    function tekenDagNachtLicht() {
      const b = canvas.width, h = canvas.height;
      const d = daglicht(), sch = schemering();
      // Overdag een warme, lichte waas
      if (d > 0) {
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = `rgba(255,225,170,${0.28 * d})`;
        ctx.fillRect(0, 0, b, h);
        ctx.globalCompositeOperation = 'source-over';
      }
      // Bij schemering een oranje gloed
      if (sch > 0.05) {
        ctx.fillStyle = `rgba(255,120,40,${0.12 * sch})`;
        ctx.fillRect(0, 0, b, h);
      }
      // 's Nachts alles blauwig donker
      if (d < 1) {
        ctx.fillStyle = `rgba(5,10,40,${0.35 * (1 - d)})`;
        ctx.fillRect(0, 0, b, h);
      }
    }

    // Rechtsboven: welke nacht (of dag) het is, met een klein zon- of maanicoon.
    function tekenDagTeller() {
      const b = canvas.width;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(b - 236, 16, 220, 44);
      ctx.textAlign = 'right';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ffd166';
      const tekst = isNacht() ? `Nacht ${nacht} van 99` : `Dag ${nacht}`;
      ctx.fillText(tekst, b - 30, 46);
      // Icoontje
      const ix = b - 210, iy = 38;
      if (isNacht()) {
        ctx.fillStyle = '#f4f1c1';
        ctx.beginPath(); ctx.arc(ix, iy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath(); ctx.arc(ix + 5, iy - 3, 8, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#ffcc33';
        ctx.beginPath(); ctx.arc(ix, iy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffcc33';
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const hoek = i * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(ix + Math.cos(hoek) * 12, iy + Math.sin(hoek) * 12);
          ctx.lineTo(ix + Math.cos(hoek) * 16, iy + Math.sin(hoek) * 16);
          ctx.stroke();
        }
      }
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
