<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>99-nachten-in-de-prehistorie</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; color: #eee; font-family: sans-serif; }
    canvas { display: block; background: #0b1030; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Hoeveel seconden het spel al loopt. Handig voor animaties die vanzelf bewegen.
    let tijd = 0;

    // Het poppetje: een holbewoner. x en y zijn de plek van zijn voeten.
    // richting is 1 (naar rechts kijken) of -1 (naar links kijken).
    // stap loopt op tijdens het lopen en zorgt voor de beenbeweging.
    // slaat telt af tijdens een slag met de knots.
    const speler = { x: window.innerWidth * 0.4, y: 0, richting: 1, stap: 0, loopt: false, slaat: 0 };

    // Welke toetsen zijn nu ingedrukt?
    const toetsen = {};
    window.addEventListener('keydown', (e) => {
      toetsen[e.key] = true;
      // Spatie is de actietoets: slaan met de knots, of vissen bij het meer.
      if (e.key === ' ' && !e.repeat) actie();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    const loopSnelheid = 250; // pixels per seconde

    function update(dt) {
      tijd += dt;
      speler.loopt = false;
      if (toetsen['ArrowLeft']) {
        speler.x -= loopSnelheid * dt;
        speler.richting = -1;
        speler.loopt = true;
      }
      if (toetsen['ArrowRight']) {
        speler.x += loopSnelheid * dt;
        speler.richting = 1;
        speler.loopt = true;
      }
      if (speler.loopt) speler.stap += dt * 10;
      // Niet buiten het scherm lopen.
      speler.x = Math.max(30, Math.min(canvas.width - 30, speler.x));
      if (speler.slaat > 0) speler.slaat -= dt;

      updateVissen(dt);
      updateDieren(dt);
      raapStenenOp();
      updateMeldingen(dt);
    }

    // ---------- Missies ----------

    // Elke missie heeft een doel en een voortgang. Als voortgang het doel haalt, is de missie klaar.
    const missies = [
      { naam: 'Jaag op 3 everzwijnen', soort: 'jagen', doel: 3, voortgang: 0 },
      { naam: 'Vang 2 vissen uit het meer', soort: 'vissen', doel: 2, voortgang: 0 },
      { naam: 'Verzamel 5 stenen', soort: 'stenen', doel: 5, voortgang: 0 },
    ];

    function missieVoortgang(soort, x, y) {
      const missie = missies.find(m => m.soort === soort);
      if (!missie || missie.voortgang >= missie.doel) return;
      missie.voortgang++;
      toonMelding('+1', x, y);
      if (missie.voortgang === missie.doel) toonMelding('Missie voltooid!', x, y - 40, '#ffd166');
    }

    function alleMissiesKlaar() {
      return missies.every(m => m.voortgang >= m.doel);
    }

    // Korte tekstjes die omhoog zweven en vervagen, zoals "+1".
    const meldingen = [];
    function toonMelding(tekst, x, y, kleur = '#fff') {
      meldingen.push({ tekst, x, y, kleur, tijd: 1.2 });
    }
    function updateMeldingen(dt) {
      for (const m of meldingen) { m.tijd -= dt; m.y -= 40 * dt; }
      for (let i = meldingen.length - 1; i >= 0; i--) if (meldingen[i].tijd <= 0) meldingen.splice(i, 1);
    }
    function tekenMeldingen() {
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px sans-serif';
      for (const m of meldingen) {
        ctx.globalAlpha = Math.min(1, m.tijd);
        ctx.fillStyle = m.kleur;
        ctx.fillText(m.tekst, m.x, m.y);
      }
      ctx.globalAlpha = 1;
    }

    // De actietoets: eerst kijken of er een dier binnen bereik is, anders of we bij het meer staan.
    function actie() {
      speler.slaat = 0.35;
      const bereik = 80;
      for (let i = dieren.length - 1; i >= 0; i--) {
        const d = dieren[i];
        const afstand = d.x - speler.x;
        // Alleen dieren vóór het poppetje en dichtbij genoeg
        if (Math.abs(afstand) < bereik && Math.sign(afstand) === speler.richting) {
          dieren.splice(i, 1);
          missieVoortgang('jagen', d.x, speler.y - 120);
          return;
        }
      }
      const mx = meer.x * canvas.width, rx = meer.breedte * canvas.width;
      if (Math.abs(speler.x - mx) < rx + 40 && vissen.length > 0) {
        const vis = vissen.pop();
        missieVoortgang('vissen', speler.x, speler.y - 170);
        // Na een paar seconden zwemt er een nieuwe vis het meer in.
        setTimeout(() => vissen.push({ x: 0.5, y: Math.random(), snelheid: vis.snelheid, kleur: vis.kleur }), 4000);
      }
    }

    function tekenMissies() {
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(16, 16, 330, 40 + missies.length * 30);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Missies', 30, 44);
      ctx.font = '18px sans-serif';
      let actiefGevonden = false;
      missies.forEach((m, i) => {
        const klaar = m.voortgang >= m.doel;
        const actief = !klaar && !actiefGevonden;
        if (actief) actiefGevonden = true;
        ctx.fillStyle = klaar ? '#8fd18f' : actief ? '#fff' : 'rgba(255,255,255,0.5)';
        const vinkje = klaar ? '\u2713 ' : (actief ? '\u25B6 ' : '\u25CB ');
        ctx.fillText(`${vinkje}${m.naam}  ${m.voortgang}/${m.doel}`, 30, 76 + i * 30);
      });
      // Uitleg van de besturing
      ctx.font = '15px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('Pijltjes = lopen, spatie = slaan / vissen', 30, 66 + missies.length * 30 + 20);

      if (alleMissiesKlaar()) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px sans-serif';
        ctx.fillStyle = '#ffd166';
        ctx.fillText('Alle missies voltooid!', canvas.width / 2, canvas.height * 0.35);
      }
    }

    // ---------- Dieren ----------

    // Everzwijnen lopen van de ene kant van het scherm naar de andere.
    const dieren = [];
    let volgendDier = 2; // seconden tot het volgende dier verschijnt

    function updateDieren(dt) {
      volgendDier -= dt;
      const jagenKlaar = missies[0].voortgang >= missies[0].doel;
      if (volgendDier <= 0 && dieren.length < 2 && !jagenKlaar) {
        volgendDier = 3 + Math.random() * 3;
        const vanLinks = Math.random() < 0.5;
        dieren.push({
          x: vanLinks ? -60 : canvas.width + 60,
          snelheid: (vanLinks ? 1 : -1) * (70 + Math.random() * 60),
          stap: 0,
        });
      }
      for (let i = dieren.length - 1; i >= 0; i--) {
        const d = dieren[i];
        d.x += d.snelheid * dt;
        d.stap += dt * 12;
        if (d.x < -100 || d.x > canvas.width + 100) dieren.splice(i, 1);
      }
    }

    function tekenDieren() {
      for (const d of dieren) tekenEverzwijn(d.x, speler.y, Math.sign(d.snelheid), d.stap);
    }

    function tekenEverzwijn(x, y, richting, stap) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting, 1);

      // Schaduw
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 34, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pootjes die bewegen
      const zwaai = Math.sin(stap) * 8;
      ctx.strokeStyle = '#3a2a1e';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-18 + zwaai, 0); ctx.lineTo(-18, -22);
      ctx.moveTo(-8 - zwaai, 0); ctx.lineTo(-10, -22);
      ctx.moveTo(12 + zwaai, 0); ctx.lineTo(12, -22);
      ctx.moveTo(22 - zwaai, 0); ctx.lineTo(20, -22);
      ctx.stroke();

      // Lijf
      const vacht = ctx.createLinearGradient(0, -45, 0, -15);
      vacht.addColorStop(0, '#5a4030');
      vacht.addColorStop(1, '#2e2018');
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(0, -32, 32, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      // Borstelige rug
      ctx.fillStyle = '#241810';
      for (let i = -24; i <= 16; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, -46); ctx.lineTo(i + 3, -56); ctx.lineTo(i + 7, -46);
        ctx.fill();
      }
      // Kop met snuit
      ctx.fillStyle = '#4a3324';
      ctx.beginPath();
      ctx.ellipse(32, -30, 16, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7a5a48';
      ctx.beginPath();
      ctx.ellipse(46, -26, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Slagtanden
      ctx.strokeStyle = '#f0e6d0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(42, -22); ctx.lineTo(48, -32);
      ctx.stroke();
      // Oor en oog
      ctx.fillStyle = '#3a2a1e';
      ctx.beginPath();
      ctx.moveTo(26, -40); ctx.lineTo(30, -52); ctx.lineTo(36, -40);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(36, -33, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // Staartje
      ctx.strokeStyle = '#3a2a1e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-30, -38);
      ctx.quadraticCurveTo(-42, -44 + Math.sin(stap) * 4, -40, -30);
      ctx.stroke();

      ctx.restore();
    }

    // ---------- Stenen oprapen ----------

    function raapStenenOp() {
      const b = canvas.width;
      const stenenKlaar = missies[2].voortgang >= missies[2].doel;
      if (stenenKlaar) return;
      for (let i = stenen.length - 1; i >= 0; i--) {
        if (Math.abs(stenen[i].x * b - speler.x) < 18) {
          stenen.splice(i, 1);
          missieVoortgang('stenen', speler.x, speler.y - 170);
        }
      }
    }

    // ---------- Lucht ----------

    // Vaste sterren, zodat ze niet elke frame verspringen. Elke ster twinkelt in zijn eigen tempo.
    const sterren = [];
    for (let i = 0; i < 200; i++) {
      sterren.push({
        x: Math.random(),
        y: Math.random() * 0.65,
        grootte: 0.5 + Math.random() * 1.8,
        tempo: 1 + Math.random() * 3,
        fase: Math.random() * Math.PI * 2,
      });
    }

    function tekenLucht() {
      const b = canvas.width, h = canvas.height;
      const lucht = ctx.createLinearGradient(0, 0, 0, h * 0.75);
      lucht.addColorStop(0, '#02030f');
      lucht.addColorStop(0.6, '#0d1440');
      lucht.addColorStop(1, '#3a2f5c');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      // Melkweg: een vage lichte band schuin over de hemel.
      ctx.save();
      ctx.translate(b * 0.5, h * 0.3);
      ctx.rotate(-0.4);
      const melkweg = ctx.createLinearGradient(0, -h * 0.12, 0, h * 0.12);
      melkweg.addColorStop(0, 'rgba(180,190,255,0)');
      melkweg.addColorStop(0.5, 'rgba(180,190,255,0.10)');
      melkweg.addColorStop(1, 'rgba(180,190,255,0)');
      ctx.fillStyle = melkweg;
      ctx.fillRect(-b, -h * 0.12, b * 2, h * 0.24);
      ctx.restore();

      for (const s of sterren) {
        const helderheid = 0.5 + 0.5 * Math.sin(tijd * s.tempo + s.fase);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.7 * helderheid})`;
        ctx.beginPath();
        ctx.arc(s.x * b, s.y * h, s.grootte, 0, Math.PI * 2);
        ctx.fill();
      }

      tekenMaan(b * 0.8, h * 0.15, 42);
    }

    function tekenMaan(x, y, r) {
      // Zachte gloed rond de maan
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 4);
      gloed.addColorStop(0, 'rgba(255,245,200,0.25)');
      gloed.addColorStop(1, 'rgba(255,245,200,0)');
      ctx.fillStyle = gloed;
      ctx.beginPath();
      ctx.arc(x, y, r * 4, 0, Math.PI * 2);
      ctx.fill();

      // De maan zelf, iets donkerder aan de onderkant
      const maan = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
      maan.addColorStop(0, '#fffbe6');
      maan.addColorStop(1, '#d9d3a0');
      ctx.fillStyle = maan;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Kraters
      ctx.fillStyle = 'rgba(150,140,100,0.45)';
      for (const k of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.13], [0.0, 0.45, 0.1], [-0.45, 0.35, 0.08]]) {
        ctx.beginPath();
        ctx.arc(x + k[0] * r, y + k[1] * r, k[2] * r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---------- Landschap ----------

    // Een golvende heuvellijn tekenen. De vorm hangt af van een "zaad" zodat elke laag anders is.
    function heuvelPad(basisY, hoogte, zaad) {
      const b = canvas.width, h = canvas.height;
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= b; x += 10) {
        const t = x / b;
        const y = basisY
          + Math.sin(t * 5 + zaad) * hoogte
          + Math.sin(t * 13 + zaad * 2) * hoogte * 0.3;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(b, h);
      ctx.closePath();
    }

    function tekenHeuvels() {
      const h = canvas.height;
      // Verre bergen in blauwgrijs (mist), daarna steeds dichterbij en donkerder.
      ctx.fillStyle = '#2a2f55';
      heuvelPad(h * 0.55, h * 0.08, 1.0);
      ctx.fill();
      ctx.fillStyle = '#1b2a3a';
      heuvelPad(h * 0.64, h * 0.05, 2.7);
      ctx.fill();
      tekenBomen(h * 0.66, 2.7, 0.55);
      ctx.fillStyle = '#12261a';
      heuvelPad(h * 0.74, h * 0.035, 4.1);
      ctx.fill();
      tekenBomen(h * 0.77, 4.1, 0.9);
    }

    // Prehistorische bomen: kale stammen met een bosje palmbladeren erop.
    function tekenBomen(basisY, zaad, schaal) {
      const b = canvas.width;
      for (let i = 0; i < 9; i++) {
        const t = (i / 9 + zaad * 0.1) % 1;
        const x = t * b;
        const hoogte = (60 + ((i * 37 + zaad * 100) % 40)) * schaal;
        tekenPalm(x, basisY, hoogte, schaal);
      }
    }

    function tekenPalm(x, y, hoogte, schaal) {
      ctx.strokeStyle = '#0d1a10';
      ctx.lineWidth = 5 * schaal;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 10 * schaal, y - hoogte * 0.6, x, y - hoogte);
      ctx.stroke();
      // Bladeren die zachtjes wiegen in de wind
      const wind = Math.sin(tijd * 1.5 + x) * 0.08;
      ctx.fillStyle = '#0d1a10';
      for (let i = 0; i < 6; i++) {
        const hoek = (i / 6) * Math.PI * 2 + wind;
        ctx.beginPath();
        ctx.ellipse(x + Math.cos(hoek) * 14 * schaal, y - hoogte + Math.sin(hoek) * 8 * schaal,
          22 * schaal, 6 * schaal, hoek, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Vaste plekken voor grassprietjes en stenen, zodat ze niet flikkeren.
    const sprietjes = [];
    for (let i = 0; i < 160; i++) sprietjes.push({ x: Math.random(), y: Math.random(), l: 6 + Math.random() * 10 });
    const stenen = [];
    for (let i = 0; i < 12; i++) stenen.push({ x: Math.random(), y: Math.random(), r: 3 + Math.random() * 6 });

    function tekenGrond() {
      const b = canvas.width, h = canvas.height;
      const top = h * 0.8;
      const grond = ctx.createLinearGradient(0, top, 0, h);
      grond.addColorStop(0, '#3f6b2a');
      grond.addColorStop(0.3, '#2f5220');
      grond.addColorStop(1, '#1d3314');
      ctx.fillStyle = grond;
      ctx.fillRect(0, top, b, h - top);

      // Zachte lichte rand bovenaan de grond, waar het maanlicht op valt
      ctx.fillStyle = 'rgba(160,200,120,0.25)';
      ctx.fillRect(0, top, b, 3);

      // Stenen
      ctx.fillStyle = '#4a4a44';
      for (const st of stenen) {
        ctx.beginPath();
        ctx.ellipse(st.x * b, top + 10 + st.y * (h - top - 20), st.r * 1.4, st.r, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Grassprietjes die wiegen in de wind
      ctx.strokeStyle = '#5e9a3a';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const sp of sprietjes) {
        const x = sp.x * b, y = top + sp.y * (h - top);
        const buig = Math.sin(tijd * 2 + x * 0.05) * 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + buig, y - sp.l * 0.6, x + buig * 2, y - sp.l);
        ctx.stroke();
      }
    }

    // ---------- Meer en vissen ----------

    // Het meer ligt rechts op de grond. Posities zijn fracties van de schermbreedte/-hoogte.
    const meer = { x: 0.75, y: 0.9, breedte: 0.18, hoogte: 0.06 };

    // Vissen zwemmen heen en weer binnen het meer. x is een fractie (0 = linkerkant, 1 = rechterkant).
    const vissen = [
      { x: 0.2, y: 0.4, snelheid: 0.25, kleur: '#ff8c42' },
      { x: 0.6, y: 0.6, snelheid: -0.18, kleur: '#4ecdc4' },
      { x: 0.8, y: 0.3, snelheid: 0.3, kleur: '#ffd166' },
    ];

    function updateVissen(dt) {
      for (const vis of vissen) {
        vis.x += vis.snelheid * dt;
        // Aan de rand van het meer keert de vis om.
        if (vis.x > 0.9 || vis.x < 0.1) vis.snelheid = -vis.snelheid;
      }
    }

    function tekenMeer() {
      const b = canvas.width, h = canvas.height;
      const mx = meer.x * b, my = meer.y * h;
      const rx = meer.breedte * b, ry = meer.hoogte * h;

      // Modderige oever rond het water
      ctx.fillStyle = '#4a3d2a';
      ctx.beginPath();
      ctx.ellipse(mx, my, rx + 14, ry + 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Water: donker aan de randen, iets lichter in het midden
      const water = ctx.createRadialGradient(mx, my, 0, mx, my, rx);
      water.addColorStop(0, '#2b6f9e');
      water.addColorStop(1, '#123a5c');
      ctx.fillStyle = water;
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Alles hierna blijft binnen het water (ook de vissen).
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      // Weerspiegeling van de maan, licht bewegend door de golfjes
      ctx.fillStyle = 'rgba(255,245,200,0.18)';
      for (let i = 0; i < 5; i++) {
        const w = 30 + Math.sin(tijd * 1.3 + i) * 12;
        ctx.beginPath();
        ctx.ellipse(mx + rx * 0.15 + Math.sin(tijd + i * 2) * 4, my - ry * 0.5 + i * 9, w, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const vis of vissen) {
        // Vis-positie omrekenen naar het scherm; y blijft binnen de ellips.
        const vx = mx - rx + vis.x * rx * 2;
        const vy = my - ry * 0.6 + vis.y * ry * 1.2;
        tekenVis(vx, vy, vis.snelheid > 0 ? 1 : -1, vis.kleur);
      }

      // Rimpels op het oppervlak, bewegend
      ctx.strokeStyle = 'rgba(200,230,255,0.25)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const y = my - ry + ((tijd * 12 + i * ry * 0.4) % (ry * 2));
        const halveBreedte = Math.sqrt(Math.max(0, 1 - ((y - my) / ry) ** 2)) * rx;
        ctx.beginPath();
        ctx.moveTo(mx - halveBreedte + 6, y);
        for (let x = mx - halveBreedte + 6; x <= mx + halveBreedte - 6; x += 12) {
          ctx.lineTo(x, y + Math.sin(x * 0.15 + tijd * 3) * 1.5);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Riet aan de oever
      ctx.strokeStyle = '#2f4a1e';
      ctx.lineWidth = 3;
      for (let i = 0; i < 7; i++) {
        const x = mx - rx * 0.9 + i * 9;
        const buig = Math.sin(tijd * 1.8 + i) * 4;
        ctx.beginPath();
        ctx.moveTo(x, my);
        ctx.quadraticCurveTo(x + buig, my - 25, x + buig * 2, my - 45 - (i % 3) * 8);
        ctx.stroke();
        ctx.fillStyle = '#6b4a2a';
        ctx.beginPath();
        ctx.ellipse(x + buig * 2, my - 48 - (i % 3) * 8, 2.5, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenVis(x, y, richting, kleur) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting, 1);

      // Staart zwaait heen en weer tijdens het zwemmen
      const zwaai = Math.sin(tijd * 10 + x) * 4;

      // Lijf met glans
      const lijf = ctx.createLinearGradient(0, -7, 0, 7);
      lijf.addColorStop(0, kleur);
      lijf.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = lijf;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      // Staart
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.lineTo(-22, -8 + zwaai);
      ctx.lineTo(-22, 8 + zwaai);
      ctx.closePath();
      ctx.fill();
      // Rugvin en buikvin
      ctx.beginPath();
      ctx.moveTo(-4, -6);
      ctx.lineTo(2, -12);
      ctx.lineTo(6, -6);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(2, 6);
      ctx.lineTo(-2, 11);
      ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fill();
      // Oog
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(7, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7.5, -2, 1.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---------- Grot ----------

    function tekenGrot() {
      const b = canvas.width, h = canvas.height;
      const x = b * 0.15, y = h * 0.8;

      // Rots met wat diepte: lichter bovenaan waar de maan op schijnt
      const rots = ctx.createRadialGradient(x - 30, y - 90, 10, x, y, 120);
      rots.addColorStop(0, '#7a6d5e');
      rots.addColorStop(1, '#3d342c');
      ctx.fillStyle = rots;
      ctx.beginPath();
      ctx.moveTo(x - 120, y);
      ctx.bezierCurveTo(x - 130, y - 70, x - 70, y - 130, x - 10, y - 120);
      ctx.bezierCurveTo(x + 50, y - 125, x + 125, y - 70, x + 115, y);
      ctx.closePath();
      ctx.fill();

      // Barsten in de rots
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 70, y - 60); ctx.lineTo(x - 55, y - 80); ctx.lineTo(x - 60, y - 95);
      ctx.moveTo(x + 60, y - 30); ctx.lineTo(x + 75, y - 55); ctx.lineTo(x + 70, y - 70);
      ctx.stroke();

      // Mos op de rots
      ctx.fillStyle = 'rgba(70,110,50,0.6)';
      ctx.beginPath();
      ctx.ellipse(x - 50, y - 100, 22, 7, -0.4, 0, Math.PI * 2);
      ctx.ellipse(x + 30, y - 112, 18, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Donkere ingang, met een zwak vuurschijnsel vanuit de diepte
      const ingang = ctx.createRadialGradient(x, y - 10, 5, x, y, 60);
      ingang.addColorStop(0, '#3a1d08');
      ingang.addColorStop(0.5, '#120906');
      ingang.addColorStop(1, '#050302');
      ctx.fillStyle = ingang;
      ctx.beginPath();
      ctx.moveTo(x - 55, y);
      ctx.bezierCurveTo(x - 60, y - 60, x - 20, y - 80, x, y - 78);
      ctx.bezierCurveTo(x + 20, y - 80, x + 60, y - 60, x + 55, y);
      ctx.closePath();
      ctx.fill();
    }

    // ---------- Poppetje ----------

    function tekenPoppetje(x, y, richting) {
      // Schaduw op de grond
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, 26, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Spiegel de tekening als het poppetje naar links kijkt.
      ctx.save();
      ctx.translate(x, 0);
      ctx.scale(richting, 1);
      x = 0;

      // Beenbeweging: tijdens het lopen zwaaien de benen tegengesteld.
      const zwaai = speler.loopt ? Math.sin(speler.stap) * 12 : 0;
      const huid = '#d9a066', huidDonker = '#b9804a';

      // Benen met knieën
      ctx.strokeStyle = huid;
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 10 + zwaai, y);
      ctx.lineTo(x - 8 + zwaai * 0.5, y - 22);
      ctx.lineTo(x - 6, y - 42);
      ctx.moveTo(x + 10 - zwaai, y);
      ctx.lineTo(x + 8 - zwaai * 0.5, y - 22);
      ctx.lineTo(x + 6, y - 42);
      ctx.stroke();

      // Voeten
      ctx.fillStyle = huidDonker;
      ctx.beginPath();
      ctx.ellipse(x - 8 + zwaai, y, 9, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 12 - zwaai, y, 9, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dierenvel (lijf) met rafelige onderrand en vacht-schaduw
      const vel = ctx.createLinearGradient(x - 20, 0, x + 20, 0);
      vel.addColorStop(0, '#8b4a22');
      vel.addColorStop(0.5, '#b8683a');
      vel.addColorStop(1, '#7a3d1c');
      ctx.fillStyle = vel;
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 96);
      ctx.lineTo(x + 16, y - 96);
      ctx.lineTo(x + 22, y - 44);
      for (let i = 22; i >= -22; i -= 6) {
        ctx.lineTo(x + i - 3, y - 36 - (i % 12 === 0 ? 0 : 6));
      }
      ctx.lineTo(x - 22, y - 44);
      ctx.closePath();
      ctx.fill();
      // Vlekken op het vel
      ctx.fillStyle = '#4a2410';
      ctx.beginPath();
      ctx.arc(x - 6, y - 60, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 78, 4, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 50, 3, 0, Math.PI * 2);
      ctx.fill();
      // Eén blote schouder: het vel hangt over de linkerschouder
      ctx.fillStyle = huid;
      ctx.beginPath();
      ctx.arc(x + 12, y - 92, 9, 0, Math.PI * 2);
      ctx.fill();

      // Armen (de achterste arm zwaait mee met het lopen)
      ctx.strokeStyle = huid;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(x - 14, y - 90);
      ctx.lineTo(x - 26 - zwaai * 0.5, y - 68);
      ctx.lineTo(x - 30 - zwaai, y - 50);
      ctx.moveTo(x + 14, y - 90);
      ctx.lineTo(x + 30, y - 84);
      ctx.lineTo(x + 34, y - 105);
      ctx.stroke();

      // Knots: knoestig stuk hout met een dikke kop. Bij een slag draait hij om de hand.
      const slag = speler.slaat > 0 ? Math.sin((0.35 - speler.slaat) / 0.35 * Math.PI) : 0;
      ctx.save();
      ctx.translate(x + 34, y - 100);
      ctx.rotate(slag * 1.8);
      ctx.translate(-(x + 34), -(y - 100));
      ctx.strokeStyle = '#5a3a1c';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(x + 34, y - 100);
      ctx.lineTo(x + 50, y - 150);
      ctx.stroke();
      const knots = ctx.createRadialGradient(x + 48, y - 160, 2, x + 52, y - 156, 14);
      knots.addColorStop(0, '#8a5a30');
      knots.addColorStop(1, '#4a2e14');
      ctx.fillStyle = knots;
      ctx.beginPath();
      ctx.ellipse(x + 52, y - 156, 13, 16, 0.4, 0, Math.PI * 2);
      ctx.fill();
      // Knoesten
      ctx.fillStyle = '#2e1a0a';
      ctx.beginPath();
      ctx.arc(x + 58, y - 162, 2.5, 0, Math.PI * 2);
      ctx.arc(x + 46, y - 150, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Hals
      ctx.fillStyle = huidDonker;
      ctx.fillRect(x - 5, y - 100, 10, 8);

      // Hoofd met een beetje schaduw aan de onderkant
      const hoofd = ctx.createRadialGradient(x - 6, y - 122, 4, x, y - 115, 24);
      hoofd.addColorStop(0, '#e8b57a');
      hoofd.addColorStop(1, huidDonker);
      ctx.fillStyle = hoofd;
      ctx.beginPath();
      ctx.arc(x, y - 115, 22, 0, Math.PI * 2);
      ctx.fill();

      // Baard
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.moveTo(x - 18, y - 112);
      ctx.quadraticCurveTo(x, y - 80, x + 18, y - 112);
      ctx.quadraticCurveTo(x, y - 95, x - 18, y - 112);
      ctx.fill();

      // Wild haar
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.arc(x, y - 122, 24, Math.PI, 0);
      ctx.fill();
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 10 - 6, y - 124);
        ctx.lineTo(x + i * 10 + (i * 2), y - 152 - Math.abs(i) * -4);
        ctx.lineTo(x + i * 10 + 6, y - 124);
        ctx.fill();
      }

      // Wenkbrauwen
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - 13, y - 122); ctx.lineTo(x - 4, y - 120);
      ctx.moveTo(x + 4, y - 120); ctx.lineTo(x + 13, y - 122);
      ctx.stroke();

      // Ogen
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x - 8, y - 115, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 115, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x - 7, y - 115, 2, 0, Math.PI * 2);
      ctx.arc(x + 9, y - 115, 2, 0, Math.PI * 2);
      ctx.fill();

      // Neus
      ctx.fillStyle = huidDonker;
      ctx.beginPath();
      ctx.arc(x + 1, y - 108, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---------- Alles tekenen ----------

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenLucht();
      tekenHeuvels();
      tekenGrond();
      tekenMeer();
      tekenGrot();
      // Het poppetje staat altijd op de grond.
      speler.y = canvas.height * 0.85;
      tekenDieren();
      tekenPoppetje(speler.x, speler.y, speler.richting);
      tekenMeldingen();
      tekenMissies();
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
