      // Water: donker aan de randen, iets lichter in het midden
      const water = ctx.createRadialGradient(mx, my, 0, mx, my, rx);
      water.addColorStop(0, '#2b6f9e');
      water.addColorStop(1, '#123a5c');
      ctx.fillStyle = water;
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      // Alles hierna blijft binnen het water (ook de vissen).
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(mx, my, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();

      // Weerspiegeling van de maan (of overdag de zon), licht bewegend door de golfjes
      ctx.fillStyle = `rgba(255,245,200,${0.18 + 0.15 * daglicht()})`;
      for (let i = 0; i < 5; i++) {
        const w = 30 + Math.sin(tijd * 1.3 + i) * 12;
        ctx.beginPath();
        ctx.ellipse(mx + rx * 0.15 + Math.sin(tijd + i * 2) * 4, my - ry * 0.5 + i * 9, w, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const vis of vissen) {
        // Vis-positie omrekenen naar het scherm; y blijft binnen de ellips.
        const vx = mx - rx + vis.x * rx * 2;
        const vy = my - ry * 0.6 + vis.y * ry * 1.2;
        tekenVis(vx, vy, vis.snelheid > 0 ? 1 : -1, vis.kleur, vis.grootte);
      }

      // Rimpels op het oppervlak, bewegend
      ctx.strokeStyle = 'rgba(200,230,255,0.25)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const y = my - ry + ((tijd * 12 + i * ry * 0.4) % (ry * 2));
        const halveBreedte = Math.sqrt(Math.max(0, 1 - ((y - my) / ry) ** 2)) * rx;
        ctx.beginPath();
        ctx.moveTo(mx - halveBreedte + 6, y);
        for (let x = mx - halveBreedte + 6; x <= mx + halveBreedte - 6; x += 12) {
          ctx.lineTo(x, y + Math.sin(x * 0.15 + tijd * 3) * 1.5);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Riet aan de oever
      ctx.strokeStyle = '#2f4a1e';
      ctx.lineWidth = 3;
      for (let i = 0; i < 7; i++) {
        const x = mx - rx * 0.9 + i * 9;
        const buig = Math.sin(tijd * 1.8 + i) * 4;
        ctx.beginPath();
        ctx.moveTo(x, my);
        ctx.quadraticCurveTo(x + buig, my - 25, x + buig * 2, my - 45 - (i % 3) * 8);
        ctx.stroke();
        ctx.fillStyle = '#6b4a2a';
        ctx.beginPath();
        ctx.ellipse(x + buig * 2, my - 48 - (i % 3) * 8, 2.5, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function tekenVis(x, y, richting, kleur, grootte = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting * grootte, grootte);

      // Staart zwaait heen en weer tijdens het zwemmen
      const zwaai = Math.sin(tijd * 10 + x) * 4;

      // Lijf met glans
      const lijf = ctx.createLinearGradient(0, -7, 0, 7);
      lijf.addColorStop(0, kleur);
      lijf.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = lijf;
      ctx.beginPath();
      ctx.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      // Staart
      ctx.fillStyle = kleur;
      ctx.beginPath();
      ctx.moveTo(-12, 0);
      ctx.lineTo(-22, -8 + zwaai);
      ctx.lineTo(-22, 8 + zwaai);
      ctx.closePath();
      ctx.fill();
      // Rugvin en buikvin
      ctx.beginPath();
      ctx.moveTo(-4, -6);
      ctx.lineTo(2, -12);
      ctx.lineTo(6, -6);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(2, 6);
      ctx.lineTo(-2, 11);
      ctx.lineTo(-6, 6);
      ctx.closePath();
      ctx.fill();
      // Oog
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(7, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(7.5, -2, 1.3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // ---------- Grot ----------

    const grot = { x: 400 }; // de grot staat achterin, tegen de horizon

    function tekenGrot() {
      const x = schermX(grot.x), y = grondTop();
      if (x < -150 || x > canvas.width + 150) return;

      // Rots met wat diepte: lichter bovenaan waar de maan op schijnt
      const rots = ctx.createRadialGradient(x - 30, y - 90, 10, x, y, 120);
      rots.addColorStop(0, '#7a6d5e');
      rots.addColorStop(1, '#3d342c');
      ctx.fillStyle = rots;
      ctx.beginPath();
      ctx.moveTo(x - 120, y);
      ctx.bezierCurveTo(x - 130, y - 70, x - 70, y - 130, x - 10, y - 120);
      ctx.bezierCurveTo(x + 50, y - 125, x + 125, y - 70, x + 115, y);
      ctx.closePath();
      ctx.fill();

      // Barsten in de rots
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 70, y - 60); ctx.lineTo(x - 55, y - 80); ctx.lineTo(x - 60, y - 95);
      ctx.moveTo(x + 60, y - 30); ctx.lineTo(x + 75, y - 55); ctx.lineTo(x + 70, y - 70);
      ctx.stroke();

      // Mos op de rots
      ctx.fillStyle = 'rgba(70,110,50,0.6)';
      ctx.beginPath();
      ctx.ellipse(x - 50, y - 100, 22, 7, -0.4, 0, Math.PI * 2);
      ctx.ellipse(x + 30, y - 112, 18, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Donkere ingang, met een zwak vuurschijnsel vanuit de diepte
      const ingang = ctx.createRadialGradient(x, y - 10, 5, x, y, 60);
      ingang.addColorStop(0, '#3a1d08');
      ingang.addColorStop(0.5, '#120906');
      ingang.addColorStop(1, '#050302');
      ctx.fillStyle = ingang;
      ctx.beginPath();
      ctx.moveTo(x - 55, y);
      ctx.bezierCurveTo(x - 60, y - 60, x - 20, y - 80, x, y - 78);
      ctx.bezierCurveTo(x + 20, y - 80, x + 60, y - 60, x + 55, y);
      ctx.closePath();
      ctx.fill();
    }

    // ---------- Poppetje ----------

    function tekenPoppetje(x, y, richting) {
      // Net geraakt? Dan knippert het poppetje even.
      if (onkwetsbaar > 0 && Math.floor(tijd * 10) % 2 === 0) ctx.globalAlpha = 0.4;
      // Schaduw op de grond
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, 26, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Spiegel de tekening als het poppetje naar links kijkt.
      ctx.save();
      ctx.translate(x, 0);
      ctx.scale(richting, 1);
      x = 0;

      // Beenbeweging: tijdens het lopen zwaaien de benen tegengesteld.
      const zwaai = speler.loopt ? Math.sin(speler.stap) * 12 : 0;
      const huid = '#d9a066', huidDonker = '#b9804a';

      // Benen met knieën
      ctx.strokeStyle = huid;
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 10 + zwaai, y);
      ctx.lineTo(x - 8 + zwaai * 0.5, y - 22);
      ctx.lineTo(x - 6, y - 42);
      ctx.moveTo(x + 10 - zwaai, y);
      ctx.lineTo(x + 8 - zwaai * 0.5, y - 22);
      ctx.lineTo(x + 6, y - 42);
      ctx.stroke();

      // Voeten (of wollige mammoetlaarzen)
      const k = kleding();
      if (k.hoofd === 'laarzen') {
        ctx.fillStyle = '#e8dcc8';
        ctx.beginPath();
        ctx.ellipse(x - 8 + zwaai, y - 4, 11, 9, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 12 - zwaai, y - 4, 11, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#c9b89a';
        ctx.fillRect(x - 16 + zwaai, y - 20, 16, 10);
        ctx.fillRect(x + 4 - zwaai, y - 20, 16, 10);
      } else {
        ctx.fillStyle = huidDonker;
        ctx.beginPath();
        ctx.ellipse(x - 8 + zwaai, y, 9, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(x + 12 - zwaai, y, 9, 4, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Dierenvel (lijf) met rafelige onderrand en vacht-schaduw
      const vel = ctx.createLinearGradient(x - 20, 0, x + 20, 0);
      vel.addColorStop(0, k.velKleur[0]);
      vel.addColorStop(0.5, k.velKleur[1]);
      vel.addColorStop(1, k.velKleur[2]);
      ctx.fillStyle = vel;
      ctx.beginPath();
      ctx.moveTo(x - 16, y - 96);
      ctx.lineTo(x + 16, y - 96);
      ctx.lineTo(x + 22, y - 44);
      for (let i = 22; i >= -22; i -= 6) {
        ctx.lineTo(x + i - 3, y - 36 - (i % 12 === 0 ? 0 : 6));
      }
      ctx.lineTo(x - 22, y - 44);
      ctx.closePath();
      ctx.fill();
      // Vlekken op het vel
      ctx.fillStyle = k.vlekKleur;
      ctx.beginPath();
      ctx.arc(x - 6, y - 60, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 78, 4, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 50, 3, 0, Math.PI * 2);
      ctx.fill();
      // Eén blote schouder: het vel hangt over de linkerschouder
      ctx.fillStyle = huid;
      ctx.beginPath();
      ctx.arc(x + 12, y - 92, 9, 0, Math.PI * 2);
      ctx.fill();

      // Armen (de achterste arm zwaait mee met het lopen)
      ctx.strokeStyle = huid;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(x - 14, y - 90);
      ctx.lineTo(x - 26 - zwaai * 0.5, y - 68);
      ctx.lineTo(x - 30 - zwaai, y - 50);
      ctx.moveTo(x + 14, y - 90);
      ctx.lineTo(x + 30, y - 84);
      ctx.lineTo(x + 34, y - 105);
      ctx.stroke();

      // Het wapen in de hand. Bij een slag draait het om de hand naar voren.
      // Een gegooide speer is even weg; een schietwapen schokt alleen kort terug.
      const wapen = wapens[huidigWapen];
      const speerWeg = wapen.schiet === 'speer' && speerOnderweg > 0;
      if (vist > 0) {
        // Hengel uitgegooid: de stok wijst naar voren, met de lijn in het water
        ctx.save();
        ctx.translate(x + 34, y - 100);
        ctx.rotate(1.1);
        tekenHengel(0, 0, 1.2);
        ctx.restore();
        // Dobber die op en neer gaat
        const dobberX = x + 34 + 150, dobberY = y - 100 + 40 + Math.sin(tijd * 6) * 3;
        ctx.strokeStyle = '#e8e0c8';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x + 34 + 150 * Math.cos(-0.05), y - 100 - 150 * Math.sin(0.35)); ctx.lineTo(dobberX, dobberY); ctx.stroke();
        ctx.fillStyle = '#e63946';
        ctx.beginPath(); ctx.arc(dobberX, dobberY, 5, 0, Math.PI * 2); ctx.fill();
      } else if (!speerWeg) {
        const slag = speler.slaat > 0 ? Math.sin((0.35 - speler.slaat) / 0.35 * Math.PI) : 0;
        ctx.save();
        ctx.translate(x + 34, y - 100);
        ctx.rotate(wapen.schiet ? -slag * 0.4 : slag * 1.8);
        tekenWapenVorm(huidigWapen, 0, 0);
        ctx.restore();
      }

      // Hals
      ctx.fillStyle = huidDonker;
      ctx.fillRect(x - 5, y - 100, 10, 8);

      // Hoofd met een beetje schaduw aan de onderkant
      const hoofd = ctx.createRadialGradient(x - 6, y - 122, 4, x, y - 115, 24);
      hoofd.addColorStop(0, '#e8b57a');
      hoofd.addColorStop(1, huidDonker);
      ctx.fillStyle = hoofd;
      ctx.beginPath();
      ctx.arc(x, y - 115, 22, 0, Math.PI * 2);
      ctx.fill();

      // Baard
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.moveTo(x - 18, y - 112);
      ctx.quadraticCurveTo(x, y - 80, x + 18, y - 112);
      ctx.quadraticCurveTo(x, y - 95, x - 18, y - 112);
      ctx.fill();

      // Wild haar
      ctx.fillStyle = '#3b2314';
      ctx.beginPath();
      ctx.arc(x, y - 122, 24, Math.PI, 0);
      ctx.fill();
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(x + i * 10 - 6, y - 124);
        ctx.lineTo(x + i * 10 + (i * 2), y - 152 - Math.abs(i) * -4);
        ctx.lineTo(x + i * 10 + 6, y - 124);
        ctx.fill();
      }

      // Wenkbrauwen
      ctx.strokeStyle = '#3b2314';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - 13, y - 122); ctx.lineTo(x - 4, y - 120);
      ctx.moveTo(x + 4, y - 120); ctx.lineTo(x + 13, y - 122);
      ctx.stroke();

      // Ogen
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(x - 8, y - 115, 5, 0, Math.PI * 2);
      ctx.arc(x + 8, y - 115, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(x - 7, y - 115, 2, 0, Math.PI * 2);
      ctx.arc(x + 9, y - 115, 2, 0, Math.PI * 2);
      ctx.fill();

      // Neus
      ctx.fillStyle = huidDonker;
      ctx.beginPath();
      ctx.arc(x + 1, y - 108, 4, 0, Math.PI * 2);
      ctx.fill();

      // Hoofddeksel, afhankelijk van de kleding
      if (k.hoofd === 'veren') {
        const kleuren = ['#d9534f', '#ffd166', '#4ecdc4', '#ffd166', '#d9534f'];
        kleuren.forEach((kl, i) => {
          ctx.fillStyle = kl;
          ctx.beginPath();
          ctx.ellipse(x - 20 + i * 10, y - 158 - (i === 2 ? 8 : 0), 4, 16, (i - 2) * 0.25, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillStyle = '#c9a066';
        ctx.fillRect(x - 24, y - 142, 48, 6);
      }
      if (k.hoofd === 'masker') {
        // Houten masker met horens over het gezicht
        ctx.fillStyle = '#c9a066';
        ctx.beginPath(); ctx.ellipse(x, y - 113, 22, 26, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#6b4423';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x - 10, y - 130); ctx.lineTo(x + 10, y - 130); ctx.moveTo(x, y - 125); ctx.lineTo(x, y - 100); ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 8, y - 116, 4, 0, Math.PI * 2); ctx.arc(x + 8, y - 116, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(x - 8, y - 116, 1.5, 0, Math.PI * 2); ctx.arc(x + 8, y - 116, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e8e0c8';
        ctx.beginPath(); ctx.moveTo(x - 18, y - 132); ctx.quadraticCurveTo(x - 36, y - 150, x - 26, y - 168); ctx.lineTo(x - 12, y - 136); ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + 18, y - 132); ctx.quadraticCurveTo(x + 36, y - 150, x + 26, y - 168); ctx.lineTo(x + 12, y - 136); ctx.fill();
      }

      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // ---------- Alles tekenen ----------

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenLucht();
      tekenHeuvels();
      tekenGrond();
      tekenGrot();
      tekenMeer();

      // Alles wat op de grond staat, tekenen we van achter naar voren (op diepte gesorteerd),
      // zodat wat dichterbij is vóór de rest komt.
      const dingen = [];
      for (const boom of bomen) dingen.push({ d: boom.d, teken: () => tekenOpWereld(boom.x, boom.d, () => tekenBoom(boom)) });
      dingen.push({ d: handelaar.d, teken: () => tekenOpWereld(handelaar.x, handelaar.d, tekenHandelaar) });
      for (const dier of dieren) {
        dingen.push({ d: dier.d, teken: () => tekenOpWereld(dier.x, dier.d, () => dier.soort.teken(dier)) });
      }
      dingen.push({ d: speler.d, teken: () => tekenOpWereld(speler.x, speler.d, () => tekenPoppetje(0, 0, speler.richting)) });
      for (const pr of projectielen) dingen.push({ d: pr.d + 0.001, teken: () => tekenOpWereld(pr.x, pr.d, () => tekenProjectiel(pr)) });
      for (const n of roofdieren) dingen.push({ d: n.d, teken: () => tekenOpWereld(n.x, n.d, () => n.soort.teken(n)) });
      dingen.sort((a, b) => a.d - b.d);
      for (const ding of dingen) ding.teken();

      tekenDagNachtLicht();
      tekenHandelaarHint();
      tekenMeldingen();
      tekenMissies();
      tekenDagTeller();
      tekenLevens();
      tekenWinkel();
      tekenGameOver();
    }

    // Het landschap donkerder maken in de nacht en warmer in de dag.
    function tekenDagNachtLicht() {
      const b = canvas.width, h = canvas.height;
      const d = daglicht(), sch = schemering();
      // Overdag een warme, lichte waas
      if (d > 0) {
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = `rgba(255,225,170,${0.28 * d})`;
        ctx.fillRect(0, 0, b, h);
        ctx.globalCompositeOperation = 'source-over';
      }
      // Bij schemering een oranje gloed
      if (sch > 0.05) {
        ctx.fillStyle = `rgba(255,120,40,${0.12 * sch})`;
        ctx.fillRect(0, 0, b, h);
      }
      // 's Nachts alles blauwig donker
      if (d < 1) {
        ctx.fillStyle = `rgba(5,10,40,${0.35 * (1 - d)})`;
        ctx.fillRect(0, 0, b, h);
      }
    }

    // Rechtsboven: welke nacht (of dag) het is, met een klein zon- of maanicoon.
    function tekenDagTeller() {
      const b = canvas.width;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(b - 236, 16, 220, 44);
      ctx.textAlign = 'right';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ffd166';
      const tekst = isNacht() ? `Nacht ${nacht} van 99` : `Dag ${nacht}`;
      ctx.fillText(tekst, b - 30, 46);
      // Icoontje
      const ix = b - 210, iy = 38;
      if (isNacht()) {
        ctx.fillStyle = '#f4f1c1';
        ctx.beginPath(); ctx.arc(ix, iy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath(); ctx.arc(ix + 5, iy - 3, 8, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#ffcc33';
        ctx.beginPath(); ctx.arc(ix, iy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffcc33';
        ctx.lineWidth = 2;
        for (let i = 0; i < 8; i++) {
          const hoek = i * Math.PI / 4;
          ctx.beginPath();
          ctx.moveTo(ix + Math.cos(hoek) * 12, iy + Math.sin(hoek) * 12);
          ctx.lineTo(ix + Math.cos(hoek) * 16, iy + Math.sin(hoek) * 16);
          ctx.stroke();
        }
      }
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
