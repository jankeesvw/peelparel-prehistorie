<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>99-nachten-in-de-prehistorie</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1030; color: #eee; font-family: sans-serif; }
    canvas { display: block; background: #0b1030; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // Hoeveel seconden het spel al loopt. Handig voor animaties die vanzelf bewegen.
    let tijd = 0;

    // ---------- Wereld, camera en diepte ----------

    // De wereld is breder dan het scherm. De camera volgt de speler en schuift mee.
    const wereldBreedte = 4000;
    const camera = { x: 0 };

    // De grond loopt van de horizon (bovenaan, d = 0) tot de onderkant van het scherm (d = 1).
    // d is de diepte: hoe kleiner, hoe verder weg. Dingen verder weg tekenen we kleiner.
    function grondTop() { return canvas.height * 0.8; }
    function diepteNaarY(d) { return canvas.height * (0.8 + 0.2 * d); }
    function schaalOpDiepte(d) { return 0.55 + 0.45 * d; }
    function schermX(wereldX) { return wereldX - camera.x; }

    function updateCamera() {
      camera.x = Math.max(0, Math.min(wereldBreedte - canvas.width, speler.x - canvas.width / 2));
    }

    // Iets tekenen op een plek in de wereld: verschoven met de camera en geschaald op diepte.
    // De tekenfunctie tekent zichzelf rond (0, 0), met de voeten op y = 0.
    function tekenOpWereld(x, d, teken) {
      ctx.save();
      ctx.translate(schermX(x), diepteNaarY(d));
      const schaal = schaalOpDiepte(d);
      ctx.scale(schaal, schaal);
      teken();
      ctx.restore();
    }

    // ---------- Dag en nacht ----------

    // dagTijd loopt van 0 tot 1: 0 is middernacht, 0.25 zonsopkomst, 0.5 middag, 0.75 zonsondergang.
    const dagDuur = 60; // seconden voor een hele dag plus nacht
    let dagTijd = 0.05;
    let nacht = 1; // we beginnen in de eerste nacht

    function updateDagNacht(dt) {
      const vorigeDagTijd = dagTijd;
      dagTijd = (dagTijd + dt / dagDuur) % 1;
      // Zodra de zon onder is, begint een nieuwe nacht.
      if (vorigeDagTijd < 0.75 && dagTijd >= 0.75) nacht++;
    }

    // Hoeveel daglicht er is, van 0 (diepe nacht) tot 1 (volle dag).
    function daglicht() {
      const ruw = 0.5 - 0.5 * Math.cos(dagTijd * Math.PI * 2);
      // Scherper maken zodat de overgang rond zonsopkomst en -ondergang zit
      const t = Math.max(0, Math.min(1, (ruw - 0.2) / 0.45));
      return t * t * (3 - 2 * t);
    }

    // Hoe sterk de schemering (oranje gloed) nu is, van 0 tot 1.
    function schemering() {
      const d = daglicht();
      return Math.exp(-(((d - 0.4) / 0.22) ** 2));
    }

    function isNacht() {
      return dagTijd >= 0.75 || dagTijd < 0.25;
    }

    // Twee kleuren mengen. t = 0 geeft kleur a, t = 1 geeft kleur b.
    function mengKleur(a, b, t) {
      const pa = hexNaarRgb(a), pb = hexNaarRgb(b);
      const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
      const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
      const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
      return `rgb(${r},${g},${bl})`;
    }
    function hexNaarRgb(hex) {
      return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    }

    // Het poppetje: een holbewoner. x en y zijn de plek van zijn voeten.
    // richting is 1 (naar rechts kijken) of -1 (naar links kijken).
    // stap loopt op tijdens het lopen en zorgt voor de beenbeweging.
    // slaat telt af tijdens een slag met de knots.
    // d is de diepte op de grond (0 = bij de horizon, 1 = helemaal vooraan).
    const speler = { x: 700, d: 0.6, richting: 1, stap: 0, loopt: false, slaat: 0 };
    function spelerY() { return diepteNaarY(speler.d); }

    // Welke toetsen zijn nu ingedrukt?
    const toetsen = {};
    window.addEventListener('keydown', (e) => {
      // Als de winkel open is, gaan alle toetsen naar het winkelmenu.
      if (winkelOpen) {
        winkelToets(e.key);
        e.preventDefault();
        return;
      }
      if (gameOver) {
        if (e.key === 'Enter') location.reload();
        return;
      }
      toetsen[e.key] = true;
      // Spatie is de actietoets: slaan met je wapen, of vissen bij het meer.
      if (e.key === ' ' && !e.repeat) actie();
      // E opent de winkel als je bij de handelaar staat.
      if ((e.key === 'e' || e.key === 'E') && bijHandelaar()) openWinkel();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    const loopSnelheid = 250; // pixels per seconde, naar links en rechts
    const diepteSnelheid = 1.1; // hoeveel diepte per seconde, naar voren en achteren

    // ---------- Levens ----------

    const maxLevens = 3;
    let levens = maxLevens;
    let gameOver = false;
    let onkwetsbaar = 0; // seconden waarin je net geraakt bent en niet opnieuw geraakt kunt worden

    function raakSpeler(vanX) {
      if (onkwetsbaar > 0 || gameOver) return;
      levens--;
      onkwetsbaar = 2;
      // Een duw weg van de aanvaller
      speler.duw = Math.sign(speler.x - vanX) || 1;
      toonMelding('Au!', speler.x, spelerY() - 190, '#d96c6c');
      if (levens <= 0) gameOver = true;
    }

    function tekenLevens() {
      const b = canvas.width;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(b - 236, 68, 220, 44);
      for (let i = 0; i < maxLevens; i++) tekenHart(b - 200 + i * 40, 90, 14, i < levens);
    }

    function tekenHart(x, y, r, vol) {
      ctx.fillStyle = vol ? '#e63946' : 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.moveTo(x, y + r);
      ctx.bezierCurveTo(x - r * 1.4, y - r * 0.2, x - r * 0.7, y - r * 1.1, x, y - r * 0.4);
      ctx.bezierCurveTo(x + r * 0.7, y - r * 1.1, x + r * 1.4, y - r * 0.2, x, y + r);
      ctx.fill();
    }

    function tekenGameOver() {
      if (!gameOver) return;
      const b = canvas.width, h = canvas.height;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, b, h);
      ctx.textAlign = 'center';
      ctx.font = 'bold 56px sans-serif';
      ctx.fillStyle = '#e63946';
      ctx.fillText(`Je bent gedood door ${doodDoor}`, b / 2, h * 0.4);
      ctx.font = '26px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText(`Je overleefde tot nacht ${nacht}, ronde ${ronde}, met ${munten} munten.`, b / 2, h * 0.4 + 50);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Druk op Enter om opnieuw te beginnen', b / 2, h * 0.4 + 110);
      ctx.textAlign = 'left';
    }

    function update(dt) {
      tijd += dt;
      // Bij game over en zolang de winkel open is, staat het spel stil.
      if (gameOver || winkelOpen) return;
      updateDagNacht(dt);
      if (onkwetsbaar > 0) onkwetsbaar -= dt;
      updateRoofdieren(dt);
      if (winkelOpen) for (const t of ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']) toetsen[t] = false;
      let dx = 0, dd = 0;
      const tempo = kleding().snelheid; // sommige kleren maken je sneller
      if (toetsen['ArrowLeft']) { dx -= loopSnelheid * tempo * dt; speler.richting = -1; }
      if (toetsen['ArrowRight']) { dx += loopSnelheid * tempo * dt; speler.richting = 1; }
      if (toetsen['ArrowUp']) dd -= diepteSnelheid * tempo * dt;   // naar achteren, richting de horizon
      if (toetsen['ArrowDown']) dd += diepteSnelheid * tempo * dt; // naar voren
      speler.loopt = dx !== 0 || dd !== 0;
      if (speler.loopt) { speler.stap += dt * 10; vist = 0; }

      // Net geraakt? Dan word je even weggeduwd.
      if (onkwetsbaar > 1.6 && speler.duw) dx += speler.duw * 500 * dt;

      // Niet verder dan de horizon, niet van de wereld af, en niet in het water.
      const nieuwX = Math.max(30, Math.min(wereldBreedte - 30, speler.x + dx));
      const nieuwD = Math.max(0.08, Math.min(0.97, speler.d + dd));
      if (!inMeer(nieuwX, nieuwD, 10)) {
        speler.x = nieuwX; speler.d = nieuwD;
      } else if (!inMeer(nieuwX, speler.d, 10)) {
        speler.x = nieuwX; // langs de oever schuiven
      } else if (!inMeer(speler.x, nieuwD, 10)) {
        speler.d = nieuwD;
      }
      if (speler.slaat > 0) speler.slaat -= dt;
      updateCamera();

      updateVissen(dt);
      updateVisserij(dt);
      updateDieren(dt);
      updateProjectielen(dt);
      raapStenenOp();
      updateMeldingen(dt);
      updateRonde(dt);
      updateBomen(dt);
    }

    // ---------- Missies ----------

    // Elke missie heeft een doel en een voortgang. Als voortgang het doel haalt, is de missie klaar.
    const missies = [
      { naam: 'Jaag op 3 dieren', soort: 'jagen', doel: 3, voortgang: 0 },
      { naam: 'Vang 2 vissen uit het meer', soort: 'vissen', doel: 2, voortgang: 0 },
      { naam: 'Verzamel 5 stenen', soort: 'stenen', doel: 5, voortgang: 0 },
      { naam: 'Hak 3 bomen om', soort: 'hout', doel: 3, voortgang: 0 },
    ];

    // Munten verdien je met missies: 2 per stap en 10 extra als een missie klaar is.
    let munten = 0;
    const muntenPerStap = 2;
    const muntenPerMissie = 10;

    function missieVoortgang(soort, x, y) {
      const missie = missies.find(m => m.soort === soort);
      if (!missie || missie.voortgang >= missie.doel) return;
      missie.voortgang++;
      const verdiend = muntenPerStap + kleding().muntenBonus;
      munten += verdiend;
      toonMelding(`+${verdiend} munten`, x, y, '#ffd166');
      if (missie.voortgang === missie.doel) {
        munten += muntenPerMissie;
        toonMelding(`Missie voltooid! +${muntenPerMissie} munten`, x, y - 40, '#ffd166');
      }
      if (alleMissiesKlaar()) nieuweRondeOver = 5;
    }

    function alleMissiesKlaar() {
      return missies.every(m => m.voortgang >= m.doel);
    }

    // Als alle missies klaar zijn, begint na een paar seconden een nieuwe, moeilijkere ronde:
    // de doelen worden groter, de everzwijnen sneller en schuwer.
    let ronde = 1;
    let nieuweRondeOver = 0;
    for (const m of missies) m.basisDoel = m.doel;

    function updateRonde(dt) {
      if (nieuweRondeOver <= 0) return;
      nieuweRondeOver -= dt;
      if (nieuweRondeOver <= 0) {
        ronde++;
        for (const m of missies) {
          m.doel = m.basisDoel + (ronde - 1) * 2;
          m.voortgang = 0;
        }
        // Nieuwe stenen op de grond en de omgehakte bomen groeien meteen terug
        while (stenen.length < aantalStenen) stenen.push(maakSteen());
        for (const boom of bomen) if (boom.hergroei > 0) boom.hergroei = 0.01;
        toonMelding(`Ronde ${ronde}: de missies zijn moeilijker!`, camera.x + canvas.width / 2, canvas.height * 0.3, '#ffd166');
      }
    }


    // Korte tekstjes die omhoog zweven en vervagen, zoals "+1".
    const meldingen = [];
    // x is een plek in de wereld; we slaan meteen de schermpositie op.
    function toonMelding(tekst, x, y, kleur = '#fff') {
      meldingen.push({ tekst, x: schermX(x), y, kleur, tijd: 1.5 });
    }
    function updateMeldingen(dt) {
      for (const m of meldingen) { m.tijd -= dt; m.y -= 40 * dt; }
      for (let i = meldingen.length - 1; i >= 0; i--) if (meldingen[i].tijd <= 0) meldingen.splice(i, 1);
    }
    function tekenMeldingen() {
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px sans-serif';
      for (const m of meldingen) {
        ctx.globalAlpha = Math.min(1, m.tijd);
        ctx.fillStyle = m.kleur;
        ctx.fillText(m.tekst, m.x, m.y);
      }
      ctx.globalAlpha = 1;
    }

    // De actietoets: eerst kijken of er een dier binnen bereik is, anders of we bij het meer staan.
    function actie() {
      const wapen = wapens[huidigWapen];
      speler.slaat = 0.35;

      // Staat er een boom vlak voor ons? Dan hakken we (als het wapen dat kan).
      for (const boom of bomen) {
        const afstand = boom.x - speler.x;
        const diepteVerschil = Math.abs(diepteNaarY(boom.d) - spelerY());
        if (boom.leven > 0 && boom.valt < 0 && Math.abs(afstand) < 90 && Math.sign(afstand) === speler.richting && diepteVerschil < 50) {
          hakBoom(boom);
          return;
        }
      }
      // Aan de oever vissen we, maar alleen met een hengel.
      if (bijMeer()) {
        if (!spullen[0].gekocht) {
          toonMelding('Je hebt een vishengel nodig. Koop hem bij Oeg!', speler.x, spelerY() - 190, '#d96c6c');
        } else if (vist <= 0 && vissen.length > 0) {
          vist = visTijd; // uitgooien, even wachten op beet
          speler.richting = Math.sign(meer.x - speler.x) || speler.richting; // naar het water kijken
        }
        return;
      }
      // Een schietwapen vuurt iets af; de rest slaat direct.
      if (wapen.schiet) schiet(wapen);
      else slaDier(wapen.bereik);
    }

    // Een slag met een knots of bijl: raakt het dichtstbijzijnde dier vóór ons.
    function slaDier(bereik) {
      // Eerst kijken of er een roofdier vóór ons staat
      for (const n of roofdieren) {
        const afstand = n.x - speler.x;
        if (Math.abs(afstand) < bereik + 40 && Math.sign(afstand) === speler.richting && Math.abs(diepteNaarY(n.d) - spelerY()) < 40) {
          return raakRoofdier(speler.x, speler.d, bereik + 40);
        }
      }
      for (let i = dieren.length - 1; i >= 0; i--) {
        const d = dieren[i];
        const afstand = d.x - speler.x;
        const diepteVerschil = Math.abs(diepteNaarY(d.d) - spelerY());
        // Alleen dieren vóór het poppetje, dichtbij genoeg en op ongeveer dezelfde diepte
        if (Math.abs(afstand) < bereik && Math.sign(afstand) === speler.richting && diepteVerschil < 40) {
          return raakDier(d, i);
        }
      }
      return false;
    }

    // ---------- Pijlen, speren en stenen die door de lucht vliegen ----------

    const projectielen = [];
    let speerOnderweg = 0; // seconden tot de gegooide speer weer in je hand is

    function schiet(wapen) {
      if (wapen.schiet === 'speer') {
        if (speerOnderweg > 0) return; // de speer is nog niet terug
        speerOnderweg = 1.2;
      }
      projectielen.push({
        soort: wapen.schiet,
        x: speler.x + speler.richting * 30,
        d: speler.d,
        richting: speler.richting,
        snelheid: wapen.schiet === 'pijl' ? 900 : 650,
        afstand: 0,
        maxAfstand: wapen.bereik,
      });
    }

    function updateProjectielen(dt) {
      if (speerOnderweg > 0) speerOnderweg -= dt;
      for (let i = projectielen.length - 1; i >= 0; i--) {
        const pr = projectielen[i];
        const stap = pr.snelheid * dt;
        pr.x += pr.richting * stap;
        pr.afstand += stap;
        // Raakt het een dier op dezelfde diepte?
        let geraakt = false;
        for (let j = dieren.length - 1; j >= 0; j--) {
          const dier = dieren[j];
          if (Math.abs(dier.x - pr.x) < 40 && Math.abs(diepteNaarY(dier.d) - diepteNaarY(pr.d)) < 30) {
            raakDier(dier, j);
            geraakt = true;
            break;
          }
        }
        if (!geraakt && raakRoofdier(pr.x, pr.d, 60)) geraakt = true;
        if (geraakt || pr.afstand > pr.maxAfstand || inMeer(pr.x, pr.d, 0)) projectielen.splice(i, 1);
      }
    }

    // Tekent een projectiel met zijn hoogte in de lucht: het vliegt in een boogje.
    function tekenProjectiel(pr) {
      const voortgang = pr.afstand / pr.maxAfstand;
      const hoogte = 95 + Math.sin(voortgang * Math.PI) * (pr.soort === 'pijl' ? 20 : 50);
      // Aan het eind van de boog wijst de punt iets omlaag
      const kanteling = (voortgang - 0.5) * 0.8;
      ctx.save();
      ctx.translate(0, -hoogte);
      ctx.scale(pr.richting, 1);
      ctx.rotate(kanteling);
      if (pr.soort === 'pijl') {
        ctx.strokeStyle = '#c9a66b';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(20, 0); ctx.stroke();
        ctx.fillStyle = '#9a9a96';
        ctx.beginPath(); ctx.moveTo(18, -5); ctx.lineTo(32, 0); ctx.lineTo(18, 5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#d9534f';
        ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(-32, -7); ctx.lineTo(-18, 0); ctx.lineTo(-32, 7); ctx.closePath(); ctx.fill();
      } else if (pr.soort === 'speer') {
        // De speervorm staat rechtop; we leggen hem plat met de punt naar voren
        ctx.rotate(Math.PI / 2);
        tekenWapenVorm(2, 0, 50, 0.9);
      } else {
        ctx.fillStyle = '#8a8a86';
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#5a5a56';
        ctx.beginPath(); ctx.arc(-2, -2, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function tekenMissies() {
      ctx.textAlign = 'left';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(16, 16, 360, 40 + missies.length * 30);
      ctx.fillStyle = '#ffd166';
      ctx.fillText(`Missies (ronde ${ronde})`, 30, 44);
      ctx.font = '18px sans-serif';
      let actiefGevonden = false;
      missies.forEach((m, i) => {
        const klaar = m.voortgang >= m.doel;
        const actief = !klaar && !actiefGevonden;
        if (actief) actiefGevonden = true;
        ctx.fillStyle = klaar ? '#8fd18f' : actief ? '#fff' : 'rgba(255,255,255,0.5)';
        const vinkje = klaar ? '\u2713 ' : (actief ? '\u25B6 ' : '\u25CB ');
        ctx.fillText(`${vinkje}${m.naam}  ${m.voortgang}/${m.doel}`, 30, 76 + i * 30);
      });
      // Munten en huidig wapen, onder het missiepaneel
      const py = 16 + 40 + missies.length * 30 + 10;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(16, py, 360, 40);
      tekenMunt(38, py + 20, 11);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(`${munten}`, 56, py + 27);
      tekenHoutblok(118, py + 20);
      ctx.fillStyle = '#d9a066';
      ctx.fillText(`${hout}`, 140, py + 27);
      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'right';
      ctx.fillText(`${wapens[huidigWapen].naam} · ${kleding().naam}`, 366, py + 26);
      ctx.textAlign = 'left';

      // Uitleg van de besturing
      ctx.font = '15px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('Pijltjes = lopen (ook naar voren en achteren), spatie = slaan / vissen, E = handelen', 20, py + 62);

      if (alleMissiesKlaar()) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 48px sans-serif';
        ctx.fillStyle = '#ffd166';
        ctx.fillText('Alle missies voltooid!', canvas.width / 2, canvas.height * 0.35);
        ctx.font = '22px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(`Ronde ${ronde + 1} begint zo...`, canvas.width / 2, canvas.height * 0.35 + 36);
      }
    }

    // Klein houtblok-icoontje voor het paneel
    function tekenHoutblok(x, y) {
      ctx.fillStyle = '#7a4a22';
      ctx.fillRect(x - 12, y - 6, 24, 12);
      ctx.fillStyle = '#c9a066';
      ctx.beginPath(); ctx.ellipse(x + 12, y, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#7a4a22';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x + 12, y, 2, 3, 0, 0, Math.PI * 2); ctx.stroke();
    }

    function tekenMunt(x, y, r) {
      ctx.fillStyle = '#d4a017';
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5cf4a';
      ctx.beginPath(); ctx.arc(x, y, r * 0.75, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b8860b';
      ctx.font = `bold ${Math.round(r * 1.2)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('M', x, y + r * 0.42);
      ctx.textAlign = 'left';
    }

    // ---------- Bomen omhakken ----------

    let hout = 0;
    const houtPerBoom = 3;

    // Bomen op de grond die je kunt omhakken. x is een fractie van de schermbreedte.
    // leven telt af bij elke slag; valt loopt van 0 naar 1 tijdens het omvallen (-1 = staat nog);
    // hergroei telt af tot er een nieuwe boom groeit; groei loopt van 0 naar 1 als een boom opkomt.
    const bomen = [
      { x: 950, d: 0.8, hoogte: 190 },
      { x: 1250, d: 0.2, hoogte: 170 },
      { x: 2050, d: 0.9, hoogte: 200 },
      { x: 2950, d: 0.15, hoogte: 160 },
      { x: 3450, d: 0.6, hoogte: 180 },
      { x: 3800, d: 0.35, hoogte: 190 },
    ];
    for (const boom of bomen) Object.assign(boom, { leven: 4, valt: -1, valRichting: 1, schud: 0, hergroei: 0, groei: 1 });
    const boomLeven = 4;
    const hergroeiTijd = 20; // seconden voordat een omgehakte boom weer aangroeit

    function hakBoom(boom) {
      const kracht = wapens[huidigWapen].hak;
      if (kracht === 0) {
        toonMelding('Met een boog kun je niet hakken!', speler.x, spelerY() - 180, '#d96c6c');
        return;
      }
      boom.leven -= kracht;
      boom.schud = 0.3;
      if (boom.leven <= 0) {
        boom.valt = 0;
        // De boom valt van de speler af
        boom.valRichting = Math.sign(boom.x - speler.x) || 1;
      }
    }

    function updateBomen(dt) {
      for (const boom of bomen) {
        if (boom.schud > 0) boom.schud -= dt;
        if (boom.valt >= 0) {
          boom.valt += dt * 0.9;
          if (boom.valt >= 1) {
            // Boom ligt: hout oprapen en de stronk blijft achter
            boom.valt = -1;
            boom.hergroei = hergroeiTijd;
            hout += houtPerBoom;
            toonMelding(`+${houtPerBoom} hout`, boom.x, diepteNaarY(boom.d) - 120, '#d9a066');
            missieVoortgang('hout', boom.x, diepteNaarY(boom.d) - 160);
          }
        } else if (boom.hergroei > 0) {
          boom.hergroei -= dt;
          if (boom.hergroei <= 0) { boom.leven = boomLeven; boom.groei = 0; }
        } else if (boom.groei < 1) {
          boom.groei = Math.min(1, boom.groei + dt);
        }
      }
    }

    // Tekent een boom met de voet op (0, 0). Wordt via tekenOpWereld op de juiste plek gezet.
    function tekenBoom(boom) {
      const x = 0, y = 0;

      // Stronk is er altijd (als de boom staat zit hij eronder)
      ctx.fillStyle = '#5a3a1c';
      ctx.fillRect(x - 14, y - 18, 28, 18);
      ctx.fillStyle = '#c9a066';
      ctx.beginPath(); ctx.ellipse(x, y - 18, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#9a7040';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x, y - 18, 8, 3, 0, 0, Math.PI * 2); ctx.stroke();

      if (boom.hergroei > 0) return; // alleen de stronk

      ctx.save();
      ctx.translate(x, y - 16);
      // Schudden bij een slag
      if (boom.schud > 0) ctx.translate(Math.sin(boom.schud * 60) * 4, 0);
      // Omvallen: draaien om de voet, steeds sneller
      if (boom.valt >= 0) ctx.rotate(boom.valRichting * boom.valt * boom.valt * Math.PI / 2);
      // Aangroeien: klein beginnen
      const schaal = 0.2 + 0.8 * boom.groei;
      ctx.scale(schaal, schaal);

      const hoogte = boom.hoogte;
      // Stam met schors
      const stam = ctx.createLinearGradient(-14, 0, 14, 0);
      stam.addColorStop(0, '#4a2e14');
      stam.addColorStop(0.5, '#7a4e26');
      stam.addColorStop(1, '#3e2510');
      ctx.fillStyle = stam;
      ctx.beginPath();
      ctx.moveTo(-14, 0);
      ctx.lineTo(14, 0);
      ctx.lineTo(9, -hoogte * 0.75);
      ctx.lineTo(-9, -hoogte * 0.75);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-6 + i * 4, -10 - i * 25);
        ctx.lineTo(-4 + i * 4, -40 - i * 25);
        ctx.stroke();
      }
      // Hakwonden zichtbaar maken als de boom beschadigd is
      const schade = boomLeven - boom.leven;
      ctx.fillStyle = '#e0c090';
      for (let i = 0; i < schade; i++) {
        ctx.beginPath();
        ctx.moveTo(boom.valRichting * -12, -30 - i * 6);
        ctx.lineTo(boom.valRichting * 2, -34 - i * 6);
        ctx.lineTo(boom.valRichting * -12, -38 - i * 6);
        ctx.fill();
      }
      // Kruin: een paar bollen bladeren
      const top = -hoogte * 0.75;
      const groen = ['#1f4d1f', '#2e6b2e', '#3c823c'];
      const bollen = [[0, -20, 58], [-40, 0, 44], [42, -4, 46], [-20, -50, 40], [24, -52, 42], [0, -75, 34]];
      bollen.forEach((bol, i) => {
        ctx.fillStyle = groen[i % 3];
        ctx.beginPath();
        ctx.arc(bol[0], top + bol[1], bol[2], 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    // ---------- Handelaar en winkel ----------

    // De wapens die je kunt kopen. Een groter bereik betekent dat je dieren van verder weg raakt.
    const wapens = [
      // hak is hoeveel schade een slag aan een boom doet. Een boom heeft 4 leven.
      { naam: 'Knots', prijs: 0, bereik: 80, hak: 1, gekocht: true, uitleg: 'Je oude vertrouwde knots.' },
      { naam: 'Stenen bijl', prijs: 25, bereik: 110, hak: 2, gekocht: false, uitleg: 'Scherpe steen, hakt bomen snel om.' },
      // schiet betekent dat het wapen iets afvuurt dat door de wereld vliegt tot het een dier raakt.
      { naam: 'Speer', prijs: 60, bereik: 280, hak: 1, gekocht: false, schiet: 'speer', uitleg: 'Gooi hem, hij komt vanzelf terug.' },
      { naam: 'Slinger', prijs: 90, bereik: 340, hak: 0, gekocht: false, schiet: 'steen', uitleg: 'Leren riem die stenen wegslingert.' },
      { naam: 'Boog', prijs: 120, bereik: 480, hak: 0, gekocht: false, schiet: 'pijl', uitleg: 'Schiet pijlen over het halve veld.' },
      { naam: 'Sabeltandknuppel', prijs: 200, bereik: 200, hak: 4, gekocht: false, uitleg: 'Knuppel met tijgertanden: hakt een boom in één klap.' },
    ];

    // Kleren van de prehistorie. Elk kledingstuk ziet anders uit én doet iets voor je.
    const kleren = [
      { naam: 'Dierenvel', prijs: 0, gekocht: true, uitleg: 'Je gewone bruine vel.',
        velKleur: ['#8b4a22', '#b8683a', '#7a3d1c'], vlekKleur: '#4a2410', hoofd: 'geen', snelheid: 1, muntenBonus: 0, dierTempo: 1, steenBereik: 22 },
      { naam: 'Wolvenvacht', prijs: 50, gekocht: false, uitleg: 'Grijze vacht, je loopt 30% sneller.',
        velKleur: ['#5a5a60', '#8a8a92', '#4a4a50'], vlekKleur: '#2e2e33', hoofd: 'geen', snelheid: 1.3, muntenBonus: 0, dierTempo: 1, steenBereik: 22 },
      { naam: 'Verenkroon', prijs: 80, gekocht: false, uitleg: 'Kleurige veren op je hoofd, dieren komen vaker.',
        velKleur: ['#8b4a22', '#b8683a', '#7a3d1c'], vlekKleur: '#4a2410', hoofd: 'veren', snelheid: 1, muntenBonus: 0, dierTempo: 0.5, steenBereik: 22 },
      { naam: 'Berenhuid', prijs: 110, gekocht: false, uitleg: 'Dikke donkere huid, elke missiestap geeft 1 munt extra.',
        velKleur: ['#2e1a0e', '#4a2c18', '#22120a'], vlekKleur: '#1a0d06', hoofd: 'geen', snelheid: 1, muntenBonus: 1, dierTempo: 1, steenBereik: 22 },
      { naam: 'Mammoetlaarzen', prijs: 150, gekocht: false, uitleg: 'Wollige laarzen, je raapt stenen van verder op.',
        velKleur: ['#8b4a22', '#b8683a', '#7a3d1c'], vlekKleur: '#4a2410', hoofd: 'laarzen', snelheid: 1.1, muntenBonus: 0, dierTempo: 1, steenBereik: 60 },
      { naam: 'Sjamanenmasker', prijs: 250, gekocht: false, uitleg: 'Houten masker met horens: 2 munten extra per stap.',
        velKleur: ['#6b2d2d', '#a04040', '#5a2222'], vlekKleur: '#ffd166', hoofd: 'masker', snelheid: 1.1, muntenBonus: 2, dierTempo: 0.8, steenBereik: 30 },
    ];
    let huidigeKleren = 0;
    function kleding() { return kleren[huidigeKleren]; }

    // Spullen die geen wapen en geen kleding zijn.
    const spullen = [
      { naam: 'Vishengel', prijs: 15, gekocht: false, uitleg: 'Stok met een pees en een botje als haak. Nodig om te vissen.' },
    ];

    // Vissen duurt even: je gooit uit en wacht op beet.
    const visTijd = 1.4;
    let vist = 0; // seconden tot je beet hebt (0 = niet aan het vissen)

    function updateVisserij(dt) {
      if (vist <= 0) return;
      vist -= dt;
      if (vist <= 0) {
        if (vissen.length > 0) {
          vissen.splice(Math.floor(Math.random() * vissen.length), 1);
          missieVoortgang('vissen', speler.x, spelerY() - 170);
          toonMelding('Beet!', speler.x, spelerY() - 200, '#4ecdc4');
          // Na een paar seconden zwemt er een nieuwe vis het meer in.
          setTimeout(() => { if (vissen.length < aantalVissen) vissen.push(maakVis()); }, 4000);
        }
      }
    }
    let huidigWapen = 0;

    // De handelaar staat met zijn kraampje op een vaste plek op de grond.
    const handelaar = { x: 1600, d: 0.4 };
    let winkelOpen = false;
    let winkelKeuze = 0;
    let winkelTab = 0; // 0 = wapens, 1 = kleren
    let winkelBericht = '';
    const winkelTabs = [
      { naam: 'Wapens', lijst: () => wapens, huidig: () => huidigWapen },
      { naam: 'Kleren', lijst: () => kleren, huidig: () => huidigeKleren },
      { naam: 'Spullen', lijst: () => spullen, huidig: () => -1 },
    ];

    function bijHandelaar() {
      return Math.abs(speler.x - handelaar.x) < 110 && Math.abs(spelerY() - diepteNaarY(handelaar.d)) < 60;
    }

    function openWinkel() {
      winkelOpen = true;
      winkelTab = 0;
      winkelKeuze = huidigWapen;
      winkelBericht = 'Welkom! Wat wil je kopen?';
    }

    function winkelToets(toets) {
      const lijst = winkelTabs[winkelTab].lijst();
      if (toets === 'ArrowUp') winkelKeuze = (winkelKeuze + lijst.length - 1) % lijst.length;
      if (toets === 'ArrowDown') winkelKeuze = (winkelKeuze + 1) % lijst.length;
      if (toets === 'ArrowLeft') winkelTab = (winkelTab + winkelTabs.length - 1) % winkelTabs.length;
      if (toets === 'ArrowRight') winkelTab = (winkelTab + 1) % winkelTabs.length;
      if (toets === 'ArrowLeft' || toets === 'ArrowRight') winkelKeuze = Math.max(0, winkelTabs[winkelTab].huidig());
      if (toets === 'Enter' || toets === ' ') koopOfKies(lijst[winkelKeuze], winkelKeuze);
      if (toets === 'e' || toets === 'E' || toets === 'Escape') winkelOpen = false;
    }

    function koopOfKies(ding, index) {
      const isWapen = winkelTab === 0, isKleding = winkelTab === 1;
      const naam = ding.naam.toLowerCase();
      if (ding.gekocht) {
        if (isWapen) huidigWapen = index; else if (isKleding) huidigeKleren = index;
        winkelBericht = isWapen ? `Je hebt nu de ${naam} in je hand.` : isKleding ? `Je draagt nu de ${naam}.` : `Je hebt de ${naam} al.`;
      } else if (munten >= ding.prijs) {
        munten -= ding.prijs;
        ding.gekocht = true;
        if (isWapen) huidigWapen = index; else if (isKleding) huidigeKleren = index;
        winkelBericht = isWapen ? `Gekocht! Veel jachtplezier met je ${naam}.` : isKleding ? `Gekocht! De ${naam} staat je goed.` : `Gekocht! Ga naar het meer en druk op spatie.`;
      } else {
        winkelBericht = `Te weinig munten. Je hebt er nog ${ding.prijs - munten} nodig.`;
      }
    }

    // Tekent het kraampje met de handelaar, met de grond op (0, 0).
    function tekenHandelaar() {
      const x = 0, y = 0;

      // Kraampje: twee palen met een dierenvel als afdak
      ctx.strokeStyle = '#5a3a1c';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - 70, y); ctx.lineTo(x - 70, y - 150);
      ctx.moveTo(x + 70, y); ctx.lineTo(x + 70, y - 150);
      ctx.stroke();
      ctx.fillStyle = '#a0522d';
      ctx.beginPath();
      ctx.moveTo(x - 85, y - 150);
      ctx.lineTo(x + 85, y - 150);
      ctx.lineTo(x + 80, y - 125);
      for (let i = 80; i >= -80; i -= 16) ctx.lineTo(x + i - 8, y - (i % 32 === 0 ? 118 : 128));
      ctx.lineTo(x - 80, y - 125);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#4a2410';
      ctx.beginPath();
      ctx.arc(x - 30, y - 138, 6, 0, Math.PI * 2);
      ctx.arc(x + 25, y - 135, 5, 0, Math.PI * 2);
      ctx.fill();

      // De handelaar zelf, achter de tafel: grijs haar, kettinkje van tanden
      const hx = x, hy = y - 20;
      const huid = '#c8905a';
      ctx.fillStyle = '#6b8e5a';
      ctx.beginPath();
      ctx.moveTo(hx - 20, hy - 40); ctx.lineTo(hx + 20, hy - 40);
      ctx.lineTo(hx + 26, hy + 10); ctx.lineTo(hx - 26, hy + 10);
      ctx.closePath();
      ctx.fill();
      // Zwaaiende arm
      const zwaai = Math.sin(tijd * 4) * 0.5;
      ctx.strokeStyle = huid;
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(hx + 18, hy - 36);
      ctx.lineTo(hx + 34, hy - 60 + zwaai * 15);
      ctx.lineTo(hx + 30 + zwaai * 10, hy - 85);
      ctx.stroke();
      // Hoofd
      ctx.fillStyle = huid;
      ctx.beginPath(); ctx.arc(hx, hy - 60, 20, 0, Math.PI * 2); ctx.fill();
      // Grijze baard en haar
      ctx.fillStyle = '#c9c4b8';
      ctx.beginPath();
      ctx.moveTo(hx - 17, hy - 56);
      ctx.quadraticCurveTo(hx, hy - 10, hx + 17, hy - 56);
      ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy - 66, 21, Math.PI, 0); ctx.fill();
      // Ketting van tanden
      ctx.fillStyle = '#f0e6d0';
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.moveTo(hx + i * 6 - 2, hy - 40); ctx.lineTo(hx + i * 6, hy - 32); ctx.lineTo(hx + i * 6 + 2, hy - 40);
        ctx.fill();
      }
      // Ogen
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(hx - 7, hy - 62, 2.2, 0, Math.PI * 2);
      ctx.arc(hx + 7, hy - 62, 2.2, 0, Math.PI * 2);
      ctx.fill();

      // Stenen tafel
      ctx.fillStyle = '#6e6257';
      ctx.fillRect(x - 60, y - 60, 120, 14);
      ctx.fillStyle = '#4d453c';
      ctx.fillRect(x - 50, y - 46, 18, 46);
      ctx.fillRect(x + 32, y - 46, 18, 46);

      // Wapens uitgestald op de tafel: een bijl en een speer
      ctx.save();
      ctx.translate(x - 35, y - 62);
      ctx.rotate(-0.3);
      tekenWapenVorm(1, 0, 0, 0.6);
      ctx.restore();
      ctx.save();
      ctx.translate(x + 10, y - 62);
      ctx.rotate(-1.1);
      tekenWapenVorm(2, 0, 0, 0.55);
      ctx.restore();
      // Stapel munten op de tafel
      tekenMunt(x + 40, y - 66, 6);
      tekenMunt(x + 46, y - 64, 6);

    }

    // Hint boven het kraampje als de speler dichtbij staat (in schermcoördinaten, dus niet geschaald).
    function tekenHandelaarHint() {
      if (!bijHandelaar() || winkelOpen) return;
      const x = schermX(handelaar.x);
      const y = diepteNaarY(handelaar.d) - 170 * schaalOpDiepte(handelaar.d);
      ctx.textAlign = 'center';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(x - 110, y - 22, 220, 30);
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Druk op E om te handelen', x, y);
      ctx.textAlign = 'left';
    }

    function tekenWinkel() {
      if (!winkelOpen) return;
      const b = canvas.width, h = canvas.height;
      const lijst = winkelTabs[winkelTab].lijst();
      const huidig = winkelTabs[winkelTab].huidig();
      const rijHoogte = 54;
      const pw = Math.min(620, b - 40), ph = 130 + lijst.length * rijHoogte + 70;
      const px = b / 2 - pw / 2, py = Math.max(10, h / 2 - ph / 2);

      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, b, h);
      ctx.fillStyle = '#3b2a1a';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = '#a0522d';
      ctx.lineWidth = 6;
      ctx.strokeRect(px, py, pw, ph);

      ctx.textAlign = 'left';
      ctx.font = 'bold 26px sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText('Handelaar Oeg', px + 24, py + 40);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.fillText('(spel gepauzeerd)', px + 24 + ctx.measureText('Handelaar Oeg').width + 80, py + 40);
      ctx.textAlign = 'right';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(`${munten} munten`, px + pw - 24, py + 40);
      tekenMunt(px + pw - 24 - ctx.measureText(`${munten} munten`).width - 18, py + 32, 10);

      // Tabbladen
      winkelTabs.forEach((tab, i) => {
        const tx = px + 24 + i * 130, ty = py + 58;
        const actief = i === winkelTab;
        ctx.fillStyle = actief ? '#a0522d' : 'rgba(255,255,255,0.08)';
        ctx.fillRect(tx, ty, 120, 34);
        ctx.textAlign = 'center';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = actief ? '#fff' : 'rgba(255,255,255,0.6)';
        ctx.fillText(tab.naam, tx + 60, ty + 24);
      });
      ctx.textAlign = 'right';
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('Pijltje links/rechts wisselt van tabblad', px + pw - 24, py + 82);

      lijst.forEach((ding, i) => {
        const ry = py + 104 + i * rijHoogte;
        const gekozen = i === winkelKeuze;
        ctx.fillStyle = gekozen ? 'rgba(255,209,102,0.2)' : 'rgba(255,255,255,0.04)';
        ctx.fillRect(px + 16, ry, pw - 32, rijHoogte - 6);
        if (gekozen) {
          ctx.strokeStyle = '#ffd166';
          ctx.lineWidth = 2;
          ctx.strokeRect(px + 16, ry, pw - 32, rijHoogte - 6);
        }
        // Plaatje
        ctx.save();
        ctx.translate(px + 50, ry + 40);
        if (winkelTab === 0) { ctx.rotate(-0.9); tekenWapenVorm(i, 0, 0, 0.45); }
        else if (winkelTab === 1) tekenKledingIcoon(ding, 0, 0);
        else { ctx.rotate(-0.7); tekenHengel(0, 0, 0.45); }
        ctx.restore();

        ctx.textAlign = 'left';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText(ding.naam, px + 90, ry + 21);
        ctx.font = '13px sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        const extra = winkelTab === 0 ? `  Bereik ${ding.bereik}, hakkracht ${ding.hak}` : '';
        ctx.fillText(ding.uitleg + extra, px + 90, ry + 39);

        ctx.textAlign = 'right';
        ctx.font = 'bold 17px sans-serif';
        if (i === huidig) {
          ctx.fillStyle = '#8fd18f';
          ctx.fillText(winkelTab === 0 ? 'In de hand' : winkelTab === 1 ? 'Aan' : 'Gekocht', px + pw - 30, ry + 30);
        } else if (ding.gekocht) {
          ctx.fillStyle = '#8fd18f';
          ctx.fillText('Gekocht', px + pw - 30, ry + 30);
        } else {
          ctx.fillStyle = munten >= ding.prijs ? '#ffd166' : '#d96c6c';
          ctx.fillText(`${ding.prijs} munten`, px + pw - 30, ry + 30);
        }
      });

      ctx.textAlign = 'center';
      ctx.font = '17px sans-serif';
      ctx.fillStyle = '#ffd166';
      ctx.fillText(winkelBericht, b / 2, py + ph - 40);
      ctx.font = '14px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('Omhoog/omlaag = kiezen, Enter = kopen of gebruiken, E = sluiten', b / 2, py + ph - 16);
      ctx.textAlign = 'left';
    }

    // Vishengel: een lange stok met een pees en een botje als haak.
    function tekenHengel(x, y, schaal = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      ctx.strokeStyle = '#8a6a3a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6, -70, 20, -130); ctx.stroke();
      ctx.strokeStyle = '#e8e0c8';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(20, -130); ctx.lineTo(44, -60); ctx.stroke();
      ctx.fillStyle = '#f5f0e0';
      ctx.beginPath(); ctx.arc(46, -56, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Klein plaatje van een kledingstuk voor in de winkel: een velletje in de juiste kleur.
    function tekenKledingIcoon(k, x, y) {
      ctx.fillStyle = k.velKleur[1];
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 18); ctx.lineTo(x + 12, y - 18); ctx.lineTo(x + 16, y + 10);
      for (let i = 16; i >= -16; i -= 8) ctx.lineTo(x + i - 4, y + (i % 16 === 0 ? 14 : 10));
      ctx.lineTo(x - 16, y + 10);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = k.vlekKleur;
      ctx.beginPath(); ctx.arc(x - 3, y - 4, 3, 0, Math.PI * 2); ctx.arc(x + 5, y + 4, 2.5, 0, Math.PI * 2); ctx.fill();
      if (k.hoofd === 'veren') {
        const kleuren = ['#d9534f', '#ffd166', '#4ecdc4'];
        kleuren.forEach((kl, i) => {
          ctx.fillStyle = kl;
          ctx.beginPath(); ctx.ellipse(x - 8 + i * 8, y - 28, 3, 9, (i - 1) * 0.3, 0, Math.PI * 2); ctx.fill();
        });
      }
      if (k.hoofd === 'masker') {
        ctx.fillStyle = '#c9a066';
        ctx.beginPath(); ctx.ellipse(x, y - 26, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(x - 3, y - 28, 1.5, 0, Math.PI * 2); ctx.arc(x + 3, y - 28, 1.5, 0, Math.PI * 2); ctx.fill();
      }
      if (k.hoofd === 'laarzen') {
        ctx.fillStyle = '#e8dcc8';
        ctx.fillRect(x - 12, y + 12, 9, 8); ctx.fillRect(x + 3, y + 12, 9, 8);
      }
    }

    // Tekent de vorm van een wapen met het handvat op (x, y), rechtop naar boven. Wordt gebruikt
    // in de hand van het poppetje, op de tafel van de handelaar en in het winkelmenu.
    function tekenWapenVorm(index, x, y, schaal = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      ctx.lineCap = 'round';
      if (index === 0) {
        // Knots: knoestig stuk hout met een dikke kop
        ctx.strokeStyle = '#5a3a1c';
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(16, -50); ctx.stroke();
        const knots = ctx.createRadialGradient(14, -60, 2, 18, -56, 14);
        knots.addColorStop(0, '#8a5a30');
        knots.addColorStop(1, '#4a2e14');
        ctx.fillStyle = knots;
        ctx.beginPath(); ctx.ellipse(18, -56, 13, 16, 0.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#2e1a0a';
        ctx.beginPath();
        ctx.arc(24, -62, 2.5, 0, Math.PI * 2);
        ctx.arc(12, -50, 2, 0, Math.PI * 2);
        ctx.fill();
      } else if (index === 1) {
        // Stenen bijl: stok met een scherpe steen, vastgebonden met touw
        ctx.strokeStyle = '#6b4a2a';
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, -60); ctx.stroke();
        ctx.fillStyle = '#8a8a86';
        ctx.beginPath();
        ctx.moveTo(4, -50); ctx.lineTo(30, -70); ctx.lineTo(26, -44); ctx.lineTo(8, -40);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#c9a66b';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(4, -48); ctx.lineTo(14, -54); ctx.moveTo(6, -44); ctx.lineTo(16, -50); ctx.stroke();
      } else if (index === 2) {
        // Speer: lange stok met een stenen punt en veertjes
        ctx.strokeStyle = '#7a5a30';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -95); ctx.stroke();
        ctx.fillStyle = '#9a9a96';
        ctx.beginPath(); ctx.moveTo(-6, -92); ctx.lineTo(0, -115); ctx.lineTo(6, -92); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#d9534f';
        ctx.beginPath(); ctx.moveTo(-1, -85); ctx.lineTo(-9, -78); ctx.lineTo(-1, -70); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(1, -85); ctx.lineTo(9, -78); ctx.lineTo(1, -70); ctx.closePath(); ctx.fill();
      } else if (index === 3) {
        // Slinger: leren riem met een steen erin
        ctx.strokeStyle = '#8a5a30';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-18, -35, 0, -60); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(18, -35, 0, -60); ctx.stroke();
        ctx.fillStyle = '#6b4423';
        ctx.beginPath(); ctx.ellipse(0, -60, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8a8a86';
        ctx.beginPath(); ctx.arc(0, -62, 5, 0, Math.PI * 2); ctx.fill();
      } else if (index === 4) {
        // Boog: gebogen tak met een pees, en een pijl
        ctx.strokeStyle = '#7a5a30';
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.quadraticCurveTo(28, -30, 0, -90); ctx.stroke();
        ctx.strokeStyle = '#e8e0c8';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(0, -90); ctx.stroke();
        ctx.strokeStyle = '#c9a66b';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(40, -30); ctx.stroke();
        ctx.fillStyle = '#9a9a96';
        ctx.beginPath(); ctx.moveTo(38, -36); ctx.lineTo(52, -30); ctx.lineTo(38, -24); ctx.closePath(); ctx.fill();
      } else {
        // Sabeltandknuppel: zware knuppel met een rij tijgertanden
        ctx.strokeStyle = '#3e2510';
        ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(12, -70); ctx.stroke();
        ctx.fillStyle = '#5a3a1c';
        ctx.beginPath(); ctx.ellipse(14, -78, 14, 22, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f0e6d0';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.moveTo(24 + i * 1.5, -96 + i * 12); ctx.lineTo(36 + i * 1.5, -92 + i * 12); ctx.lineTo(24 + i * 1.5, -86 + i * 12);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ---------- Dieren (om op te jagen) ----------

    // Elke diersoort heeft een snelheid, een aantal levens (klappen), een beloning en een tekenfunctie.
    // gedrag: 'loopt' gewoon door, 'vlucht' rent weg als je dichtbij komt, 'huppelt' springt en zigzagt.
    const dierSoorten = [
      { naam: 'everzwijn', kans: 4, snelheid: [70, 130], leven: 1, beloning: 0, gedrag: 'loopt', teken: d => tekenEverzwijn(0, 0, Math.sign(d.snelheid), d.stap) },
      { naam: 'hert', kans: 3, snelheid: [90, 140], leven: 1, beloning: 2, gedrag: 'vlucht', teken: d => tekenHert(d) },
      { naam: 'haas', kans: 3, snelheid: [140, 200], leven: 1, beloning: 1, gedrag: 'huppelt', teken: d => tekenHaas(d) },
      { naam: 'mammoet', kans: 1, snelheid: [35, 55], leven: 3, beloning: 15, gedrag: 'loopt', teken: d => tekenMammoet(d) },
    ];

    function kiesSoort(soorten) {
      let totaal = 0;
      for (const s of soorten) totaal += s.kans;
      let lot = Math.random() * totaal;
      for (const s of soorten) { lot -= s.kans; if (lot <= 0) return s; }
      return soorten[0];
    }

    const dieren = [];
    let volgendDier = 2; // seconden tot het volgende dier verschijnt

    function updateDieren(dt) {
      volgendDier -= dt;
      const jagenKlaar = missies[0].voortgang >= missies[0].doel;
      if (volgendDier <= 0 && dieren.length < 3 && !jagenKlaar) {
        volgendDier = (2.5 + Math.random() * 2.5) * kleding().dierTempo;
        // Het dier komt net buiten beeld de wereld in, links of rechts van de camera
        const vanLinks = Math.random() < 0.5;
        const soort = kiesSoort(dierSoorten);
        const basis = soort.snelheid[0] + Math.random() * (soort.snelheid[1] - soort.snelheid[0]);
        dieren.push({
          soort,
          x: vanLinks ? camera.x - 60 : camera.x + canvas.width + 60,
          d: 0.1 + Math.random() * 0.85,
          snelheid: (vanLinks ? 1 : -1) * basis * (1 + (ronde - 1) * 0.25),
          leven: soort.leven,
          stap: 0,
          schud: 0,
          zigzag: Math.random() * Math.PI * 2,
        });
      }
      for (let i = dieren.length - 1; i >= 0; i--) {
        const d = dieren[i];
        if (d.schud > 0) d.schud -= dt;
        d.stap += dt * (d.soort.gedrag === 'huppelt' ? 14 : d.soort.naam === 'mammoet' ? 5 : 12);

        // Een hert vlucht weg zodra je dichtbij komt
        if (d.soort.gedrag === 'vlucht' && Math.abs(d.x - speler.x) < 260 && Math.abs(diepteNaarY(d.d) - spelerY()) < 60) {
          const weg = Math.sign(d.x - speler.x) || 1;
          d.snelheid = weg * Math.max(Math.abs(d.snelheid), 240);
        }
        // Een haas zigzagt in de diepte
        if (d.soort.gedrag === 'huppelt') {
          d.zigzag += dt * 3;
          d.d = Math.max(0.08, Math.min(0.97, d.d + Math.sin(d.zigzag) * 0.5 * dt));
        }

        const nieuwX = d.x + d.snelheid * dt;
        // Dieren lopen om het meer heen: bij het water keren ze om
        if (inMeer(nieuwX, d.d, 40)) d.snelheid = -d.snelheid;
        else d.x = nieuwX;
        // Ver buiten beeld verdwijnt het dier weer
        if (d.x < camera.x - 400 || d.x > camera.x + canvas.width + 400) dieren.splice(i, 1);
      }
    }

    // Een klap of schot op een dier. Geeft true als er een geraakt is.
    function raakDier(d, index) {
      d.leven--;
      d.schud = 0.3;
      if (d.leven > 0) {
        // Grote dieren schrikken en rennen even harder
        d.snelheid *= 1.4;
        toonMelding(`Nog ${d.leven} klappen`, d.x, diepteNaarY(d.d) - 140, '#fff');
        return true;
      }
      dieren.splice(index, 1);
      missieVoortgang('jagen', d.x, diepteNaarY(d.d) - 120);
      if (d.soort.beloning > 0) {
        munten += d.soort.beloning;
        toonMelding(`${d.soort.naam} gevangen! +${d.soort.beloning} munten`, d.x, diepteNaarY(d.d) - 160, '#ffd166');
      }
      return true;
    }

    // Hert: slank bruin lijf, lange nek en een gewei. Kijkt naar rechts; we spiegelen op looprichting.
    function tekenHert(d) {
      ctx.save();
      ctx.scale(Math.sign(d.snelheid) || 1, 1);
      if (d.schud > 0) ctx.translate(Math.sin(d.schud * 60) * 4, 0);
      const zwaai = Math.sin(d.stap) * 12;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 2, 36, 6, 0, 0, Math.PI * 2); ctx.fill();
      // Dunne poten
      ctx.strokeStyle = '#7a5230';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-20 + zwaai, 0); ctx.lineTo(-18, -40);
      ctx.moveTo(-10 - zwaai, 0); ctx.lineTo(-12, -40);
      ctx.moveTo(14 + zwaai, 0); ctx.lineTo(14, -40);
      ctx.moveTo(24 - zwaai, 0); ctx.lineTo(22, -40);
      ctx.stroke();
      // Lijf
      ctx.fillStyle = '#a8703f';
      ctx.beginPath(); ctx.ellipse(0, -50, 30, 15, 0, 0, Math.PI * 2); ctx.fill();
      // Witte vlekjes
      ctx.fillStyle = '#f5e6c8';
      for (let i = -14; i <= 14; i += 9) { ctx.beginPath(); ctx.arc(i, -55 + (i % 2) * 5, 2, 0, Math.PI * 2); ctx.fill(); }
      // Nek en kop
      ctx.strokeStyle = '#a8703f';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.moveTo(24, -55); ctx.lineTo(38, -90); ctx.stroke();
      ctx.fillStyle = '#a8703f';
      ctx.beginPath(); ctx.ellipse(44, -94, 13, 8, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(46, -97, 2, 0, Math.PI * 2); ctx.fill();
      // Gewei
      ctx.strokeStyle = '#d9c8a8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(38, -100); ctx.lineTo(30, -125); ctx.moveTo(33, -112); ctx.lineTo(24, -118); ctx.moveTo(32, -118); ctx.lineTo(36, -130);
      ctx.moveTo(44, -101); ctx.lineTo(50, -126); ctx.moveTo(48, -113); ctx.lineTo(56, -118); ctx.moveTo(49, -119); ctx.lineTo(46, -131);
      ctx.stroke();
      // Staartje
      ctx.fillStyle = '#f5e6c8';
      ctx.beginPath(); ctx.ellipse(-30, -54, 4, 6, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Haas: klein grijsbruin diertje met lange oren dat huppelt.
    function tekenHaas(d) {
      ctx.save();
      ctx.scale(Math.sign(d.snelheid) || 1, 1);
      if (d.schud > 0) ctx.translate(Math.sin(d.schud * 60) * 4, 0);
      const sprong = Math.abs(Math.sin(d.stap * 0.5)) * 14;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 2, 16, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.translate(0, -sprong);
      // Achterpoot en voorpoot
      ctx.fillStyle = '#8a7358';
      ctx.beginPath(); ctx.ellipse(-8, -8, 9, 6, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(10, -6, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
      // Lijf
      ctx.fillStyle = '#a08a68';
      ctx.beginPath(); ctx.ellipse(0, -16, 16, 11, -0.2, 0, Math.PI * 2); ctx.fill();
      // Kop
      ctx.beginPath(); ctx.arc(15, -26, 7, 0, Math.PI * 2); ctx.fill();
      // Lange oren
      ctx.beginPath(); ctx.ellipse(11, -40, 3, 10, -0.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16, -40, 3, 10, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e8c8b8';
      ctx.beginPath(); ctx.ellipse(11, -40, 1.3, 7, -0.1, 0, Math.PI * 2); ctx.fill();
      // Oog en staartje
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(17, -27, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5f0e6';
      ctx.beginPath(); ctx.arc(-15, -18, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Mammoet: groot, langzaam en harig, met gebogen slagtanden. Drie klappen nodig.
    function tekenMammoet(d) {
      ctx.save();
      ctx.scale(Math.sign(d.snelheid) || 1, 1);
      if (d.schud > 0) ctx.translate(Math.sin(d.schud * 60) * 5, 0);
      const zwaai = Math.sin(d.stap) * 8;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 2, 80, 12, 0, 0, Math.PI * 2); ctx.fill();
      // Poten als boomstammen
      ctx.strokeStyle = '#5a3c26';
      ctx.lineWidth = 18;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-45 + zwaai, 0); ctx.lineTo(-42, -60);
      ctx.moveTo(-20 - zwaai, 0); ctx.lineTo(-22, -60);
      ctx.moveTo(25 + zwaai, 0); ctx.lineTo(24, -60);
      ctx.moveTo(50 - zwaai, 0); ctx.lineTo(46, -60);
      ctx.stroke();
      // Lijf met hoge rug
      const vacht = ctx.createLinearGradient(0, -150, 0, -40);
      vacht.addColorStop(0, '#8a5a34');
      vacht.addColorStop(1, '#4a2e1a');
      ctx.fillStyle = vacht;
      ctx.beginPath(); ctx.ellipse(0, -95, 80, 55, 0, 0, Math.PI * 2); ctx.fill();
      // Lange haren langs de buik
      ctx.fillStyle = '#6a4224';
      for (let i = -70; i <= 60; i += 13) {
        ctx.beginPath(); ctx.moveTo(i, -55); ctx.lineTo(i + 5, -30 + (i % 26 === 0 ? 6 : 0)); ctx.lineTo(i + 12, -55); ctx.fill();
      }
      // Kop met bol voorhoofd
      ctx.fillStyle = '#6a4224';
      ctx.beginPath(); ctx.arc(72, -110, 34, 0, Math.PI * 2); ctx.fill();
      // Slurf
      ctx.strokeStyle = '#6a4224';
      ctx.lineWidth = 14;
      ctx.beginPath(); ctx.moveTo(92, -95); ctx.quadraticCurveTo(112, -60, 100 + Math.sin(d.stap) * 6, -15); ctx.stroke();
      // Gebogen slagtanden
      ctx.strokeStyle = '#f0e6d0';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(86, -88); ctx.quadraticCurveTo(130, -70, 120, -30); ctx.stroke();
      // Oor en oog
      ctx.fillStyle = '#5a3c26';
      ctx.beginPath(); ctx.ellipse(52, -110, 10, 16, 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(80, -115, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // Levensbalkje als hij al geraakt is
      if (d.leven < d.soort.leven) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-30, -170, 60, 8);
        ctx.fillStyle = '#7bd389'; ctx.fillRect(-30, -170, 60 * d.leven / d.soort.leven, 8);
      }
    }

    // ---------- Roofdieren ----------

    // Roofdieren rennen op je af. Raken ze je, dan verlies je een leven. Je kunt ze doden,
    // maar daar zijn een paar rake klappen voor nodig. Elke soort is anders:
    // de neushoorn is stevig, de sabeltandtijger snel, de holenbeer traag maar heel taai.
    const roofdierSoorten = [
      { naam: 'wolharige neushoorn', kans: 3, snelheid: 150, leven: 3, beloning: 20, teken: n => tekenNeushoorn(n) },
      { naam: 'sabeltandtijger', kans: 3, snelheid: 230, leven: 2, beloning: 25, teken: n => tekenSabeltandtijger(n) },
      { naam: 'holenbeer', kans: 2, snelheid: 110, leven: 5, beloning: 35, teken: n => tekenHolenbeer(n) },
    ];

    const roofdieren = [];
    let volgendRoofdier = 15; // seconden tot het eerste roofdier
    let doodDoor = 'een roofdier';

    function updateRoofdieren(dt) {
      volgendRoofdier -= dt;
      // In latere rondes kunnen er meer roofdieren tegelijk zijn
      const maxRoofdieren = 1 + Math.floor((ronde - 1) / 2);
      if (volgendRoofdier <= 0 && roofdieren.length < maxRoofdieren) {
        // 's Nachts komen ze vaker, en in latere rondes ook
        volgendRoofdier = (isNacht() ? 14 : 26) / (1 + (ronde - 1) * 0.3);
        const soort = kiesSoort(roofdierSoorten);
        const vanLinks = Math.random() < 0.5;
        roofdieren.push({
          soort,
          x: vanLinks ? camera.x - 120 : camera.x + canvas.width + 120,
          d: speler.d,
          richting: vanLinks ? 1 : -1,
          snelheid: soort.snelheid + (ronde - 1) * 25,
          leven: soort.leven,
          stap: 0,
          doorrennen: 0, // na een aanval rent hij even door voordat hij omkeert
          schud: 0,
        });
      }
      for (let i = roofdieren.length - 1; i >= 0; i--) {
        const n = roofdieren[i];
        n.stap += dt * (n.snelheid / 15);
        if (n.schud > 0) n.schud -= dt;
        if (n.doorrennen > 0) {
          n.doorrennen -= dt;
          if (n.doorrennen <= 0) n.richting = Math.sign(speler.x - n.x) || 1;
        } else {
          // Achter de speler aan, ook in de diepte
          n.richting = Math.sign(speler.x - n.x) || n.richting;
          n.d += Math.sign(speler.d - n.d) * Math.min(Math.abs(speler.d - n.d), 0.5 * dt);
        }
        const nieuwX = n.x + n.richting * n.snelheid * dt;
        // Hij rent om het meer heen
        if (inMeer(nieuwX, n.d, 60)) n.d += (n.d < meer.d ? -1 : 1) * 0.6 * dt;
        else n.x = nieuwX;
        n.d = Math.max(0.08, Math.min(0.97, n.d));

        // Raakt hij de speler?
        if (n.doorrennen <= 0 && Math.abs(n.x - speler.x) < 50 && Math.abs(diepteNaarY(n.d) - spelerY()) < 30) {
          doodDoor = 'een ' + n.soort.naam;
          raakSpeler(n.x);
          n.doorrennen = 1.5;
        }
      }
    }

    // Een klap of schot op een roofdier. Geeft true als er een geraakt is.
    function raakRoofdier(x, d, bereik) {
      for (let i = roofdieren.length - 1; i >= 0; i--) {
        const n = roofdieren[i];
        if (Math.abs(n.x - x) < bereik && Math.abs(diepteNaarY(n.d) - diepteNaarY(d)) < 40) {
          n.leven--;
          n.schud = 0.3;
          if (n.leven <= 0) {
            roofdieren.splice(i, 1);
            munten += n.soort.beloning;
            toonMelding(`${n.soort.naam} verslagen! +${n.soort.beloning} munten`, n.x, diepteNaarY(n.d) - 160, '#ffd166');
          } else {
            toonMelding(`Nog ${n.leven} klappen`, n.x, diepteNaarY(n.d) - 160, '#fff');
          }
          return true;
        }
      }
      return false;
    }

    // Levensbalkje boven een roofdier
    function tekenRoofdierLeven(n) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-30, -150, 60, 8);
      ctx.fillStyle = '#e63946';
      ctx.fillRect(-30, -150, 60 * n.leven / n.soort.leven, 8);
    }

    // Sabeltandtijger: laag, snel, oranje met strepen en twee lange hoektanden.
    function tekenSabeltandtijger(n) {
      ctx.save();
      ctx.scale(n.richting, 1);
      if (n.schud > 0) ctx.translate(Math.sin(n.schud * 60) * 5, 0);
      const zwaai = Math.sin(n.stap) * 16;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 2, 60, 8, 0, 0, Math.PI * 2); ctx.fill();
      // Poten
      ctx.strokeStyle = '#c47a3a';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-40 + zwaai, 0); ctx.lineTo(-34, -32);
      ctx.moveTo(-26 - zwaai, 0); ctx.lineTo(-26, -32);
      ctx.moveTo(26 + zwaai, 0); ctx.lineTo(28, -32);
      ctx.moveTo(40 - zwaai, 0); ctx.lineTo(36, -32);
      ctx.stroke();
      // Lijf
      ctx.fillStyle = '#d98b45';
      ctx.beginPath(); ctx.ellipse(0, -42, 50, 20, 0, 0, Math.PI * 2); ctx.fill();
      // Strepen
      ctx.strokeStyle = '#7a4a1e';
      ctx.lineWidth = 4;
      for (let i = -30; i <= 20; i += 12) { ctx.beginPath(); ctx.moveTo(i, -60); ctx.lineTo(i - 4, -38); ctx.stroke(); }
      // Staart
      ctx.strokeStyle = '#d98b45';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-48, -48); ctx.quadraticCurveTo(-80, -70 + Math.sin(n.stap) * 8, -70, -30); ctx.stroke();
      // Kop
      ctx.fillStyle = '#d98b45';
      ctx.beginPath(); ctx.arc(56, -52, 20, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5e6c8';
      ctx.beginPath(); ctx.ellipse(64, -44, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
      // Oren
      ctx.fillStyle = '#c47a3a';
      ctx.beginPath(); ctx.moveTo(44, -66); ctx.lineTo(48, -80); ctx.lineTo(56, -68); ctx.fill();
      ctx.beginPath(); ctx.moveTo(60, -70); ctx.lineTo(68, -80); ctx.lineTo(70, -66); ctx.fill();
      // Ogen en neus
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(60, -56, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(61, -56, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(72, -46, 2.5, 0, Math.PI * 2); ctx.fill();
      // Sabeltanden
      ctx.fillStyle = '#fff8e8';
      ctx.beginPath(); ctx.moveTo(58, -38); ctx.lineTo(60, -14); ctx.lineTo(64, -38); ctx.fill();
      ctx.beginPath(); ctx.moveTo(68, -38); ctx.lineTo(72, -14); ctx.lineTo(74, -38); ctx.fill();
      ctx.restore();
      tekenRoofdierLeven(n);
    }

    // Holenbeer: enorm, donkerbruin en taai. Traag, maar hij houdt vijf klappen uit.
    function tekenHolenbeer(n) {
      ctx.save();
      ctx.scale(n.richting, 1);
      if (n.schud > 0) ctx.translate(Math.sin(n.schud * 60) * 5, 0);
      const zwaai = Math.sin(n.stap) * 10;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 2, 66, 10, 0, 0, Math.PI * 2); ctx.fill();
      // Poten met klauwen
      ctx.strokeStyle = '#3a2416';
      ctx.lineWidth = 16;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-40 + zwaai, 0); ctx.lineTo(-36, -50);
      ctx.moveTo(-18 - zwaai, 0); ctx.lineTo(-20, -50);
      ctx.moveTo(22 + zwaai, 0); ctx.lineTo(22, -50);
      ctx.moveTo(42 - zwaai, 0); ctx.lineTo(38, -50);
      ctx.stroke();
      ctx.fillStyle = '#e8dcc8';
      for (const px of [-40 + zwaai, -18 - zwaai, 22 + zwaai, 42 - zwaai]) {
        for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(px + k * 5 + 4, 0); ctx.lineTo(px + k * 5 + 6, 6); ctx.lineTo(px + k * 5 + 8, 0); ctx.fill(); }
      }
      // Lijf, hoog en rond
      const vacht = ctx.createLinearGradient(0, -120, 0, -40);
      vacht.addColorStop(0, '#5a3a24');
      vacht.addColorStop(1, '#2e1a0e');
      ctx.fillStyle = vacht;
      ctx.beginPath(); ctx.ellipse(0, -75, 66, 42, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-10, -105, 40, 22, 0, 0, Math.PI * 2); ctx.fill();
      // Kop
      ctx.fillStyle = '#4a2e1c';
      ctx.beginPath(); ctx.arc(64, -88, 26, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a5a40';
      ctx.beginPath(); ctx.ellipse(78, -80, 14, 10, 0, 0, Math.PI * 2); ctx.fill();
      // Ronde oren
      ctx.fillStyle = '#4a2e1c';
      ctx.beginPath(); ctx.arc(48, -108, 8, 0, Math.PI * 2); ctx.arc(74, -110, 8, 0, Math.PI * 2); ctx.fill();
      // Oog, neus, open bek met tanden
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(68, -94, 3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(88, -82, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5a1a1a';
      ctx.beginPath(); ctx.moveTo(70, -72); ctx.lineTo(92, -72); ctx.lineTo(80, -60); ctx.fill();
      ctx.fillStyle = '#fff8e8';
      ctx.beginPath(); ctx.moveTo(72, -72); ctx.lineTo(74, -66); ctx.lineTo(76, -72); ctx.fill();
      ctx.beginPath(); ctx.moveTo(84, -72); ctx.lineTo(86, -66); ctx.lineTo(88, -72); ctx.fill();
      ctx.restore();
      tekenRoofdierLeven(n);
    }

    function tekenNeushoorn(n) {
      ctx.save();
      ctx.scale(n.richting, 1);
      if (n.schud > 0) ctx.translate(Math.sin(n.schud * 60) * 5, 0);
      const zwaai = Math.sin(n.stap) * 10;

      // Schaduw
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.ellipse(0, 2, 70, 10, 0, 0, Math.PI * 2); ctx.fill();

      // Poten, dik en kort
      ctx.strokeStyle = '#5a4a3c';
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-40 + zwaai, 0); ctx.lineTo(-38, -40);
      ctx.moveTo(-20 - zwaai, 0); ctx.lineTo(-22, -40);
      ctx.moveTo(25 + zwaai, 0); ctx.lineTo(24, -40);
      ctx.moveTo(45 - zwaai, 0); ctx.lineTo(42, -40);
      ctx.stroke();

      // Lijf met dikke vacht
      const vacht = ctx.createLinearGradient(0, -100, 0, -30);
      vacht.addColorStop(0, '#8a6a4a');
      vacht.addColorStop(1, '#4a3628');
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(0, -65, 70, 38, 0, 0, Math.PI * 2);
      ctx.fill();
      // Bult op de schouders
      ctx.beginPath(); ctx.ellipse(25, -95, 30, 18, 0, 0, Math.PI * 2); ctx.fill();
      // Hangende wolplukken langs de buik
      ctx.fillStyle = '#6a503a';
      for (let i = -55; i <= 50; i += 14) {
        ctx.beginPath();
        ctx.moveTo(i, -40); ctx.lineTo(i + 5, -22 + (i % 28 === 0 ? 4 : 0)); ctx.lineTo(i + 12, -40);
        ctx.fill();
      }
      // Kop
      ctx.fillStyle = '#6a503a';
      ctx.beginPath();
      ctx.ellipse(72, -60, 32, 24, -0.2, 0, Math.PI * 2);
      ctx.fill();
      // Grote voorhoorn en kleine achterhoorn
      ctx.fillStyle = '#e8dcc8';
      ctx.beginPath(); ctx.moveTo(88, -70); ctx.quadraticCurveTo(100, -110, 118, -130); ctx.lineTo(104, -68); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(66, -82); ctx.lineTo(74, -104); ctx.lineTo(82, -80); ctx.closePath(); ctx.fill();
      // Oor, oog, neusgat
      ctx.fillStyle = '#4a3628';
      ctx.beginPath(); ctx.ellipse(50, -88, 7, 11, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(70, -68, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e63946';
      ctx.beginPath(); ctx.arc(70, -68, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#3a2a1e';
      ctx.beginPath(); ctx.arc(98, -52, 3, 0, Math.PI * 2); ctx.fill();
      // Staart
      ctx.strokeStyle = '#4a3628';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(-66, -75); ctx.quadraticCurveTo(-82, -60 + Math.sin(n.stap) * 6, -76, -40); ctx.stroke();

      ctx.restore();

      tekenRoofdierLeven(n);
    }

    function tekenEverzwijn(x, y, richting, stap) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(richting, 1);

      // Schaduw
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(0, 2, 34, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pootjes die bewegen
      const zwaai = Math.sin(stap) * 8;
      ctx.strokeStyle = '#3a2a1e';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-18 + zwaai, 0); ctx.lineTo(-18, -22);
      ctx.moveTo(-8 - zwaai, 0); ctx.lineTo(-10, -22);
      ctx.moveTo(12 + zwaai, 0); ctx.lineTo(12, -22);
      ctx.moveTo(22 - zwaai, 0); ctx.lineTo(20, -22);
      ctx.stroke();

      // Lijf
      const vacht = ctx.createLinearGradient(0, -45, 0, -15);
      vacht.addColorStop(0, '#5a4030');
      vacht.addColorStop(1, '#2e2018');
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(0, -32, 32, 18, 0, 0, Math.PI * 2);
      ctx.fill();
      // Borstelige rug
      ctx.fillStyle = '#241810';
      for (let i = -24; i <= 16; i += 8) {
        ctx.beginPath();
        ctx.moveTo(i, -46); ctx.lineTo(i + 3, -56); ctx.lineTo(i + 7, -46);
        ctx.fill();
      }
      // Kop met snuit
      ctx.fillStyle = '#4a3324';
      ctx.beginPath();
      ctx.ellipse(32, -30, 16, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7a5a48';
      ctx.beginPath();
      ctx.ellipse(46, -26, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      // Slagtanden
      ctx.strokeStyle = '#f0e6d0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(42, -22); ctx.lineTo(48, -32);
      ctx.stroke();
      // Oor en oog
      ctx.fillStyle = '#3a2a1e';
      ctx.beginPath();
      ctx.moveTo(26, -40); ctx.lineTo(30, -52); ctx.lineTo(36, -40);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(36, -33, 2.5, 0, Math.PI * 2);
      ctx.fill();
      // Staartje
      ctx.strokeStyle = '#3a2a1e';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-30, -38);
      ctx.quadraticCurveTo(-42, -44 + Math.sin(stap) * 4, -40, -30);
      ctx.stroke();

      ctx.restore();
    }

    // ---------- Stenen oprapen ----------

    function raapStenenOp() {
      const stenenKlaar = missies[2].voortgang >= missies[2].doel;
      if (stenenKlaar) return;
      for (let i = stenen.length - 1; i >= 0; i--) {
        const st = stenen[i];
        if (Math.abs(st.x - speler.x) < kleding().steenBereik && Math.abs(diepteNaarY(st.d) - spelerY()) < 16) {
          stenen.splice(i, 1);
          missieVoortgang('stenen', speler.x, spelerY() - 170);
        }
      }
    }

    // ---------- Lucht ----------

    // Vaste sterren, zodat ze niet elke frame verspringen. Elke ster twinkelt in zijn eigen tempo.
    const sterren = [];
    for (let i = 0; i < 200; i++) {
      sterren.push({
        x: Math.random(),
        y: Math.random() * 0.65,
        grootte: 0.5 + Math.random() * 1.8,
        tempo: 1 + Math.random() * 3,
        fase: Math.random() * Math.PI * 2,
      });
    }

    function tekenLucht() {
      const b = canvas.width, h = canvas.height;
      const d = daglicht(), sch = schemering();

      // Nachtkleuren mengen met dagkleuren, en daar de oranje schemering overheen.
      let boven = mengKleur('#02030f', '#3b8fd9', d);
      let midden = mengKleur('#0d1440', '#8ec5ea', d);
      let horizon = mengKleur('#3a2f5c', '#d7ecf7', d);
      midden = mengKleur(rgbNaarHex(midden), '#e07a3a', sch * 0.5);
      horizon = mengKleur(rgbNaarHex(horizon), '#ffb347', sch * 0.85);

      const lucht = ctx.createLinearGradient(0, 0, 0, h * 0.75);
      lucht.addColorStop(0, boven);
      lucht.addColorStop(0.6, midden);
      lucht.addColorStop(1, horizon);
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, b, h);

      // Melkweg: een vage lichte band schuin over de hemel.
      ctx.save();
      ctx.translate(b * 0.5, h * 0.3);
      ctx.rotate(-0.4);
      const melkweg = ctx.createLinearGradient(0, -h * 0.12, 0, h * 0.12);
      melkweg.addColorStop(0, 'rgba(180,190,255,0)');
      melkweg.addColorStop(0.5, 'rgba(180,190,255,0.10)');
      melkweg.addColorStop(1, 'rgba(180,190,255,0)');
      ctx.fillStyle = melkweg;
      ctx.fillRect(-b, -h * 0.12, b * 2, h * 0.24);
      ctx.restore();

      // Sterren vervagen zodra het licht wordt.
      const sterLicht = 1 - d;
      if (sterLicht > 0.02) {
        for (const s of sterren) {
          const helderheid = 0.5 + 0.5 * Math.sin(tijd * s.tempo + s.fase);
          ctx.fillStyle = `rgba(255,255,255,${(0.3 + 0.7 * helderheid) * sterLicht})`;
          ctx.beginPath();
          ctx.arc(s.x * b, s.y * h, s.grootte, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // De zon staat overdag aan de hemel, de maan 's nachts. Beide volgen een boog van links naar rechts.
      const zon = hemelPositie(dagTijd);
      const maan = hemelPositie((dagTijd + 0.5) % 1);
      if (maan) tekenMaan(maan.x, maan.y, 42);
      if (zon) tekenZon(zon.x, zon.y, 46);
    }

    // Plek van een hemellichaam dat opkomt bij t = 0.25 en ondergaat bij t = 0.75. Buiten die tijd: null.
    function hemelPositie(t) {
      if (t < 0.22 || t > 0.78) return null;
      const b = canvas.width, h = canvas.height;
      const voortgang = (t - 0.25) / 0.5; // 0 bij opkomst, 1 bij ondergang
      return {
        x: b * (0.08 + 0.84 * voortgang),
        y: h * 0.72 - Math.sin(voortgang * Math.PI) * h * 0.6,
      };
    }

    function rgbNaarHex(rgb) {
      const n = rgb.match(/\d+/g).map(Number);
      return '#' + n.map(v => v.toString(16).padStart(2, '0')).join('');
    }

    function tekenZon(x, y, r) {
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 5);
      gloed.addColorStop(0, 'rgba(255,230,150,0.45)');
      gloed.addColorStop(1, 'rgba(255,230,150,0)');
      ctx.fillStyle = gloed;
      ctx.beginPath();
      ctx.arc(x, y, r * 5, 0, Math.PI * 2);
      ctx.fill();

      const kern = ctx.createRadialGradient(x, y, r * 0.2, x, y, r);
      kern.addColorStop(0, '#fffbe0');
      kern.addColorStop(1, '#ffcc33');
      ctx.fillStyle = kern;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    function tekenMaan(x, y, r) {
      // Zachte gloed rond de maan
      const gloed = ctx.createRadialGradient(x, y, r, x, y, r * 4);
      gloed.addColorStop(0, 'rgba(255,245,200,0.25)');
      gloed.addColorStop(1, 'rgba(255,245,200,0)');
      ctx.fillStyle = gloed;
      ctx.beginPath();
      ctx.arc(x, y, r * 4, 0, Math.PI * 2);
      ctx.fill();

      // De maan zelf, iets donkerder aan de onderkant
      const maan = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
      maan.addColorStop(0, '#fffbe6');
      maan.addColorStop(1, '#d9d3a0');
      ctx.fillStyle = maan;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // Kraters
      ctx.fillStyle = 'rgba(150,140,100,0.45)';
      for (const k of [[-0.3, -0.2, 0.18], [0.25, 0.1, 0.13], [0.0, 0.45, 0.1], [-0.45, 0.35, 0.08]]) {
        ctx.beginPath();
        ctx.arc(x + k[0] * r, y + k[1] * r, k[2] * r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ---------- Landschap ----------

    // Een golvende heuvellijn tekenen. De vorm hangt af van een "zaad" zodat elke laag anders is.
    // factor bepaalt hoe hard de laag meeschuift met de camera: verre lagen bewegen langzamer.
    function heuvelPad(basisY, hoogte, zaad, factor) {
      const b = canvas.width, h = canvas.height;
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= b; x += 10) {
        const t = (x + camera.x * factor) / b;
        const y = basisY
          + Math.sin(t * 5 + zaad) * hoogte
          + Math.sin(t * 13 + zaad * 2) * hoogte * 0.3;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(b, h);
      ctx.closePath();
    }

    function tekenHeuvels() {
      const h = canvas.height;
      // Verre bergen in blauwgrijs (mist), daarna steeds dichterbij en donkerder.
      ctx.fillStyle = '#2a2f55';
      heuvelPad(h * 0.55, h * 0.08, 1.0, 0.1);
      ctx.fill();
      ctx.fillStyle = '#1b2a3a';
      heuvelPad(h * 0.64, h * 0.05, 2.7, 0.25);
      ctx.fill();
      tekenPalmen(h * 0.66, 2.7, 0.55, 0.25);
      ctx.fillStyle = '#12261a';
      heuvelPad(h * 0.74, h * 0.035, 4.1, 0.5);
      ctx.fill();
      tekenPalmen(h * 0.77, 4.1, 0.9, 0.5);
    }

    // Prehistorische bomen: kale stammen met een bosje palmbladeren erop.
    // Ze staan verspreid over de hele wereld en schuiven mee met hun heuvellaag.
    function tekenPalmen(basisY, zaad, schaal, factor) {
      const b = canvas.width;
      for (let px = 40; px < wereldBreedte * factor + b; px += 160) {
        const x = px - camera.x * factor;
        if (x < -80 || x > b + 80) continue;
        const hoogte = (60 + ((px * 0.37 + zaad * 100) % 40)) * schaal;
        tekenPalm(x, basisY, hoogte, schaal, px);
      }
    }

    function tekenPalm(x, y, hoogte, schaal, fase) {
      ctx.strokeStyle = '#0d1a10';
      ctx.lineWidth = 5 * schaal;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 10 * schaal, y - hoogte * 0.6, x, y - hoogte);
      ctx.stroke();
      // Bladeren die zachtjes wiegen in de wind
      const wind = Math.sin(tijd * 1.5 + fase) * 0.08;
      ctx.fillStyle = '#0d1a10';
      for (let i = 0; i < 6; i++) {
        const hoek = (i / 6) * Math.PI * 2 + wind;
        ctx.beginPath();
        ctx.ellipse(x + Math.cos(hoek) * 14 * schaal, y - hoogte + Math.sin(hoek) * 8 * schaal,
          22 * schaal, 6 * schaal, hoek, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Vaste plekken voor grassprietjes en stenen over de hele wereld, zodat ze niet flikkeren.
    const sprietjes = [];
    for (let i = 0; i < 700; i++) sprietjes.push({ x: Math.random() * wereldBreedte, d: Math.random(), l: 6 + Math.random() * 10 });
    const stenen = [];
    const aantalStenen = 30;

    // Een steen op een willekeurige plek op de grond, maar niet in het meer.
    function maakSteen() {
      let steen;
      do {
        steen = { x: 60 + Math.random() * (wereldBreedte - 120), d: 0.05 + Math.random() * 0.9, r: 3 + Math.random() * 6 };
      } while (inMeer(steen.x, steen.d, 30));
      return steen;
    }

    function tekenGrond() {
      const b = canvas.width, h = canvas.height;
      const top = h * 0.8;
      const grond = ctx.createLinearGradient(0, top, 0, h);
      grond.addColorStop(0, '#3f6b2a');
      grond.addColorStop(0.3, '#2f5220');
      grond.addColorStop(1, '#1d3314');
      ctx.fillStyle = grond;
      ctx.fillRect(0, top, b, h - top);

      // Zachte lichte rand bovenaan de grond, waar het maanlicht op valt
      ctx.fillStyle = 'rgba(160,200,120,0.25)';
      ctx.fillRect(0, top, b, 3);

      // Stenen (verder weg kleiner)
      ctx.fillStyle = '#4a4a44';
      for (const st of stenen) {
        const x = schermX(st.x);
        if (x < -20 || x > b + 20) continue;
        const r = st.r * schaalOpDiepte(st.d);
        ctx.beginPath();
        ctx.ellipse(x, diepteNaarY(st.d), r * 1.4, r, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Grassprietjes die wiegen in de wind
      ctx.strokeStyle = '#5e9a3a';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const sp of sprietjes) {
        const x = schermX(sp.x), y = diepteNaarY(sp.d);
        if (x < -20 || x > b + 20) continue;
        const buig = Math.sin(tijd * 2 + sp.x * 0.05) * 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + buig, y - sp.l * 0.6, x + buig * 2, y - sp.l);
        ctx.stroke();
      }
    }

    // ---------- Meer en vissen ----------

    // Het meer ligt midden in de wereld. x en rx zijn in pixels, d en rd in diepte (0 tot 1).
    const meer = { x: 2500, d: 0.5, rx: 280, rd: 0.34 };

    // Waar het meer op het scherm staat: middelpunt en stralen van de ellips.
    function meerScherm() {
      return { mx: schermX(meer.x), my: diepteNaarY(meer.d), rx: meer.rx, ry: meer.rd * 0.2 * canvas.height };
    }

    // Ligt een plek in de wereld in het water? Met marge kijken we ook een stukje rond de oever.
    function inMeer(x, d, marge) {
      const ry = meer.rd * 0.2 * canvas.height;
      const nx = (x - meer.x) / (meer.rx + marge);
      const ny = (diepteNaarY(d) - diepteNaarY(meer.d)) / (ry + marge);
      return nx * nx + ny * ny < 1;
    }

    // Staat de speler aan de oever?
    function bijMeer() {
      return inMeer(speler.x, speler.d, 70);
    }

    // De stenen kunnen nu pas gemaakt worden, want ze mogen niet in het meer liggen.
    while (stenen.length < aantalStenen) stenen.push(maakSteen());

    // Vissen zwemmen heen en weer binnen het meer. x is een fractie (0 = linkerkant, 1 = rechterkant).
    const visKleuren = ['#ff8c42', '#4ecdc4', '#ffd166', '#c084fc', '#7bd389', '#f47fa4', '#5dade2', '#f0e68c'];
    const aantalVissen = 8;
    const vissen = [];

    function maakVis() {
      return {
        x: 0.15 + Math.random() * 0.7,
        y: Math.random(),
        snelheid: (Math.random() < 0.5 ? 1 : -1) * (0.12 + Math.random() * 0.22),
        kleur: visKleuren[Math.floor(Math.random() * visKleuren.length)],
        grootte: 0.7 + Math.random() * 0.6,
      };
    }
    while (vissen.length < aantalVissen) vissen.push(maakVis());

    function updateVissen(dt) {
      for (const vis of vissen) {
        vis.x += vis.snelheid * dt;
        // Aan de rand van het meer keert de vis om.
        if (vis.x > 0.9 || vis.x < 0.1) vis.snelheid = -vis.snelheid;
      }
    }

    function tekenMeer() {
      const { mx, my, rx, ry } = meerScherm();
      if (mx + rx + 40 < 0 || mx - rx - 40 > canvas.width) return;

      // Modderige oever rond het water
      ctx.fillStyle = '#4a3d2a';
      ctx.beginPath();
      ctx.ellipse(mx, my, rx + 14, ry + 8, 0, 0, Math.PI * 2);
      ctx.fill();
