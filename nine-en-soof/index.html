<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nine-en-soof</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    let tijd = 0;

    function update(dt) {
      tijd += dt;
    }

    // Tekent een kat met zijn voeten op (x, y). Met schaal maak je hem groter of kleiner.
    function tekenKat(x, y, schaal) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      const vacht = '#6b7f5a';
      const vachtDonker = '#55674a';
      const buik = '#e8e4d9';
      const roze = '#e9a0a8';

      // staart, zwaait heen en weer
      const zwaai = Math.sin(tijd * 2) * 0.35;
      ctx.strokeStyle = vacht;
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(38, -18);
      ctx.quadraticCurveTo(80, -30 + zwaai * 40, 72, -80 + zwaai * 30);
      ctx.stroke();

      // lijf
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(0, -38, 42, 44, 0, 0, Math.PI * 2);
      ctx.fill();

      // lichte buik
      ctx.fillStyle = buik;
      ctx.beginPath();
      ctx.ellipse(0, -30, 24, 30, 0, 0, Math.PI * 2);
      ctx.fill();

      // voorpootjes
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(-18, -8, 12, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(18, -8, 12, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // oren
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.moveTo(-34, -96);
      ctx.lineTo(-24, -130);
      ctx.lineTo(-6, -104);
      ctx.closePath();
      ctx.moveTo(34, -96);
      ctx.lineTo(24, -130);
      ctx.lineTo(6, -104);
      ctx.closePath();
      ctx.fill();

      // binnenkant van de oren
      ctx.fillStyle = roze;
      ctx.beginPath();
      ctx.moveTo(-29, -99);
      ctx.lineTo(-24, -120);
      ctx.lineTo(-14, -104);
      ctx.closePath();
      ctx.moveTo(29, -99);
      ctx.lineTo(24, -120);
      ctx.lineTo(14, -104);
      ctx.closePath();
      ctx.fill();

      // kop
      ctx.fillStyle = vacht;
      ctx.beginPath();
      ctx.ellipse(0, -92, 40, 34, 0, 0, Math.PI * 2);
      ctx.fill();

      // wangen
      ctx.fillStyle = buik;
      ctx.beginPath();
      ctx.ellipse(-13, -80, 14, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(13, -80, 14, 11, 0, 0, Math.PI * 2);
      ctx.fill();

      // ogen, die af en toe knipperen
      const knippert = Math.sin(tijd * 1.3) > 0.97;
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 3;
      if (knippert) {
        ctx.beginPath();
        ctx.moveTo(-22, -98);
        ctx.lineTo(-8, -98);
        ctx.moveTo(8, -98);
        ctx.lineTo(22, -98);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath();
        ctx.ellipse(-15, -99, 7, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(15, -99, 7, 9, 0, 0, Math.PI * 2);
        ctx.fill();
        // lichtpuntjes in de ogen
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-13, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(17, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // neusje
      ctx.fillStyle = roze;
      ctx.beginPath();
      ctx.moveTo(-5, -82);
      ctx.lineTo(5, -82);
      ctx.lineTo(0, -76);
      ctx.closePath();
      ctx.fill();

      // mondje
      ctx.strokeStyle = '#2b2b2b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -76);
      ctx.lineTo(0, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(-5, -68, -10, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(5, -68, 10, -72);
      ctx.stroke();

      // snorharen
      ctx.strokeStyle = vachtDonker;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, -80); ctx.lineTo(-44, -86);
      ctx.moveTo(-14, -77); ctx.lineTo(-45, -75);
      ctx.moveTo(14, -80); ctx.lineTo(44, -86);
      ctx.moveTo(14, -77); ctx.lineTo(45, -75);
      ctx.stroke();

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      tekenKat(canvas.width / 2, canvas.height / 2 + 60, 1);
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
