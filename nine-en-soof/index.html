<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nine-en-soof</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; color: #111; font-family: sans-serif; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    let grondY = 0;
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      grondY = canvas.height - 90;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    let tijd = 0;

    // ---------- tekenen in cartoon-stijl ----------
    // Alles krijgt een dikke donkere lijn eromheen en randen die een beetje scheef
    // zijn, zodat het lijkt alsof het met de hand getekend is.

    const INKT = '#3b2d23';

    // Altijd dezelfde "toevallige" waarde voor hetzelfde nummer, zodat het beeld niet trilt.
    function ruis(n) {
      return (Math.sin(n * 127.1) * 43758.5453) % 1;
    }

    function inktLijn(dikte) {
      ctx.strokeStyle = INKT;
      ctx.lineWidth = dikte;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
    }

    // Vult het pad dat je net getekend hebt en zet er een inktlijn omheen.
    function vulEnOmlijn(kleur, dikte) {
      ctx.fillStyle = kleur;
      ctx.fill();
      inktLijn(dikte);
      ctx.stroke();
    }

    // Een ovaal met een wiebelige rand, alsof hij met de hand getekend is.
    function schetsOvaal(x, y, rx, ry, zaad) {
      const stappen = 26;
      ctx.beginPath();
      for (let i = 0; i <= stappen; i++) {
        const hoek = (i / stappen) * Math.PI * 2;
        const wiebel = 1 + ruis(zaad + i) * 0.04;
        const px = x + Math.cos(hoek) * rx * wiebel;
        const py = y + Math.sin(hoek) * ry * wiebel;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // Een blok met ronde hoeken en scheve randen.
    function schetsBlok(x, y, breedte, hoogte, zaad) {
      const r = 14;
      const w = (n) => ruis(zaad + n) * 4;
      ctx.beginPath();
      ctx.moveTo(x + r, y + w(1));
      ctx.lineTo(x + breedte - r, y + w(2));
      ctx.quadraticCurveTo(x + breedte, y, x + breedte + w(3), y + r);
      ctx.lineTo(x + breedte + w(4), y + hoogte - r);
      ctx.quadraticCurveTo(x + breedte, y + hoogte, x + breedte - r, y + hoogte);
      ctx.lineTo(x + r, y + hoogte);
      ctx.quadraticCurveTo(x, y + hoogte, x + w(5), y + hoogte - r);
      ctx.lineTo(x + w(6), y + r);
      ctx.quadraticCurveTo(x, y, x + r, y + w(1));
      ctx.closePath();
    }

    // ---------- de kat ----------

    // De kat. x en y zijn het midden van zijn voeten.
    const kat = {
      x: 120,
      y: 0,
      snelheidX: 0,
      snelheidY: 0,
      breedte: 70,
      hoogte: 130,
      opGrond: true,
      aanHetSpringen: false, // staat aan zolang het vasthouden van de spatie nog meetelt
      vasthoudTijd: 0,       // hoe lang je de spatie al vasthoudt tijdens deze sprong
      powerjump: false,      // lang genoeg vastgehouden voor de grote sprong
    };

    // Tekent een kat met zijn voeten op (x, y). Met schaal maak je hem groter of kleiner.
    function tekenKat(x, y, schaal) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      const vacht = '#f49cb9';
      const buik = '#fdeef3';
      const roze = '#d9657f';

      // staart, zwaait heen en weer
      const zwaai = Math.sin(tijd * 2) * 0.35;
      ctx.beginPath();
      ctx.moveTo(38, -18);
      ctx.quadraticCurveTo(80, -30 + zwaai * 40, 72, -80 + zwaai * 30);
      inktLijn(22);
      ctx.stroke();
      ctx.strokeStyle = vacht;
      ctx.lineWidth = 14;
      ctx.stroke();

      // lijf
      schetsOvaal(0, -38, 42, 44, 10);
      vulEnOmlijn(vacht, 5);

      // lichte buik
      schetsOvaal(0, -30, 24, 30, 20);
      ctx.fillStyle = buik;
      ctx.fill();

      // voorpootjes
      schetsOvaal(-18, -8, 13, 9, 30);
      vulEnOmlijn(vacht, 5);
      schetsOvaal(18, -8, 13, 9, 40);
      vulEnOmlijn(vacht, 5);

      // oren
      ctx.beginPath();
      ctx.moveTo(-34, -96);
      ctx.quadraticCurveTo(-32, -126, -24, -130);
      ctx.quadraticCurveTo(-14, -120, -6, -104);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);
      ctx.beginPath();
      ctx.moveTo(34, -96);
      ctx.quadraticCurveTo(32, -126, 24, -130);
      ctx.quadraticCurveTo(14, -120, 6, -104);
      ctx.closePath();
      vulEnOmlijn(vacht, 5);

      // binnenkant van de oren
      ctx.beginPath();
      ctx.moveTo(-29, -101);
      ctx.lineTo(-24, -121);
      ctx.lineTo(-14, -105);
      ctx.closePath();
      ctx.fillStyle = roze;
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(29, -101);
      ctx.lineTo(24, -121);
      ctx.lineTo(14, -105);
      ctx.closePath();
      ctx.fill();

      // kop
      schetsOvaal(0, -92, 40, 34, 50);
      vulEnOmlijn(vacht, 5);

      // koksmuts: eerst de bollen bovenop, daarna de band eroverheen
      ctx.beginPath();
      ctx.arc(-23, -146, 19, Math.PI * 0.75, Math.PI * 1.85);
      ctx.arc(0, -156, 23, Math.PI * 1.15, Math.PI * 1.9);
      ctx.arc(23, -146, 19, Math.PI * 1.1, Math.PI * 0.35);
      ctx.closePath();
      vulEnOmlijn('#fffdf7', 5);

      schetsBlok(-32, -136, 64, 22, 12);
      vulEnOmlijn('#ffffff', 5);

      // twee plooitjes in de band
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(-11, -133);
      ctx.lineTo(-11, -117);
      ctx.moveTo(11, -133);
      ctx.lineTo(11, -117);
      ctx.stroke();

      // wangen
      schetsOvaal(-13, -80, 14, 11, 60);
      ctx.fillStyle = buik;
      ctx.fill();
      schetsOvaal(13, -80, 14, 11, 70);
      ctx.fill();

      // ogen, die af en toe knipperen
      const knippert = Math.sin(tijd * 1.3) > 0.97;
      if (knippert) {
        inktLijn(4);
        ctx.beginPath();
        ctx.moveTo(-22, -99);
        ctx.quadraticCurveTo(-15, -95, -8, -99);
        ctx.moveTo(8, -99);
        ctx.quadraticCurveTo(15, -95, 22, -99);
        ctx.stroke();
      } else {
        ctx.fillStyle = INKT;
        schetsOvaal(-15, -99, 7, 9, 80);
        ctx.fill();
        schetsOvaal(15, -99, 7, 9, 90);
        ctx.fill();
        // lichtpuntjes in de ogen
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-13, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(17, -102, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // neusje
      ctx.beginPath();
      ctx.moveTo(-6, -83);
      ctx.lineTo(6, -83);
      ctx.lineTo(0, -76);
      ctx.closePath();
      vulEnOmlijn(roze, 3);

      // mondje
      inktLijn(3);
      ctx.beginPath();
      ctx.moveTo(0, -76);
      ctx.lineTo(0, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(-5, -67, -11, -72);
      ctx.moveTo(0, -72);
      ctx.quadraticCurveTo(5, -67, 11, -72);
      ctx.stroke();

      // snorharen
      inktLijn(2.5);
      ctx.beginPath();
      ctx.moveTo(-15, -81); ctx.quadraticCurveTo(-30, -86, -46, -88);
      ctx.moveTo(-15, -77); ctx.quadraticCurveTo(-31, -77, -47, -74);
      ctx.moveTo(15, -81); ctx.quadraticCurveTo(30, -86, 46, -88);
      ctx.moveTo(15, -77); ctx.quadraticCurveTo(31, -77, 47, -74);
      ctx.stroke();

      ctx.restore();
    }

    // ---------- het level ----------

    // Het level is veel breder dan het scherm. De camera schuift mee met de kat.
    const LEVELBREEDTE = 4250;
    let camera = 0;

    // Rotsblokken waar je tegenaan botst en bovenop kunt staan.
    // Lage blokken haal je met een tikje, hoge alleen met een powerjump,
    // en de trap halverwege klim je blok voor blok omhoog.
    const obstakels = [
      { x: 380, breedte: 70, hoogte: 50 },
      { x: 620, breedte: 50, hoogte: 100 },
      { x: 860, breedte: 110, hoogte: 50 },
      { x: 1150, breedte: 60, hoogte: 130 },
      { x: 1330, breedte: 60, hoogte: 130 },
      { x: 1600, breedte: 160, hoogte: 60 },
      { x: 1830, breedte: 60, hoogte: 150 },
      { x: 2050, breedte: 90, hoogte: 90 },
      { x: 2260, breedte: 70, hoogte: 110 },
      { x: 2420, breedte: 70, hoogte: 155 },
      { x: 2580, breedte: 70, hoogte: 200 },
      { x: 2740, breedte: 140, hoogte: 245 },
      { x: 2980, breedte: 60, hoogte: 110 },
      { x: 3180, breedte: 80, hoogte: 55 },
      { x: 3380, breedte: 60, hoogte: 140 },
    ];

    // De finishvlag aan het eind van het level.
    const finish = { x: 3600, hoogte: 260 };

    // ---------- de keuken ----------

    // Voorbij de finishvlag staat het aanrecht. Daar druk je op T en rolt de kat
    // sushi van alles wat hij onderweg heeft opgeraapt.
    const keuken = { x: 3760, breedte: 330 };
    const KOOKPLEK = keuken.x + 70;   // hier gaat de kat staan zodra hij begint
    const PLANK_X = keuken.x + 225;   // het midden van de snijplank
    const AANRECHT_H = 86;

    let kookTijd = -1;        // -1 zolang hij nog niet kookt, anders hoe lang al
    let inDeKeuken = false;   // staat de kat bij het aanrecht?

    // Het koken gaat in drie stappen. Hoe meer je hebt opgeraapt, hoe langer
    // het vliegen duurt, dus rekenen we de tijden elke keer opnieuw uit.
    function kookFases() {
      const n = Math.max(1, aantalGepakt());
      const vliegen = (n - 1) * 0.22 + 0.45;  // ingrediënten vallen op de plank
      const hakken = vliegen + 1.0;           // het mes gaat op en neer
      const rollen = hakken + 0.9;            // de rolletjes komen tevoorschijn
      return { vliegen, hakken, rollen };
    }

    // Hoeveel rolletjes het worden: met alles erbij drie, met bijna niets één.
    function aantalRollen() {
      return klem(Math.round(aantalGepakt() * 0.6), 1, 3);
    }

    let gehaald = false;   // is de sushi klaar?
    let speeltijd = 0;     // hoe lang je al onderweg bent

    // ---------- de sushi-ingrediënten ----------

    // Aan het eind maakt de kat sushi, maar dan moet hij onderweg wel alles
    // oprapen. hoogte is hoe hoog het ingrediënt boven de grond zweeft, dus 0
    // ligt op de grond. De hoge liggen op een rotsblok of haal je met een
    // powerjump.
    const INGREDIENTEN = [
      { soort: 'rijst',     naam: 'rijst',     x: 395,  hoogte: 110 },
      { soort: 'nori',      naam: 'zeewier',   x: 650,  hoogte: 175 },
      { soort: 'zalm',      naam: 'zalm',      x: 1680, hoogte: 125 },
      { soort: 'komkommer', naam: 'komkommer', x: 2095, hoogte: 155 },
      { soort: 'avocado',   naam: 'avocado',   x: 2810, hoogte: 310 },
    ];

    // De ingrediënten in het spel zelf, met erbij of je ze al gepakt hebt.
    // plop telt af na het oprapen, zodat er nog even sterretjes blijven staan.
    const ingredienten = INGREDIENTEN.map((i) => ({ ...i, gepakt: false, plop: 0 }));

    function aantalGepakt() {
      let n = 0;
      for (const i of ingredienten) if (i.gepakt) n++;
      return n;
    }

    function allesGepakt() {
      return aantalGepakt() === ingredienten.length;
    }

    function opnieuw() {
      kat.x = 120;
      kat.y = grondY;
      kat.snelheidX = 0;
      kat.snelheidY = 0;
      kat.opGrond = true;
      kat.aanHetSpringen = false;
      kat.powerjump = false;
      gehaald = false;
      speeltijd = 0;
      kookTijd = -1;
      inDeKeuken = false;
      for (const i of ingredienten) {
        i.gepakt = false;
        i.plop = 0;
      }
    }

    const toetsen = {};
    window.addEventListener('keydown', (e) => {
      toetsen[e.key] = true;
      if (e.key === 'r' || e.key === 'R') opnieuw();
      if (e.key === ' ' || e.key === 'ArrowUp') e.preventDefault();
    });
    window.addEventListener('keyup', (e) => { toetsen[e.key] = false; });

    // Geeft de rechthoek van een obstakel terug: links, rechts, boven, onder.
    function vak(o) {
      return { links: o.x, rechts: o.x + o.breedte, boven: grondY - o.hoogte, onder: grondY };
    }

    // Botst de kat (op positie x, y) tegen dit obstakel?
    function botst(x, y, o) {
      const v = vak(o);
      const links = x - kat.breedte / 2;
      const rechts = x + kat.breedte / 2;
      const boven = y - kat.hoogte;
      return rechts > v.links && links < v.rechts && y > v.boven && boven < v.onder;
    }

    // Loopt de kat tegen dit ingrediënt aan? Het vak van de kat mag een stukje
    // ruimer zijn dan hij echt is, zodat oprapen makkelijk voelt.
    function raaktKat(i) {
      const y = grondY - i.hoogte;
      return i.x > kat.x - kat.breedte / 2 - 22 &&
             i.x < kat.x + kat.breedte / 2 + 22 &&
             y > kat.y - kat.hoogte - 22 &&
             y < kat.y + 22;
    }

    const LOOPSNELHEID = 260;
    const SPRONGKRACHT = 470;        // de duw omhoog als je de spatie maar heel even tikt
    const EXTRA_SPRONGKRACHT = 1500; // extra duw per seconde zolang je de spatie vasthoudt
    const MAX_VASTHOUD = 0.28;       // langer vasthouden dan dit helpt niet meer
    const POWERJUMP_VANAF = 0.2;     // vanaf hier is het een powerjump, met vonken
    const ZWAARTEKRACHT = 1600;

    // Was de sprongtoets vorige frame al ingedrukt? Zo begin je niet per ongeluk
    // meteen een nieuwe sprong als je de spatie ingedrukt houdt na de landing.
    let sprongToetsVorige = false;

    // Zorgt dat een getal tussen een minimum en een maximum blijft.
    function klem(waarde, min, max) {
      return Math.max(min, Math.min(max, waarde));
    }

    function update(dt) {
      tijd += dt;

      // Als de sushi klaar is stopt alles en blijft alleen het bord nog staan.
      if (gehaald) {
        volgCamera();
        return;
      }

      // Tijdens het koken staat de kat stil, luistert hij niet naar de toetsen
      // en loopt de klok niet door.
      if (kookTijd >= 0) {
        kookTijd += dt;
        if (kookTijd >= kookFases().rollen) gehaald = true;
        volgCamera();
        return;
      }

      speeltijd += dt;

      // links en rechts lopen
      kat.snelheidX = 0;
      if (toetsen['ArrowLeft']) kat.snelheidX = -LOOPSNELHEID;
      if (toetsen['ArrowRight']) kat.snelheidX = LOOPSNELHEID;

      // springen: een tikje is een klein sprongetje, vasthouden laadt een powerjump op
      const sprongToets = !!(toetsen[' '] || toetsen['ArrowUp']);

      if (sprongToets && !sprongToetsVorige && kat.opGrond) {
        kat.snelheidY = -SPRONGKRACHT;
        kat.opGrond = false;
        kat.aanHetSpringen = true;
        kat.vasthoudTijd = 0;
        kat.powerjump = false;
      }

      if (kat.aanHetSpringen) {
        // zolang je vasthoudt en nog omhoog gaat, krijg je er een beetje vaart bij
        if (sprongToets && kat.vasthoudTijd < MAX_VASTHOUD && kat.snelheidY < 0) {
          kat.vasthoudTijd += dt;
          kat.snelheidY -= EXTRA_SPRONGKRACHT * dt;
          if (kat.vasthoudTijd >= POWERJUMP_VANAF) kat.powerjump = true;
        } else {
          // losgelaten of lang genoeg geduwd: vanaf nu doet de zwaartekracht de rest
          kat.aanHetSpringen = false;
        }
      }

      sprongToetsVorige = sprongToets;

      // eerst opzij bewegen, en terugzetten als je tegen een blok botst
      let nieuweX = kat.x + kat.snelheidX * dt;
      for (const o of obstakels) {
        if (botst(nieuweX, kat.y, o)) nieuweX = kat.x;
      }
      kat.x = klem(nieuweX, kat.breedte / 2, LEVELBREEDTE - kat.breedte / 2);

      // daarna vallen of stijgen
      kat.snelheidY += ZWAARTEKRACHT * dt;
      let nieuweY = kat.y + kat.snelheidY * dt;
      kat.opGrond = false;

      for (const o of obstakels) {
        if (botst(kat.x, nieuweY, o)) {
          const v = vak(o);
          if (kat.snelheidY > 0) {
            // je valt en landt bovenop het blok
            nieuweY = v.boven;
            kat.opGrond = true;
            kat.aanHetSpringen = false;
            kat.powerjump = false;
          } else {
            // je springt en stoot je kop
            nieuweY = v.onder + kat.hoogte;
          }
          kat.snelheidY = 0;
        }
      }

      // de grond
      if (nieuweY > grondY) {
        nieuweY = grondY;
        kat.snelheidY = 0;
        kat.opGrond = true;
        kat.aanHetSpringen = false;
        kat.powerjump = false;
      }
      kat.y = nieuweY;

      // onderweg ingrediënten oprapen
      for (const i of ingredienten) {
        if (!i.gepakt && raaktKat(i)) {
          i.gepakt = true;
          i.plop = 0.7;
        }
        if (i.plop > 0) i.plop = Math.max(0, i.plop - dt);
      }

      // sta je bij het aanrecht? dan kun je met T aan de sushi beginnen
      inDeKeuken = kat.opGrond &&
                   kat.x > keuken.x - 20 &&
                   kat.x < keuken.x + keuken.breedte + 20;

      if (inDeKeuken && (toetsen['t'] || toetsen['T'])) {
        kookTijd = 0;
        kat.x = KOOKPLEK;   // hij stapt achter het aanrecht
        kat.y = grondY;
        kat.snelheidX = 0;
        kat.snelheidY = 0;
      }

      volgCamera();
    }

    // De camera houdt de kat in het midden, maar kijkt nooit buiten het level.
    function volgCamera() {
      const kijkNaar = kookTijd >= 0 ? keuken.x + keuken.breedte / 2 : kat.x;
      const doel = kijkNaar - canvas.width / 2;
      camera = klem(doel, 0, Math.max(0, LEVELBREEDTE - canvas.width));
    }

    function tekenZon() {
      const x = canvas.width - 110;
      const y = 100;
      schetsOvaal(x, y, 42, 42, 100);
      vulEnOmlijn('#ffd968', 5);
      // stralen
      inktLijn(4);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const hoek = (i / 8) * Math.PI * 2 + 0.2;
        ctx.moveTo(x + Math.cos(hoek) * 52, y + Math.sin(hoek) * 52);
        ctx.lineTo(x + Math.cos(hoek) * 68, y + Math.sin(hoek) * 68);
      }
      ctx.stroke();
    }

    // Een cartoon-wolk: drie bollen met een platte onderkant.
    function tekenWolk(x, y, s) {
      ctx.beginPath();
      ctx.arc(x - 34 * s, y, 30 * s, Math.PI * 0.85, Math.PI * 1.95);
      ctx.arc(x + 2 * s, y - 18 * s, 34 * s, Math.PI * 1.15, Math.PI * 1.9);
      ctx.arc(x + 42 * s, y, 28 * s, Math.PI * 1.1, Math.PI * 0.2);
      ctx.closePath();
      vulEnOmlijn('#ffffff', 5);
    }

    // Tekent heuvels van x = vanaf tot x = tot, zodat er altijd genoeg in beeld staan.
    function tekenHeuvels(vanaf, tot) {
      const AFSTAND = 340;
      ctx.fillStyle = '#9ec97a';
      const eerste = Math.floor((vanaf - 360) / AFSTAND);
      const laatste = Math.ceil((tot + 360) / AFSTAND);
      for (let i = eerste; i <= laatste; i++) {
        const x = 150 + i * AFSTAND;
        const r = 160 + (((i % 2) + 2) % 2) * 50;
        ctx.beginPath();
        ctx.ellipse(x, grondY + 20, r, r * 0.55, 0, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        inktLijn(5);
        ctx.stroke();
      }
    }

    // Tekent de grond van x = vanaf tot x = tot, het stuk dat de camera laat zien.
    function tekenGrond(vanaf, tot) {
      const links = Math.floor(vanaf / 30) * 30 - 30;
      const rechts = Math.ceil(tot / 30) * 30 + 30;

      // aarde
      ctx.beginPath();
      ctx.moveTo(links, grondY);
      for (let x = links; x <= rechts; x += 30) {
        ctx.lineTo(x, grondY + Math.sin(x * 0.03) * 3);
      }
      ctx.lineTo(rechts, canvas.height + 10);
      ctx.lineTo(links, canvas.height + 10);
      ctx.closePath();
      ctx.fillStyle = '#c99a62';
      ctx.fill();

      // graslaag bovenop
      ctx.beginPath();
      ctx.moveTo(links, grondY);
      for (let x = links; x <= rechts; x += 30) {
        ctx.lineTo(x, grondY + Math.sin(x * 0.03) * 3);
      }
      ctx.lineTo(rechts, grondY + 18);
      ctx.lineTo(links, grondY + 18);
      ctx.closePath();
      vulEnOmlijn('#79b457', 5);

      // grassprietjes
      inktLijn(3);
      ctx.strokeStyle = '#4f7f39';
      ctx.beginPath();
      for (let x = Math.floor(vanaf / 70) * 70; x < rechts; x += 70) {
        const h = 10 + ruis(x) * 6;
        ctx.moveTo(x, grondY + 2);
        ctx.quadraticCurveTo(x + 4, grondY - h, x + 9, grondY - h - 2);
      }
      ctx.stroke();
    }

    // De finishvlag: een paal met een geruite vlag die in de wind wappert.
    function tekenFinish() {
      const x = finish.x;
      const top = grondY - finish.hoogte;

      // paal
      schetsBlok(x - 8, top, 16, finish.hoogte, 11);
      vulEnOmlijn('#e8ddc8', 5);

      // vlag, opgebouwd uit zwart-witte vakjes die mee golven
      const kolommen = 4;
      const rijen = 3;
      const vlagB = 132;
      const vlagH = 84;
      const vakB = vlagB / kolommen;
      const vakH = vlagH / rijen;
      const golf = (c) => Math.sin(tijd * 4 + c * 0.9) * 8;

      for (let c = 0; c < kolommen; c++) {
        for (let r = 0; r < rijen; r++) {
          const xl = x + 4 + c * vakB;
          const xr = x + 4 + (c + 1) * vakB;
          const gl = golf(c);
          const gr = golf(c + 1);
          ctx.beginPath();
          ctx.moveTo(xl, top + 6 + r * vakH + gl);
          ctx.lineTo(xr, top + 6 + r * vakH + gr);
          ctx.lineTo(xr, top + 6 + (r + 1) * vakH + gr);
          ctx.lineTo(xl, top + 6 + (r + 1) * vakH + gl);
          ctx.closePath();
          ctx.fillStyle = (c + r) % 2 === 0 ? '#3b2d23' : '#fff';
          ctx.fill();
        }
      }

      // inktrand om de hele vlag
      inktLijn(5);
      ctx.beginPath();
      ctx.moveTo(x + 4, top + 6 + golf(0));
      for (let c = 1; c <= kolommen; c++) ctx.lineTo(x + 4 + c * vakB, top + 6 + golf(c));
      for (let c = kolommen; c >= 0; c--) ctx.lineTo(x + 4 + c * vakB, top + 6 + vlagH + golf(c));
      ctx.closePath();
      ctx.stroke();

      // bordje onderaan de paal dat naar de keuken wijst
      schetsBlok(x - 82, grondY - 70, 164, 46, 13);
      vulEnOmlijn('#ffd968', 5);
      ctx.fillStyle = INKT;
      ctx.font = 'bold 26px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('KEUKEN →', x, grondY - 46);
    }

    // ---------- de ingrediënten tekenen ----------

    // Alle ingrediënten in dezelfde cartoon-stijl, met (x, y) als hun midden.
    // Met schaal maak je ze groter of kleiner, zodat ze ook in de balk bovenin passen.
    function tekenIngredient(soort, x, y, schaal) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);

      if (soort === 'rijst') {
        // een bolletje rijst met korreltjes erop
        schetsOvaal(0, 2, 27, 21, 201);
        vulEnOmlijn('#fdfbf1', 5);
        inktLijn(2.5);
        ctx.beginPath();
        for (let k = 0; k < 5; k++) {
          const kx = -16 + k * 8;
          const ky = -6 + (k % 2) * 11;
          ctx.moveTo(kx, ky);
          ctx.lineTo(kx + 6, ky + 4);
        }
        ctx.stroke();
      } else if (soort === 'nori') {
        // een blad zeewier: bijna zwart, met een glans erop
        schetsBlok(-24, -24, 48, 48, 211);
        vulEnOmlijn('#31472f', 5);
        inktLijn(3);
        ctx.strokeStyle = '#7fa871';
        ctx.beginPath();
        ctx.moveTo(-14, 8);
        ctx.quadraticCurveTo(-2, -6, 14, -12);
        ctx.stroke();
      } else if (soort === 'zalm') {
        // een visje met een staart en lichte strepen
        ctx.beginPath();
        ctx.moveTo(-26, 0);
        ctx.quadraticCurveTo(-4, -20, 20, -2);
        ctx.quadraticCurveTo(-4, 18, -26, 0);
        ctx.closePath();
        vulEnOmlijn('#f08b5a', 5);
        ctx.beginPath();
        ctx.moveTo(20, -2);
        ctx.lineTo(34, -12);
        ctx.lineTo(32, 8);
        ctx.closePath();
        vulEnOmlijn('#f08b5a', 5);
        inktLijn(3);
        ctx.strokeStyle = '#fbdcc8';
        ctx.beginPath();
        ctx.moveTo(-14, -4); ctx.quadraticCurveTo(-6, 2, 2, -6);
        ctx.moveTo(-18, 4); ctx.quadraticCurveTo(-10, 9, 0, 3);
        ctx.stroke();
        ctx.fillStyle = INKT;
        ctx.beginPath();
        ctx.arc(-16, -3, 2.6, 0, Math.PI * 2);
        ctx.fill();
      } else if (soort === 'komkommer') {
        // een schijfje komkommer met zaadjes
        schetsOvaal(0, 0, 24, 24, 221);
        vulEnOmlijn('#6fb33f', 5);
        schetsOvaal(0, 0, 16, 16, 222);
        vulEnOmlijn('#d8eeb4', 3);
        ctx.fillStyle = '#9ac46a';
        for (let k = 0; k < 4; k++) {
          const hoek = (k / 4) * Math.PI * 2 + 0.4;
          ctx.beginPath();
          ctx.ellipse(Math.cos(hoek) * 8, Math.sin(hoek) * 8, 3.4, 2.4, hoek, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (soort === 'avocado') {
        // een halve avocado met een grote pit
        schetsOvaal(0, 0, 21, 28, 231);
        vulEnOmlijn('#4f7f39', 5);
        schetsOvaal(0, 1, 14, 21, 232);
        vulEnOmlijn('#cfe08a', 3);
        schetsOvaal(0, 3, 8, 10, 233);
        vulEnOmlijn('#a9713f', 3);
      }

      ctx.restore();
    }

    // Sterretjes op de plek waar net een ingrediënt lag. sterkte loopt van 0.7 naar 0.
    function tekenPlop(x, y, sterkte) {
      const uit = (0.7 - sterkte) * 60;
      ctx.save();
      ctx.globalAlpha = Math.max(0, sterkte / 0.7);
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let k = 0; k < 6; k++) {
        const hoek = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(hoek) * (14 + uit), y + Math.sin(hoek) * (14 + uit));
        ctx.lineTo(x + Math.cos(hoek) * (24 + uit), y + Math.sin(hoek) * (24 + uit));
        ctx.stroke();
      }
      ctx.restore();
    }

    // De ingrediënten in het level zweven een beetje op en neer, zodat ze opvallen.
    function tekenIngredienten() {
      for (const i of ingredienten) {
        const y = grondY - i.hoogte;
        if (!i.gepakt) {
          tekenIngredient(i.soort, i.x, y + Math.sin(tijd * 3 + i.x) * 6, 1);
        } else if (i.plop > 0) {
          tekenPlop(i.x, y, i.plop);
        }
      }
    }

    // Een maki-rolletje van bovenaf: zeewier eromheen, dan rijst, en vulling in het midden.
    function tekenSushi(x, y, schaal, vulling) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(schaal, schaal);
      schetsOvaal(0, 0, 30, 30, 301);
      vulEnOmlijn('#31472f', 5);
      schetsOvaal(0, 0, 23, 23, 302);
      vulEnOmlijn('#fdfbf1', 3);
      schetsOvaal(0, 0, 10, 10, 303);
      vulEnOmlijn(vulling, 3);
      ctx.restore();
    }

    // ---------- de keuken tekenen ----------

    // Het uithangbord op twee palen. Dit staat achter de kat.
    function tekenKeukenAchter() {
      const paalTop = grondY - 300;

      for (const px of [keuken.x + 18, keuken.x + keuken.breedte - 18]) {
        schetsBlok(px - 7, paalTop, 14, 300, 51);
        vulEnOmlijn('#b07f4e', 5);
      }

      schetsBlok(keuken.x + 36, paalTop - 14, keuken.breedte - 72, 76, 52);
      vulEnOmlijn('#e4572e', 5);
      tekenTekst('SUSHI', keuken.x + keuken.breedte / 2, paalTop + 24, 44);
    }

    // Het aanrecht met de snijplank. Dit tekenen we na de kat, zodat hij er
    // echt achter lijkt te staan.
    function tekenKeukenVoor() {
      const top = grondY - AANRECHT_H;

      // het blad
      schetsBlok(keuken.x - 8, top, keuken.breedte + 16, 20, 53);
      vulEnOmlijn('#e8ddc8', 5);

      // de kast eronder, met twee deurtjes
      schetsBlok(keuken.x, top + 18, keuken.breedte, AANRECHT_H - 18, 54);
      vulEnOmlijn('#c98f55', 5);
      inktLijn(4);
      ctx.beginPath();
      ctx.moveTo(keuken.x + keuken.breedte / 2, top + 26);
      ctx.lineTo(keuken.x + keuken.breedte / 2, grondY - 8);
      ctx.stroke();
      ctx.fillStyle = INKT;
      for (const hx of [keuken.x + keuken.breedte / 2 - 18, keuken.x + keuken.breedte / 2 + 18]) {
        ctx.beginPath();
        ctx.arc(hx, top + 44, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // de snijplank bovenop
      schetsBlok(PLANK_X - 82, top - 13, 164, 15, 55);
      vulEnOmlijn('#dbb380', 4);

      if (kookTijd >= 0) tekenKoken();
    }

    // Een keukenmes, met het punt naar links.
    function tekenMes(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      ctx.moveTo(-44, 2);
      ctx.lineTo(24, 2);
      ctx.lineTo(24, -18);
      ctx.lineTo(-40, -11);
      ctx.closePath();
      vulEnOmlijn('#d8dee3', 4);
      schetsBlok(24, -20, 36, 18, 61);
      vulEnOmlijn('#8a5a33', 4);
      ctx.restore();
    }

    // Het sushi maken zelf: eerst vallen de ingredienten op de plank, dan hakt
    // het mes ze klein, en daarna liggen de rolletjes op een bordje.
    function tekenKoken() {
      const fase = kookFases();
      const t = kookTijd;
      const plankY = grondY - AANRECHT_H - 13;  // de bovenkant van de plank
      const itemY = plankY - 22;
      const lijst = ingredienten.filter((i) => i.gepakt);

      if (t < fase.hakken) {
        // de ingredienten komen een voor een naar beneden vallen
        lijst.forEach((i, n) => {
          const deel = klem((t - n * 0.22) / 0.45, 0, 1);
          if (deel <= 0) return;
          const hoog = (1 - deel) * (1 - deel) * 300;
          const x = PLANK_X - (lijst.length - 1) * 17 + n * 34;
          tekenIngredient(i.soort, x, itemY - hoog, 0.6);
        });
      }

      if (t > fase.vliegen && t < fase.hakken) {
        // het mes gaat op en neer boven de plank
        const hak = Math.abs(Math.sin((t - fase.vliegen) * 11));
        tekenMes(PLANK_X + 30, itemY - 26 - hak * 70);
        if (hak < 0.12) tekenPlop(PLANK_X, plankY - 6, 0.3);
      }

      if (t >= fase.hakken) {
        // een bordje met daarop de rolletjes die je verdiend hebt
        schetsOvaal(PLANK_X, plankY + 2, 86, 14, 56);
        vulEnOmlijn('#f2f2ef', 4);

        const vullingen = ['#f08b5a', '#cfe08a', '#6fb33f'];
        const rollen = aantalRollen();
        for (let n = 0; n < rollen; n++) {
          const kom = klem((t - fase.hakken - n * 0.18) / 0.3, 0, 1);
          if (kom <= 0) continue;
          const x = PLANK_X - (rollen - 1) * 26 + n * 52;
          tekenSushi(x, plankY - 14, 0.62 * kom, vullingen[n % 3]);
        }
      }
    }

    // Het wolkje boven de kat als hij bij het aanrecht staat.
    function tekenKookTip() {
      const x = kat.x;
      const y = kat.y - kat.hoogte - 76;
      tekenWolk(x, y, 1.3);
      tekenTekst('druk op T', x, y - 32, 20);
      tekenTekst('voor sushi', x, y - 10, 20);
    }

    function tekenObstakels() {
      for (const o of obstakels) {
        const v = vak(o);
        schetsBlok(v.links, v.boven, o.breedte, o.hoogte, o.x);
        vulEnOmlijn('#aab2b8', 5);
        // lichte bovenkant en een barstje, zodat het op een rots lijkt
        inktLijn(3);
        ctx.beginPath();
        ctx.moveTo(v.links + 12, v.boven + 14);
        ctx.quadraticCurveTo(v.links + o.breedte / 2, v.boven + 8, v.rechts - 12, v.boven + 15);
        ctx.moveTo(v.links + o.breedte * 0.6, v.boven + 24);
        ctx.lineTo(v.links + o.breedte * 0.45, v.boven + o.hoogte * 0.55);
        ctx.stroke();
      }
    }

    // Een getal dat netjes binnen 0 en breedte blijft, ook als het negatief is.
    function rondOm(waarde, breedte) {
      return ((waarde % breedte) + breedte) % breedte;
    }

    function tekenLucht() {
      const lucht = ctx.createLinearGradient(0, 0, 0, grondY);
      lucht.addColorStop(0, '#9fd8f2');
      lucht.addColorStop(1, '#e6f6fc');
      ctx.fillStyle = lucht;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Wolken drijven naar links en schuiven maar een beetje mee met de camera,
    // waardoor ze ver weg lijken te staan.
    function tekenWolken() {
      const ruimte = canvas.width + 400;
      for (let i = 0; i < 4; i++) {
        const x = rondOm(i * 420 + 200 - tijd * 12 - camera * 0.2, ruimte) - 200;
        tekenWolk(x, 90 + (i % 3) * 55, 1 - (i % 3) * 0.15);
      }
    }

    // Tekst met een witte rand eromheen, zodat je hem overal kunt lezen.
    function tekenTekst(tekst, x, y, grootte) {
      ctx.font = 'bold ' + grootte + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 7;
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#fff';
      ctx.strokeText(tekst, x, y);
      ctx.fillStyle = INKT;
      ctx.fillText(tekst, x, y);
    }

    // De balk bovenin: hoe lang je onderweg bent en hoe ver je al bent.
    function tekenHud() {
      const deel = klem(kat.x / KOOKPLEK, 0, 1);
      const balkB = Math.min(360, canvas.width - 80);
      const balkX = canvas.width / 2 - balkB / 2;
      const balkY = 28;

      schetsBlok(balkX, balkY, balkB, 22, 21);
      vulEnOmlijn('#ffffff', 4);
      ctx.save();
      ctx.beginPath();
      ctx.rect(balkX, balkY, balkB * deel, 22);
      ctx.clip();
      schetsBlok(balkX, balkY, balkB, 22, 21);
      ctx.fillStyle = '#79b457';
      ctx.fill();
      ctx.restore();

      tekenTekst(speeltijd.toFixed(1) + ' sec', canvas.width / 2, balkY + 56, 24);

      tekenIngredientenBalk();
    }

    // Het rijtje linksboven: wat je al gepakt hebt staat er in kleur in,
    // de rest is nog vaag. Zo zie je wat je voor je sushi nog mist.
    function tekenIngredientenBalk() {
      const vakje = 56;
      const b = 20 + ingredienten.length * vakje;
      const x = 26;
      const y = 26;

      schetsBlok(x, y, b, 76, 41);
      vulEnOmlijn('rgba(255, 255, 255, 0.8)', 4);

      ingredienten.forEach((i, n) => {
        const cx = x + 10 + vakje / 2 + n * vakje;
        const cy = y + 40;
        ctx.save();
        if (!i.gepakt) ctx.globalAlpha = 0.25;
        tekenIngredient(i.soort, cx, cy, 0.62);
        ctx.restore();
      });
    }

    // Het bord dat in beeld komt als je de vlag hebt aangeraakt.
    function tekenGehaaldBord() {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const b = Math.min(520, canvas.width - 60);
      const h = 290;
      const x = canvas.width / 2 - b / 2;
      const y = canvas.height / 2 - h / 2;
      schetsBlok(x, y, b, h, 31);
      vulEnOmlijn('#ffd968', 6);

      const midden = canvas.width / 2;
      tekenTekst(allesGepakt() ? 'Sushi!' : 'Gehaald!', midden, y + 56, 54);

      if (allesGepakt()) {
        // alles bij elkaar: de kat rolt er drie rolletjes van
        tekenSushi(midden - 78, y + 150, 0.9, '#f08b5a');
        tekenSushi(midden, y + 150, 0.9, '#cfe08a');
        tekenSushi(midden + 78, y + 150, 0.9, '#6fb33f');
        tekenTekst('je had alle ingrediënten', midden, y + 212, 24);
      } else {
        const mist = ingredienten.length - aantalGepakt();
        tekenTekst('maar je mist nog ' + mist, midden, y + 108, 26);
        tekenTekst(mist === 1 ? 'ingrediënt voor de sushi' : 'ingrediënten voor de sushi', midden, y + 142, 26);
        for (let n = 0; n < ingredienten.length; n++) {
          const i = ingredienten[n];
          const cx = midden - (ingredienten.length - 1) * 28 + n * 56;
          ctx.save();
          if (!i.gepakt) ctx.globalAlpha = 0.25;
          tekenIngredient(i.soort, cx, y + 196, 0.62);
          ctx.restore();
        }
      }

      tekenTekst('in ' + speeltijd.toFixed(1) + ' seconden', midden, y + 244, 24);
      tekenTekst('druk op R om opnieuw te spelen', midden, y + 274, 20);
    }

    // Gele vonken onder de voeten, zodat je ziet dat dit een powerjump is.
    function tekenVonken(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = '#ffd43b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const hoek = (i / 6) * Math.PI * 2 + tijd * 6;
        const afstand = 26 + Math.sin(tijd * 18 + i) * 8;
        ctx.beginPath();
        ctx.moveTo(Math.cos(hoek) * afstand, Math.sin(hoek) * afstand * 0.5);
        ctx.lineTo(Math.cos(hoek) * (afstand + 16), Math.sin(hoek) * (afstand + 16) * 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // de lucht en de zon blijven staan waar ze staan
      tekenLucht();
      tekenZon();
      tekenWolken();

      // de heuvels schuiven half zo snel mee als de rest
      ctx.save();
      ctx.translate(-camera * 0.5, 0);
      tekenHeuvels(camera * 0.5, camera * 0.5 + canvas.width);
      ctx.restore();

      // en hier komt het level zelf, dat helemaal met de camera meeschuift
      ctx.save();
      ctx.translate(-camera, 0);
      tekenGrond(camera, camera + canvas.width);
      tekenObstakels();
      tekenFinish();
      tekenKeukenAchter();
      tekenIngredienten();
      if (kat.powerjump) tekenVonken(kat.x, kat.y);
      tekenKat(kat.x, kat.y, 1);
      tekenKeukenVoor();
      if (inDeKeuken && kookTijd < 0) tekenKookTip();
      ctx.restore();

      tekenHud();
      if (gehaald) tekenGehaaldBord();
    }

    opnieuw();

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
