<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // De bal: waar hij is, hoe groot hij is en hoe snel hij beweegt (opzij en omhoog/omlaag).
    const bal = { x: canvas.width / 2, y: canvas.height / 2, straal: 30, snelheidX: 0, snelheidY: 0 };
    const zwaartekracht = 1500;
    const stuiter = 0.8; // hoeveel snelheid de bal overhoudt na een stuit (1 = alles, 0 = niets)

    // Klik op de pagina: de bal schiet omhoog en een beetje schuin, links of rechts.
    canvas.addEventListener('click', () => {
      bal.snelheidY = -1000;
      bal.snelheidX = (Math.random() - 0.5) * 600;
    });

    function update(dt) {
      bal.snelheidY += zwaartekracht * dt;
      bal.x += bal.snelheidX * dt;
      bal.y += bal.snelheidY * dt;

      // Raakt de bal de bodem? Dan kaatst hij terug omhoog.
      if (bal.y + bal.straal > canvas.height) {
        bal.y = canvas.height - bal.straal;
        bal.snelheidY = -bal.snelheidY * stuiter;
      }

      // Raakt de bal een zijkant? Dan kaatst hij terug de andere kant op.
      if (bal.x - bal.straal < 0) {
        bal.x = bal.straal;
        bal.snelheidX = -bal.snelheidX * stuiter;
      }
      if (bal.x + bal.straal > canvas.width) {
        bal.x = canvas.width - bal.straal;
        bal.snelheidX = -bal.snelheidX * stuiter;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'green';
      ctx.beginPath();
      ctx.arc(bal.x, bal.y, bal.straal, 0, Math.PI * 2);
      ctx.fill();
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
