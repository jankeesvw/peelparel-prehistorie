<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      color: #2b1a12;
      background: linear-gradient(160deg, #f0d9b0, #e8c99a 50%, #d9a86c);
    }
    main { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 3rem; text-align: center; }
    h1 { color: #8a3b1e; margin: 0 0 .2rem; text-shadow: 2px 2px 0 rgba(255,255,255,.4); }
    p { margin: 0 0 1rem; font-style: italic; color: #4a2f22; }
    canvas {
      display: block; margin: 0 auto; max-width: 100%;
      border: 4px solid #4a2f22; border-radius: 1rem; box-shadow: 6px 6px 0 #8a3b1e;
    }
    a { color: #8a3b1e; }
    .terug { display: inline-block; margin-top: 1.2rem; }
  </style>
</head>
<body>
<main>
  <h1>🦣 test</h1>
  <p>Een spel in wording. De mammoet wandelt vast alvast rond.</p>
  <canvas id="game" width="800" height="600"></canvas>
  <a class="terug" href="../">&larr; terug naar alle games</a>
</main>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // De mammoet: waar hij staat, hoe snel hij loopt en welke kant hij op kijkt.
  const mammoet = { x: 100, y: 470, snelheid: 120, richting: 1 };

  // De groene bal: waar hij ligt en hoe groot hij is.
  const bal = { x: 400, y: 490, straal: 25 };

  function update(dt) {
    mammoet.x += mammoet.snelheid * mammoet.richting * dt;
    // Aan de rand van het scherm draait hij om.
    if (mammoet.x > canvas.width - 60) mammoet.richting = -1;
    if (mammoet.x < 60) mammoet.richting = 1;
  }

  function tekenLucht() {
    const lucht = ctx.createLinearGradient(0, 0, 0, 420);
    lucht.addColorStop(0, '#f7b267');
    lucht.addColorStop(1, '#f4845f');
    ctx.fillStyle = lucht;
    ctx.fillRect(0, 0, canvas.width, 420);

    // De zon
    ctx.fillStyle = '#ffd97d';
    ctx.beginPath();
    ctx.arc(640, 130, 55, 0, Math.PI * 2);
    ctx.fill();
  }

  function tekenHeuvels() {
    ctx.fillStyle = '#8a3b1e';
    ctx.beginPath();
    ctx.moveTo(0, 420);
    ctx.quadraticCurveTo(200, 250, 400, 400);
    ctx.quadraticCurveTo(600, 300, 800, 420);
    ctx.lineTo(800, 420);
    ctx.lineTo(0, 420);
    ctx.fill();
  }

  function tekenGrond() {
    ctx.fillStyle = '#c8792e';
    ctx.fillRect(0, 420, canvas.width, 180);
    ctx.fillStyle = '#4a2f22';
    ctx.fillRect(0, 420, canvas.width, 6);
  }

  function tekenBal() {
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.arc(bal.x, bal.y, bal.straal, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2b1a12';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function tekenMammoet() {
    ctx.save();
    ctx.translate(mammoet.x, mammoet.y);
    // Kijkt hij naar links? Dan spiegelen we het plaatje.
    if (mammoet.richting === 1) ctx.scale(-1, 1);
    ctx.font = '80px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🦣', 0, 0);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tekenLucht();
    tekenHeuvels();
    tekenGrond();
    tekenBal();
    tekenMammoet();
  }

  let vorige = performance.now();
  function loop(nu) {
    update((nu - vorige) / 1000);
    vorige = nu;
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
</script>
<script src="../livereload.js"></script>
</body>
</html>
