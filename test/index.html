<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; color: #111; font-family: sans-serif; }
    canvas { display: block; background: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Het canvas vult de hele pagina, ook als het venster van grootte verandert.
    function pasGrootteAan() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    pasGrootteAan();
    window.addEventListener('resize', pasGrootteAan);

    // De bal: waar hij is, hoe groot hij is en hoe snel hij valt.
    const bal = { x: canvas.width / 2, y: canvas.height / 2, straal: 30, snelheid: 0 };
    const zwaartekracht = 1500;

    function update(dt) {
      bal.snelheid += zwaartekracht * dt;
      bal.y += bal.snelheid * dt;

      // Raakt de bal de bodem? Dan kaatst hij terug omhoog.
      if (bal.y + bal.straal > canvas.height) {
        bal.y = canvas.height - bal.straal;
        bal.snelheid = -bal.snelheid;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'green';
      ctx.beginPath();
      ctx.arc(bal.x, bal.y, bal.straal, 0, Math.PI * 2);
      ctx.fill();
    }

    let vorige = performance.now();
    function loop(nu) {
      update((nu - vorige) / 1000);
      vorige = nu;
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
