<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3d-test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #111; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #info { position: fixed; top: 16px; left: 16px; font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
    #melding { position: fixed; top: 40%; width: 100%; text-align: center; font-size: 56px; font-weight: bold; color: #fff; text-shadow: 0 3px 8px rgba(0,0,0,.7); pointer-events: none; }
    #uitleg { position: fixed; bottom: 16px; width: 100%; text-align: center; font-size: 18px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="info">Level 1 &nbsp; Gevallen: 0</div>
  <div id="melding"></div>
  <div id="uitleg">Kantel de tafel met de pijltjes of W A S D</div>
  <script>
    // Babylon.js: echte 3D met glimmende materialen, zachte schaduwen en gloed
    const canvas = document.getElementById('game');
    const infoTekst = document.getElementById('info');
    const meldingTekst = document.getElementById('melding');

    // Instellingen
    const TAFEL_HALF = 5;        // tafel is 10 bij 10
    const TAFEL_DIKTE = 0.5;
    const BAL_STRAAL = 0.4;
    const GAT_STRAAL = 0.65;
    const MAX_KANTEL = 0.3;      // hoe schuin de tafel maximaal mag (radialen)
    const KANTEL_SNELHEID = 1.2;
    const ZWAARTEKRACHT = 20;
    const WRIJVING = 0.6;
    const GROND_Y = -12;

    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    window.addEventListener('resize', () => engine.resize());

    // Camera kijkt schuin van voren op de tafel (niet zelf te draaien)
    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2, 0.8, 19, new BABYLON.Vector3(0, -0.5, 0), scene);
    camera.fov = 0.8;

    // Omgeving: lucht en weerspiegelingen
    const omgeving = BABYLON.CubeTexture.CreateFromPrefilteredData('https://assets.babylonjs.com/environments/environmentSpecular.env', scene);
    scene.environmentTexture = omgeving;
    scene.environmentIntensity = 0.9;
    scene.createDefaultSkybox(omgeving, true, 600, 0.25);

    // Zon met zachte schaduwen
    const zon = new BABYLON.DirectionalLight('zon', new BABYLON.Vector3(-0.4, -1, 0.35), scene);
    zon.position = new BABYLON.Vector3(8, 25, -8);
    zon.intensity = 2.5;
    const schaduw = new BABYLON.ShadowGenerator(2048, zon);
    schaduw.usePercentageCloserFiltering = true;
    schaduw.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
    schaduw.bias = 0.0005;

    // Gras ver onder de tafel
    const grond = BABYLON.MeshBuilder.CreateGround('grond', { width: 300, height: 300 }, scene);
    grond.position.y = GROND_Y;
    const grasMat = new BABYLON.PBRMaterial('gras', scene);
    grasMat.albedoTexture = new BABYLON.Texture('https://assets.babylonjs.com/textures/grass.png', scene);
    grasMat.albedoTexture.uScale = grasMat.albedoTexture.vScale = 40;
    grasMat.metallic = 0; grasMat.roughness = 1;
    grond.material = grasMat;
    grond.receiveShadows = true;

    // De tafel: alles wat eraan vastzit kantelt mee
    const tafel = new BABYLON.TransformNode('tafel', scene);
    const blad = BABYLON.MeshBuilder.CreateBox('blad', { width: TAFEL_HALF * 2, depth: TAFEL_HALF * 2, height: TAFEL_DIKTE }, scene);
    blad.parent = tafel;
    blad.position.y = -TAFEL_DIKTE / 2;
    const houtMat = new BABYLON.PBRMaterial('hout', scene);
    houtMat.albedoTexture = new BABYLON.Texture('https://assets.babylonjs.com/textures/wood.jpg', scene);
    houtMat.metallic = 0; houtMat.roughness = 0.35;
    houtMat.clearCoat.isEnabled = true;     // gelakt hout dat een beetje glanst
    houtMat.clearCoat.intensity = 0.6;
    blad.material = houtMat;
    blad.receiveShadows = true;
    schaduw.addShadowCaster(blad);

    // Het gat: zwarte schijf met een gloeiende gouden ring eromheen
    const gat = BABYLON.MeshBuilder.CreateDisc('gat', { radius: GAT_STRAAL, tessellation: 48 }, scene);
    gat.parent = tafel;
    gat.rotation.x = Math.PI / 2;
    gat.position.y = 0.005;
    const zwart = new BABYLON.StandardMaterial('zwart', scene);
    zwart.diffuseColor = BABYLON.Color3.Black(); zwart.specularColor = BABYLON.Color3.Black(); zwart.disableLighting = true;
    gat.material = zwart;
    const ring = BABYLON.MeshBuilder.CreateTorus('ring', { diameter: GAT_STRAAL * 2 + 0.08, thickness: 0.08, tessellation: 48 }, scene);
    ring.parent = tafel;
    const ringMat = new BABYLON.PBRMaterial('ringMat', scene);
    ringMat.albedoColor = new BABYLON.Color3(1, 0.75, 0.2);
    ringMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.1);
    ringMat.metallic = 1; ringMat.roughness = 0.2;
    ring.material = ringMat;

    // De bal: een glanzende biljartbal met een streep en een 9, zodat je ziet dat hij rolt
    const bal = BABYLON.MeshBuilder.CreateSphere('bal', { diameter: BAL_STRAAL * 2, segments: 48 }, scene);
    bal.rotationQuaternion = BABYLON.Quaternion.Identity();
    const balPlaatje = new BABYLON.DynamicTexture('balPlaatje', { width: 1024, height: 512 }, scene);
    const bctx = balPlaatje.getContext();
    bctx.fillStyle = '#f4f1e8'; bctx.fillRect(0, 0, 1024, 512);
    bctx.fillStyle = '#f2a900'; bctx.fillRect(0, 150, 1024, 212);   // gele streep rondom
    for (const x of [256, 768]) {                                     // twee witte rondjes met een 9
      bctx.fillStyle = '#f4f1e8';
      bctx.beginPath(); bctx.ellipse(x, 256, 80, 90, 0, 0, Math.PI * 2); bctx.fill();
      bctx.fillStyle = '#111'; bctx.font = 'bold 120px sans-serif';
      bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
      bctx.fillText('9', x, 262);
    }
    balPlaatje.update();
    const balMat = new BABYLON.PBRMaterial('balMat', scene);
    balMat.albedoTexture = balPlaatje;
    balMat.metallic = 0; balMat.roughness = 0.15;
    balMat.clearCoat.isEnabled = true;   // laagje lak dat de lucht weerspiegelt
    bal.material = balMat;
    schaduw.addShadowCaster(bal);

    // Mooie nabewerking: gloed, zachte randen, kleurcorrectie
    const gloed = new BABYLON.GlowLayer('gloed', scene);
    gloed.intensity = 0.8;
    const beeld = new BABYLON.DefaultRenderingPipeline('beeld', true, scene, [camera]);
    beeld.samples = 4;
    beeld.fxaaEnabled = true;
    beeld.bloomEnabled = true;
    beeld.bloomThreshold = 0.8;
    beeld.bloomWeight = 0.3;
    beeld.imageProcessing.toneMappingEnabled = true;
    beeld.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
    beeld.imageProcessing.vignetteEnabled = true;
    beeld.imageProcessing.vignetteWeight = 1.5;

    // Materiaal voor de blokken die in de weg liggen
    const blokMat = new BABYLON.PBRMaterial('blokMat', scene);
    blokMat.albedoColor = new BABYLON.Color3(0.55, 0.12, 0.1);
    blokMat.metallic = 0.2; blokMat.roughness = 0.3;
    blokMat.clearCoat.isEnabled = true;

    // Spelstatus
    let toestand = 'rollen';   // 'rollen', 'inGat' of 'vallen'
    const balSnelheid = new BABYLON.Vector3();
    let wachttijd = 0;
    let level = 1, gevallen = 0;
    let kantelX = 0, kantelZ = 0;
    let tafelHalf = TAFEL_HALF;   // wordt kleiner per level
    let gatStraal = GAT_STRAAL;   // wordt kleiner per level
    let blokken = [];             // { mesh, x, z, halfB, halfD } op de tafel

    function toonInfo() {
      infoTekst.innerHTML = `Level ${level} &nbsp; Gevallen: ${gevallen}`;
    }

    function zetGatNeer() {
      // gat ergens op de tafel, niet te dicht bij het begin van de bal
      const marge = tafelHalf - 0.9;
      do {
        gat.position.x = (Math.random() * 2 - 1) * marge;
        gat.position.z = (Math.random() * 2 - 1) * marge;
      } while (Math.hypot(gat.position.x, gat.position.z) < tafelHalf * 0.7);
      ring.position.set(gat.position.x, 0, gat.position.z);
    }

    // Elk level iets moeilijker: kleinere tafel, kleiner gat en meer blokken in de weg
    function bouwLevel() {
      tafelHalf = Math.max(3, TAFEL_HALF - (level - 1) * 0.2);
      gatStraal = Math.max(0.5, GAT_STRAAL + 0.1 - (level - 1) * 0.03);
      blad.scaling.x = blad.scaling.z = tafelHalf / TAFEL_HALF;
      gat.scaling.x = gat.scaling.y = gatStraal / GAT_STRAAL;
      ring.scaling.x = ring.scaling.z = gatStraal / GAT_STRAAL;
      zetGatNeer();

      // oude blokken weg, nieuwe neerzetten (vanaf level 2)
      for (const b of blokken) { schaduw.removeShadowCaster(b.mesh); b.mesh.dispose(); }
      blokken = [];
      const aantal = Math.min(10, level - 1);
      for (let i = 0; i < aantal; i++) {
        const liggend = Math.random() < 0.5;
        const halfB = liggend ? 0.9 : 0.25, halfD = liggend ? 0.25 : 0.9;
        for (let poging = 0; poging < 100; poging++) {
          const x = (Math.random() * 2 - 1) * (tafelHalf - halfB);
          const z = (Math.random() * 2 - 1) * (tafelHalf - halfD);
          const vrij = (px, pz, afstand) => Math.abs(x - px) > halfB + afstand || Math.abs(z - pz) > halfD + afstand;
          if (!vrij(0, 0, 1.2)) continue;                                        // niet op de startplek
          if (!vrij(gat.position.x, gat.position.z, gatStraal + 1)) continue;     // gat bereikbaar houden
          if (!blokken.every(b => Math.abs(x - b.x) > halfB + b.halfB + 0.9 || Math.abs(z - b.z) > halfD + b.halfD + 0.9)) continue;
          const mesh = BABYLON.MeshBuilder.CreateBox('blok', { width: halfB * 2, depth: halfD * 2, height: 0.5 }, scene);
          mesh.parent = tafel;
          mesh.position.set(x, 0.25, z);
          mesh.material = blokMat;
          mesh.receiveShadows = true;
          schaduw.addShadowCaster(mesh);
          blokken.push({ mesh, x, z, halfB, halfD });
          break;
        }
      }
      toonInfo();
    }

    // Bal tegen een blok: terugduwen en laten stuiteren
    function botsMetBlokken() {
      for (const b of blokken) {
        const dichtstX = BABYLON.Scalar.Clamp(bal.position.x, b.x - b.halfB, b.x + b.halfB);
        const dichtstZ = BABYLON.Scalar.Clamp(bal.position.z, b.z - b.halfD, b.z + b.halfD);
        const dx = bal.position.x - dichtstX, dz = bal.position.z - dichtstZ;
        const afstand = Math.hypot(dx, dz);
        if (afstand < BAL_STRAAL && afstand > 0) {
          const nx = dx / afstand, nz = dz / afstand;
          bal.position.x = dichtstX + nx * BAL_STRAAL;
          bal.position.z = dichtstZ + nz * BAL_STRAAL;
          const tegen = balSnelheid.x * nx + balSnelheid.z * nz;
          if (tegen < 0) {
            balSnelheid.x -= 1.6 * tegen * nx;
            balSnelheid.z -= 1.6 * tegen * nz;
          }
        }
      }
    }

    function nieuweBal() {
      bal.parent = tafel;
      bal.position.set(0, BAL_STRAAL, 0);
      balSnelheid.set(0, 0, 0);
      toestand = 'rollen';
      meldingTekst.textContent = '';
    }

    // Toetsen
    const toetsen = {};
    window.addEventListener('keydown', e => { toetsen[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
    window.addEventListener('keyup', e => { toetsen[e.key.toLowerCase()] = false; });

    function update(dt) {
      // Tafel kantelen; los je de toets, dan gaat hij langzaam terug naar plat
      const links = toetsen['arrowleft'] || toetsen['a'];
      const rechts = toetsen['arrowright'] || toetsen['d'];
      const op = toetsen['arrowup'] || toetsen['w'];
      const neer = toetsen['arrowdown'] || toetsen['s'];
      if (links) kantelZ += KANTEL_SNELHEID * dt;
      else if (rechts) kantelZ -= KANTEL_SNELHEID * dt;
      else kantelZ *= Math.pow(0.1, dt);
      if (op) kantelX += KANTEL_SNELHEID * dt;
      else if (neer) kantelX -= KANTEL_SNELHEID * dt;
      else kantelX *= Math.pow(0.1, dt);
      kantelX = BABYLON.Scalar.Clamp(kantelX, -MAX_KANTEL, MAX_KANTEL);
      kantelZ = BABYLON.Scalar.Clamp(kantelZ, -MAX_KANTEL, MAX_KANTEL);
      tafel.rotation.set(kantelX, 0, kantelZ);
      const tafelMatrix = tafel.computeWorldMatrix(true);

      if (toestand === 'rollen') {
        // Zwaartekracht bekeken vanuit de schuine tafel: dat deel trekt de bal opzij
        const zwaarte = BABYLON.Vector3.TransformNormal(new BABYLON.Vector3(0, -ZWAARTEKRACHT, 0), tafelMatrix.clone().invert());
        balSnelheid.x += zwaarte.x * (5 / 7) * dt;
        balSnelheid.z += zwaarte.z * (5 / 7) * dt;
        balSnelheid.scaleInPlace(Math.pow(1 - WRIJVING, dt));
        bal.position.x += balSnelheid.x * dt;
        bal.position.z += balSnelheid.z * dt;
        botsMetBlokken();

        // Laten rollen: draaien om de as dwars op de beweging
        const afstand = Math.hypot(balSnelheid.x, balSnelheid.z) * dt;
        if (afstand > 0) {
          const as = BABYLON.Vector3.TransformNormal(new BABYLON.Vector3(balSnelheid.z, 0, -balSnelheid.x).normalize(), tafelMatrix);
          bal.rotate(as, afstand / BAL_STRAAL, BABYLON.Space.WORLD);
        }

        // In het gat?
        if (Math.hypot(bal.position.x - gat.position.x, bal.position.z - gat.position.z) < gatStraal - 0.15) {
          toestand = 'inGat';
          wachttijd = 1.5;
          meldingTekst.textContent = 'Raak! Op naar level ' + (level + 1);
        }
        // Van de tafel af?
        else if (Math.abs(bal.position.x) > tafelHalf || Math.abs(bal.position.z) > tafelHalf) {
          toestand = 'vallen';
          wachttijd = 2;
          // bal loskoppelen van de tafel en met dezelfde vaart laten vallen
          bal.computeWorldMatrix(true);
          const wereldPos = bal.getAbsolutePosition().clone();
          const v = BABYLON.Vector3.TransformNormal(balSnelheid, tafelMatrix);
          bal.parent = null;
          bal.position.copyFrom(wereldPos);
          balSnelheid.copyFrom(v);
          gevallen++;
          toonInfo();
          meldingTekst.textContent = 'Eraf gevallen!';
        }
      } else if (toestand === 'inGat') {
        // bal glijdt naar het midden van het gat en zakt naar beneden
        const f = Math.min(1, 10 * dt);
        bal.position.x += (gat.position.x - bal.position.x) * f;
        bal.position.z += (gat.position.z - bal.position.z) * f;
        bal.position.y -= 3 * dt;
        wachttijd -= dt;
        if (wachttijd <= 0) { level++; nieuweBal(); bouwLevel(); }
      } else if (toestand === 'vallen') {
        balSnelheid.y -= ZWAARTEKRACHT * dt;
        bal.position.addInPlace(balSnelheid.scale(dt));
        if (bal.position.y < GROND_Y + BAL_STRAAL) {
          bal.position.y = GROND_Y + BAL_STRAAL;
          balSnelheid.y *= -0.4;
          balSnelheid.x *= 0.8; balSnelheid.z *= 0.8;
        }
        wachttijd -= dt;
        if (wachttijd <= 0) nieuweBal();
      }
    }

    nieuweBal();
    bouwLevel();

    scene.onBeforeRenderObservable.add(() => update(Math.min(engine.getDeltaTime() / 1000, 0.05)));
    engine.runRenderLoop(() => scene.render());
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
