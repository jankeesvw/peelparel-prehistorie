<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3d-test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: 'Press Start 2P', monospace; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; image-rendering: pixelated; }
    /* Arcade-scorebord bovenin */
    #hud { position: fixed; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; font-size: 14px; line-height: 1.8; pointer-events: none; text-shadow: 3px 3px 0 #000; }
    #hud .waarde { font-size: 20px; }
    #score { color: #ffeb3b; }
    #hi { color: #ff4081; text-align: center; }
    #lvl { color: #18ffff; text-align: right; }
    #levens { color: #ff1744; font-size: 18px; }
    #melding { position: fixed; top: 38%; left: 16px; right: 16px; text-align: center; font-size: 34px; line-height: 1.5; color: #fff; text-shadow: 4px 4px 0 #000, 0 0 18px #ff00ff; pointer-events: none; }
    #melding.knipper { animation: knipper 1s steps(2) infinite; }
    @keyframes knipper { 50% { opacity: 0; } }
    #titel { position: fixed; top: 20%; width: 100%; text-align: center; font-size: 46px; line-height: 1.3; pointer-events: none;
             color: #ffeb3b; text-shadow: 4px 4px 0 #ff1744, 8px 8px 0 #2979ff, 0 0 30px #ff00ff; }
    /* Oud tv-scherm: lijntjes en donkere hoeken */
    #crt { position: fixed; inset: 0; pointer-events: none; z-index: 10;
           background: repeating-linear-gradient(rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
                       radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
           animation: flikker 0.12s infinite; }
    @keyframes flikker { 50% { opacity: 0.93; } }
    #melding.feest { animation: feestTekst 0.7s ease-out, regenboog 0.8s linear infinite; }
    @keyframes feestTekst { 0% { transform: scale(0.2) rotate(-12deg); opacity: 0; } 60% { transform: scale(1.3) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
    @keyframes regenboog { 0% { color: #ff5252; } 25% { color: #ffd740; } 50% { color: #69f0ae; } 75% { color: #40c4ff; } 100% { color: #ff5252; } }
    #uitleg { pointer-events: none; position: fixed; bottom: 18px; left: 16px; right: 16px; text-align: center; font-size: 11px; line-height: 1.6; color: #b2ff59; text-shadow: 2px 2px 0 #000; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="score">SCORE<br><span class="waarde" id="scoreTekst">000000</span><br><span id="levens"></span></div>
    <div id="hi">HI-SCORE<br><span class="waarde" id="hiTekst">000000</span></div>
    <div id="lvl"><span id="lvlTekst">LEVEL 01</span><br><span class="waarde" id="themaTekst"></span></div>
  </div>
  <div id="titel">TAFEL<br>TOLLER</div>
  <div id="melding"></div>
  <div id="uitleg">PIJLTJES / WASD / SLEEP MET JE VINGER</div>
  <div id="crt"></div>
  <script>
    // Babylon.js: echte 3D met glimmende materialen, zachte schaduwen en gloed.
    // Havok doet de natuurkunde: de bal en de dobbelsteen rollen, botsen en vallen echt.
    const canvas = document.getElementById('game');
    const titel = document.getElementById('titel');
    const uitleg = document.getElementById('uitleg');
    const meldingTekst = document.getElementById('melding');

    // Instellingen
    const TAFEL_HALF = 5;        // tafel is 10 bij 10
    const TAFEL_DIKTE = 0.5;
    const BAL_STRAAL = 0.4;
    const GAT_STRAAL = 0.65;
    const MAX_KANTEL = 0.3;      // hoe schuin de tafel maximaal mag (radialen)
    const KANTEL_SNELHEID = 1.2;
    const ZWAARTEKRACHT = 20;
    const WRIJVING = 0.6;
    const GROND_Y = -12;

    const engine = new BABYLON.Engine(canvas, false);
    engine.setHardwareScalingLevel(2.5);   // grove pixels, net als een oude arcadekast
    const scene = new BABYLON.Scene(engine);
    window.addEventListener('resize', () => engine.resize());

    // Camera kijkt schuin van voren op de tafel (niet zelf te draaien)
    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2, 0.8, 19, new BABYLON.Vector3(0, -0.5, 0), scene);
    camera.fov = 0.8;

    // Omgeving: lucht en weerspiegelingen
    const omgeving = BABYLON.CubeTexture.CreateFromPrefilteredData('https://assets.babylonjs.com/environments/environmentSpecular.env', scene);
    scene.environmentTexture = omgeving;
    scene.environmentIntensity = 0.9;
    const standaardLucht = scene.createDefaultSkybox(omgeving, true, 600, 0.25);

    // Tweede lucht waarvan we het plaatje per thema wisselen
    const LUCHTEN = 'https://playground.babylonjs.com/textures/';
    const luchtCache = {};
    function luchtPlaatje(naam) {
      if (!luchtCache[naam]) {
        luchtCache[naam] = naam === 'Space/space'
          ? new BABYLON.CubeTexture(LUCHTEN + naam, scene, ['_right.jpg', '_up.jpg', '_front.jpg', '_left.jpg', '_down.jpg', '_back.jpg'])
          : new BABYLON.CubeTexture(LUCHTEN + naam, scene);
        luchtCache[naam].coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
      }
      return luchtCache[naam];
    }
    const themaLucht = BABYLON.MeshBuilder.CreateBox('themaLucht', { size: 600 }, scene);
    themaLucht.infiniteDistance = true;
    const themaLuchtMat = new BABYLON.StandardMaterial('themaLuchtMat', scene);
    themaLuchtMat.backFaceCulling = false;
    themaLuchtMat.disableLighting = true;
    themaLuchtMat.diffuseColor = BABYLON.Color3.Black();
    themaLuchtMat.specularColor = BABYLON.Color3.Black();
    themaLucht.material = themaLuchtMat;
    themaLucht.setEnabled(false);

    // Zon met zachte schaduwen
    const zon = new BABYLON.DirectionalLight('zon', new BABYLON.Vector3(-0.4, -1, 0.35), scene);
    zon.position = new BABYLON.Vector3(8, 25, -8);
    zon.intensity = 2.5;
    const schaduw = new BABYLON.ShadowGenerator(2048, zon);
    schaduw.usePercentageCloserFiltering = true;
    schaduw.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
    schaduw.bias = 0.0005;

    // Gras ver onder de tafel
    const grond = BABYLON.MeshBuilder.CreateGround('grond', { width: 300, height: 300 }, scene);
    grond.position.y = GROND_Y;
    const grasMat = new BABYLON.PBRMaterial('gras', scene);
    grasMat.albedoTexture = new BABYLON.Texture('https://assets.babylonjs.com/textures/grass.png', scene);
    grasMat.albedoTexture.uScale = grasMat.albedoTexture.vScale = 40;
    grasMat.metallic = 0; grasMat.roughness = 1;
    grond.material = grasMat;
    grond.receiveShadows = true;

    // De tafel: alles wat eraan vastzit kantelt mee
    const tafel = new BABYLON.TransformNode('tafel', scene);
    tafel.rotationQuaternion = BABYLON.Quaternion.Identity();
    const blad = BABYLON.MeshBuilder.CreateBox('blad', { width: TAFEL_HALF * 2, depth: TAFEL_HALF * 2, height: TAFEL_DIKTE }, scene);
    blad.parent = tafel;
    blad.position.y = -TAFEL_DIKTE / 2;
    const houtMat = new BABYLON.PBRMaterial('hout', scene);
    houtMat.albedoTexture = new BABYLON.Texture('https://assets.babylonjs.com/textures/wood.jpg', scene);
    houtMat.metallic = 0; houtMat.roughness = 0.35;
    houtMat.clearCoat.isEnabled = true;     // gelakt hout dat een beetje glanst
    houtMat.clearCoat.intensity = 0.6;
    blad.material = houtMat;
    blad.receiveShadows = true;
    schaduw.addShadowCaster(blad);

    // Het gat: zwarte schijf met een gloeiende gouden ring eromheen
    const gat = BABYLON.MeshBuilder.CreateDisc('gat', { radius: GAT_STRAAL, tessellation: 48 }, scene);
    gat.parent = tafel;
    gat.rotation.x = Math.PI / 2;
    gat.position.y = 0.005;
    const zwart = new BABYLON.StandardMaterial('zwart', scene);
    zwart.diffuseColor = BABYLON.Color3.Black(); zwart.specularColor = BABYLON.Color3.Black(); zwart.disableLighting = true;
    gat.material = zwart;
    const ring = BABYLON.MeshBuilder.CreateTorus('ring', { diameter: GAT_STRAAL * 2 + 0.08, thickness: 0.08, tessellation: 48 }, scene);
    ring.parent = tafel;
    const ringMat = new BABYLON.PBRMaterial('ringMat', scene);
    ringMat.albedoColor = new BABYLON.Color3(1, 0.75, 0.2);
    ringMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.1);
    ringMat.metallic = 1; ringMat.roughness = 0.2;
    ring.material = ringMat;

    // De bal: een glanzende biljartbal met een streep en een 9, zodat je ziet dat hij rolt
    const bal = BABYLON.MeshBuilder.CreateSphere('bal', { diameter: BAL_STRAAL * 2, segments: 48 }, scene);
    bal.rotationQuaternion = BABYLON.Quaternion.Identity();
    const balPlaatje = new BABYLON.DynamicTexture('balPlaatje', { width: 1024, height: 512 }, scene);
    const bctx = balPlaatje.getContext();
    bctx.fillStyle = '#f4f1e8'; bctx.fillRect(0, 0, 1024, 512);
    bctx.fillStyle = '#f2a900'; bctx.fillRect(0, 150, 1024, 212);   // gele streep rondom
    for (const x of [256, 768]) {                                     // twee witte rondjes met een 9
      bctx.fillStyle = '#f4f1e8';
      bctx.beginPath(); bctx.ellipse(x, 256, 80, 90, 0, 0, Math.PI * 2); bctx.fill();
      bctx.fillStyle = '#111'; bctx.font = 'bold 120px sans-serif';
      bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
      bctx.fillText('9', x, 262);
    }
    balPlaatje.update();
    const balMat = new BABYLON.PBRMaterial('balMat', scene);
    balMat.albedoTexture = balPlaatje;
    balMat.metallic = 0; balMat.roughness = 0.15;
    balMat.clearCoat.isEnabled = true;   // laagje lak dat de lucht weerspiegelt
    bal.material = balMat;
    schaduw.addShadowCaster(bal);

    // ---------- Gekke vormen die je in plaats van de bal over de tafel laat rollen ----------
    // Elke vorm heeft zijn eigen natuurkunde, dus een dobbelsteen kiepert echt van vlak naar vlak,
    // een blikje rolt maar één kant op en een kubus glijdt eerder dan dat hij rolt.

    // Plaatje met de getallen 1 tot en met 'aantal', één vakje per vlak van de dobbelsteen
    function dobbelPlaatje(naam, aantal, achter, cijfer, letterGrootte = 70) {
      const plaatje = new BABYLON.DynamicTexture(naam, { width: 1280, height: 1024 }, scene);
      const c = plaatje.getContext();
      c.fillStyle = achter; c.fillRect(0, 0, 1280, 1024);
      c.fillStyle = cijfer; c.font = `bold ${letterGrootte}px sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const vlakken = [];
      for (let i = 0; i < aantal; i++) {
        const kolom = i % 5, rij = Math.floor(i / 5);
        vlakken.push(new BABYLON.Vector4(kolom / 5, rij / 4, (kolom + 1) / 5, (rij + 1) / 4));
        const x = kolom * 256 + 128, y = (3 - rij) * 256 + 128;
        c.fillText(String(i + 1), x, y + 6);
        if (aantal > 8 && (i + 1 === 6 || i + 1 === 9)) c.fillRect(x - 18, y + letterGrootte * 0.6, 36, 6);   // streepje onder 6 en 9
      }
      plaatje.update();
      return { plaatje, vlakken };
    }

    // Glanzend materiaal met een plaatje erop
    function vormMateriaal(naam, plaatje, o = {}) {
      const mat = new BABYLON.PBRMaterial(naam, scene);
      mat.albedoTexture = plaatje;
      mat.metallic = o.metaal ?? 0; mat.roughness = o.ruw ?? 0.2;
      mat.clearCoat.isEnabled = o.lak ?? true;
      return mat;
    }

    // Dobbelsteen met veel vlakken (4, 8, 12 of 20), zo groot dat hij net in het gat past
    function maakVeelvlak(naam, type, aantal, straal, achter, cijfer, letterGrootte) {
      const { plaatje, vlakken } = dobbelPlaatje(naam + 'Plaatje', aantal, achter, cijfer, letterGrootte);
      // eerst meten hoe groot hij standaard is, dan op de goede maat maken
      const proef = BABYLON.MeshBuilder.CreatePolyhedron('proef', { type, size: 1 }, scene);
      const punten = proef.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      let grootste = 0;
      for (let i = 0; i < punten.length; i += 3) grootste = Math.max(grootste, Math.hypot(punten[i], punten[i + 1], punten[i + 2]));
      proef.dispose();
      const mesh = BABYLON.MeshBuilder.CreatePolyhedron(naam, { type, size: straal / grootste, faceUV: vlakken }, scene);
      mesh.material = vormMateriaal(naam + 'Mat', plaatje);
      return mesh;
    }

    // Plaatje tekenen met een gewoon 2D-canvas
    function tekenPlaatje(naam, breed, hoog, teken) {
      const plaatje = new BABYLON.DynamicTexture(naam, { width: breed, height: hoog }, scene);
      teken(plaatje.getContext(), breed, hoog);
      plaatje.update();
      return plaatje;
    }

    const VORMEN = {};
    function nieuweVorm(naam, mesh, instellingen) {
      mesh.receiveShadows = true;
      schaduw.addShadowCaster(mesh);
      mesh.setEnabled(false);
      VORMEN[naam] = { mesh, ...instellingen };
    }

    // D20, D12, D8 en D4
    nieuweVorm('d20', maakVeelvlak('d20', 3, 20, 0.54, '#5b2a86', '#ffd54f'), { kantel: 0.45, grip: 1 });
    nieuweVorm('d12', maakVeelvlak('d12', 2, 12, 0.5, '#26c6da', '#0b2e33', 90), { kantel: 0.5, grip: 0.9 });
    nieuweVorm('d8', maakVeelvlak('d8', 1, 8, 0.52, '#c62828', '#ffffff', 80), { kantel: 0.55, grip: 0.8 });
    nieuweVorm('d4', maakVeelvlak('d4', 0, 4, 0.6, '#d4a017', '#3e2723', 90), { kantel: 0.55, grip: 0.3 });

    // D6: een gewone kubus, die glijdt eerder dan dat hij rolt
    {
      const { plaatje, vlakken } = dobbelPlaatje('d6Plaatje', 6, '#fafafa', '#c62828', 150);
      const kubus = BABYLON.MeshBuilder.CreateBox('d6', { size: 0.7, faceUV: vlakken }, scene);
      kubus.material = vormMateriaal('d6Mat', plaatje);
      nieuweVorm('d6', kubus, { kantel: 0.55, grip: 0.35 });
    }

    // Donut met roze glazuur en spikkels
    {
      const plaatje = tekenPlaatje('donutPlaatje', 512, 256, (c, b, h) => {
        c.fillStyle = '#d9a066'; c.fillRect(0, 0, b, h);                // deeg
        c.fillStyle = '#f48fb1'; c.fillRect(0, 0, b, h / 2);            // glazuur
        const kleuren = ['#fff', '#ffeb3b', '#4fc3f7', '#81c784', '#ba68c8'];
        for (let i = 0; i < 160; i++) {
          c.fillStyle = kleuren[i % kleuren.length];
          c.fillRect(Math.random() * b, Math.random() * (h / 2 - 8), 10, 4);
        }
      });
      const donut = BABYLON.MeshBuilder.CreateTorus('donut', { diameter: 0.7, thickness: 0.32, tessellation: 40 }, scene);
      donut.material = vormMateriaal('donutMat', plaatje, { ruw: 0.4 });
      nieuweVorm('donut', donut, { kantel: 0.4, grip: 0.8 });
    }

    // Blikje frisdrank: rolt alleen dwars, en staat hij rechtop dan glijdt hij
    {
      const plaatje = tekenPlaatje('blikPlaatje', 1024, 512, (c, b, h) => {
        c.fillStyle = '#d32f2f'; c.fillRect(0, 0, 896, h);
        c.fillStyle = '#fff'; c.beginPath(); c.moveTo(0, 300);
        for (let x = 0; x <= 896; x += 16) c.lineTo(x, 300 + Math.sin(x / 70) * 40);
        c.lineTo(896, 340); c.lineTo(0, 340); c.fill();
        c.font = 'bold 140px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText('SAP', 224, 180); c.fillText('SAP', 672, 180);
        c.fillStyle = '#c0c4c8'; c.fillRect(896, 0, 128, h);            // zilveren boven- en onderkant
      });
      const blik = BABYLON.MeshBuilder.CreateCylinder('blikje', {
        height: 0.8, diameter: 0.55, tessellation: 32,
        faceUV: [new BABYLON.Vector4(0.9, 0.1, 0.98, 0.9), new BABYLON.Vector4(0, 0, 0.875, 1), new BABYLON.Vector4(0.9, 0.1, 0.98, 0.9)],
      }, scene);
      blik.material = vormMateriaal('blikMat', plaatje, { metaal: 0.8, ruw: 0.25, lak: false });
      nieuweVorm('blikje', blik, { kantel: 0.35, grip: 0.6 });
    }

    // Pil: half rood, half wit
    {
      const plaatje = tekenPlaatje('pilPlaatje', 256, 256, (c, b, h) => {
        c.fillStyle = '#e53935'; c.fillRect(0, 0, b, h / 2);
        c.fillStyle = '#fafafa'; c.fillRect(0, h / 2, b, h / 2);
      });
      const pil = BABYLON.MeshBuilder.CreateCapsule('pil', { height: 0.95, radius: 0.22, tessellation: 24, capSubdivisions: 8 }, scene);
      pil.material = vormMateriaal('pilMat', plaatje, { ruw: 0.15 });
      nieuweVorm('pil', pil, { kantel: 0.35, grip: 0.7 });
    }

    // ---------- Nog rarere vormen, in elkaar gezet uit losse onderdelen ----------
    const V3 = (x, y, z) => new BABYLON.Vector3(x, y, z);
    function kleurMat(naam, kleur, o = {}) {
      const mat = new BABYLON.PBRMaterial(naam, scene);
      mat.albedoColor = BABYLON.Color3.FromHexString(kleur);
      mat.metallic = o.metaal ?? 0; mat.roughness = o.ruw ?? 0.3;
      mat.clearCoat.isEnabled = o.lak ?? false;
      return mat;
    }
    // Onderdelen samenvoegen tot één ding, met het midden precies in het midden
    function samenvoegen(naam, onderdelen) {
      const mesh = BABYLON.Mesh.MergeMeshes(onderdelen, true, true, undefined, false, true);
      mesh.name = naam;
      const midden = mesh.getBoundingInfo().boundingBox.center.clone();
      mesh.position = midden.scale(-1);
      mesh.bakeCurrentTransformIntoVertices();
      mesh.position.set(0, 0, 0);
      mesh.refreshBoundingInfo();
      return mesh;
    }
    function onderdeel(mesh, mat, plek, draai) {
      mesh.material = mat;
      if (plek) mesh.position = plek;
      if (draai) mesh.rotation = draai;
      return mesh;
    }
    const MB = BABYLON.MeshBuilder;

    // Theepot: bolle buik, tuit, oor en een knopje op het deksel
    {
      const porselein = kleurMat('porselein', '#f5f5f5', { ruw: 0.15, lak: true });
      const blauw = kleurMat('theepotBlauw', '#1e63c6', { ruw: 0.15, lak: true });
      const profiel = [V3(0, -0.22, 0), V3(0.2, -0.22, 0), V3(0.3, -0.12, 0), V3(0.33, 0, 0), V3(0.29, 0.12, 0), V3(0.18, 0.2, 0), V3(0.06, 0.23, 0), V3(0, 0.23, 0)];
      const pot = samenvoegen('theepot', [
        onderdeel(MB.CreateLathe('buik', { shape: profiel, tessellation: 32 }, scene), porselein),
        onderdeel(MB.CreateTube('tuit', { path: [V3(0.25, -0.06, 0), V3(0.4, 0.04, 0), V3(0.5, 0.18, 0)], radiusFunction: (i) => 0.07 - i * 0.015, cap: BABYLON.Mesh.CAP_ALL, tessellation: 16 }, scene), blauw),
        onderdeel(MB.CreateTorus('oor', { diameter: 0.28, thickness: 0.05, tessellation: 24 }, scene), blauw, V3(-0.32, 0.02, 0), V3(Math.PI / 2, 0, 0)),
        onderdeel(MB.CreateSphere('knop', { diameter: 0.1 }, scene), blauw, V3(0, 0.26, 0)),
      ]);
      nieuweVorm('theepot', pot, { kantel: 0.45, grip: 0.6 });
    }

    // Banaan: een kromme, dikke buis met dunne puntjes
    {
      const pad = [];
      for (let i = 0; i <= 20; i++) {
        const h = -1 + i / 10;   // van -1 tot 1
        pad.push(V3(Math.sin(h * 0.9) * 0.55, (1 - Math.cos(h * 0.9)) * 0.55, 0));
      }
      const banaan = MB.CreateTube('banaan', { path: pad, radiusFunction: (i) => 0.025 + 0.11 * Math.sin(Math.PI * i / 20), cap: BABYLON.Mesh.CAP_ALL, tessellation: 7 }, scene);
      banaan.material = kleurMat('banaanMat', '#ffd600', { ruw: 0.5 });
      nieuweVorm('banaan', samenvoegen('banaan', [banaan]), { kantel: 0.4, grip: 0.5 });
    }

    // Badeendje: dik lijf, kopje, oranje snavel en zwarte oogjes
    {
      const geel = kleurMat('eendGeel', '#ffeb3b', { ruw: 0.2, lak: true });
      const oranje = kleurMat('eendOranje', '#ff9800', { ruw: 0.3, lak: true });
      const zwart = kleurMat('eendZwart', '#111111', { ruw: 0.1 });
      const lijf = MB.CreateSphere('lijf', { diameter: 0.55 }, scene);
      lijf.scaling = V3(1.3, 0.85, 1);
      const eend = samenvoegen('eendje', [
        onderdeel(lijf, geel),
        onderdeel(MB.CreateSphere('kop', { diameter: 0.34 }, scene), geel, V3(0.2, 0.28, 0)),
        onderdeel(MB.CreateCylinder('snavel', { height: 0.16, diameterTop: 0, diameterBottom: 0.14, tessellation: 12 }, scene), oranje, V3(0.42, 0.25, 0), V3(0, 0, -Math.PI / 2)),
        onderdeel(MB.CreateSphere('oog1', { diameter: 0.06 }, scene), zwart, V3(0.3, 0.35, 0.11)),
        onderdeel(MB.CreateSphere('oog2', { diameter: 0.06 }, scene), zwart, V3(0.3, 0.35, -0.11)),

    function tekenBalPatroon(ontwerp) {
      const c = bctx, B = 1024, H = 512;
      c.fillStyle = ontwerp.basis; c.fillRect(0, 0, B, H);
      if (ontwerp.soort === 'biljart') {
        c.fillStyle = ontwerp.kleur; c.fillRect(0, 150, B, 212);
        for (const x of [256, 768]) {
          c.fillStyle = ontwerp.basis;
          c.beginPath(); c.ellipse(x, 256, 80, 90, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#111'; c.font = 'bold 120px sans-serif';
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(ontwerp.nummer, x, 262);
        }
      } else if (ontwerp.soort === 'stippen') {
        c.fillStyle = ontwerp.kleur;
        for (let rij = 0; rij < 5; rij++) for (let k = 0; k < 8; k++) {
          c.beginPath(); c.arc(k * 128 + (rij % 2) * 64 + 32, rij * 110 + 40, 30, 0, Math.PI * 2); c.fill();
        }
      } else if (ontwerp.soort === 'strandbal') {
        ontwerp.kleuren.forEach((k, i) => { c.fillStyle = k; c.fillRect(i * B / ontwerp.kleuren.length, 0, B / ontwerp.kleuren.length + 1, H); });
        c.fillStyle = '#fff'; c.fillRect(0, 0, B, 50); c.fillRect(0, H - 50, B, 50);
      } else if (ontwerp.soort === 'voetbal') {
        c.fillStyle = '#111';
        for (let rij = 0; rij < 4; rij++) for (let k = 0; k < 6; k++) {
          const x = k * 171 + (rij % 2) * 85 + 40, y = rij * 140 + 50;
          c.beginPath();
          for (let h = 0; h < 5; h++) c.lineTo(x + Math.cos(h * 1.2566 - 1.57) * 45, y + Math.sin(h * 1.2566 - 1.57) * 45);
          c.fill();
        }
      } else if (ontwerp.soort === 'lijnen') {
        c.strokeStyle = ontwerp.kleur; c.lineWidth = 18;
        for (let x = 0; x < B; x += 128) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
        c.beginPath(); c.moveTo(0, H / 2); c.lineTo(B, H / 2); c.stroke();
      }
      balPlaatje.update();
    }

    let thema = THEMAS[0];
    function zetThema() {
      thema = THEMAS[(level - 1) % THEMAS.length];
      const t = thema.tafel;
      stelIn(houtMat, { ...t, plaatje: t.hout ? textuur(t.hout, t.herhaal) : null });

      const a = thema.achtergrond;
      standaardLucht.setEnabled(!a.lucht);
      themaLucht.setEnabled(!!a.lucht);
      if (a.lucht) themaLuchtMat.reflectionTexture = luchtPlaatje(a.lucht);
      grond.isVisible = a.grond !== 'geen';   // onzichtbaar, maar de bal stuitert er nog wel op
      if (a.grond && a.grond !== 'geen') {
        stelIn(grasMat, { ...a.grond, plaatje: a.grond.hout ? textuur(a.grond.hout, a.grond.herhaal || 40) : null });
      }

      // een gekke vorm heeft vaak een schuinere tafel nodig om om te rollen
      maxKantel = b.vorm ? VORMEN[b.vorm].kantel : MAX_KANTEL;
      bal.isVisible = !b.vorm;          // bij een gekke vorm is de bal zelf onzichtbaar
      for (const naam in VORMEN) VORMEN[naam].mesh.setEnabled(naam === b.vorm);
      if (b.ontwerp) tekenBalPatroon(b.ontwerp);
      stelIn(balMat, { ...b, plaatje: b.plaatje ? textuur(b.plaatje) : balPlaatje });

    function zetGatNeer() {
      // gat ergens op de tafel, niet te dicht bij het begin van de bal
      const marge = tafelHalf - 0.9;
      do {
        gat.position.x = (Math.random() * 2 - 1) * marge;
        gat.position.z = (Math.random() * 2 - 1) * marge;
      } while (Math.hypot(gat.position.x, gat.position.z) < tafelHalf * 0.7);
      ring.position.set(gat.position.x, 0, gat.position.z);
    }

    // Elk level moeilijker: kleinere tafel, kleiner gat, gladder, meer blokken en valgaten
    function bouwLevel() {
      tafelHalf = Math.max(2.8, TAFEL_HALF - (level - 1) * 0.3);
      gatStraal = Math.max(0.48, GAT_STRAAL + 0.1 - (level - 1) * 0.05);
      wrijving = Math.max(0.12, WRIJVING - (level - 1) * 0.06);
      zetThema();
      blad.scaling.x = blad.scaling.z = tafelHalf / TAFEL_HALF;
      gat.scaling.x = gat.scaling.y = gatStraal / GAT_STRAAL;
      ring.scaling.x = ring.scaling.z = gatStraal / GAT_STRAAL;
      zetGatNeer();

      // oude valgaten weg, nieuwe neerzetten (vanaf level 2, steeds één meer)
      for (const v of valgaten) { v.schijf.dispose(); v.rand.dispose(); }
      valgaten = [];
      const aantalValgaten = Math.min(8, level - 1);
      for (let i = 0; i < aantalValgaten; i++) {
        for (let poging = 0; poging < 100; poging++) {
          const x = (Math.random() * 2 - 1) * (tafelHalf - 0.8);
          const z = (Math.random() * 2 - 1) * (tafelHalf - 0.8);
          if (Math.hypot(x, z) < 1.4) continue;                                           // niet op de startplek
          if (Math.hypot(x - gat.position.x, z - gat.position.z) < gatStraal + 1.5) continue;  // niet vlak naast het echte gat
          if (!valgaten.every(v => Math.hypot(x - v.x, z - v.z) > 1.8)) continue;
          const schijf = gat.clone('valgat');
          schijf.parent = tafel;
          schijf.scaling.set(VALGAT_STRAAL / GAT_STRAAL, VALGAT_STRAAL / GAT_STRAAL, 1);
          schijf.position.set(x, 0.005, z);
          const rand = ring.clone('valrand');
          rand.parent = tafel;
          rand.material = valRandMat;
          rand.scaling.set(VALGAT_STRAAL / GAT_STRAAL, 1, VALGAT_STRAAL / GAT_STRAAL);
          rand.position.set(x, 0, z);
          valgaten.push({ schijf, rand, x, z });
          break;
        }
      }

      // oude blokken weg, nieuwe neerzetten (vanaf level 2)
      for (const b of blokken) { schaduw.removeShadowCaster(b.mesh); b.mesh.dispose(); }
      blokken = [];
      const aantal = Math.min(12, (level - 1) * 2);
      for (let i = 0; i < aantal; i++) {
        const liggend = Math.random() < 0.5;
        const halfB = liggend ? 0.9 : 0.25, halfD = liggend ? 0.25 : 0.9;
        for (let poging = 0; poging < 100; poging++) {
          const x = (Math.random() * 2 - 1) * (tafelHalf - halfB);
          const z = (Math.random() * 2 - 1) * (tafelHalf - halfD);
          const vrij = (px, pz, afstand) => Math.abs(x - px) > halfB + afstand || Math.abs(z - pz) > halfD + afstand;
          if (!vrij(0, 0, 1.2)) continue;                                        // niet op de startplek
          if (!vrij(gat.position.x, gat.position.z, gatStraal + 1)) continue;     // gat bereikbaar houden
          if (!valgaten.every(v => vrij(v.x, v.z, VALGAT_STRAAL + 0.6))) continue;
          if (!blokken.every(b => Math.abs(x - b.x) > halfB + b.halfB + 0.9 || Math.abs(z - b.z) > halfD + b.halfD + 0.9)) continue;
          const mesh = BABYLON.MeshBuilder.CreateBox('blok', { width: halfB * 2, depth: halfD * 2, height: 0.5 }, scene);
          mesh.parent = tafel;
          mesh.position.set(x, 0.25, z);
          mesh.material = blokMat;
          mesh.receiveShadows = true;
          schaduw.addShadowCaster(mesh);
          blokken.push({ mesh, x, z, halfB, halfD });
          break;
        }
      }
      maakTafelVorm();
      toonInfo();
    }

    // De vorm van de tafel voor de natuurkunde: het blad plus alle blokken
    function maakTafelVorm() {
      const vorm = new BABYLON.PhysicsShapeContainer(scene);
      const blok = (b, h, d) => new BABYLON.PhysicsShapeBox(BABYLON.Vector3.Zero(), BABYLON.Quaternion.Identity(), new BABYLON.Vector3(b, h, d), scene);
      vorm.addChild(blok(tafelHalf * 2, TAFEL_DIKTE, tafelHalf * 2), new BABYLON.Vector3(0, -TAFEL_DIKTE / 2, 0));
      for (const b of blokken) vorm.addChild(blok(b.halfB * 2, 0.5, b.halfD * 2), new BABYLON.Vector3(b.x, 0.25, b.z));
      vorm.material = { friction: 0.8, restitution: 0.3 };
      const oud = tafelFysica.shape;
      tafelFysica.shape = vorm;
      if (oud) oud.dispose();
    }

    // Vaste dingen in de natuurkunde: de grond en de kantelende tafel
    function maakNatuurkunde() {
      grondFysica = new BABYLON.PhysicsBody(grond, BABYLON.PhysicsMotionType.STATIC, false, scene);
      grondFysica.shape = new BABYLON.PhysicsShapeBox(new BABYLON.Vector3(0, -0.5, 0), BABYLON.Quaternion.Identity(), new BABYLON.Vector3(300, 1, 300), scene);
      grondFysica.shape.material = { friction: 0.8, restitution: 0.4 };
      // de tafel bewegen wij zelf, de natuurkunde duwt alleen tegen de bal
      tafelFysica = new BABYLON.PhysicsBody(tafel, BABYLON.PhysicsMotionType.ANIMATED, false, scene);
    }

    function stopSpelerFysica() {
      if (spelerFysica) { spelerFysica.dispose(); spelerFysica = null; }
    }

    // Nieuwe bal (of gekke vorm) valt vanaf net boven het midden op de tafel
    function nieuweBal() {
      stopSpelerFysica();
      const vorm = VORMEN[thema.bal.vorm];
      speler = vorm ? vorm.mesh : bal;
      speler.setEnabled(true);
      speler.setParent(null);
      levelStart = performance.now();
      speler.position.set(0, 1.2, 0);
      speler.rotationQuaternion = vorm
        ? BABYLON.Quaternion.FromEulerAngles(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3)
        : BABYLON.Quaternion.Identity();
      spelerFysica = new BABYLON.PhysicsAggregate(speler,
        vorm ? BABYLON.PhysicsShapeType.CONVEX_HULL : BABYLON.PhysicsShapeType.SPHERE,
        { mass: 1, friction: vorm ? vorm.grip : 0.8, restitution: vorm ? 0.2 : 0.3 }, scene);
      // gladder per level: minder afremmen
      const rem = -Math.log(1 - wrijving);
      spelerFysica.body.setLinearDamping(rem * 0.3);
      spelerFysica.body.setAngularDamping(rem);
      spelerFysica.body.setSleepMode?.(false);   // nooit in slaap vallen, ook niet als hij stil ligt
      toestand = 'rollen';
      meldingTekst.textContent = '';
      meldingTekst.classList.remove('feest');
      straal.setEnabled(false);
    }

    // ---------- Feest als je door het gat bent: confetti, lichtstraal en de tafel draait een rondje ----------
    const FEEST_DUUR = 2.5;
    const confettiPlaatje = new BABYLON.Texture('https://assets.babylonjs.com/textures/flare.png', scene);
    const straal = BABYLON.MeshBuilder.CreateCylinder('straal', { height: 30, diameterTop: 2.5, diameterBottom: 0.9, tessellation: 32 }, scene);
    const straalMat = new BABYLON.StandardMaterial('straalMat', scene);
    straalMat.emissiveColor = new BABYLON.Color3(1, 0.85, 0.3);
    straalMat.disableLighting = true;
    straalMat.alpha = 0;
    straal.material = straalMat;
    straal.isPickable = false;
    straal.setEnabled(false);

    // Eén knal confetti vanaf een plek in de wereld
    function confettiKnal(plek, kleurA, kleurB) {
      const ps = new BABYLON.ParticleSystem('confetti', 500, scene);
      ps.particleTexture = confettiPlaatje;
      ps.emitter = plek.clone();
      ps.minEmitBox = new BABYLON.Vector3(-0.3, 0, -0.3);
      ps.maxEmitBox = new BABYLON.Vector3(0.3, 0, 0.3);
      ps.color1 = kleurA; ps.color2 = kleurB;
      ps.colorDead = new BABYLON.Color4(0, 0, 0, 0);
      ps.minSize = 0.1; ps.maxSize = 0.35;
      ps.minLifeTime = 1; ps.maxLifeTime = 2;
      ps.direction1 = new BABYLON.Vector3(-4, 10, -4);
      ps.direction2 = new BABYLON.Vector3(4, 16, 4);
      ps.minEmitPower = 0.6; ps.maxEmitPower = 1.2;
      ps.gravity = new BABYLON.Vector3(0, -12, 0);
      ps.minAngularSpeed = -6; ps.maxAngularSpeed = 6;
      ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ADD;
      ps.manualEmitCount = 400;
      ps.targetStopDuration = 0.3;
      ps.disposeOnStop = true;
      ps.start();
    }

    function startFeest() {
      const plek = gat.getAbsolutePosition();
      const kleur = (r, g, b) => new BABYLON.Color4(r, g, b, 1);
      confettiKnal(plek, kleur(1, 0.3, 0.3), kleur(1, 0.9, 0.2));
      setTimeout(() => confettiKnal(plek, kleur(0.3, 1, 0.5), kleur(0.3, 0.7, 1)), 350);
      setTimeout(() => confettiKnal(plek, kleur(1, 0.4, 1), kleur(1, 1, 1)), 700);
      straal.position.set(plek.x, plek.y + 15, plek.z);
      straal.setEnabled(true);
      meldingTekst.classList.remove('feest');
      void meldingTekst.offsetWidth;   // animatie opnieuw laten beginnen
      meldingTekst.classList.add('feest');
    }

    // ---------- Arcadegeluidjes, gemaakt met piepjes ----------
    let geluid = null;
    function piep(tonen, duur = 0.08, soort = 'square', glijNaar = null) {
      try {
        geluid = geluid || new AudioContext();
        let t = geluid.currentTime;
        for (const toon of tonen) {
          const osc = geluid.createOscillator(), vol = geluid.createGain();
          osc.type = soort;
          osc.frequency.setValueAtTime(toon, t);
          if (glijNaar) osc.frequency.exponentialRampToValueAtTime(glijNaar, t + duur);
          vol.gain.setValueAtTime(0.12, t);
          vol.gain.exponentialRampToValueAtTime(0.001, t + duur);
          osc.connect(vol).connect(geluid.destination);
          osc.start(t); osc.stop(t + duur);
          t += duur;
        }
      } catch (e) {}
    }
    const GELUID = {
      start: () => piep([523, 659, 784, 1047], 0.09),
      raak: () => piep([523, 659, 784, 1047, 784, 1047, 1319], 0.07),
      fout: () => piep([700], 0.6, 'sawtooth', 80),
      gameOver: () => piep([392, 330, 262, 196], 0.3, 'triangle'),
    };

    // ---------- Start, levens en game over ----------
    function startSpel() {
      level = 1; score = 0; levens = 3;
      titel.style.display = 'none';
      uitleg.textContent = 'PIJLTJES / WASD / SLEEP MET JE VINGER';
      meldingTekst.classList.remove('knipper');
      bouwLevel();
      nieuweBal();
      GELUID.start();
    }

    function toonStartScherm(tekst) {
      meldingTekst.textContent = tekst;
      meldingTekst.classList.remove('feest');
      meldingTekst.classList.add('knipper');
    }

    // Leven kwijt; zijn ze op, dan game over
    function levenKwijt() {
      levens--;
      toonInfo();
      GELUID.fout();
    }

    function probeerStart() {
      if ((toestand === 'start' || toestand === 'gameover') && performance.now() > wachtOpStart) startSpel();
    }
    window.addEventListener('keydown', probeerStart);
    canvas.addEventListener('pointerdown', probeerStart);

    // Toetsen
    const toetsen = {};
    window.addEventListener('keydown', e => { toetsen[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
    window.addEventListener('keyup', e => { toetsen[e.key.toLowerCase()] = false; });

    // Touchscreen (of muis): sleep vanaf waar je drukt, de tafel kantelt die kant op
    const SLEEP_AFSTAND = 110;   // zo ver slepen is helemaal schuin
    let vinger = null;           // { startX, startY, x, y } zolang je drukt
    canvas.addEventListener('pointerdown', e => {
      vinger = { startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => { if (vinger) { vinger.x = e.clientX; vinger.y = e.clientY; } });
    for (const naam of ['pointerup', 'pointercancel']) canvas.addEventListener(naam, () => { vinger = null; });

    function update(dt) {
      // Tafel kantelen; los je de toets, dan gaat hij langzaam terug naar plat
      const links = toetsen['arrowleft'] || toetsen['a'];
      const rechts = toetsen['arrowright'] || toetsen['d'];
      const op = toetsen['arrowup'] || toetsen['w'];
      const neer = toetsen['arrowdown'] || toetsen['s'];
      if (links) kantelZ += KANTEL_SNELHEID * dt;
      else if (rechts) kantelZ -= KANTEL_SNELHEID * dt;
      else kantelZ *= Math.pow(0.1, dt);
      if (op) kantelX += KANTEL_SNELHEID * dt;
      else if (neer) kantelX -= KANTEL_SNELHEID * dt;
      else kantelX *= Math.pow(0.1, dt);
      if (vinger) {
        // naar rechts slepen = bal naar rechts, omhoog slepen = bal naar achteren
        const doelZ = -BABYLON.Scalar.Clamp((vinger.x - vinger.startX) / SLEEP_AFSTAND, -1, 1) * maxKantel;
        const doelX = -BABYLON.Scalar.Clamp((vinger.y - vinger.startY) / SLEEP_AFSTAND, -1, 1) * maxKantel;
        const f = Math.min(1, 12 * dt);
        kantelZ += (doelZ - kantelZ) * f;
        kantelX += (doelX - kantelX) * f;
      }
      if (toestand === 'start' || toestand === 'gameover') {
        // in het startscherm wiebelt de tafel zachtjes
        const t = performance.now() / 1000;
        kantelX = Math.sin(t * 0.9) * 0.12;
        kantelZ = Math.cos(t * 0.7) * 0.12;
      }
      kantelX = BABYLON.Scalar.Clamp(kantelX, -maxKantel, maxKantel);
      kantelZ = BABYLON.Scalar.Clamp(kantelZ, -maxKantel, maxKantel);
      // de natuurkunde draait de tafel mee, zodat hij echt tegen de bal duwt
      // tijdens het feest wordt de tafel vlak en draait hij een rondje
      let draai = 0;
      if (toestand === 'inGat') {
        const t = 1 - wachttijd / FEEST_DUUR;
        draai = t * t * (3 - 2 * t) * Math.PI * 2;
        kantelX *= Math.pow(0.02, dt);
        kantelZ *= Math.pow(0.02, dt);
        straalMat.alpha = 0.5 * Math.sin(Math.min(1, t * 1.3) * Math.PI);   // lichtstraal komt op en vervaagt
      }
      const tafelStand = BABYLON.Quaternion.FromEulerAngles(kantelX, draai, kantelZ);
      tafelFysica.setTargetTransform(BABYLON.Vector3.Zero(), tafelStand);
      tafel.rotationQuaternion.copyFrom(tafelStand);

      if (toestand === 'rollen') {
        // waar ligt de bal, bekeken vanaf de tafel?
        const terug = tafel.computeWorldMatrix(true).clone().invert();
        const plek = BABYLON.Vector3.TransformCoordinates(speler.getAbsolutePosition(), terug);
        const opTafel = plek.y < 1;
        const raakt = (x, z, straal) => opTafel && Math.hypot(plek.x - x, plek.z - z) < straal - 0.15;
        const valgat = valgaten.find(v => raakt(v.x, v.z, VALGAT_STRAAL));

        if (raakt(gat.position.x, gat.position.z, gatStraal)) {
          toestand = 'inGat';
          doelGat = gat.position;
          wachttijd = FEEST_DUUR;
          // punten: meer voor hogere levels, en een bonus als je snel was
          const seconden = (performance.now() - levelStart) / 1000;
          const punten = 500 * level + Math.max(0, Math.round(30 - seconden)) * 50;
          score += punten;
          if (score > hiScore) { hiScore = score; try { localStorage.setItem('tafeltoller-hi', hiScore); } catch (e) {} }
          toonInfo();
          meldingTekst.innerHTML = 'LEVEL CLEAR!<br>+' + punten;
          startFeest();
          GELUID.raak();
        } else if (valgat) {
          // in een valgat: dit level opnieuw
          toestand = 'inValgat';
          doelGat = valgat;
          wachttijd = 1.5;
          levenKwijt();
          meldingTekst.textContent = 'FOUT GAT!';
        } else if (speler.getAbsolutePosition().y < -2) {
          // van de tafel af: de natuurkunde laat hem verder vallen en stuiteren
          toestand = 'vallen';
          wachttijd = 2;
          levenKwijt();
          meldingTekst.textContent = 'OEPS!';
        }
        if (toestand === 'inGat' || toestand === 'inValgat') {
          // natuurkunde uit, vastmaken aan de tafel en zelf in het gat laten zakken
          stopSpelerFysica();
          speler.setParent(tafel);
        }
      } else if (toestand === 'inGat' || toestand === 'inValgat') {
        // bal glijdt naar het midden van het gat en zakt naar beneden
        const f = Math.min(1, 10 * dt);
        speler.position.x += (doelGat.x - speler.position.x) * f;
        speler.position.z += (doelGat.z - speler.position.z) * f;
        speler.position.y -= 3 * dt;
        wachttijd -= dt;
        if (wachttijd <= 0) {
          if (toestand === 'inGat') { level++; bouwLevel(); nieuweBal(); }
          else volgendeBalOfGameOver();
        }
      } else if (toestand === 'vallen') {
        wachttijd -= dt;
        if (wachttijd <= 0) volgendeBalOfGameOver();
      }
    }

    function volgendeBalOfGameOver() {
      if (levens > 0) { nieuweBal(); return; }
      toestand = 'gameover';
      wachtOpStart = performance.now() + 1200;
      stopSpelerFysica();
      speler.setEnabled(false);
      toonStartScherm('GAME OVER');
      uitleg.textContent = 'DRUK OP EEN TOETS OF TIK OM OPNIEUW TE BEGINNEN';
      GELUID.gameOver();
    }

    // Eerst de natuurkunde laden, dan pas beginnen
    HavokPhysics().then(havok => {
      scene.enablePhysics(new BABYLON.Vector3(0, -ZWAARTEKRACHT, 0), new BABYLON.HavokPlugin(true, havok));
      maakNatuurkunde();
      bouwLevel();
      // startscherm: nog geen bal, de tafel wiebelt zachtjes
      toestand = 'start';
      bal.isVisible = false;
      toonStartScherm('PRESS START');
      uitleg.textContent = 'DRUK OP EEN TOETS OF TIK OM TE BEGINNEN';
      scene.onBeforeRenderObservable.add(() => update(Math.min(engine.getDeltaTime() / 1000, 0.05)));
      engine.runRenderLoop(() => scene.render());
    });
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
