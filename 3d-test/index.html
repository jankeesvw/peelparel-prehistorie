<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3d-test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #111; font-family: sans-serif; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #info { position: fixed; top: 16px; left: 16px; font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
    #melding { position: fixed; top: 40%; width: 100%; text-align: center; font-size: 56px; font-weight: bold; color: #fff; text-shadow: 0 3px 8px rgba(0,0,0,.7); pointer-events: none; }
    #uitleg { pointer-events: none; position: fixed; bottom: 16px; width: 100%; text-align: center; font-size: 18px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="info">Level 1 &nbsp; Gevallen: 0</div>
  <div id="melding"></div>
  <div id="uitleg">Kantel de tafel met de pijltjes, W A S D of sleep met je vinger</div>
  <script>
    // Babylon.js: echte 3D met glimmende materialen, zachte schaduwen en gloed.
    // Havok doet de natuurkunde: de bal en de dobbelsteen rollen, botsen en vallen echt.
    const canvas = document.getElementById('game');
    const infoTekst = document.getElementById('info');
    const meldingTekst = document.getElementById('melding');

    // Instellingen
    const TAFEL_HALF = 5;        // tafel is 10 bij 10
    const TAFEL_DIKTE = 0.5;
    const BAL_STRAAL = 0.4;
    const GAT_STRAAL = 0.65;
    const MAX_KANTEL = 0.3;      // hoe schuin de tafel maximaal mag (radialen)
    const KANTEL_SNELHEID = 1.2;
    const ZWAARTEKRACHT = 20;
    const WRIJVING = 0.6;
    const GROND_Y = -12;

    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    window.addEventListener('resize', () => engine.resize());

    // Camera kijkt schuin van voren op de tafel (niet zelf te draaien)
    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2, 0.8, 19, new BABYLON.Vector3(0, -0.5, 0), scene);
    camera.fov = 0.8;

    // Omgeving: lucht en weerspiegelingen
    const omgeving = BABYLON.CubeTexture.CreateFromPrefilteredData('https://assets.babylonjs.com/environments/environmentSpecular.env', scene);
    scene.environmentTexture = omgeving;
    scene.environmentIntensity = 0.9;
    const standaardLucht = scene.createDefaultSkybox(omgeving, true, 600, 0.25);

    // Tweede lucht waarvan we het plaatje per thema wisselen
    const LUCHTEN = 'https://playground.babylonjs.com/textures/';
    const luchtCache = {};
    function luchtPlaatje(naam) {
      if (!luchtCache[naam]) {
        luchtCache[naam] = naam === 'Space/space'
          ? new BABYLON.CubeTexture(LUCHTEN + naam, scene, ['_right.jpg', '_up.jpg', '_front.jpg', '_left.jpg', '_down.jpg', '_back.jpg'])
          : new BABYLON.CubeTexture(LUCHTEN + naam, scene);
        luchtCache[naam].coordinatesMode = BABYLON.Texture.SKYBOX_MODE;
      }
      return luchtCache[naam];
    }
    const themaLucht = BABYLON.MeshBuilder.CreateBox('themaLucht', { size: 600 }, scene);
    themaLucht.infiniteDistance = true;
    const themaLuchtMat = new BABYLON.StandardMaterial('themaLuchtMat', scene);
    themaLuchtMat.backFaceCulling = false;
    themaLuchtMat.disableLighting = true;
    themaLuchtMat.diffuseColor = BABYLON.Color3.Black();
    themaLuchtMat.specularColor = BABYLON.Color3.Black();
    themaLucht.material = themaLuchtMat;
    themaLucht.setEnabled(false);

    // Zon met zachte schaduwen
    const zon = new BABYLON.DirectionalLight('zon', new BABYLON.Vector3(-0.4, -1, 0.35), scene);
    zon.position = new BABYLON.Vector3(8, 25, -8);
    zon.intensity = 2.5;
    const schaduw = new BABYLON.ShadowGenerator(2048, zon);
    schaduw.usePercentageCloserFiltering = true;
    schaduw.filteringQuality = BABYLON.ShadowGenerator.QUALITY_HIGH;
    schaduw.bias = 0.0005;

    // Gras ver onder de tafel
    const grond = BABYLON.MeshBuilder.CreateGround('grond', { width: 300, height: 300 }, scene);
    grond.position.y = GROND_Y;
    const grasMat = new BABYLON.PBRMaterial('gras', scene);
    grasMat.albedoTexture = new BABYLON.Texture('https://assets.babylonjs.com/textures/grass.png', scene);
    grasMat.albedoTexture.uScale = grasMat.albedoTexture.vScale = 40;
    grasMat.metallic = 0; grasMat.roughness = 1;
    grond.material = grasMat;
    grond.receiveShadows = true;

    // De tafel: alles wat eraan vastzit kantelt mee
    const tafel = new BABYLON.TransformNode('tafel', scene);
    tafel.rotationQuaternion = BABYLON.Quaternion.Identity();
    const blad = BABYLON.MeshBuilder.CreateBox('blad', { width: TAFEL_HALF * 2, depth: TAFEL_HALF * 2, height: TAFEL_DIKTE }, scene);
    blad.parent = tafel;
    blad.position.y = -TAFEL_DIKTE / 2;
    const houtMat = new BABYLON.PBRMaterial('hout', scene);
    houtMat.albedoTexture = new BABYLON.Texture('https://assets.babylonjs.com/textures/wood.jpg', scene);
    houtMat.metallic = 0; houtMat.roughness = 0.35;
    houtMat.clearCoat.isEnabled = true;     // gelakt hout dat een beetje glanst
    houtMat.clearCoat.intensity = 0.6;
    blad.material = houtMat;
    blad.receiveShadows = true;
    schaduw.addShadowCaster(blad);

    // Het gat: zwarte schijf met een gloeiende gouden ring eromheen
    const gat = BABYLON.MeshBuilder.CreateDisc('gat', { radius: GAT_STRAAL, tessellation: 48 }, scene);
    gat.parent = tafel;
    gat.rotation.x = Math.PI / 2;
    gat.position.y = 0.005;
    const zwart = new BABYLON.StandardMaterial('zwart', scene);
    zwart.diffuseColor = BABYLON.Color3.Black(); zwart.specularColor = BABYLON.Color3.Black(); zwart.disableLighting = true;
    gat.material = zwart;
    const ring = BABYLON.MeshBuilder.CreateTorus('ring', { diameter: GAT_STRAAL * 2 + 0.08, thickness: 0.08, tessellation: 48 }, scene);
    ring.parent = tafel;
    const ringMat = new BABYLON.PBRMaterial('ringMat', scene);
    ringMat.albedoColor = new BABYLON.Color3(1, 0.75, 0.2);
    ringMat.emissiveColor = new BABYLON.Color3(1, 0.6, 0.1);
    ringMat.metallic = 1; ringMat.roughness = 0.2;
    ring.material = ringMat;

    // De bal: een glanzende biljartbal met een streep en een 9, zodat je ziet dat hij rolt
    const bal = BABYLON.MeshBuilder.CreateSphere('bal', { diameter: BAL_STRAAL * 2, segments: 48 }, scene);
    bal.rotationQuaternion = BABYLON.Quaternion.Identity();
    const balPlaatje = new BABYLON.DynamicTexture('balPlaatje', { width: 1024, height: 512 }, scene);
    const bctx = balPlaatje.getContext();
    bctx.fillStyle = '#f4f1e8'; bctx.fillRect(0, 0, 1024, 512);
    bctx.fillStyle = '#f2a900'; bctx.fillRect(0, 150, 1024, 212);   // gele streep rondom
    for (const x of [256, 768]) {                                     // twee witte rondjes met een 9
      bctx.fillStyle = '#f4f1e8';
      bctx.beginPath(); bctx.ellipse(x, 256, 80, 90, 0, 0, Math.PI * 2); bctx.fill();
      bctx.fillStyle = '#111'; bctx.font = 'bold 120px sans-serif';
      bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
      bctx.fillText('9', x, 262);
    }
    balPlaatje.update();
    const balMat = new BABYLON.PBRMaterial('balMat', scene);
    balMat.albedoTexture = balPlaatje;
    balMat.metallic = 0; balMat.roughness = 0.15;
    balMat.clearCoat.isEnabled = true;   // laagje lak dat de lucht weerspiegelt
    bal.material = balMat;
    schaduw.addShadowCaster(bal);

    // De D20: een dobbelsteen met twintig kanten, met de getallen 1 tot en met 20.
    // Hij heeft zijn eigen natuurkunde, dus hij kantelt echt van vlak naar vlak.
    const d20Plaatje = new BABYLON.DynamicTexture('d20Plaatje', { width: 1280, height: 1024 }, scene);
    const dctx = d20Plaatje.getContext();
    dctx.fillStyle = '#5b2a86'; dctx.fillRect(0, 0, 1280, 1024);
    dctx.fillStyle = '#ffd54f'; dctx.font = 'bold 70px sans-serif';
    dctx.textAlign = 'center'; dctx.textBaseline = 'middle';
    const d20Vlakken = [];
    for (let i = 0; i < 20; i++) {
      const kolom = i % 5, rij = Math.floor(i / 5);
      d20Vlakken.push(new BABYLON.Vector4(kolom / 5, rij / 4, (kolom + 1) / 5, (rij + 1) / 4));
      const x = kolom * 256 + 128, y = (3 - rij) * 256 + 128;
      dctx.fillText(String(i + 1), x, y + 6);
      if (i + 1 === 6 || i + 1 === 9) dctx.fillRect(x - 18, y + 42, 36, 6);   // streepje onder 6 en 9
    }
    d20Plaatje.update();
    const d20 = BABYLON.MeshBuilder.CreatePolyhedron('d20', { type: 3, size: BAL_STRAAL * 1.15, faceUV: d20Vlakken }, scene);
    const d20Mat = new BABYLON.PBRMaterial('d20Mat', scene);
    d20Mat.albedoTexture = d20Plaatje;
    d20Mat.metallic = 0; d20Mat.roughness = 0.2;
    d20Mat.clearCoat.isEnabled = true;
    d20.material = d20Mat;
    d20.receiveShadows = true;
    schaduw.addShadowCaster(d20);
    d20.setEnabled(false);

    // Mooie nabewerking: gloed, zachte randen, kleurcorrectie
    const gloed = new BABYLON.GlowLayer('gloed', scene);
    gloed.intensity = 0.8;
    const beeld = new BABYLON.DefaultRenderingPipeline('beeld', true, scene, [camera]);
    beeld.samples = 4;
    beeld.fxaaEnabled = true;
    beeld.bloomEnabled = true;
    beeld.bloomThreshold = 0.8;
    beeld.bloomWeight = 0.3;
    beeld.imageProcessing.toneMappingEnabled = true;
    beeld.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
    beeld.imageProcessing.vignetteEnabled = true;
    beeld.imageProcessing.vignetteWeight = 1.5;

    // Materiaal voor de blokken die in de weg liggen
    const blokMat = new BABYLON.PBRMaterial('blokMat', scene);
    blokMat.albedoColor = new BABYLON.Color3(0.55, 0.12, 0.1);
    blokMat.metallic = 0.2; blokMat.roughness = 0.3;
    blokMat.clearCoat.isEnabled = true;

    // ---------- Thema's: elk level een andere tafel, bal en blokken ----------

    const TEXTUREN = 'https://assets.babylonjs.com/textures/';
    const textuurCache = {};
    function textuur(naam, herhaal = 1) {
      const sleutel = naam + herhaal;
      if (!textuurCache[sleutel]) {
        const t = new BABYLON.Texture(TEXTUREN + naam, scene);
        t.uScale = t.vScale = herhaal;
        textuurCache[sleutel] = t;
      }
      return textuurCache[sleutel];
    }

    // Een materiaal opnieuw instellen: plaatje of kleur, glimmend of mat
    function stelIn(mat, o) {
      mat.albedoTexture = o.plaatje || null;
      mat.albedoColor = o.kleur ? BABYLON.Color3.FromHexString(o.kleur) : BABYLON.Color3.White();
      mat.metallic = o.metaal ?? 0;
      mat.roughness = o.ruw ?? 0.5;
      mat.clearCoat.isEnabled = !!o.lak;
      mat.emissiveTexture = o.gloei ? o.plaatje : null;
      mat.emissiveColor = o.gloei ? new BABYLON.Color3(0.7, 0.35, 0.1) : BABYLON.Color3.Black();
    }

    // Het patroon op de bal tekenen (plaatje rond de bal gewikkeld)
    function tekenBalPatroon(ontwerp) {
      const c = bctx, B = 1024, H = 512;
      c.fillStyle = ontwerp.basis; c.fillRect(0, 0, B, H);
      if (ontwerp.soort === 'biljart') {
        c.fillStyle = ontwerp.kleur; c.fillRect(0, 150, B, 212);
        for (const x of [256, 768]) {
          c.fillStyle = ontwerp.basis;
          c.beginPath(); c.ellipse(x, 256, 80, 90, 0, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#111'; c.font = 'bold 120px sans-serif';
          c.textAlign = 'center'; c.textBaseline = 'middle';
          c.fillText(ontwerp.nummer, x, 262);
        }
      } else if (ontwerp.soort === 'stippen') {
        c.fillStyle = ontwerp.kleur;
        for (let rij = 0; rij < 5; rij++) for (let k = 0; k < 8; k++) {
          c.beginPath(); c.arc(k * 128 + (rij % 2) * 64 + 32, rij * 110 + 40, 30, 0, Math.PI * 2); c.fill();
        }
      } else if (ontwerp.soort === 'strandbal') {
        ontwerp.kleuren.forEach((k, i) => { c.fillStyle = k; c.fillRect(i * B / ontwerp.kleuren.length, 0, B / ontwerp.kleuren.length + 1, H); });
        c.fillStyle = '#fff'; c.fillRect(0, 0, B, 50); c.fillRect(0, H - 50, B, 50);
      } else if (ontwerp.soort === 'voetbal') {
        c.fillStyle = '#111';
        for (let rij = 0; rij < 4; rij++) for (let k = 0; k < 6; k++) {
          const x = k * 171 + (rij % 2) * 85 + 40, y = rij * 140 + 50;
          c.beginPath();
          for (let h = 0; h < 5; h++) c.lineTo(x + Math.cos(h * 1.2566 - 1.57) * 45, y + Math.sin(h * 1.2566 - 1.57) * 45);
          c.fill();
        }
      } else if (ontwerp.soort === 'lijnen') {
        c.strokeStyle = ontwerp.kleur; c.lineWidth = 18;
        for (let x = 0; x < B; x += 128) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
        c.beginPath(); c.moveTo(0, H / 2); c.lineTo(B, H / 2); c.stroke();
      }
      balPlaatje.update();
    }

    const THEMAS = [
      { naam: 'Biljart',   tafel: { hout: 'wood.jpg', ruw: 0.35, lak: true },
        bal: { ontwerp: { soort: 'biljart', basis: '#f4f1e8', kleur: '#f2a900', nummer: '9' }, ruw: 0.15, lak: true },
        achtergrond: { grond: { hout: 'grass.png', ruw: 1 } },
        blok: { kleur: '#8c1f19', ruw: 0.3, lak: true } },
      { naam: 'Dobbelsteen', tafel: { kleur: '#1b5e20', ruw: 1 },
        bal: { d20: true },
        achtergrond: { lucht: 'skybox2', grond: { kleur: '#1a1a22', ruw: 0.4, lak: true } },
        blok: { kleur: '#ffffff', ruw: 0.2, lak: true } },
      { naam: 'Woestijn',  tafel: { hout: 'sand.jpg', herhaal: 2, ruw: 1 },
        bal: { ontwerp: { soort: 'stippen', basis: '#c62828', kleur: '#ffffff' }, ruw: 0.9 },
        achtergrond: { grond: { hout: 'sand.jpg', herhaal: 30, ruw: 1 } },
        blok: { hout: 'rock.png', ruw: 0.9 } },
      { naam: 'Ruimteschip', tafel: { hout: 'floor.png', herhaal: 2, metaal: 0.9, ruw: 0.25 },
        bal: { ontwerp: { soort: 'lijnen', basis: '#d8dce0', kleur: '#30343a' }, metaal: 1, ruw: 0.05 },
        achtergrond: { lucht: 'Space/space', grond: 'geen' },
        blok: { kleur: '#ffc83d', metaal: 1, ruw: 0.15 } },
      { naam: 'Vulkaan',   tafel: { hout: 'lava/lavatile.jpg', herhaal: 2, ruw: 0.6, gloei: true },
        bal: { ontwerp: { soort: 'stippen', basis: '#151515', kleur: '#ff7a00' }, ruw: 0.1, lak: true },
        achtergrond: { lucht: 'skybox3', grond: { hout: 'lava/lavatile.jpg', herhaal: 30, ruw: 0.7, gloei: true } },
        blok: { hout: 'rock.png', kleur: '#555555', ruw: 0.8 } },
      { naam: 'Voetbal',   tafel: { hout: 'grass.jpg', herhaal: 2, ruw: 1 },
        bal: { ontwerp: { soort: 'voetbal', basis: '#ffffff' }, ruw: 0.5 },
        achtergrond: { lucht: 'skybox', grond: { hout: 'grass.jpg', herhaal: 40, ruw: 1 } },
        blok: { hout: 'crate.png', ruw: 0.8 } },
      { naam: 'Strand',    tafel: { hout: 'bricktile.jpg', herhaal: 2, ruw: 0.7 },
        bal: { ontwerp: { soort: 'strandbal', basis: '#ffffff', kleuren: ['#e53935', '#ffffff', '#1e88e5', '#ffffff', '#fdd835', '#ffffff'] }, ruw: 0.2, lak: true },
        achtergrond: { lucht: 'TropicalSunnyDay', grond: { hout: 'sand.jpg', herhaal: 30, ruw: 1 } },
        blok: { kleur: '#ff8a65', ruw: 0.6 } },
      { naam: 'Retro',     tafel: { hout: 'ground.jpg', herhaal: 2, ruw: 0.9 },
        bal: { plaatje: 'amiga.jpg', ruw: 0.3, lak: true },
        achtergrond: { lucht: 'skybox4', grond: { kleur: '#e8eef4', ruw: 0.8 } },
        blok: { kleur: '#3949ab', ruw: 0.2, metaal: 0.5 } },
    ];

    let thema = THEMAS[0];
    function zetThema() {
      thema = THEMAS[(level - 1) % THEMAS.length];
      const t = thema.tafel;
      stelIn(houtMat, { ...t, plaatje: t.hout ? textuur(t.hout, t.herhaal) : null });
      // Achtergrond: lucht en grond
      const a = thema.achtergrond;
      standaardLucht.setEnabled(!a.lucht);
      themaLucht.setEnabled(!!a.lucht);
      if (a.lucht) themaLuchtMat.reflectionTexture = luchtPlaatje(a.lucht);
      grond.isVisible = a.grond !== 'geen';   // onzichtbaar, maar de bal stuitert er nog wel op
      if (a.grond && a.grond !== 'geen') {
        stelIn(grasMat, { ...a.grond, plaatje: a.grond.hout ? textuur(a.grond.hout, a.grond.herhaal || 40) : null });
      }

      const b = thema.bal;
      maxKantel = b.d20 ? 0.45 : MAX_KANTEL;   // een D20 heeft een schuinere tafel nodig om om te rollen
      bal.isVisible = !b.d20;           // bij de D20 is de bal zelf onzichtbaar
      d20.setEnabled(!!b.d20);
      if (b.ontwerp) tekenBalPatroon(b.ontwerp);
      stelIn(balMat, { ...b, plaatje: b.plaatje ? textuur(b.plaatje) : balPlaatje });
      const k = thema.blok;
      stelIn(blokMat, { ...k, plaatje: k.hout ? textuur(k.hout) : null });
    }

    // Spelstatus
    let toestand = 'rollen';   // 'rollen', 'inGat', 'inValgat' of 'vallen'
    let speler = bal;             // wat er nu rolt: de bal of de D20
    let spelerFysica = null;      // de natuurkunde van de speler
    let tafelFysica, grondFysica;
    let maxKantel = MAX_KANTEL;
    let wachttijd = 0;
    let level = 1, gevallen = 0;
    let kantelX = 0, kantelZ = 0;
    let tafelHalf = TAFEL_HALF;   // wordt kleiner per level
    let gatStraal = GAT_STRAAL;   // wordt kleiner per level
    let blokken = [];             // { mesh, x, z, halfB, halfD } op de tafel
    let valgaten = [];            // { schijf, rand, x, z } nep-gaten: daar wil je niet in
    let wrijving = WRIJVING;      // wordt minder per level, dus gladder
    let doelGat = gat.position;   // het gat waar de bal nu in zakt
    const VALGAT_STRAAL = 0.6;

    // Valgaten hebben een rood gloeiende rand
    const valRandMat = new BABYLON.PBRMaterial('valRandMat', scene);
    valRandMat.albedoColor = new BABYLON.Color3(1, 0.1, 0.05);
    valRandMat.emissiveColor = new BABYLON.Color3(1, 0.05, 0.02);
    valRandMat.metallic = 1; valRandMat.roughness = 0.2;

    function toonInfo() {
      infoTekst.innerHTML = `Level ${level}: ${thema.naam} &nbsp; Gevallen: ${gevallen}`;
    }

    function zetGatNeer() {
      // gat ergens op de tafel, niet te dicht bij het begin van de bal
      const marge = tafelHalf - 0.9;
      do {
        gat.position.x = (Math.random() * 2 - 1) * marge;
        gat.position.z = (Math.random() * 2 - 1) * marge;
      } while (Math.hypot(gat.position.x, gat.position.z) < tafelHalf * 0.7);
      ring.position.set(gat.position.x, 0, gat.position.z);
    }

    // Elk level moeilijker: kleinere tafel, kleiner gat, gladder, meer blokken en valgaten
    function bouwLevel() {
      tafelHalf = Math.max(2.8, TAFEL_HALF - (level - 1) * 0.3);
      gatStraal = Math.max(0.48, GAT_STRAAL + 0.1 - (level - 1) * 0.05);
      wrijving = Math.max(0.12, WRIJVING - (level - 1) * 0.06);
      zetThema();
      blad.scaling.x = blad.scaling.z = tafelHalf / TAFEL_HALF;
      gat.scaling.x = gat.scaling.y = gatStraal / GAT_STRAAL;
      ring.scaling.x = ring.scaling.z = gatStraal / GAT_STRAAL;
      zetGatNeer();

      // oude valgaten weg, nieuwe neerzetten (vanaf level 2, steeds één meer)
      for (const v of valgaten) { v.schijf.dispose(); v.rand.dispose(); }
      valgaten = [];
      const aantalValgaten = Math.min(8, level - 1);
      for (let i = 0; i < aantalValgaten; i++) {
        for (let poging = 0; poging < 100; poging++) {
          const x = (Math.random() * 2 - 1) * (tafelHalf - 0.8);
          const z = (Math.random() * 2 - 1) * (tafelHalf - 0.8);
          if (Math.hypot(x, z) < 1.4) continue;                                           // niet op de startplek
          if (Math.hypot(x - gat.position.x, z - gat.position.z) < gatStraal + 1.5) continue;  // niet vlak naast het echte gat
          if (!valgaten.every(v => Math.hypot(x - v.x, z - v.z) > 1.8)) continue;
          const schijf = gat.clone('valgat');
          schijf.parent = tafel;
          schijf.scaling.set(VALGAT_STRAAL / GAT_STRAAL, VALGAT_STRAAL / GAT_STRAAL, 1);
          schijf.position.set(x, 0.005, z);
          const rand = ring.clone('valrand');
          rand.parent = tafel;
          rand.material = valRandMat;
          rand.scaling.set(VALGAT_STRAAL / GAT_STRAAL, 1, VALGAT_STRAAL / GAT_STRAAL);
          rand.position.set(x, 0, z);
          valgaten.push({ schijf, rand, x, z });
          break;
        }
      }

      // oude blokken weg, nieuwe neerzetten (vanaf level 2)
      for (const b of blokken) { schaduw.removeShadowCaster(b.mesh); b.mesh.dispose(); }
      blokken = [];
      const aantal = Math.min(12, (level - 1) * 2);
      for (let i = 0; i < aantal; i++) {
        const liggend = Math.random() < 0.5;
        const halfB = liggend ? 0.9 : 0.25, halfD = liggend ? 0.25 : 0.9;
        for (let poging = 0; poging < 100; poging++) {
          const x = (Math.random() * 2 - 1) * (tafelHalf - halfB);
          const z = (Math.random() * 2 - 1) * (tafelHalf - halfD);
          const vrij = (px, pz, afstand) => Math.abs(x - px) > halfB + afstand || Math.abs(z - pz) > halfD + afstand;
          if (!vrij(0, 0, 1.2)) continue;                                        // niet op de startplek
          if (!vrij(gat.position.x, gat.position.z, gatStraal + 1)) continue;     // gat bereikbaar houden
          if (!valgaten.every(v => vrij(v.x, v.z, VALGAT_STRAAL + 0.6))) continue;
          if (!blokken.every(b => Math.abs(x - b.x) > halfB + b.halfB + 0.9 || Math.abs(z - b.z) > halfD + b.halfD + 0.9)) continue;
          const mesh = BABYLON.MeshBuilder.CreateBox('blok', { width: halfB * 2, depth: halfD * 2, height: 0.5 }, scene);
          mesh.parent = tafel;
          mesh.position.set(x, 0.25, z);
          mesh.material = blokMat;
          mesh.receiveShadows = true;
          schaduw.addShadowCaster(mesh);
          blokken.push({ mesh, x, z, halfB, halfD });
          break;
        }
      }
      maakTafelVorm();
      toonInfo();
    }

    // De vorm van de tafel voor de natuurkunde: het blad plus alle blokken
    function maakTafelVorm() {
      const vorm = new BABYLON.PhysicsShapeContainer(scene);
      const blok = (b, h, d) => new BABYLON.PhysicsShapeBox(BABYLON.Vector3.Zero(), BABYLON.Quaternion.Identity(), new BABYLON.Vector3(b, h, d), scene);
      vorm.addChild(blok(tafelHalf * 2, TAFEL_DIKTE, tafelHalf * 2), new BABYLON.Vector3(0, -TAFEL_DIKTE / 2, 0));
      for (const b of blokken) vorm.addChild(blok(b.halfB * 2, 0.5, b.halfD * 2), new BABYLON.Vector3(b.x, 0.25, b.z));
      vorm.material = { friction: 0.8, restitution: 0.3 };
      const oud = tafelFysica.shape;
      tafelFysica.shape = vorm;
      if (oud) oud.dispose();
    }

    // Vaste dingen in de natuurkunde: de grond en de kantelende tafel
    function maakNatuurkunde() {
      grondFysica = new BABYLON.PhysicsBody(grond, BABYLON.PhysicsMotionType.STATIC, false, scene);
      grondFysica.shape = new BABYLON.PhysicsShapeBox(new BABYLON.Vector3(0, -0.5, 0), BABYLON.Quaternion.Identity(), new BABYLON.Vector3(300, 1, 300), scene);
      grondFysica.shape.material = { friction: 0.8, restitution: 0.4 };
      // de tafel bewegen wij zelf, de natuurkunde duwt alleen tegen de bal
      tafelFysica = new BABYLON.PhysicsBody(tafel, BABYLON.PhysicsMotionType.ANIMATED, false, scene);
    }

    function stopSpelerFysica() {
      if (spelerFysica) { spelerFysica.dispose(); spelerFysica = null; }
    }

    // Nieuwe bal (of D20) valt vanaf net boven het midden op de tafel
    function nieuweBal() {
      stopSpelerFysica();
      const isD20 = !!thema.bal.d20;
      speler = isD20 ? d20 : bal;
      speler.setParent(null);
      speler.position.set(0, 1.2, 0);
      speler.rotationQuaternion = isD20
        ? BABYLON.Quaternion.FromEulerAngles(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3)
        : BABYLON.Quaternion.Identity();
      spelerFysica = new BABYLON.PhysicsAggregate(speler,
        isD20 ? BABYLON.PhysicsShapeType.CONVEX_HULL : BABYLON.PhysicsShapeType.SPHERE,
        { mass: 1, friction: isD20 ? 1 : 0.8, restitution: isD20 ? 0.2 : 0.3 }, scene);
      // gladder per level: minder afremmen
      const rem = -Math.log(1 - wrijving);
      spelerFysica.body.setLinearDamping(rem * 0.3);
      spelerFysica.body.setAngularDamping(rem);
      spelerFysica.body.setSleepMode?.(false);   // nooit in slaap vallen, ook niet als hij stil ligt
      toestand = 'rollen';
      meldingTekst.textContent = '';
    }

    // Toetsen
    const toetsen = {};
    window.addEventListener('keydown', e => { toetsen[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
    window.addEventListener('keyup', e => { toetsen[e.key.toLowerCase()] = false; });

    // Touchscreen (of muis): sleep vanaf waar je drukt, de tafel kantelt die kant op
    const SLEEP_AFSTAND = 110;   // zo ver slepen is helemaal schuin
    let vinger = null;           // { startX, startY, x, y } zolang je drukt
    canvas.addEventListener('pointerdown', e => {
      vinger = { startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY };
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', e => { if (vinger) { vinger.x = e.clientX; vinger.y = e.clientY; } });
    for (const naam of ['pointerup', 'pointercancel']) canvas.addEventListener(naam, () => { vinger = null; });

    function update(dt) {
      // Tafel kantelen; los je de toets, dan gaat hij langzaam terug naar plat
      const links = toetsen['arrowleft'] || toetsen['a'];
      const rechts = toetsen['arrowright'] || toetsen['d'];
      const op = toetsen['arrowup'] || toetsen['w'];
      const neer = toetsen['arrowdown'] || toetsen['s'];
      if (links) kantelZ += KANTEL_SNELHEID * dt;
      else if (rechts) kantelZ -= KANTEL_SNELHEID * dt;
      else kantelZ *= Math.pow(0.1, dt);
      if (op) kantelX += KANTEL_SNELHEID * dt;
      else if (neer) kantelX -= KANTEL_SNELHEID * dt;
      else kantelX *= Math.pow(0.1, dt);
      if (vinger) {
        // naar rechts slepen = bal naar rechts, omhoog slepen = bal naar achteren
        const doelZ = -BABYLON.Scalar.Clamp((vinger.x - vinger.startX) / SLEEP_AFSTAND, -1, 1) * maxKantel;
        const doelX = -BABYLON.Scalar.Clamp((vinger.y - vinger.startY) / SLEEP_AFSTAND, -1, 1) * maxKantel;
        const f = Math.min(1, 12 * dt);
        kantelZ += (doelZ - kantelZ) * f;
        kantelX += (doelX - kantelX) * f;
      }
      kantelX = BABYLON.Scalar.Clamp(kantelX, -maxKantel, maxKantel);
      kantelZ = BABYLON.Scalar.Clamp(kantelZ, -maxKantel, maxKantel);
      // de natuurkunde draait de tafel mee, zodat hij echt tegen de bal duwt
      const tafelStand = BABYLON.Quaternion.FromEulerAngles(kantelX, 0, kantelZ);
      tafelFysica.setTargetTransform(BABYLON.Vector3.Zero(), tafelStand);
      tafel.rotationQuaternion.copyFrom(tafelStand);

      if (toestand === 'rollen') {
        // waar ligt de bal, bekeken vanaf de tafel?
        const terug = tafel.computeWorldMatrix(true).clone().invert();
        const plek = BABYLON.Vector3.TransformCoordinates(speler.getAbsolutePosition(), terug);
        const opTafel = plek.y < 1;
        const raakt = (x, z, straal) => opTafel && Math.hypot(plek.x - x, plek.z - z) < straal - 0.15;
        const valgat = valgaten.find(v => raakt(v.x, v.z, VALGAT_STRAAL));

        if (raakt(gat.position.x, gat.position.z, gatStraal)) {
          toestand = 'inGat';
          doelGat = gat.position;
          wachttijd = 1.5;
          meldingTekst.textContent = 'Raak! Op naar level ' + (level + 1);
        } else if (valgat) {
          // in een valgat: dit level opnieuw
          toestand = 'inValgat';
          doelGat = valgat;
          wachttijd = 1.5;
          gevallen++;
          toonInfo();
          meldingTekst.textContent = 'Fout gat!';
        } else if (speler.getAbsolutePosition().y < -2) {
          // van de tafel af: de natuurkunde laat hem verder vallen en stuiteren
          toestand = 'vallen';
          wachttijd = 2;
          gevallen++;
          toonInfo();
          meldingTekst.textContent = 'Eraf gevallen!';
        }
        if (toestand === 'inGat' || toestand === 'inValgat') {
          // natuurkunde uit, vastmaken aan de tafel en zelf in het gat laten zakken
          stopSpelerFysica();
          speler.setParent(tafel);
        }
      } else if (toestand === 'inGat' || toestand === 'inValgat') {
        // bal glijdt naar het midden van het gat en zakt naar beneden
        const f = Math.min(1, 10 * dt);
        speler.position.x += (doelGat.x - speler.position.x) * f;
        speler.position.z += (doelGat.z - speler.position.z) * f;
        speler.position.y -= 3 * dt;
        wachttijd -= dt;
        if (wachttijd <= 0) {
          if (toestand === 'inGat') { level++; bouwLevel(); }
          nieuweBal();
        }
      } else if (toestand === 'vallen') {
        wachttijd -= dt;
        if (wachttijd <= 0) nieuweBal();
      }
    }

    // Eerst de natuurkunde laden, dan pas beginnen
    HavokPhysics().then(havok => {
      scene.enablePhysics(new BABYLON.Vector3(0, -ZWAARTEKRACHT, 0), new BABYLON.HavokPlugin(true, havok));
      maakNatuurkunde();
      bouwLevel();
      nieuweBal();
      scene.onBeforeRenderObservable.add(() => update(Math.min(engine.getDeltaTime() / 1000, 0.05)));
      engine.runRenderLoop(() => scene.render());
    });
  </script>
  <script src="../livereload.js"></script>
</body>
</html>
